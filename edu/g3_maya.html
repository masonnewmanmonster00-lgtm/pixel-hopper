 if(m==='num'){let n;if(L.zero)n=pick([0,20,40,60,100,200,220,300,400,405,800,1000]);else n=ri(L.min||0,L.max||399);q.n=n;const d=places(n);q.vis=(x,y,s)=>numeral(n,x-55,y-s/2,110,s);q.text='What number is this?'+(d.length>1?' (bottom = ones, next = 20s'+(d.length>2?', top = 400s)':')'):'');const c=[n+1,n-1,n+5,n-5,n+20,n-20,d.length>1?d.reduce((a,b)=>a+b,0):n+10].filter(v=>v>=0&&v!==n);q.opts=mo(String(n),c.map(String));q.ans=String(n);q.why=d.length>1?d.map((v,i)=>v+' × '+20**(d.length-1-i)).join(' + ')+' = '+n+'.':Math.floor(n/5)+' bar'+(Math.floor(n/5)===1?'':'s')+' (×5) + '+n%5+' dot'+(n%5===1?'':'s')+' = '+n+'.'}
 else if(m==='build'){const mx=L.max||399;const t=ri(L.min||1,mx);q.t=t;q.cols=Array(mx>19?2:1).fill(0);q.text='Build the number '+t+' with dots, bars and shells.'}
 else if(m==='add'){const a=ri(3,250),b=ri(3,140),s=a+b;q.vis=(x,y,sz)=>{const h=Math.min(sz,H-70);numeral(a,x-120,y-h/2,80,h,places(s).length);txt('+',x,y,30,'#fff');numeral(b,x+40,y-h/2,80,h,places(s).length)};q.text='Add these Maya numbers. What is the total?';q.opts=mo(String(s),[s+1,s-1,s+20,s-20,s+5,s+19].filter(v=>v>0).map(String));q.ans=String(s);q.why=a+' + '+b+' = '+s+'. In Maya: '+places(s).join(' | ')+'.'}
 else if(m==='tz'){const num=ri(1,13),day=ri(0,19),k=pick([1,1,2,3,13,20]);const nn=(num-1+k)%13+1,nd=(day+k)%20;q.big='Today is  '+num+' '+DAYS[day];q.bigSz=24;q.text=k===1?'What is TOMORROW in the Tzolk\'in?':'What will it be in '+k+' days?';const ans=nn+' '+DAYS[nd];const c=[(nn%13+1)+' '+DAYS[nd],nn+' '+DAYS[(nd+1)%20],((num-1+k)%20+1)+' '+DAYS[nd],num+' '+DAYS[nd],nn+' '+DAYS[(nd+19)%20]];q.opts=mo(ans,c);q.ans=ans;q.why='Numbers go up by '+k+' (after 13 comes 1) and day names move on '+k+': '+num+' + '+k+' → '+nn+', '+DAYS[day]+' → '+DAYS[nd]+'.'}
 else if(m==='order')orderQ(q,L.list);
