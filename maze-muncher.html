<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b14">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Maze Muncher</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#070814;color:#fff;font-family:ui-monospace,monospace;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#pad{position:fixed;z-index:40;right:max(10px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px 54px;gap:4px}
.dir{border-radius:14px;border:2px solid rgba(255,225,77,.55);background:rgba(8,10,24,.55);color:#ffe14d;font:700 18px/1 ui-monospace,monospace;touch-action:none}
.dir.on{background:rgba(255,225,77,.35);color:#fff}
#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:3}#right{grid-column:3;grid-row:2}
#pauseBtn{position:fixed;z-index:40;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:46px;height:46px;border-radius:12px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);color:#fff;font:700 16px/1 ui-monospace,monospace;touch-action:none}
a.back{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:80;display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(8,8,16,.82);color:#ffe14d;border:1px solid rgba(255,225,77,.55);font:700 12px/1 ui-monospace,monospace;letter-spacing:.04em;text-decoration:none;touch-action:manipulation}
a.back:focus-visible{outline:2px solid #ffe14d;outline-offset:2px}
</style>
</head>
<body>
<a class="back" href="./index.html" aria-label="Back to menu" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">← Menu</a>
<canvas id="c"></canvas>
<div id="pad">
<div class="dir" id="up" aria-label="Up">▲</div>
<div class="dir" id="left" aria-label="Left">◀</div>
<div class="dir" id="right" aria-label="Right">▶</div>
<div class="dir" id="down" aria-label="Down">▼</div>
</div>
<div id="pauseBtn" aria-label="Pause">II</div>
<script>
"use strict";
const KEY="arcade-maze-best";
const DX={left:-1,right:1,up:0,down:0};
const DY={left:0,right:0,up:-1,down:1};
const OPP={left:"right",right:"left",up:"down",down:"up"};
const ANG={right:0,down:Math.PI/2,left:Math.PI,up:-Math.PI/2};
const THEMES=[
  {wall:"#2a3d8a",wall2:"#12183a",floor0:"#10162e",floor1:"#080b18",dot:"#ffe14d",power:"#7dfff0"},
  {wall:"#8a3050",wall2:"#2a101c",floor0:"#241018",floor1:"#12080e",dot:"#ffd0a8",power:"#fff"},
  {wall:"#1f6b58",wall2:"#0c2420",floor0:"#0c1c18",floor1:"#071210",dot:"#d8ffe8",power:"#ffe14d"}
];
const GHOST_COLS=["#ff5d8a","#ffb020","#49e0ff","#c58bff"];
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let W=800,H=450,DPR=1,TS=24,ox=0,oy=0,COLS=21,ROWS=13;
let state="title",score=0,best=0,level=1,lives=3,left=0,fright=0,calm=0,combo=0,clock=0,shake=0,banner="",deadT=0,wakaAt=0,wakaHi=false;
let tiles=[],player,ghosts=[],parts=[];
let lastDir=null;
const held={left:false,right:false,up:false,down:false};
try{best=+localStorage.getItem(KEY)||0}catch(e){}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.max(1,W*DPR)|0;cv.height=Math.max(1,H*DPR)|0;ctx.setTransform(DPR,0,0,DPR,0,0);layout()}
function layout(){
  const pad=188;
  const aw=Math.max(120,W-pad),ah=Math.max(120,H-8);
  TS=Math.max(8,Math.floor(Math.min(aw/COLS,ah/ROWS)));
  ox=Math.floor((W-pad-TS*COLS)/2)+8;
  oy=Math.floor((H-TS*ROWS)/2);
}
addEventListener("resize",resize);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function generate(lv){
  const C=10,R=6,rnd=mulberry32(900+lv*131);
  const hW=Array.from({length:R},()=>Array(C-1).fill(true));
  const vW=Array.from({length:R-1},()=>Array(C).fill(true));
  const seen=Array.from({length:R},()=>Array(C).fill(false));
  const stack=[[0,0]];seen[0][0]=true;
  while(stack.length){
    const [x,y]=stack[stack.length-1],opts=[];
    if(x>0&&!seen[y][x-1])opts.push([-1,0]);
    if(x<C-1&&!seen[y][x+1])opts.push([1,0]);
    if(y>0&&!seen[y-1][x])opts.push([0,-1]);
    if(y<R-1&&!seen[y+1][x])opts.push([0,1]);
    if(!opts.length){stack.pop();continue}
    const [dx,dy]=opts[rnd()*opts.length|0];
    if(dx===1)hW[y][x]=false;if(dx===-1)hW[y][x-1]=false;
    if(dy===1)vW[y][x]=false;if(dy===-1)vW[y-1][x]=false;
    seen[y+dy][x+dx]=true;stack.push([x+dx,y+dy]);
  }
  for(let i=0;i<10;i++){if(rnd()<0.5)hW[rnd()*R|0][rnd()*(C-1)|0]=false;else vW[rnd()*(R-1)|0][rnd()*C|0]=false}
  COLS=C*2+1;ROWS=R*2+1;
  tiles=Array.from({length:ROWS},()=>Array(COLS).fill("#"));
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){
    tiles[y*2+1][x*2+1]=".";
    if(x<C-1&&!hW[y][x])tiles[y*2+1][x*2+2]=".";
    if(y<R-1&&!vW[y][x])tiles[y*2+2][x*2+1]=".";
  }
  for(let y=2;y<=6;y++)for(let x=2;x<=6;x++)tiles[y][x]=".";
  tiles[1][1]=tiles[1][COLS-2]=tiles[ROWS-2][1]=tiles[ROWS-2][COLS-2]="O";
  tiles[4][4]=" ";
  const spots=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(tiles[y][x]!=="#"&&Math.hypot(x-4,y-4)>5)spots.push([x,y]);
  ghosts=[];
  const n=Math.min(4,2+lv);
  for(let i=0;i<n&&spots.length;i++){
    const k=Math.floor(mulberry32(50+lv*17+i)()*spots.length);
    const [x,y]=spots.splice(k,1)[0];
    ghosts.push({tx:x,ty:y,sx:x,sy:y,dir:"left",moving:false,t:0,mode:"chase",hx:x,hy:y,col:GHOST_COLS[i%4],px:0,py:0});
  }
  player={tx:4,ty:4,sx:4,sy:4,dir:null,moving:false,t:0,px:0,py:0,inv:1.4};
  left=0;for(const row of tiles)for(const ch of row)if(ch==="."||ch==="O")left++;
  calm=0.9;fright=0;combo=0;deadT=0;banner="LEVEL "+lv;layout();placeAll();
}
function openTile(x,y){return y>=0&&x>=0&&y<ROWS&&x<COLS&&tiles[y][x]!=="#"}
function placeAll(){
  const put=a=>{
    const x=a.moving?a.sx+(a.tx-a.sx)*a.t:a.tx;
    const y=a.moving?a.sy+(a.ty-a.sy)*a.t:a.ty;
    a.px=(x+0.5)*TS+ox;a.py=(y+0.5)*TS+oy;
  };
  if(player)put(player);
  for(const g of ghosts)put(g);
}
function updateActor(a,dt,speed,choose){
  let time=dt;
  for(let n=0;n<4&&time>0;n++){
    if(!a.moving){
      const want=choose(a);
      if(want&&openTile(a.tx+DX[want],a.ty+DY[want]))a.dir=want;
      if(!(a.dir&&openTile(a.tx+DX[a.dir],a.ty+DY[a.dir]))){a.dir=null;break}
      a.moving=true;a.t=0;a.sx=a.tx;a.sy=a.ty;a.tx+=DX[a.dir];a.ty+=DY[a.dir];
    }
    const need=(1-a.t)/speed;
    if(time>=need){time-=need;a.t=1;a.moving=false;a.sx=a.tx;a.sy=a.ty;if(a.onArrive)a.onArrive()}
    else{a.t+=time*speed;time=0}
  }
}
function dirsFrom(g){
  const opts=["left","right","up","down"].filter(d=>!(g.dir&&d===OPP[g.dir])&&openTile(g.tx+DX[d],g.ty+DY[d]));
  if(opts.length)return opts;
  return ["left","right","up","down"].filter(d=>openTile(g.tx+DX[d],g.ty+DY[d]));
}
function ghostChoose(g){
  const pool=dirsFrom(g);if(!pool.length)return null;
  if(g.mode==="fright")return pool[Math.random()*pool.length|0];
  const tx=g.mode==="eyes"?g.hx:player.tx,ty=g.mode==="eyes"?g.hy:player.ty;
  pool.sort((a,b)=>Math.hypot(g.tx+DX[a]-tx,g.ty+DY[a]-ty)-Math.hypot(g.tx+DX[b]-tx,g.ty+DY[b]-ty));
  if(g.mode==="chase"&&Math.random()<0.22)return pool[Math.random()*pool.length|0];
  return pool[0];
}
let AC=null,master=null;
function audio(){if(AC)return AC;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.2;master.connect(AC.destination)}catch(e){AC=null}return AC}
function tone(freq,dur,type,vol,slide){try{const a=audio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type||"square";o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);g.gain.setValueAtTime(vol||0.06,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02)}catch(e){}}
function noise(dur,vol){try{const a=audio();if(!a)return;const n=Math.max(1,a.sampleRate*dur|0),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain();s.buffer=buf;g.gain.value=vol||0.15;s.connect(g);g.connect(master);s.start()}catch(e){}}
function addScore(n){score+=n;if(score>best){best=score;try{localStorage.setItem(KEY,String(best))}catch(e){}}}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=30+Math.random()*70;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0.35+Math.random()*0.25,m:0.5,col,sz:1.5+Math.random()*2})}}
function eat(){
  const ch=tiles[player.ty][player.tx];
  if(ch==="."){tiles[player.ty][player.tx]=" ";left--;addScore(10);burst(player.px,player.py,"#ffe14d",5)}
  else if(ch==="O"){tiles[player.ty][player.tx]=" ";left--;addScore(50);fright=Math.max(3.2,6.2-level*0.4);combo=0;for(const g of ghosts)if(g.mode!=="eyes")g.mode="fright";burst(player.px,player.py,"#7dfff0",14);tone(523,0.1,"square",0.06);tone(784,0.14,"square",0.05,200);shake=6}
  if(left<=0&&state==="play"){addScore(200+level*50);banner="MAZE CLEAR";tone(523,0.12,"square",0.06);tone(659,0.12,"square",0.06);tone(880,0.18,"square",0.06);level++;generate(level)}
}
function kill(){
  if(player.inv>0||deadT>0||state!=="play")return;
  lives--;shake=14;noise(0.3,0.2);tone(480,0.35,"sawtooth",0.07,-300);burst(player.px,player.py,"#ff5d8a",18);
  if(lives<=0){state="over";return}
  deadT=0.9;
}
function start(){audio();score=0;lives=3;level=1;lastDir=null;for(const k in held)held[k]=false;generate(1);state="play"}
function restart(){start()}
player={tx:4,ty:4,sx:4,sy:4,dir:null,moving:false,t:0,px:0,py:0,inv:0};
resize();
function anyHeld(){return held.left||held.right||held.up||held.down}
function sim(dt){
  if(banner&&calm<0.3)banner="";
  if(deadT>0){deadT-=dt;if(deadT<=0){player.tx=player.sx=4;player.ty=player.sy=4;player.moving=false;player.t=0;player.dir=null;player.inv=1.6;deadT=0}placeAll();return}
  if(calm>0)calm-=dt;
  if(fright>0){fright-=dt;if(fright<=0)for(const g of ghosts)if(g.mode==="fright")g.mode="chase"}
  if(player.inv>0)player.inv-=dt;
  const speed=3.6+level*0.22;
  player.onArrive=eat;
  updateActor(player,dt,speed,()=>lastDir);
  if(player.moving&&clock>wakaAt){tone(wakaHi?560:420,0.05,"square",0.035);wakaHi=!wakaHi;wakaAt=clock+0.13}
  if(calm<=0){
    for(const g of ghosts){
      const sp=g.mode==="eyes"?7.2:g.mode==="fright"?2.3:3.15+level*0.28;
      updateActor(g,dt,sp,()=>ghostChoose(g));
      if(g.mode==="eyes"&&!g.moving&&g.tx===g.hx&&g.ty===g.hy)g.mode="chase";
      const hit=Math.hypot(g.px-player.px,g.py-player.py)<TS*0.62;
      if(hit&&g.mode==="chase"&&player.inv<=0)kill();
      else if(hit&&g.mode==="fright"){g.mode="eyes";combo++;const pts=200*(2**(combo-1));addScore(pts);burst(g.px,g.py,"#9fd3ff",12);tone(880,0.08,"square",0.06,300);shake=5}
    }
  }
  placeAll();
}
function stepFX(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);shake*=Math.exp(-3*dt)}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawGhost(g){
  const r=TS*0.42,bob=Math.sin(clock*6+g.hx)*2;
  if(g.mode!=="eyes"){
    ctx.fillStyle=g.mode==="fright"?(fright<1.5&&Math.sin(clock*16)>0?"#dce4ff":"#3a46e0"):g.col;
    ctx.beginPath();ctx.arc(g.px,g.py-r*0.15+bob,r,Math.PI,0);ctx.lineTo(g.px+r,g.py+r+bob);
    for(let i=3;i>=0;i--){const wx=g.px+r-((i+0.5)/4)*r*2;ctx.quadraticCurveTo(wx+r*0.2,g.py+r+((i%2)?-6:2)+bob,wx-r*0.15,g.py+r+bob)}
    ctx.closePath();ctx.fill();
  }
  const look=g.mode==="eyes"?ANG[g.dir]||0:(g.mode==="fright"?0:Math.atan2(player.py-g.py,player.px-g.px));
  const ex=Math.cos(look)*2,ey=Math.sin(look)*2;
  for(const s of[-1,1]){
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(g.px+s*r*0.38,g.py-r*0.15+bob,r*0.28,0,7);ctx.fill();
    if(g.mode!=="fright"){ctx.fillStyle="#142";ctx.beginPath();ctx.arc(g.px+s*r*0.38+ex,g.py-r*0.15+ey+bob,r*0.14,0,7);ctx.fill()}
    else{ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(g.px+s*r*0.2,g.py-r*0.05);ctx.lineTo(g.px+s*r*0.55,g.py+r*0.2);ctx.stroke()}
  }
}
function draw(){
  const th=THEMES[(level-1)%THEMES.length];
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,th.floor0);bg.addColorStop(1,th.floor1);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  if(tiles.length){
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(tiles[y][x]==="#"){
      const gx=ox+x*TS,gy=oy+y*TS;
      const grd=ctx.createLinearGradient(gx,gy,gx,gy+TS);
      grd.addColorStop(0,th.wall);grd.addColorStop(1,th.wall2);
      ctx.fillStyle=grd;roundRect(gx+1,gy+1,TS-2,TS-2,4);ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.16)";ctx.fillRect(gx+3,gy+2,TS-6,2);
    }
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
      const ch=tiles[y][x];if(ch!=="."&&ch!=="O")continue;
      const cxp=ox+(x+0.5)*TS,cyp=oy+(y+0.5)*TS;
      if(ch==="O"){
        const pulse=0.65+Math.sin(clock*5)*0.35;
        const g=ctx.createRadialGradient(cxp,cyp,1,cxp,cyp,TS*0.55);
        g.addColorStop(0,"rgba(125,255,240,"+pulse+")");g.addColorStop(1,"rgba(125,255,240,0)");
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(cxp,cyp,TS*0.55,0,7);ctx.fill();
        ctx.fillStyle=th.power;ctx.beginPath();ctx.arc(cxp,cyp,TS*0.18*pulse+2,0,7);ctx.fill();
      }else{ctx.fillStyle=th.dot;ctx.beginPath();ctx.arc(cxp,cyp,Math.max(2,TS*0.1),0,7);ctx.fill()}
    }
  }
  if(player&&state!=="title"){
    const mouth=player.moving?0.18+Math.abs(Math.sin(clock*14))*0.55:0.12;
    const ang=ANG[player.dir]||0;
    ctx.save();ctx.translate(player.px,player.py);ctx.rotate(ang);
    if(player.inv<=0||Math.sin(clock*24)>0){
      const g=ctx.createRadialGradient(-4,-4,2,0,0,TS*0.46);
      g.addColorStop(0,"#d9fff6");g.addColorStop(0.45,"#3ee0c5");g.addColorStop(1,"#128a78");
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,TS*0.42,mouth,Math.PI*2-mouth);ctx.closePath();ctx.fill();
      ctx.fillStyle="#082";ctx.beginPath();ctx.arc(TS*0.08,-TS*0.16,TS*0.07,0,7);ctx.fill();
    }
    ctx.restore();
  }
  if(state!=="title")for(const g of ghosts)drawGhost(g);
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,7);ctx.fill()}
  ctx.globalAlpha=1;ctx.restore();
  ctx.textAlign="left";ctx.font="700 16px ui-monospace,monospace";ctx.fillStyle="#ffe14d";
  ctx.fillText(String(score).padStart(6,"0"),96,28);
  ctx.font="700 12px ui-monospace,monospace";ctx.fillStyle="#9fd3ff";ctx.fillText("BEST "+best,96,46);
  ctx.fillStyle="#fff";ctx.fillText("LV "+level,210,28);
  for(let i=0;i<lives;i++){ctx.fillStyle="#3ee0c5";ctx.beginPath();ctx.arc(214+i*16,44,5,0,7);ctx.fill()}
  if(banner&&state==="play"){ctx.textAlign="center";ctx.font="700 22px ui-monospace,monospace";ctx.fillStyle="#ffe14d";ctx.shadowColor="#ffe14d";ctx.shadowBlur=12;ctx.fillText(banner,ox+COLS*TS/2,oy+18);ctx.shadowBlur=0}
  if(state==="title"||state==="over"){
    ctx.fillStyle="rgba(4,6,16,.66)";ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";ctx.font="700 40px ui-monospace,monospace";ctx.shadowColor="#3ee0c5";ctx.shadowBlur=18;ctx.fillStyle="#7dfff0";
    ctx.fillText(state==="title"?"MAZE MUNCHER":"GAME OVER",W/2,H*0.4);ctx.shadowBlur=0;
    ctx.font="700 15px ui-monospace,monospace";ctx.fillStyle="#fff";
    if(state==="over")ctx.fillText("SCORE "+score+"    BEST "+best,W/2,H*0.4+34);
    ctx.fillStyle="#c8c4d8";ctx.fillText(state==="title"?"Eat every dot. Power pellets turn the chase.":"The ghosts caught you",W/2,H*0.4+(state==="over"?62:40));
    ctx.fillStyle="#9fd3ff";ctx.fillText("Arrows or WASD    P pause    R restart",W/2,H*0.4+90);
    if(Math.sin(clock*4)>0){ctx.fillStyle="#ffe14d";ctx.fillText(state==="title"?"TAP OR PRESS ENTER":"TAP OR ENTER TO PLAY AGAIN",W/2,H*0.4+120)}
  }
  if(state==="pause"){ctx.fillStyle="rgba(4,6,16,.55)";ctx.fillRect(0,0,W,H);ctx.textAlign="center";ctx.font="700 36px ui-monospace,monospace";ctx.fillStyle="#ffe14d";ctx.fillText("PAUSED",W/2,H/2);ctx.font="700 14px ui-monospace,monospace";ctx.fillStyle="#fff";ctx.fillText("P resume    R restart",W/2,H/2+32)}
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.033,(now-last)/1000);last=now;clock+=dt;
  try{if(state==="play")sim(dt);stepFX(dt);draw()}catch(e){console.error(e)}
}
requestAnimationFrame(frame);
function togglePause(){if(state==="play")state="pause";else if(state==="pause")state="play"}
function setDir(d,on){held[d]=on;if(on)lastDir=d;document.getElementById(d).classList.toggle("on",on)}
addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code))e.preventDefault();
  keysSafe(e.code,true);audio();
  if(e.repeat)return;
  if(e.code==="KeyP"||e.code==="Escape")togglePause();
  if(e.code==="KeyR")restart();
  if((e.code==="Enter"||e.code==="Space")&&(state==="title"||state==="over"))start();
});
function keysSafe(code,on){
  const map={ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",ArrowUp:"up",KeyW:"up",ArrowDown:"down",KeyS:"down"};
  if(map[code])setDir(map[code],on);
}
addEventListener("keyup",e=>keysSafe(e.code,false));
addEventListener("blur",()=>{for(const k in held)held[k]=false;document.querySelectorAll(".dir").forEach(el=>el.classList.remove("on"))});
cv.addEventListener("pointerdown",e=>{audio();if(state==="title"||state==="over")start()});
for(const d of ["up","down","left","right"]){
  const el=document.getElementById(d);
  el.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();el.setPointerCapture(e.pointerId);audio();setDir(d,true)});
  const off=()=>setDir(d,false);
  el.addEventListener("pointerup",off);el.addEventListener("pointercancel",off);
}
document.getElementById("pauseBtn").addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();audio();togglePause()});
</script>
</body>
</html>
