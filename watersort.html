"use strict";

const CAP=4,NLEV=120;

function starTotal(){return Object.values(save.stars||{}).reduce((a,b)=>a+(+b||0),0);}

saveHub();
let screen='menu',paused=false,tubes=[],sel=-1,cursor=0,moves=0,hist=[],undos=5,extraUsed=false,hintMv=null,hintT=0,cur=1,par=0,anim=null,parts=[],buttons=[],winT=0,levelPage=0,msg='',msgT=0,levelCache={},hiddenLevel=false;
// ---------- rng / generator / solver ----------
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function levelSpec(L){return{colors:Math.min(3+Math.floor((L-1)/9),12),empty:2,hidden:L>=20&&L%3!==1};}
function key(ts){return ts.map(t=>t.join('')).sort().join('|');}
function legal(ts,a,b){const s=ts[a],d=ts[b];if(a===b||!s.length||d.length>=CAP)return 0;const c=s[s.length-1];if(d.length&&d[d.length-1]!==c)return 0;let r=0;for(let i=s.length-1;i>=0&&s[i]===c;i--)r++;return Math.min(r,CAP-d.length);}

function solve(start,limit){limit=limit||300000;const seen=new Set();let nodes=0;const path=[];
 function rec(ts){if(ts.every(done))return true;if(++nodes>limit)return false;const k=key(ts);if(seen.has(k))return false;seen.add(k);
  const mv=[];for(let a=0;a<ts.length;a++){const s=ts[a];if(!s.length||done(s))continue;const uni=s.every(x=>x===s[0]);let emptyTried=false;
   for(let b=0;b<ts.length;b++){const n=legal(ts,a,b);if(!n)continue;if(!ts[b].length){if(uni||emptyTried)continue;emptyTried=true;}
    const sc=(ts[b].length?10:0)+(n===s.filter(x=>x===s[s.length-1]).length?5:0)+ts[b].length;mv.push([sc,a,b,n]);}}
  mv.sort((x,y)=>y[0]-x[0]);
  for(const[,a,b,n] of mv){const nt=ts.map(t=>t.slice());for(let i=0;i<n;i++)nt[b].push(nt[a].pop());path.push([a,b]);if(rec(nt))return true;path.pop();}
  return false;}
 const ok=rec(start.map(t=>t.slice()));return ok?path.slice():null;}
function genLevel(L){if(levelCache[L])return levelCache[L];const sp=levelSpec(L);
 for(let k=0;k<200;k++){const r=rng(L*7919+k*104729+13);const u=[];for(let c=0;c<sp.colors;c++)for(let i=0;i<CAP;i++)u.push(c);
  for(let i=u.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[u[i],u[j]]=[u[j],u[i]];}

  if(ts.some(done))continue;for(let e=0;e<sp.empty;e++)ts.push([]);

// ---------- audio ----------

function tone(f,d,type,v,f2){if(save.muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);g.gain.setValueAtTime(v||.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}
function sPour(){if(save.muted)return;const a=ac();if(!a)return;for(let i=0;i<8;i++)setTimeout(()=>tone(300+Math.random()*500,.09,'sine',.06,200),i*45);}
const sSel=()=>tone(660,.08,'triangle',.12),sBad=()=>tone(180,.2,'square',.08,120),sCork=()=>{tone(880,.1,'triangle',.15);setTimeout(()=>tone(1320,.15,'triangle',.12),90);},sWin=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.15),i*120));
// ---------- level control ----------
function startLevel(L){const lv=genLevel(L);cur=L;save.lvl=L;persist();tubes=lv.tubes.map((t,i)=>t.map((c,j)=>({c,h:lv.hidden&&j<t.length-1})));hiddenLevel=lv.hidden;
 par=lv.par;sel=-1;cursor=0;moves=0;hist=[];undos=5;extraUsed=false;hintMv=null;anim=null;parts=[];screen='play';paused=false;}
function plain(){return tubes.map(t=>t.map(u=>u.c));}

function finishPour(){const{a,b,n}=anim;for(let i=0;i<n;i++){const u=tubes[a].pop();u.h=false;tubes[b].push(u);}

 if(done(tubes[b])&&tubes[b].length){sCork();const p=tubePos(b);for(let i=0;i<24;i++)parts.push({x:p.x+p.w/2,y:p.y,vx:(Math.random()-.5)*160,vy:-Math.random()*160,l:1,c:COLS[tubes[b][0].c]});}
 if(tubes.every(t=>done(t.map(u=>u.c)))){const st=moves<=par?3:moves<=Math.ceil(par*1.35)?2:1;save.stars[cur]=Math.max(save.stars[cur]||0,st);save.unlocked=Math.max(save.unlocked,Math.min(NLEV,cur+1));persist();winT=0;screen='win';lastStars=st;setTimeout(sWin,200);}}

function resize(){DPR=Math.min(window.devicePixelRatio||1,3);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';}
addEventListener('resize',resize);resize();

 // levels: array of {c,h,amt}

 tubePath(w,h);cx.strokeStyle=(i===sel)?'#fff59d':(hintMv&&(hintMv[0]===i||hintMv[1]===i)&&Math.sin(performance.now()/120)>0)?'#80deea':'rgba(220,235,255,.85)';cx.lineWidth=i===sel?3.2:2.2;cx.stroke();
 cx.fillStyle='rgba(220,235,255,.85)';rr(-3,-4,w+6,6,3);cx.fill();
 if(complete){cx.fillStyle='#a1663a';rr(w*.12,-uh*.55,w*.76,uh*.6,4);cx.fill();cx.fillStyle='#c98b55';cx.fillRect(w*.18,-uh*.5,w*.64,uh*.12);}

function btn(id,x,y,w,h,label,on){buttons.push({id,x,y,w,h,label});cx.fillStyle=on===false?'rgba(255,255,255,.06)':'rgba(255,255,255,.14)';rr(x,y,w,h,10);cx.fill();cx.strokeStyle='rgba(255,255,255,.3)';cx.lineWidth=1.5;cx.stroke();

function drawPlay(dt){const L=layout();

  if(i<10&&L.tw>24){cx.fillStyle='rgba(255,255,255,.35)';cx.font='11px sans-serif';cx.textAlign='center';cx.fillText(String((i+1)%10),p.x+p.w/2,p.y+p.h+12);}
  if(i===cursor&&kbUsed){cx.strokeStyle='#ffd54f';cx.lineWidth=2;cx.beginPath();cx.moveTo(p.x+p.w/2-7,p.y+p.h+20);cx.lineTo(p.x+p.w/2,p.y+p.h+14);cx.lineTo(p.x+p.w/2+7,p.y+p.h+20);cx.stroke();}}

  const f=pourFrac();const lv=tubes[a.a].map(u=>({c:u.c,h:u.h,amt:1}));for(let k=0;k<a.n;k++){const idx=lv.length-1-k;lv[idx].amt=Math.max(0,Math.min(1,(1-f)*a.n-(a.n-1-k)));}
  for(let k=0;k<lv.length-a.n;k++)if(k===lv.length-a.n-1&&f>=1)lv[k].h=false;
  drawTube(a.a,x,y,ang,lv,false);
  if(t>.25&&t<.8){const lipx=x+Math.cos(ang)*(dir<0?ps.w:0),lipy=y+Math.sin(ang)*(dir<0?ps.w:0);const fx=pd.x+pd.w/2,fy=pd.y+pd.h-pd.uh*(tubes[a.b].length+f*a.n);
   cx.strokeStyle=COLS[a.color];cx.lineWidth=Math.max(3,ps.w*.16)+Math.sin(performance.now()/40);cx.lineCap='round';cx.beginPath();cx.moveTo(lipx,lipy);cx.quadraticCurveTo(fx,lipy,fx,fy);cx.stroke();}}
 // HUD
 const items=[['menu','Levels',true],['undo','Undo '+undos,undos>0&&hist.length>0],['tube','+Tube',!extraUsed],['hint','Hint',true],['restart','Restart',true],['mute',save.muted?'🔇':'🔊',true],['pause','II',true]];

}
function pourFrac(){if(!anim)return 0;return Math.max(0,Math.min(1,(anim.t-.3)/.45));}

function drawLevels(){const narrow=W<560;cx.fillStyle='#fff';cx.font='bold 22px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('Select Level',W/2,narrow?78:30);

  buttons.push({id:'lv'+L,x,y,w:bw,h:bh,label:String(L)});cx.fillStyle=lock?'rgba(255,255,255,.05)':L===save.lvl?'rgba(100,180,255,.35)':'rgba(255,255,255,.14)';rr(x,y,bw,bh,10);cx.fill();
  cx.fillStyle=lock?'#555':'#fff';cx.font='bold 18px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(lock?'🔒':L,x+bw/2,y+bh*.38);const st=save.stars[L]||0;if(!lock)for(let j=0;j<3;j++)star(x+bw/2+(j-1)*14,y+bh*.72,6,j<st);}
