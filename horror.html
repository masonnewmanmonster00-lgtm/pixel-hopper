  shaft.position.z=0.14;g.add(bow);g.add(shaft);g.position.set(p[0],p[1],p[2]);scene.add(g);
  keyItems.push({g,x:p[0],y:p[1],z:p[2],floor:p[3],taken:false,i});
 });
 const paper=new THREE.MeshStandardMaterial({color:0xe6dcc4,roughness:0.9});
 [[4.2,1.2,2.2,0,'The front door was locked from the inside. Five iron keys are scattered through both floors. Count them, then go back.'],
  [6.2,1.15,10.2,0,'It finds you by the noise you make. Walk, and it loses you. Run, and it will not.'],
  [7.2,4.25,14.4,1,'Under the bed. Inside the closet. Be still, and it only listens.']].forEach(n=>{
  const m=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.02,0.2),paper);
  m.position.set(n[0],n[1],n[2]);m.rotation.y=0.4;m.castShadow=true;scene.add(m);
  notes.push({x:n[0],y:n[1],z:n[2],floor:n[3],text:n[4],read:false,mesh:m});
 });
 hides.push({minx:13.05,maxx:14.05,minz:6.45,maxz:8.7,floor:0,name:'closet'});
 hides.push({minx:15.15,maxx:15.85,minz:4.55,maxz:5.75,floor:0,name:'pantry'});
 hides.push({minx:1.6,maxx:4.3,minz:14.7,maxz:16.5,floor:1,name:'bed'});
}
function buildActors(THREE){
 const mat=new THREE.MeshStandardMaterial({color:0x07080c,roughness:1});
 stalkerMesh=new THREE.Group();
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.28,1.15,4,8),mat);body.position.y=1.05;body.castShadow=true;
 const head=new THREE.Mesh(new THREE.SphereGeometry(0.22,12,10),mat);head.position.y=1.78;head.castShadow=true;
 const eye=new THREE.MeshBasicMaterial({color:0xf3ead4});
 const e1=new THREE.Mesh(new THREE.SphereGeometry(0.035,8,8),eye);e1.position.set(-0.07,1.8,0.18);
 const e2=e1.clone();e2.position.x=0.07;
 stalkerMesh.add(body,head,e1,e2);scene.add(stalkerMesh);
 stalker={x:14.2,y:3.2,z:19.2,floor:1,gx:14.2,gz:19.2,gf:1,alert:0,stuck:0,pi:0};
 stalkerMesh.position.set(stalker.x,stalker.y,stalker.z);
}
const patrol=[
 {x:14.2,z:18.8,f:1},{x:14,z:15.2,f:1},{x:6,z:15.4,f:1},{x:2.2,z:16,f:1},{x:2,z:19.4,f:1},{x:8,z:19.4,f:1},{x:14,z:19,f:1},
 {x:14,z:13.5,f:1},{x:14,z:10.5,f:0},{x:10,z:8,f:0},{x:3.2,z:9,f:0},{x:3,z:3,f:0},{x:9,z:3,f:0},{x:14,z:3,f:0},{x:13.2,z:7.4,f:0},{x:14,z:10.3,f:0}
];
function inRamp(x,z){return x>13.22&&x<14.78&&z>=10.15&&z<=13.7}
function rampY(z){return Math.max(0,Math.min(1,(z-10.15)/(13.7-10.15)))*3.2}
function supported(x,z,floor){
 if(inRamp(x,z))return true;
 if(floor===1)return x>0.28&&x<15.72&&z>13.48&&z<20.82;
 return x>0.28&&x<15.72&&z>0.28&&z<11.88;
}
function hits(x,z,y,r){
 const top=y+1.7,bot=y+0.2;
 for(const b of colliders){
  if(top<b.miny||bot>b.maxy)continue;
  if(x>b.minx-r&&x<b.maxx+r&&z>b.minz-r&&z<b.maxz+r)return true;
 }
 for(const d of doors){
  if(d.open>0.55)continue;
  const b=d.closed;
  if(top<b.miny||bot>b.maxy)continue;
  if(x>b.minx-r&&x<b.maxx+r&&z>b.minz-r&&z<b.maxz+r)return true;
 }
 return false;
}
function moveBody(body,dx,dz){
 const r=0.26;
 const nx=body.x+dx,nz=body.z+dz;
 if(supported(nx,body.z,body.floor)&&!hits(nx,body.z,body.y,r))body.x=nx;
 if(supported(body.x,nz,body.floor)&&!hits(body.x,nz,body.y,r))body.z=nz;
 if(inRamp(body.x,body.z)){
  body.y=rampY(body.z);
  if(body.y>2.55)body.floor=1;
  else if(body.y<0.4)body.floor=0;
 }else body.y=body.floor?3.2:0;
}
function los(x0,z0,y0,x1,z1,y1){
 for(let i=1;i<=7;i++){
  const t=i/8,x=x0+(x1-x0)*t,z=z0+(z1-z0)*t,y=y0+(y1-y0)*t;
  for(const b of colliders){
   if(x>b.minx&&x<b.maxx&&z>b.minz&&z<b.maxz&&y>b.miny&&y<b.maxy)return false;
  }
  for(const d of doors){
   if(d.open>0.55)continue;
   const c=d.closed;
   if(x>c.minx&&x<c.maxx&&z>c.minz&&z<c.maxz&&y>c.miny&&y<c.maxy)return false;
  }
 }
 return true;
}
function inHide(){
 return hides.find(h=>player.floor===h.floor&&player.x>h.minx&&player.x<h.maxx&&player.z>h.minz&&player.z<h.maxz)||null;
}
function nearestDoor(){
 let best=null,bd=1.2;
 for(const d of doors){
  if(Math.abs(player.y-d.y)>1.6)continue;
  const cx=(d.closed.minx+d.closed.maxx)/2,cz=(d.closed.minz+d.closed.maxz)/2;
  const dist=Math.hypot(player.x-cx,player.z-cz);
  if(dist<bd){bd=dist;best=d}
 }
 return best;
}
function showNote(text){$('note').style.display='block';$('note').textContent=text;noteT=7}
function interact(){
 if(phase!=='play')return;
 ac();
 const h=inHide();
 if(h){hiding=!hiding;if(hiding)SFX.creak();return}
 const d=nearestDoor();
 if(d){d.target=d.target>0.5?0:1;SFX.door();return}
 for(const n of notes){
  if(n.floor!==player.floor)continue;
  if(Math.hypot(player.x-n.x,player.z-n.z)<1.4){n.read=true;showNote(n.text);SFX.creak();return}
 }
 if(player.floor===0&&Math.hypot(player.x-3,player.z-0.55)<1.15){
  if(got<5)showNote('The front door needs all five keys. '+got+' collected.');
  else escape();
 }
}
function escape(){
 if(phase!=='play')return;
 const t=elapsed();
 frozen=t;phase='win';
 const best=saveBest(t);
 document.exitPointerLock&&document.exitPointerLock();
 $('endT').textContent='ESCAPED';
 $('endS').textContent='You were inside for '+fmt(t)+'. Best '+best+'s.';
 show('end');
 SFX.key();
}
function scare(){
 if(phase!=='play')return;
 frozen=elapsed();tAcc=frozen;
 phase='scare';hiding=false;
 document.exitPointerLock&&document.exitPointerLock();
 $('scare').classList.add('on');
 shake=1;SFX.scare();
 setTimeout(()=>{
  if(phase!=='scare')return;
  phase='caught';
  $('scare').classList.remove('on');
  $('endT').textContent='TAKEN';
  $('endS').textContent='It found you. The door is still locked.';
  show('end');
 },1100);
}
function resetRun(){
 player.x=3;player.z=2.4;player.floor=0;player.y=0;player.yaw=Math.PI;player.pitch=0;
 got=0;hiding=false;stamina=100;tAcc=0;frozen=0;bob=0;shake=0;
 keyItems.forEach(k=>{k.taken=false;k.g.visible=true});
 doors.forEach(d=>{d.open=0;d.target=0;d.g.rotation.y=0});
 if(exitMesh)exitMesh.material.emissive.setHex(0x000000);
 notes.forEach(n=>n.read=false);
 $('note').style.display='none';
 stalker.x=14.2;stalker.z=19.2;stalker.floor=1;stalker.y=3.2;stalker.alert=0;stalker.pi=0;stalker.gx=14.2;stalker.gz=19.2;stalker.gf=1;stalker.stuck=0;
}
function startGame(){
 ac();drone();
 resetRun();
 phase='play';tMark=performance.now();
 show(null);$('scare').classList.remove('on');
}
function pauseGame(){
 if(phase!=='play')return;
 tAcc+=(performance.now()-tMark)/1000;
 frozen=tAcc;
 phase='pause';
 document.exitPointerLock&&document.exitPointerLock();
 show('pause');
}
function resumeGame(){
 if(phase!=='pause')return;
 phase='play';tMark=performance.now();show(null);
}
function onEsc(){
 const n=performance.now();
 if(n-escGate<200)return;
 escGate=n;
 if(phase==='play')pauseGame();
 else if(phase==='pause')resumeGame();
}
function updateDoors(dt){
 for(const d of doors){
  d.open+=(d.target-d.open)*Math.min(1,dt*6);
  d.g.rotation.y=(d.axis==='z'?-1:1)*d.sign*d.open*1.45;
 }
}
function updateStalker(dt){
 const wp=patrol[stalker.pi%patrol.length];
 let gx,gz,gf;
 if(stalker.alert>0){gx=stalker.gx;gz=stalker.gz;gf=stalker.gf;stalker.alert-=dt}
 else{gx=wp.x;gz=wp.z;gf=wp.f}
 if(stalker.floor!==gf){
  if(stalker.floor===0){gx=14;gz=10.45}else{gx=14;gz=13.45}
 }
 const dx=gx-stalker.x,dz=gz-stalker.z,dist=Math.hypot(dx,dz);
 if(dist<0.45){if(stalker.alert<=0)stalker.pi++}
 else{
  const sp=(stalker.alert>0?3.15:1.35)*dt;
  const ox=stalker.x,oz=stalker.z;
  moveBody(stalker,(dx/dist)*sp,(dz/dist)*sp);
  if(Math.hypot(stalker.x-ox,stalker.z-oz)<sp*0.2)stalker.stuck+=dt;else stalker.stuck=0;
  if(stalker.stuck>2.2){stalker.stuck=0;stalker.pi++;stalker.alert=0}
 }
 for(const d of doors){
  const cx=(d.closed.minx+d.closed.maxx)/2,cz=(d.closed.minz+d.closed.maxz)/2;
  if(Math.abs(stalker.y-d.y)<1.7&&Math.hypot(stalker.x-cx,stalker.z-cz)<1.35)d.target=1;
 }
 stalkerMesh.position.set(stalker.x,stalker.y,stalker.z);
 stalkerMesh.lookAt(player.x,stalker.y+1.5,player.z);
 const hearDist=Math.hypot(stalker.x-player.x,stalker.z-player.z)+Math.abs(stalker.y-player.y);
 let loud=0;
 const moving=Math.hypot(stickM.x,stickM.y)>0.2||keysDown.KeyW||keysDown.KeyA||keysDown.KeyS||keysDown.KeyD||keysDown.ArrowUp||keysDown.ArrowDown||keysDown.ArrowLeft||keysDown.ArrowRight;
 const sprinting=moving&&stamina>0&&(sprintHold||keysDown.ShiftLeft||keysDown.ShiftRight);
 if(moving&&phase==='play'&&!hiding)loud=sprinting?1:0.38;
 if(hiding)loud*=0.12;
 if(loud>0.05&&hearDist<loud*13.5){stalker.gx=player.x;stalker.gz=player.z;stalker.gf=player.floor;stalker.alert=Math.max(stalker.alert,4.5)}
 if(!hiding&&hearDist<5.2&&Math.abs(stalker.y-player.y)<1.5&&los(stalker.x,stalker.z,stalker.y+1.5,player.x,player.z,player.y+1.4)){
  stalker.gx=player.x;stalker.gz=player.z;stalker.gf=player.floor;stalker.alert=Math.max(stalker.alert,3);
 }
 const touch=hearDist<0.95&&Math.abs(stalker.y-player.y)<1.45;
 if(phase==='play'&&touch&&(!hiding||loud>0.2))scare();
}
function updatePlayer(dt){
 let ix=stickM.x,iz=-stickM.y;
 if(keysDown.KeyW||keysDown.ArrowUp)iz+=1;
 if(keysDown.KeyS||keysDown.ArrowDown)iz-=1;
 if(keysDown.KeyD||keysDown.ArrowRight)ix+=1;
 if(keysDown.KeyA||keysDown.ArrowLeft)ix-=1;
 const il=Math.hypot(ix,iz);if(il>1){ix/=il;iz/=il}
 const moving=il>0.08&&!hiding&&phase==='play';
 const wantSprint=moving&&(sprintHold||keysDown.ShiftLeft||keysDown.ShiftRight);
 let sprinting=wantSprint&&stamina>8;
 if(sprinting){stamina=Math.max(0,stamina-28*dt);if(stamina<=0)sprinting=false}
 else stamina=Math.min(100,stamina+(hiding?10:18)*dt);
 const speed=sprinting?4.5:2.3;
 const yaw=player.yaw,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=Math.sin(yaw);
 if(phase==='play')moveBody(player,(rx*ix+fx*iz)*speed*dt,(rz*ix+fz*iz)*speed*dt);
 if(moving){bobT+=dt*(sprinting?13:8);bob=Math.sin(bobT)*(sprinting?0.055:0.04);stepT-=dt;if(stepT<=0){stepT=sprinting?0.32:0.48;SFX.step()}}
 else{bob*=Math.max(0,1-dt*6);stepT=0}
 const eye=(hiding?0.62:1.58)+bob+(phase==='scare'?(Math.random()-.5)*shake*0.2:0);
 camera.position.set(player.x,player.y+eye,player.z);
 camera.rotation.y=player.yaw+(phase==='scare'?(Math.random()-.5)*shake:0);
 camera.rotation.x=player.pitch;
 if(shake>0)shake=Math.max(0,shake-dt);
 if(hiding)flash.intensity=0.2;else flash.intensity=8+(Math.random()<0.03? -2.5:0);
 for(const k of keyItems){
  if(k.taken)continue;
  k.g.rotation.y+=dt*2;k.g.position.y=k.y+Math.sin(performance.now()/400+k.i)*0.06;
  if(phase==='play'&&player.floor===k.floor&&Math.hypot(player.x-k.x,player.z-k.z)<1.15&&Math.abs(player.y-k.y)<1.6){
   k.taken=true;k.g.visible=false;got++;SFX.key();
   if(got>=5&&exitMesh)exitMesh.material.emissive.setHex(0x662200);
  }
 }
 if(phase!=='play')return;
 let prompt='';
 const h=inHide();
 const d=nearestDoor();
 if(h)prompt=hiding?'E  Step out':'E  Hide';
 else if(d)prompt=d.target>0.5?'E  Close door':'E  Open door';
 else if(player.floor===0&&Math.hypot(player.x-3,player.z-0.55)<1.15)prompt=got<5?'Door locked  '+got+'/5':'E  Escape';
 else{
  for(const n of notes)if(n.floor===player.floor&&Math.hypot(player.x-n.x,player.z-n.z)<1.4)prompt='E  Read note';
 }
 $('prompt').textContent=prompt;
}
function updateWorld(dt){
 ambT-=dt;if(ambT<=0){ambT=7+Math.random()*8;if(phase==='play')SFX.creak()}
 const hd=stalker?Math.hypot(stalker.x-player.x,stalker.z-player.z):99;
 heartT-=dt;if(hd<7&&heartT<=0){heartT=Math.max(0.28,hd/7);SFX.heart()}
 for(const f of flickers){
  const n=Math.random();
  f.l.intensity=n<0.04?f.base*0.05:f.base*(0.75+0.25*Math.sin(performance.now()/90+f.base));
 }
 if(noteT>0){noteT-=dt;if(noteT<=0)$('note').style.display='none'}
 $('keyN').textContent='Keys '+got+'/5';
 $('timeN').textContent=fmt(elapsed());
 $('stam').firstElementChild.style.width=stamina+'%';
}
function loop(){
 const dt=Math.min(0.05,clock.getDelta());
 if(phase==='play'||phase==='scare'){updateDoors(dt);updateStalker(dt)}
 else updateDoors(dt*0.2);
 updatePlayer(phase==='pause'?0:dt);
 updateWorld(dt);
 const lookX=stickL.x,lookY=stickL.y;
 if(phase==='play'&&(lookX||lookY)){player.yaw-=lookX*dt*2.4;player.pitch=Math.max(-1.15,Math.min(1.15,player.pitch-lookY*dt*1.8))}
 renderer.render(scene,camera);
 requestAnimationFrame(loop);
}
addEventListener('keydown',e=>{
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 keysDown[e.code]=true;
 if(e.repeat)return;
 if(e.code==='Escape')onEsc();
 else if(e.code==='KeyE')interact();
 else if(e.code==='KeyR'&&phase!=='play')startGame();
 else if(e.code==='KeyM'){muted=!muted;try{localStorage.setItem('hh_mute',muted?'1':'0')}catch(err){}$('mute').textContent=muted?'🔇':'🔊'}
});
addEventListener('keyup',e=>{keysDown[e.code]=false});
addEventListener('mousemove',e=>{
 if(document.pointerLockElement!==renderer.domElement||phase!=='play')return;
 player.yaw-=e.movementX*0.0022;
 player.pitch=Math.max(-1.15,Math.min(1.15,player.pitch-e.movementY*0.0022));
});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&phase==='play')onEsc()});
function bindStick(el,dest){
 let id=null,ox=0,oy=0;
 el.addEventListener('pointerdown',e=>{e.preventDefault();id=e.pointerId;el.setPointerCapture(id);const r=el.getBoundingClientRect();ox=r.left+r.width/2;oy=r.top+r.height/2});
 el.addEventListener('pointermove',e=>{
  if(e.pointerId!==id)return;
  let dx=(e.clientX-ox)/42,dy=(e.clientY-oy)/42;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}
  dest.x=dx;dest.y=dy;el.firstElementChild.style.transform='translate('+dx*28+'px,'+dy*28+'px)';
 });
 const end=e=>{if(e.pointerId!==id)return;id=null;dest.x=0;dest.y=0;el.firstElementChild.style.transform=''};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
bindStick($('mv'),stickM);bindStick($('lk'),stickL);
$('runB').addEventListener('pointerdown',e=>{e.preventDefault();sprintHold=true});
addEventListener('pointerup',()=>{sprintHold=false});
$('useB').addEventListener('pointerdown',e=>{e.preventDefault();interact()});
$('play').onclick=()=>startGame();
$('resume').onclick=()=>resumeGame();
$('restart').onclick=()=>startGame();
$('again').onclick=()=>startGame();
$('pbtn').onclick=()=>{if(phase==='play')pauseGame();else if(phase==='pause')resumeGame()};
$('mute').onclick=()=>{muted=!muted;try{localStorage.setItem('hh_mute',muted?'1':'0')}catch(e){}$('mute').textContent=muted?'🔇':'🔊';ac()};
$('mute').textContent=muted?'🔇':'🔊';
paintBest();
boot3d();
window.__hh={
 start:startGame,
 interact,pause:pauseGame,resume:resumeGame,
 teleport(x,z,floor,yaw){player.x=x;player.z=z;player.floor=floor;player.y=inRamp(x,z)?rampY(z):(floor?3.2:0);if(yaw!=null)player.yaw=yaw},
 setStalker(x,z,floor){stalker.x=x;stalker.z=z;stalker.floor=floor;stalker.y=floor?3.2:0;stalker.gx=x;stalker.gz=z;stalker.gf=floor},
 giveKeys(n){got=n;keyItems.forEach((k,i)=>{k.taken=i<n;k.g.visible=!k.taken});if(got>=5&&exitMesh)exitMesh.material.emissive.setHex(0x662200)},
 state(){return{phase,x:player.x,y:player.y,z:player.z,yaw:player.yaw,pitch:player.pitch,floor:player.floor,keys:got,hiding,stamina,time:elapsed(),alert:stalker.alert,sx:stalker.x,sy:stalker.y,sz:stalker.z,sf:stalker.floor,doors:doors.map(d=>+d.open.toFixed(2)),read:notes.filter(n=>n.read).length,fog:!!scene.fog,shadow:!!(flash&&flash.castShadow)}},
 hideZones:()=>hides.map(h=>h.name),
 blocked:(x,z,floor)=>hits(x,z,floor?3.2:0,0.26)||!supported(x,z,floor||0)
};
