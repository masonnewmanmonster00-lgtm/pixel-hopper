function saveHub(n){n=Math.floor(Number(n))||0;if(!(n>0))return;try{const prev=+localStorage.getItem('arcade-candy-best')||0;if(n>prev)localStorage.setItem('arcade-candy-best',String(n));}catch(e){}}

// ---------- physics ----------
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((px-x1)*dx+(py-y1)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-x1-dx*t,py-y1-dy*t)}

function puff(j){const q=G0.cushions[j];if(!q)return;q.puff=1;SFX.puff();const c=G0.candy,dx=Math.cos(q.a),dy=Math.sin(q.a);const vx=c.x-q.x,vy=c.y-q.y,d=Math.hypot(vx,vy);

function step(){const g=G0;g.t+=DT;const c=g.candy;
for(const R of g.ropes){if(R.mv){R.bx=R.ax+Math.sin(g.t*R.sp)*R.mv}R.pts[0].x=R.bx;R.pts[0].y=R.by}

 if(c.alive){const gy=c.bub?-260:G,dm=c.bub?.97:.997;let vx=(c.x-c.px)*dm,vy=(c.y-c.py)*dm;const sp=Math.hypot(vx,vy),mx=1400*DT;if(sp>mx){vx*=mx/sp;vy*=mx/sp}c.px=c.x;c.py=c.y;c.x+=vx;c.y+=vy+gy*DT*DT;c.rot+=vx*.02}
}
for(const R of g.ropes){for(let i=1;i<R.pts.length;i++){const p=R.pts[i];if(R.att&&i===R.pts.length-1)continue;const vx=(p.x-p.px)*.98,vy=(p.y-p.py)*.98;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+G*DT*DT}}
for(let it=0;it<20;it++){for(const R of g.ropes){const P=R.pts,n=P.length;if(R.att&&c.alive){P[n-1].x=c.x;P[n-1].y=c.y}
 for(let i=0;i<n-1;i++){const a=P[i],b=P[i+1];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1e-6;if(d<R.seg&&!(R.att))continue;const df=(d-R.seg)/d;const wa=i===0?0:1,wb=(R.att&&i+1===n-1)?.15:1;const s=wa+wb;if(!s)continue;
  a.x+=dx*df*wa/s;a.y+=dy*df*wa/s;b.x-=dx*df*wb/s;b.y-=dy*df*wb/s}
 if(R.att&&c.alive){c.x=P[n-1].x;c.y=P[n-1].y;const dx=c.x-R.bx,dy=c.y-R.by,d=Math.hypot(dx,dy);if(d>R.len){c.x=R.bx+dx/d*R.len;c.y=R.by+dy/d*R.len}}}}
if(g.state!=='play')return;
for(const h of g.hooks){if(!h.used&&Math.hypot(c.x-h.x,c.y-h.y)<h.r){h.used=true;const R=mkRope(h.x,h.y,h.r*.75,0);g.ropes.push(R);SFX.hook()}}

const m=g.m;if(Math.hypot(c.x-m.x,c.y-(m.y-20))<CR+32){g.state='win';g.endT=g.t;c.alive=false;m.chomp=1;for(const R of g.ropes)if(R.att)cutRope(R,R.pts.length-2);SFX.chomp();
 if(!headless){const prev=best[cur];if(prev===undefined||g.got>prev){best[cur]=g.got;saveBest()}}return}
if(c.x<-80||c.x>W+80||c.y>H+80||c.y<-120)lose('out');}
function lose(w){const g=G0;g.state='lose';g.endT=g.t;g.m.sad=1;if(w==='spike'){g.candy.alive=false;burst(g.candy.x,g.candy.y,'#f6a',20);SFX.spike()}else SFX.lose();for(const R of g.ropes)if(R.att&&w==='spike')cutRope(R,R.pts.length-2)}
let headless=false;
// test hook
window.CD={LV,load:i=>{headless=true;load(i);screen='play'},step,cutIdx,pop:popBubble,puff,get:()=>({state:G0.state,got:G0.got,t:G0.t,att:G0.ropes.filter(r=>r.att).length,bub:G0.candy.bub,cush:G0.cushions.length,hasB:G0.bubbles.length,screen,paused}),live:()=>{headless=false},grant(n){headless=false;const prev=best[cur];if(prev===undefined||n>prev){best[cur]=n;saveBest()}return totalStars()}};
// ---------- input ----------
let ptr=null;
function toW(e){return{x:(e.clientX-ox)/sc,y:(e.clientY-oy)/sc}}
function screenOf(x,y){return{x:ox+x*sc,y:oy+y*sc}}
function hudOrigin(){let x=16,y=40;const s=screenOf(x,y);if(s.x<112&&s.y<64){x=Math.max(x,(116-ox)/sc);if(screenOf(x,y).y<60)y=Math.max(y,(64-oy)/sc)}return{x,y}}

function selBox(i){const c=i%8,r=Math.floor(i/8);return{x:105+c*96,y:150+r*130,w:80,h:100}}
