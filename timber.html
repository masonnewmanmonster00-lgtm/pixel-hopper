</head><body><a class="back" href="./index.html" aria-label="Back to menu" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">← Menu</a><canvas id="c"></canvas>
<script>
"use strict";
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W=0,H=0,DPR=1;
// ---------- save ----------
const SKEY='timberSave';
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function loadSave(){let s=null;try{s=JSON.parse(localStorage.getItem(SKEY));}catch(e){}
 s=Object.assign({best:0,daily:{date:today(),best:0},coins:0,unlocked:[0],char:0,muted:false,games:0},s||{});
 if(!s.daily||s.daily.date!==today())s.daily={date:today(),best:0};
 if(!Array.isArray(s.unlocked)||!s.unlocked.includes(0))s.unlocked=[0];return s;}
let save=loadSave();
function saveHub(){const n=Math.round(Number(save&&save.best)||0);if(!(n>0))return;let prev=NaN;try{prev=Number(localStorage.getItem('arcade-timber-best'))}catch(e){}if(Number.isFinite(prev)&&prev>=n)return;try{localStorage.setItem('arcade-timber-best',String(n))}catch(e){}}
function writeSave(){try{localStorage.setItem(SKEY,JSON.stringify(save));}catch(e){}saveHub();}
saveHub();
// ---------- characters (pixel art) ----------
// grid chars: . empty, H hat, h hat2, S skin, E eye, B beard/hair, T shirt, t shirt2, P pants, K boots
const BASE=[
"..HHHH..",
".HHHHHH.",
"hhhhhhhh",
".SSSSSS.",
".SESSES.",
".SSSSSS.",
".BBBBBB.",
"TTtTTtTT",
"TTtTTtTT",
"STTTTTTS",
".PPPPPP.",
".PP..PP.",
".KK..KK."];
function grid(over){const g=BASE.map(r=>r.split(''));if(over)over(g);return g;}
const CHARS=[
 {name:'Jack',req:{t:'free'},pal:{H:'#c0392b',h:'#922b21',S:'#f1c27d',E:'#222',B:'#7b3f12',T:'#d63031',t:'#2d3436',P:'#2c3e8f',K:'#3b2a1a'}},
 {name:'Jill',req:{t:'score',v:50},pal:{H:'#e84393',h:'#a62669',S:'#ffdbac',E:'#222',B:'#f6c14b',T:'#00b894',t:'#f6c14b',P:'#6c5ce7',K:'#3b2a1a'},g:g=>{g[6]=".S....S.".split('');g[3][0]='B';g[3][7]='B';g[4][0]='B';g[4][7]='B';}},
 {name:'Bear',req:{t:'coins',v:30},pal:{H:'#8b5a2b',h:'#5e3a17',S:'#a0682f',E:'#111',B:'#d2a679',T:'#8b5a2b',t:'#8b5a2b',P:'#8b5a2b',K:'#5e3a17'},g:g=>{g[0]=".H....H.".split('');g[1]="HHHHHHHH".split('');g[2]="HHHHHHHH".split('');g[6]=".SBBBBS.".split('');}},
 {name:'Ninja',req:{t:'score',v:100},pal:{H:'#222',h:'#d63031',S:'#f1c27d',E:'#fff',B:'#222',T:'#2d3436',t:'#d63031',P:'#222',K:'#111'},g:g=>{g[3]="HHHHHHHH".split('');g[5]="HHHHHHHH".split('');g[6]=".HHHHHH.".split('');}},
 {name:'Robot',req:{t:'coins',v:80},pal:{H:'#b2bec3',h:'#fdcb6e',S:'#dfe6e9',E:'#00cec9',B:'#636e72',T:'#74b9ff',t:'#fdcb6e',P:'#636e72',K:'#2d3436'},g:g=>{g[0]="...hh...".split('');g[1]="...HH...".split('');g[2]=".HHHHHH.".split('');}},
 {name:'Viking',req:{t:'score',v:200},pal:{H:'#95a5a6',h:'#fff8e1',S:'#ffdbac',E:'#222',B:'#e67e22',T:'#6d4c41',t:'#e1b12c',P:'#4e342e',K:'#222'},g:g=>{g[0]="h.HHHH.h".split('');g[1]="hHHHHHHh".split('');g[2]=".HHHHHH.".split('');g[7]="BTtBBtTB".split('');}},
 {name:'Panda',req:{t:'coins',v:150},pal:{H:'#222',h:'#fff',S:'#fff',E:'#222',B:'#222',T:'#222',t:'#fff',P:'#222',K:'#111'},g:g=>{g[0]=".H....H.".split('');g[1]=".hhhhhh.".split('');g[2]="hhhhhhhh".split('');g[4]=".BEhhEB.".split('');g[6]=".SSBBSS.".split('');}},
 {name:'Wizard',req:{t:'score',v:300},pal:{H:'#6c5ce7',h:'#fdcb6e',S:'#ffdbac',E:'#222',B:'#ecf0f1',T:'#6c5ce7',t:'#fdcb6e',P:'#4834d4',K:'#2d3436'},g:g=>{g[0]="...HH...".split('');g[1]="..HhHH..".split('');g[2]="hhhhhhhh".split('');g[6]=".BBBBBB.".split('');g[7]="TBBBBBBT".split('');}}
];
CHARS.forEach(c=>c.grid=grid(c.g));
function isUnlockedReq(i){const r=CHARS[i].req;if(r.t==='free')return true;if(r.t==='score')return save.best>=r.v;return false;}
function checkUnlocks(){const n=[];CHARS.forEach((c,i)=>{if(!save.unlocked.includes(i)&&isUnlockedReq(i)){save.unlocked.push(i);n.push(i);}});return n;}
function buyChar(i){const r=CHARS[i].req;if(save.unlocked.includes(i))return true;if(r.t==='coins'&&save.coins>=r.v){save.coins-=r.v;save.unlocked.push(i);writeSave();sfx('jingle');return true;}return false;}
function drawPix(g,pal,x,y,px,flip){for(let r=0;r<g.length;r++)for(let c=0;c<8;c++){const ch=g[r][flip?7-c:c];if(ch==='.')continue;cx.fillStyle=pal[ch];cx.fillRect(Math.round(x+c*px),Math.round(y+r*px),Math.ceil(px),Math.ceil(px));}}
// ---------- audio ----------
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended'){const p=AC.resume();if(p&&p.catch)p.catch(()=>{});}return AC;}
function tone(f,d,type,vol,slide,delay){const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,vol,fl,fh,delay){const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<n;i++)dt[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(fl,t);if(fh)f.frequency.exponentialRampToValueAtTime(fh,t+d);const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);}
function sfx(k){if(save.muted)return;try{
 if(k==='chop'){tone(140,.12,'triangle',.5,60);noise(.08,.5,900);}
 else if(k==='crack'){noise(.12,.6,2500,600);tone(300,.06,'square',.15,120);}
 else if(k==='whoosh'){noise(.25,.35,400,2400);}
 else if(k==='death'){tone(400,.6,'sawtooth',.25,60);noise(.3,.5,300,100,.05);}
 else if(k==='jingle'){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'square',.12,0,i*.09));}
 else if(k==='coin'){tone(988,.08,'square',.12);tone(1319,.16,'square',.12,0,.07);}
 else if(k==='click'){tone(660,.05,'square',.1);}
}catch(e){}}
// ---------- themes ----------
const THEMES=[
 {name:'Day',sky:['#6ec6ff','#bfe9ff'],hill:'#5cb85c',hill2:'#3e8e41',ground:'#6b4f2a',snow:false,leaf:null,sun:'#fff4a3'},
 {name:'Sunset',sky:['#ff7e5f','#feb47b'],hill:'#8e5a3c',hill2:'#5d3a2a',ground:'#4e3620',snow:false,leaf:null,sun:'#ffdd77'},
 {name:'Night',sky:['#0b1033','#2a2f6b'],hill:'#1d3b2a',hill2:'#10241a',ground:'#2b2014',snow:false,leaf:null,sun:'#f0f0ff',stars:true},
 {name:'Snow',sky:['#9fb8cc','#e6eef5'],hill:'#f4f8fb',hill2:'#d5e1ea',ground:'#eef3f7',snow:true,leaf:null,sun:'#ffffff'},
 {name:'Autumn',sky:['#f6d38b','#fbeccb'],hill:'#d35400',hill2:'#a04000',ground:'#7a4a1e',snow:false,leaf:'#e67e22',sun:'#fff0b3'}];
// ---------- game state (initialized before first draw) ----------
const MAXT=1;
let G={};
let flakes=[];for(let i=0;i<60;i++)flakes.push({x:Math.random(),y:Math.random(),s:Math.random()*.5+.5});
function makeGen(seed){let s=seed>>>0||1;const rnd=()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};let last=0,run=0;
 return function(){let b=0;const r=rnd();if(last===0){b=r<.72?(rnd()<.5?-1:1):0;}else{ // after a branch
   if(r<.45)b=0;else b=last; // same side allowed; opposite side NEVER directly after (fair)
   if(b!==0&&++run>3){b=0;}}
  if(b===0)run=0;else if(last===0)run=1;
  last=b;const coin=rnd()<.08;return {b,coin,cs:b===0?(rnd()<.5?-1:1):-b};};}
function newGame(){const gen=makeGen((Math.random()*1e9)|0);G={state:G.state==='menu'||!G.state?'menu':'play',gen,tree:[],side:-1,score:0,time:.6,coinsRun:0,combo:0,lastChop:-9,flying:[],drop:0,theme:0,prevTheme:0,themeFade:1,dead:false,deadT:0,squash:1,swing:0,popups:[],shake:0,started:false,newUnlocks:[],deathCause:'',t:0,newBest:false};
 for(let i=0;i<10;i++)G.tree.push(i<2?{b:0,coin:false,cs:1}:gen());}
G.state='menu';newGame();G.state='menu';
// ---------- core logic ----------
function drainRate(){return .18+Math.min(.62,G.score*.0042);}
function chop(side){if(G.state!=='play'||G.dead)return;
 ac();G.started=true;G.side=side;G.swing=1;
 if(G.tree[0].b===side){die('branch');return;}
 const seg=G.tree.shift();G.tree.push(G.gen());G.score++;G.drop=1;
 G.flying.push({x:0,y:0,vx:-side*(380+Math.random()*120),vy:-260-Math.random()*120,r:0,vr:-side*(8+Math.random()*6),b:seg.b,t:0});
 sfx('chop');if(seg.b!==0)sfx('crack');sfx('whoosh');
 if(seg.coin){G.coinsRun++;save.coins++;sfx('coin');G.popups.push({txt:'+1 coin',x:seg.cs,col:'#ffd32a',t:0});}
 G.time=Math.min(MAXT,G.time+Math.max(.035,.085-G.score*.00012));
 const now=G.t;if(now-G.lastChop<.38)G.combo++;else G.combo=1;G.lastChop=now;
 if(G.combo===10||G.combo===25||G.combo%50===0)G.popups.push({txt:'COMBO x'+G.combo+'!',x:0,col:'#ff4757',t:0,big:true});
 if(G.score%50===0){G.prevTheme=G.theme;G.theme=Math.floor(G.score/50)%THEMES.length;G.themeFade=0;sfx('jingle');G.popups.push({txt:G.score+'! '+THEMES[G.theme].name,x:0,col:'#fff',t:0,big:true});}
 if(G.tree[0].b===side){die('branch');}
}
function die(cause){if(G.dead)return;G.dead=true;G.deathCause=cause;G.deadT=0;G.shake=.35;sfx('death');save.games++;
 if(G.score>save.best){save.best=G.score;G.newBest=G.score>0;}if(G.score>save.daily.best)save.daily.best=G.score;
 G.newUnlocks=checkUnlocks();writeSave();}
function startPlay(){G.state='play';newGame();G.state='play';sfx('click');}
// ---------- layout ----------
function L(){const segH=Math.max(26,Math.min(H*.115,60)),trunkW=segH*1.55,groundY=H-Math.max(28,H*.12),cxm=W/2,px=Math.max(3,segH*.11);
 return {segH,trunkW,groundY,cxm,px,branchL:trunkW*1.05,playerOff:trunkW/2+px*8*.75};}
function resize(){DPR=Math.min(3,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cx.setTransform(DPR,0,0,DPR,0,0);cx.imageSmoothingEnabled=false;}
window.addEventListener('resize',resize);resize();
// ---------- buttons ----------
let buttons=[];
function btn(id,x,y,w,h,label,col,fn){buttons.push({id,x,y,w,h,fn});cx.fillStyle=col||'rgba(0,0,0,.45)';rr(x,y,w,h,Math.min(12,h/3));cx.fill();cx.fillStyle='#fff';cx.font='bold '+Math.round(h*.42)+'px system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(label,x+w/2,y+h/2+1);}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
let selIdx=save.char;
// ---------- input ----------
function handlePoint(x,y){ac();for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return;}}
 if(G.state==='play'&&!G.dead){chop(x<W/2?-1:1);}else if(G.state==='menu'){startPlay();}else if(G.state==='over'&&G.deadT>.9){startPlay();}else if(G.state==='paused'){G.state='play';}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();handlePoint(e.clientX,e.clientY);},{passive:false});
cv.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(e.repeat)return;
 if(k==='arrowleft'||k==='a'){e.preventDefault();if(G.state==='play')chop(-1);else if(G.state==='chars')selIdx=(selIdx+7)%8;else if(G.state==='menu')startPlay();}
 else if(k==='arrowright'||k==='d'){e.preventDefault();if(G.state==='play')chop(1);else if(G.state==='chars')selIdx=(selIdx+1)%8;else if(G.state==='menu')startPlay();}
 else if(k==='p'){if(G.state==='play'&&!G.dead)G.state='paused';else if(G.state==='paused')G.state='play';}
 else if(k==='r'){startPlay();}
 else if(k==='m'){save.muted=!save.muted;writeSave();}
 else if((k===' '||k==='enter')&&(G.state==='menu'||(G.state==='over'&&G.deadT>.9)))startPlay();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play'&&!G.dead)G.state='paused';});
// ---------- update ----------
function update(dt){G.t+=dt;G.themeFade=Math.min(1,G.themeFade+dt*1.2);
 flakes.forEach(f=>{f.y+=dt*.08*f.s;f.x+=Math.sin(G.t+f.s*9)*dt*.02;if(f.y>1){f.y=0;f.x=Math.random();}});
 if(G.state==='paused'||G.state==='chars')return;
 G.drop=Math.max(0,G.drop-dt*9);G.swing=Math.max(0,G.swing-dt*7);G.shake=Math.max(0,G.shake-dt);
 G.flying.forEach(f=>{f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=1400*dt;f.r+=f.vr*dt;});G.flying=G.flying.filter(f=>f.t<1.5);
 G.popups.forEach(p=>p.t+=dt);G.popups=G.popups.filter(p=>p.t<1.3);
 if(G.state==='play'){if(G.dead){G.deadT+=dt;G.squash=Math.max(.25,1-G.deadT*5);if(G.deadT>.7)G.state='over';}
  else if(G.started){G.time-=drainRate()*dt;if(G.time<=0){G.time=0;die('time');}}}
 else if(G.state==='over'){G.deadT+=dt;}}
// ---------- draw ----------
function lerpCol(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=((pa>>16)*(1-t)+(pb>>16)*t)|0,g=(((pa>>8)&255)*(1-t)+((pb>>8)&255)*t)|0,bl=((pa&255)*(1-t)+(pb&255)*t)|0;return 'rgb('+r+','+g+','+bl+')';}
function drawBG(l){const a=THEMES[G.prevTheme],b=THEMES[G.theme],f=G.themeFade;const T=f<1?null:b;
 const gr=cx.createLinearGradient(0,0,0,H);gr.addColorStop(0,lerpCol(a.sky[0],b.sky[0],f));gr.addColorStop(1,lerpCol(a.sky[1],b.sky[1],f));cx.fillStyle=gr;cx.fillRect(0,0,W,H);
 if(b.stars&&f>.3){cx.fillStyle='rgba(255,255,255,'+(f*.9)+')';for(let i=0;i<50;i++){const x=(i*137.5%1)*W||((i*7919)%W),y=((i*97)%100)/100*H*.55;cx.fillRect((i*131)%W,y,2,2);}}
 cx.fillStyle=lerpCol(a.sun,b.sun,f);cx.beginPath();cx.arc(W*.82,H*.2,Math.min(W,H)*.08,0,7);cx.fill();
 cx.fillStyle=lerpCol(a.hill2,b.hill2,f);cx.beginPath();cx.moveTo(0,l.groundY);for(let x=0;x<=W;x+=20)cx.lineTo(x,l.groundY-H*.22-Math.sin(x*.008)*H*.06-Math.sin(x*.021)*H*.03);cx.lineTo(W,l.groundY);cx.fill();
 cx.fillStyle=lerpCol(a.hill,b.hill,f);cx.beginPath();cx.moveTo(0,l.groundY);for(let x=0;x<=W;x+=20)cx.lineTo(x,l.groundY-H*.1-Math.sin(x*.012+2)*H*.04);cx.lineTo(W,l.groundY);cx.fill();
 cx.fillStyle=lerpCol(a.ground,b.ground,f);cx.fillRect(0,l.groundY,W,H-l.groundY);
 cx.fillStyle='rgba(0,0,0,.12)';cx.fillRect(0,l.groundY,W,4);
 if(b.snow){cx.fillStyle='rgba(255,255,255,'+f+')';flakes.forEach(fl=>{cx.fillRect(fl.x*W,fl.y*H,3*fl.s,3*fl.s);});}
 if(b.leaf){cx.fillStyle='rgba(230,126,34,'+f+')';flakes.forEach((fl,i)=>{if(i%2)return;cx.save();cx.translate(fl.x*W,fl.y*H);cx.rotate(G.t*2+i);cx.fillRect(-4,-2,8,4);cx.restore();});}}
function drawLog(x,y,w,h,branch,coin,cs,l){cx.fillStyle='#8a5a2b';cx.fillRect(x-w/2,y,w,h);cx.fillStyle='#6e4520';
 for(let i=0;i<4;i++)cx.fillRect(x-w/2+w*(.12+i*.22),y+2,w*.06,h-4);cx.fillStyle='#a8743f';cx.fillRect(x-w/2,y,w,3);cx.fillStyle='#5a3818';cx.fillRect(x-w/2,y+h-2,w,2);
 if(branch){const bx=branch<0?x-w/2-l.branchL:x+w/2,bh=h*.32,by=y+h*.35;cx.fillStyle='#7a4e24';cx.fillRect(bx,by,l.branchL,bh);cx.fillStyle='#5a3818';cx.fillRect(bx,by+bh-3,l.branchL,3);
  cx.fillStyle=THEMES[G.theme].snow?'#e8f1f7':(THEMES[G.theme].leaf?'#e67e22':'#2e8b3a');const tip=branch<0?bx:bx+l.branchL;cx.beginPath();cx.arc(tip,by,h*.38,0,7);cx.arc(tip+(branch<0?h*.35:-h*.35),by-h*.15,h*.3,0,7);cx.fill();}
 if(coin){const ccx=x+cs*(w/2+h*.35),ccy=y+h*.5;cx.fillStyle='#ffd32a';cx.beginPath();cx.arc(ccx,ccy,h*.22,0,7);cx.fill();cx.fillStyle='#e1a400';cx.fillRect(ccx-h*.05,ccy-h*.12,h*.1,h*.24);}}
function drawPlayer(l){const ch=CHARS[save.char];const px=l.px,pw=8*px,ph=13*px;const x=l.cxm+G.side*l.playerOff-pw/2+(G.side<0?-px*2:px*2),y=l.groundY-ph;
 if(G.dead&&G.deadT>.25){ // tombstone
  const tx=l.cxm+G.side*l.playerOff,tw=pw*.9,th=ph*.75;cx.fillStyle='#7f8c8d';cx.beginPath();cx.moveTo(tx-tw/2,l.groundY);cx.lineTo(tx-tw/2,l.groundY-th+tw/2);cx.arc(tx,l.groundY-th+tw/2,tw/2,Math.PI,0);cx.lineTo(tx+tw/2,l.groundY);cx.fill();
  cx.fillStyle='#596566';cx.fillRect(tx-px*.5,l.groundY-th+px*2,px,px*4);cx.fillRect(tx-px*1.6,l.groundY-th+px*3,px*3.2,px);cx.fillStyle='#fff';cx.font='bold '+Math.round(px*2)+'px monospace';cx.textAlign='center';cx.fillText('RIP',tx,l.groundY-th*.3);return;}
 cx.save();const sq=G.dead?G.squash:1;cx.translate(x+pw/2,l.groundY);cx.scale(G.dead?1+(1-sq)*.6:1,sq);cx.translate(-pw/2,-ph);
 drawPix(ch.grid,ch.pal,0,0,px,G.side>0);
 // axe

 G.popups.forEach(p=>{const a=1-p.t/1.3;cx.globalAlpha=Math.max(0,a);cx.textAlign='center';cx.fillStyle=p.col;cx.font='900 '+Math.round(H*(p.big?.08:.05))+'px system-ui';const x=l.cxm+p.x*(l.trunkW*1.4),y=H*.42-p.t*60;cx.strokeStyle='rgba(0,0,0,.6)';cx.lineWidth=4;cx.strokeText(p.txt,x,y);cx.fillText(p.txt,x,y);cx.globalAlpha=1;});
 // tap hints
