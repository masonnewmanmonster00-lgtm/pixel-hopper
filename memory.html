<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b14">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Memory Match</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0b14;color:#fff;font-family:ui-monospace,monospace;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#pauseBtn{position:fixed;z-index:40;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:46px;height:46px;border-radius:12px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);color:#fff;font:700 16px/1 ui-monospace,monospace;touch-action:none}
a.back{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:80;display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(8,8,16,.82);color:#ffe14d;border:1px solid rgba(255,225,77,.55);font:700 12px/1 ui-monospace,monospace;letter-spacing:.04em;text-decoration:none;touch-action:manipulation}
a.back:focus-visible{outline:2px solid #ffe14d;outline-offset:2px}
</style>
</head>
<body>
<a class="back" href="./index.html" aria-label="Back to menu" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">← Menu</a>
<canvas id="c"></canvas>
<div id="pauseBtn" aria-label="Pause">II</div>
<script>
"use strict";
const KEY="arcade-memory-best";
const LEVELS=[{cols:4,rows:3,time:48},{cols:4,rows:4,time:60},{cols:5,rows:4,time:72}];
const SYMS=["sun","moon","star","gem","bolt","heart","drop","leaf","crown","eye"];
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let W=800,H=450,DPR=1;
let state="title",score=0,best=0,level=1,time=48,combo=0,sel=0,clock=0,playT=0,shake=0,lock=false,resolveAt=0,matched=false,pending=[],cards=[],won=false,banner=0,moves=0,parts=[];
try{best=+localStorage.getItem(KEY)||0}catch(e){}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.max(1,W*DPR)|0;cv.height=Math.max(1,H*DPR)|0;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;const t=a[i];a[i]=a[j];a[j]=t}return a}
function build(){
  const spec=LEVELS[level-1];
  const n=spec.cols*spec.rows/2;
  const syms=shuffle(SYMS.slice()).slice(0,n);
  cards=shuffle(syms.concat(syms)).map(sym=>({sym,open:false,gone:false,flip:0}));
  time=spec.time;sel=0;lock=false;pending=[];combo=0;moves=0;banner=1.3;
}
function grid(){
  const spec=LEVELS[Math.min(LEVELS.length,level)-1];
  const cols=spec.cols,rows=spec.rows,top=64,bot=26,side=16,gap=8;
  const aw=W-side*2,ah=Math.max(40,H-top-bot);
  let cw=aw/cols,ch=ah/rows;
  if(cw/ch>0.86)cw=ch*0.86;else ch=cw/0.86;
  const gw=cw*cols,gh=ch*rows,x0=(W-gw)/2,y0=top+(ah-gh)/2,rects=[];
  for(let i=0;i<cols*rows;i++){
    const c=i%cols,r=(i/cols)|0;
    rects.push({x:x0+c*cw+gap/2,y:y0+r*ch+gap/2,w:Math.max(4,cw-gap),h:Math.max(4,ch-gap)});
  }
  return {cols,rows,rects};
}
function hitCard(x,y){
  const {rects}=grid();
  for(let i=0;i<rects.length;i++){const r=rects[i];if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return i}
  return -1;
}
let AC=null,master=null;
function audio(){if(AC)return AC;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.2;master.connect(AC.destination)}catch(e){AC=null}return AC}
function tone(freq,dur,type,vol,slide){try{const a=audio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type||"square";o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);g.gain.setValueAtTime(vol||0.06,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02)}catch(e){}}
function noise(dur,vol){try{const a=audio();if(!a)return;const n=Math.max(1,a.sampleRate*dur|0),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain();s.buffer=buf;g.gain.value=vol||0.12;s.connect(g);g.connect(master);s.start()}catch(e){}}
function addScore(n){score+=n;if(score>best){best=score;try{localStorage.setItem(KEY,String(best))}catch(e){}}}
function burst(x,y,col){for(let i=0;i<16;i++){const a=Math.random()*6.283,s=40+Math.random()*110;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0.45+Math.random()*0.3,m:0.6,col,sz:2+Math.random()*2.5})}}
function flipCard(i){
  if(state!=="play"||lock)return;
  const card=cards[i];if(!card||card.gone||card.open)return;
  card.open=true;pending.push(i);moves++;sel=i;tone(660+i*20,0.06,"square",0.04,180);
  if(pending.length===2){
    lock=true;const [a,b]=pending;
    matched=cards[a].sym===cards[b].sym;
    resolveAt=playT+(matched?0.32:0.62);
    if(!matched){shake=7;noise(0.12,0.12);tone(180,0.12,"sawtooth",0.04)}
  }
}
function resolve(){
  const [a,b]=pending;
  if(matched){
    cards[a].gone=true;cards[b].gone=true;combo++;
    const {rects}=grid();
    addScore(100+combo*30+Math.ceil(time));
    burst(rects[a].x+rects[a].w/2,rects[a].y+rects[a].h/2,"#ffe14d");
    burst(rects[b].x+rects[b].w/2,rects[b].y+rects[b].h/2,"#7dfff0");
    tone(784,0.08,"square",0.05);tone(1047,0.12,"square",0.05);
    if(cards.every(c=>c.gone)){
      if(level>=LEVELS.length){won=true;gameOver()}
      else{level++;build();banner=1.4;tone(523,0.1,"square",0.05);tone(659,0.1,"square",0.05);tone(880,0.16,"square",0.05)}
    }
  }else{cards[a].open=false;cards[b].open=false;combo=0}
  pending=[];lock=false;
}
function start(){audio();score=0;level=1;won=false;parts.length=0;build();state="play"}
function restart(){start()}
function gameOver(){if(state==="over")return;state="over";if(score>best){best=score;try{localStorage.setItem(KEY,String(best))}catch(e){}}if(!won){tone(392,0.2,"triangle",0.05,-80);tone(262,0.3,"triangle",0.05,-40)}}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function symbol(sym,cx,cy,s){
  ctx.save();ctx.translate(cx,cy);ctx.lineWidth=Math.max(2,s*0.08);ctx.lineJoin="round";ctx.lineCap="round";
  if(sym==="sun"){ctx.strokeStyle="#ffb020";ctx.fillStyle="#ffe14d";ctx.beginPath();ctx.arc(0,0,s*0.22,0,7);ctx.fill();for(let i=0;i<8;i++){const a=i/8*6.283;ctx.beginPath();ctx.moveTo(Math.cos(a)*s*0.32,Math.sin(a)*s*0.32);ctx.lineTo(Math.cos(a)*s*0.48,Math.sin(a)*s*0.48);ctx.stroke()}}
  else if(sym==="moon"){ctx.fillStyle="#dce8ff";ctx.beginPath();ctx.arc(0,0,s*0.38,0.7,5.7);ctx.arc(s*0.16,-s*0.04,s*0.3,5.5,0.9,true);ctx.closePath();ctx.fill()}
  else if(sym==="star"){ctx.fillStyle="#ffe14d";ctx.beginPath();for(let i=0;i<5;i++){const a=-Math.PI/2+i/5*6.283,b=a+Math.PI/5;ctx.lineTo(Math.cos(a)*s*0.46,Math.sin(a)*s*0.46);ctx.lineTo(Math.cos(b)*s*0.2,Math.sin(b)*s*0.2)}ctx.closePath();ctx.fill()}
  else if(sym==="gem"){const g=ctx.createLinearGradient(-s,-s,s,s);g.addColorStop(0,"#b7f3ff");g.addColorStop(1,"#3a7bff");ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-s*0.46);ctx.lineTo(s*0.36,-s*0.1);ctx.lineTo(0,s*0.48);ctx.lineTo(-s*0.36,-s*0.1);ctx.closePath();ctx.fill()}
  else if(sym==="bolt"){ctx.fillStyle="#ffe14d";ctx.beginPath();ctx.moveTo(s*0.12,-s*0.48);ctx.lineTo(-s*0.28,s*0.05);ctx.lineTo(-s*0.02,s*0.05);ctx.lineTo(-s*0.16,s*0.48);ctx.lineTo(s*0.3,-s*0.08);ctx.lineTo(s*0.02,-s*0.08);ctx.closePath();ctx.fill()}
  else if(sym==="heart"){ctx.fillStyle="#ff5d8a";ctx.beginPath();ctx.moveTo(0,s*0.4);ctx.bezierCurveTo(-s*0.55,s*0.05,-s*0.4,-s*0.45,0,-s*0.12);ctx.bezierCurveTo(s*0.4,-s*0.45,s*0.55,s*0.05,0,s*0.4);ctx.fill()}
  else if(sym==="drop"){const g=ctx.createLinearGradient(0,-s,0,s);g.addColorStop(0,"#9fd3ff");g.addColorStop(1,"#2f6cff");ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-s*0.46);ctx.bezierCurveTo(s*0.42,-s*0.05,s*0.32,s*0.42,0,s*0.42);ctx.bezierCurveTo(-s*0.32,s*0.42,-s*0.42,-s*0.05,0,-s*0.46);ctx.fill()}
  else if(sym==="leaf"){ctx.fillStyle="#5dE08a";ctx.beginPath();ctx.moveTo(0,s*0.46);ctx.bezierCurveTo(s*0.6,s*0.1,s*0.3,-s*0.5,0,-s*0.2);ctx.bezierCurveTo(-s*0.55,-s*0.15,-s*0.2,s*0.2,0,s*0.46);ctx.fill();ctx.strokeStyle="#e7ffe8";ctx.beginPath();ctx.moveTo(0,s*0.36);ctx.quadraticCurveTo(s*0.05,0,0,-s*0.16);ctx.stroke()}
  else if(sym==="crown"){ctx.fillStyle="#ffe14d";ctx.beginPath();ctx.moveTo(-s*0.42,s*0.28);ctx.lineTo(-s*0.42,-s*0.05);ctx.lineTo(-s*0.2,s*0.08);ctx.lineTo(0,-s*0.4);ctx.lineTo(s*0.2,s*0.08);ctx.lineTo(s*0.42,-s*0.05);ctx.lineTo(s*0.42,s*0.28);ctx.closePath();ctx.fill();ctx.fillStyle="#ff8d4a";for(const x of[-s*0.3,0,s*0.3]){ctx.beginPath();ctx.arc(x,-s*0.02,s*0.06,0,7);ctx.fill()}}
  else{ctx.fillStyle="#efe7ff";ctx.beginPath();ctx.ellipse(0,0,s*0.42,s*0.28,0,0,7);ctx.fill();ctx.fillStyle="#241848";ctx.beginPath();ctx.arc(s*0.08,0,s*0.14,0,7);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(s*0.12,-s*0.04,s*0.05,0,7);ctx.fill()}
  ctx.restore();
}
function drawCard(card,r,on){
  const cx=r.x+r.w/2,cy=r.y+r.h/2;
  const sc=Math.max(0.04,Math.abs(Math.cos(card.flip*Math.PI)));
  ctx.save();ctx.translate(cx,cy);ctx.scale(sc,1);ctx.translate(-cx,-cy);
  if(card.gone)ctx.globalAlpha=0.18;
  roundRect(r.x,r.y,r.w,r.h,Math.min(16,r.w*0.12));
  if(card.flip>0.5&&!card.gone){
    const g=ctx.createLinearGradient(r.x,r.y,r.x,r.y+r.h);
    g.addColorStop(0,"#f7f4ff");g.addColorStop(1,"#c9d0ea");ctx.fillStyle=g;ctx.fill();
    symbol(card.sym,cx,cy,Math.min(r.w,r.h)*0.72);
  }else{
    const g=ctx.createLinearGradient(r.x,r.y,r.x+r.w,r.y+r.h);
    g.addColorStop(0,"#ffe68a");g.addColorStop(0.5,"#f0a422");g.addColorStop(1,"#b86a10");
    ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.45)";ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.28)";
    ctx.beginPath();ctx.moveTo(cx,cy-r.h*0.16);ctx.lineTo(cx+r.w*0.12,cy);ctx.lineTo(cx,cy+r.h*0.16);ctx.lineTo(cx-r.w*0.12,cy);ctx.fill();
  }
  ctx.restore();ctx.globalAlpha=1;
  if(on){ctx.strokeStyle="#7dfff0";ctx.lineWidth=3;roundRect(r.x-2,r.y-2,r.w+4,r.h+4,12);ctx.stroke()}
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,"#16122e");bg.addColorStop(0.5,"#0d1024");bg.addColorStop(1,"#081018");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(let i=0;i<24;i++){const a=(i*47)%W,b=(i*89)%H;ctx.fillStyle="rgba(255,255,255,.25)";ctx.fillRect(a,b,2,2)}
  ctx.save();ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  if(state!=="title"&&cards.length){
    const {rects}=grid();
    cards.forEach((card,i)=>drawCard(card,rects[i],state==="play"&&i===sel));
  }
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,7);ctx.fill()}
  ctx.globalAlpha=1;ctx.restore();
  ctx.textAlign="left";ctx.font="700 16px ui-monospace,monospace";ctx.fillStyle="#ffe14d";
  ctx.fillText(String(score).padStart(6,"0"),96,28);
  ctx.font="700 12px ui-monospace,monospace";ctx.fillStyle="#9fd3ff";ctx.fillText("BEST "+best,96,46);
  ctx.fillStyle="#fff";ctx.fillText("LV "+level,214,28);
  if(state==="play"||state==="pause"){ctx.fillStyle=time<8?"#ff6b6b":"#fff";ctx.fillText(time.toFixed(1)+"s",214,46);ctx.fillStyle="#c8c4d8";ctx.fillText("x"+combo,280,46)}
  if(banner>0&&state==="play"){ctx.textAlign="center";ctx.font="700 22px ui-monospace,monospace";ctx.fillStyle="#ffe14d";ctx.shadowColor="#ffe14d";ctx.shadowBlur=12;ctx.fillText("LEVEL "+level,W/2,58);ctx.shadowBlur=0}
  if(state==="title"||state==="over"){
    ctx.fillStyle="rgba(6,6,16,.68)";ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";ctx.font="700 40px ui-monospace,monospace";ctx.shadowColor="#ffe14d";ctx.shadowBlur=18;ctx.fillStyle="#ffe14d";
    ctx.fillText(state==="title"?"MEMORY MATCH":won?"CLEARED":"TIME UP",W/2,H*0.4);ctx.shadowBlur=0;
    ctx.font="700 15px ui-monospace,monospace";ctx.fillStyle="#fff";
    if(state==="over")ctx.fillText("SCORE "+score+"    BEST "+best,W/2,H*0.4+34);
    ctx.fillStyle="#c8c4d8";ctx.fillText(state==="title"?"Flip the pairs before the clock runs out":won?"Every pair found":"The board ran out of time",W/2,H*0.4+(state==="over"?62:40));
    ctx.fillStyle="#9fd3ff";ctx.fillText("Arrows move    Enter flip    tap a card",W/2,H*0.4+90);
    if(Math.sin(clock*4)>0){ctx.fillStyle="#ffe14d";ctx.fillText(state==="title"?"TAP OR PRESS ENTER":"TAP OR ENTER TO PLAY AGAIN",W/2,H*0.4+120)}
  }
  if(state==="pause"){ctx.fillStyle="rgba(4,6,16,.55)";ctx.fillRect(0,0,W,H);ctx.textAlign="center";ctx.font="700 36px ui-monospace,monospace";ctx.fillStyle="#ffe14d";ctx.fillText("PAUSED",W/2,H/2);ctx.font="700 14px ui-monospace,monospace";ctx.fillStyle="#fff";ctx.fillText("P resume    R restart",W/2,H/2+32)}
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.033,(now-last)/1000);last=now;clock+=dt;
  try{
    if(state==="play"){
      playT+=dt;time-=dt;if(banner>0)banner-=dt;
      if(time<=0){time=0;won=false;gameOver()}
      for(const card of cards){const target=card.open||card.gone?1:0;card.flip+=(target-card.flip)*Math.min(1,dt*12)}
      if(lock&&playT>=resolveAt)resolve();
    }
    for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=20*dt;p.l-=dt}
    parts=parts.filter(p=>p.l>0);shake*=Math.exp(-3.4*dt);
    draw();
  }catch(e){console.error(e)}
}
requestAnimationFrame(frame);
function togglePause(){if(state==="play")state="pause";else if(state==="pause")state="play"}
function moveSel(dc,dr){
  if(state!=="play"||!cards.length)return;
  const cols=LEVELS[level-1].cols;
  let c=sel%cols,r=(sel/cols)|0;
  c=Math.max(0,Math.min(cols-1,c+dc));r=Math.max(0,Math.min(LEVELS[level-1].rows-1,r+dr));
  sel=r*cols+c;
}
addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code))e.preventDefault();
  audio();
  if(e.repeat)return;
  if(e.code==="KeyP"||e.code==="Escape")togglePause();
  if(e.code==="KeyR")restart();
  if(e.code==="ArrowLeft")moveSel(-1,0);
  if(e.code==="ArrowRight")moveSel(1,0);
  if(e.code==="ArrowUp")moveSel(0,-1);
  if(e.code==="ArrowDown")moveSel(0,1);
  if(e.code==="Enter"||e.code==="Space"){if(state==="title"||state==="over")start();else if(state==="play")flipCard(sel)}
});
cv.addEventListener("pointerdown",e=>{
  audio();
  const rect=cv.getBoundingClientRect();
  const x=(e.clientX-rect.left)/rect.width*W,y=(e.clientY-rect.top)/rect.height*H;
  if(state==="title"||state==="over"){start();return}
  if(state!=="play")return;
  const i=hitCard(x,y);if(i>=0)flipCard(i);
});
document.getElementById("pauseBtn").addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();audio();togglePause()});
</script>
</body>
</html>
