<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Sound Lab</title>
<style>
:root{--bg:#0f1530;--card:#1b2350;--ink:#f4f6ff;--mut:#9aa6d8;--acc:#ffd34d;--good:#3ddc84;--bad:#ff5c7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,#2a3480,var(--bg) 60%);color:var(--ink);min-height:100vh;user-select:none;-webkit-user-select:none;overflow-x:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0008;position:sticky;top:0;z-index:5;backdrop-filter:blur(4px)}
header a{color:var(--ink);text-decoration:none;background:#fff1;padding:6px 12px;border-radius:20px;font-weight:bold}
header h1{font-size:20px;margin:0;flex:1;color:var(--acc);text-shadow:0 2px 0 #0006}
.pill{background:#fff1;padding:5px 10px;border-radius:14px;font-size:14px}
main{max-width:980px;margin:0 auto;padding:14px}
.btn{font:inherit;font-weight:bold;border:0;border-radius:14px;padding:10px 16px;background:var(--acc);color:#111;cursor:pointer;box-shadow:0 4px 0 #0007;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}.btn.alt{background:#2c3770;color:var(--ink)}.btn.sel{outline:3px solid #fff}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 6px 18px #0005;border:2px solid #ffffff10}
.tile{cursor:pointer;transition:transform .15s}.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile .em{font-size:40px}.tile h3{margin:6px 0}.tile p{margin:0;color:var(--mut);font-size:14px}
.stars{color:#ffd34d;letter-spacing:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{min-height:28px;font-weight:bold;font-size:18px;margin:8px 0}
.opt{display:block;width:100%;margin:6px 0;text-align:left;background:#2c3770;color:var(--ink)}
.opt.ok{background:var(--good);color:#111}.opt.no{background:var(--bad)}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.12)}}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
.bar{height:10px;background:#fff2;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);transition:width .3s}
.fact{background:#ffd34d22;border-left:4px solid #ffd34d;padding:8px 12px;border-radius:8px;margin:8px 0}
svg text{font-family:inherit}
</style></head><body>
<header><a href="./index.html">← Learning Lab</a><h1>Sound Lab</h1><span class="pill" id="starTotal">⭐ 0</span><button class="btn alt" id="snd" style="padding:6px 10px">🔊</button></header>
<main id="app"></main><canvas id="fx"></canvas>
<script>
// ---- shared helpers ----
const $=s=>document.querySelector(s),app=$('#app');
const SAVEKEY='soundlab_v1';let SAVE=JSON.parse(localStorage.getItem(SAVEKEY)||'{}');SAVE.stars=SAVE.stars||{};SAVE.best=SAVE.best||{};
function save(){localStorage.setItem(SAVEKEY,JSON.stringify(SAVE));$('#starTotal').textContent='⭐ '+Object.values(SAVE.stars).reduce((a,b)=>a+b,0)}
let AC=null,muted=!!SAVE.muted;$('#snd').textContent=muted?'🔇':'🔊';
$('#snd').onclick=()=>{muted=!muted;SAVE.muted=muted;save();$('#snd').textContent=muted?'🔇':'🔊'};
function tone(f,d=.12,type='sine',v=.15,slide=0,delay=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d=.4,v=.2,lp=800){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=lp;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}catch(e){}}
const SFX={click:()=>tone(660,.05,'square',.06),good:()=>{tone(523,.1,'triangle');tone(784,.15,'triangle',.15,0,.08)},bad:()=>tone(200,.25,'sawtooth',.08,-80),
win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.15,0,i*.1)),pick:()=>tone(440,.06,'sine',.1,200),drop:()=>tone(330,.08,'sine',.12,-100)};
// confetti
const cv=$('#fx'),cx=cv.getContext('2d');let fxp=[];function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
function confetti(x=innerWidth/2,y=innerHeight/3,n=60){for(let i=0;i<n;i++)fxp.push({x,y,vx:(Math.random()-.5)*10,vy:-Math.random()*9-2,c:`hsl(${Math.random()*360},90%,60%)`,l:90});}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);fxp=fxp.filter(p=>p.l-->0);for(const p of fxp){p.vy+=.3;p.x+=p.vx;p.y+=p.vy;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,7,7)}requestAnimationFrame(loop)})();
function flash(el,ok){el.classList.remove('pop','shake');void el.offsetWidth;el.classList.add(ok?'pop':'shake')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function starStr(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function award(id,n){if((SAVE.stars[id]||0)<n)SAVE.stars[id]=n;save()}
// generic timed quiz: qs=[{q,opts,a,fact}] ; a is correct string
let __QZ=0;function runQuiz(id,title,qs,secs,back){let i=0,score=0,t=secs,timer;const tok=++__QZ;clearInterval(window.__qt);const alive=()=>tok===__QZ&&!!document.getElementById("qz"+tok);qs=shuffle(qs).slice(0,10);
 function end(){clearInterval(timer);if(!alive())return;const st=score>=9?3:score>=7?2:score>=5?1:0;award(id,st);if(score>(SAVE.best[id]||0))SAVE.best[id]=score;save();if(st)SFX.win(),confetti();
  app.innerHTML=`<div class="card" style="text-align:center"><h2>${title} — done!</h2><div style="font-size:48px" class="stars">${starStr(st)}</div><p>You got <b>${score}/${qs.length}</b>. Best: ${SAVE.best[id]}</p><div class="row" style="justify-content:center"><button class="btn" id="ag">Play again</button><button class="btn alt" id="bk">Back</button></div></div>`;$('#ag').onclick=()=>runQuiz(id,title,qs,secs,back);$('#bk').onclick=back}
 function show(){if(i>=qs.length)return end();const q=qs[i];app.innerHTML=`<div class="card" id="qz${tok}"><div class="row"><b style="flex:1">${title} · Q${i+1}/${qs.length}</b>${secs?`<span class="pill">⏱ <span id="tm">${t}</span>s</span>`:''}<span class="pill">✅ ${score}</span></div><div class="bar" style="margin:8px 0"><i style="width:${i/qs.length*100}%"></i></div>${q.svg||''}<h2>${q.q}</h2><div id="os"></div><div class="fb" id="fb"></div></div>`;
  shuffle(q.opts).forEach(o=>{const b=document.createElement('button');b.className='btn opt';b.innerHTML=o;b.onclick=()=>{if(b.parentNode.dataset.done)return;b.parentNode.dataset.done=1;const ok=o==q.a;if(ok){score++;SFX.good();confetti(innerWidth/2,innerHeight/2,20)}else SFX.bad();[...$('#os').children].forEach(x=>{if(x.innerHTML==q.a)x.classList.add('ok')});if(!ok)b.classList.add('no');flash(b,ok);$('#fb').innerHTML=(ok?'✅ Correct! ':'❌ Not quite. ')+(q.fact?`<div class="fact">💡 ${q.fact}</div>`:'');setTimeout(()=>{if(!alive())return;i++;show()},q.fact?2200:1100)};$('#os').appendChild(b)})}
 if(secs)window.__qt=timer=setInterval(()=>{if(!alive()){clearInterval(timer);return}t--;const e=$('#tm');if(e)e.textContent=t;if(t<=5&&t>0)tone(880,.05);if(t<=0)end()},1000);show()}
save();
</script>
<script>
// ===== Sound Lab =====
function txt(g,s,x,y,c='#e4e8ff',sz=14,al='center'){g.fillStyle=c;g.font=`bold ${sz}px Trebuchet MS`;g.textAlign=al;g.fillText(s,x,y)}
function ac(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();return AC}
// play a held voice; returns {stop,set}
let VOICE=null,AN=null;
function analyser(){const a=ac();if(!AN){AN=a.createAnalyser();AN.fftSize=2048;AN.connect(a.destination)}return AN}
function voice(f,type='sine',vol=.25,dur=0){stopVoice();if(muted)return null;try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime);g.gain.linearRampToValueAtTime(vol,a.currentTime+.03);o.connect(g);g.connect(analyser());o.start();
 VOICE={o,g,stop(){try{g.gain.setTargetAtTime(0,a.currentTime,.03);o.stop(a.currentTime+.2)}catch(e){}}};if(dur)setTimeout(()=>{if(VOICE&&VOICE.o==o)stopVoice()},dur*1000);return VOICE}catch(e){return null}}
function stopVoice(){if(VOICE){VOICE.stop();VOICE=null}}
function pluck(f,dur=1.2,vol=.3,delay=0){if(muted)return;try{const a=ac(),t=a.currentTime+delay;[1,2,3,4].forEach((h,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f*h;g.gain.setValueAtTime(vol/(h*h)*1.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur/h);o.connect(g);g.connect(analyser());o.start(t);o.stop(t+dur)})}catch(e){}}
function bottle(f,dur=.8,delay=0){if(muted)return;try{const a=ac(),t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(analyser());o.start(t);o.stop(t+dur)}catch(e){}}
const NOTE=(n)=>440*Math.pow(2,(n-69)/12);const NN=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const cents=(a,b)=>1200*Math.log2(a/b);
function waveDraw(g,W,H,f,amp,type,t,col='#ffd34d',scale=1){g.strokeStyle=col;g.lineWidth=3;g.beginPath();const cyc=f/110*scale;for(let x=0;x<=W;x+=2){const ph=(x/W*cyc+t*.4)%1;let y;
 if(type=='sine')y=Math.sin(ph*6.283);else if(type=='square')y=ph<.5?1:-1;else if(type=='triangle')y=ph<.5?4*ph-1:3-4*ph;else y=2*ph-1;
 const yy=H/2-y*amp*(H/2-10);x?g.lineTo(x,yy):g.moveTo(x,yy)}g.stroke()}
const TOP=[
{k:'vib',em:'〰️',n:'Sound is vibration',d:'Every sound starts with something <b>vibrating</b>: a guitar string, a drum skin, your vocal cords. The vibration pushes air particles together and pulls them apart, sending a wave of <b>compressions</b> and <b>rarefactions</b> outward.',f:'Sound needs a material (a <b>medium</b>) like air, water or steel to travel through. In the vacuum of space there is no sound at all.',x:'Your eardrum vibrates when the sound wave hits it, and your brain turns those vibrations into sound.'},
{k:'pitch',em:'🎵',n:'Pitch and frequency',d:'<b>Frequency</b> is how many vibrations happen each second, measured in <b>hertz (Hz)</b>. Faster vibrations = higher <b>pitch</b>.',f:'Humans can hear about 20 Hz to 20,000 Hz. Dogs hear higher, up to around 45,000 Hz, and bats use up to about 200,000 Hz!',x:'Doubling the frequency raises the pitch by one <b>octave</b>. The A above middle C is 440 Hz, and the next A up is 880 Hz.'},
{k:'amp',em:'🔊',n:'Volume and amplitude',d:'<b>Amplitude</b> is how big the vibration is. A bigger amplitude makes a <b>louder</b> sound. Loudness is measured in <b>decibels (dB)</b>.',f:'Whisper ≈ 30 dB, talking ≈ 60 dB, a lawnmower ≈ 90 dB. Sounds above about 85 dB for a long time can damage your hearing.',x:'Every +10 dB sounds roughly twice as loud to us.'},
{k:'wave',em:'📈',n:'Waveforms and timbre',d:'Two instruments can play the same note and still sound different. The <b>shape</b> of the wave (its <b>timbre</b>, said "TAM-ber") changes the sound.',f:'A pure sine wave sounds smooth like a flute. Square and sawtooth waves have extra higher frequencies (overtones), so they sound buzzy.',x:'Your voice has its own unique timbre. That is how you can recognise a friend on the phone.'},
{k:'echo',em:'🏔️',n:'Echoes',d:'An <b>echo</b> is sound that bounces off a hard surface and comes back to you. Hard, smooth surfaces reflect sound well. Soft things like curtains absorb it.',f:'Distance to a wall = speed of sound × echo time ÷ 2 (the sound goes there AND back). In air: 343 m/s.',x:'Bats and dolphins use <b>echolocation</b>, and ships use sonar, to find things by listening to echoes.'},
{k:'inst',em:'🎸',n:'How instruments work',d:'<b>Strings</b> vibrate (guitar, violin). <b>Wind</b> instruments vibrate a column of air (flute, trumpet). <b>Percussion</b> is struck so it vibrates (drum, xylophone).',f:'Shorter, tighter or thinner strings vibrate faster and play higher notes. A shorter air column also plays higher.',x:'Halving a string\'s length doubles its frequency: one octave higher. That is why guitarists press frets to shorten the string.'},
{k:'speed',em:'🚀',n:'Speed of sound',d:'Sound travels at different speeds through different materials. Particles packed closely and stiffly pass the vibration on faster.',f:'Air (20 °C): about 343 m/s. Water: about 1,480 m/s. Steel: about 5,900 m/s. Space: 0, sound cannot travel!',x:'Light is almost a million times faster than sound, so you see lightning before you hear thunder. Count the seconds and divide by 3 for the distance in km.'}];
let raf=0;
function menu(){cancelAnimationFrame(raf);stopVoice();const ids=[...LV.map(l=>l.id),'quiz','timed'],tot=ids.length*3,got=ids.reduce((a,k)=>a+(SAVE.stars[k]||0),0);
 app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:54px">🔊🎵〰️</div><h2 style="margin:4px">Sound Lab</h2><p style="color:var(--mut)">See and hear sound waves. Tune strings and bottles by ear, measure echoes, and find out how fast sound travels.</p><div class="bar"><i style="width:${got/tot*100}%"></i></div><p class="stars">⭐ ${got} / ${tot}</p>${muted?'<p class="fact">🔇 Sound is muted. Tap 🔇 at the top to hear the lab!</p>':''}</div>
 <div class="grid" style="margin-top:12px">
 <div class="card tile" id="mL"><div class="em">📖</div><h3>Learn</h3><p>Vibration, pitch, volume, timbre, echoes, instruments, speed.</p></div>
 <div class="card tile" id="mW"><div class="em">📈</div><h3>Wave Studio</h3><p>Play with frequency, amplitude and wave shape. See the live waveform.</p></div>
 <div class="card tile" id="mP"><div class="em">🎛️</div><h3>Tuning Puzzles</h3><p>${LV.length} listening and sound-science challenges.</p></div>
 <div class="card tile" id="mQ"><div class="em">❓</div><h3>Quiz</h3><p>10 questions. ${starStr(SAVE.stars.quiz||0)}</p></div>
 <div class="card tile" id="mT"><div class="em">⏱️</div><h3>Timed challenge</h3><p>Beat the 60 s clock. ${starStr(SAVE.stars.timed||0)}</p></div></div>`;
 const on=(id,f)=>$(id).onclick=()=>{SFX.click();f()};on('#mL',()=>learn(0));on('#mW',studio);on('#mP',levels);on('#mQ',()=>runQuiz('quiz','Sound Quiz',QS,0,menu));on('#mT',()=>runQuiz('timed','Timed Challenge',QS,60,menu))}
function learn(i){cancelAnimationFrame(raf);stopVoice();const m=TOP[i];
 app.innerHTML=`<div class="card"><div class="row"><b style="flex:1">Topic ${i+1} of ${TOP.length}</b><button class="btn alt" id="bk">Menu</button></div>
 <div style="text-align:center"><canvas id="lc" width="440" height="200" style="max-width:100%;background:#0b1028;border-radius:14px"></canvas></div>
 <div class="row" style="justify-content:center"><button class="btn alt" id="hear">▶ Hear it</button></div>
 <h2>${m.em} ${m.n}</h2><p>${m.d}</p><div class="fact">💡 ${m.f}</div><p style="color:var(--mut)">${m.x}</p>
 <div class="row"><button class="btn alt" id="pv" ${i?'':'disabled'}>← Prev</button><span style="flex:1"></span><button class="btn" id="nx">${i<TOP.length-1?'Next →':'Done ✓'}</button></div></div>`;
 $('#bk').onclick=menu;$('#pv').onclick=()=>{SFX.click();learn(i-1)};$('#nx').onclick=()=>{SFX.click();if(i<TOP.length-1)learn(i+1);else{SFX.win();confetti();menu()}};
 $('#hear').onclick=()=>{const k=m.k;if(k=='vib')pluck(196);if(k=='pitch'){bottle(220,.5);bottle(440,.5,.6);bottle(880,.5,1.2)}if(k=='amp'){tone(330,.5,'sine',.04);tone(330,.5,'sine',.3,0,.7)}if(k=='wave'){tone(262,.6,'sine',.2);tone(262,.6,'square',.07,0,.8);tone(262,.6,'sawtooth',.08,0,1.6)}
  if(k=='echo'){pluck(523,.3);pluck(523,.3,.1,.5);pluck(523,.3,.03,1)}if(k=='inst'){pluck(196);pluck(392,1.2,.3,.9)}if(k=='speed'){noise(.2,.3,3000);setTimeout(()=>noise(1.2,.4,300),900)}};
 const c=$('#lc'),g=c.getContext('2d'),t0=performance.now();
 (function f(now){if(!c.isConnected)return;const t=(now-t0)/1000;g.clearRect(0,0,440,200);
  if(m.k=='vib'){for(let x=20;x<440;x+=10)for(let y=20;y<190;y+=14){const d=Math.sin(x/30-t*5);g.fillStyle=`rgba(255,211,77,${.4+.5*Math.max(0,d)})`;g.beginPath();g.arc(x+d*4,y,2.4,0,7);g.fill()}g.fillStyle='#e8414f';g.fillRect(4+Math.sin(t*5)*4,40,10,120)}
  if(m.k=='pitch'){g.save();g.translate(0,0);waveDraw(g,440,100,110,.8,'sine',t,'#4dd2ff');g.translate(0,100);waveDraw(g,440,100,330,.8,'sine',t,'#ff9a4d');g.restore();txt(g,'low pitch',60,95,'#4dd2ff');txt(g,'high pitch',60,195,'#ff9a4d')}
  if(m.k=='amp'){g.save();waveDraw(g,440,100,160,.25,'sine',t,'#4dd2ff');g.translate(0,100);waveDraw(g,440,100,160,.95,'sine',t,'#ff5c7a');g.restore();txt(g,'quiet',40,95,'#4dd2ff');txt(g,'loud',40,195,'#ff5c7a')}
  if(m.k=='wave'){['sine','square','sawtooth'].forEach((ty,k)=>{g.save();g.translate(0,k*66);waveDraw(g,440,66,110,.7,ty,t,['#3ddc84','#ffd34d','#ff5c7a'][k]);g.restore();txt(g,ty,400,k*66+16,'#fff',12)})}
  if(m.k=='echo'){g.fillStyle='#6a7090';g.fillRect(400,10,30,180);txt(g,'🙋',40,110,'#fff',30);const r=(t*120)%720;g.strokeStyle='#ffd34d';g.lineWidth=3;if(r<360){g.beginPath();g.arc(40,100,r,-.5,.5);g.stroke()}else{g.beginPath();g.arc(760,100,r-360+ (400-40)*0,Math.PI-.5,Math.PI+.5);g.stroke()}}
  if(m.k=='inst'){[[200,'long = low'],[100,'short = high']].forEach(([L,s],k)=>{const y=60+k*80,amp=Math.sin(t*(k?40:20))*10;g.strokeStyle='#e4d6a8';g.lineWidth=3;g.beginPath();g.moveTo(60,y);g.quadraticCurveTo(60+L,y+amp,60+L*2,y);g.stroke();txt(g,s,340,y+5)})}
  if(m.k=='speed'){[['air',343,'#9aa6d8'],['water',1480,'#4dd2ff'],['steel',5900,'#ffd34d']].forEach(([n,v,c],k)=>{const y=40+k*60,x=(t*v/40)%380;g.fillStyle='#ffffff10';g.fillRect(20,y-14,400,28);g.fillStyle=c;g.beginPath();g.arc(30+x,y,10,0,7);g.fill();txt(g,`${n}: ${v.toLocaleString()} m/s`,220,y+30,c,12)})}
  raf=requestAnimationFrame(f)})(t0)}
// ---- wave studio ----
function studio(){cancelAnimationFrame(raf);let f=262,amp=.5,type='sine',playing=false;
 app.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1;margin:0">📈 Wave Studio</h2><button class="btn alt" id="bk">Menu</button></div>
 <canvas id="wc" width="900" height="300" style="width:100%;background:#0b1028;border-radius:14px"></canvas>
 <div class="row" style="margin:8px 0"><b style="width:110px">Frequency</b><input type="range" id="fq" min="0" max="1000" value="0" style="flex:1;accent-color:var(--acc);height:30px"><span class="pill" style="min-width:150px;text-align:center" id="fv"></span></div>
 <div class="row" style="margin:8px 0"><b style="width:110px">Amplitude</b><input type="range" id="am" min="5" max="100" value="50" style="flex:1;accent-color:var(--acc);height:30px"><span class="pill" style="min-width:150px;text-align:center" id="av"></span></div>
 <div class="row">${['sine','square','triangle','sawtooth'].map(t=>`<button class="btn alt ty" data-t="${t}">${t}</button>`).join('')}<span style="flex:1"></span><button class="btn" id="pl">▶ Play</button></div>
 <div class="fact" id="ex"></div></div>`;
 $('#bk').onclick=()=>{stopVoice();menu()};
