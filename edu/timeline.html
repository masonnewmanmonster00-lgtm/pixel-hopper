function resize(){DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight-40;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';cx.setTransform(DPR,0,0,DPR,0,0)}

[1953,'DNA double helix discovered',0],[1955,'Rosa Parks refuses to give up her bus seat',0],[1957,'Sputnik 1, first satellite',0],[1961,'Yuri Gagarin, first human in space',0],[1963,'Martin Luther King\'s "I Have a Dream"',0],[1969,'Apollo 11 lands on the Moon',0],[1971,'First email sent',0],[1981,'First Space Shuttle launch',0],[1989,'Berlin Wall falls',0],[1990,'Hubble Space Telescope launched',0],[1991,'World Wide Web opens to the public',0],[1998,'First module of the Space Station launched',0],[2007,'First iPhone released',0],[2012,'Curiosity rover lands on Mars',0],[2021,'James Webb Space Telescope launched',0]

const ERAS=[['Ancient Egypt & Mesopotamia',-99999,-1000,'#c9a227'],['Ancient Greece & Rome',-1000,476,'#c0392b'],['Middle Ages',476,1450,'#6c4bb4'],['Renaissance & Exploration',1450,1700,'#16a085'],['Industrial Age',1700,1900,'#7f6a54'],['World Wars era',1900,1950,'#5d6d7e'],['Space & Digital Age',1950,99999,'#2e86de']];

const LV=[
{name:'What do BC and AD mean?',m:'bcad',k:['ago','between','bcorder']},
{name:'Ancient Egypt: which came first?',m:'first',pool:inE(0)},
{name:'Ancient world timeline',m:'order',n:3,pool:inE(0,1)},
{name:'Greece & Rome: which came first?',m:'first',pool:inE(1)},
{name:'Greece & Rome timeline',m:'order',n:4,pool:inE(1)},

{name:'Middle Ages timeline',m:'order',n:4,pool:inE(1,2)},

function NQ(){const m=LV[cur].m;return m==='order'?4:8}
function sample(pool,n,minGap){for(let t=0;t<500;t++){const s=shuffle(pool).slice(0,n);const ys=s.map(e=>e.y).sort((a,b)=>a-b);if(ys.every((y,i)=>!i||y-ys[i-1]>=minGap))return s}return shuffle(pool).slice(0,n)}
function makeQ(){const L=LV[cur],m=L.m,q={m};

 else if(m==='first'){let a,b;for(let t=0;t<500;t++){[a,b]=shuffle(L.pool);const d=Math.abs(a.y-b.y);if(d>=(L.close?1:10)&&(!L.close||d<=60))break}q.cards=[a,b];q.text='Which happened FIRST?'}
 else if(m==='era'){const e=pick(L.pool),ei=eraOf(e.y);q.ev=e;const o=new Set([ei]);while(o.size<4)o.add(Math.max(0,Math.min(6,ei+pick([-2,-1,1,2,3,-3]))));q.opts=shuffle([...o]).map(i=>ERAS[i][0]);q.ans=ERAS[ei][0];q.text='Which era does this belong to?';q.sub=e.t;q.why=e.t+' — '+fy(e)}
 else{const k=pick(L.k);if(k==='ago'){const a=ri(2,30)*50,b=ri(2,30)*50;const A=-a,B=pick([-b,b]);if(A===B)return makeQ();q.text='Which date is LONGER ago?';q.opts=shuffle([yr(A),yr(B)]);q.ans=yr(Math.min(A,B));q.why='BC years count DOWN towards year 1. Bigger BC number = longer ago. Every BC date is before every AD date.'}

function bcInfo(i){save['intro'+i]=1;persist();ov(i===5?'<h2>🕰️ Centuries</h2><p>A century is 100 years. The <b>1st century</b> AD is years 1–100, so <b>1066</b> is in the <b>11th century</b>, and <b>1999</b> is the <b>20th</b>.</p><p>Tip: take the hundreds and add 1 (1066 → 10 + 1 = 11th).</p><button class="btn" onclick="ov(\'\')">Got it ▶</button>':'<h2>⏳ BC and AD</h2><p><b>BC</b> = “Before Christ”, also written <b>BCE</b>. <b>AD</b> = “Anno Domini” (in the year of the Lord), also written <b>CE</b>.</p><p>BC years count <b>down</b>: 500 BC is before 300 BC. Then 1 BC is followed by AD 1 — <b>there is no year 0</b>.</p><p>← 3000 BC … 500 BC … 1 BC | AD 1 … 1066 … 2026 →</p><button class="btn" onclick="ov(\'\')">Got it ▶</button>')}

// ---------- drawing ----------
function card(x,y,w,h,col,stroke){cx.fillStyle=col;rr(x,y,w,h,12);cx.fill();if(stroke){cx.strokeStyle=stroke;cx.lineWidth=3;cx.stroke()}}
function wrapC(s,x,y,w,sz,col){cx.font='700 '+sz+'px system-ui';const ws=s.split(' ');let lines=[],l='';for(const wd of ws){const t=l?l+' '+wd:wd;if(cx.measureText(t).width>w&&l){lines.push(l);l=wd}else l=t}lines.push(l);while(lines.length>4&&sz>9)return wrapC(s,x,y,w,sz-1,col);lines.forEach((ln,i)=>txt(ln,x,y+(i-(lines.length-1)/2)*(sz+3),sz,col))}

 if(!Q)return;$('st').textContent='Lv '+(cur+1)+' · '+Math.min(qi+1,NQ())+'/'+NQ()+' · ✗'+miss;const q=Q;txt(LV[cur].name,W/2,14,13,'#ffcf5a');

 else{wrapC(q.text,W/2,44,W-40,18,'#fff');if(q.sub){card(W/2-200,66,400,56,'#fdf6e3');wrapC(q.sub,W/2,94,380,16,'#2b1d0e')}const top=q.sub?134:80,n=q.opts.length,cols=2,bw=Math.min(300,(W-50)/2),bh=44;
  q.opts.forEach((o,i)=>{const bx=W/2+((i%cols)?8:-8-bw),by=top+Math.floor(i/cols)*(bh+10);let col='#283070';if(q.picked){if(o===q.ans)col='#2a8a3a';else if(o===q.picked)col='#a33'}card(bx,by,bw,bh,col);txt((i+1)+'  '+o,bx+bw/2,by+bh/2,fit((i+1)+'  '+o,bw-10,16));btns.push({x:bx,y:by,w:bw,h:bh,f:()=>choose(o)})});

function insIndex(x){const S=slots();let k=0;for(let i=0;i<S.n;i++){if(x>S.pos(i)+S.w/2)k=i+1}return k}
function checkOrder(){const q=Q;if(q.checked){q.checked=false;msg='';draw();return}const ys=q.cards.map(c=>c.y);q.ok=ys.map((y,i)=>ys.slice(0,i).every(p=>p<=y)&&ys.slice(i+1).every(p=>p>=y));q.checked=true;
 if(q.ok.every(Boolean)){sfx.ok();lock=true;msg='✔ Perfect timeline! '+q.cards.map(c=>yr(c.y)).join(' → ');msgCol='#7f7';draw();setTimeout(next,1800)}else{sfx.bad();miss++;msg='✘ Red cards are in the wrong place. Dates are shown — drag to fix, then check again.';msgCol='#f99';draw()}}
function pickFirst(e){if(lock)return;Q.picked=e;lock=true;const f=Q.cards.reduce((a,b)=>a.y<=b.y?a:b);const ok=e.y===f.y;if(ok){sfx.ok();msg='✔ Yes! '+f.t+' ('+fy(f)+') came first.';msgCol='#7f7'}else{sfx.bad();miss++;msg='✘ '+f.t+' ('+fy(f)+') came first.';msgCol='#f99'}draw();setTimeout(next,ok?1300:2300)}
function choose(o){if(lock)return;Q.picked=o;lock=true;const ok=o===Q.ans;if(ok)sfx.ok();else{sfx.bad();miss++}msg=(ok?'✔ Correct! ':'✘ Answer: '+Q.ans+'. ')+(Q.why||'');msgCol=ok?'#7f7':'#f99';draw();setTimeout(next,ok?1500:2800)}
function next(){msg='';lock=false;drag=null;qi++;if(qi>=NQ()){const m=miss;finishLevel(m===0?3:m<=2?2:1);return}Q=makeQ();draw()}
function onTap(x,y){if(hit(x,y))return;if(Q.m==='order'&&!lock){const S=slots();for(let i=0;i<S.n;i++){const px=S.pos(i);if(x>=px&&x<=px+S.w&&y>=S.y&&y<=S.y+S.h){if(Q.checked){Q.checked=false;msg=''}drag={i,x,y,y0:y};sfx.tap();draw();return}}}}
function relXY(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();[drag.x,drag.y]=relXY(e);drag.moved=1;draw()});
function drop(e){if(!drag)return;const x=drag.moved?drag.x:relXY(e)[0];let k=insIndex(x);const c=Q.cards.splice(drag.i,1)[0];if(k>drag.i)k--;Q.cards.splice(Math.max(0,Math.min(Q.cards.length,k)),0,c);drag=null;sfx.tap();draw()}
cv.addEventListener('pointerup',drop);cv.addEventListener('pointercancel',drop);
let sel=-1;function onKey(e){const k=e.key,q=Q;if(!q||lock)return;
 if(q.m==='first'&&(k==='1'||k==='2'))return pickFirst(q.cards[+k-1]);
 if(q.opts){const n=+k;if(n>=1&&n<=q.opts.length)choose(q.opts[n-1]);return}
 if(q.m==='order'){const n=+k;if(n>=1&&n<=q.cards.length){sel=n-1;msg='Card '+n+' picked — use ← → to move it, Enter to check.';msgCol='#fc9';draw()}
  else if((k==='ArrowLeft'||k==='ArrowRight')&&sel>=0){const d=k==='ArrowLeft'?-1:1,t=sel+d;if(t>=0&&t<q.cards.length){[q.cards[sel],q.cards[t]]=[q.cards[t],q.cards[sel]];sel=t;q.checked=false;draw()}}
  else if(k==='Enter')checkOrder()}}
window.TT={get Q(){return Q},EV,LV,slots};
resize();cur=0;Q=makeQ();draw();showLevels();

</script></body></html>
