<script>
const SAVEKEY='plantLabSave',TITLE='🌱 Plant Lab',INTRO='Be a plant scientist! Grow plants by controlling light, water and soil, run fair tests with a growth chart, and learn photosynthesis, flower parts, the life cycle and pollinators.';
// shared skeleton injected into both games
const $=id=>document.getElementById(id);
const cv=$('c'),cx=cv.getContext('2d');let W=0,H=0,DPR=1;
let save={mute:false,stars:{},unlocked:1};
try{const s=JSON.parse(localStorage.getItem(SAVEKEY)||'null');if(s)save=Object.assign(save,s)}catch(e){}
function persist(){try{localStorage.setItem(SAVEKEY,JSON.stringify(save))}catch(e){}}
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=0.12,t='sine',v=0.15,dl=0){if(save.mute)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;const s=a.currentTime+dl;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(0.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+0.02)}
const sfx={ok(){tone(660,.1,'triangle');tone(990,.15,'triangle',.15,.08)},bad(){tone(200,.25,'sawtooth',.08)},tap(){tone(500,.05,'square',.05)},win(){[523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.15,i*.12))}};
function resize(){DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight-40;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';cx.setTransform(DPR,0,0,DPR,0,0)}
function rr(x,y,w,h,r){cx.beginPath();cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h)}
function txt(s,x,y,sz,col='#fff',al='center',wt='700'){cx.font=wt+' '+sz+'px system-ui,Segoe UI,Roboto,sans-serif';cx.fillStyle=col;cx.textAlign=al;cx.textBaseline='middle';cx.fillText(s,x,y)}
function fit(s,maxw,sz){cx.font='700 '+sz+'px system-ui';while(sz>9&&cx.measureText(s).width>maxw){sz--;cx.font='700 '+sz+'px system-ui'}return sz}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(a){return a[Math.random()*a.length|0]}
let paused=false,btns=[];
function hit(x,y){for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.f();return true}}return false}
function ptr(e){ac();if(paused||$('ov').style.display==='flex')return;const r=cv.getBoundingClientRect();const p=e.changedTouches?e.changedTouches[0]:e;onTap(p.clientX-r.left,p.clientY-r.top)}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ptr(e)});
function ov(html){$('ovc').innerHTML=html;$('ov').style.display=html?'flex':'none'}
function setPause(p){if($('ov').style.display==='flex'&&!paused)return;paused=p;$('pB').textContent=p?'▶':'⏸';ov(p?'<h2>⏸ Paused</h2><p>Press P or tap to resume. R restarts the level.</p><button class="btn" onclick="setPause(false)">▶ Resume</button> <button class="btn" onclick="setPause(false);restart()">↻ Restart</button>':'')}
$('pB').onclick=()=>setPause(!paused);
$('mu').textContent=save.mute?'🔇':'🔊';$('mu').onclick=()=>{save.mute=!save.mute;$('mu').textContent=save.mute?'🔇':'🔊';persist()};
$('lvB').onclick=()=>{paused=false;showLevels()};
function starStr(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function showLevels(){let h='<h2>'+TITLE+'</h2><p>'+INTRO+'</p>';LV.forEach((L,i)=>{const ok=i<save.unlocked;h+='<span class="lv'+(ok?'':' lock')+'" data-lv="'+i+'" '+(ok?'onclick="startLevel('+i+')"':'')+'>'+(ok?'':'🔒 ')+(i+1)+'. '+L.name+'<br><small>'+starStr(save.stars[i]||0)+'</small></span>'});h+='<p><small>Keys: 1-9 / arrows / Enter · P pause · R restart · M mute</small></p>';ov(h)}
function finishLevel(stars){sfx.win();const i=cur;save.stars[i]=Math.max(save.stars[i]||0,stars);save.unlocked=Math.max(save.unlocked,Math.min(LV.length,i+2));persist();
 ov('<h2>Level complete!</h2><div class="stars">'+starStr(stars)+'</div><p>'+LV[i].name+'</p>'+(i+1<LV.length?'<button class="btn" id="nextB" onclick="startLevel('+(i+1)+')">Next level ▶</button> ':'')+'<button class="btn" onclick="restart()">↻ Replay</button> <button class="btn" onclick="showLevels()">Levels</button>')}
function restart(){ov('');startLevel(cur)}
addEventListener('keydown',e=>{const k=e.key;if(k==='p'||k==='P'){setPause(!paused);return}if(paused)return;if($('ov').style.display==='flex'){if(k==='Enter'&&$('nextB'))$('nextB').click();return}
 if(keyTyping()&&k.length===1&&k!=='p'&&k!=='P'){onKey(e);return}
 if(k==='r'||k==='R'){restart();return}if(k==='m'||k==='M'){$('mu').click();return}onKey(e)});
addEventListener('resize',()=>{resize();draw()});
// ---------- shared modes ----------
let cur=0,qi=0,miss=0,Q=null,msg='',msgCol='#fff',lock=false,drag=null,S={},anim=null;const MODES={};let gen=0;function later(f,ms){const g=gen;setTimeout(()=>{if(g===gen)f()},ms)}
function card(x,y,w,h,col,stroke,r=12){cx.fillStyle=col;rr(x,y,w,h,r);cx.fill();if(stroke){cx.strokeStyle=stroke;cx.lineWidth=3;cx.stroke()}}
function wrapC(s,x,y,w,sz,col,maxL=4,al='center'){cx.font='700 '+sz+'px system-ui';const ws=String(s).split(' ');let lines=[],l='';for(const wd of ws){const t=l?l+' '+wd:wd;if(cx.measureText(t).width>w&&l){lines.push(l);l=wd}else l=t}lines.push(l);if(lines.length>maxL&&sz>9)return wrapC(s,x,y,w,sz-1,col,maxL,al);lines.forEach((ln,i)=>txt(ln,x,y+(i-(lines.length-1)/2)*(sz+3),sz,col,al));return lines.length}
function button(x,y,w,h,label,f,col='#283070',sz=15,dis){card(x,y,w,h,dis?'#3a3f58':col);txt(label,x+w/2,y+h/2,fit(label,w-10,sz),dis?'#99a':'#fff');if(!dis)btns.push({x,y,w,h,f,label})}
function say(s,c){msg=s;msgCol=c===1?'#7f7':c===0?'#f99':'#fc9'}
function M(){return MODES[LV[cur].m]}
function startLevel(i){gen++;ov('');paused=false;cur=i;qi=0;miss=0;msg='';lock=false;drag=null;anim=null;S={};M().init(LV[i]);draw();const L=LV[i];if(L.intro&&!save['in'+i]){save['in'+i]=1;persist();ov('<h2>'+L.name+'</h2><p>'+L.intro+'</p><button class="btn" onclick="ov(\'\')">Let\'s go ▶</button>')}}
function bg(){const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,BG[0]);g.addColorStop(1,BG[1]);cx.fillStyle=g;cx.fillRect(0,0,W,H)}
function draw(){btns=[];cx.clearRect(0,0,W,H);bg();const m=M();if(!m)return;$('st').textContent='Lv '+(cur+1)+(m.st?' · '+m.st():'')+' · ✗'+miss;m.draw(LV[cur])}
function onTap(x,y){if(hit(x,y))return;const m=M();if(m.tap)m.tap(x,y)}
function relXY(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointermove',e=>{const m=M();if(m&&m.move&&!paused){e.preventDefault();const[x,y]=relXY(e);m.move(x,y)}});
function upH(e){const m=M();if(m&&m.up){const[x,y]=relXY(e);m.up(x,y)}}
cv.addEventListener('pointerup',upH);cv.addEventListener('pointercancel',upH);
function onKey(e){const m=M();if(m&&m.key&&!lock)m.key(e.key)}
function keyTyping(){return false}
function byMiss(a=0,b=2){return miss<=a?3:miss<=b?2:1}
let lastT=performance.now();function loop(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;if(anim&&!paused&&$('ov').style.display!=='flex'){anim(dt)}requestAnimationFrame(loop)}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
// QUIZ: qs = array of [question,[correct,...wrong],why] or function returning one
function qMake(L){const raw=typeof L.qs==='function'?L.qs():S.list[qi%S.list.length];Q={text:raw[0],ans:raw[1][0],opts:shuffle(raw[1]),why:raw[2]||''}}
MODES.quiz={init(L){S.n=L.n||6;S.list=typeof L.qs==='function'?null:shuffle(L.qs).slice(0,S.n);qMake(L)},st(){return Math.min(qi+1,S.n)+'/'+S.n},
 draw(L){const k=Math.max(1,Math.min(1.7,H/350));txt(L.name,W/2,14,13,'#ffcf5a');card(20,30,W-40,64*k,'#fdf6e3');wrapC(Q.text,W/2,30+32*k,W-70,18*k,'#2b1d0e',3);const bw=Math.min(330*k,(W-50)/2),bh=46*k,top=30+76*k;
  Q.opts.forEach((o,i)=>{const bx=W/2+((i%2)?8:-8-bw),by=top+Math.floor(i/2)*(bh+10);let col='#283070';if(Q.picked){if(o===Q.ans)col='#2a8a3a';else if(o===Q.picked)col='#a33'}card(bx,by,bw,bh,col);const s=(i+1)+'  '+o;txt(s,bx+bw/2,by+bh/2,fit(s,bw-12,16*k));btns.push({x:bx,y:by,w:bw,h:bh,f:()=>qChoose(o),opt:o})});
  if(msg)wrapC(msg,W/2,top+2*(bh+10)+(H-top-2*(bh+10))/2,W-40,14*k,msgCol,4)},
 key(k){const n=+k;if(n>=1&&n<=Q.opts.length)qChoose(Q.opts[n-1])}};
function qChoose(o){if(lock)return;Q.picked=o;lock=true;const ok=o===Q.ans;if(ok)sfx.ok();else{sfx.bad();miss++}say((ok?'✔ Correct! ':'✘ Answer: '+Q.ans+'. ')+Q.why,ok?1:0);draw();later(qNext,ok?1700:3400)}
function qNext(){msg='';lock=false;qi++;if(qi>=S.n){finishLevel(byMiss(0,1));return}qMake(LV[cur]);draw()}
// LABEL: L.pic(x,y,w,h) draws picture; L.targets [{n:name,x,y (0-1),f:fact}]
MODES.label={init(L){S.order=shuffle(L.targets.map((t,i)=>i));S.placed={}},st(){return Object.keys(S.placed).length+'/'+LV[cur].targets.length},
 area(){const w=Math.min(W*0.64-20,(H-36)*1.6);return{x:10,y:30,w,h:H-36}},
 tp(t){const A=this.area();return[A.x+t.x*A.w,A.y+t.y*A.h]},
 chips(){const L=LV[cur],A=this.area(),x=A.x+A.w+14,w=W-x-10,left=S.order.filter(i=>!S.placed[i]),h=Math.min(36,(H-40)/Math.max(1,left.length)-6);return left.map((i,k)=>({i,x,y:32+k*(h+6),w,h}))},
 draw(L){txt(L.name+' — drag each label onto its dot',W/2,14,13,'#ffcf5a');const A=this.area();L.pic(A.x,A.y,A.w,A.h);
  L.targets.forEach((t,i)=>{const[px,py]=this.tp(t);if(S.placed[i]){cx.font='800 12px system-ui';const tw=cx.measureText(t.n).width+12;const lx=Math.max(A.x+tw/2,Math.min(A.x+A.w-tw/2,px));card(lx-tw/2,py-11,tw,22,'#1f7a3a','#fff',8);txt(t.n,lx,py,12)}else{cx.fillStyle='#ffcf5a';cx.beginPath();cx.arc(px,py,11,0,7);cx.fill();cx.strokeStyle='#000';cx.lineWidth=2;cx.stroke();txt(String.fromCharCode(65+i),px,py,12,'#000')}});
  this.chips().forEach((c,k)=>{if(drag&&drag.i===c.i)return;card(c.x,c.y,c.w,c.h,'#283070','#6a7ad0',9);const s=(k+1)+'. '+L.targets[c.i].n;txt(s,c.x+c.w/2,c.y+c.h/2,fit(s,c.w-10,14))});
  if(drag){const t=L.targets[drag.i];cx.font='800 14px system-ui';const tw=cx.measureText(t.n).width+20;card(drag.x-tw/2,drag.y-16,tw,32,'#e07a10','#fff',9);txt(t.n,drag.x,drag.y,14)}
  if(msg){card(A.x+6,H-52,A.w-12,46,'#000b');wrapC(msg,A.x+A.w/2,H-29,A.w-24,12,msgCol,3)}},
 tap(x,y){if(lock)return;for(const c of this.chips())if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h){drag={i:c.i,x,y};sfx.tap();draw();return}},
 move(x,y){if(drag){drag.x=x;drag.y=y;draw()}},
 up(x,y){if(!drag)return;const i=drag.i;drag=null;const L=LV[cur];let best=-1,bd=40;L.targets.forEach((t,j)=>{if(S.placed[j])return;const[px,py]=this.tp(t);const d=Math.hypot(px-x,py-y);if(d<bd){bd=d;best=j}});if(best<0){draw();return}this.place(i,best)},
 place(i,j){const L=LV[cur];if(i===j||L.targets[i].n===L.targets[j].n){S.placed[j]=1;if(i!==j){const k=S.order.indexOf(i),m=S.order.indexOf(j);[S.order[k],S.order[m]]=[S.order[m],S.order[k]]}sfx.ok();say('✔ '+L.targets[j].n+': '+(L.targets[j].f||''),1);if(Object.keys(S.placed).length===L.targets.length){lock=true;draw();later(()=>finishLevel(byMiss(0,2)),1600);return}}else{sfx.bad();miss++;say('✘ That dot is not the '+L.targets[i].n+'. Try another!',0)}draw()},
 key(k){const ch=this.chips();if(/^[1-9]$/.test(k)&&ch[+k-1]){S.sel=ch[+k-1].i;say('Picked '+LV[cur].targets[S.sel].n+' — now press the letter of its dot.',2);draw()}else if(/^[a-l]$/i.test(k)&&S.sel!=null){const j=k.toUpperCase().charCodeAt(0)-65;if(LV[cur].targets[j]&&!S.placed[j]){const s=S.sel;S.sel=null;this.place(s,j)}}}};
// SORT: L.bins [a,b], L.items [[text,bin,why]]
MODES.sort={init(L){S.items=shuffle(L.items).slice(0,L.n||8);S.k=0;S.home=null},st(){return Math.min(S.k+1,S.items.length)+'/'+S.items.length},
 bins(){const w=(W-60)/2,h=Math.min(120,H*0.34),y=H-h-10;return[{x:20,y,w,h},{x:40+w,y,w,h}]},
 cardR(){const w=Math.min(380,W-60),h=72;return{x:W/2-w/2,y:44,w,h}},
 draw(L){txt(L.name+' — drag the card into the right box',W/2,14,13,'#ffcf5a');const B=this.bins();B.forEach((b,i)=>{card(b.x,b.y,b.w,b.h,i?'#24563a':'#5a2e6e','#fff');txt((i?'→ ':'← ')+L.bins[i],b.x+b.w/2,b.y+b.h/2,fit(L.bins[i],b.w-40,18))});
  const it=S.items[S.k];if(!it)return;const C=this.cardR();let x=C.x,y=C.y;if(drag){x=drag.x-C.w/2;y=drag.y-C.h/2}card(x,y,C.w,C.h,'#fdf6e3',drag?'#ffcf5a':null);if(L.icon)L.icon(it,x+30,y+C.h/2);wrapC(it[0],x+C.w/2+(L.icon?20:0),y+C.h/2,C.w-(L.icon?80:20),17,'#2b1d0e',3);
  if(msg)wrapC(msg,W/2,(C.y+C.h+B[0].y)/2,W-40,13,msgCol,4)},
 tap(x,y){if(lock)return;const C=this.cardR();if(x>=C.x&&x<=C.x+C.w&&y>=C.y&&y<=C.y+C.h){drag={x,y};sfx.tap();draw();return}const B=this.bins();B.forEach((b,i)=>{if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)this.choose(i)})},
 move(x,y){if(drag){drag.x=x;drag.y=y;draw()}},
 up(x,y){if(!drag)return;drag=null;const B=this.bins();let c=-1;B.forEach((b,i)=>{if(x>=b.x-10&&x<=b.x+b.w+10&&y>=b.y-30)c=i});if(c<0){draw();return}this.choose(c)},
 choose(b){if(lock)return;const it=S.items[S.k];const ok=it[1]===b;lock=true;if(ok)sfx.ok();else{sfx.bad();miss++}say((ok?'✔ ':'✘ It goes in “'+LV[cur].bins[it[1]]+'”. ')+(it[2]||''),ok?1:0);draw();later(()=>{lock=false;msg='';S.k++;if(S.k>=S.items.length){finishLevel(byMiss(0,2));return}draw()},ok?1500:3000)},
 key(k){if(k==='1'||k==='ArrowLeft')this.choose(0);else if(k==='2'||k==='ArrowRight')this.choose(1)}};
// ORDER: L.steps [[name,desc]] — tap in the right order
MODES.order={init(L){S.cards=shuffle(L.steps.map((s,i)=>i));S.next=0},st(){return S.next+'/'+LV[cur].steps.length},
 rects(){const n=S.cards.length,cols=Math.min(n,Math.ceil(n/2)),rows=Math.ceil(n/cols),gw=(W-30)/cols,gh=Math.min(70,(H-170)/rows);return S.cards.map((c,k)=>({c,x:15+(k%cols)*gw+4,y:84+Math.floor(k/cols)*(gh+8),w:gw-8,h:gh}))},
 draw(L){txt(L.name+' — tap the stages in order, starting with the first',W/2,14,13,'#ffcf5a');const done=L.steps.slice(0,S.next).map(s=>s[0]).join(' → ')||'(start with the very first stage)';card(15,28,W-30,46,'#0006');wrapC(done,W/2,51,W-50,14,'#cfe',2);
  this.rects().forEach((r,k)=>{const d=r.c<S.next;card(r.x,r.y,r.w,r.h,d?'#2a8a3a':'#fdf6e3');if(L.icon&&!d)L.icon(r.c,r.x+22,r.y+r.h/2);wrapC((d?(r.c+1)+'. ':'')+L.steps[r.c][0],r.x+r.w/2+(L.icon&&!d?14:0),r.y+r.h/2,r.w-(L.icon?50:14),15,d?'#fff':'#2b1d0e',2);if(!d)btns.push({x:r.x,y:r.y,w:r.w,h:r.h,f:()=>this.pick(r.c)})});
  if(msg)wrapC(msg,W/2,H-34,W-40,13,msgCol,3)},
 pick(c){if(lock)return;const L=LV[cur];if(c===S.next){S.next++;sfx.ok();say('✔ '+L.steps[c][0]+': '+L.steps[c][1],1);if(S.next>=L.steps.length){lock=true;draw();later(()=>finishLevel(byMiss(0,2)),1800);return}}else{sfx.bad();miss++;say('✘ Not yet — '+L.steps[c][0]+' comes later. What happens before it?',0)}draw()},
 key(k){const n=+k;const left=this.rects().filter(r=>r.c>=S.next);if(n>=1&&left[n-1])this.pick(left[n-1].c)}};

const BG=['#163a2a','#0f2433'];
const VAR={light:['Dark cupboard','Dim shade','Bright window','Scorching sun'],water:['No water','A little','Just right','Flooded'],soil:['Sand','Compost loam','Heavy clay']};
const VN={light:'Light',water:'Water',soil:'Soil'},VI={light:'☀️',water:'💧',soil:'🟫'};
const LF=[0,.45,1,.8],WF=[0,.55,1,.3],SF=[.6,1,.7];
function sim(p){let h=.5;const a=[h];for(let d=1;d<=14;d++){let dh;if(p.light===0)dh=d<=6?1.3:0;else if(p.water===0)dh=d<=3?.4:0;else dh=2.6*LF[p.light]*WF[p.water]*SF[p.soil]*(1-h/40);h+=dh;a.push(h)}return a}
