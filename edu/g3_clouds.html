{name:'What do cloud names mean?',m:'root'},
{name:'Puffy, layered or wispy?',m:'id',set:['Cumulus','Stratus','Cirrus']},
{name:'High, middle or low?',m:'alt'},
{name:'The rain-makers',m:'id',set:['Cumulus','Stratus','Cirrus','Nimbostratus','Cumulonimbus']},
{name:'Weather forecaster',m:'wx'},
{name:'High clouds (cirro-)',m:'id',set:['Cirrus','Cirrocumulus','Cirrostratus']},
{name:'Middle clouds (alto-)',m:'id',set:['Altocumulus','Altostratus','Nimbostratus']},
{name:'Low clouds',m:'id',set:['Stratus','Stratocumulus','Cumulus','Cumulonimbus']},
{name:'Build a cloud name',m:'build'},
{name:'Storm clouds',m:'quiz',k:Q_STORM},
{name:'All ten clouds',m:'id',set:NAMES},
{name:'Read the sky',m:'seq'},
{name:'Cloud science',m:'quiz',k:Q_SCI},
{name:'Cloud Spotter master',m:'mix'}];
const TIPS={0:'Cloud names use Latin words: CIRRUS (hair curl), CUMULUS (heap), STRATUS (layer), NIMBUS (rain). They were named by Luke Howard in 1802.',2:'HIGH clouds are above about 6,000 m, MIDDLE clouds about 2,000–6,000 m, and LOW clouds below about 2,000 m. Cumulonimbus starts low but towers up through all levels.',5:'"Cirro-" means a HIGH cloud made of ice.',6:'"Alto-" (from altus, high) is used for MIDDLE clouds — confusing, but true!'};
function makeQ(){const L=LV[cur];let m=L.m;if(m==='mix')m=pick(['id','alt','wx','build','seq','root']);const q={m,used:(Q&&Q.used)||[]};
 const set=L.set||NAMES;
 if(m==='id'||m==='alt'||m==='wx'){const t=pick(m==='id'?set:NAMES),seed=ri(1,1e6);q.vis=(x,y,s)=>{const w=W*.4-20,h=H-70;sky(t,16,40,w,h,seed)};
  if(m==='id'){q.text='Which cloud is this?';q.opts=mo(t,set.length>=4?set:NAMES.filter(n=>set.includes(n)||Math.random()<.3),Math.min(4,Math.max(3,set.length)));if(!q.opts.includes(t))q.opts[0]=t;q.ans=t;q.why=t+': '+CL[t][1]+'.'}
  else if(m==='alt'){q.text='This is '+t+'. At what level is it found?';q.opts=['High','Middle','Low'];q.ans=CL[t][0];q.why=t+(t==='Cumulonimbus'?' has a LOW base but towers up through every level.':' is a '+CL[t][0].toLowerCase()+' cloud.')}
  else{q.text='You spot '+t+'. What weather does it suggest?';q.opts=mo(CL[t][2],NAMES.map(n=>CL[n][2]));q.ans=CL[t][2];q.why=t+': '+CL[t][1]+'.'}}
 else if(m==='root'){const f=fromList(ROOT,q);q.big=f[0];q.bigSz=24;q.text='What does it mean?';q.opts=mo(f[1],ROOT.map(r=>r[1]));q.ans=f[1];q.why=''}
 else if(m==='build'){const f=fromList(BUILD,q);q.big=f[0];q.bigSz=24;q.text='Which cloud name means this?';q.opts=mo(f[1],BUILD.map(b=>b[1]).concat(['Cirrus','Stratus']));q.ans=f[1];q.why=f[1]+': '+CL[f[1]][1]+'.'}
 else if(m==='seq'){const f=fromList(SEQ,q);q.big=f[0];q.bigSz=17;q.text='What weather is coming?';q.opts=mo(f[1],SEQ.map(s=>s[1]));q.ans=f[1];q.why='Cloud watchers have used clues like this for centuries.'}
 else quizQ(q,fromList(L.k||pick([Q_SCI,Q_STORM]),q));
 return q}
window.G={get Q(){return Q},LV,sky,NAMES};
resize();cur=0;Q=makeQ();draw();showLevels();


</script></body></html>
