const Q_LAW=[['Hammurabi was king of…','Babylon',['Ur','Athens','Memphis'],'He ruled about 1792–1750 BC.'],['His laws were carved on…','A tall stone stele',['Paper scrolls','Gold coins','Wooden doors'],'The stele is now in the Louvre museum in Paris.'],['About how many laws?','282',['10','12','1,000'],'They covered trade, farming, family, theft and building.'],['Why carve laws in public?','So everyone knew the rules and punishments',['To hide them','As decoration only','To confuse people'],'Writing laws down made them harder to change unfairly.'],['"An eye for an eye" means…','The punishment matches the harm done',['Everyone gets glasses','Nobody is punished','Only kings judge'],'But punishments often differed by social class.'],['A builder whose house collapsed and killed the owner…','Could be put to death',['Got a prize','Paid nothing','Became king'],'Hammurabi\'s laws made builders responsible.'],['The picture at the top of the stele shows Hammurabi with…','Shamash, god of justice',['A lion','His army','The sea'],'It said the laws came with the gods\' approval.'],['Were the laws equal for everyone?','No — punishments depended on class',['Yes, always','Only for kings','Only for children'],'Nobles, free people and enslaved people were treated differently.']];
const Q_LIFE=[['What did most Mesopotamians do?','Farm barley and wheat',['Fish only','Hunt mammoths','Work in factories'],'Barley was also used for bread and beer.'],['What was used like money?','Barley and weights of silver',['Paper notes','Credit cards','Shells only'],'The shekel was a weight of silver.'],['Which animal pulled ploughs?','Oxen',['Camels','Horses only','Elephants'],'Donkeys carried goods too.'],['Houses were often…','Flat-roofed mud-brick homes around a courtyard',['Glass towers','Igloos','Tree houses'],'People slept on the roofs on hot nights.'],['What was a date palm good for?','Fruit, wood, rope and baskets',['Nothing','Metal','Paper money'],'Dates were sweet and kept well.'],['Who was at the top of society?','The king and priests',['Farmers','Merchants','Scribes only'],'Kings claimed to rule for the gods.'],['What did boats on the rivers carry?','Grain, timber and trade goods',['Cars','Tourists','Nothing'],'Reed boats were sealed with bitumen.']];
const Q_60=[['Mesopotamians counted in base…','60',['10','2','20'],'Their numbers went up in 60s, not 10s.'],['Why is 60 a handy number?','It divides evenly by 2, 3, 4, 5, 6, 10, 12, 15, 20 and 30',['It is the biggest number','It is easy to spell','It is odd'],'That makes fractions like ⅓ and ¼ easy.'],['Thanks to base 60, an hour has…','60 minutes',['100 minutes','10 minutes','24 minutes'],'And a minute has 60 seconds.'],['A full circle has…','360 degrees (6 × 60)',['100 degrees','60 degrees','1,000 degrees'],'Babylonian astronomers used 360 for the sky.'],['How many seconds in one hour?','3,600 (60 × 60)',['600','1,000','360'],'Two base-60 places: 60 minutes × 60 seconds.'],['How could you count to 12 on one hand?','Count finger joints with your thumb',['Use your toes','Clap','You can\'t'],'One idea for base 60: 12 joints × 5 fingers on the other hand = 60.'],['Half an hour is 30 minutes. A third of an hour is…','20 minutes',['33.3 minutes','30 minutes','15 minutes'],'Base 60 gives whole numbers for thirds!'],['A quarter of an hour is…','15 minutes',['25 minutes','10 minutes','12 minutes'],'60 ÷ 4 = 15.']];
const TL=[[-5000,'Farmers settle in southern Mesopotamia'],[-3500,'The wheel is used for pottery'],[-3200,'Cuneiform writing begins in Sumer'],[-2700,'Gilgamesh rules Uruk (legend)'],[-2334,'Sargon of Akkad builds the first empire'],[-2100,'The Great Ziggurat of Ur is built'],[-1754,'Hammurabi\'s law code is carved'],[-700,'Assyrian empire at its height'],[-600,'Nebuchadnezzar II rebuilds Babylon'],[-539,'Persians conquer Babylon']];
const fy=y=>Math.abs(y)+' BC';
const LV=[{name:'Land between the rivers',m:'quiz',k:Q_LAND},{name:'Read the map',m:'map'},{name:'Cuneiform 1–9',m:'read',r:[1,9]},{name:'Press wedges: 1–19',m:'cb',r:[1,19]},{name:'Cuneiform 10–59',m:'read',r:[10,59]},{name:'Ziggurats',m:'quiz',k:Q_ZIG},{name:'Wheel and writing',m:'quiz',k:Q_INV},{name:'Press wedges: up to 59',m:'cb',r:[20,59]},{name:'Hammurabi\'s code',m:'quiz',k:Q_LAW},{name:'Base 60 and our clocks',m:'quiz',k:Q_60},{name:'Big numbers: 60s place',m:'read',r:[61,300]},{name:'Daily life',m:'quiz',k:Q_LIFE},{name:'Timeline',m:'tl',reps:3},{name:'Mesopotamia master',m:'mix'}];
const TIPS={0:'Mesopotamia means "the land between the rivers" — the Tigris and the Euphrates, in modern Iraq.',2:'These number signs are SIMPLIFIED cuneiform. A tall wedge means 1. Count the wedges!',3:'Tap the corner wedge for 10 and the tall wedge for 1, then Check. Backspace / ↶ undoes.',4:'A corner wedge (like <) means 10. Count tens, then ones.',9:'Mesopotamians counted in 60s. That is why we have 60 seconds, 60 minutes and 360°.',10:'Big numbers used PLACES, like ours: the left group counts 60s, the right group counts 1s. So 1 | 5 = 60 + 5 = 65.'};
CUSTOM.cb={draw(q){const lw=W*.4;tablet(16,50,lw-16,H-80,'Simplified cuneiform — your tablet');const t=q.t,o=q.o;if(t+o)digit(t*10+o,lw/2+8,H/2-10,lw-40,H-120);else txt('(empty)',lw/2+8,H/2,14,'#8a6a3a');
 const px=lw+24,pw=W-px-14;wrapC('Press wedges to write '+q.ans,px+pw/2,52,pw,18,'#fff');const bw=(pw-10)/2,bh=64;
 [['Corner wedge = 10',0],['Tall wedge = 1',1]].forEach((b,i)=>{const x=px+i*(bw+10),y=80;card(x,y,bw,bh,'#d9b98a');if(i===0)wedgeC(x+bw/2,y+24,26);else wedgeV(x+bw/2,y+26,26);txt(b[0],x+bw/2,y+bh-10,11,'#3a2410');btns.push({x,y,w:bw,h:bh,f:()=>q.add(i)})});
 card(px,154,bw,40,'#555');txt('↶ Undo',px+bw/2,174,15);btns.push({x:px,y:154,w:bw,h:40,f:()=>q.undo()});card(px+bw+10,154,bw,40,'#2a8a3a');txt('✔ Check',px+bw*1.5+10,174,15);btns.push({x:px+bw+10,y:154,w:bw,h:40,f:()=>q.check()});
 txt('So far: '+q.t+' × 10 + '+q.o+' × 1 = '+(q.t*10+q.o),px+pw/2,214,13,'#ffcf5a');if(msg)wrapC(msg,px+pw/2,H-30,pw,13,msgCol)},
 key(e,q){if(e.key==='1')q.add(0);else if(e.key==='2')q.add(1);else if(e.key==='Backspace')q.undo();else if(e.key==='Enter')q.check()}};
function makeQ(){const L=LV[cur];let m=L.m;if(m==='mix')m=pick(['quiz','map','read','cb','r60']);const q={m,used:(Q&&Q.used)||[]};
 if(m==='tl'){tlQ(q,TL,fy);return q}
 if(m==='map'){const f=fromList(MAPK,q);q.vis=mapVis;q.text='What is at the point marked '+f[0]+'?';q.opts=shuffle(MAPK.map(k=>k[1]).filter(v=>v!==f[1])).slice(0,3).concat(f[1]);q.opts=shuffle(q.opts);q.ans=f[1];q.why=f[0]+' = '+f[1]+'.';return q}
 if(m==='read'||m==='r60'){const r=L.m==='read'?L.r:pick([[1,9],[10,59],[61,300]]);const n=ri(r[0],r[1]);q.vis=numVis(n);q.text='What number is on the tablet?';const set=new Set([n]);while(set.size<4){const d=n+pick([-11,-10,-1,1,10,11,60,-60,9,-9]);if(d>0&&d!==n)set.add(d)}q.opts=shuffle([...set].map(String));q.ans=String(n);q.why=n>=60?Math.floor(n/60)+' sixty + '+(n%60)+' = '+n+'.':Math.floor(n/10)+' ten(s) + '+(n%10)+' one(s) = '+n+'.';return q}
 if(m==='cb'){const r=L.m==='cb'?L.r:[1,59];const n=ri(r[0],r[1]);q.ans=n;q.t=0;q.o=0;q.hist=[];q.add=i=>{if(lock)return;if(i===0&&q.t<5){q.t++;q.hist.push(0)}else if(i===1&&q.o<9){q.o++;q.hist.push(1)}sfx.tap();msg='';draw()};q.undo=()=>{if(lock)return;const h=q.hist.pop();if(h===0)q.t--;else if(h===1)q.o--;draw()};q.check=()=>{if(lock)return;const v=q.t*10+q.o;if(v===n)good(n+' — written like a Babylonian scribe!');else bad(v+' is '+(v<n?'too small':'too big')+'. You need '+Math.floor(n/10)+' corner wedge(s) and '+(n%10)+' tall wedge(s).')};return q}
 quizQ(q,fromList(L.k||pick([Q_LAND,Q_ZIG,Q_INV,Q_LAW,Q_60,Q_LIFE]),q));return q}
window.G={get Q(){return Q},LV,step(){const q=Q;if(!q||q.m!=='cb')return null;const n=q.ans;if(q.t<Math.floor(n/10))return 0;if(q.o<n%10)return 1;return 3}};
resize();cur=0;Q=makeQ();draw();showLevels();


</script></body></html>
