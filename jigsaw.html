   if(li<2){g.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<4;i++){const px=R()*w,py=h*(b-.12);g.beginPath();g.moveTo(px,py);g.lineTo(px-w*.04,py+h*.07);g.lineTo(px+w*.04,py+h*.07);g.fill()}}});

 else if(t===2){g.fillStyle=grad(['#0b6fb8','#5fc3e8','#c9f1ff'],0,0,0,h*.45);g.fillRect(0,0,w,h);g.fillStyle=grad(['#1c8fc4','#0a4a7a','#04203a'],0,h*.45,0,h);g.fillRect(0,h*.45,w,h);
  for(let i=0;i<60;i++){g.strokeStyle=`rgba(255,255,255,${.15+R()*.3})`;g.lineWidth=1.5;const y=h*(.47+R()*.5),x=R()*w;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+10,y-4,x+20+R()*30,y);g.stroke()}

  g.fillStyle='#fff';g.beginPath();g.moveTo(w*.25,h*.47);g.lineTo(w*.32,h*.47);g.lineTo(w*.285,h*.3);g.fill();g.fillStyle='#8b4513';g.fillRect(w*.23,h*.47,w*.1,h*.025);

 else if(t===3){const hb=R()*360;g.fillStyle=`hsl(${hb},50%,15%)`;g.fillRect(0,0,w,h);for(let i=0;i<30;i++){g.fillStyle=`hsla(${hb+R()*180},80%,${45+R()*25}%,.8)`;const x=R()*w,y=R()*h,s=h*(.05+R()*.2);g.save();g.translate(x,y);g.rotate(R()*6);const k=R()*3|0;g.beginPath();if(k==0)g.arc(0,0,s,0,7);else if(k==1)g.rect(-s,-s,s*2,s*2);else{g.moveTo(0,-s);g.lineTo(s,s);g.lineTo(-s,s)}g.fill();g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=3;g.stroke();g.restore()}

   for(let yy=by+6;yy<h-6;yy+=9)for(let xx=x+4;xx<x+bw-5;xx+=8)if(R()<.4){g.fillStyle=`hsl(${40+R()*30},100%,${55+R()*25}%)`;g.fillRect(xx,yy,4,5)}
   if(R()<.3){g.fillStyle=`hsl(${R()*360},100%,60%)`;g.fillRect(x+bw*.2,by+8,bw*.6,5)}x+=bw+2}}
 else{g.fillStyle=grad(['#bfe6ff','#e6f7d8'],0,0,0,h*.5);g.fillRect(0,0,w,h);g.fillStyle=grad(['#6bbf4a','#2d7a2a'],0,h*.45,0,h);g.fillRect(0,h*.45,w,h);
  for(let i=0;i<55;i++){const x=R()*w,y=h*(.5+R()*.48),s=h*(.03+R()*.05)*(y/h),hu=[0,40,300,330,50,200][R()*6|0];g.strokeStyle='#2a6a20';g.lineWidth=2;g.beginPath();g.moveTo(x,y);g.lineTo(x,y+s*3);g.stroke();
   for(let k=0;k<6;k++){g.fillStyle=`hsl(${hu},85%,${60+R()*15}%)`;g.beginPath();g.ellipse(x+Math.cos(k*1.05)*s*.7,y+Math.sin(k*1.05)*s*.7,s*.6,s*.35,k*1.05,0,7);g.fill()}g.fillStyle='#ffd23a';g.beginPath();g.arc(x,y,s*.35,0,7);g.fill()}
  for(let i=0;i<4;i++){const x=R()*w,y=R()*h*.4;g.fillStyle=`hsl(${R()*360},90%,60%)`;g.beginPath();g.ellipse(x-8,y,8,5,.5,0,7);g.ellipse(x+8,y,8,5,-.5,0,7);g.fill()}}
 return c}
// piece shape
function edgePath(p,x0,y0,x1,y1,s){// s: 0 flat, 1 out, -1 in ; normal is to the left of direction rotated
 if(!s){p.lineTo(x1,y1);return}const dx=x1-x0,dy=y1-y0,nx=dy,ny=-dx;// outward normal for clockwise traversal
 const P=(t,n)=>[x0+dx*t+nx*n*s,y0+dy*t+ny*n*s];const pts=[[.35,0],[.37,.05],[.4,.15],[.38,.2],[.32,.3],[.4,.36],[.5,.36],[.6,.36],[.68,.3],[.62,.2],[.6,.15],[.63,.05],[.65,0]];
 let a=P(...pts[0]);p.lineTo(a[0],a[1]);for(let i=1;i+2<pts.length;i+=3){const b=P(...pts[i]),c=P(...pts[i+1]),d=P(...pts[i+2]);p.bezierCurveTo(b[0],b[1],c[0],c[1],d[0],d[1])}p.lineTo(x1,y1)}
function piecePath(pc){const p=new Path2D();const w=pw,h=ph;p.moveTo(0,0);edgePath(p,0,0,w,0,pc.e[0]);edgePath(p,w,0,w,h,pc.e[1]);edgePath(p,w,h,0,h,pc.e[2]);edgePath(p,0,h,0,0,pc.e[3]);p.closePath();return p}
function relayout(){const top=40,avH=H-top-10;let bw=Math.min(W*.56,avH*1.5),bh=bw/1.5;board={x:(W-bw)/2,y:top+(avH-bh)/2,w:bw,h:bh};const opw=pw;pw=bw/cols;ph=bh/rows;tab=Math.min(pw,ph)*.36;
 const sc=opw?pw/opw:1;pic=genPic(Math.round(bw*DPR),Math.round(bh*DPR),theme,seedBase);pieces.forEach(pc=>{pc.path=piecePath(pc);renderPiece(pc);if(pc.locked){pc.x=board.x+pc.c*pw;pc.y=board.y+pc.r*ph}else{pc.x=(pc.x-ob.x)*sc+board.x;pc.y=(pc.y-ob.y)*sc+board.y;clampP(pc)}});ob={...board}}
let ob={x:0,y:0},seedBase=1;
function renderPiece(pc){const m=tab*1.05,c=document.createElement('canvas');c.width=Math.ceil((pw+2*m)*DPR);c.height=Math.ceil((ph+2*m)*DPR);const g=c.getContext('2d');g.scale(DPR,DPR);g.translate(m,m);g.save();g.clip(pc.path);
 g.drawImage(pic,(pc.c*pw-m)*DPR,(pc.r*ph-m)*DPR,(pw+2*m)*DPR,(ph+2*m)*DPR,-m,-m,pw+2*m,ph+2*m);g.restore();
 g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1.2;g.save();g.translate(-.6,-.6);g.stroke(pc.path);g.restore();g.strokeStyle='rgba(0,0,0,.45)';g.save();g.translate(.6,.6);g.stroke(pc.path);g.restore();pc.img=c;pc.m=m}
function clampP(pc){pc.x=Math.max(-pw*.2,Math.min(W-pw*.8,pc.x));pc.y=Math.max(40,Math.min(H-ph*.8,pc.y))}
function scatter(all){const loose=pieces.filter(p=>!p.locked);const L=board.x,Rr=W-board.x-board.w;loose.forEach((pc,i)=>{let tries=0,x,y;do{const left=(i%2==0&&L>pw*.6)||Rr<pw*.6;x=left?Math.random()*Math.max(4,L-pw)+4:board.x+board.w+Math.random()*Math.max(4,Rr-pw-4);y=44+Math.random()*(H-50-ph);tries++}while(tries<5&&loose.slice(0,i).some(q=>Math.abs(q.x-x)<pw*.5&&Math.abs(q.y-y)<ph*.5));
  if(L<pw*.6&&Rr<pw*.6){x=Math.random()*(W-pw);y=44+Math.random()*(H-50-ph)}pc.x=x;pc.y=y;clampP(pc)})}
function start(){[cols,rows]=DIFFS[diff];seedBase=(Math.random()*1e9|0)+1;const e=[];seed=seedBase+7;const hz=[],vt=[];for(let r=0;r<rows;r++){hz[r]=[];vt[r]=[];for(let c=0;c<cols;c++){hz[r][c]=Math.random()<.5?1:-1;vt[r][c]=Math.random()<.5?1:-1}}
 pieces=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const pc={r,c,locked:false,x:0,y:0,e:[r==0?0:-vt[r-1][c],c==cols-1?0:hz[r][c],r==rows-1?0:vt[r][c],c==0?0:-hz[r][c-1]]};pieces.push(pc)}
 pw=0;ob={x:0,y:0};state='play';relayout();scatter();pieces.sort(()=>Math.random()-.5);time=0;moves=0;paused=false;preview=false;parts=[];newBest=false;drag=null}
function key(){return cols+'x'+rows}
function saveHub(t){t=Math.floor(t);if(!(t>0))return;try{const prev=localStorage.getItem('arcade-jigsaw-best');if(prev==null||prev===''||t<+prev)localStorage.setItem('arcade-jigsaw-best',String(t))}catch(e){}}
function win(){state='win';winT=0;const k=key();if(!best[k]||time<best[k]){best[k]=time;newBest=true;try{localStorage.setItem('jigsawBest',JSON.stringify(best))}catch(e){}}saveHub(time);sWin();for(let i=0;i<160;i++)parts.push({x:W/2,y:H/2,vx:(Math.random()-.5)*14,vy:-Math.random()*12-2,c:`hsl(${Math.random()*360},90%,60%)`,l:1,r:Math.random()*6})}
// input
function pt(e){return{x:e.clientX,y:e.clientY}}
function hit(x,y){for(let i=pieces.length-1;i>=0;i--){const pc=pieces[i];if(pc.locked)continue;if(x<pc.x-tab||x>pc.x+pw+tab||y<pc.y-tab||y>pc.y+ph+tab)continue;ctx.setTransform(1,0,0,1,0,0);if(ctx.isPointInPath(pc.path,x-pc.x,y-pc.y))return i;}
 for(let i=pieces.length-1;i>=0;i--){const pc=pieces[i];if(!pc.locked&&x>pc.x&&x<pc.x+pw&&y>pc.y&&y<pc.y+ph)return i}return -1}
function fmt(t){t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
cv.addEventListener('pointerdown',e=>{au();const p=pt(e);for(const b of btns)if(p.x>b.x&&p.x<b.x+b.w&&p.y>b.y&&p.y<b.y+b.h){b.f();return}
 if(state!=='play'||paused)return;const i=hit(p.x,p.y);if(i<0)return;const pc=pieces.splice(i,1)[0];pieces.push(pc);drag={pc,dx:p.x-pc.x,dy:p.y-pc.y,id:e.pointerId,lift:e.pointerType==='touch'?0:0};sPick();try{cv.setPointerCapture(e.pointerId)}catch(_){}});

function drop(e){if(!drag||(e&&e.pointerId!==drag.id))return;const pc=drag.pc;drag=null;moves++;clampP(pc);const tx=board.x+pc.c*pw,ty=board.y+pc.r*ph;if(Math.hypot(pc.x-tx,pc.y-ty)<Math.min(pw,ph)*.32){pc.x=tx;pc.y=ty;pc.locked=true;pc.flash=1;pieces.splice(pieces.indexOf(pc),1);pieces.unshift(pc);sSnap();for(let i=0;i<14;i++)parts.push({x:tx+pw/2,y:ty+ph/2,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,c:'#fff8b0',l:.6,r:0});if(pieces.every(q=>q.locked))win()}else sDrop()}
cv.addEventListener('pointerup',drop);cv.addEventListener('pointercancel',drop);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();au();if(state==='menu'){if(k==='arrowleft')theme=(theme+THEMES.length-1)%THEMES.length;if(k==='arrowright')theme=(theme+1)%THEMES.length;if(k==='arrowup')diff=Math.max(0,diff-1);if(k==='arrowdown')diff=Math.min(3,diff+1);if(k>='1'&&k<='4')diff=+k-1;if(!e.repeat&&(k==='enter'||k===' '))start();return}
 if(e.repeat)return;if(k==='p'&&state==='play')paused=!paused;if(k==='r')start();if(k==='h'||k==='v')preview=!preview;if(k==='s'&&state==='play'&&!paused)scatter();if(k==='escape'||k==='m')state='menu';if(k==='enter'&&state==='win')start()});
// drawing
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function button(x,y,w,h,label,f,on){rr(x,y,w,h,8);ctx.fillStyle=on?'#ffb03a':'rgba(255,255,255,.12)';ctx.fill();ctx.strokeStyle=on?'#fff':'rgba(255,255,255,.3)';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle=on?'#2a1640':'#fff';ctx.font=`bold ${Math.min(15,h*.42)}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x+w/2,y+h/2+1);btns.push({x,y,w,h,f})}
let thumbs={};function thumb(t){if(!thumbs[t])thumbs[t]=genPic(150,100,t,1234+t*99);return thumbs[t]}
function bg(){const g=ctx.createRadialGradient(W/2,H/2,10,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'#3a2a5e');g.addColorStop(1,'#140f24');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.03)';for(let x=0;x<W;x+=24)ctx.fillRect(x,0,1,H)}
function drawMenu(){bg();ctx.fillStyle='#ffd76b';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`900 ${Math.min(42,H*.1)}px system-ui,sans-serif`;ctx.fillText('🧩 JIGSAW STUDIO',W/2,H*.1);
 const n=THEMES.length,tw=Math.min(120,(W-40)/n-10),th=tw/1.5,ty=H*.2,tx0=W/2-(n*(tw+10)-10)/2;
 for(let i=0;i<n;i++){const x=tx0+i*(tw+10);ctx.drawImage(thumb(i),x,ty,tw,th);ctx.strokeStyle=i===theme?'#ffb03a':'rgba(255,255,255,.25)';ctx.lineWidth=i===theme?4:1.5;ctx.strokeRect(x,ty,tw,th);ctx.fillStyle=i===theme?'#ffb03a':'#ccc';ctx.font='bold 12px system-ui';ctx.fillText(THEMES[i],x+tw/2,ty+th+12);btns.push({x,y:ty,w:tw,h:th+20,f:()=>{theme=i;tone(600,.05)}})}
 const by=ty+th+30,bw=Math.min(150,(W-60)/4-10),bh=Math.min(50,H*.13),bx0=W/2-(4*(bw+10)-10)/2;
 DIFFS.forEach((d,i)=>{const k=d[0]+'x'+d[1];button(bx0+i*(bw+10),by,bw,bh,`${k} · ${d[0]*d[1]} pcs`,()=>{diff=i;tone(600,.05)},i===diff);ctx.fillStyle='#bbb';ctx.font='12px system-ui';ctx.fillText(best[k]?'Best '+fmt(best[k]):'—',bx0+i*(bw+10)+bw/2,by+bh+11)});
 button(W/2-90,Math.min(H-bh-6,by+bh+24),180,bh,'▶ START',start,true);
 ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='11px system-ui';ctx.fillText('Drag pieces onto the board · P pause · R restart · H preview · S scatter · Esc menu',W/2,H-6)}
function drawGame(dt){bg();// board
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(board.x-4,board.y-4,board.w+8,board.h+8);ctx.fillStyle='#2b2244';ctx.fillRect(board.x,board.y,board.w,board.h);
 ctx.globalAlpha=preview?.55:.12;ctx.drawImage(pic,board.x,board.y,board.w,board.h);ctx.globalAlpha=1;
 ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;for(let c=1;c<cols;c++){ctx.beginPath();ctx.moveTo(board.x+c*pw,board.y);ctx.lineTo(board.x+c*pw,board.y+board.h);ctx.stroke()}for(let r=1;r<rows;r++){ctx.beginPath();ctx.moveTo(board.x,board.y+r*ph);ctx.lineTo(board.x+board.w,board.y+r*ph);ctx.stroke()}
 for(const pc of pieces){const dr=drag&&drag.pc===pc;if(!pc.locked){ctx.save();ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=dr?18:6;ctx.shadowOffsetY=dr?8:3}
  const sc=dr?1.06:1;ctx.drawImage(pc.img,pc.x-pc.m-(sc-1)*pw/2,pc.y-pc.m-(sc-1)*ph/2,(pw+2*pc.m)*sc,(ph+2*pc.m)*sc);if(!pc.locked)ctx.restore();
  if(pc.flash>0){ctx.save();ctx.translate(pc.x,pc.y);ctx.strokeStyle=`rgba(255,240,150,${pc.flash})`;ctx.lineWidth=3;ctx.stroke(pc.path);ctx.restore();pc.flash-=dt*2}}
 if(state==='win'){ctx.globalAlpha=Math.min(1,winT);ctx.drawImage(pic,board.x,board.y,board.w,board.h);ctx.globalAlpha=1}
 // HUD
 ctx.fillStyle='rgba(10,6,20,.75)';ctx.fillRect(0,0,W,36);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='middle';ctx.font='bold 14px system-ui';const placed=pieces.filter(p=>p.locked).length;
 const label=`⏱ ${fmt(time)}   ✋ ${moves}   🧩 ${placed}/${pieces.length}`;ctx.fillText(label,96,18);const b=best[key()];if(b){const bestLabel='Best '+fmt(b);const room=W-6-5*44-8;if(96+ctx.measureText(label).width+12+ctx.measureText(bestLabel).width<room){ctx.fillStyle='#ffd76b';ctx.fillText(bestLabel,96+ctx.measureText(label).width+12,18)}}
 let bx=W-6;[['☰',()=>state='menu'],['↻',start],[paused?'▶':'II',()=>{if(state==='play')paused=!paused}],['🔀',()=>{if(state==='play'&&!paused)scatter()}],['👁',()=>preview=!preview,preview]].forEach(([l,f,on])=>{bx-=44;button(bx,3,40,30,l,f,on)});
 if(paused){ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,36,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 40px system-ui';ctx.fillText('PAUSED',W/2,H/2-20);button(W/2-70,H/2+10,140,44,'Resume',()=>paused=false,true)}
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.l-=dt*.4;p.r+=.2;ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,p.l);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillRect(-4,-2,8,4);ctx.restore()}ctx.globalAlpha=1;parts=parts.filter(p=>p.l>0&&p.y<H+20);
 if(state==='win'&&winT>.8){ctx.fillStyle='rgba(0,0,0,.6)';rr(W/2-150,H/2-70,300,140,16);ctx.fill();ctx.textAlign='center';ctx.fillStyle='#ffd76b';ctx.font='900 30px system-ui';ctx.fillText('COMPLETE!',W/2,H/2-42);ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.fillText(`${key()} · ${fmt(time)} · ${moves} moves`,W/2,H/2-12);if(newBest){ctx.fillStyle='#7dff9a';ctx.fillText('★ NEW BEST TIME ★',W/2,H/2+10)}
  button(W/2-135,H/2+24,130,38,'Play Again',start,true);button(W/2+5,H/2+24,130,38,'Menu',()=>state='menu')}}
function loop(t){const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;btns=[];ctx.setTransform(DPR,0,0,DPR,0,0);
 try{if(state==='menu')drawMenu();else{if(state==='play'&&!paused&&!document.hidden)time+=dt;if(state==='win'){winT+=dt;if(winT>1.5&&winT<9&&Math.random()<.1)for(let i=0;i<20;i++)parts.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*3,vy:Math.random()*2,c:`hsl(${Math.random()*360},90%,60%)`,l:2,r:0})}drawGame(dt)}}catch(err){console.error(err)}
 requestAnimationFrame(loop)}
resize();requestAnimationFrame(loop);
</script></body></html>
