<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Brick Bounce</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0b14;color:#f4f1ea;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:44px 8px 8px;user-select:none;touch-action:manipulation}
a.back{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:30;box-sizing:border-box;display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(8,8,16,.82);color:#ffe14d;border:1px solid rgba(255,225,77,.55);font:700 12px/1 ui-monospace,monospace;letter-spacing:.04em;text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a.back:focus-visible{outline:2px solid #ffe14d;outline-offset:2px}
.hud{margin:0;font:700 12px/1.25 ui-monospace,monospace;color:#c8c4d8;text-align:center;flex:0 0 auto}
.stage{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{border-radius:12px;max-width:100%;max-height:100%;width:auto;height:auto;touch-action:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(560px,100%);flex:0 0 auto}
button{min-height:40px;min-width:44px;padding:0 12px;border-radius:10px;border:1px solid #3a3358;background:#171426;color:#ffe14d;font:700 15px/1 ui-monospace,monospace;touch-action:manipulation}
button.on{background:#ffe14d;color:#0b0b14}
#c{background:#10141c}
</style>
</head>
<body data-state="ready">
<a class="back" href="./index.html" aria-label="Back to menu" onpointerdown="event.stopPropagation()" ontouchstart="event.stopPropagation()">← Menu</a>
<p class="hud">Brick Bounce · Score <span id="score">0</span> · Best <span id="best">0</span> · Lives <span id="lives">3</span><br>Drag, arrows, or buttons · P pause · R restart</p>
<div class="stage"><canvas id="c" width="480" height="320"></canvas></div>
<div class="bar">
<button type="button" data-act="left" aria-label="Left">←</button>
<button type="button" data-act="right" aria-label="Right">→</button>
<button type="button" data-act="pause">Pause</button>
<button type="button" data-act="restart">Restart</button>
</div>
<script>
"use strict";
const W=480,H=320,cv=document.getElementById("c"),ctx=cv.getContext("2d");
const keys={left:false,right:false};
let paddle,ball,bricks,score=0,best=0,lives=3,state="ready",paused=false,won=false;
function loadBest(){try{return +localStorage.getItem("arcade-brick-best")||0}catch(e){return 0}}
function saveBest(){try{if(score>best){best=score;localStorage.setItem("arcade-brick-best",String(best))}}catch(e){}}
best=loadBest();
function beep(f,d){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!beep.ac)beep.ac=new AC();const a=beep.ac;if(a.state==="suspended")a.resume();const o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function sync(){document.body.dataset.state=state;document.getElementById("score").textContent=score;document.getElementById("best").textContent=best;document.getElementById("lives").textContent=lives}
function layout(){paddle={x:W/2-40,w:80,h:12};ball={x:W/2,y:H-48,vx:3.2,vy:-3.2,r:6};bricks=[];const cols=["#ff6b6b","#ffe14d","#7ad07a","#6aa0e8","#e07098"];for(let r=0;r<5;r++)for(let c=0;c<8;c++)bricks.push({x:16+c*57,y:28+r*22,w:52,h:16,on:true,c:cols[r]})}
function serve(){ball.x=paddle.x+paddle.w/2;ball.y=H-48;ball.vx=3.2*(Math.random()<.5?-1:1);ball.vy=-3.2}
function start(){if(state==="play")return;score=0;lives=3;won=false;paused=false;state="play";layout();sync();beep(480,.05)}
function aim(clientX){const r=cv.getBoundingClientRect();const x=(clientX-r.left)/r.width*W;paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2))}
function update(){if(keys.left)paddle.x-=7;if(keys.right)paddle.x+=7;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<ball.r||ball.x>W-ball.r)ball.vx*=-1;if(ball.y<ball.r)ball.vy=Math.abs(ball.vy);const py=H-28;if(ball.vy>0&&ball.y+ball.r>=py&&ball.y<=py+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){ball.vy=-Math.abs(ball.vy);ball.vx+=(ball.x-(paddle.x+paddle.w/2))/18;ball.vx=Math.max(-6,Math.min(6,ball.vx));beep(520,.03)}if(ball.y>H+8){lives--;beep(140,.1);if(lives<=0){state="over";saveBest()}else serve();sync();return}for(const b of bricks)if(b.on&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.on=false;ball.vy*=-1;score+=10;saveBest();beep(760,.03);break}if(bricks.every(b=>!b.on)){score+=100;saveBest();won=true;state="over";beep(880,.12)}sync()}
function draw(){ctx.fillStyle="#10141c";ctx.fillRect(0,0,W,H);for(const b of bricks||[])if(b.on){ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h)}if(paddle){ctx.fillStyle="#ffe14d";ctx.fillRect(paddle.x,H-28,paddle.w,paddle.h)}if(ball){ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill()}ctx.fillStyle="#fff";ctx.font="bold 18px sans-serif";ctx.textAlign="center";if(state==="ready")ctx.fillText("Enter or tap to serve",W/2,H/2);if(paused&&state==="play")ctx.fillText("Paused",W/2,H/2);if(state==="over")ctx.fillText(won?"Cleared":"Out of lives",W/2,H/2)}
function act(n){if(n==="pause"){if(state==="play")paused=!paused;return}if(n==="restart"){state="ready";start();return}if(state!=="play")start();if(n==="left")keys.left=true;if(n==="right")keys.right=true}
addEventListener("keydown",e=>{const k=e.key;if(["ArrowLeft","ArrowRight"," "].includes(k))e.preventDefault();if(k==="ArrowLeft"||k==="a"||k==="A"){keys.left=true;if(state!=="play")start()}else if(k==="ArrowRight"||k==="d"||k==="D"){keys.right=true;if(state!=="play")start()}else if(k==="Enter"||k===" ")start();else if(k==="p"||k==="P"||k==="Escape"){if(state==="play")paused=!paused}else if(k==="r"||k==="R"){state="ready";start()}});
addEventListener("keyup",e=>{const k=e.key;if(k==="ArrowLeft"||k==="a"||k==="A")keys.left=false;if(k==="ArrowRight"||k==="d"||k==="D")keys.right=false});
document.querySelectorAll("button").forEach(b=>{b.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();act(b.dataset.act)});b.addEventListener("pointerup",()=>{if(b.dataset.act==="left")keys.left=false;if(b.dataset.act==="right")keys.right=false});b.addEventListener("pointerleave",()=>{if(b.dataset.act==="left")keys.left=false;if(b.dataset.act==="right")keys.right=false})});
function point(e){if(state!=="play")start();if(paddle)aim(e.clientX)}
cv.addEventListener("pointerdown",point);
cv.addEventListener("pointermove",e=>{if(e.buttons||e.pointerType==="touch")point(e)});
cv.addEventListener("touchstart",e=>{e.preventDefault();if(state!=="play")start();if(e.touches[0])aim(e.touches[0].clientX)},{passive:false});
cv.addEventListener("touchmove",e=>{e.preventDefault();if(e.touches[0]&&paddle)aim(e.touches[0].clientX)},{passive:false});
function loop(){requestAnimationFrame(loop);if(state==="play"&&!paused)update();draw()}
layout();sync();requestAnimationFrame(loop);
</script>
</body>
</html>
