<canvas id="c"></canvas><script>
"use strict";
// ================= ENGINE =================
const E=(()=>{
function newState(){const c=[new Array(26).fill(0),new Array(26).fill(0)];for(const p of[0,1]){c[p][24]=2;c[p][13]=5;c[p][8]=3;c[p][6]=5;}return{c};}
function clone(s){return{c:[s.c[0].slice(),s.c[1].slice()]};}
function key(s){return s.c[0].join(',')+'|'+s.c[1].join(',');}
function allHome(s,p){const a=s.c[p];if(a[25])return false;for(let i=7;i<=24;i++)if(a[i])return false;return true;}
function singles(s,p,d){const a=s.c[p],o=s.c[1-p],r=[];
 if(a[25]>0){const to=25-d;if(o[25-to]<=1)r.push({from:25,to,die:d});return r;}
 const home=allHome(s,p);
 for(let f=24;f>=1;f--){if(!a[f])continue;const to=f-d;
  if(to>=1){if(o[25-to]<=1)r.push({from:f,to,die:d});}
  else if(home){if(to===0)r.push({from:f,to:0,die:d});else{let hi=false;for(let i=f+1;i<=6;i++)if(a[i]){hi=true;break;}if(!hi)r.push({from:f,to:0,die:d});}}}
 return r;}
function applyIn(n,p,m){const a=n.c[p],o=n.c[1-p];a[m.from]--;let hit=false;if(m.to>0){const oi=25-m.to;if(o[oi]===1){o[oi]=0;o[25]++;hit=true;}a[m.to]++;}else a[0]++;return hit;}
function apply(s,p,m){const n=clone(s);applyIn(n,p,m);return n;}
function rem(dl,d){const i=dl.indexOf(d);const r=dl.slice();if(i>=0)r.splice(i,1);return r;}
function uniq(a){return[...new Set(a)];}
function expand(d1,d2){return d1===d2?[d1,d1,d1,d1]:[d1,d2];}
function maxPlay(s,p,dl,memo){if(!dl.length)return 0;const k=key(s)+'#'+dl.join('');if(memo.has(k))return memo.get(k);let best=0;
 outer:for(const d of uniq(dl))for(const m of singles(s,p,d)){const v=1+maxPlay(apply(s,p,m),p,rem(dl,d),memo);if(v>best)best=v;if(best===dl.length)break outer;}
 memo.set(k,best);return best;}
// legal next single moves honoring max-dice & higher-die rules
function legalNext(s,p,dl){if(!dl.length)return[];const memo=new Map();const mx=maxPlay(s,p,dl,memo);if(!mx)return[];let res=[];
 for(const d of uniq(dl))for(const m of singles(s,p,d))if(1+maxPlay(apply(s,p,m),p,rem(dl,d),memo)===mx)res.push(m);
 if(mx===1&&dl.length===2&&dl[0]!==dl[1]){const hi=Math.max(dl[0],dl[1]);const h=res.filter(m=>m.die===hi);if(h.length)res=h;}
 return res;}
// all distinct final positions with full legal move sequences
function finals(s,p,dl0){const out=new Map();let mx=0;const seen=new Set();
 function rec(st,dl,mv){const k=key(st)+'#'+dl.join('');if(seen.has(k))return;seen.add(k);let any=false;
  for(const d of uniq(dl))for(const m of singles(st,p,d)){any=true;rec(apply(st,p,m),rem(dl,d),mv.concat([m]));}
  if(!any){if(mv.length>mx){mx=mv.length;out.clear();}if(mv.length===mx){const kk=key(st);if(!out.has(kk))out.set(kk,{s:st,moves:mv});}}}
 rec(s,dl0.slice(),[]);let r=[...out.values()];
 if(mx===1&&dl0.length===2&&dl0[0]!==dl0[1]){const hi=Math.max(dl0[0],dl0[1]);const h=r.filter(x=>x.moves[0].die===hi);if(h.length)r=h;}
 return r;}
function pips(s,p){let t=0;const a=s.c[p];for(let i=1;i<=25;i++)t+=i*a[i];return t;}
function contact(s){const a=s.c[0],b=s.c[1];let wm=0,bm=0;for(let i=25;i>=1;i--)if(a[i]){wm=i;break;}for(let i=25;i>=1;i--)if(b[i]){bm=i;break;}return wm+bm>24;}
function blotRisk(s,p){const a=s.c[p],o=s.c[1-p];let pen=0;
 for(let x=1;x<=24;x++){if(a[x]!==1)continue;let pr=0;
  for(let y=0;y<x;y++){const n=y===0?o[25]:o[25-y];if(!n)continue;const d=x-y;pr+=d<=6?11/36:d<=8?6/36:d<=12?3/36:d<=18?1/36:0;}
  if(pr>0){pr=Math.min(pr,0.9);pen+=pr*((25-x)*0.55+3);}}
 return pen;}
function evaluate(s,p){const a=s.c[p],o=s.c[1-p];if(a[0]===15)return 1000;if(o[0]===15)return -1000;
 const mp=pips(s,p),op=pips(s,1-p);let v=op-mp;
 if(!contact(s)){let w=0;for(let i=1;i<=6;i++)w+=a[i]*(i===1?1:0);return v*1.3+a[0]*0.6-o[0]*0.6-w*0.3;}
 const side=(A,sg)=>{let run=0,best=0,hm=0;for(let i=1;i<=24;i++){if(A[i]>=2){v+=sg*(i<=6?3.5:i<=11?2.2:0.6);if(i===5||i===7||i===4)v+=sg*1.5;if(i<=6)hm++;run++;if(run>best)best=run;}else run=0;}if(best>=3)v+=sg*(best-2)*3.2;
  // stacking penalty
  for(let i=1;i<=24;i++)if(A[i]>3)v-=sg*(A[i]-3)*0.6;return hm;};
 const myH=side(a,1),opH=side(o,-1);
 v+=o[25]*(4+myH*2.2);v-=a[25]*(4+opH*2.2);
 v-=blotRisk(s,p);v+=0.6*blotRisk(s,1-p);
 // back checkers trapped
 return v;}
const ROLLS=[];for(let i=1;i<=6;i++)for(let j=i;j<=6;j++)ROLLS.push([i,j,i===j?1:2]);
function choose(s,p,dl,level){const F=finals(s,p,dl);if(!F.length)return null;if(F.length===1)return F[0];
 if(level==='easy')return F[Math.random()*F.length|0];
 for(const f of F)f.v0=evaluate(f.s,p);
 if(level==='medium'){let b=F[0],bv=-1e9;for(const f of F){const v=f.v0+Math.random()*1.5;if(v>bv){bv=v;b=f;}}return b;}
 F.sort((x,y)=>y.v0-x.v0);const C=F.slice(0,8);let b=C[0],bv=-1e9;
 for(const f of C){if(f.s.c[p][0]===15)return f;let tot=0;
  for(const[d1,d2,w]of ROLLS){const R=finals(f.s,1-p,expand(d1,d2));let val;
   if(!R.length)val=evaluate(f.s,p);else{let bo=-1e9;for(const r of R){const ov=evaluate(r.s,1-p);if(ov>bo)bo=ov;}val=-bo;}
   tot+=w*val;}
  const ev=tot/36;if(ev>bv){bv=ev;b=f;}}
 return b;}
function winProb(s,p){const v=evaluate(s,p);return 1/(1+Math.exp(-v/11));}
function result(s,w){const o=1-w,b=s.c[o];if(b[0]>0)return 1;if(b[25]>0)return 3;for(let i=19;i<=24;i++)if(b[i])return 3;return 2;}
return{newState,clone,key,singles,applyIn,apply,rem,expand,legalNext,finals,pips,evaluate,choose,winProb,result,allHome,maxPlay};
})();

// ================= SAVE =================
const SKEY='bgSave';
let SAVE={settings:{mode:'medium',match:3,cube:true},stats:{games:0,wins:0,gammons:0,backgammons:0,matches:0,matchWins:0,lv:{easy:[0,0],medium:[0,0],hard:[0,0]},pvp:0}};
try{const j=JSON.parse(localStorage.getItem(SKEY)||'null');if(j&&j.stats){SAVE.settings=Object.assign(SAVE.settings,j.settings||{});SAVE.stats=Object.assign(SAVE.stats,j.stats);}}catch(e){}
function winTotal(){return SAVE.stats.wins|0;}
function saveHub(){try{const n=winTotal();if(!(n>0))return;const k='arcade-bg-best';const prev=Number(localStorage.getItem(k));if(Number.isFinite(prev)&&prev>=n)return;localStorage.setItem(k,String(n));}catch(e){}}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(SAVE));}catch(e){}saveHub()}

// ================= AUDIO =================
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended'){const p=AC.resume();if(p&&p.catch)p.catch(()=>{});}return AC;}
function tone(f,d,type,v,delay){try{const a=AC;if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||0.12,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}}
function noise(d,v,delay,fc){try{const a=AC;if(!a)return;const t=a.currentTime+(delay||0);const n=Math.max(1,a.sampleRate*d|0);const b=a.createBuffer(1,n,a.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=fc||2000;f.Q.value=1.2;const g=a.createGain();g.gain.value=v||0.3;s.connect(f).connect(g).connect(a.destination);s.start(t);}catch(e){}}
const SFX={move(){noise(.05,.5,0,1500);tone(260,.07,'triangle',.08);},hit(){noise(.08,.7,0,900);tone(150,.15,'square',.07);},
 dice(){for(let i=0;i<7;i++)noise(.035,.45,i*.065+Math.random()*.02,2500+Math.random()*1500);},sel(){tone(720,.05,'sine',.07);},
 win(){[523,659,784,1046].forEach((f,i)=>tone(f,.25,'triangle',.12,i*.12));},lose(){[392,330,262].forEach((f,i)=>tone(f,.3,'sine',.1,i*.16));},
 cube(){tone(440,.1,'square',.06);tone(660,.15,'square',.06,.1);},off(){tone(880,.08,'sine',.08);noise(.04,.3,0,3000);}};

// ================= GAME STATE =================
const W=844,H=390;
const L0=30,R0=750,BX0=370,BX1=410,PW=(BX0-L0)/6,TOP=22,BOT=368,PH=140,RR=14,TRAY=752;
const G={phase:'menu',s:E.newState(),turn:0,dice:[],dl:[],played:[],undo:[],scores:[0,0],cube:1,owner:-1,crawford:false,crawUsed:false,inGame:false,
 sel:null,kc:-1,msg:'',anims:[],timers:[],rollT:0,rollFaces:[1,1],paused:false,legal:[],noAuto:false,plan:null,offer:-1,last:null,drag:null,buttons:[],ending:false,result:null,startTime:0};
const ST=SAVE.settings;
const isHuman=p=>!G.cpuBoth&&(ST.mode==='2p'||p===0);
const NAME=p=>ST.mode==='2p'?(p===0?'White':'Black'):(p===0?'You':'CPU');
function wait(ms,fn){G.timers.push({t:ms/1000,fn});}
function clearTimers(){G.timers=[];}

function startMatch(){G.scores=[0,0];G.crawUsed=false;G.inGame=true;startGame();}
function startGame(){clearTimers();G.anims=[];G.s=E.newState();G.cube=1;G.owner=-1;G.sel=null;G.kc=-1;G.dl=[];G.played=[];G.undo=[];G.result=null;
 G.crawford=false;if(ST.match>1&&!G.crawUsed&&(G.scores[0]===ST.match-1||G.scores[1]===ST.match-1)){G.crawford=true;G.crawUsed=true;}
 G.phase='opening';G.msg='Opening roll…';
 let a,b;do{a=1+Math.random()*6|0;b=1+Math.random()*6|0;}while(a===b);
 startRollAnim([a,b],()=>{G.turn=a>b?0:1;G.msg=NAME(G.turn)+(G.turn===0&&ST.mode!=='2p'?' start':' starts')+' with '+a+'-'+b;
  wait(700,()=>{G.dice=[Math.max(a,b),Math.min(a,b)];G.dl=E.expand(G.dice[0],G.dice[1]);G.undo=[];G.played=[];G.phase='move';enterMove();});});}
function startRollAnim(vals,cb){G.rollT=0.75;G.rollVals=vals;G.rollCb=cb;G.dice=vals.slice();SFX.dice();}
function canDouble(p){return ST.cube&&!G.crawford&&(G.owner===-1||G.owner===p)&&G.scores[p]<ST.match&&G.cube<64&&ST.match>1||(ST.cube&&ST.match===1&&false);}
function beginTurn(p){G.turn=p;G.dice=[];G.dl=[];G.sel=null;G.kc=-1;G.played=[];G.undo=[];G.noAuto=false;G.phase='roll';
 if(isHuman(p)){G.msg=(ST.mode==='2p'?NAME(p)+': ':'')+'Tap dice or Space to roll';}
 else{G.msg='CPU thinking…';wait(500,()=>{if(canDouble(p)){const pr=E.winProb(G.s,p);if(pr>0.70&&pr<0.94){offerDouble(p);return;}}doRoll();});}}
function doRoll(){if(G.phase!=='roll')return;G.phase='rolling';G.msg='';const a=1+Math.random()*6|0,b=1+Math.random()*6|0;
 startRollAnim([a,b],()=>{G.dice=[a,b];G.dl=E.expand(a,b);G.undo=[];G.played=[];G.phase='move';G.plan=null;enterMove();});}
function enterMove(){G.sel=null;G.kc=-1;G.legal=E.legalNext(G.s,G.turn,G.dl);
 if(!G.legal.length){G.ending=true;if(!G.played.length)G.msg=NAME(G.turn)+(G.turn===0&&ST.mode!=='2p'?' have':' has')+' no legal moves';
  wait(G.played.length?(isHuman(G.turn)?650:350):1300,()=>{if(G.ending){G.ending=false;beginTurn(1-G.turn);}});return;}
 G.ending=false;
 if(isHuman(G.turn)){G.msg=G.played.length?'':'Move '+(ST.mode==='2p'?NAME(G.turn)+' ':'')+'('+G.dice.join('-')+')';
  const d=distinct(G.legal);if(d.length===1&&!G.noAuto){const m=d[0];wait(380,()=>{if(G.phase==='move'&&G.legal.includes(m))playMove(m);});}
  else if(d.length>0){const srcs=[...new Set(d.map(m=>m.from))];if(srcs.length===1)G.sel=srcs[0];}}
 else{if(!G.plan){const f=E.choose(G.s,G.turn,G.dl,ST.mode);G.plan=f?f.moves.slice():[];}
  wait(430,()=>{if(G.phase!=='move')return;let m=G.plan.shift();const ok=m&&G.legal.find(x=>x.from===m.from&&x.to===m.to&&x.die===m.die);playMove(ok||G.legal[0]);});}}
function distinct(L){const seen=new Set(),r=[];for(const m of L){const k=m.from+'>'+m.to;if(!seen.has(k)){seen.add(k);r.push(m);}}return r;}
function playMove(m){const p=G.turn;G.undo.push({s:E.clone(G.s),dl:G.dl.slice(),played:G.played.slice()});
 const fromXY=topXY(p,m.from,0);const oppIdx=m.to>0?25-m.to:-1;const wasBlot=oppIdx>0&&G.s.c[1-p][oppIdx]===1;const hitFrom=wasBlot?topXY(1-p,oppIdx,0):null;
 const hit=E.applyIn(G.s,p,m);G.dl=E.rem(G.dl,m.die);G.played.push(m);G.noAuto=false;G.sel=null;G.drag=null;
 const toXY=topXY(p,m.to,0);addAnim(p,m.to,G.drag0||fromXY,toXY);G.drag0=null;
 if(hit){addAnim(1-p,25,hitFrom,topXY(1-p,25,0),0.12);SFX.hit();}else if(m.to===0)SFX.off();else SFX.move();
 if(G.s.c[p][0]===15){G.phase='over';clearTimers();wait(700,()=>gameOver(p,E.result(G.s,p)*G.cube,E.result(G.s,p)));return;}
 enterMove();}
function addAnim(p,idx,f,t,delay){G.anims.push({p,idx,fx:f.x,fy:f.y,tx:t.x,ty:t.y,t:-(delay||0),dur:0.26});}
function undo(){if(G.phase!=='move'||!isHuman(G.turn)||!G.undo.length)return;clearTimers();const u=G.undo.pop();G.s=u.s;G.dl=u.dl;G.played=u.played;G.anims=[];G.noAuto=true;G.ending=false;SFX.sel();enterMove();}
function offerDouble(p){G.phase='double';G.offer=p;const r=1-p;SFX.cube();
 if(isHuman(r)){G.msg=NAME(p)+' double'+(p===0&&ST.mode!=='2p'?'':'s')+' to '+G.cube*2+'. Take or drop?';}
 else{G.msg='You double to '+G.cube*2+'…';wait(900,()=>{const pr=E.winProb(G.s,r);if(pr>0.26)takeDouble();else dropDouble();});}}
function takeDouble(){const p=G.offer;G.cube*=2;G.owner=1-p;G.msg=NAME(1-p)+(1-p===0&&ST.mode!=='2p'?' take':' takes')+'. Cube at '+G.cube;G.phase='roll';SFX.cube();
 if(isHuman(p)){} else wait(600,doRoll);}
function dropDouble(){const p=G.offer;G.phase='over';gameOver(p,G.cube,0);}
function gameOver(w,pts,kind){clearTimers();G.phase='gameover';G.scores[w]+=pts;const st=SAVE.stats;st.games++;
 const vsCpu=ST.mode!=='2p';if(vsCpu&&w===0){st.wins++;if(kind===2)st.gammons++;if(kind===3)st.backgammons++;}if(!vsCpu)st.pvp++;
 const kn=kind===0?'(double dropped)':kind===3?'BACKGAMMON!':kind===2?'Gammon!':'';
 G.result={w,pts,kn,matchOver:G.scores[w]>=ST.match};
 if(G.result.matchOver){st.matches++;if(vsCpu){st.lv[ST.mode][0]++;if(w===0){st.matchWins++;st.lv[ST.mode][1]++;}}}
 persist();(vsCpu&&w===1)?SFX.lose():SFX.win();}
function afterGameOver(){if(!G.result)return;if(G.result.matchOver){G.inGame=false;G.phase='menu';}else startGame();}

// ================= GEOMETRY =================
function pointX(P){if(P<=6)return R0-(P-0.5)*PW;if(P<=12)return BX0-(P-6.5)*PW;if(P<=18)return L0+(P-12.5)*PW;return BX1+(P-18.5)*PW;}
function screenP(p,i){return p===0?i:25-i;}
function countAt(p,i){return G.s.c[p][i];}
function checkerXY(p,i,k,n){if(i===25){const st=Math.min(2*RR,(110-2*RR)/Math.max(1,n-1));return{x:390,y:p===0?150-RR-k*st+RR:240+k*st};}
 if(i===0){return{x:793,y:p===0?BOT-6-k*9:TOP+6+k*9,off:true};}
 const P=screenP(p,i),top=P>=13,st=n>5?(PH-2*RR)/(n-1):2*RR;return{x:pointX(P),y:top?TOP+RR+k*st:BOT-RR-k*st};}
function topXY(p,i,adj){const n=Math.max(1,countAt(p,i)+(adj||0));return checkerXY(p,i,n-1,n);}
function pick(x,y){if(x>=BX0&&x<=BX1&&y>=TOP&&y<=BOT)return{t:'bar'};if(x>=TRAY&&x<=836)return{t:'off'};
 if(x>=520&&x<=660&&y>=168&&y<=222)return{t:'dice'};
 if(y<TOP-12||y>BOT+12)return null;const top=y<195;
 if(x>=L0&&x<BX0){const c=Math.min(5,Math.floor((x-L0)/PW));return{t:'pt',P:top?13+c:12-c};}
 if(x>=BX1&&x<=R0){const c=Math.min(5,Math.floor((x-BX1)/PW));return{t:'pt',P:top?19+c:6-c};}return null;}
function pickToIdx(pk,p){if(!pk)return null;if(pk.t==='bar')return 25;if(pk.t==='off')return 0;if(pk.t==='pt')return p===0?pk.P:25-pk.P;return null;}
function srcList(){return[...new Set(G.legal.map(m=>m.from))].sort((a,b)=>b-a);}
function dstList(f){const r=[];for(const m of G.legal)if(m.from===f&&!r.some(x=>x.to===m.to))r.push(m);return r.sort((a,b)=>b.to-a.to);}
function bestMove(f,t){const c=G.legal.filter(m=>m.from===f&&m.to===t);c.sort((a,b)=>a.die-b.die);return c[0];}
function humanMoving(){return G.phase==='move'&&isHuman(G.turn)&&!G.paused&&!G.ending;}

// ================= INPUT =================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let DPR=1,SC=1,OX=0,OY=0;
function resize(){DPR=Math.min(window.devicePixelRatio||1,3);cv.width=innerWidth*DPR|0;cv.height=innerHeight*DPR|0;SC=Math.min(innerWidth/W,innerHeight/H);OX=(innerWidth-W*SC)/2;OY=(innerHeight-H*SC)/2;}
addEventListener('resize',resize);resize();
function toLogical(e){return{x:(e.clientX-OX)/SC,y:(e.clientY-OY)/SC};}
function hitAt(cx,cy){for(let i=G.buttons.length-1;i>=0;i--){const b=G.buttons[i];if(cx>=b.sx&&cx<=b.sx+b.sw&&cy>=b.sy&&cy<=b.sy+b.sh)return b;}return null;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();
 const b=hitAt(e.clientX,e.clientY);if(b){SFX.sel();b.act();return;}
 const{x,y}=toLogical(e);
 if(G.paused){G.paused=false;return;}
 if(G.phase==='gameover'){afterGameOver();return;}
 const pk=pick(x,y);
 if(pk&&pk.t==='dice'&&G.phase==='roll'&&isHuman(G.turn)){doRoll();return;}
 if(!humanMoving())return;const idx=pickToIdx(pk,G.turn);
