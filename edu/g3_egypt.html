<script>

GL.owl=P(()=>{E(46,58,22,22);E(46,28,16,14);E(40,26,4,4,1);E(52,26,4,4,1);L(40,80,36,92);L(52,80,56,92)});

GL.cobra=P(()=>{cx.beginPath();cx.moveTo(10,80);cx.lineTo(60,80);cx.quadraticCurveTo(80,80,74,60);cx.quadraticCurveTo(66,40,76,24);cx.stroke();E(80,22,8,6)});
GL.lion=P(()=>{L(16,70,80,70);cx.beginPath();cx.moveTo(20,70);cx.quadraticCurveTo(22,46,50,48);cx.lineTo(74,48);cx.stroke();E(80,44,10,10);L(16,70,8,52)});

const ALPHA=[['A','vulture'],['B','foot'],['C','basket'],['D','hand'],['E','reed'],['F','viper'],['G','jarstand'],['H','flax'],['I','reed'],['J','cobra'],['K','basket'],['L','lion'],['M','owl'],['N','water'],['O','lasso'],['P','stool'],['Q','hill'],['R','mouth'],['S','cloth'],['T','bread'],['U','chick'],['V','viper'],['W','chick'],['X','basket+cloth'],['Y','reeds'],['Z','bolt']];

const NAMES=['RA','NILE','TUT','ISIS','HORUS','KHUFU','AMUN','SPHINX','PHARAOH','MUMMY','PAPYRUS','OSIRIS','ANUBIS','CAIRO','LUXOR','GIZA','RAMSES','DJOSER'];
const Q_NILE=[['Which way does the Nile flow?','North, into the Mediterranean Sea',['South, into the desert','East, to India','It does not move'],'The Nile flows north, so "Upper Egypt" is actually in the south!'],['Egyptians called their land Kemet, meaning…','The Black Land',['The Red Sea','Land of Sand','The Big River'],'Kemet meant the black land — the rich dark soil left by the flood.'],['Why was the yearly Nile flood so important?','It left rich black silt for growing crops',['It washed away the pyramids','It brought fish only','It made the desert bigger'],'Without the flood, Egypt would have been almost all desert.'],['Akhet was the season of…','The flood (inundation)',['Harvest','Snow','Sowing seeds'],'Akhet ran roughly from June to September.'],['Peret was the season of…','Ploughing, sowing and growing',['Flooding','Harvest','Sleeping'],'When the water went down, farmers ploughed the silt and sowed seeds.'],['Shemu was the season of…','Harvest',['Flooding','Sowing','Building boats'],'In Shemu (about March–May) crops were cut and stored.'],['A shaduf is…','A bucket on a pole for lifting water',['A type of boat','A pharaoh\'s crown','A pyramid stone'],'Farmers used shadufs to lift river water into canals.'],['The main crops were…','Wheat, barley and flax',['Potatoes and corn','Rice and tea','Bananas'],'Wheat and barley made bread and beer; flax made linen cloth.'],['Egyptian paper was made from…','Papyrus reeds',['Tree bark','Plastic','Stone'],'Papyrus grew along the Nile and was pressed into sheets.']];

const Q_DISC=[['The Rosetta Stone helped experts to…','Read hieroglyphs again',['Build pyramids','Find gold','Make mummies'],'It has the same text in hieroglyphs, Demotic and ancient Greek.'],['Who first deciphered hieroglyphs, in 1822?','Jean-François Champollion',['Howard Carter','Cleopatra','Napoleon'],'He compared the Greek text with the hieroglyphs on the Rosetta Stone.'],['Who found Tutankhamun\'s tomb in 1922?','Howard Carter',['Champollion','Julius Caesar','Indiana Jones'],'It was in the Valley of the Kings, still full of treasure.'],['The Great Pyramid was built for the pharaoh…','Khufu',['Tutankhamun','Cleopatra','Ramesses II'],'Built around 2560 BC at Giza.'],['Who built the pyramids?','Paid workers and skilled craftsmen',['Aliens','Slaves only','Romans'],'Archaeologists found the workers\' village and tombs nearby.'],['The Great Sphinx has…','A lion\'s body and a human head',['A cat\'s head and fish tail','Wings','Four heads'],'It sits beside the Giza pyramids.'],['The first pyramid, the Step Pyramid, was designed by…','Imhotep',['Khufu','Ra','Carter'],'Imhotep designed it for King Djoser around 2650 BC.'],['The Great Pyramid was first covered in…','Smooth white limestone',['Gold paint','Grass','Glass'],'Most casing stones were later taken for other buildings.']];

{name:'Build a pyramid',m:'pyr',rows:[4,5]},

{name:'The farming year',m:'order',list:FARM},

function mo(ans,pool){return shuffle([ans,...shuffle([...new Set(pool)].filter(x=>x!==ans)).slice(0,3)])}

function makeQ(){const Lv=LV[cur];let m=Lv.m;if(m==='mix')m=pick(['quiz','learn','decode','write','tl']);const q={m,used:(Q&&Q.used)||[]};
 if(m==='quiz'){const f=fromList(Lv.k||pick([Q_NILE,Q_GODS,Q_DISC]),q);q.text=f[0];q.opts=shuffle([f[1],...f[2]]);q.ans=f[1];q.why=f[3]}
 else if(m==='learn'){const g=pick(PAL);q.glyph=[g];if(Math.random()<.5){q.text='Which sound does this sign stand for? (the '+GNAME[g]+')';const s=sounds(g);q.opts=mo(s,PAL.map(sounds));q.ans=s}else{const a=pick(ALPHA.filter(x=>x[1]===g));q.glyph=null;q.text='Which sign spells the sound "'+a[0]+'"?';q.gopts=mo(g,PAL);q.ans=g}q.why='The '+GNAME[g]+' = '+sounds(g)+'.'}
 else if(m==='decode'){const w=pick(NAMES);q.glyph=enc(w);q.cart=1;q.text='Which name is written in this cartouche?';q.opts=mo(w,NAMES);q.ans=w;q.why=w+' = '+enc(w).map(g=>GNAME[g]).join(', ')+'.'}
 else if(m==='write'){q.w=Lv.own?(myName||'TUT'):pick(NAMES.filter(n=>n.length<=7));q.seq=enc(q.w);q.i=0;q.text='Write "'+q.w+'" in hieroglyphs — tap the signs in order.';q.err=0}
 else if(m==='order'){q.stages=shuffle(Lv.list.map((s,i)=>({s,i})));q.next=0;q.list=Lv.list;q.text='Tap the steps IN ORDER, from first to last.'}

 else{const rows=Lv.rows[qi]||6;q.rows=rows;q.b=[];for(let r=0;r<rows;r++)q.b.push(Array(rows-r).fill(0));q.placed=0;q.total=rows*(rows+1)/2;q.text='Build a '+rows+'-layer pyramid. Tap where each block goes.'}
 return q}
function askName(){ov('<h2>✍️ Your name</h2><p>Type your name (letters only) to write it in hieroglyphs:</p><input id="nm" maxlength="10" style="font-size:20px;padding:6px;border-radius:8px;text-transform:uppercase;width:200px" value="'+(save.name||'')+'"><br><button class="btn" id="nmGo">Write it ▶</button>');const go=()=>{const v=($('nm').value||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,10);myName=v||'TUT';save.name=myName;persist();ov('');Q=makeQ();draw()};$('nmGo').onclick=go;$('nm').onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')go()}}
function startLevel(i){ov('');paused=false;cur=i;qi=0;miss=0;msg='';lock=false;Q=null;Q=makeQ();draw();if(LV[i].own){askName();return}if(TIPS[i]&&!save['tip'+i]){save['tip'+i]=1;persist();ov('<h2>🏺 '+LV[i].name+'</h2><p>'+TIPS[i]+'</p><button class="btn" onclick="ov(\'\')">Let\'s go ▶</button>')}}
function keyTyping(){return Q&&Q.m==='write'}
function card(x,y,w,h,col,stroke){cx.fillStyle=col;rr(x,y,w,h,12);cx.fill();if(stroke){cx.strokeStyle=stroke;cx.lineWidth=3;cx.stroke()}}
function wrapC(s,x,y,w,sz,col){cx.font='700 '+sz+'px system-ui';const ws=s.split(' ');let lines=[],l='';for(const wd of ws){const t=l?l+' '+wd:wd;if(cx.measureText(t).width>w&&l){lines.push(l);l=wd}else l=t}lines.push(l);if(lines.length>3&&sz>10)return wrapC(s,x,y,w,sz-1,col);lines.forEach((ln,i)=>txt(ln,x,y+(i-(lines.length-1)/2)*(sz+3),sz,col))}
function glyphRow(gs,x,y,s,cart){const w=gs.length*s;if(cart){cx.strokeStyle='#8a5a2a';cx.lineWidth=4;cx.fillStyle='#f3e2b5';rr(x-w/2-14,y-6,w+28,s+12,(s+12)/2);cx.fill();cx.stroke();cx.fillStyle='#8a5a2a';cx.fillRect(x+w/2+14,y-6,5,s+12)}gs.forEach((g,i)=>GL[g](x-w/2+i*s,y,s))}
function palette(){const n=PAL.length,cols=Math.ceil(n/2),bw=Math.min(62,(W-20)/cols),bh=54,x0=(W-cols*bw)/2,y0=H-2*bh-6;PAL.forEach((g,i)=>{const x=x0+(i%cols)*bw,y=y0+Math.floor(i/cols)*bh;card(x+2,y+2,bw-4,bh-4,'#f3e2b5');GL[g](x+bw/2-17,y+4,34);txt(sounds(g),x+bw/2,y+bh-10,10,'#5a3a10');btns.push({x,y,w:bw,h:bh,f:()=>tapGlyph(g)})});return y0}
function draw(){btns=[];cx.clearRect(0,0,W,H);const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3b2a5a');g.addColorStop(.6,'#c98b4a');g.addColorStop(1,'#e8c27a');cx.fillStyle=g;cx.fillRect(0,0,W,H);if(!Q)return;const q=Q;
 $('st').textContent='Lv '+(cur+1)+' · '+Math.min(qi+1,NQ())+'/'+NQ()+' · ✗'+miss;txt(LV[cur].name,W/2,14,13,'#ffcf5a');
 if(q.m==='pyr'){wrapC(q.text,W/2,36,W-40,16,'#fff');const bs=Math.min(48,(H-90)/q.rows,(W-60)/q.rows),bx0=W/2-q.rows*bs/2,gy=H-28;cx.fillStyle='#d8b26a';cx.fillRect(0,gy,W,H-gy);
  for(let r=0;r<q.rows;r++)for(let i=0;i<q.rows-r;i++){const x=bx0+r*bs/2+i*bs,y=gy-(r+1)*bs,on=q.b[r][i];if(on){cx.fillStyle=r===q.rows-1?'#f5c542':'#e9d3a1';cx.fillRect(x+1,y+1,bs-2,bs-2);cx.strokeStyle='#9a7a40';cx.lineWidth=1.5;cx.strokeRect(x+1,y+1,bs-2,bs-2)}else{cx.strokeStyle='#fff6';cx.setLineDash([4,4]);cx.strokeRect(x+3,y+3,bs-6,bs-6);cx.setLineDash([])}btns.push({x,y,w:bs,h:bs,f:()=>place(r,i)})}
  txt('Blocks '+q.placed+'/'+q.total,W-70,40,14,'#fff');if(msg)wrapC(msg,W/2,60,W-60,13,msgCol);return}
 if(q.stages){wrapC(q.text,W/2,36,W-40,16,'#fff');const n=q.stages.length,gap=8,bw=Math.min(180,(W-20-gap*(n-1))/n),x0=(W-(n*bw+gap*(n-1)))/2;
  for(let i=0;i<n;i++){const x=x0+i*(bw+gap);card(x,56,bw,40,'#0005');wrapC(i<q.next?q.list[i]:(i+1)+'. ?',x+bw/2,76,bw-8,11,i<q.next?'#7f7':'#ccd')}
  q.stages.forEach((st,i)=>{const x=x0+i*(bw+gap),y=110,done=st.i<q.next;card(x,y,bw,120,done?'#2a5a3a':'#fdf6e3',st.bad?'#e74c3c':null);const [em,...rest]=st.s.split(' ');txt(em,x+bw/2,y+30,28);wrapC(rest.join(' '),x+bw/2,y+80,bw-10,12,done?'#cfc':'#2b1d0e');if(!done)btns.push({x,y,w:bw,h:120,f:()=>pickStage(st)})});
  if(msg)wrapC(msg,W/2,H-36,W-40,14,msgCol);return}
 if(q.m==='write'){wrapC(q.text,W/2,34,W-40,15,'#fff');const s=Math.min(44,(W-80)/Math.max(3,q.seq.length));cx.fillStyle='#f3e2b5';const w=q.seq.length*s;glyphRow(q.seq.slice(0,q.i),W/2-w/2+q.i*s/2,58,s,false);cx.strokeStyle='#8a5a2a';cx.lineWidth=4;rr(W/2-w/2-14,52,w+28,s+12,(s+12)/2);cx.stroke();
  for(let i=q.i;i<q.seq.length;i++){txt('?',W/2-w/2+i*s+s/2,58+s/2,20,'#fff8')}const y0=palette();if(msg)wrapC(msg,W/2,y0-14,W-40,13,msgCol);return}
 if(q.glyph){glyphRow(q.glyph,W*.22,H/2-50,Math.min(q.glyph.length>1?60:110,(W*.4)/q.glyph.length),q.cart)}else if(!q.gopts)txt('🏺',W*.22,H/2,80);
 const px=q.gopts?20:W*.46,pw=W-px-14;wrapC(q.text,px+pw/2,46,pw,16,'#fff');
 if(q.gopts){const bw=Math.min(120,(pw-30)/4);q.gopts.forEach((o,i)=>{const bx=W/2-2*(bw+10)+i*(bw+10)+5,by=90;let col='#f3e2b5';if(q.picked!=null){if(o===q.ans)col='#7bd389';else if(o===q.picked)col='#e88'}card(bx,by,bw,bw,col);GL[o](bx+bw*.15,by+bw*.12,bw*.7);txt(String(i+1),bx+12,by+12,11,'#5a3a10');btns.push({x:bx,y:by,w:bw,h:bw,f:()=>choose(o)})})}
 else{const bw=(pw-10)/2,bh=44;q.opts.forEach((o,i)=>{const bx=px+(i%2)*(bw+10),by=86+Math.floor(i/2)*(bh+10);let col='#283070';if(q.picked!=null){if(o===q.ans)col='#2a8a3a';else if(o===q.picked)col='#a33'}card(bx,by,bw,bh,col);const s=(i+1)+'  '+o;txt(s,bx+bw/2,by+bh/2,fit(s,bw-10,15));btns.push({x:bx,y:by,w:bw,h:bh,f:()=>choose(o)})})}
 if(msg)wrapC(msg,W/2,H-30,W-40,13,msgCol)}
function place(r,i){const q=Q;if(lock||q.b[r][i])return;const ok=r===0||(q.b[r-1][i]&&q.b[r-1][i+1]);if(!ok){sfx.bad();miss++;msg='✘ That block would fall! It needs two blocks underneath.';msgCol='#f99';draw();return}q.b[r][i]=1;q.placed++;sfx.tap();if(q.b[r].every(Boolean)){sfx.ok();msg='✔ Layer '+(r+1)+' done! '+PFACTS[(r+qi*3)%PFACTS.length];msgCol='#7f7'}else msg='';
 if(q.placed===q.total){lock=true;msg='✔ Pyramid complete! '+(q.rows>=7?'Like Khufu\'s, the top was a pointed capstone (pyramidion).':'Pharaohs\' tombs were built like this, block by block.');msgCol='#7f7';draw();setTimeout(next,2200);return}draw()}
function tapGlyph(g){const q=Q;if(lock||q.m!=='write')return;const want=q.seq[q.i];if(g===want){q.i++;sfx.tap();msg='';if(q.i>=q.seq.length){sfx.ok();lock=true;msg='✔ You wrote '+q.w+' in hieroglyphs! (Scribes really left out most vowels.)';msgCol='#7f7';draw();setTimeout(next,2200);return}}else{sfx.bad();if(!q.err)miss++;q.err++;const letter=[...q.w].filter(c=>/[A-Z]/.test(c));msg='✘ Not that one — look for the '+GNAME[want]+' ('+sounds(want)+').';msgCol='#f99'}draw()}
function pickStage(st){if(lock)return;const q=Q;if(st.i===q.next){q.next++;st.bad=0;sfx.ok();if(q.next>=q.stages.length){lock=true;msg='✔ Perfect order!';msgCol='#7f7';draw();setTimeout(next,1800);return}msg='✔ Yes!';msgCol='#7f7'}else{sfx.bad();miss++;st.bad=1;msg='✘ Not yet — what comes next?';msgCol='#f99'}draw()}
function choose(v){if(lock)return;Q.picked=v;lock=true;const ok=v===Q.ans;if(ok)sfx.ok();else{sfx.bad();miss++}msg=(ok?'✔ Correct! ':'✘ ')+(Q.why||'');msgCol=ok?'#7f7':'#f99';draw();setTimeout(next,ok?1500:3000)}
function next(){msg='';lock=false;qi++;if(qi>=NQ()){finishLevel(miss===0?3:miss<=2?2:1);return}Q=makeQ();draw()}
function onTap(x,y){hit(x,y)}
function onKey(e){const k=e.key,q=Q;if(!q||lock)return;const n=+k;if(q.opts&&n>=1&&n<=q.opts.length)return choose(q.opts[n-1]);if(q.gopts&&n>=1&&n<=4)return choose(q.gopts[n-1]);if(q.stages&&n>=1&&n<=q.stages.length&&q.stages[n-1].i>=q.next)return pickStage(q.stages[n-1]);
 if(q.m==='write'&&/^[a-zA-Z]$/.test(k)){const gs=g4(k.toUpperCase());tapGlyph(gs[0]===q.seq[q.i]?gs[0]:gs[gs.length-1]===q.seq[q.i]?gs[gs.length-1]:gs[0])}
 if(q.m==='pyr'&&k==='Enter'){for(let r=0;r<q.rows;r++){const i=q.b[r].findIndex(v=>!v);if(i>=0){place(r,i);return}}}}
window.G={get Q(){return Q},LV,GL,PAL};
resize();cur=0;Q=makeQ();draw();showLevels();
