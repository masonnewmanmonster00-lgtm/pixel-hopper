 if(lvl===2&&state!=='title'){for(let i=0;i<40;i++){const sx=(i*97-c*.05)%W,sy=(i*53)%120;rect((sx+W)%W,sy,1,1,frame%60<30||i%3?'#fff':'#aaf')}}
 else{cx.fillStyle='rgba(255,255,220,.8)';cx.beginPath();cx.arc(400,50,18,0,7);cx.fill()}
 for(const k of clouds)cloud(((k.x-c*.1*k.s)%900+900)%900-60,k.y,k.s);
 hills(c*.2,th.hill1,40,200,60);hills(c*.4+300,th.hill2,30,225,40)}
function tile(t,x,y,px,py,th){
 if(t==='#'){rect(px,py,T,T,th.dirt);const h=(x*7+y*13)%5;rect(px+2+h,py+5,2,2,th.dirt2);rect(px+10-h,py+11,3,2,th.dirt2);rect(px+6,py+8+(h%3),1,1,'#0002');
  if(!solid(x,y-1)){rect(px,py,T,5,th.grass);rect(px,py,T,1,'#ffffff55');for(let i=0;i<T;i+=3)rect(px+i,py+5,2,1+((x+i)%3===0),th.grass)}}
 else if(t==='='){rect(px,py,T,T,'#c8643a');rect(px,py,T,1,'#e88a5a');rect(px,py+7,T,1,'#7a2e1a');rect(px,py+15,T,1,'#7a2e1a');rect(px+7,py,1,7,'#7a2e1a');rect(px+3,py+8,1,7,'#7a2e1a');rect(px+11,py+8,1,7,'#7a2e1a');rect(px+1,py+1,5,1,'#e88a5a55')}
 else if(t==='^'){for(let k=0;k<2;k++){cx.fillStyle='#b8bccc';cx.beginPath();cx.moveTo(px+k*8,py+T);cx.lineTo(px+k*8+4,py+5);cx.lineTo(px+k*8+8,py+T);cx.fill();rect(px+k*8+4,py+7,1,8,'#fff')}}}
function drawPlayer(){const p=pl;if(deathT){/* spin away */}else if(p.inv&&(p.inv>>2)%2)return;
 cx.save();cx.translate(Math.round(p.x+p.w/2),Math.round(p.y+p.h));cx.scale(p.face*p.sx2,p.sy2);if(deathT)cx.rotate((70-deathT)*.3);
 const air=!p.ground,run=p.ground&&Math.abs(p.vx)>.3,leg=Math.sin(p.anim)*(p.sprint?4:3),lean=p.sprint?1:0;
 // legs
 if(air){if(p.vy<0){rect(-5,-4,4,4,'#333');rect(2,-6,4,3,'#333')}else{rect(-5,-3,4,3,'#333');rect(1,-3,4,3,'#333')}}
 else if(run){rect(-4+leg,-3,4,3,'#333');rect(1-leg,-3,4,3,'#333')}else{rect(-5,-3,4,3,'#333');rect(1,-3,4,3,'#333')}
 // body
 rect(-6+lean,-11,12,8,'#2f8cff');rect(-6+lean,-11,12,2,'#5fb0ff');rect(-6+lean,-5,12,1,'#1c5fb5');
 // arms
 const arm=air?(p.vy<0?-4:-1):(run?Math.sin(p.anim)*2:0);rect(-8+lean,-9+(air?arm:0)-(run?arm:0),2,4,'#ffcfa0');rect(6+lean,-9+(air?arm:0)+(run?arm:0),2,4,'#ffcfa0');
 // head
 rect(-5+lean*2,-17,10,7,'#ffcfa0');rect(-6+lean*2,-18,12,3,'#e83a3a');rect(2+lean*2,-17,6,2,'#e83a3a');
 rect(1+lean*2,-14,2,2,'#111');if(deathT){rect(-1,-12,4,1,'#111')}
 cx.restore();
 if(p.sprint&&!deathT){for(let i=0;i<3;i++)rect(p.x+(p.vx>0?-10-i*6:p.w+4+i*6),p.y+3+i*4,5,1,'#ffffff88')}}
function drawEnemy(e){const x=e.x,y=e.y;if(e.dead>0){rect(x,y+8,e.w,4,'#9a5cff');rect(x+3,y+9,2,1,'#000');rect(x+9,y+9,2,1,'#000');return}
 const b=Math.abs(Math.sin(e.ph))*2,f=Math.sin(e.ph)>0;rect(x+1,y+2-b,12,9,'#9a5cff');rect(x,y+4-b,14,6,'#9a5cff');rect(x+2,y+2-b,10,2,'#c39bff');
 rect(x+1,y+10,4,2,f?'#5a2db0':'#4a2090');rect(x+9,y+10,4,2,f?'#4a2090':'#5a2db0');if(f)rect(x+1,y+11,4,1,'#3a1878');else rect(x+9,y+11,4,1,'#3a1878');
 const d=e.vx>0?1:-1;rect(x+3,y+4-b,3,4,'#fff');rect(x+8,y+4-b,3,4,'#fff');rect(x+4+d,y+5-b,1,2,'#000');rect(x+9+d,y+5-b,1,2,'#000');rect(x+3,y+3-b,3,1,'#3a1878');rect(x+8,y+3-b,3,1,'#3a1878')}
function txt(s,x,y,sz,col,al='center'){cx.font='bold '+sz+'px monospace';cx.textAlign=al;cx.fillStyle='#000a';cx.fillText(s,x+1,y+1);cx.fillText(s,x+1,y+2);cx.fillStyle=col;cx.fillText(s,x,y)}
function panel(x,y,w,h){rect(x,y,w,h,'#0b0b24e0');rect(x,y,w,1,'#fff6');rect(x,y+h-1,w,1,'#0008');rect(x,y,1,h,'#fff3');rect(x+w-1,y,1,h,'#0006')}
function coinIcon(x,y,t){const w=Math.abs(Math.cos(t))*5+1;cx.fillStyle='#ffd23f';cx.beginPath();cx.ellipse(x,y,w,6,0,0,7);cx.fill();cx.fillStyle='#b8860b';cx.fillRect(x-.5,y-3,1,6);cx.fillStyle='#fff9';cx.fillRect(x-w*.6,y-3,1,2)}
function heart(x,y,c){rect(x+1,y,2,1,c);rect(x+4,y,2,1,c);rect(x,y+1,7,2,c);rect(x+1,y+3,5,1,c);rect(x+2,y+4,3,1,c);rect(x+3,y+5,1,1,c);rect(x+1,y+1,1,1,'#fff8')}
function hud(){panel(4,4,W-8,18);coinIcon(16,13,frame*.05);txt(String(score).padStart(6,'0'),26,17,10,'#fff','left');txt('BEST '+best,110,17,8,'#9fd3ff','left');
 txt('WORLD '+(lvl+1)+'/'+LV.length,W/2,17,10,'#fff');for(let i=0;i<3;i++)heart(W-60+i*12,9,i<lives?'#ff4d6d':'#444a');txt(muted?'♪x':'♪',W-12,17,9,muted?'#888':'#fff')}
function draw(){const th=THEMES[lvl%3];cx.save();
 if(shake)cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 if(state==='title'){background(THEMES[(frame/400|0)%3],frame*.8);drawTitle();cx.restore();overlay();return}
 const c=Math.round(cam);background(th,c);cx.save();cx.translate(-c,0);
 const s=Math.floor(c/T)-1,e2=s+W/T+3;for(let y=0;y<map.length;y++)for(let x=Math.max(0,s);x<e2;x++){const t=map[y][x];if(t&&t!==' ')tile(t,x,y,x*T,y*T,th)}
 // flag
 rect(flag.x+7,flag.y-48,2,64,'#ddd');rect(flag.x+7,flag.y-48,1,64,'#fff');cx.fillStyle='#ffd23f';cx.beginPath();cx.arc(flag.x+8,flag.y-50,3,0,7);cx.fill();
 const wv=Math.sin(frame*.15)*2;cx.fillStyle='#ff4d4d';cx.beginPath();cx.moveTo(flag.x+9,flag.y-46);cx.quadraticCurveTo(flag.x+17,flag.y-44+wv,flag.x+25,flag.y-40+wv);cx.lineTo(flag.x+9,flag.y-34);cx.fill();rect(flag.x+4,flag.y+12,8,4,'#666');
 coins.forEach(k=>{const yy=k.y+Math.sin(k.t)*1.5;coinIcon(k.x,yy,k.t);if((frame+k.x)%90<6)rect(k.x+3,yy-6,1,3,'#fff')});
 enemies.forEach(drawEnemy);drawPlayer();
 parts.forEach(p=>rect(p.x,p.y,2,2,p.col));pops.forEach(p=>{cx.globalAlpha=Math.min(1,p.l/20);txt(p.t,p.x,p.y,8,p.col);cx.globalAlpha=1});
 cx.restore();cx.restore();hud();
 if(msgT>0&&state==='play'){cx.globalAlpha=Math.min(1,msgT/30);txt('WORLD '+(lvl+1),W/2,100,24,'#fff');txt(['Grassy Meadows','Sunset Canyon','Starlight Ridge'][lvl],W/2,118,10,'#ffe14d');cx.globalAlpha=1}
 if(state==='pause'){rect(0,0,W,H,'#0008');panel(W/2-90,80,180,110);txt('PAUSED',W/2,110,20,'#fff');txt('P / Esc  resume',W/2,135,9,'#ccc');txt('R  restart    M  mute',W/2,150,9,'#ccc');txt(touchMode?'Tap to resume':'Click to resume',W/2,172,9,'#ffe14d')}
 if((state==='tally'||state==='next')&&tally){rect(0,0,W,H,'#0007');panel(W/2-110,60,220,150);txt('WORLD '+(lvl+1)+' CLEAR!',W/2,88,16,'#5f5');
  const r=(l,v,y,d)=>{if(tally.t>d){txt(l,W/2-90,y,10,'#ddd','left');txt(v,W/2+90,y,10,'#fff','right')}};
  r('Coins',tally.coins+' / '+tally.tot,115,10);r('Stomps',''+tally.stomps,132,20);r('Time',(tally.time/60).toFixed(1)+'s',149,30);r('Bonus','+'+tally.shown,166,40);
  if(tally.t>60&&frame%40<28)txt((touchMode?'Tap to continue':'Press ENTER / click'),W/2,196,9,'#ffe14d')}
 if(state==='over'||state==='win'){rect(0,0,W,H,'#000a');panel(W/2-120,70,240,135);
  txt(state==='win'?'YOU WIN!':'GAME OVER',W/2,105,26,state==='win'?'#5f5':'#ff4d6d');txt('Score '+score,W/2,132,12,'#fff');txt(newBest?'NEW BEST!':'Best '+best,W/2,150,10,newBest?'#ffe14d':'#9fd3ff');
  if(frame%40<28)txt((touchMode?'Tap to play again':'Click, R or ENTER to play again'),W/2,185,9,'#ffe14d')}
 overlay()}
function drawTitle(){const bob=Math.sin(frame*.05)*3;
 rect(0,H-40,W,40,'#46c84a');rect(0,H-40,W,3,'#7fe07f');rect(0,H-34,W,34,'#8a5a33');
 panel(W/2-150,40+bob,300,62);txt('PIXEL',W/2,72+bob,26,'#ffe14d');txt('HOPPER',W/2,96+bob,26,'#ff6b6b');
 // mascot running
 const sv=pl;pl={x:W/2-6+Math.sin(frame*.02)*120,y:H-54,w:12,h:14,vx:Math.cos(frame*.02)>0?3:-3,face:Math.cos(frame*.02)>0?1:-1,ground:true,anim:frame*.4,sx2:1,sy2:1,inv:0,sprint:true,vy:0};drawPlayer();pl=sv;
 drawEnemy({x:W/2+80+Math.sin(frame*.01)*30,y:H-52,w:14,h:12,vx:1,dead:0,ph:frame*.2});
 txt('Arrows/WASD move   Space/Up jump   Shift sprint',W/2,135,9,'#fff');txt('P/Esc pause   M mute   R restart',W/2,150,9,'#fff');
 txt('BEST '+best,W/2,172,10,'#9fd3ff');if(frame%50<34)txt((touchMode?'Tap to start':'Click or press ENTER / SPACE to start'),W/2,200,11,'#ffe14d')}
function overlay(){touchUI();if(fade>0){rect(0,0,W,H,'rgba(0,0,0,'+fade.toFixed(2)+')')}}
let last=performance.now(),accum=0;let errShown=false;function loop(t){requestAnimationFrame(loop);try{accum+=Math.min(100,t-last);last=t;while(accum>=1000/60){update();accum-=1000/60}if(!fadeDir&&fade>0)fade=0;draw()}catch(e){if(!errShown){errShown=true;showErr(e.message||e);console.error(e)}}}
function fit(){const w=window.innerWidth||960,h=window.innerHeight||540,sc=Math.min(w/W,h/H)||1;cv.style.width=Math.floor(W*sc)+'px';cv.style.height=Math.floor(H*sc)+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();
requestAnimationFrame(loop);
</script></body></html>
