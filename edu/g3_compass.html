<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Compass Quest</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#1d1630;color:#eef;font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;user-select:none}

<div id="top"><a id="lz" href="./index.html">◀ Learning Lab</a><a id="menu" href="../index.html">🏠</a><div id="title">🧭 Compass <b>Quest</b></div><span id="st"></span><button id="lvB">Levels</button><button id="pB">⏸</button><button id="mu">🔊</button></div>
<canvas id="c"></canvas><div id="ov"><div id="ovc"></div></div>
<script>
const SAVEKEY='g3CompassSave',TITLE='🧭 Compass Quest',INTRO='Find your way! Learn the compass points, follow directions across a treasure map, use map scales and legends, and try real bearings in degrees.';
// shared skeleton injected into both games
const $=id=>document.getElementById(id);
const cv=$('c'),cx=cv.getContext('2d');let W=0,H=0,DPR=1;
let save={mute:false,stars:{},unlocked:1};
try{const s=JSON.parse(localStorage.getItem(SAVEKEY)||'null');if(s)save=Object.assign(save,s)}catch(e){}
function persist(){try{localStorage.setItem(SAVEKEY,JSON.stringify(save))}catch(e){}}
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=0.12,t='sine',v=0.15,dl=0){if(save.mute)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;const s=a.currentTime+dl;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(0.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+0.02)}
const sfx={ok(){tone(660,.1,'triangle');tone(990,.15,'triangle',.15,.08)},bad(){tone(200,.25,'sawtooth',.08)},tap(){tone(500,.05,'square',.05)},win(){[523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.15,i*.12))}};
function resize(){DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight-40;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';cx.setTransform(DPR,0,0,DPR,0,0)}
function rr(x,y,w,h,r){cx.beginPath();cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h)}
function txt(s,x,y,sz,col='#fff',al='center',wt='700'){cx.font=wt+' '+sz+'px system-ui,Segoe UI,Roboto,sans-serif';cx.fillStyle=col;cx.textAlign=al;cx.textBaseline='middle';cx.fillText(s,x,y)}
function fit(s,maxw,sz){cx.font='700 '+sz+'px system-ui';while(sz>9&&cx.measureText(s).width>maxw){sz--;cx.font='700 '+sz+'px system-ui'}return sz}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(a){return a[Math.random()*a.length|0]}
let paused=false,btns=[];
function hit(x,y){for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.f();return true}}return false}
function ptr(e){ac();if(paused||$('ov').style.display==='flex')return;const r=cv.getBoundingClientRect();const p=e.changedTouches?e.changedTouches[0]:e;onTap(p.clientX-r.left,p.clientY-r.top)}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ptr(e)});
function ov(html){$('ovc').innerHTML=html;$('ov').style.display=html?'flex':'none'}
function setPause(p){if($('ov').style.display==='flex'&&!paused)return;paused=p;$('pB').textContent=p?'▶':'⏸';ov(p?'<h2>⏸ Paused</h2><p>Press P or tap to resume. R restarts the level.</p><button class="btn" onclick="setPause(false)">▶ Resume</button> <button class="btn" onclick="setPause(false);restart()">↻ Restart</button>':'')}
$('pB').onclick=()=>setPause(!paused);
$('mu').textContent=save.mute?'🔇':'🔊';$('mu').onclick=()=>{save.mute=!save.mute;$('mu').textContent=save.mute?'🔇':'🔊';persist()};
$('lvB').onclick=()=>{paused=false;showLevels()};
function starStr(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function showLevels(){let h='<h2>'+TITLE+'</h2><p>'+INTRO+'</p>';LV.forEach((L,i)=>{const ok=i<save.unlocked;h+='<span class="lv'+(ok?'':' lock')+'" data-lv="'+i+'" '+(ok?'onclick="startLevel('+i+')"':'')+'>'+(ok?'':'🔒 ')+(i+1)+'. '+L.name+'<br><small>'+starStr(save.stars[i]||0)+'</small></span>'});h+='<p><small>Keys: 1-4 choose · arrows / WASD move · Enter check · P pause · R restart · M mute</small></p>';ov(h)}
function finishLevel(stars){sfx.win();const i=cur;save.stars[i]=Math.max(save.stars[i]||0,stars);save.unlocked=Math.max(save.unlocked,Math.min(LV.length,i+2));persist();
 ov('<h2>Level complete!</h2><div class="stars">'+starStr(stars)+'</div><p>'+LV[i].name+'</p>'+(i+1<LV.length?'<button class="btn" id="nextB" onclick="startLevel('+(i+1)+')">Next level ▶</button> ':'')+'<button class="btn" onclick="restart()">↻ Replay</button> <button class="btn" onclick="showLevels()">Levels</button>')}
function restart(){ov('');startLevel(cur)}
addEventListener('keydown',e=>{const k=e.key;if(k==='p'||k==='P'){setPause(!paused);return}if(paused)return;if($('ov').style.display==='flex'){if(k==='Enter'&&$('nextB'))$('nextB').click();return}
 if(keyTyping()&&k.length===1&&k!=='p'&&k!=='P'){onKey(e);return}
 if(k==='r'||k==='R'){restart();return}if(k==='m'||k==='M'){$('mu').click();return}onKey(e)});
addEventListener('resize',()=>{resize();draw()});
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
const GC=12,GR=7;
const D8=[['N',0,-1,0,'North'],['NE',1,-1,45,'North-East'],['E',1,0,90,'East'],['SE',1,1,135,'South-East'],['S',0,1,180,'South'],['SW',-1,1,225,'South-West'],['W',-1,0,270,'West'],['NW',-1,-1,315,'North-West']];
const D4=D8.filter((d,i)=>i%2===0);
const LMK=[['🏰','Castle'],['🌲','Forest'],['⛰️','Mountain'],['🏠','Village'],['🌉','Bridge'],['🏝️','Island'],['⛪','Church'],['🌋','Volcano'],['🏕️','Camp'],['🗼','Lighthouse'],['🌾','Farm'],['💰','Treasure']];
const LEG=[['🌲','Forest'],['⛰️','Mountain'],['🌊','Lake'],['🏠','Village'],['⛪','Church'],['🌉','Bridge'],['🏕️','Campsite'],['🗼','Lighthouse'],['🌾','Farm'],['🏰','Castle'],['〰️','River'],['🚂','Railway station']];
const LV=[
{name:'The four compass points',m:'point',d:4},
{name:'Never Eat Soggy Waffles',m:'dir',d:4},
{name:'Follow the directions',m:'move',d:4,steps:2},
{name:'In-between points: NE, SE, SW, NW',m:'point',d:8},
{name:'Which way to the castle?',m:'dir',d:8},
{name:'Map legends',m:'legend'},
{name:'Longer journeys',m:'move',d:4,steps:3},
{name:'Where do you end up?',m:'where'},
{name:'Map scale: how far?',m:'scale'},
{name:'Turning: clockwise & back',m:'turn'},
{name:'Diagonal journeys',m:'move',d:8,steps:3},
{name:'Bearings in degrees',m:'bear'},
{name:'Scale + directions',m:'scalemove'},
{name:'Compass Quest master',m:'mix'}];
const TIPS={0:'North is UP on most maps. Clockwise from North: North, East, South, West.',1:'Remember: Never Eat Soggy Waffles (N, E, S, W) going clockwise.',2:'Use the arrow buttons (or keys) to move the explorer one square at a time, then press Check.',3:'Halfway between North and East is North-East (NE). The same works for SE, SW and NW.',5:'A LEGEND (or key) explains what each symbol on a map means.',8:'The SCALE tells you how far one square on the map is in real life.',11:'A BEARING is an angle measured clockwise from North: N = 0°, E = 90°, S = 180°, W = 270°.'};
let cur=0,qi=0,miss=0,Q=null,msg='',msgCol='#fff',lock=false;
const NQ=()=>LV[cur].m==='move'||LV[cur].m==='scalemove'?4:LV[cur].m==='mix'?8:6;
function mo(ans,pool){return shuffle([ans,...shuffle([...new Set(pool)].filter(x=>x!==ans)).slice(0,3)])}
function placeMap(n){const used=new Set(),L=[];const ls=shuffle(LMK).slice(0,n);for(const l of ls){let c,r;do{c=ri(0,GC-1);r=ri(0,GR-1)}while(used.has(c+','+r));used.add(c+','+r);L.push({e:l[0],n:l[1],c,r})}return L}
function inb(c,r){return c>=0&&r>=0&&c<GC&&r<GR}
function route(c,r,steps,dirs){for(let t=0;t<200;t++){let x=c,y=r,seq=[],ok=true,last=null;for(let s=0;s<steps;s++){const d=pick(dirs.filter(d=>d!==last));const k=ri(1,4);last=d;const nx=x+d[1]*k,ny=y+d[2]*k;if(!inb(nx,ny)){ok=false;break}x=nx;y=ny;seq.push([d,k])}if(ok&&(x!==c||y!==r))return{seq,x,y}}return null}
function makeQ(){const L=LV[cur];let m=L.m,dset=L.d===8?D8:D4;if(m==='mix'){m=pick(['dir','move','where','scale','bear','legend']);dset=D8}const q={m,map:[]};
 if(m==='point'){const d=pick(dset);q.d=d;q.text='The arrow points…';q.opts=mo(d[4],dset.map(x=>x[4]));q.ans=d[4];q.why=d[4]+' ('+d[0]+') is '+d[3]+'° clockwise from North.'}
 else if(m==='dir'||m==='where'||m==='scale'){q.map=placeMap(m==='where'?7:5);q.me={c:ri(1,GC-2),r:ri(1,GR-2)};
  if(m==='dir'){const d=pick(dset);let t=null;for(let k=1;k<5&&!t;k++){const c=q.me.c+d[1]*k,r=q.me.r+d[2]*k;if(inb(c,r))t={c,r}}if(!t)return makeQ();q.map=q.map.filter(l=>!(l.c===t.c&&l.r===t.r)&&!(l.c===q.me.c&&l.r===q.me.r));q.map.push({e:'🏰',n:'Castle',c:t.c,r:t.r});q.map=q.map.filter((l,i)=>l.n!=='Castle'||i===q.map.length-1);q.text='Which direction is the 🏰 castle from the explorer?';q.opts=mo(d[4],dset.map(x=>x[4]));q.ans=d[4];q.why='The castle is '+d[4]+' of the explorer.'}
  else if(m==='where'){const rt=route(q.me.c,q.me.r,2,D4);if(!rt)return makeQ();q.map=q.map.filter(l=>!(l.c===q.me.c&&l.r===q.me.r)&&!(l.c===rt.x&&l.r===rt.y));const tg={e:'💰',n:'Treasure',c:rt.x,r:rt.y};q.map=q.map.filter(l=>l.n!=='Treasure');q.map.push(tg);q.text='Walk '+rt.seq.map(s=>s[1]+' '+s[0][4]).join(', then ')+'. Where are you?';q.opts=mo('Treasure',q.map.map(l=>l.n));q.ans='Treasure';q.why='You end at the '+tg.e+' treasure.'}
  else{const sc=pick([10,50,100,200,500]);q.sc=sc;const d=pick(D4);const k=ri(2,5);const c=q.me.c+d[1]*k,r=q.me.r+d[2]*k;if(!inb(c,r))return makeQ();q.map=q.map.filter(l=>!(l.c===c&&l.r===r)&&!(l.c===q.me.c&&l.r===q.me.r)&&l.n!=='Lighthouse');q.map.push({e:'🗼',n:'Lighthouse',c,r});const a=k*sc;const u=v=>v>=1000?(v/1000)+' km':v+' m';q.text='Scale: 1 square = '+u(sc)+'. How far is it from the explorer to the 🗼 lighthouse?';q.opts=mo(u(a),[u(a+sc),u(Math.max(sc,a-sc)),u(k),u(a*2),u(a+2*sc)]);q.ans=u(a);q.why=k+' squares × '+u(sc)+' = '+u(a)+'.'}}
 else if(m==='move'||m==='scalemove'){q.map=placeMap(4);q.me={c:ri(0,GC-1),r:ri(0,GR-1)};q.start={...q.me};const rt=route(q.me.c,q.me.r,m==='scalemove'?2:L.steps,L.d===8?D8:D4);if(!rt)return makeQ();q.goal={c:rt.x,r:rt.y};q.map=q.map.filter(l=>!(l.c===q.start.c&&l.r===q.start.r));q.dirs=L.d===8?D8:D4;
  if(m==='scalemove'){q.sc=pick([10,20,50,100]);q.text='1 square = '+q.sc+' m. Walk '+rt.seq.map(s=>s[1]*q.sc+' m '+s[0][4]).join(', then ')+'.'}else q.text='Walk '+rt.seq.map(s=>s[1]+' '+(s[1]>1?'squares':'square')+' '+s[0][4]).join(', then ')+'.';q.trail=[]}
 else if(m==='legend'){const l=pick(LEG);q.big=l[0];q.text='On the map legend, what does '+l[0]+' stand for?';q.opts=mo(l[1],LEG.map(x=>x[1]));q.ans=l[1];q.why=l[0]+' = '+l[1]+'. Always check the legend!'}
 else if(m==='turn'){const a=pick(D8),n=pick([1,2,3,4,6]),cw=Math.random()<.5;const t=D8[(D8.indexOf(a)+(cw?n:-n)+16)%8];q.d=a;q.text='You face '+a[4]+'. Turn '+(n*45)+'° '+(cw?'clockwise':'anticlockwise')+'. Which way do you face now?';q.opts=mo(t[4],D8.map(x=>x[4]));q.ans=t[4];q.why='Each 45° is one step around the 8 points: '+a[0]+' → '+t[0]+'.'}
 else{const d=pick(D8);q.d=d;if(Math.random()<.5){q.text='What bearing is '+d[4]+'?';q.opts=mo(String(d[3]).padStart(3,'0')+'°',D8.map(x=>String(x[3]).padStart(3,'0')+'°'));q.ans=String(d[3]).padStart(3,'0')+'°'}else{q.text='Which direction is a bearing of '+String(d[3]).padStart(3,'0')+'°?';q.opts=mo(d[4],D8.map(x=>x[4]));q.ans=d[4]}q.why=d[4]+' = '+String(d[3]).padStart(3,'0')+'° (measured clockwise from North).'}
 return q}
function startLevel(i){ov('');paused=false;cur=i;qi=0;miss=0;msg='';lock=false;Q=makeQ();draw();if(TIPS[i]&&!save['tip'+i]){save['tip'+i]=1;persist();ov('<h2>🧭 '+LV[i].name+'</h2><p>'+TIPS[i]+'</p><button class="btn" onclick="ov(\'\')">Let\'s go ▶</button>')}}
function keyTyping(){return false}
function card(x,y,w,h,col,stroke){cx.fillStyle=col;rr(x,y,w,h,12);cx.fill();if(stroke){cx.strokeStyle=stroke;cx.lineWidth=3;cx.stroke()}}
function wrapC(s,x,y,w,sz,col){cx.font='700 '+sz+'px system-ui';const ws=s.split(' ');let lines=[],l='';for(const wd of ws){const t=l?l+' '+wd:wd;if(cx.measureText(t).width>w&&l){lines.push(l);l=wd}else l=t}lines.push(l);if(lines.length>4&&sz>10)return wrapC(s,x,y,w,sz-1,col);lines.forEach((ln,i)=>txt(ln,x,y+(i-(lines.length-1)/2)*(sz+3),sz,col))}
function rose(x,y,r,d,showAll){cx.fillStyle='#fdf6e3';cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();cx.strokeStyle='#8a5a2a';cx.lineWidth=3;cx.stroke();
 D8.forEach((p,i)=>{const a=p[3]*Math.PI/180;cx.strokeStyle='#caa';cx.lineWidth=1;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+Math.sin(a)*r*.9,y-Math.cos(a)*r*.9);cx.stroke();if(showAll||p[0]==='N')txt(p[0],x+Math.sin(a)*r*.78,y-Math.cos(a)*r*.78,i%2?r*.12:r*.16,p[0]==='N'?'#c0392b':'#333')});
 if(d){const a=d[3]*Math.PI/180;cx.strokeStyle='#c0392b';cx.lineWidth=6;cx.lineCap='round';cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+Math.sin(a)*r*.6,y-Math.cos(a)*r*.6);cx.stroke();cx.fillStyle='#c0392b';cx.beginPath();cx.arc(x+Math.sin(a)*r*.6,y-Math.cos(a)*r*.6,7,0,7);cx.fill()}cx.fillStyle='#333';cx.beginPath();cx.arc(x,y,5,0,7);cx.fill()}
function grid(){const cs=Math.floor(Math.min((W*.56)/GC,(H-20)/GR));return{cs,x:10,y:Math.round((H-cs*GR)/2)+4}}
function mapDraw(q){const G=grid(),cs=G.cs;cx.fillStyle='#cfe8b0';cx.fillRect(G.x,G.y,cs*GC,cs*GR);cx.strokeStyle='#8aa86a';cx.lineWidth=1;cx.beginPath();for(let c=0;c<=GC;c++){cx.moveTo(G.x+c*cs+.5,G.y);cx.lineTo(G.x+c*cs+.5,G.y+GR*cs)}for(let r=0;r<=GR;r++){cx.moveTo(G.x,G.y+r*cs+.5);cx.lineTo(G.x+GC*cs,G.y+r*cs+.5)}cx.stroke();
 q.map.forEach(l=>txt(l.e,G.x+(l.c+.5)*cs,G.y+(l.r+.5)*cs,cs*.7));
 if(q.trail&&q.trail.length){cx.strokeStyle='#c0392b';cx.lineWidth=3;cx.setLineDash([5,4]);cx.beginPath();cx.moveTo(G.x+(q.start.c+.5)*cs,G.y+(q.start.r+.5)*cs);q.trail.forEach(p=>cx.lineTo(G.x+(p.c+.5)*cs,G.y+(p.r+.5)*cs));cx.stroke();cx.setLineDash([])}
 if(lock&&q.goal){txt('⭐',G.x+(q.goal.c+.5)*cs,G.y+(q.goal.r+.5)*cs,cs*.8)}
 if(q.me){cx.fillStyle='#fff';cx.beginPath();cx.arc(G.x+(q.me.c+.5)*cs,G.y+(q.me.r+.5)*cs,cs*.42,0,7);cx.fill();txt('🧑',G.x+(q.me.c+.5)*cs,G.y+(q.me.r+.5)*cs,cs*.65)}
 rose(G.x+cs*GC-26,G.y+26,22,null,false)}
function draw(){btns=[];cx.clearRect(0,0,W,H);const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1d3a5f');g.addColorStop(1,'#132238');cx.fillStyle=g;cx.fillRect(0,0,W,H);if(!Q)return;const q=Q;
 $('st').textContent='Lv '+(cur+1)+' · '+Math.min(qi+1,NQ())+'/'+NQ()+' · ✗'+miss;
 const G=grid(),px=G.x+G.cs*GC+14,pw=W-px-10;txt(LV[cur].name,px+pw/2,14,13,'#ffcf5a');
 if(q.map.length||q.me)mapDraw(q);else if(q.big){card(G.x,G.y,G.cs*GC,G.cs*GR,'#fdf6e3');txt('MAP LEGEND',G.x+G.cs*GC/2,G.y+20,14,'#8a5a2a');txt(q.big,G.x+G.cs*GC/2,G.y+G.cs*GR/2+10,90)}else rose(G.x+G.cs*GC/2,H/2,Math.min(H/2-14,150),q.d,LV[cur].d!==4||q.m!=='point');
 wrapC(q.text,px+pw/2,52,pw,15,'#fff');
 if(q.dirs){const bs=q.dirs,cxp=px+pw/2,cyp=170,s=42;bs.forEach(d=>{const bx=cxp+d[1]*(s+6)-s/2,by=cyp+d[2]*(s+6)-s/2;card(bx,by,s,s,'#283070');txt(d[0],bx+s/2,by+s/2,15);btns.push({x:bx,y:by,w:s,h:s,f:()=>step(d)})});card(cxp-s/2,cyp-s/2,s,s,'#0004');txt('🧭',cxp,cyp,20);
  if(!lock){const bw=(pw-8)/2;card(px,H-58,bw,40,'#e07a10');txt('✔ Check',px+bw/2,H-38,15);btns.push({x:px,y:H-58,w:bw,h:40,f:checkMove});card(px+bw+8,H-58,bw,40,'#283070');txt('↺ Start over',px+bw*1.5+8,H-38,13);btns.push({x:px+bw+8,y:H-58,w:bw,h:40,f:()=>{Q.me={...Q.start};Q.trail=[];msg='';draw()}})}
  if(msg)wrapC(msg,px+pw/2,104,pw,12,msgCol);return}
 const two=q.opts.length===2,bw=(pw-8)/2,bh=42;q.opts.forEach((o,i)=>{const bx=px+(i%2)*(bw+8),by=100+Math.floor(i/2)*(bh+8);let col='#283070';if(q.picked!=null){if(o===q.ans)col='#2a8a3a';else if(o===q.picked)col='#a33'}card(bx,by,bw,bh,col);const s=(i+1)+'  '+o;txt(s,bx+bw/2,by+bh/2,fit(s,bw-8,15));btns.push({x:bx,y:by,w:bw,h:bh,f:()=>choose(o)})});
 if(msg)wrapC(msg,px+pw/2,H-46,pw,13,msgCol)}
function step(d){if(lock)return;const q=Q,c=q.me.c+d[1],r=q.me.r+d[2];if(!inb(c,r)){sfx.bad();msg='Edge of the map!';msgCol='#fc9';draw();return}q.me={c,r};q.trail.push({c,r});sfx.tap();msg='';draw()}
function checkMove(){if(lock)return;const q=Q;if(q.me.c===q.goal.c&&q.me.r===q.goal.r){sfx.ok();lock=true;msg='✔ You made it! ⭐';msgCol='#7f7';draw();setTimeout(next,1500)}else{sfx.bad();miss++;msg='✘ Not quite — check each direction and count the squares. Tap Start over to retry.';msgCol='#f99';draw()}}
function choose(v){if(lock)return;Q.picked=v;lock=true;const ok=v===Q.ans;if(ok)sfx.ok();else{sfx.bad();miss++}msg=(ok?'✔ Correct! ':'✘ ')+(Q.why||'');msgCol=ok?'#7f7':'#f99';draw();setTimeout(next,ok?1500:3000)}
function next(){msg='';lock=false;qi++;if(qi>=NQ()){finishLevel(miss===0?3:miss<=2?2:1);return}Q=makeQ();draw()}
function onTap(x,y){hit(x,y)}
function onKey(e){const k=e.key,q=Q;if(!q||lock)return;if(q.opts){const n=+k;if(n>=1&&n<=q.opts.length)choose(q.opts[n-1]);return}
 if(q.dirs){const m={ArrowUp:'N',w:'N',W:'N',ArrowDown:'S',s:'S',S:'S',ArrowLeft:'W',a:'W',A:'W',ArrowRight:'E',d:'E',D:'E',q:'NW',Q:'NW',e:'NE',E:'NE',z:'SW',Z:'SW',c:'SE',C:'SE'}[k];const d=m&&q.dirs.find(x=>x[0]===m);if(d){e.preventDefault();step(d)}else if(k==='Enter')checkMove()}}
window.G={get Q(){return Q},LV};
resize();cur=0;Q=makeQ();draw();showLevels();

</script></body></html>
