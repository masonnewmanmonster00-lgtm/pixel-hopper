<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Air Hockey</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#f4f1ea;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:44px 8px 8px;user-select:none;touch-action:manipulation}
a.back{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:30;display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(8,8,16,.82);color:#ffe14d;border:1px solid rgba(255,225,77,.55);font:700 12px/1 ui-monospace,monospace;letter-spacing:.04em;text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a.back:focus-visible{outline:2px solid #ffe14d;outline-offset:2px}
.hud{margin:0;font:700 12px/1.3 ui-monospace,monospace;color:#c8c4d8;text-align:center;flex:0 0 auto;max-width:96vw}
.stage{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;touch-action:none}
</style>
</head>
<body>
<a class="back" href="./index.html" aria-label="Back to menu" onpointerdown="event.stopPropagation()" ontouchstart="event.stopPropagation()">← Menu</a>
<p class="hud">One finger each half. Arrows and WASD. First to 7. Best <span id="best">0</span></p>
<div class="stage"><canvas id="c" width="400" height="700"></canvas></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=400,H=700,GW=130,WIN=7;
let P,puck,sc,over,pause=0,ai=[false,false],keys={};
let hockeyHi=0;try{hockeyHi=+localStorage.getItem("arcade-hockey-best")||0}catch(e){}
const bestEl=document.getElementById('best');if(bestEl)bestEl.textContent=hockeyHi?String(hockeyHi):'-';
function rememberScore(){try{const n=Math.max(sc[0],sc[1]);if(typeof n==="number"&&n>hockeyHi){hockeyHi=n;localStorage.setItem("arcade-hockey-best",String(n));if(bestEl)bestEl.textContent=String(n)}}catch(e){}}
function reset(){P=[{x:W/2,y:H-90,px:W/2,py:H-90,col:'#f44'},{x:W/2,y:90,px:W/2,py:90,col:'#4af'}];sc=[0,0];over=false;serve(0);}
function serve(s){puck={x:W/2,y:s?H/2-60:H/2+60,vx:0,vy:0};pause=40;}
const touches={};
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
c.addEventListener('pointerdown',e=>{const p=pos(e);if(over){reset();return;}if(p.y<70&&p.x<90){ai[1]=!ai[1];return;}touches[e.pointerId]=p.y>H/2?0:1;try{c.setPointerCapture(e.pointerId)}catch(err){}});
c.addEventListener('pointermove',e=>{const k=touches[e.pointerId];if(k===undefined)return;const p=pos(e),m=P[k];m.x=p.x;m.y=p.y;});
c.addEventListener('pointerup',e=>delete touches[e.pointerId]);c.addEventListener('pointercancel',e=>delete touches[e.pointerId]);
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key=='Enter'&&over)reset();if(e.key==' '||e.key.startsWith('Arrow'))e.preventDefault();});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function clampM(m,k){m.x=Math.max(30,Math.min(W-30,m.x));if(k==0)m.y=Math.max(H/2+30,Math.min(H-30,m.y));else m.y=Math.max(30,Math.min(H/2-30,m.y));}
function update(){if(over)return;
const kb=[['arrowleft','arrowright','arrowup','arrowdown'],['a','d','w','s']];kb.forEach((ks,k)=>{const m=P[k];if(keys[ks[0]])m.x-=7;if(keys[ks[1]])m.x+=7;if(keys[ks[2]])m.y-=7;if(keys[ks[3]])m.y+=7;});
if(ai[1]){const m=P[1],tx=puck.y<H/2?puck.x:W/2,ty=puck.y<H/2&&puck.vy<=1?puck.y-25:80;m.x+=Math.max(-5,Math.min(5,tx-m.x));m.y+=Math.max(-5,Math.min(5,ty-m.y));}
P.forEach(clampM);
if(pause>0)pause--;else{puck.x+=puck.vx;puck.y+=puck.vy;puck.vx*=0.995;puck.vy*=0.995;}
if(puck.x<20||puck.x>W-20){puck.vx*=-1;puck.x=Math.max(20,Math.min(W-20,puck.x));}
const inGoal=Math.abs(puck.x-W/2)<GW/2;
if(puck.y<20){if(inGoal&&puck.y<0){sc[0]++;goal(1);}else if(!inGoal){puck.vy=Math.abs(puck.vy);puck.y=20;}}
if(puck.y>H-20){if(inGoal&&puck.y>H){sc[1]++;goal(0);}else if(!inGoal){puck.vy=-Math.abs(puck.vy);puck.y=H-20;}}
P.forEach(m=>{const dx=puck.x-m.x,dy=puck.y-m.y,d=Math.hypot(dx,dy);if(d<50&&d>0){const nx=dx/d,ny=dy/d;puck.x=m.x+nx*50;puck.y=m.y+ny*50;
const mvx=m.x-m.px,mvy=m.y-m.py,rel=(puck.vx-mvx)*nx+(puck.vy-mvy)*ny;if(rel<0){puck.vx-=1.9*rel*nx;puck.vy-=1.9*rel*ny;}
const sp=Math.hypot(puck.vx,puck.vy);if(sp>18){puck.vx*=18/sp;puck.vy*=18/sp;}}m.px=m.x;m.py=m.y;});
rememberScore();}
let gflash=0,gcol='';
function goal(next){gflash=40;gcol=P[next?0:1].col;if(sc[0]>=WIN||sc[1]>=WIN)over=true;serve(next);}
function draw(){x.fillStyle='#0b1220';x.fillRect(0,0,W,H);x.strokeStyle='#fff3';x.lineWidth=3;x.strokeRect(5,5,W-10,H-10);
x.beginPath();x.moveTo(5,H/2);x.lineTo(W-5,H/2);x.stroke();x.beginPath();x.arc(W/2,H/2,60,0,7);x.stroke();
x.fillStyle='#4af';x.fillRect(W/2-GW/2,0,GW,8);x.fillStyle='#f44';x.fillRect(W/2-GW/2,H-8,GW,8);
if(gflash>0){gflash--;x.fillStyle=gcol+'44';x.fillRect(0,0,W,H);}
P.forEach(m=>{x.shadowColor=m.col;x.shadowBlur=20;x.fillStyle=m.col;x.beginPath();x.arc(m.x,m.y,30,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#fff5';x.beginPath();x.arc(m.x,m.y,14,0,7);x.fill();});
x.shadowColor='#fff';x.shadowBlur=15;x.fillStyle='#eee';x.beginPath();x.arc(puck.x,puck.y,20,0,7);x.fill();x.shadowBlur=0;
x.font='bold 48px sans-serif';x.textAlign='right';x.fillStyle='#f44a';x.fillText(sc[0],W-20,H/2+55);x.save();x.translate(W-20,H/2-55);x.rotate(Math.PI);x.textAlign='left';x.fillStyle='#4afa';x.fillText(sc[1],0,0);x.restore();
x.font='13px sans-serif';x.textAlign='left';x.fillStyle='#fff8';x.fillText(ai[1]?'Blue: CPU (tap)':'Blue: Player (tap)',10,24);
if(over){x.fillStyle='rgba(0,0,0,.7)';x.fillRect(0,0,W,H);const w=sc[0]>sc[1]?0:1;x.fillStyle=P[w].col;x.font='bold 40px sans-serif';x.textAlign='center';
x.save();x.translate(W/2,H/2);if(w==1)x.rotate(Math.PI);x.fillText((w?'BLUE':'RED')+' WINS!',0,0);x.font='18px sans-serif';x.fillStyle='#fff';x.fillText('Tap to play again',0,35);x.restore();}
requestAnimationFrame(draw);}
reset();setInterval(update,1000/60);draw();
</script>
</body>
</html>
