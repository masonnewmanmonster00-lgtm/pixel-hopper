<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b14">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Rock Blaster</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#070814;color:#fff;font-family:ui-monospace,monospace;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pad{position:fixed;z-index:40;width:68px;height:68px;border-radius:50%;border:2px solid rgba(255,225,77,.55);background:rgba(8,10,24,.55);color:#ffe14d;font:700 22px/1 ui-monospace,monospace;display:flex;align-items:center;justify-content:center;touch-action:none;backdrop-filter:blur(3px)}
.pad.on{background:rgba(255,225,77,.35);color:#fff}
#rotL{left:max(16px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom))}
#rotR{left:max(100px,calc(env(safe-area-inset-left) + 100px));bottom:max(18px,env(safe-area-inset-bottom))}
#thrust{right:max(100px,calc(env(safe-area-inset-right) + 100px));bottom:max(18px,env(safe-area-inset-bottom));color:#9fd3ff;border-color:rgba(159,211,255,.6)}
#fire{right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));color:#ff8d8d;border-color:rgba(255,109,109,.7)}
#pauseBtn{position:fixed;z-index:40;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:46px;height:46px;border-radius:12px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);color:#fff;font:700 16px/1 ui-monospace,monospace;touch-action:none}
a.back{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:80;display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(8,8,16,.82);color:#ffe14d;border:1px solid rgba(255,225,77,.55);font:700 12px/1 ui-monospace,monospace;letter-spacing:.04em;text-decoration:none;touch-action:manipulation}
a.back:focus-visible{outline:2px solid #ffe14d;outline-offset:2px}
</style>
</head>
<body>
<a class="back" href="./index.html" aria-label="Back to menu" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">← Menu</a>
<canvas id="c"></canvas>
<div class="pad" id="rotL" aria-label="Rotate left">◀</div>
<div class="pad" id="rotR" aria-label="Rotate right">▶</div>
<div class="pad" id="thrust" aria-label="Thrust">▲</div>
<div class="pad" id="fire" aria-label="Fire">●</div>
<div id="pauseBtn" aria-label="Pause">II</div>
<script>
"use strict";
const KEY="arcade-rock-best";
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let W=800,H=450,DPR=1;
let state="title",score=0,best=0,lives=3,wave=1,shake=0,clock=0,between=0,banner="";
let ship,rocks=[],bullets=[],parts=[],rings=[],stars=[],pops=[];
const keys={};
let leftHeld=false,rightHeld=false,thrustHeld=false;
try{best=+localStorage.getItem(KEY)||0}catch(e){}
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=Math.max(1,W*DPR)|0;cv.height=Math.max(1,H*DPR)|0;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(!stars.length){
    for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random(),z:0.3+Math.random()*1.4,r:Math.random()*1.4+0.3,p:Math.random()*6});
  }
}
addEventListener("resize",resize);resize();
let AC=null,master=null,thrustGain=null;
function audio(){
  if(AC)return AC;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.22;master.connect(AC.destination);
    const buf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=280;
    thrustGain=AC.createGain();thrustGain.gain.value=0;
    src.connect(f);f.connect(thrustGain);thrustGain.connect(master);src.start();
  }catch(e){AC=null}
  return AC;
}
function tone(freq,dur,type,vol,slide){
  try{
    const a=audio();if(!a)return;
    const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
    o.type=type||"square";o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);
    g.gain.setValueAtTime(vol||0.08,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
function noise(dur,vol){
  try{
    const a=audio();if(!a)return;
    const n=Math.max(1,a.sampleRate*dur|0),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();
    s.buffer=buf;f.type="lowpass";f.frequency.value=900;g.gain.value=vol||0.2;
    s.connect(f);f.connect(g);g.connect(master);s.start();
  }catch(e){}
}
const sfx={
  shoot(){tone(880,0.07,"square",0.05,-500);tone(220,0.05,"triangle",0.03)},
  boom(){noise(0.28,0.22);tone(140,0.22,"sawtooth",0.06,-90)},
  hurt(){noise(0.35,0.25);tone(420,0.35,"sawtooth",0.07,-320)},
  wave(){[523,659,784,1047].forEach((f,i)=>tone(f,0.12,"square",0.05,0))},
  over(){[392,311,233,174].forEach((f,i)=>tone(f,0.22,"triangle",0.06,-40))}
};
function setThrust(on){try{if(thrustGain)thrustGain.gain.setTargetAtTime(on&&state==="play"?0.07:0,AC.currentTime,0.04)}catch(e){}}
function burst(x,y,n,col,sp){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,s=sp*(0.25+Math.random());
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0.35+Math.random()*0.45,m:0.35+Math.random()*0.45,col,sz:1.5+Math.random()*2.6});
  }
}
function ring(x,y,col){rings.push({x,y,r:8,a:1,col})}
function popup(x,y,t,col){pops.push({x,y,t,col,l:0.8})}
function makeRock(x,y,tier,vx,vy){
  const rad=[46,27,15][tier];
  const n=8+(Math.random()*3|0),verts=[];
  for(let i=0;i<n;i++){
    const a=i/n*6.283,m=0.72+Math.random()*0.38;
    verts.push([Math.cos(a)*rad*m,Math.sin(a)*rad*m]);
  }
  return {x,y,vx,vy,r:rad,tier,a:Math.random()*6,spin:(Math.random()-0.5)*1.5,verts,hit:0};
}
function freshShip(){ship={x:W/2,y:H/2,a:-Math.PI/2,vx:0,vy:0,inv:2.2,alive:true}}
function spawnWave(){
  rocks.length=0;
  const n=3+Math.min(6,wave);
  for(let i=0;i<n;i++){
    let x,y,g=0;
    do{x=Math.random()*W;y=Math.random()*H;g++}while(Math.hypot(x-W/2,y-H/2)<190&&g<40);
    const a=Math.random()*6.283,sp=32+wave*12+Math.random()*24;
    rocks.push(makeRock(x,y,0,Math.cos(a)*sp,Math.sin(a)*sp));
  }
  if(wave>2&&Math.random()<0.7){
    const a=Math.random()*6.283,sp=90+wave*8;
    rocks.push(makeRock(Math.random()*W,0,2,Math.cos(a)*sp,Math.sin(a)*sp+40));
  }
}
function addScore(n,x,y){
  score+=n;
  if(x!=null)popup(x,y,"+"+n,"#ffe14d");
  if(score>best){best=score;try{localStorage.setItem(KEY,String(best))}catch(e){}}
}
function start(){
  audio();score=0;lives=3;wave=1;between=0;banner="";shake=0;
  bullets.length=0;parts.length=0;rings.length=0;pops.length=0;
  freshShip();spawnWave();state="play";
}
function restart(){start()}
function gameOver(){
  if(state==="over")return;
  state="over";setThrust(false);sfx.over();
  if(score>best){best=score;try{localStorage.setItem(KEY,String(best))}catch(e){}}
}
function fire(){
  if(state!=="play"||bullets.length>5)return;
  const c=Math.cos(ship.a),s=Math.sin(ship.a);
  bullets.push({x:ship.x+c*18,y:ship.y+s*18,vx:ship.vx+c*460,vy:ship.vy+s*460,l:0.85});
  ship.vx-=c*8;ship.vy-=s*8;sfx.shoot();
}
function hurt(){
  if(ship.inv>0||state!=="play")return;
  lives--;shake=Math.max(shake,16);
  burst(ship.x,ship.y,32,"#ffd27a",220);ring(ship.x,ship.y,"#ffb15a");sfx.hurt();
  if(lives<=0){gameOver();return}
  freshShip();
}
function wrap(o,m){
  const p=m||0;
  if(o.x<-p)o.x=W+p;if(o.x>W+p)o.x=-p;
  if(o.y<-p)o.y=H+p;if(o.y>H+p)o.y=-p;
}
function sim(dt){
  const left=keys.ArrowLeft||keys.KeyA||leftHeld;
  const right=keys.ArrowRight||keys.KeyD||rightHeld;
  const thrust=keys.ArrowUp||keys.KeyW||thrustHeld;
  if(left)ship.a-=3.3*dt;
  if(right)ship.a+=3.3*dt;
  if(thrust){
    ship.vx+=Math.cos(ship.a)*210*dt;
    ship.vy+=Math.sin(ship.a)*210*dt;
    if(Math.random()<dt*40){
      const c=Math.cos(ship.a),s=Math.sin(ship.a);
      parts.push({x:ship.x-c*14,y:ship.y-s*14,vx:-c*80+(Math.random()-0.5)*30,vy:-s*80+(Math.random()-0.5)*30,l:0.22,m:0.22,col:Math.random()<0.5?"#9fd3ff":"#ffe14d",sz:2});
    }
  }
  setThrust(thrust);
  const sp=Math.hypot(ship.vx,ship.vy),max=300+wave*6;
  if(sp>max){ship.vx*=max/sp;ship.vy*=max/sp}
  ship.vx*=Math.exp(-0.55*dt);ship.vy*=Math.exp(-0.55*dt);
  ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;wrap(ship,0);
  if(ship.inv>0)ship.inv-=dt;
  for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt}
  bullets=bullets.filter(b=>b.l>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
  for(const r of rocks){r.x+=r.vx*dt;r.y+=r.vy*dt;r.a+=r.spin*dt;wrap(r,r.r+4)}
  const gone=new Set();
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    for(let j=rocks.length-1;j>=0;j--){
      const r=rocks[j];
      if(r.hit)continue;
      if(Math.hypot(b.x-r.x,b.y-r.y)<r.r){
        r.hit=1;
        bullets.splice(i,1);gone.add(j);
        const pts=[100,50,20][r.tier];
        addScore(pts,r.x,r.y);
        burst(r.x,r.y,r.tier===2?10:18,r.tier===2?"#ffcf8a":"#e7d2c3",140);
        ring(r.x,r.y,"#ffe14d");shake=Math.max(shake,r.tier===0?10:6);sfx.boom();
        if(r.tier<2){
          for(let k=0;k<2;k++){
            const a=Math.random()*6.283,sp=(70+wave*6)*(1+r.tier*0.15);
            rocks.push(makeRock(r.x,r.y,r.tier+1,r.vx*0.4+Math.cos(a)*sp,r.vy*0.4+Math.sin(a)*sp));
          }
        }
        break;
      }
    }
  }
  if(gone.size)rocks=rocks.filter((_,i)=>!gone.has(i));
  if(ship.inv<=0){
    for(const r of rocks)if(Math.hypot(ship.x-r.x,ship.y-r.y)<r.r+7){hurt();break}
  }
  if(state==="play"&&!rocks.length&&between<=0){between=1.25;banner="WAVE CLEAR";sfx.wave();addScore(150+wave*25)}
  if(between>0){between-=dt;if(between<=0&&state==="play"){wave++;banner="WAVE "+wave;spawnWave()}}
}
function stepFX(dt){
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.98;p.vy*=0.98;p.l-=dt}
  parts=parts.filter(p=>p.l>0);
  for(const r of rings){r.r+=90*dt;r.a-=dt*1.6}
  rings=rings.filter(r=>r.a>0);
  for(const p of pops){p.y-=28*dt;p.l-=dt}
  pops=pops.filter(p=>p.l>0);
  shake*=Math.exp(-3.2*dt);if(shake<0.2)shake=0;
}
function poly(o){
  ctx.beginPath();
  o.verts.forEach((v,i)=>{
    const px=o.x+v[0]*Math.cos(o.a)-v[1]*Math.sin(o.a);
    const py=o.y+v[0]*Math.sin(o.a)+v[1]*Math.cos(o.a);
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  });
  ctx.closePath();
}
function draw(){
  const sx=(Math.random()-0.5)*shake,sy=(Math.random()-0.5)*shake;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#14183a");bg.addColorStop(0.55,"#0a0c1c");bg.addColorStop(1,"#07060f");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const neb=ctx.createRadialGradient(W*0.2,H*0.3,20,W*0.25,H*0.35,W*0.45);
  neb.addColorStop(0,"rgba(90,70,180,.35)");neb.addColorStop(1,"rgba(90,70,180,0)");
  ctx.fillStyle=neb;ctx.fillRect(0,0,W,H);
  const neb2=ctx.createRadialGradient(W*0.8,H*0.7,10,W*0.75,H*0.7,W*0.4);
  neb2.addColorStop(0,"rgba(40,90,160,.28)");neb2.addColorStop(1,"rgba(40,90,160,0)");
  ctx.fillStyle=neb2;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(sx,sy);
  const driftX=(ship?ship.vx:0),driftY=(ship?ship.vy:0);
  for(const s of stars){
    const tw=0.45+Math.sin(clock*2+s.p)*0.55;
    ctx.globalAlpha=0.35+tw*0.65;ctx.fillStyle=s.z>1.2?"#fff":"#c9d4ff";
    ctx.beginPath();
    ctx.arc(((s.x*W-driftX*s.z*0.15)%W+W)%W,((s.y*H-driftY*s.z*0.15)%H+H)%H,s.r,0,7);
    ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const r of rings){
    ctx.globalAlpha=Math.max(0,r.a);ctx.strokeStyle=r.col;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();
  }
  ctx.globalAlpha=1;
  for(const r of rocks){
    const g=ctx.createLinearGradient(r.x-r.r,r.y-r.r,r.x+r.r,r.y+r.r);
    g.addColorStop(0,"#f0e2d4");g.addColorStop(0.45,"#a88b78");g.addColorStop(1,"#3a2a26");
    poly(r);ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle="rgba(255,236,210,.55)";ctx.lineWidth=1.5;ctx.stroke();
    ctx.strokeStyle="rgba(60,30,24,.45)";ctx.beginPath();
    ctx.moveTo(r.x,r.y);ctx.lineTo(r.x+Math.cos(r.a)*r.r*0.45,r.y+Math.sin(r.a)*r.r*0.45);ctx.stroke();
  }
  for(const b of bullets){
    const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,8);
    g.addColorStop(0,"#fff");g.addColorStop(0.4,"#ffe14d");g.addColorStop(1,"rgba(255,225,77,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,8,0,7);ctx.fill();
  }
  if(ship&&state!=="over"&&(ship.inv<=0||Math.sin(clock*28)>0)){
    ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.a);
    const thrusting=keys.ArrowUp||keys.KeyW||thrustHeld;
    if(thrusting&&state==="play"){
      const fg=ctx.createLinearGradient(-8,0,-26,0);
      fg.addColorStop(0,"#fff");fg.addColorStop(0.4,"#9fd3ff");fg.addColorStop(1,"rgba(255,120,40,0)");
      ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-22-(clock*30%8),5);ctx.lineTo(-22-(clock*30%8),-5);ctx.fill();
    }
    const hg=ctx.createLinearGradient(-12,0,16,0);
    hg.addColorStop(0,"#c8892e");hg.addColorStop(0.5,"#ffe14d");hg.addColorStop(1,"#fff6c8");
    ctx.fillStyle=hg;ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-12,9);ctx.lineTo(-6,0);ctx.lineTo(-12,-9);ctx.closePath();ctx.fill();
    ctx.fillStyle="#1b2448";ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-2,3.2);ctx.lineTo(-2,-3.2);ctx.fill();
    ctx.restore();
  }
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.font="700 13px ui-monospace,monospace";ctx.textAlign="left";
  for(const p of pops){ctx.globalAlpha=Math.max(0,p.l*1.4);ctx.fillStyle=p.col;ctx.fillText(p.t,p.x,p.y)}
  ctx.globalAlpha=1;ctx.restore();
  const vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.2,W/2,H/2,Math.max(W,H)*0.72);
  vig.addColorStop(0,"rgba(0,0,0,0)");vig.addColorStop(1,"rgba(0,0,0,.5)");
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  ctx.textAlign="left";ctx.font="700 16px ui-monospace,monospace";ctx.fillStyle="#ffe14d";
  ctx.fillText(String(score).padStart(6,"0"),96,28);
  ctx.font="700 12px ui-monospace,monospace";ctx.fillStyle="#9fd3ff";
  ctx.fillText("BEST "+best,96,46);ctx.fillStyle="#fff";ctx.fillText("WAVE "+wave,190,28);
  for(let i=0;i<lives;i++){
    ctx.save();ctx.translate(190+i*16,44);ctx.rotate(-Math.PI/2);ctx.fillStyle="#ffe14d";
    ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(-5,4);ctx.lineTo(-5,-4);ctx.fill();ctx.restore();
  }
  if(banner&&between>0){
    ctx.textAlign="center";ctx.font="700 28px ui-monospace,monospace";ctx.fillStyle="#ffe14d";
    ctx.shadowColor="#ffe14d";ctx.shadowBlur=16;ctx.fillText(banner,W/2,H*0.28);ctx.shadowBlur=0;
  }
  if(state==="title"||state==="over"){
    ctx.fillStyle="rgba(4,6,16,.62)";ctx.fillRect(0,0,W,H);
    const title=state==="title"?"ROCK BLASTER":"GAME OVER";
    ctx.textAlign="center";ctx.font="700 42px ui-monospace,monospace";
    ctx.shadowColor="#ffe14d";ctx.shadowBlur=22;ctx.fillStyle="#ffe14d";ctx.fillText(title,W/2,H*0.40);
    ctx.shadowBlur=0;ctx.font="700 16px ui-monospace,monospace";ctx.fillStyle="#fff";
    if(state==="over")ctx.fillText("SCORE "+score+"    BEST "+best,W/2,H*0.40+36);
    ctx.fillStyle="#c8c4d8";ctx.font="700 13px ui-monospace,monospace";
    const sub=state==="title"?"Drift, blast, and clear the field":"The rocks kept coming";
    ctx.fillText(sub,W/2,H*0.40+(state==="over"?64:40));
    ctx.fillStyle="#9fd3ff";ctx.fillText("Arrows or A D rotate    W thrust    Space fire",W/2,H*0.40+92);
    if(Math.sin(clock*4)>0){ctx.fillStyle="#ffe14d";ctx.fillText(state==="title"?"TAP OR PRESS ENTER":"TAP OR ENTER TO PLAY AGAIN",W/2,H*0.40+122)}
  }
  if(state==="pause"){
    ctx.fillStyle="rgba(4,6,16,.55)";ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";ctx.font="700 36px ui-monospace,monospace";ctx.fillStyle="#ffe14d";
    ctx.fillText("PAUSED",W/2,H/2);ctx.font="700 14px ui-monospace,monospace";ctx.fillStyle="#fff";
    ctx.fillText("P resume    R restart",W/2,H/2+32);
  }
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.033,(now-last)/1000);last=now;clock+=dt;
  try{
    if(state==="play")sim(dt);
    else setThrust(false);
    stepFX(dt);draw();
  }catch(e){console.error(e)}
}
requestAnimationFrame(frame);
function togglePause(){if(state==="play"){state="pause";setThrust(false)}else if(state==="pause")state="play"}
addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code))e.preventDefault();
  keys[e.code]=true;audio();
  if(e.repeat)return;
  if(e.code==="KeyP"||e.code==="Escape")togglePause();
  if(e.code==="KeyR")restart();
  if((e.code==="Enter"||e.code==="Space")&&(state==="title"||state==="over"))start();
  else if((e.code==="Space"||e.code==="KeyJ")&&state==="play")fire();
});
addEventListener("keyup",e=>{keys[e.code]=false});
addEventListener("blur",()=>{for(const k in keys)keys[k]=false;leftHeld=rightHeld=thrustHeld=false;setThrust(false)});
cv.addEventListener("pointerdown",e=>{if(e.target!==cv)return;audio();if(state==="title"||state==="over")start()});
function hold(id,on,off){
  const el=document.getElementById(id);
  el.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();el.setPointerCapture(e.pointerId);el.classList.add("on");audio();on()});
  const up=()=>{el.classList.remove("on");off()};
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
}
hold("rotL",()=>{leftHeld=true},()=>{leftHeld=false});
hold("rotR",()=>{rightHeld=true},()=>{rightHeld=false});
hold("thrust",()=>{thrustHeld=true},()=>{thrustHeld=false});
document.getElementById("fire").addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();audio();if(state==="play")fire()});
document.getElementById("pauseBtn").addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();audio();togglePause()});
</script>
</body>
</html>
