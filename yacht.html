<title>Yacht Dice</title><style>html,body{margin:0;height:100%;background:#0b1f17;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}canvas{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}

<a class="back" href="./index.html" aria-label="Back to menu" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">← Menu</a>
<canvas id="c"></canvas><script>
"use strict";
const CATS=[["ones","Ones"],["twos","Twos"],["threes","Threes"],["fours","Fours"],["fives","Fives"],["sixes","Sixes"],["three","3 of a Kind"],["four","4 of a Kind"],["full","Full House"],["small","Sm Straight"],["large","Lg Straight"],["yacht","YACHT"],["chance","Chance"]];
const KEY="yachtSave";
// ---------- rules ----------
function counts(d){const c=[0,0,0,0,0,0,0];d.forEach(v=>c[v]++);return c}
function sum(d){return d.reduce((a,b)=>a+b,0)}
function isYacht(d){return d.every(v=>v===d[0])}
function rawScore(d,i,joker){const c=counts(d),s=sum(d),mx=Math.max(...c);
 if(i<6)return c[i+1]*(i+1);
 switch(i){case 6:return mx>=3?s:0;case 7:return mx>=4?s:0;
 case 8:return joker?25:(c.includes(3)&&c.includes(2))?25:0;
 case 9:return joker?30:([[1,2,3,4],[2,3,4,5],[3,4,5,6]].some(r=>r.every(v=>c[v]))?30:0);
 case 10:return joker?40:((c[1]&&c[2]&&c[3]&&c[4]&&c[5])||(c[2]&&c[3]&&c[4]&&c[5]&&c[6])?40:0);
 case 11:return mx===5?50:0;case 12:return s}}
// joker rule (forced): returns {legal:[idx], joker:bool}
function legalCats(card,d){const open=[];for(let i=0;i<13;i++)if(card[i]==null)open.push(i);
 if(isYacht(d)&&card[11]!=null){const up=d[0]-1;if(card[up]==null)return{legal:[up],joker:false};
  const low=open.filter(i=>i>=6);if(low.length)return{legal:low,joker:true};return{legal:open,joker:false}}
 return{legal:open,joker:false}}
function scoreFor(card,d,i){const L=legalCats(card,d);if(!L.legal.includes(i))return null;return rawScore(d,i,L.joker)}
function yachtBonus(card,d){return isYacht(d)&&card[11]===50?100:0}
function upperSum(card){let s=0;for(let i=0;i<6;i++)s+=card[i]||0;return s}
function total(p){const u=upperSum(p.card);let s=u+(u>=63?35:0)+p.yb;for(let i=6;i<13;i++)s+=p.card[i]||0;return s}
// ---------- AI ----------
function rnd6(){return 1+Math.floor(Math.random()*6)}
function catValue(card,d,i,turnsLeft){const L=legalCats(card,d);if(!L.legal.includes(i))return -1e9;let v=rawScore(d,i,L.joker);let adj=v;
 if(i<6){const par=3*(i+1);const u=upperSum(card);if(u<63)adj+=(v-par)*0.9+(v>=par?4:0)}
 if(i===11&&v===0)adj-=turnsLeft>4?14:4; if(i===12)adj-=turnsLeft>3?8:0;
 if(v===0&&i>=6&&i!=11)adj-=[0,0,0,0,0,0,6,3,8,10,12,0,0][i]*(turnsLeft>3?1:0.3);
 adj+=yachtBonus(card,d);return adj}
function bestCat(card,d,turnsLeft){let b=-1,bv=-1e9;for(let i=0;i<13;i++){const v=catValue(card,d,i,turnsLeft);if(v>bv){bv=v;b=i}}return[b,bv]}
function hardHold(card,d,rollsLeft,turnsLeft){let best=31,bv=-1e9;const seen={};const N=rollsLeft>1?120:220;
 for(let m=0;m<32;m++){const kept=d.filter((_,k)=>m>>k&1).sort().join("");if(seen[kept])continue;seen[kept]=1;let tot=0;
  for(let t=0;t<N;t++){const nd=d.map((v,k)=>m>>k&1?v:rnd6());let v=bestCat(card,nd,turnsLeft)[1];
   if(rollsLeft>1){const c=counts(nd),mx=Math.max(...c);v+=mx*1.5}tot+=v}
  tot/=N;if(tot>bv){bv=tot;best=m}}
 const now=bestCat(card,d,turnsLeft)[1];if(now>=bv)return 31;return best}
function easyHold(d){const c=counts(d);let f=1;for(let v=1;v<=6;v++)if(c[v]>c[f]||(c[v]===c[f]&&v>f))f=v;if(Math.random()<0.25)return Math.floor(Math.random()*32);let m=0;d.forEach((v,k)=>{if(v===f)m|=1<<k});return m}
function easyCat(card,d){const L=legalCats(card,d).legal;let b=L[0],bv=-1;L.forEach(i=>{const v=scoreFor(card,d,i);if(v>bv||(v===bv&&Math.random()<.3)){bv=v;b=i}});return b}
function simGame(diff){const p={card:Array(13).fill(null),yb:0};for(let t=0;t<13;t++){let d=[1,2,3,4,5].map(rnd6);
 for(let r=2;r>0;r--){const m=diff==="hard"?hardHold(p.card,d,r,13-t):easyHold(d);if(m===31)break;d=d.map((v,k)=>m>>k&1?v:rnd6())}
 const c=diff==="hard"?bestCat(p.card,d,13-t)[0]:easyCat(p.card,d);p.yb+=yachtBonus(p.card,d);p.card[c]=scoreFor(p.card,d,c)}return total(p)}
// ---------- save ----------
function loadSave(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.high)return s}catch(e){}return{high:[],stats:{games:0,best:0,yachts:0,totalPts:0,wins:0}}}
let save=loadSave();
function saveHub(){try{const n=save.stats.best|0;if(!(n>0))return;const k="arcade-yacht-best";const prev=Number(localStorage.getItem(k));if(Number.isFinite(prev)&&prev>=n)return;localStorage.setItem(k,String(n))}catch(e){}}
function writeSave(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}saveHub()}
// ---------- audio ----------
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended"){const p=AC.resume();if(p&&p.catch)p.catch(()=>{})}return AC}
function noise(t0,dur,f,vol){try{const a=ac();if(!a)return;const n=a.sampleRate*dur|0,b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type="bandpass";fl.frequency.value=f;fl.Q.value=2;const g=a.createGain();g.gain.value=vol;s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(a.currentTime+t0)}catch(e){}}
function tone(t0,f,dur,vol,type){try{const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.value=f;const t=a.currentTime+t0;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05)}catch(e){}}
const sfx={rattle(){for(let i=0;i<9;i++)noise(i*.035+Math.random()*.02,.05,2500+Math.random()*2000,.25)},clack(){noise(0,.04,1800+Math.random()*900,.35)},
 chime(){[784,988,1175].forEach((f,i)=>tone(i*.07,f,.35,.12))},hold(){tone(0,520,.08,.08,"triangle")},zero(){tone(0,220,.25,.08,"triangle")},
 yacht(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(i*.09,f,.5,.12,"square"))},click(){tone(0,700,.05,.05)}};
// ---------- canvas ----------
const cv=document.getElementById("c"),ctx=cv.getContext("2d");let W=844,H=390,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,3);W=window.innerWidth||844;H=window.innerHeight||390;cv.width=W*DPR|0;cv.height=H*DPR|0;ctx.setTransform(DPR,0,0,DPR,0,0)}
window.addEventListener("resize",resize);
// ---------- state (init before first draw) ----------
const G={scene:"menu",paused:false,players:[],cur:0,round:1,dice:[],rollsLeft:3,hasRolled:false,sel:0,msg:"",msgT:0,particles:[],cpuT:0,
 menu:{cpuN:1,diff:"hard",ppN:2},lastMode:null,celebrate:0,hits:[],results:null,cpuHolds:null};
function makeDice(){G.dice=[0,1,2,3,4].map(k=>({v:k+1,held:false,x:0,y:0,vx:0,vy:0,a:0,va:0,rolling:0,disp:k+1,lift:0}))}
makeDice();
function layout(){const narrow=W<720;if(narrow){const top=56,trayH=Math.min(Math.max(200,H*0.46),H-top-220);return{tray:{x:8,y:top,w:W-16,h:trayH},card:{x:8,y:top+trayH+6,w:W-16,h:H-(top+trayH+14)}}}
 const left=108,avail=W-left-8,cardW=Math.min(380,Math.max(240,avail*0.42)),trayW=avail-cardW-8;return{tray:{x:left,y:8,w:trayW,h:H-16},card:{x:left+trayW+8,y:8,w:cardW,h:H-16}}}
function startGame(mode){ac();G.lastMode=mode;const P=[];
 if(mode==="solo")P.push({name:"You",cpu:null});
 else if(mode==="cpu"){P.push({name:"You",cpu:null});for(let i=0;i<G.menu.cpuN;i++)P.push({name:"CPU "+(i+1),cpu:G.menu.diff})}
 else for(let i=0;i<G.menu.ppN;i++)P.push({name:"Player "+(i+1),cpu:null});
 P.forEach(p=>{p.card=Array(13).fill(null);p.yb=0;p.yachts=0});G.players=P;G.cur=0;G.round=1;G.scene="play";G.paused=false;G.results=null;newTurn()}
function newTurn(){G.rollsLeft=3;G.hasRolled=false;G.dice.forEach(d=>{d.held=false});G.sel=firstOpen();G.cpuT=0.8;G.cpuHolds=null;placeDiceIdle()}
function firstOpen(){const p=G.players[G.cur];if(!p)return 0;for(let i=0;i<13;i++)if(p.card[i]==null)return i;return 0}
function placeDiceIdle(){const t=layout().tray;G.dice.forEach((d,k)=>{d.x=t.x+t.w*(0.18+k*0.16);d.y=t.y+t.h*0.6;d.vx=d.vy=0;d.rolling=0})}
function curP(){return G.players[G.cur]}
function canAct(){return G.scene==="play"&&!G.paused&&curP()&&!curP().cpu&&!rollingNow()}
function rollingNow(){return G.dice.some(d=>d.rolling>0)}
function roll(){if(G.rollsLeft<=0||rollingNow())return false;if(G.dice.every(d=>d.held))return false;G.rollsLeft--;G.hasRolled=true;const t=layout().tray;sfx.rattle();
 G.dice.forEach((d,k)=>{if(d.held)return;d.v=rnd6();d.x=t.x+30+Math.random()*40;d.y=t.y+t.h*(0.35+Math.random()*0.5);d.vx=500+Math.random()*500;d.vy=(Math.random()-.5)*700;d.va=(Math.random()-.5)*25;d.rolling=0.7+k*0.08+Math.random()*0.2});return true}
function toggleHold(k){if(!G.hasRolled||G.rollsLeft===0&&false)return;if(!G.hasRolled||rollingNow())return;const d=G.dice[k];d.held=!d.held;sfx.hold()}
function vals(){return G.dice.map(d=>d.v)}
function chooseCat(i){const p=curP();if(!G.hasRolled||rollingNow())return false;const d=vals();const s=scoreFor(p.card,d,i);if(s==null){flash("Joker rule: pick a highlighted box");return false}
 const yb=yachtBonus(p.card,d);p.yb+=yb;p.card[i]=s;if(isYacht(d)){p.yachts++;if(!p.cpu||true){}}
 if(yb||(i===11&&s===50)){celebrate();flash(yb?"YACHT BONUS +100!":"YACHT! +50")}else if(s>0){sfx.chime();flash(CATS[i][1]+" +"+s)}else{sfx.zero();flash(CATS[i][1]+" scratched")}
 nextPlayer();return true}
function flash(m){G.msg=m;G.msgT=1.8}
function celebrate(){sfx.yacht();G.celebrate=2.5;for(let i=0;i<160;i++)G.particles.push({x:W*0.3,y:H*0.5,vx:(Math.random()-.5)*900,vy:-Math.random()*700-100,c:`hsl(${Math.random()*360},90%,60%)`,t:2+Math.random()})}
function nextPlayer(){G.cur++;if(G.cur>=G.players.length){G.cur=0;G.round++}if(G.round>13){endGame();return}newTurn()}
function endGame(){G.scene="over";const res=G.players.map(p=>({name:p.name,cpu:p.cpu,score:total(p)}));G.results=res;const st=save.stats;const best=Math.max(...res.map(r=>r.score));
 G.players.forEach((p,i)=>{if(p.cpu)return;const sc=res[i].score;st.games++;st.totalPts+=sc;st.yachts+=p.yachts;if(sc>st.best)st.best=sc;if(G.players.length>1&&sc===best)st.wins++;
  save.high.push({score:sc,name:p.name,mode:G.lastMode,date:new Date().toISOString().slice(0,10)})});
 save.high.sort((a,b)=>b.score-a.score);save.high=save.high.slice(0,10);writeSave();sfx.chime()}
// CPU
function cpuStep(dt){const p=curP();if(!p||!p.cpu||G.scene!=="play"||G.paused||rollingNow())return;G.cpuT-=dt;if(G.cpuT>0)return;G.cpuT=0.75;
 if(!G.hasRolled){roll();return}const d=vals();const tl=14-G.round;
 if(G.rollsLeft>0&&G.cpuHolds==null){const m=p.cpu==="hard"?hardHold(p.card,d,G.rollsLeft,tl):easyHold(d);if(m!==31){G.dice.forEach((x,k)=>x.held=!!(m>>k&1));G.cpuHolds=m;sfx.hold();return}}
 if(G.cpuHolds!=null){G.cpuHolds=null;roll();return}
 const c=p.cpu==="hard"?bestCat(p.card,d,tl)[0]:easyCat(p.card,d);G.sel=c;chooseCat(c)}
// ---------- drawing ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function btn(x,y,w,h,label,act,opt){opt=opt||{};ctx.save();rr(x,y,w,h,10);const g=ctx.createLinearGradient(0,y,0,y+h);const c=opt.on===false?["#555","#333"]:opt.col||["#ffcf4a","#e09a12"];g.addColorStop(0,c[0]);g.addColorStop(1,c[1]);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle="rgba(0,0,0,.4)";ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle=opt.tc||"#2a1600";ctx.font=`bold ${opt.fs||16}px system-ui,sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(label,x+w/2,y+h/2+1);ctx.restore();G.hits.push({x,y,w,h,act,ui:true,label})}
const PIPS={1:[[.5,.5]],2:[[.25,.25],[.75,.75]],3:[[.25,.25],[.5,.5],[.75,.75]],4:[[.25,.25],[.75,.25],[.25,.75],[.75,.75]],5:[[.25,.25],[.75,.25],[.5,.5],[.25,.75],[.75,.75]],6:[[.25,.22],[.75,.22],[.25,.5],[.75,.5],[.25,.78],[.75,.78]]};
function drawDie(x,y,s,a,v,held,lift,glow){ctx.save();ctx.translate(x,y-lift);ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.ellipse(4,s*0.55+lift*0.6,s*0.55,s*0.16,0,0,7);ctx.fill();ctx.rotate(a);
 const d=s*0.14;// side faces for depth
 ctx.fillStyle=held?"#c9a640":"#b8b8c4";rr(-s/2+d*0.6,-s/2+d,s,s,s*0.2);ctx.fill();
 if(glow){ctx.shadowColor="#ffd84a";ctx.shadowBlur=18}
 const g=ctx.createLinearGradient(-s/2,-s/2,s/2,s/2);g.addColorStop(0,held?"#fff6cf":"#ffffff");g.addColorStop(1,held?"#f2d06a":"#dcdce6");ctx.fillStyle=g;rr(-s/2,-s/2,s,s,s*0.2);ctx.fill();ctx.shadowBlur=0;
 ctx.strokeStyle=held?"#d49b00":"rgba(0,0,0,.25)";ctx.lineWidth=held?3:1.5;ctx.stroke();
 ctx.fillStyle=v===1?"#c0182a":"#1b1b28";PIPS[v].forEach(([px,py])=>{ctx.beginPath();ctx.arc(-s/2+px*s,-s/2+py*s,s*0.085,0,7);ctx.fill()});ctx.restore()}
function drawTray(t){ctx.save();rr(t.x,t.y,t.w,t.h,22);ctx.fillStyle="#5a3418";ctx.fill();rr(t.x+10,t.y+10,t.w-20,t.h-20,16);const g=ctx.createRadialGradient(t.x+t.w/2,t.y+t.h/2,20,t.x+t.w/2,t.y+t.h/2,t.w*0.7);g.addColorStop(0,"#1f8a52");g.addColorStop(1,"#0d4a2b");ctx.fillStyle=g;ctx.fill();
 ctx.globalAlpha=.06;ctx.fillStyle="#000";for(let i=0;i<60;i++){ctx.fillRect(t.x+10+((i*97)%(t.w-20)),t.y+10+((i*53)%(t.h-20)),2,2)}ctx.restore()}
function diceSize(){const t=layout().tray;return Math.min(t.w/7.5,t.h/5.2,72)}
function heldPos(k){const t=layout().tray,s=diceSize();return{x:t.x+t.w/2+(k-2)*(s*1.25),y:t.y+16+s*0.75}}
function draw(){G.hits=[];ctx.fillStyle="#0b1f17";ctx.fillRect(0,0,W,H);
 if(G.scene==="menu")return drawMenu();if(G.scene==="scores")return drawScores();
 const L=layout(),t=L.tray,s=diceSize(),p=curP();drawTray(t);
 // held strip label
 ctx.fillStyle="rgba(255,255,255,.12)";rr(t.x+t.w/2-s*3.3,t.y+14,s*6.6,s*1.45,12);ctx.fill();ctx.fillStyle="rgba(255,255,255,.35)";ctx.font="11px system-ui";ctx.textAlign="left";ctx.fillText("HELD",t.x+t.w/2-s*3.2,t.y+26);
 G.dice.forEach((d,k)=>{if(!G.hasRolled)return;let x=d.x,y=d.y,lift=0;if(d.held){const hp=heldPos(k);x=hp.x;y=hp.y;lift=4+Math.sin(performance.now()/300+k)*2}
  drawDie(x,y,s,d.held?0:d.a,d.rolling>0?d.disp:d.v,d.held,lift,d.held);G.hits.push({x:x-s/2-4,y:y-s/2-8,w:s+8,h:s+12,act:()=>{if(canAct())toggleHold(k)}})});
 if(!G.hasRolled){ctx.fillStyle="rgba(255,255,255,.55)";ctx.font="bold 18px system-ui";ctx.textAlign="center";ctx.fillText(p&&p.cpu?p.name+" is thinking…":"Tap ROLL to throw the dice",t.x+t.w/2,t.y+t.h*0.55)}
 // HUD in tray
 ctx.textAlign="left";ctx.fillStyle="#ffe9a8";ctx.font="bold 15px system-ui";ctx.fillText((p?p.name:"")+(p&&p.cpu?" ("+p.cpu+")":""),t.x+16,t.y+t.h-78);
 ctx.fillStyle="#cfe";ctx.font="13px system-ui";ctx.fillText("Round "+Math.min(G.round,13)+"/13 · Rolls left: "+G.rollsLeft,t.x+16,t.y+t.h-60);
 for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(t.x+22+i*16,t.y+t.h-24,5,0,7);ctx.fillStyle=i<G.rollsLeft?"#ffcf4a":"rgba(255,255,255,.2)";ctx.fill()}
 const human=p&&!p.cpu;btn(t.x+t.w-196,t.y+t.h-52,48,44,"II",()=>togglePause(),{col:["#9ad","#579"],tc:"#fff"});
 btn(t.x+t.w-140,t.y+t.h-52,132,44,G.hasRolled?"ROLL ("+G.rollsLeft+")":"ROLL",()=>{if(canAct())roll()},{on:human&&G.rollsLeft>0&&!rollingNow(),fs:16});
 drawCard(L.card);
 if(G.msgT>0){ctx.save();ctx.globalAlpha=Math.min(1,G.msgT*2);ctx.fillStyle="rgba(0,0,0,.65)";rr(t.x+t.w/2-140,t.y+t.h*0.38-20,280,40,12);ctx.fill();ctx.fillStyle="#ffe27a";ctx.font="bold 18px system-ui";ctx.textAlign="center";ctx.fillText(G.msg,t.x+t.w/2,t.y+t.h*0.38+6);ctx.restore()}
 G.particles.forEach(q=>{ctx.fillStyle=q.c;ctx.globalAlpha=Math.min(1,q.t);ctx.fillRect(q.x,q.y,6,9);ctx.globalAlpha=1});
 if(G.celebrate>0){ctx.save();ctx.fillStyle="#fff";ctx.font=`bold ${40+Math.sin(G.celebrate*10)*5}px system-ui`;ctx.textAlign="center";ctx.shadowColor="#f0c";ctx.shadowBlur=20;ctx.globalAlpha=Math.min(1,G.celebrate);ctx.fillText("YACHT!",t.x+t.w/2,t.y+t.h*0.25);ctx.restore()}
 if(G.paused){G.hits.length=0;drawPause();return}if(G.scene==="over"){G.hits.length=0;drawOver()}}
function drawCard(c){const p=curP();if(!p)return;ctx.save();rr(c.x,c.y,c.w,c.h,12);ctx.fillStyle="#f6f0dc";ctx.fill();
 const multi=G.players.length>1;const rows=17,rh=(c.h-8)/rows;const nameW=c.w*(multi?0.40:0.55);const colW=(c.w-nameW-8)/G.players.length;
 ctx.font=`bold ${Math.min(13,rh*0.62)}px system-ui`;ctx.textBaseline="middle";

function update(dt){const t=layout().tray,s=diceSize(),pad=10+s*0.6;
 G.dice.forEach(d=>{if(d.rolling<=0||d.held)return;d.rolling-=dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.a+=d.va*dt;d.vx*=Math.pow(0.12,dt);d.vy*=Math.pow(0.12,dt);d.va*=Math.pow(0.2,dt);
  const minY=t.y+20+s*1.6+s/2;let hit=false;
  if(d.x<t.x+pad){d.x=t.x+pad;d.vx=Math.abs(d.vx)*.7;hit=true}if(d.x>t.x+t.w-pad){d.x=t.x+t.w-pad;d.vx=-Math.abs(d.vx)*.7;hit=true}
  if(d.y<minY){d.y=minY;d.vy=Math.abs(d.vy)*.7;hit=true}if(d.y>t.y+t.h-100){d.y=t.y+t.h-100;d.vy=-Math.abs(d.vy)*.7;hit=true}
  if(hit&&Math.abs(d.vx)+Math.abs(d.vy)>150)sfx.clack();
  if(Math.random()<dt*14)d.disp=rnd6();
  if(d.rolling<=0){d.rolling=0;d.a=Math.round(d.a/(Math.PI/2))*(Math.PI/2)+(Math.random()-.5)*0.25;sfx.clack()}});
 // dice-dice separation
 for(let i=0;i<5;i++)for(let j=i+1;j<5;j++){const a=G.dice[i],b=G.dice[j];if(a.held||b.held)continue;const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||1,min=s*1.15;if(dist<min){const o=(min-dist)/2,nx=dx/dist,ny=dy/dist;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;if(a.rolling>0||b.rolling>0){const tv=a.vx;a.vx=b.vx*.8;b.vx=tv*.8}}}
 G.particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=900*dt;q.t-=dt});G.particles=G.particles.filter(q=>q.t>0&&q.y<H+20);
