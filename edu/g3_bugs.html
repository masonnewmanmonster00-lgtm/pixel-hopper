  for(let i=0;i<n;i++){const x=x0+i*(bw+10);card(x,70,bw,34,'#0004');txt(i<q.next?q.cy[2][i]:(i+1)+'. ?',x+bw/2,87,fit(i<q.next?q.cy[2][i]:'?',bw-8,13),i<q.next?'#7f7':'#9ab')}
  q.stages.forEach((st,i)=>{const x=x0+i*(bw+10),y=130,done=st.i<q.next;card(x,y,bw,110,done?'#2a5a3a':'#fdf6e3',st.bad?'#e74c3c':null);const [em,...rest]=st.s.split(' ');txt(em,x+bw/2,y+38,34);wrapC(rest.join(' '),x+bw/2,y+82,bw-12,14,done?'#cfc':'#2b1d0e');if(!done)btns.push({x,y,w:bw,h:110,f:()=>pickStage(st)})});
  txt('Keys 1-'+n+' pick a card',W/2,252,11,'#9ab');if(msg)wrapC(msg,W/2,H-30,W-40,14,msgCol);return}
 if(q.m==='label')insect(lx+30,H/2,Math.min(150,H*.42),q.part);
 else if(q.cr&&DRAWN[q.cr[1]]){DRAWN[q.cr[1]](lx,H/2-10,Math.min(110,H*.3));txt(q.cr[1],lx,H/2+70,20,'#ffcf5a')}
 else if(q.cr){txt(q.cr[0],lx,H/2-10,Math.min(110,H*.32));txt(q.cr[1],lx,H/2+70,20,'#ffcf5a')}
 else if(q.cy){txt(q.cy[2][q.cy[2].length-1].split(' ')[0],lx,H/2,100)}
 else{txt(LV[cur].k==='pol'||/pollen|bee|flower/i.test(q.text)?'🌼🐝':'🔬🐜',lx,H/2,80)}
 wrapC(q.text,px+pw/2,50,pw,16,'#fff');const two=q.opts.length===2;const bw=two?pw:(pw-10)/2,bh=44;
 q.opts.forEach((o,i)=>{const bx=px+(two?0:(i%2)*(bw+10)),by=90+(two?i:Math.floor(i/2))*(bh+10);let col='#283070';if(q.picked!=null){if(o===q.ans)col='#2a8a3a';else if(o===q.picked)col='#a33'}card(bx,by,bw,bh,col);const s=(i+1)+'  '+o;txt(s,bx+bw/2,by+bh/2,fit(s,bw-10,16));btns.push({x:bx,y:by,w:bw,h:bh,f:()=>choose(o)})});
 if(msg)wrapC(msg,px+pw/2,H-40,pw,13,msgCol)}
function pickStage(st){if(lock)return;const q=Q;if(st.i===q.next){q.next++;st.bad=0;sfx.ok();if(q.next>=q.stages.length){lock=true;msg='✔ '+q.cy[0]+': '+q.cy[2].join(' → ')+(q.cy[1]?'  (complete metamorphosis)':'  (incomplete metamorphosis)');msgCol='#7f7';draw();setTimeout(next,2000);return}msg='✔ Yes, next!';msgCol='#7f7'}else{sfx.bad();miss++;st.bad=1;msg='✘ Not that one yet. What comes after '+(q.next?q.cy[2][q.next-1]:'the start')+'?';msgCol='#f99'}draw()}
function choose(v){if(lock)return;Q.picked=v;lock=true;const ok=v===Q.ans;if(ok)sfx.ok();else{sfx.bad();miss++}msg=(ok?'✔ Correct! ':'✘ ')+(Q.why||'');msgCol=ok?'#7f7':'#f99';draw();setTimeout(next,ok?1500:3000)}
function next(){msg='';lock=false;qi++;if(qi>=NQ()){finishLevel(miss===0?3:miss<=2?2:1);return}Q=makeQ();draw()}
function onTap(x,y){hit(x,y)}
function onKey(e){const k=e.key,q=Q;if(!q||lock)return;const n=+k;if(q.opts){if(n>=1&&n<=q.opts.length)choose(q.opts[n-1]);return}if(q.stages&&n>=1&&n<=q.stages.length&&q.stages[n-1].i>=q.next)pickStage(q.stages[n-1])}
window.G={get Q(){return Q},LV};
resize();cur=0;Q=makeQ();draw();showLevels();
