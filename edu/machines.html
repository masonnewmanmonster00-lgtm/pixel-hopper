<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Simple Machines</title>
<style>
:root{--bg:#0f1530;--card:#1b2350;--ink:#f4f6ff;--mut:#9aa6d8;--acc:#ffb84d;--good:#3ddc84;--bad:#ff5c7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,#2a3480,var(--bg) 60%);color:var(--ink);min-height:100vh;user-select:none;-webkit-user-select:none;overflow-x:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0008;position:sticky;top:0;z-index:5;backdrop-filter:blur(4px)}
header a{color:var(--ink);text-decoration:none;background:#fff1;padding:6px 12px;border-radius:20px;font-weight:bold}
header h1{font-size:20px;margin:0;flex:1;color:var(--acc);text-shadow:0 2px 0 #0006}
.pill{background:#fff1;padding:5px 10px;border-radius:14px;font-size:14px}
main{max-width:980px;margin:0 auto;padding:14px}
.btn{font:inherit;font-weight:bold;border:0;border-radius:14px;padding:10px 16px;background:var(--acc);color:#111;cursor:pointer;box-shadow:0 4px 0 #0007;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}.btn.alt{background:#2c3770;color:var(--ink)}.btn.sel{outline:3px solid #fff}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 6px 18px #0005;border:2px solid #ffffff10}
.tile{cursor:pointer;transition:transform .15s}.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile .em{font-size:40px}.tile h3{margin:6px 0}.tile p{margin:0;color:var(--mut);font-size:14px}
.stars{color:#ffd34d;letter-spacing:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{min-height:28px;font-weight:bold;font-size:18px;margin:8px 0}
.opt{display:block;width:100%;margin:6px 0;text-align:left;background:#2c3770;color:var(--ink)}
.opt.ok{background:var(--good);color:#111}.opt.no{background:var(--bad)}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.12)}}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
.bar{height:10px;background:#fff2;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);transition:width .3s}
.fact{background:#ffd34d22;border-left:4px solid #ffd34d;padding:8px 12px;border-radius:8px;margin:8px 0}
svg text{font-family:inherit}
</style></head><body>
<header><a href="./index.html">← Learning Lab</a><h1>Simple Machines</h1><span class="pill" id="starTotal">⭐ 0</span><button class="btn alt" id="snd" style="padding:6px 10px">🔊</button></header>
<main id="app"></main><canvas id="fx"></canvas>
<script>
// ---- shared helpers ----
const $=s=>document.querySelector(s),app=$('#app');
const SAVEKEY='simpleMachinesSave';let SAVE=JSON.parse(localStorage.getItem(SAVEKEY)||'{}');SAVE.stars=SAVE.stars||{};SAVE.best=SAVE.best||{};
function save(){localStorage.setItem(SAVEKEY,JSON.stringify(SAVE));$('#starTotal').textContent='⭐ '+Object.values(SAVE.stars).reduce((a,b)=>a+b,0)}
let AC=null,muted=!!SAVE.muted;$('#snd').textContent=muted?'🔇':'🔊';
$('#snd').onclick=()=>{muted=!muted;SAVE.muted=muted;save();$('#snd').textContent=muted?'🔇':'🔊'};
function tone(f,d=.12,type='sine',v=.15,slide=0,delay=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d=.4,v=.2,lp=800){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=lp;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}catch(e){}}
const SFX={click:()=>tone(660,.05,'square',.06),good:()=>{tone(523,.1,'triangle');tone(784,.15,'triangle',.15,0,.08)},bad:()=>tone(200,.25,'sawtooth',.08,-80),
win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.15,0,i*.1)),pick:()=>tone(440,.06,'sine',.1,200),drop:()=>tone(330,.08,'sine',.12,-100)};
// confetti
const cv=$('#fx'),cx=cv.getContext('2d');let fxp=[];function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
function confetti(x=innerWidth/2,y=innerHeight/3,n=60){for(let i=0;i<n;i++)fxp.push({x,y,vx:(Math.random()-.5)*10,vy:-Math.random()*9-2,c:`hsl(${Math.random()*360},90%,60%)`,l:90});}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);fxp=fxp.filter(p=>p.l-->0);for(const p of fxp){p.vy+=.3;p.x+=p.vx;p.y+=p.vy;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,7,7)}requestAnimationFrame(loop)})();
function flash(el,ok){el.classList.remove('pop','shake');void el.offsetWidth;el.classList.add(ok?'pop':'shake')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function starStr(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function award(id,n){if((SAVE.stars[id]||0)<n)SAVE.stars[id]=n;save()}
// generic timed quiz: qs=[{q,opts,a,fact}] ; a is correct string
function runQuiz(id,title,qs,secs,back){let i=0,score=0,t=secs,timer;qs=shuffle(qs).slice(0,10);
 function end(){clearInterval(timer);const st=score>=9?3:score>=7?2:score>=5?1:0;award(id,st);if(score>(SAVE.best[id]||0))SAVE.best[id]=score;save();if(st)SFX.win(),confetti();
  app.innerHTML=`<div class="card" style="text-align:center"><h2>${title} — done!</h2><div style="font-size:48px" class="stars">${starStr(st)}</div><p>You got <b>${score}/${qs.length}</b>. Best: ${SAVE.best[id]}</p><div class="row" style="justify-content:center"><button class="btn" id="ag">Play again</button><button class="btn alt" id="bk">Back</button></div></div>`;$('#ag').onclick=()=>runQuiz(id,title,qs,secs,back);$('#bk').onclick=back}
 function show(){if(i>=qs.length)return end();const q=qs[i];app.innerHTML=`<div class="card"><div class="row"><b style="flex:1">${title} · Q${i+1}/${qs.length}</b>${secs?`<span class="pill">⏱ <span id="tm">${t}</span>s</span>`:''}<span class="pill">✅ ${score}</span></div><div class="bar" style="margin:8px 0"><i style="width:${i/qs.length*100}%"></i></div>${q.svg||''}<h2>${q.q}</h2><div id="os"></div><div class="fb" id="fb"></div></div>`;
  shuffle(q.opts).forEach(o=>{const b=document.createElement('button');b.className='btn opt';b.innerHTML=o;b.onclick=()=>{if(b.parentNode.dataset.done)return;b.parentNode.dataset.done=1;const ok=o==q.a;if(ok){score++;SFX.good();confetti(innerWidth/2,innerHeight/2,20)}else SFX.bad();[...$('#os').children].forEach(x=>{if(x.innerHTML==q.a)x.classList.add('ok')});if(!ok)b.classList.add('no');flash(b,ok);$('#fb').innerHTML=(ok?'✅ Correct! ':'❌ Not quite. ')+(q.fact?`<div class="fact">💡 ${q.fact}</div>`:'');setTimeout(()=>{i++;show()},q.fact?2200:1100)};$('#os').appendChild(b)})}
 if(secs)timer=setInterval(()=>{t--;const e=$('#tm');if(e)e.textContent=t;if(t<=5&&t>0)tone(880,.05);if(t<=0)end()},1000);show()}
save();
</script>
<script>
const MACH=[
{k:'lever',em:'⚖️',n:'Lever',d:'A stiff bar that turns on a pivot called the <b>fulcrum</b>. Push down on one end and the other end lifts.',f:'Mechanical advantage = effort arm ÷ load arm. Put the fulcrum close to the load and a small push lifts a big weight!',ex:'Seesaw, crowbar, wheelbarrow, scissors, tweezers',x:'There are 3 classes: 1st class has the fulcrum in the middle (seesaw), 2nd class has the load in the middle (wheelbarrow), 3rd class has the effort in the middle (tweezers, fishing rod).'},
{k:'pulley',em:'🏗️',n:'Pulley',d:'A wheel with a groove that holds a rope. A <b>fixed</b> pulley changes the direction of your pull.',f:'Each rope segment holding up a movable pulley shares the load. 4 supporting ropes = you pull with ¼ of the force, but you pull 4× as much rope.',ex:'Flagpole, cranes, window blinds, elevators',x:'A pulley system with several wheels is called a block and tackle.'},
{k:'ramp',em:'📐',n:'Inclined plane (ramp)',d:'A flat sloping surface. Pushing something up a ramp takes less force than lifting it straight up.',f:'Mechanical advantage = ramp length ÷ ramp height. A longer, gentler ramp needs less force, but you travel farther.',ex:'Wheelchair ramps, slides, loading ramps, mountain roads',x:'It is the only simple machine that does not move itself!'},
{k:'wheel',em:'🛞',n:'Wheel and axle',d:'A big wheel fixed to a smaller rod (the axle) so they turn together.',f:'Mechanical advantage = wheel radius ÷ axle radius. Turning the big wheel makes the axle turn with more force.',ex:'Doorknob, steering wheel, screwdriver handle, pencil sharpener',x:'Without a doorknob, turning the thin latch rod with your fingers would be really hard.'},
{k:'gear',em:'⚙️',n:'Gears',d:'Wheels with teeth that mesh together. When one turns, the other turns the opposite way.',f:'A small gear driving a big gear: the big one turns slower but with more turning force. Big driving small: faster but weaker.',ex:'Bicycles, clocks, mixers, car gearboxes',x:'Speed ratio = driver teeth ÷ driven teeth.'},
{k:'wedge',em:'🪓',n:'Wedge',d:'Two ramps back-to-back with a sharp edge. It turns a push into a sideways force that splits things apart.',f:'A thinner, longer wedge splits more easily (more mechanical advantage).',ex:'Axe, knife, doorstop, zipper, your front teeth',x:'A zipper uses little wedges to open and close the teeth.'},
{k:'screw',em:'🔩',n:'Screw',d:'An inclined plane wrapped around a rod. The spiral ridge is called the <b>thread</b>.',f:'Each turn moves the screw forward only a little, so a small turning force makes a big pushing force.',ex:'Screws, bolts, jar lids, light bulbs, corkscrews',x:'Archimedes used a giant screw to lift water more than 2,000 years ago.'}];
// levels: type, params; slider value v
const LV=[
{t:'lever',W:60,S:30,n:'Lift the rock',h:'Slide the fulcrum toward the rock.'},
{t:'lever',W:100,S:25,n:'Heavy crate'},
{t:'lever',W:150,S:30,n:'Boulder!'},
{t:'lever',W:200,S:25,n:'Baby elephant'},
{t:'pulley',W:80,S:45,n:'Flag the crate',h:'More supporting ropes = less force. Use the fewest ropes you can!'},
{t:'pulley',W:150,S:40,n:'Piano lift'},
{t:'pulley',W:300,S:55,n:'Car engine'},
{t:'ramp',W:100,S:40,H:2,n:'Barrel up the ramp',h:'Longer ramp = less force. Use the shortest ramp that works!'},
{t:'ramp',W:200,S:50,H:3,n:'Fridge to the truck'},
{t:'ramp',W:300,S:45,H:2,n:'Statue to the stage'},
{t:'gear',in:60,dr:12,goal:30,n:'Slow it down',h:'Driven gear speed = 60 × 12 ÷ its teeth.'},
{t:'gear',in:60,dr:12,goal:120,n:'Speed it up'},
{t:'gear',in:60,dr:12,goal:20,n:'Clock gear'},
{t:'wheel',W:120,S:20,ax:1,n:'Wind the well bucket',h:'Pick a crank (wheel) big enough: force = load × axle ÷ wheel.'},
{t:'wheel',W:200,S:25,ax:1,n:'Ship anchor winch'}];
LV.forEach((l,i)=>l.id='L'+i);
function rng(l){return l.t=='lever'?[1,9,1]:l.t=='pulley'?[1,6,1]:l.t=='ramp'?[l.H,15,1]:l.t=='gear'?[6,48,6]:[1,12,1]}
function evalL(l,v){// returns {ok, force, best}
 if(l.t=='lever'){const F=l.W*v/(10-v);return{F,ok:F<=l.S+1e-9,best:bestOf(l)}}
 if(l.t=='pulley'){const F=l.W/v;return{F,ok:F<=l.S+1e-9,best:bestOf(l)}}
 if(l.t=='ramp'){const F=l.W*l.H/v;return{F,ok:F<=l.S+1e-9,best:bestOf(l)}}
 if(l.t=='wheel'){const F=l.W*l.ax/v;return{F,ok:F<=l.S+1e-9,best:bestOf(l)}}
 const o=l.in*l.dr/v;return{F:o,ok:Math.abs(o-l.goal)<1e-6,best:l.in*l.dr/l.goal}}
function bestOf(l){const[a,b,s]=rng(l);let best=null;for(let v=a;v<=b;v+=s){const ok=evalPlain(l,v);if(ok){if(l.t=='lever'){best=v}else if(best==null)best=v}}return best}
function evalPlain(l,v){if(l.t=='lever')return l.W*v/(10-v)<=l.S+1e-9;if(l.t=='pulley')return l.W/v<=l.S+1e-9;if(l.t=='ramp')return l.W*l.H/v<=l.S+1e-9;if(l.t=='wheel')return l.W*l.ax/v<=l.S+1e-9;return false}
function menu(){const tot=LV.length*3,got=LV.reduce((a,l)=>a+(SAVE.stars[l.id]||0),0);
 app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:54px">⚙️🏗️⚖️</div><h2 style="margin:4px">Simple Machines</h2><p style="color:var(--mut)">Six simple machines (plus gears!) let people lift huge loads with small forces. Learn how, then solve physics puzzles.</p><div class="bar"><i style="width:${got/tot*100}%"></i></div><p class="stars">${got}/${tot} ★</p></div>
 <div class="grid" style="margin-top:12px">
 <div class="card tile" id="mLearn"><div class="em">📖</div><h3>Learn</h3><p>Meet all 7 machines with examples.</p></div>
 <div class="card tile" id="mPuz"><div class="em">🧩</div><h3>Puzzles</h3><p>15 lifting puzzles: levers, pulleys, ramps, gears, cranks.</p></div>
 <div class="card tile" id="mQuiz"><div class="em">❓</div><h3>Quiz</h3><p>10 questions. ${starStr(SAVE.stars.quiz||0)}</p></div>
 <div class="card tile" id="mTime"><div class="em">⏱️</div><h3>Timed challenge</h3><p>Beat the 60 s clock. ${starStr(SAVE.stars.timed||0)}</p></div></div>`;
 $('#mLearn').onclick=()=>{SFX.click();learn(0)};$('#mPuz').onclick=()=>{SFX.click();levels()};$('#mQuiz').onclick=()=>{SFX.click();runQuiz('quiz','Machines Quiz',QS,0,menu)};$('#mTime').onclick=()=>{SFX.click();runQuiz('timed','Timed Challenge',QS,60,menu)}}
function learn(i){const m=MACH[i];SAVE.seen=SAVE.seen||{};SAVE.seen[m.k]=1;save();
 app.innerHTML=`<div class="card"><div class="row"><b style="flex:1">Machine ${i+1} of ${MACH.length}</b><button class="btn alt" id="bk">Menu</button></div>
 <div style="text-align:center"><canvas id="lc" width="420" height="200" style="max-width:100%;background:#0b1028;border-radius:14px"></canvas></div>
 <h2>${m.em} ${m.n}</h2><p>${m.d}</p><div class="fact">💡 ${m.f}</div><p><b>Examples:</b> ${m.ex}</p><p style="color:var(--mut)">${m.x}</p>
 <div class="row"><button class="btn alt" id="pv" ${i?'':'disabled'}>← Prev</button><span style="flex:1"></span><button class="btn" id="nx">${i<MACH.length-1?'Next →':'Done ✓'}</button></div></div>`;
 $('#bk').onclick=menu;$('#pv').onclick=()=>{SFX.click();learn(i-1)};$('#nx').onclick=()=>{SFX.click();if(i<MACH.length-1)learn(i+1);else{SFX.win();confetti();menu()}};
 animDemo($('#lc'),m.k)}
let demoRAF=0;
function animDemo(c,k){cancelAnimationFrame(demoRAF);const g=c.getContext('2d');let t0=performance.now();
 (function f(now){if(!c.isConnected)return;const t=(now-t0)/1000,s=(Math.sin(t*2)+1)/2;g.clearRect(0,0,420,200);g.lineWidth=4;g.strokeStyle='#cfd6ff';g.fillStyle='#cfd6ff';
  g.fillStyle='#2b3570';g.fillRect(0,178,420,22);
  if(k=='lever'){const a=(s-.5)*.35;g.save();g.translate(210,140);g.rotate(a);g.fillStyle='#c8914a';g.fillRect(-170,-6,340,12);g.fillStyle='#8a8f9e';g.fillRect(-160,-46,50,40);g.restore();tri(g,210,140,178);txt(g,'fulcrum',210,196)}
  if(k=='pulley'){g.beginPath();g.arc(210,40,22,0,7);g.stroke();line(g,188,40,188,60+s*80);line(g,232,40,232,150-s*80);g.fillStyle='#8a8f9e';g.fillRect(208,150-s*80,48,34);txt(g,'pull ↓',188,80+s*80)}
  if(k=='ramp'){g.fillStyle='#c8914a';g.beginPath();g.moveTo(40,178);g.lineTo(380,178);g.lineTo(380,70);g.closePath();g.fill();const x=60+s*290,y=178-(x-40)*108/340;g.save();g.translate(x,y);g.rotate(-Math.atan2(108,340));g.fillStyle='#ff9a4d';g.fillRect(-16,-30,32,30);g.restore()}
  if(k=='wheel'){g.save();g.translate(210,100);g.rotate(t*1.5);g.beginPath();g.arc(0,0,70,0,7);g.stroke();for(let i=0;i<6;i++){g.rotate(Math.PI/3);line(g,0,0,70,0)}g.fillStyle='#ff9a4d';g.beginPath();g.arc(0,0,14,0,7);g.fill();g.restore();txt(g,'big wheel turns small axle',210,196)}
  if(k=='gear'){gearD(g,150,100,60,16,t);gearD(g,262,100,30,8,-t*2-Math.PI/8);txt(g,'small gear spins 2× faster',210,196)}
  if(k=='wedge'){g.fillStyle='#8a5a2e';g.fillRect(60,90,300,70);const x=130+s*30;g.fillStyle='#cfd6ff';g.beginPath();g.moveTo(x,20);g.lineTo(x+40,20);g.lineTo(x+20,90+s*50);g.fill();g.strokeStyle='#111';line(g,x+20,90+s*50,x+20+s*120,125)}
  if(k=='screw'){g.save();g.translate(210,100);g.fillStyle='#8a8f9e';g.fillRect(-150,-14,300,28);g.strokeStyle='#e4e8ff';for(let i=-150;i<150;i+=18){const o=(t*30)%18;line(g,i+o,-18,i+o+10,18)}g.restore()}
  demoRAF=requestAnimationFrame(f)})(t0)}
function line(g,a,b,c,d){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()}
function tri(g,x,y,b){g.fillStyle='#ff9a4d';g.beginPath();g.moveTo(x,y);g.lineTo(x-22,b);g.lineTo(x+22,b);g.fill()}
let FS=14;function txt(g,s,x,y,c='#e4e8ff',sz=FS){g.fillStyle=c;g.font=`bold ${sz}px Trebuchet MS`;g.textAlign='center';g.fillText(s,x,y)}
function gearD(g,x,y,r,n,a){g.save();g.translate(x,y);g.rotate(a);g.fillStyle='#ffb36b';g.beginPath();for(let i=0;i<n*2;i++){const ang=i*Math.PI/n,rr=i%2?r:r+10;g.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr);g.lineTo(Math.cos(ang+Math.PI/n)*rr,Math.sin(ang+Math.PI/n)*rr)}g.closePath();g.fill();g.fillStyle='#0b1028';g.beginPath();g.arc(0,0,r*.25,0,7);g.fill();g.restore()}
function levels(){app.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1;margin:0">🧩 Puzzles</h2><button class="btn alt" id="bk">Menu</button></div><p style="color:var(--mut)">Each puzzle unlocks the next. Get ★★★ by finding the <b>best</b> setting.</p><div class="grid" id="lg"></div></div>`;$('#bk').onclick=menu;
 LV.forEach((l,i)=>{const lock=i>0&&!SAVE.stars[LV[i-1].id];const d=document.createElement('div');d.className='card tile';d.style.opacity=lock?.45:1;const m=MACH.find(m=>m.k==l.t);d.innerHTML=`<div class="em">${lock?'🔒':m.em}</div><h3>${i+1}. ${l.n}</h3><p>${m.n}</p><div class="stars">${starStr(SAVE.stars[l.id]||0)}</div>`;d.onclick=()=>{if(lock){SFX.bad();flash(d,0);return}SFX.click();play(i)};$('#lg').appendChild(d)})}
let anim=null;
function play(i){const l=LV[i],[a,b,s]=rng(l);let v=l.t=='lever'?5:l.t=='gear'?24:a,tries=0,solved=false,lift=0;
 const unit=l.t=='gear'?'teeth':l.t=='lever'?'m from rock':l.t=='pulley'?'ropes':l.t=='ramp'?'m long':'× axle size';
 const goal=l.t=='gear'?`Make the output gear turn at <b>${l.goal} rpm</b>. The driver has ${l.dr} teeth and spins at ${l.in} rpm.`:`Load: <b>${l.W} kg</b>. Your helper can push/pull with a force of <b>${l.S} kg</b>.${l.t=='ramp'?` Truck height: ${l.H} m.`:''}`;
 app.innerHTML=`<div class="card"><div class="row"><b style="flex:1">Puzzle ${i+1}: ${l.n}</b><span class="pill">Tries: <span id="tr">0</span></span><button class="btn alt" id="bk">Levels</button></div>
 <p>${goal}</p>${l.h?`<div class="fact">💡 ${l.h}</div>`:''}
 <canvas id="pc" width="900" height="360" style="width:100%;background:linear-gradient(#1b2a66,#0b1028);border-radius:14px;touch-action:none"></canvas>
 <div class="row" style="margin:8px 0"><button class="btn alt" id="mi">−</button><input type="range" id="sl" min="${a}" max="${b}" step="${s}" value="${v}" style="flex:1;accent-color:var(--acc);height:30px"><button class="btn alt" id="pl">+</button><span class="pill" style="min-width:120px;text-align:center"><b id="vv"></b> ${unit}</span></div>
 <div class="row"><span id="force" class="pill"></span><span style="flex:1"></span><button class="btn" id="go">▶ Test it!</button></div><div class="fb" id="fb"></div></div>`;
 const c=$('#pc'),g=c.getContext('2d');FS=Math.max(14,Math.round(900/c.clientWidth*11));$('#bk').onclick=()=>{cancelAnimationFrame(anim);levels()};
 const upd=()=>{$('#vv').textContent=v;$('#sl').value=v;const e=evalL(l,v);$('#force').innerHTML=l.t=='gear'?`Output: <b>${+e.F.toFixed(1)} rpm</b>`:`Force needed: <b>${+e.F.toFixed(1)} kg</b> (MA ${+(l.W/e.F).toFixed(2)})`};
 $('#sl').oninput=e=>{v=+e.target.value;lift=0;solved=false;SFX.pick();upd()};$('#mi').onclick=()=>{v=Math.max(a,v-s);lift=0;solved=false;SFX.pick();upd()};$('#pl').onclick=()=>{v=Math.min(b,v+s);lift=0;solved=false;SFX.pick();upd()};
 // drag on canvas also sets value horizontally
 c.onpointerdown=c.onpointermove=e=>{if(e.type=='pointermove'&&!e.buttons)return;const r=c.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width;v=Math.round((a+fx*(b-a))/s)*s;v=Math.max(a,Math.min(b,v));lift=0;solved=false;upd()};
 $('#go').onclick=()=>{if(solved)return;tries++;$('#tr').textContent=tries;const e=evalL(l,v);
  if(e.ok){solved=true;const best=v==e.best;const st=best?(tries<=2?3:2):1;award(l.id,st);SFX.win();confetti();
   $('#fb').innerHTML=`<div class="pop">🎉 It works! ${'★'.repeat(st)}${'☆'.repeat(3-st)} ${best?'Best possible setting!':'It worked, but there is a better setting. Can you find it?'}</div><div class="fact">💡 ${explain(l,v)}</div><div class="row">${i<LV.length-1?'<button class="btn" id="nx">Next puzzle →</button>':''}<button class="btn alt" id="rt">Try again</button></div>`;
   if($('#nx'))$('#nx').onclick=()=>play(i+1);$('#rt').onclick=()=>play(i)}
  else{SFX.bad();flash($('#pc'),0);lift=-1;$('#fb').innerHTML=`❌ ${l.t=='gear'?`Output is ${+e.F.toFixed(1)} rpm, not ${l.goal}.`:`Too heavy! That needs ${+e.F.toFixed(1)} kg of force but your helper only has ${l.S} kg.`}`}};
 upd();const t0=performance.now();
 (function draw(now){if(!c.isConnected)return;const t=(now-t0)/1000;g.clearRect(0,0,900,360);if(solved)lift=Math.min(1,lift+.015);
  g.fillStyle='#2b3570';g.fillRect(0,330,900,30);const wob=lift<0?Math.sin(t*30)*3:0;
  if(l.t=='lever'){const L=700,x0=100,fx=x0+v/10*L,ang=solved?lift*Math.min(.25,50/((10-v)*70)):0+wob*.01;tri(g,fx,272,330);g.save();g.translate(fx,272);g.rotate(ang);g.fillStyle='#c8914a';g.fillRect(-(fx-x0),-8,L,14);
    rock(g,-(fx-x0)+40,-8,l.W);g.fillStyle='#ffd34d';g.fillRect(L-(fx-x0)-50,-60,30,52);txt(g,'👇',L-(fx-x0)-35,-66,'#fff',26);g.restore();txt(g,`${v} m`,(x0+fx)/2,320);txt(g,`${10-v} m`,(fx+x0+L)/2,320)}
  if(l.t=='pulley'){const top=40,ly=280-lift*160;g.fillStyle='#555d80';g.fillRect(250,20,400,20);const n=v,xs=[];for(let k=0;k<n;k++)xs.push(330+k*(240/Math.max(1,n-1||1)));
    g.strokeStyle='#e4d6a8';g.lineWidth=3;for(let k=0;k<n;k++){const x=n==1?450:xs[k];line(g,x,top,x,ly-10)}g.strokeStyle='#cfd6ff';g.lineWidth=4;
    if(n>1){g.beginPath();g.arc(450,ly-10,22,0,7);g.stroke()}g.beginPath();g.arc(n==1?450:xs[n-1],top+12,14,0,7);g.stroke();
    g.strokeStyle='#e4d6a8';g.lineWidth=3;line(g,700,top+12,700,250+lift*60);line(g,(n==1?450:xs[n-1])+14,top+12,700,top+12);g.fillStyle='#ffd34d';g.fillRect(684,250+lift*60,32,40);
    rock(g,400,ly+10,l.W,100);txt(g,`${n} supporting rope${n>1?'s':''}`,450,355);txt(g,`pull ${n}× rope`,700,240+lift*60)}
  if(l.t=='ramp'||l.t=='wheel'&&0){}
  if(l.t=='ramp'){const H=l.H*60,Lpx=Math.min(760,Math.sqrt(Math.max(1,v*v-l.H*l.H))*48+40);const xr=840,xl=xr-Lpx;g.fillStyle='#6a7090';g.fillRect(xr,330-H,60,H);g.fillStyle='#c8914a';g.beginPath();g.moveTo(xl,330);g.lineTo(xr,330-H);g.lineTo(xr,330);g.fill();
    const p=solved?lift:0,bx=xl+p*Lpx,by=330-p*H;g.save();g.translate(bx,by);g.rotate(-Math.atan2(H,Lpx));rock(g,-10,0,l.W,60);g.restore();txt(g,`ramp ${v} m`,xl+Lpx/2,355);txt(g,`${l.H} m`,xr+30,320-H)}
  if(l.t=='wheel'){const r=Math.min(150,20+v*12);g.save();g.translate(300,170);g.rotate(solved?lift*12:wob*.02);g.strokeStyle='#ffb36b';g.lineWidth=6;g.beginPath();g.arc(0,0,r,0,7);g.stroke();for(let k=0;k<4;k++){g.rotate(Math.PI/2);line(g,0,0,r,0)}g.fillStyle='#cfd6ff';g.beginPath();g.arc(0,0,12,0,7);g.fill();g.restore();
    g.strokeStyle='#e4d6a8';g.lineWidth=3;line(g,312,170,600,170);line(g,600,170,600,250-lift*120);rock(g,560,260-lift*120,l.W,80);g.fillStyle='#555d80';g.fillRect(560,330-40,80,40);txt(g,`wheel ${v}× bigger than axle`,300,355)}
  if(l.t=='gear'){const n=v,r2=n*3.2+8,r1=l.dr*3.2+8;const out=l.in*l.dr/n;gearD(g,300,170,r1,l.dr,t*l.in/60*2);gearD(g,300+r1+r2+10,170,r2,n,-t*out/60*2+Math.PI/n);txt(g,`${l.dr} teeth · ${l.in} rpm`,300,355);txt(g,`${n} teeth`,300+r1+r2+10,355)}
  anim=requestAnimationFrame(draw)})(t0)}
function rock(g,x,y,W,w=80){const h=Math.min(90,30+W/5);g.fillStyle='#8a8f9e';g.beginPath();g.ellipse(x+w/2,y-h/2,w/2,h/2,0,0,7);g.fill();g.fillStyle='#fff';g.font='bold 15px Trebuchet MS';g.textAlign='center';g.fillText(W+' kg',x+w/2,y-h/2+5)}
function explain(l,v){if(l.t=='lever')return`The effort arm (${10-v} m) is ${+((10-v)/v).toFixed(2)}× the load arm (${v} m), so the force shrinks to ${+(l.W*v/(10-v)).toFixed(1)} kg. The trade-off: your end moves farther.`;
 if(l.t=='pulley')return`${v} ropes share ${l.W} kg, so each pull is ${+(l.W/v).toFixed(1)} kg. But you pull ${v} m of rope to raise the load 1 m. Work stays the same!`;
 if(l.t=='ramp')return`MA = length ÷ height = ${v} ÷ ${l.H} = ${+(v/l.H).toFixed(2)}. Less force, longer distance.`;
 if(l.t=='wheel')return`A crank ${v}× the axle size gives MA ${v}: ${l.W} ÷ ${v} = ${+(l.W/v).toFixed(1)} kg.`;
 return`${l.in} × ${l.dr} ÷ ${v} = ${l.goal} rpm. ${v>l.dr?'A bigger driven gear turns slower but stronger.':'A smaller driven gear turns faster but weaker.'}`}
