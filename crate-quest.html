<script>
'use strict';
const LEVELS=["#####\n#@$.#\n#####", "######\n#    #\n#@$ .#\n#    #\n######", "#######\n#     #\n# $ $ #\n#@ ..##\n#######", "########\n#      #\n# .**  #\n#  $@  #\n#      #\n########", "######\n#.   #\n#$## #\n#  $.#\n# @  #\n######", "######\n#  . #\n# $$ #\n#.@  #\n######", "  #####\n###.  #\n#  $# #\n# $ . #\n#  #@ #\n#######", "  #####\n  #.  #\n###$# #\n# @ $.#\n#  $  #\n#.  ###\n#####", "#####\n#   ##\n# $  #\n## $ #\n #.. #\n # @ #\n #####", "#######\n#  #  #\n# $ $ #\n#. @ .#\n#######", "#######\n#  .  #\n# $$$ #\n#. @ .#\n#######", "#######\n#.    #\n#  $$ #\n##.#  #\n #  $.#\n # @  #\n ######", " #######\n #     #\n # $*$ #\n## .@. #\n#  $#  #\n#  .   #\n########", " #####\n##   ##\n# $.$ #\n#  @  #\n# .$. #\n##   ##\n #####", "  ####\n  #  #\n###$ ###\n#  .@. #\n#  $   #\n####  ##\n   ####", "########\n#  ..  #\n# $##$ #\n#   @  #\n########", "#######\n#.  ..#\n#$$ $ #\n# @   #\n#######", "######\n#    #\n# #$ #\n# $ .#\n#..$@#\n######", "#######\n#.  ..#\n# $$  #\n#  #$ #\n#   @ #\n#######", "########\n#  #   #\n# $  $ #\n# .##. #\n#   @  #\n#  $.  #\n########", "  ####\n###  #\n# $  #\n# .$ ##\n##.@ .#\n # $  #\n #   ##\n #####", "########\n#  .   #\n#  ##$ #\n#.$ @  #\n#  ##$ #\n#  .   #\n########", "#######\n#..   #\n#.$$$ #\n#  @  #\n#######", " ######\n##    #\n#  #$ #\n# *.  #\n# $ . #\n## @  #\n ######", " ######\n #    #\n##$## #\n#  .  #\n# $.# #\n#  @  #\n#######", "#########\n#   #   #\n# $ . $ #\n#  #@#  #\n# $ . . #\n#   #   #\n#########", "#######\n#  .  #\n# #$# #\n# $@. #\n#.$#  #\n#     #\n#######", "########\n#  .   #\n# $#$  #\n#.  @ .#\n# $##  #\n#      #\n########", "########\n#.  #  #\n#.$ $  #\n#  #  @#\n## $   #\n #.  ###\n #####", "#########\n#   .   #\n# $ # $ #\n#  .@.  #\n# $ # $ #\n#   .   #\n#########", "  #####\n###   #\n#.@$  #\n### $.#\n#.##$ #\n# # . ##\n#$ *$$.#\n#   .  #\n########", "   ####\n####  #\n#  $  #\n# .#$ #\n#.@ . #\n# $## #\n#     #\n#######", "########\n##  .  #\n#  $#$ #\n# .@ ..#\n#  $#  #\n### $  #\n  #    #\n  ######", "#########\n#.  #  .#\n# $   $ #\n## #@# ##\n# $   $ #\n#.  #  .#\n#########", " ####\n #  ###\n #@$  #\n### # ##\n#.# #  #\n#.$  # #\n#.   $ #\n########"];
const PAR=[1, 2, 8, 4, 5, 6, 8, 10, 11, 11, 11, 12, 12, 13, 14, 14, 14, 16, 17, 17, 18, 18, 18, 21, 22, 22, 25, 26, 29, 33, 34, 36, 36, 44, 51];
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
// audio
let AC=null,muted=store.get('cq_mute',false);
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type,vol,slide,delay){if(muted||!AC)return;try{const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,vol,fq){if(muted||!AC)return;try{const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fq||800;const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}catch(e){}}
const SFX={step(){tone(220+Math.random()*30,.05,'triangle',.05)},push(){noise(.12,.25,500);tone(110,.1,'sine',.08)},bump(){tone(90,.08,'square',.05)},goal(){tone(880,.12,'triangle',.1);tone(1320,.18,'triangle',.08,0,.07)},undo(){tone(500,.08,'sine',.07,300)},win(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,.3,'triangle',.11,0,i*.09))},ui(){tone(660,.05,'sine',.07)}};
function setMute(m){muted=m;store.set('cq_mute',m);$('mute').textContent=m?'🔇':'🔊'}setMute(muted);
$('mute').onclick=()=>{ac();setMute(!muted)};
// progress
let prog=store.get('cq_prog',{done:{},best:{},cur:0});if(!prog.done)prog={done:{},best:{},cur:0};
function saveProg(){store.set('cq_prog',prog);const n=Object.keys(prog.done||{}).length;if(n>0)try{localStorage.setItem('arcade-crateq-best',String(n))}catch(e){}}
// level state
let L,lvI=0,walls,goals,boxes,pl,W,H,moves,pushes,hist,anim=null,queue=[],face='d',won=false,boxAnim={},particles=[],shake=0;
function load(i){lvI=i;prog.cur=i;saveProg();const rows=LEVELS[i].split('\n');H=rows.length;W=Math.max(...rows.map(r=>r.length));walls=new Set();goals=new Set();boxes=[];
 // floor via flood fill from player
 rows.forEach((r,y)=>[...r].forEach((c,x)=>{if(c==='#')walls.add(x+','+y);if('.*+'.includes(c))goals.add(x+','+y);if('$*'.includes(c))boxes.push({x,y,dx:x,dy:y});if('@+'.includes(c))pl={x,y,dx:x,dy:y}}));
 floor=new Set();const st=[[pl.x,pl.y]];while(st.length){const[x,y]=st.pop(),k=x+','+y;if(floor.has(k)||walls.has(k)||x<0||y<0||x>=W||y>=H)continue;floor.add(k);st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1])}
 moves=0;pushes=0;hist=[];queue=[];anim=null;won=false;face='d';particles=[];hud();resize()}
let floor=new Set();
function boxAt(x,y){return boxes.find(b=>b.x===x&&b.y===y)}
const DIRS={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
function tryMove(d){if(won)return;const[dx,dy]=DIRS[d];face=d;const nx=pl.x+dx,ny=pl.y+dy;if(walls.has(nx+','+ny)){SFX.bump();shake=4;return}
 const b=boxAt(nx,ny);if(b){const bx=nx+dx,by=ny+dy;if(walls.has(bx+','+by)||boxAt(bx,by)){SFX.bump();shake=4;return}
  hist.push({p:[pl.x,pl.y],b:boxes.indexOf(b),bp:[b.x,b.y]});b.x=bx;b.y=by;pushes++;SFX.push();if(goals.has(bx+','+by)){SFX.goal();burst(bx,by)}}
 else{hist.push({p:[pl.x,pl.y],b:-1});SFX.step()}
 pl.x=nx;pl.y=ny;moves++;anim={t:0};hud();checkWin()}
function undo(){if(!hist.length||won)return;const h=hist.pop();pl.x=h.p[0];pl.y=h.p[1];if(h.b>=0){const b=boxes[h.b];b.x=h.bp[0];b.y=h.bp[1];pushes--}moves--;queue=[];SFX.undo();hud()}
function restart(){load(lvI);SFX.undo()}
function checkWin(){if(boxes.every(b=>goals.has(b.x+','+b.y))){won=true;queue=[];const prev=prog.best[lvI];const nb=!prev||moves<prev;if(nb)prog.best[lvI]=moves;prog.done[lvI]=1;saveProg();
 const wl=lvI;setTimeout(()=>{if(!won||lvI!==wl)return;SFX.win();for(const b of boxes)burst(b.x,b.y,20);const perfect=moves<=PAR[lvI];$('winIc').textContent=perfect?'🌟':'🏆';$('winT').textContent=lvI===LEVELS.length-1?'You beat every level!':'Level '+(lvI+1)+' Complete!';
 $('winS').innerHTML=`Moves: <b>${moves}</b> · Pushes: <b>${pushes}</b><br>Best: <b>${prog.best[lvI]}</b>${nb&&prev?' <span style="color:#9bd36a">NEW BEST!</span>':''} · Perfect: ${PAR[lvI]}${perfect?' <span style="color:#ffcf73">★ PERFECT</span>':''}`;$('bNext').classList.toggle('hide',lvI===LEVELS.length-1);$('win').classList.remove('hide')},450)}}
function hud(){$('lvT').textContent='LEVEL '+(lvI+1)+' / '+LEVELS.length;const b=prog.best[lvI];const on=boxes.filter(x=>goals.has(x.x+','+x.y)).length;$('stats').textContent='Moves '+moves+' · Pushes '+pushes+' · 📦 '+on+'/'+boxes.length+(b?' · Best '+b:'')}
// input
function input(d){ac();if(!$('title').classList.contains('hide')||!$('sel').classList.contains('hide')||!$('win').classList.contains('hide'))return;if(queue.length<3)queue.push(d)}
const KM={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',KeyW:'u',KeyS:'d',KeyA:'l',KeyD:'r'};
addEventListener('keydown',e=>{if(KM[e.code]){e.preventDefault();input(KM[e.code])}else if(e.code==='KeyZ'||e.code==='KeyU'||e.code==='Backspace'){e.preventDefault();ac();undo()}else if(e.code==='KeyR'){ac();restart()}else if(e.code==='Enter'&&!$('win').classList.contains('hide')){next()}});
let sw=null;
$('cv').addEventListener('touchstart',e=>{const t=e.touches[0];sw={x:t.clientX,y:t.clientY}},{passive:true});
$('cv').addEventListener('touchmove',e=>{if(!sw)return;const t=e.touches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;if(Math.max(Math.abs(dx),Math.abs(dy))>28){input(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));sw={x:t.clientX,y:t.clientY}}},{passive:true});
$('cv').addEventListener('touchend',()=>sw=null);
let rep=null;document.querySelectorAll('#dpad button').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();input(b.dataset.d);clearInterval(rep);const t=setTimeout(()=>{rep=setInterval(()=>input(b.dataset.d),140)},320);rep=t;b._t=t});const stop=()=>{clearTimeout(b._t);clearInterval(rep)};b.addEventListener('pointerup',stop);b.addEventListener('pointerleave',stop);b.addEventListener('pointercancel',stop)});
const isTouch='ontouchstart' in window||navigator.maxTouchPoints>0;if(isTouch){$('dpad').style.display='block';$('bar').classList.add('touch')}
$('bUndo').onclick=()=>{ac();undo()};$('bRst').onclick=()=>{ac();restart()};
// screens
function show(id){['title','sel','win'].forEach(s=>$(s).classList.toggle('hide',s!==id))}
function progTxt(){const c=Object.keys(prog.done).length;$('prog').textContent=c?c+' / '+LEVELS.length+' levels solved':''}
function buildSel(){let h='';LEVELS.forEach((_,i)=>{const ok=isUnlocked(i);h+=`<div class="lv ${prog.done[i]?'done':''} ${ok?'':'lock'} ${i===lvI?'cur':''}" data-i="${i}">${ok?i+1:'🔒'}${prog.best[i]?'<small>'+prog.best[i]+(prog.best[i]<=PAR[i]?' ★':'')+'</small>':''}</div>`});$('grid').innerHTML=h}
function isUnlocked(i){if(i<3)return true;let maxDone=-1;for(const k in prog.done)maxDone=Math.max(maxDone,+k);return i<=maxDone+3||!!prog.done[i]}
$('grid').onclick=e=>{const t=e.target.closest('.lv');if(!t||t.classList.contains('lock'))return;ac();SFX.ui();load(+t.dataset.i);show(null)};
$('bPlay').onclick=()=>{ac();SFX.ui();let i=prog.cur||0;if(prog.done[i]){for(let k=0;k<LEVELS.length;k++)if(!prog.done[k]){i=k;break}}load(i);show(null)};
$('bSel').onclick=()=>{ac();SFX.ui();buildSel();show('sel')};$('bLv').onclick=()=>{ac();SFX.ui();buildSel();show('sel')};
$('selBack').onclick=()=>{SFX.ui();show(won||moves?null:'title');if(!won&&!moves&&$('title').classList.contains('hide'))show(null)};
function next(){SFX.ui();if(lvI<LEVELS.length-1)load(lvI+1);show(null)}
$('bNext').onclick=next;$('bAgain').onclick=()=>{load(lvI);show(null)};$('bWinSel').onclick=()=>{buildSel();show('sel')};
// render
const cv=$('cv'),cx=cv.getContext('2d');let T=48,ox=0,oy=0;
function resize(){const dpr=devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';cx.setTransform(dpr,0,0,dpr,0,0);
 const top=100,bot=isTouch?(innerWidth<innerHeight?190:70):70;const aw=innerWidth-(isTouch&&innerWidth>innerHeight?190:20),ah=innerHeight-top-bot;T=Math.max(16,Math.min(64,Math.floor(Math.min(aw/W,ah/H))));ox=Math.floor((aw-W*T)/2)+10;oy=top+Math.floor((ah-H*T)/2)}
addEventListener('resize',resize);
function burst(x,y,n){for(let i=0;i<(n||12);i++){const a=Math.random()*6.28,s=1+Math.random()*3;particles.push({x:(x+.5),y:(y+.5),vx:Math.cos(a)*s/T*2.5,vy:Math.sin(a)*s/T*2.5,l:40,c:Math.random()<.5?'#ffcf73':'#9bd36a'})}}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
let last=performance.now();
function frame(t){const dt=Math.max(0,Math.min(.05,(t-last)/1000));last=t;
 // advance anim/queue
 const sp=dt*14;const lerp=o=>{const ddx=o.x-o.dx,ddy=o.y-o.dy,dist=Math.hypot(ddx,ddy);if(dist>2.5){o.dx=o.x;o.dy=o.y;return}if(dist<=sp||dist<1e-6){o.dx=o.x;o.dy=o.y}else{o.dx+=ddx/dist*sp;o.dy+=ddy/dist*sp}};
 lerp(pl);boxes.forEach(lerp);const moving=pl.dx!==pl.x||pl.dy!==pl.y;if(!moving&&queue.length)tryMove(queue.shift());
