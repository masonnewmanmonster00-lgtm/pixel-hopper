const SAVEKEY='g3IncaSave',TITLE='🦙 Inca Empire',INTRO='Climb the Andes! Explore Machu Picchu, farm mountain terraces, read and tie quipu knots to record numbers, and race messages along the royal roads with the chasqui runners.';

const cv=$('c'),cx=cv.getContext('2d');let W=0,H=0,DPR=1;

let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=0.12,t='sine',v=0.15,dl=0){if(save.mute)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;const s=a.currentTime+dl;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(0.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+0.02)}
const sfx={ok(){tone(660,.1,'triangle');tone(990,.15,'triangle',.15,.08)},bad(){tone(200,.25,'sawtooth',.08)},tap(){tone(500,.05,'square',.05)},win(){[523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.15,i*.12))}};
function resize(){DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight-40;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';cx.setTransform(DPR,0,0,DPR,0,0)}

function txt(s,x,y,sz,col='#fff',al='center',wt='700'){cx.font=wt+' '+sz+'px system-ui,Segoe UI,Roboto,sans-serif';cx.fillStyle=col;cx.textAlign=al;cx.textBaseline='middle';cx.fillText(s,x,y)}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

let paused=false,btns=[];

let cur=0,qi=0,miss=0,Q=null,msg='',msgCol='#fff',lock=false;const CUSTOM={};let BG=['#2a2140','#16213e'],ICON='📚';
const NQ=()=>{const L=LV[cur];return L.n||(L.m==='order'||L.m==='tl'?(L.reps||1):L.m==='mix'?8:6)};
function mo(ans,pool,n=4){return shuffle([ans,...shuffle([...new Set(pool)].filter(x=>x!==ans)).slice(0,n-1)])}
function fromList(list,q){const u=(Q&&Q.used)||[],key=x=>Array.isArray(x)?x[0]:x,left=list.filter(x=>!u.includes(key(x)));const f=pick(left.length?left:list);q.used=u.concat(key(f));return f}

function orderQ(q,list,text){q.list=list;q.stages=shuffle(list.map((s,i)=>({s,i})));q.next=0;q.text=text||'Tap the steps IN ORDER, first to last.'}
function tlQ(q,TL,fmt){const ev=shuffle(TL).slice(0,4).sort((a,b)=>a[0]-b[0]);orderQ(q,ev.map(e=>e[1]+' ('+fmt(e[0])+')'),'Tap these events from OLDEST to NEWEST.');q.stages.forEach(s=>s.s=s.s.replace(/ \([^)]*\)$/,''))}
function startLevel(i){ov('');paused=false;cur=i;qi=0;miss=0;msg='';lock=false;Q=null;Q=makeQ();draw();if(TIPS[i]&&!save['tip'+i]){save['tip'+i]=1;persist();ov('<h2>'+LV[i].name+'</h2><p>'+TIPS[i]+'</p><button class="btn" onclick="ov(\'\')">Let\'s go ▶</button>')}}
function keyTyping(){return false}
function card(x,y,w,h,col,stroke){cx.fillStyle=col;rr(x,y,w,h,12);cx.fill();if(stroke){cx.strokeStyle=stroke;cx.lineWidth=3;cx.stroke()}}
function wrapC(s,x,y,w,sz,col,maxL=3){cx.font='700 '+sz+'px system-ui';const ws=String(s).split(' ');let lines=[],l='';for(const wd of ws){const t=l?l+' '+wd:wd;if(cx.measureText(t).width>w&&l){lines.push(l);l=wd}else l=t}lines.push(l);if(lines.length>maxL&&sz>10)return wrapC(s,x,y,w,sz-1,col,maxL);lines.forEach((ln,i)=>txt(ln,x,y+(i-(lines.length-1)/2)*(sz+3),sz,col))}
function draw(){btns=[];cx.clearRect(0,0,W,H);const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,BG[0]);g.addColorStop(1,BG[1]);cx.fillStyle=g;cx.fillRect(0,0,W,H);if(!Q)return;const q=Q;
 $('st').textContent='Lv '+(cur+1)+' · '+Math.min(qi+1,NQ())+'/'+NQ()+' · ✗'+miss;txt(LV[cur].name,W/2,14,13,'#ffcf5a');
 if(CUSTOM[q.m])return CUSTOM[q.m].draw(q);
 if(q.stages){wrapC(q.text,W/2,36,W-40,16,'#fff');const n=q.stages.length,gap=8,bw=Math.min(180,(W-20-gap*(n-1))/n),x0=(W-(n*bw+gap*(n-1)))/2;for(let i=0;i<n;i++){const x=x0+i*(bw+gap);card(x,56,bw,40,'#0005');wrapC(i<q.next?q.list[i]:(i+1)+'. ?',x+bw/2,76,bw-8,11,i<q.next?'#7f7':'#ccd')}
  q.stages.forEach((st,i)=>{const x=x0+i*(bw+gap),y=110,done=st.i<q.next;card(x,y,bw,120,done?'#2a5a3a':'#fdf6e3',st.bad?'#e74c3c':null);const parts=st.s.split(' ');const em=/^\p{Extended_Pictographic}/u.test(parts[0])?parts.shift():'';if(em)txt(em,x+bw/2,y+30,26);wrapC(parts.join(' '),x+bw/2,y+(em?80:60),bw-10,12,done?'#cfc':'#2b1d0e',4);if(!done)btns.push({x,y,w:bw,h:120,f:()=>pickStage(st)})});if(msg)wrapC(msg,W/2,H-36,W-40,14,msgCol);return}
 const lw=q.wide?0:W*.4;if(!q.wide){if(q.vis)q.vis(lw/2+8,H/2,Math.min(lw,H-60));else if(q.big){card(16,50,lw-16,H-80,'#fdf6e3');wrapC(q.big,lw/2+8,H/2-6,lw-44,q.bigSz||20,'#2b1d0e',6)}else txt(q.icon||ICON,lw/2+8,H/2,70)}
 const px=q.wide?20:lw+24,pw=W-px-14;wrapC(q.text,px+pw/2,q.wide?52:48,pw,q.wide?17:16,'#fff',q.wide?3:4);const n=q.opts.length,one=n<=3&&q.optCol!==2,bw=one?pw:(pw-10)/2,bh=n>4?36:one?38:46,top=q.wide?92:96;
 q.opts.forEach((o,i)=>{const bx=px+(one?0:(i%2)*(bw+10)),by=top+(one?i*(bh+8):Math.floor(i/2)*(bh+10));let col='#283070';if(q.picked!=null){if(o===q.ans)col='#2a8a3a';else if(o===q.picked)col='#a33'}card(bx,by,bw,bh,col);const s=(i+1)+'  '+o;if(cx.measureText&&s.length>40)wrapC(s,bx+bw/2,by+bh/2,bw-14,13,'#fff',2);else txt(s,bx+bw/2,by+bh/2,fit(s,bw-10,15));btns.push({x:bx,y:by,w:bw,h:bh,f:()=>choose(o)})});
 if(msg)wrapC(msg,px+pw/2,H-30,pw,13,msgCol)}
function pickStage(st){if(lock)return;const q=Q;if(st.i===q.next){q.next++;st.bad=0;sfx.ok();if(q.next>=q.stages.length){lock=true;msg='✔ Perfect order!'+(q.done?' '+q.done:'');msgCol='#7f7';draw();setTimeout(next,1900);return}msg='✔ Yes!';msgCol='#7f7'}else{sfx.bad();miss++;st.bad=1;msg='✘ Not yet — what comes next?';msgCol='#f99'}draw()}
function choose(v){if(lock)return;Q.picked=v;lock=true;const ok=v===Q.ans;if(ok)sfx.ok();else{sfx.bad();miss++}msg=(ok?'✔ Correct! ':'✘ The answer: '+Q.ans+'. ')+(Q.why||'');msgCol=ok?'#7f7':'#f99';draw();setTimeout(next,ok?1600:3300)}
function good(m){sfx.ok();lock=true;msg='✔ '+m;msgCol='#7f7';draw();setTimeout(next,1900)}
function bad(m){sfx.bad();miss++;msg='✘ '+m;msgCol='#f99';draw()}
function next(){msg='';lock=false;qi++;if(qi>=NQ()){finishLevel(miss===0?3:miss<=2?2:1);return}Q=makeQ();draw()}

function onKey(e){const k=e.key,q=Q;if(!q||lock)return;const n=+k;if(CUSTOM[q.m]&&CUSTOM[q.m].key)return CUSTOM[q.m].key(e,q);if(q.opts&&n>=1&&n<=q.opts.length)return choose(q.opts[n-1]);if(q.stages&&n>=1&&n<=q.stages.length&&q.stages[n-1].i>=q.next)return pickStage(q.stages[n-1])}

BG=['#3a5a2a','#1a2a12'];ICON='🦙';
// Quipu: knots clustered at place levels: hundreds top, tens middle, ones bottom (long knots for ones, 0 = gap)
function cord(x,y0,len,n,col){cx.strokeStyle=col||'#c9a46a';cx.lineWidth=4;cx.beginPath();cx.moveTo(x,y0);cx.bezierCurveTo(x+4,y0+len*.4,x-4,y0+len*.7,x,y0+len);cx.stroke();
 const d=String(n).padStart(3,'0').split('').map(Number),lv=[.2,.48,.78];d.forEach((k,i)=>{const yc=y0+len*lv[i];for(let j=0;j<k;j++){const sp=Math.min(9,len*.24/k),yy=yc+(j-(k-1)/2)*sp;if(i===2&&n%10>1){cx.fillStyle='#7a4a1a';rr(x-5,yy-sp/2+.5,10,sp-1,3);cx.fill();cx.strokeStyle='#4a2a0a';cx.lineWidth=1;cx.beginPath();cx.moveTo(x-5,yy);cx.lineTo(x+5,yy);cx.stroke()}else{cx.fillStyle='#5a3010';cx.beginPath();cx.arc(x,yy,4.5,0,7);cx.fill()}}})}
function quipuVis(nums){return ()=>{const x=16,y=44,w=W*.4-16,h=H-60;card(x,y,w,h,'#f3e6c8');cx.strokeStyle='#8a5a2a';cx.lineWidth=6;cx.beginPath();cx.moveTo(x+14,y+22);cx.lineTo(x+w-14,y+22);cx.stroke();const len=h-50,lv=[.2,.48,.78];['100s','10s','1s'].forEach((l,i)=>{cx.strokeStyle='#0002';cx.setLineDash([3,4]);cx.lineWidth=1;cx.beginPath();cx.moveTo(x+30,y+22+len*lv[i]);cx.lineTo(x+w-6,y+22+len*lv[i]);cx.stroke();cx.setLineDash([]);txt(l,x+16,y+22+len*lv[i],9,'#6a4a2a')});nums.forEach((n,i)=>cord(x+40+(i+.5)*(w-50)/nums.length,y+22,len,n,['#c9a46a','#b5523a','#3a7ab5','#4a8a3a'][i%4]))}}
const Q_GEO=[['The Inca Empire stretched along which mountains?','The Andes',['The Alps','The Himalayas','The Rockies'],'The Andes run down the west side of South America.'],['What was the Inca capital?','Cusco',['Lima','Rio','Mexico City'],'Cusco is in modern Peru, about 3,400 m high.'],['The Inca called their empire Tawantinsuyu, meaning…','The four parts together',['The golden land','The sun city','The long road'],'It was split into four regions (suyus) meeting at Cusco.'],['Which modern country was the heart of the empire?','Peru',['Brazil','Argentina','Mexico'],'It also reached Ecuador, Bolivia, Chile, Argentina and Colombia.'],['Which animal carried loads for the Inca?','The llama',['The horse','The camel','The elephant'],'There were no horses in the Americas until the Spanish came.'],['Which soft wool came from a cousin of the llama?','Alpaca wool',['Sheep wool','Silk','Cotton only'],'Vicuña wool was so fine only royalty could wear it.'],['High in the Andes, the air has…','Less oxygen',['More oxygen','No wind','Only clouds'],'Andean people developed bigger lungs and chests over generations.'],['Which ocean lies west of the Inca lands?','The Pacific',['The Atlantic','The Indian','The Arctic'],'A dry coastal desert lies between the ocean and the mountains.']];

const TL=[[1200,'Manco Cápac founds Cusco (legend)'],[1438,'Pachacuti begins to expand the empire'],[1450,'Machu Picchu is built'],[1471,'Topa Inca extends the empire south'],[1493,'Huayna Cápac becomes emperor'],[1527,'Civil war between Atahualpa and Huáscar'],[1532,'Pizarro captures Atahualpa'],[1572,'Last Inca ruler, Túpac Amaru, is executed'],[1911,'Machu Picchu becomes world famous'],[1983,'Machu Picchu named a World Heritage Site']];
const LV=[{name:'Lands of the Andes',m:'quiz',k:Q_GEO},{name:'What is a quipu?',m:'quiz',k:Q_QF},{name:'Read a quipu: 1–99',m:'qr',r:[1,99]},{name:'Tie knots: 1–99',m:'qb',r:[11,99]},{name:'Machu Picchu',m:'quiz',k:Q_MP},{name:'Read a quipu: hundreds',m:'qr',r:[100,999]},{name:'Terrace farming',m:'quiz',k:Q_FARM},{name:'Tie knots: up to 999',m:'qb',r:[100,999]},{name:'Roads and chasquis',m:'quiz',k:Q_ROAD},{name:'Quipu totals',m:'qsum'},{name:'Chasqui relay maths',m:'relay'},{name:'Timeline',m:'tl',reps:3},{name:'Find the zero',m:'qr',r:[101,909],zero:1},{name:'Inca master',m:'mix'}];
const TIPS={1:'A QUIPU stores numbers in knots. The top group counts HUNDREDS, the middle TENS and the bottom ONES. Ones use long coiled knots. An empty spot means ZERO.',3:'Tap a level to add a knot there (↶ undoes), then Check. Top = 100s, middle = 10s, bottom = 1s.',9:'Main-cord quipus often had a TOTAL cord — add up the other cords!',10:'Chasquis ran in relays: each ran a short stretch, then passed the message on.'};
CUSTOM.qb={draw(q){const lw=W*.4;const x=16,y=44,w=lw-16,h=H-60,len=h-50;card(x,y,w,h,'#f3e6c8');cx.strokeStyle='#8a5a2a';cx.lineWidth=6;cx.beginPath();cx.moveTo(x+14,y+22);cx.lineTo(x+w-14,y+22);cx.stroke();cord(x+w/2,y+22,len,q.v,'#b5523a');
 const px=lw+24,pw=W-px-14;wrapC('Tie knots to record '+q.ans+' llamas',px+pw/2,52,pw,18,'#fff');const bw=(pw-20)/3;['+100','+10','+1'].forEach((l,i)=>{const bx=px+i*(bw+10);card(bx,80,bw,54,'#f3e6c8');txt(l,bx+bw/2,100,18,'#4a2a0a');txt(['top','middle','bottom'][i],bx+bw/2,122,11,'#6a4a2a');btns.push({x:bx,y:80,w:bw,h:54,f:()=>q.add(i)})});
 const b2=(pw-10)/2;card(px,146,b2,40,'#555');txt('↶ Undo',px+b2/2,166,15);btns.push({x:px,y:146,w:b2,h:40,f:()=>q.undo()});card(px+b2+10,146,b2,40,'#2a8a3a');txt('✔ Check',px+b2*1.5+10,166,15);btns.push({x:px+b2+10,y:146,w:b2,h:40,f:()=>q.check()});txt('Cord shows: '+q.v,px+pw/2,206,14,'#ffcf5a');if(msg)wrapC(msg,px+pw/2,H-30,pw,13,msgCol)},
 key(e,q){const k=+e.key;if(k>=1&&k<=3)q.add(k-1);else if(e.key==='Backspace')q.undo();else if(e.key==='Enter')q.check()}};
function numOpts(n){const s=new Set([n]);[10,-10,1,-1,100,-100,90,-9].forEach(d=>{if(s.size<4&&n+d>0&&n+d<1000&&Math.random()<.7)s.add(n+d)});while(s.size<4)s.add(n+ri(-20,20)||n+21);return shuffle([...s].map(String))}
function makeQ(){const L=LV[cur];let m=L.m;if(m==='mix')m=pick(['quiz','qr','qb','qsum','relay']);const q={m,used:(Q&&Q.used)||[]};
 if(m==='tl'){tlQ(q,TL,y=>'AD '+y);return q}
 if(m==='qr'){const r=L.m==='qr'?L.r:[1,999];let n=ri(r[0],r[1]);if(L.zero){const d=String(n).split('');d[pick([1,2])]='0';n=+d.join('');if(n%100===0)n+=1}q.vis=quipuVis([n]);q.text='How many does this cord record?';q.opts=numOpts(n);q.ans=String(n);const d=String(n).padStart(3,'0');q.why=d[0]+' hundreds, '+d[1]+' tens, '+d[2]+' ones = '+n+'.';return q}
 if(m==='qsum'){const a=ri(10,300),b=ri(10,300),c=ri(5,200);q.vis=quipuVis([a,b,c]);q.text='Three villages sent llamas. What should the TOTAL cord say?';q.opts=numOpts(a+b+c);q.ans=String(a+b+c);q.why=a+' + '+b+' + '+c+' = '+(a+b+c)+'.';return q}
 if(m==='relay'){const leg=pick([2,3,4,5,6]),km=leg*pick([10,20,30,40,60]);q.icon='🏃';q.text='Each chasqui runs '+leg+' km to the next station. How many runners carry a message '+km+' km?';q.opts=numOpts(km/leg);q.ans=String(km/leg);q.why=km+' ÷ '+leg+' = '+km/leg+' runners.';return q}
 if(m==='qb'){const r=L.m==='qb'?L.r:[11,999];const n=ri(r[0],r[1]);q.ans=n;q.v=0;q.h=[];const P=[100,10,1];q.add=i=>{if(lock)return;const d=Math.floor(q.v/P[i])%10;if(d<9){q.v+=P[i];q.h.push(i);sfx.tap();msg='';draw()}};q.undo=()=>{if(lock||!q.h.length)return;q.v-=P[q.h.pop()];draw()};q.check=()=>{if(lock)return;if(q.v===n)good(n+' recorded, quipucamayoc!');else bad('The cord says '+q.v+'. You need '+String(n).padStart(3,'0').split('').map((d,i)=>d+' '+['hundreds','tens','ones'][i]).join(', ')+'.')};return q}
 quizQ(q,fromList(L.k||pick([Q_GEO,Q_MP,Q_FARM,Q_ROAD,Q_QF]),q));return q}
window.G={get Q(){return Q},LV,step(){const q=Q;if(!q||q.m!=='qb')return null;const a=String(q.ans).padStart(3,'0'),v=String(q.v).padStart(3,'0');for(let i=0;i<3;i++)if(+v[i]<+a[i])return i;return 4}};
resize();cur=0;Q=makeQ();draw();showLevels();


</script></body></html>
