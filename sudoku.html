<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b14">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Neon Sudoku</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{margin:0;padding-top:52px;min-height:100vh;background:radial-gradient(circle at 50% 0,#1b1050,#05030f 75%);color:#e8f4ff;font-family:system-ui,Segoe UI,sans-serif;display:flex;flex-direction:column;align-items:center}
a.back{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:80;display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(8,8,16,.82);color:#ffe14d;border:1px solid rgba(255,225,77,.55);font:700 12px/1 ui-monospace,monospace;letter-spacing:.04em;text-decoration:none;touch-action:manipulation}a.back:focus-visible{outline:2px solid #ffe14d;outline-offset:2px}
#mute{position:fixed;top:8px;right:12px;background:none;border:1px solid #7ff6;color:#7ff;border-radius:8px;font-size:18px;padding:4px 8px;cursor:pointer;z-index:5}
h1{margin:14px 0 4px;font-size:clamp(26px,6vw,40px);letter-spacing:4px;background:linear-gradient(90deg,#0ff,#f0f);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #f0f8)}
#wrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;justify-content:center;padding:8px}
#bar{display:flex;gap:14px;justify-content:space-between;width:min(94vw,486px);font-size:15px;margin:4px 0 6px}
#bar b{color:#f6f}
#diff{display:flex;gap:6px;margin:4px 0}
#diff button,.ctl button{background:#140c33;border:1px solid #6af6;color:#cfe;border-radius:8px;padding:7px 11px;font-size:14px;cursor:pointer}
#diff button.on{background:linear-gradient(135deg,#0aa,#a0a);color:#fff;box-shadow:0 0 12px #f0f8}
#grid{display:grid;grid-template-columns:repeat(9,1fr);width:min(94vw,486px);height:min(94vw,486px);border:3px solid #0ff;border-radius:8px;box-shadow:0 0 22px #0ff6,inset 0 0 20px #0ff2;overflow:hidden;background:#0a0720}
.c{position:relative;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5.5vw,30px);border-right:1px solid #3a3a6a;border-bottom:1px solid #3a3a6a;cursor:pointer;transition:background .12s}
.c:nth-child(9n+3),.c:nth-child(9n+6){border-right:2px solid #0ff9}
.c:nth-child(n+19):nth-child(-n+27),.c:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #0ff9}
.c.g{color:#fff;font-weight:700}.c.u{color:#5ff}
.c.hl{background:#1c1748}.c.same{background:#4a1d6a}.c.sel{background:#6a2a9a;box-shadow:inset 0 0 0 2px #f6f}
.c.bad{color:#ff4d6d!important;text-shadow:0 0 8px #f00}
.c.hint{animation:hp .8s}
@keyframes hp{0%{background:#0f8}100%{}}
.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);font-size:clamp(8px,2vw,11px);color:#b9a6ff;text-align:center;line-height:1}
.notes span{display:flex;align-items:center;justify-content:center}
.notes span.m{color:#fff;background:#f0f5;border-radius:3px}
#side{display:flex;flex-direction:column;gap:10px;width:min(94vw,486px);max-width:486px}
#pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
#pad button{background:#160d3a;border:1px solid #f6f8;color:#fff;font-size:clamp(18px,5vw,26px);border-radius:10px;padding:8px 0;cursor:pointer;box-shadow:0 0 8px #f0f4}
#pad button.done{opacity:.25}
.ctl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ctl button.on{background:#a0a;color:#fff}
@media(min-width:900px){#side{width:240px}#pad{grid-template-columns:repeat(3,1fr)}#pad button{padding:14px 0}.ctl{grid-template-columns:repeat(2,1fr)}}
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0008;z-index:9}
#win div{background:#120a30;border:2px solid #f0f;border-radius:16px;padding:24px 30px;text-align:center;box-shadow:0 0 40px #f0f}
#win h2{margin:0 0 8px;font-size:36px;color:#ff6}
#win button{margin-top:12px;background:linear-gradient(135deg,#0aa,#a0a);border:0;color:#fff;font-size:18px;padding:10px 20px;border-radius:10px;cursor:pointer}
#fx{position:fixed;inset:0;pointer-events:none;z-index:8}
</style></head><body>
<a class="back" href="./index.html" aria-label="Back to menu" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">← Menu</a><button id="mute">🔊</button>
<h1>NEON SUDOKU</h1>
<div id="diff"></div>
<div id="bar"><span>⏱ <b id="time">0:00</b></span><span>Mistakes <b id="mist">0</b></span><span>Best <b id="best">--</b></span></div>
<div id="wrap"><div id="grid"></div>
<div id="side"><div id="pad"></div>
<div class="ctl"><button id="undo">↶ Undo</button><button id="erase">⌫ Erase</button><button id="notesB">✎ Notes</button><button id="hintB">💡 Hint</button><button id="newB">★ New</button></div>
<div style="font-size:12px;opacity:.6">Keys: 1-9, arrows, N notes, H hint, Ctrl+Z / U undo, Del erase</div></div></div>
<div id="win"><div><h2>SOLVED!</h2><div id="wtxt"></div><button id="again">Play again</button></div></div>
<canvas id="fx"></canvas>
<script>
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
// audio
let AC=null,muted=LS.get('sdk_mute',false);
function tone(f,d=.1,t='sine',v=.15,sl=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
const SFX={place:()=>tone(660,.08,'triangle'),note:()=>tone(990,.05,'sine',.08),bad:()=>tone(160,.25,'sawtooth',.12,90),hint:()=>{tone(880,.1);setTimeout(()=>tone(1320,.15),90)},unit:()=>[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.12,'triangle'),i*60)),win:()=>[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.18),i*120)),click:()=>tone(440,.04,'square',.05)};
const muteB=document.getElementById('mute');function updM(){muteB.textContent=muted?'🔇':'🔊'}updM();muteB.onclick=()=>{muted=!muted;LS.set('sdk_mute',muted);updM()};
// generator
const PEERS=[];for(let i=0;i<81;i++){const r=i/9|0,c=i%9,s=new Set();for(let k=0;k<9;k++){s.add(r*9+k);s.add(k*9+c)}const br=r-r%3,bc=c-c%3;for(let a=0;a<3;a++)for(let b=0;b<3;b++)s.add((br+a)*9+bc+b);s.delete(i);PEERS.push([...s])}
function cands(g,i){let m=0x3fe;for(const p of PEERS[i])m&=~(1<<g[p]);return m}
function solve(g,limit){let cnt=0;const sol=[];(function rec(){if(cnt>=limit)return;let bi=-1,bm=0,bc=10;for(let i=0;i<81;i++)if(!g[i]){const m=cands(g,i);let c=0;for(let x=m;x;x&=x-1)c++;if(c<bc){bc=c;bi=i;bm=m;if(c<2)break}}if(bi<0){cnt++;if(!sol.length)sol.push(g.slice());return}if(!bc)return;for(let v=1;v<=9;v++)if(bm&(1<<v)){g[bi]=v;rec();g[bi]=0;if(cnt>=limit)return}})();return{cnt,sol:sol[0]}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function fullGrid(){const g=Array(81).fill(0);(function rec(i){if(i==81)return true;const m=cands(g,i);for(const v of shuffle([1,2,3,4,5,6,7,8,9]))if(m&(1<<v)){g[i]=v;if(rec(i+1))return true}g[i]=0;return false})(0);return g}
const DIFFS={Easy:38,Medium:31,Hard:26,Expert:23};
function generate(d){const target=DIFFS[d];let best=null;for(let tries=0;tries<6;tries++){const sol=fullGrid(),p=sol.slice();let clues=81;for(const i of shuffle([...Array(81).keys()])){if(clues<=target)break;const j=80-i;if(!p[i])continue;const a=p[i],b=p[j];p[i]=0;p[j]=0;const dc=i==j?1:2;if(solve(p.slice(),2).cnt!==1){p[i]=a;p[j]=b}else clues-=dc}if(!best||clues<best.clues)best={p,sol,clues};if(clues<=target+1)break}return best}
// state
let diff=LS.get('sdk_diff','Easy'),puz,sol,cur,notes,given,sel=-1,noteMode=false,hist=[],mist=0,t0=0,elapsed=0,timer,done=false;
let times=LS.get('arcade-sudoku-best',{});if(!times||typeof times!=='object'||Array.isArray(times))times={};
const G=document.getElementById('grid'),cells=[];for(let i=0;i<81;i++){const d=document.createElement('div');d.className='c';d.onpointerdown=()=>{sel=i;SFX.click();render()};G.appendChild(d);cells.push(d)}
const D=document.getElementById('diff');Object.keys(DIFFS).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{diff=k;LS.set('sdk_diff',k);newGame()};D.appendChild(b)});
const P=document.getElementById('pad');for(let v=1;v<=9;v++){const b=document.createElement('button');b.textContent=v;b.onclick=()=>input(v);P.appendChild(b)}
function fmt(s){return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function newGame(){const r=generate(diff);puz=r.p;sol=r.sol;cur=puz.slice();given=puz.map(v=>v>0);notes=Array.from({length:81},()=>0);hist=[];mist=0;sel=-1;done=false;elapsed=0;t0=Date.now();clearInterval(timer);timer=setInterval(tick,500);document.getElementById('win').style.display='none';[...D.children].forEach(b=>b.classList.toggle('on',b.textContent==diff));const bs=times[diff];document.getElementById('best').textContent=bs?fmt(bs):'--';render();tick()}
function tick(){if(done)return;elapsed=(Date.now()-t0)/1000|0;document.getElementById('time').textContent=fmt(elapsed)}
function snap(){hist.push({cur:cur.slice(),notes:notes.slice()});if(hist.length>300)hist.shift()}
function conflict(i){const v=cur[i];if(!v)return false;return PEERS[i].some(p=>cur[p]==v)}
function input(v){if(done||sel<0||given[sel])return;if(noteMode){if(cur[sel])return;snap();notes[sel]^=1<<v;SFX.note();render();return}if(cur[sel]==v)return;snap();cur[sel]=v;notes[sel]=0;
 for(const p of PEERS[sel])notes[p]&=~(1<<v);
 if(v!==sol[sel]){mist++;SFX.bad();}else{SFX.place();checkUnits(sel)}
 render();checkWin()}
function checkUnits(i){const r=i/9|0,c=i%9,ok=a=>a.every(k=>cur[k]==sol[k]);const row=[...Array(9)].map((_,k)=>r*9+k),col=[...Array(9)].map((_,k)=>k*9+c),br=r-r%3,bc=c-c%3,box=[];for(let a=0;a<3;a++)for(let b=0;b<3;b++)box.push((br+a)*9+bc+b);let any=false;for(const u of[row,col,box])if(ok(u)){any=true;u.forEach((k,j)=>setTimeout(()=>{cells[k].classList.remove('hint');void cells[k].offsetWidth;cells[k].classList.add('hint')},j*30))}if(any)SFX.unit()}
function erase(){if(done||sel<0||given[sel])return;if(!cur[sel]&&!notes[sel])return;snap();cur[sel]=0;notes[sel]=0;render()}
function undo(){const h=hist.pop();if(!h)return;cur=h.cur;notes=h.notes;SFX.click();render()}
function hint(){if(done)return;let i=sel>=0&&!given[sel]&&cur[sel]!==sol[sel]?sel:-1;if(i<0){const e=[];for(let k=0;k<81;k++)if(cur[k]!==sol[k])e.push(k);if(!e.length)return;i=e[Math.random()*e.length|0]}snap();cur[i]=sol[i];notes[i]=0;given[i]=true;sel=i;t0-=15000;SFX.hint();cells[i].classList.add('hint');setTimeout(()=>cells[i].classList.remove('hint'),800);render();checkWin()}
function checkWin(){if(cur.every((v,i)=>v==sol[i])){done=true;clearInterval(timer);tick();const b=times[diff],nb=!b||elapsed<b;if(nb){times[diff]=elapsed;const nums=Object.values(times).filter(v=>typeof v==='number');times.best=Math.min(...nums);LS.set('arcade-sudoku-best',times)};document.getElementById('wtxt').innerHTML=`${diff} solved in <b>${fmt(elapsed)}</b>${nb?'<br>🏆 New best time!':''}`;SFX.win();confetti();setTimeout(()=>document.getElementById('win').style.display='flex',600)}}
function render(){const sv=sel>=0?cur[sel]:0,sr=sel/9|0,sc=sel%9;const cnt=Array(10).fill(0);cur.forEach(v=>cnt[v]++);
 cells.forEach((d,i)=>{const r=i/9|0,c=i%9;const same=sel>=0&&(r==sr||c==sc||((r/3|0)==(sr/3|0)&&(c/3|0)==(sc/3|0)));d.className='c '+(given[i]&&puz[i]?'g':'u')+(i==sel?' sel':sv&&cur[i]==sv?' same':same?' hl':'')+(conflict(i)||(cur[i]&&!given[i]&&cur[i]!==sol[i])?' bad':'');
  if(cur[i])d.textContent=cur[i];else if(notes[i]){d.innerHTML='<div class="notes">'+[1,2,3,4,5,6,7,8,9].map(v=>`<span class="${notes[i]&1<<v&&v==sv?'m':''}">${notes[i]&1<<v?v:''}</span>`).join('')+'</div>'}else d.textContent=''});
 [...P.children].forEach((b,k)=>b.classList.toggle('done',cnt[k+1]>=9));document.getElementById('mist').textContent=mist+'';document.getElementById('notesB').classList.toggle('on',noteMode)}
document.getElementById('undo').onclick=undo;document.getElementById('erase').onclick=erase;document.getElementById('hintB').onclick=hint;document.getElementById('newB').onclick=newGame;document.getElementById('again').onclick=newGame;
document.getElementById('notesB').onclick=()=>{noteMode=!noteMode;SFX.click();render()};
addEventListener('keydown',e=>{const k=e.key;if(k>='1'&&k<='9'){input(+k);return}const mv={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[k];if(mv){e.preventDefault();if(sel<0)sel=0;else sel=(sel+mv+81)%81;render();return}
 if(k=='Backspace'||k=='Delete'||k=='0')erase();else if(k=='n'||k=='N'){noteMode=!noteMode;render()}else if(k=='h'||k=='H')hint();else if((k=='z'&&(e.ctrlKey||e.metaKey))||k=='u'||k=='U')undo()});
// confetti
const fx=document.getElementById('fx'),fc=fx.getContext('2d');let parts=[];function confetti(){fx.width=innerWidth;fx.height=innerHeight;for(let i=0;i<220;i++)parts.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:-Math.random()*16-3,c:`hsl(${Math.random()*360},100%,60%)`,s:4+Math.random()*5,l:160});requestAnimationFrame(fxl)}
function fxl(){fc.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.l-->0);for(const p of parts){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;fc.fillStyle=p.c;fc.fillRect(p.x,p.y,p.s,p.s*.6)}if(parts.length)requestAnimationFrame(fxl);else fc.clearRect(0,0,fx.width,fx.height)}
window.__sdk={get sol(){return sol},get puz(){return puz},solve,generate,get done(){return done}};
newGame();
</script></body></html>
