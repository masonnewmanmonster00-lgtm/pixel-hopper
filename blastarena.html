<canvas id="c"></canvas>
<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const COLS=15,ROWS=11,HUD=30,TOP=56;
const DIRS={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]},OPP={u:'d',d:'u',l:'r',r:'l'},DK=['u','d','l','r'];
const PCOL=['#4af','#f55','#5d5','#fd4'],PNAME=['YOU','RED','GREEN','GOLD'];
const AICFG={easy:{think:.4,skip:.5,hunt:0,flee:.25},medium:{think:.18,skip:.2,hunt:2,flee:.08},hard:{think:.06,skip:0,hunt:5,flee:0}};
// ---------- state (all initialised before first draw) ----------
let W=800,H=400,dpr=1,tile=32,bx=0,by=0,touchMode=false,ctrlW=0;
let grid=[],hidden=[],fl=[],flk=[],flo=[],bombs=[],pups=[],ents=[],mons=[],parts=[],floaters=[];
let state='menu',mode='battle',nCpu=3,diff='medium',focus=0,buttons=[];
let round=1,roundT=90,overT=0,sdIdx=0,sdT=0,spiral=[],msg='',msgT=0,shake=0,time=0;
let level=1,lives=3,score=0,levelScore=0,exitT={x:0,y:0,rev:false},deathT=0,lastWinner=null;
let simMul=1,selfK=0,deaths=0;
let keys={},keyStack=[],tdir=null,padId=null,padPos=null,auto=false;
let save={bestScore:0,bestLevel:0,matches:0,wins:0,rounds:0,kills:0};
try{Object.assign(save,JSON.parse(localStorage.getItem('blastSave')||'{}'))}catch(e){}
function saveHub(){try{const n=Math.round(save.bestScore);if(!(n>0))return;const k='arcade-blast-best';const prev=Number(localStorage.getItem(k));if(Number.isFinite(prev)&&prev>=n)return;localStorage.setItem(k,String(n));}catch(e){}}
function persist(){try{localStorage.setItem('blastSave',JSON.stringify(save))}catch(e){}saveHub()}
saveHub();
function blank(v){const a=[];for(let y=0;y<ROWS;y++){a.push(new Array(COLS).fill(v))}return a}
grid=blank(0);hidden=blank(null);fl=blank(0);flk=blank('');flo=blank(null);
for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(x==0||y==0||x==COLS-1||y==ROWS-1||(x%2==0&&y%2==0))grid[y][x]=1;
// spiral for sudden death
(function(){let x0=1,y0=1,x1=COLS-2,y1=ROWS-2;while(x0<=x1&&y0<=y1){for(let x=x0;x<=x1;x++)spiral.push([x,y0]);for(let y=y0+1;y<=y1;y++)spiral.push([x1,y]);if(y1>y0)for(let x=x1-1;x>=x0;x--)spiral.push([x,y1]);if(x1>x0)for(let y=y1-1;y>y0;y--)spiral.push([x0,y]);x0++;y0++;x1--;y1--}})();
// ---------- audio ----------
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){const p=AC.resume();if(p&&p.catch)p.catch(()=>{})}return AC}
function tone(f,d,type='square',v=.08,f2=null){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
function noise(d,v=.25,lp=900){const a=ac();if(!a)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;const g=a.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
const sfx={boom(){noise(.6,.35,700);tone(90,.4,'sine',.2,30)},place(){tone(220,.08,'square',.06,160)},pup(){tone(600,.08);setTimeout(()=>tone(900,.12),70)},die(){tone(400,.6,'sawtooth',.1,60)},kick(){tone(150,.08,'triangle',.15,300)},click(){tone(500,.05,'square',.05)},win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18,'square',.07),i*120))},crate(){noise(.15,.15,2500)}};
// ---------- layout ----------
function resize(){dpr=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;cv.width=W*dpr;cv.height=H*dpr;
 touchMode=touchMode||('ontouchstart' in window)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
 ctrlW=touchMode?Math.min(170,W*0.2):0;
 tile=Math.max(10,Math.floor(Math.min((W-ctrlW*2-8)/COLS,(H-TOP-HUD-6)/ROWS)));
 bx=Math.floor((W-COLS*tile)/2);by=Math.floor(TOP+HUD+(H-TOP-HUD-ROWS*tile)/2)}
window.addEventListener('resize',resize);resize();
// ---------- helpers ----------
const inB=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS;
function bombAt(x,y){for(const b of bombs)if(b.x===x&&b.y===y)return b;return null}
function blocked(x,y){return !inB(x,y)||grid[y][x]!==0||!!bombAt(x,y)}
function entAt(x,y){for(const e of ents)if(e.alive&&Math.round(e.px)===x&&Math.round(e.py)===y)return e;for(const m of mons)if(m.alive&&Math.round(m.px)===x&&Math.round(m.py)===y)return m;return null}
function mkEnt(i,x,y,cpu){return{id:i,name:PNAME[i],x,y,px:x,py:y,tx:x,ty:y,nx:x,ny:y,mv:false,dir:null,face:'d',speed:3.2,maxB:1,act:0,flame:2,kick:false,alive:true,cpu,color:PCOL[i],wins:0,think:0,anim:0,deadT:0,inv:0}}
function burst(x,y,col,n,sp=4,life=.6,sz=3){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:life*(.5+Math.random()*.5),max:life,col,sz:sz*(.5+Math.random())})}}
function floater(x,y,t,col){floaters.push({x,y,t,col,life:1})}
// ---------- setup ----------
function buildMap(density,pupChance){
 grid=blank(0);hidden=blank(null);fl=blank(0);flk=blank('');flo=blank(null);bombs=[];pups=[];parts=[];floaters=[];
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){if(x==0||y==0||x==COLS-1||y==ROWS-1||(x%2==0&&y%2==0))grid[y][x]=1;else if(Math.random()<density)grid[y][x]=2}
 const clr=[[1,1],[2,1],[1,2],[COLS-2,1],[COLS-3,1],[COLS-2,2],[1,ROWS-2],[2,ROWS-2],[1,ROWS-3],[COLS-2,ROWS-2],[COLS-3,ROWS-2],[COLS-2,ROWS-3]];
 for(const[x,y]of clr)grid[y][x]=0;
 const pool=['bomb','bomb','fire','fire','speed','kick'];
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(grid[y][x]===2&&Math.random()<pupChance)hidden[y][x]=pool[Math.floor(Math.random()*pool.length)];
}
function startBattle(newMatch){
 mode='battle';if(newMatch){round=1;ents=[];const sp=[[1,1],[COLS-2,ROWS-2],[COLS-2,1],[1,ROWS-2]];for(let i=0;i<=nCpu;i++)ents.push(mkEnt(i,sp[i][0],sp[i][1],i>0))}
 buildMap(.72,.38);mons=[];
 const sp=[[1,1],[COLS-2,ROWS-2],[COLS-2,1],[1,ROWS-2]];
 ents.forEach((e,i)=>{const w=e.wins;Object.assign(e,mkEnt(i,sp[i][0],sp[i][1],i>0));e.wins=w});
 roundT=90;overT=0;sdIdx=0;sdT=0;state='play';msg='ROUND '+round;msgT=1.5;sfx.click()}
const MTYPES={blob:{sp:1.5,col:'#6c4',pts:100,chase:0},bat:{sp:2.2,col:'#b6f',pts:200,chase:0},ghost:{sp:1.9,col:'#dde',pts:400,chase:6},imp:{sp:2.8,col:'#f64',pts:800,chase:9}};
function startLevel(){
 mode='campaign';buildMap(Math.min(.75,.5+level*.03),.22);
 const p=mkEnt(0,1,1,false);if(ents[0]&&ents[0].keep){p.maxB=ents[0].maxB;p.flame=ents[0].flame;p.speed=ents[0].speed;p.kick=ents[0].kick}p.keep=true;ents=[p];
 // exit under a far crate
 const cr=[];for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++)if(grid[y][x]===2&&x+y>8)cr.push([x,y]);
 const e=cr.length?cr[Math.floor(Math.random()*cr.length)]:[COLS-2,ROWS-2];if(!cr.length)grid[e[1]][e[0]]=2;
 exitT={x:e[0],y:e[1],rev:false};hidden[e[1]][e[0]]=null;
 mons=[];const types=['blob','blob','bat','ghost','imp'].slice(0,Math.min(5,1+Math.ceil(level/1.5)));
 const n=Math.min(10,2+level);let tries=0;
 while(mons.length<n&&tries++<2000){const x=1+Math.floor(Math.random()*(COLS-2)),y=1+Math.floor(Math.random()*(ROWS-2));if(grid[y][x]!==0||x+y<7||entAt(x,y))continue;const t=types[Math.floor(Math.random()*types.length)];mons.push({type:t,...MTYPES[t],x,y,px:x,py:y,tx:x,ty:y,nx:x,ny:y,mv:false,dir:DK[Math.floor(Math.random()*4)],alive:true,anim:Math.random()*5,speed:MTYPES[t].sp*(1+level*.03)})}
 roundT=200;overT=0;deathT=0;levelScore=score;state='play';msg='LEVEL '+level;msgT=1.6;sfx.click()}
function startCampaign(){level=1;lives=3;score=0;ents=[];startLevel()}
function restart(){if(mode==='battle'){ents.forEach(e=>e.wins=0);startBattle(true)}else{score=levelScore;startLevel()}}
// ---------- movement ----------
function moveEnt(e,dir,dt,isMon){
 if(e.mv){
  if(dir&&dir===OPP[e.dir]){const tx=e.tx,ty=e.ty;e.tx=e.nx;e.ty=e.ny;e.nx=tx;e.ny=ty;e.dir=dir;e.face=dir}
  const step=e.speed*dt,dx=e.nx-e.px,dy=e.ny-e.py;
  if(Math.abs(dx)+Math.abs(dy)<=step){e.px=e.nx;e.py=e.ny;e.tx=e.nx;e.ty=e.ny;e.mv=false}else{e.px+=Math.sign(dx)*step;e.py+=Math.sign(dy)*step}
  e.anim+=dt*e.speed}
 if(!e.mv&&dir){e.face=dir;const[dx,dy]=DIRS[dir],nx=e.tx+dx,ny=e.ty+dy;
  const b=bombAt(nx,ny);
  if(b&&e.kick&&!b.slide&&!blocked(nx+dx,ny+dy)&&!entAt(nx+dx,ny+dy)){b.slide=dir;sfx.kick()}
  if(!blocked(nx,ny)){e.mv=true;e.nx=nx;e.ny=ny;e.dir=dir}}
}
function placeBomb(e){const x=Math.round(e.px),y=Math.round(e.py);if(!e.alive||e.act>=e.maxB||bombAt(x,y)||grid[y][x]!==0)return false;bombs.push({x,y,fx:x,fy:y,timer:2.5,owner:e,flame:e.flame,slide:null});e.act++;sfx.place();return true}
// ---------- explosions ----------
function blastTiles(b){const t=[[b.x,b.y]];for(const d of DK){const[dx,dy]=DIRS[d];for(let i=1;i<=b.flame;i++){const x=b.x+dx*i,y=b.y+dy*i;if(!inB(x,y)||grid[y][x]===1)break;t.push([x,y]);if(grid[y][x]===2||bombAt(x,y))break}}return t}
function setFlame(x,y,k,o){fl[y][x]=.55;if(flk[y][x]!=='c')flk[y][x]=k;flo[y][x]=o}
function breakCrate(x,y){grid[y][x]=0;burst((x+.5)*tile,(y+.5)*tile,'#b7793a',10,5,.7,4);sfx.crate();
 if(hidden[y][x]){pups.push({x,y,type:hidden[y][x],safe:.6,t:0});hidden[y][x]=null}
 if(mode==='campaign'&&exitT.x===x&&exitT.y===y)exitT.rev=true;
 if(mode==='campaign')score+=10}
function explode(b){const i=bombs.indexOf(b);if(i<0)return;bombs.splice(i,1);if(b.owner)b.owner.act=Math.max(0,b.owner.act-1);
 setFlame(b.x,b.y,'c',b.owner);burst((b.x+.5)*tile,(b.y+.5)*tile,'#fc4',14,6,.5,4);
 for(const d of DK){const[dx,dy]=DIRS[d];for(let i=1;i<=b.flame;i++){const x=b.x+dx*i,y=b.y+dy*i;if(!inB(x,y)||grid[y][x]===1)break;
  if(grid[y][x]===2){breakCrate(x,y);setFlame(x,y,'e'+d,b.owner);break}
  const ob=bombAt(x,y);if(ob){ob.timer=Math.min(ob.timer,.08);setFlame(x,y,dx?'h':'v',b.owner);break}
  setFlame(x,y,i===b.flame?'e'+d:(dx?'h':'v'),b.owner);if(Math.random()<.4)burst((x+.5)*tile,(y+.5)*tile,'#f82',2,3,.4,3)}}
 shake=Math.min(14,shake+6);sfx.boom()}
function killEnt(e,by){if(!e.alive||e.inv>0)return;e.alive=false;e.deadT=0;deaths++;if(by===e)selfK++;burst((e.px+.5)*tile,(e.py+.5)*tile,e.color,30,7,1,4);sfx.die();
 if(mode==='battle'&&by&&by!==e&&!by.cpu){save.kills++;persist()}}
// ---------- danger + AI ----------
function dangerMap(extra){const d=blank(Infinity);const list=bombs.map(b=>({b,t:b.timer}));if(extra)list.push({b:extra,t:extra.timer});
 const tiles=list.map(o=>blastTiles(o.b));
 for(let it=0;it<4;it++)list.forEach((a,ai)=>{for(const[x,y]of tiles[ai])list.forEach(c=>{if(c!==a&&c.b.x===x&&c.b.y===y&&c.t>a.t)c.t=a.t})});
 list.forEach((a,ai)=>{for(const[x,y]of tiles[ai])d[y][x]=Math.min(d[y][x],a.t)});
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(fl[y][x]>0)d[y][x]=Math.min(d[y][x],-1);
 if(mode==='battle'&&roundT<=0){for(let i=sdIdx;i<Math.min(spiral.length,sdIdx+6);i++){const[x,y]=spiral[i];d[y][x]=-1}}
 return d}
function bfs(e,d,margin){const sx=e.tx,sy=e.ty,seen=blank(null),q=[{x:sx,y:sy,t:0,dist:0,first:null}],out=[];seen[sy][sx]=q[0];
 while(q.length){const n=q.shift();out.push(n);if(n.dist>25)continue;
  for(const k of DK){const[dx,dy]=DIRS[k],x=n.x+dx,y=n.y+dy;if(!inB(x,y)||seen[y][x]||blocked(x,y)||fl[y][x]>0)continue;
   const t=n.t+1/e.speed;if(d[y][x]<Infinity&&t>=d[y][x]-.3-margin)continue;
   if(mode==='campaign'&&mons.some(m=>m.alive&&Math.abs(m.px-x)+Math.abs(m.py-y)<1.2))continue;
   const m={x,y,t,dist:n.dist+1,first:n.first||k};seen[y][x]=m;q.push(m)}}
 return out}
function bombValue(e,x,y){const b={x,y,flame:e.flame};let v=0;for(const[tx,ty]of blastTiles(b)){if(grid[ty][tx]===2)v+=1;for(const o of ents)if(o!==e&&o.alive&&Math.round(o.px)===tx&&Math.round(o.py)===ty)v+=3;for(const m of mons)if(m.alive&&Math.round(m.px)===tx&&Math.round(m.py)===ty)v+=3}return v}
function aiDir(e,dt,cfg){
 if(e.mv)return null;
 const d=dangerMap();
 if(d[e.ty][e.tx]<Infinity){const r=bfs(e,d,0).filter(n=>d[n.y][n.x]===Infinity).sort((a,b)=>a.dist-b.dist)[0];return r?r.first:null}
 e.think-=dt;if(e.think>0)return null;e.think=cfg.think*(0.6+Math.random()*.8);
 if(e.act<e.maxB&&!bombAt(e.tx,e.ty)&&Math.random()>=cfg.skip){const v=bombValue(e,e.tx,e.ty);
  if(v>0){const d2=dangerMap({x:e.tx,y:e.ty,flame:e.flame,timer:2.5});const safe=bfs(e,d2,cfg.flee).filter(n=>d2[n.y][n.x]===Infinity&&n.dist>0);
   if(safe.length){placeBomb(e);safe.sort((a,b)=>a.dist-b.dist);return safe[0].first}}}
 const nodes=bfs(e,d,0).filter(n=>d[n.y][n.x]===Infinity);let best=null,bv=-1e9;
 for(const n of nodes){let v=-n.dist*.35;const p=pups.find(p=>p.x===n.x&&p.y===n.y);if(p)v+=8;
  if(n.dist>0)v+=Math.min(4,bombValue(e,n.x,n.y))*1.5;
  if(cfg.hunt){for(const o of ents)if(o!==e&&o.alive){const md=Math.abs(o.px-n.x)+Math.abs(o.py-n.y);v+=cfg.hunt/(1+md)}}
  if(mode==='battle'&&roundT<=0)v-=Math.max(0,8-Math.min(n.x,COLS-1-n.x,n.y,ROWS-1-n.y)*3);
  v+=Math.random()*.6;if(v>bv){bv=v;best=n}}
 if(best&&best.first)return best.first;
 const opts=DK.filter(k=>{const[dx,dy]=DIRS[k],x=e.tx+dx,y=e.ty+dy;return !blocked(x,y)&&d[y][x]===Infinity&&fl[y][x]===0});
 return opts.length&&Math.random()<.3?opts[Math.floor(Math.random()*opts.length)]:null}
function monDir(m){if(m.mv)return null;const p=ents[0];
 const open=DK.filter(k=>{const[dx,dy]=DIRS[k],x=m.tx+dx,y=m.ty+dy;return !blocked(x,y)&&fl[y][x]===0});if(!open.length)return null;
 if(m.chase&&p&&p.alive&&Math.abs(p.tx-m.tx)+Math.abs(p.ty-m.ty)<=m.chase){const n=bfs(m,blank(Infinity),0).find(n=>n.x===p.tx&&n.y===p.ty);if(n&&n.first&&Math.random()<.85)return n.first}
 if(open.includes(m.dir)&&!(m.type==='bat'&&Math.random()<.35&&open.length>2))return m.dir;
 const o2=open.filter(k=>k!==OPP[m.dir]);const c=(o2.length?o2:open);return c[Math.floor(Math.random()*c.length)]}
// ---------- update ----------
function humanDir(){if(tdir)return tdir;for(let i=keyStack.length-1;i>=0;i--)if(keys[keyStack[i]])return {ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'}[keyStack[i]];return null}
function update(dt){time+=dt;
 for(const p of parts){p.x+=p.vx*tile*dt*.6;p.y+=p.vy*tile*dt*.6;p.vy+=dt*6;p.life-=dt}parts=parts.filter(p=>p.life>0);
 for(const f of floaters){f.y-=dt*20;f.life-=dt}floaters=floaters.filter(f=>f.life>0);
 shake*=Math.pow(.02,dt);if(msgT>0)msgT-=dt;
 if(state!=='play')return;
 roundT-=dt;
 // entities
 for(const e of ents){if(!e.alive){e.deadT+=dt;continue}if(e.inv>0)e.inv-=dt;
  let dir;if(e.cpu||(auto&&e.id===0))dir=aiDir(e,dt,AICFG[e.cpu?diff:'hard']);else{dir=humanDir();if(keys.Space&&!keys._sp){placeBomb(e)}keys._sp=keys.Space}
  moveEnt(e,dir,dt);
  const p=pups.findIndex(p=>p.x===Math.round(e.px)&&p.y===Math.round(e.py));
  if(p>=0){const u=pups[p];pups.splice(p,1);sfx.pup();const lab={bomb:'+BOMB',fire:'+FIRE',speed:'+SPEED',kick:'KICK!'}[u.type];
   if(u.type==='bomb')e.maxB=Math.min(8,e.maxB+1);if(u.type==='fire')e.flame=Math.min(8,e.flame+1);if(u.type==='speed')e.speed=Math.min(6,e.speed+.5);if(u.type==='kick')e.kick=true;
   floater((u.x+.5)*tile,u.y*tile,lab,'#fff');burst((u.x+.5)*tile,(u.y+.5)*tile,'#fff',10,3,.5,2);if(mode==='campaign')score+=50}}
 for(const m of mons){if(!m.alive)continue;m.anim+=dt;moveEnt(m,monDir(m),dt,true);const p=ents[0];if(p&&p.alive&&p.inv<=0&&Math.abs(p.px-m.px)+Math.abs(p.py-m.py)<.7)killEnt(p,null)}
 // bombs
 for(const b of bombs){b.timer-=dt;if(b.slide){const[dx,dy]=DIRS[b.slide];const sp=9*dt;
