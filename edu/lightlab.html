<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Light Lab</title>
<style>
:root{--bg:#0f1530;--card:#1b2350;--ink:#f4f6ff;--mut:#9aa6d8;--acc:#ffd24d;--good:#3ddc84;--bad:#ff5c7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,#2a3480,var(--bg) 60%);color:var(--ink);min-height:100vh;user-select:none;-webkit-user-select:none;overflow-x:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0008;position:sticky;top:0;z-index:5;backdrop-filter:blur(4px)}
header a{color:var(--ink);text-decoration:none;background:#fff1;padding:6px 12px;border-radius:20px;font-weight:bold}
header h1{font-size:20px;margin:0;flex:1;color:var(--acc);text-shadow:0 2px 0 #0006}
.pill{background:#fff1;padding:5px 10px;border-radius:14px;font-size:14px}
main{max-width:980px;margin:0 auto;padding:14px}
.btn{font:inherit;font-weight:bold;border:0;border-radius:14px;padding:10px 16px;background:var(--acc);color:#111;cursor:pointer;box-shadow:0 4px 0 #0007;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}.btn.alt{background:#2c3770;color:var(--ink)}.btn.sel{outline:3px solid #fff}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 6px 18px #0005;border:2px solid #ffffff10}
.tile{cursor:pointer;transition:transform .15s}.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile .em{font-size:40px}.tile h3{margin:6px 0}.tile p{margin:0;color:var(--mut);font-size:14px}
.stars{color:#ffd34d;letter-spacing:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{min-height:28px;font-weight:bold;font-size:18px;margin:8px 0}
.opt{display:block;width:100%;margin:6px 0;text-align:left;background:#2c3770;color:var(--ink)}
.opt.ok{background:var(--good);color:#111}.opt.no{background:var(--bad)}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.12)}}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
.bar{height:10px;background:#fff2;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);transition:width .3s}
.fact{background:#ffd34d22;border-left:4px solid #ffd34d;padding:8px 12px;border-radius:8px;margin:8px 0}
svg text{font-family:inherit}
</style></head><body>
<header><a href="./index.html">← Learning Lab</a><h1>Light Lab</h1><span class="pill" id="starTotal">⭐ 0</span><button class="btn alt" id="snd" style="padding:6px 10px">🔊</button></header>
<main id="app"></main><canvas id="fx"></canvas>
<script>
// ---- shared helpers ----
const $=s=>document.querySelector(s),app=$('#app');
const SAVEKEY='lightLabSave';let SAVE=JSON.parse(localStorage.getItem(SAVEKEY)||'{}');SAVE.stars=SAVE.stars||{};SAVE.best=SAVE.best||{};
function save(){localStorage.setItem(SAVEKEY,JSON.stringify(SAVE));$('#starTotal').textContent='⭐ '+Object.values(SAVE.stars).reduce((a,b)=>a+b,0)}
let AC=null,muted=!!SAVE.muted;$('#snd').textContent=muted?'🔇':'🔊';
$('#snd').onclick=()=>{muted=!muted;SAVE.muted=muted;save();$('#snd').textContent=muted?'🔇':'🔊'};
function tone(f,d=.12,type='sine',v=.15,slide=0,delay=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d=.4,v=.2,lp=800){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=lp;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}catch(e){}}
const SFX={click:()=>tone(660,.05,'square',.06),good:()=>{tone(523,.1,'triangle');tone(784,.15,'triangle',.15,0,.08)},bad:()=>tone(200,.25,'sawtooth',.08,-80),
win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.15,0,i*.1)),pick:()=>tone(440,.06,'sine',.1,200),drop:()=>tone(330,.08,'sine',.12,-100)};
// confetti
const cv=$('#fx'),cx=cv.getContext('2d');let fxp=[];function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
function confetti(x=innerWidth/2,y=innerHeight/3,n=60){for(let i=0;i<n;i++)fxp.push({x,y,vx:(Math.random()-.5)*10,vy:-Math.random()*9-2,c:`hsl(${Math.random()*360},90%,60%)`,l:90});}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);fxp=fxp.filter(p=>p.l-->0);for(const p of fxp){p.vy+=.3;p.x+=p.vx;p.y+=p.vy;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,7,7)}requestAnimationFrame(loop)})();
function flash(el,ok){el.classList.remove('pop','shake');void el.offsetWidth;el.classList.add(ok?'pop':'shake')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function starStr(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function award(id,n){if((SAVE.stars[id]||0)<n)SAVE.stars[id]=n;save()}
// generic timed quiz: qs=[{q,opts,a,fact}] ; a is correct string
let __QZ=0;function runQuiz(id,title,qs,secs,back){let i=0,score=0,t=secs,timer;const tok=++__QZ;clearInterval(window.__qt);const alive=()=>tok===__QZ&&!!document.getElementById("qz"+tok);qs=shuffle(qs).slice(0,10);
 function end(){clearInterval(timer);if(!alive())return;const st=score>=9?3:score>=7?2:score>=5?1:0;award(id,st);if(score>(SAVE.best[id]||0))SAVE.best[id]=score;save();if(st)SFX.win(),confetti();
  app.innerHTML=`<div class="card" style="text-align:center"><h2>${title} — done!</h2><div style="font-size:48px" class="stars">${starStr(st)}</div><p>You got <b>${score}/${qs.length}</b>. Best: ${SAVE.best[id]}</p><div class="row" style="justify-content:center"><button class="btn" id="ag">Play again</button><button class="btn alt" id="bk">Back</button></div></div>`;$('#ag').onclick=()=>runQuiz(id,title,qs,secs,back);$('#bk').onclick=back}
 function show(){if(i>=qs.length)return end();const q=qs[i];app.innerHTML=`<div class="card" id="qz${tok}"><div class="row"><b style="flex:1">${title} · Q${i+1}/${qs.length}</b>${secs?`<span class="pill">⏱ <span id="tm">${t}</span>s</span>`:''}<span class="pill">✅ ${score}</span></div><div class="bar" style="margin:8px 0"><i style="width:${i/qs.length*100}%"></i></div>${q.svg||''}<h2>${q.q}</h2><div id="os"></div><div class="fb" id="fb"></div></div>`;
  shuffle(q.opts).forEach(o=>{const b=document.createElement('button');b.className='btn opt';b.innerHTML=o;b.onclick=()=>{if(b.parentNode.dataset.done)return;b.parentNode.dataset.done=1;const ok=o==q.a;if(ok){score++;SFX.good();confetti(innerWidth/2,innerHeight/2,20)}else SFX.bad();[...$('#os').children].forEach(x=>{if(x.innerHTML==q.a)x.classList.add('ok')});if(!ok)b.classList.add('no');flash(b,ok);$('#fb').innerHTML=(ok?'✅ Correct! ':'❌ Not quite. ')+(q.fact?`<div class="fact">💡 ${q.fact}</div>`:'');setTimeout(()=>{if(!alive())return;i++;show()},q.fact?2200:1100)};$('#os').appendChild(b)})}
 if(secs)window.__qt=timer=setInterval(()=>{if(!alive()){clearInterval(timer);return}t--;const e=$('#tm');if(e)e.textContent=t;if(t<=5&&t>0)tone(880,.05);if(t<=0)end()},1000);show()}
save();
</script>
<script>
const W=9,H=7,DIRS={R:[1,0],L:[-1,0],U:[0,-1],D:[0,1]};const CN={1:'red',2:'green',4:'blue',3:'yellow',5:'magenta',6:'cyan',7:'white'};
const CC={1:'#ff3b3b',2:'#3bff5a',4:'#3b7bff',3:'#ffe93b',5:'#ff3bf0',6:'#3bf6ff',7:'#ffffff'};
// level: lasers [x,y,dir,color], targets [x,y,color] (color 0 = must stay DARK), walls [[x,y]], inv {mirror:n,...}
const LV=[
{n:'First reflection',l:[[0,3,'R',1]],t:[[4,0,1]],w:[],inv:{mirror:1},tip:'Tap a mirror below, then tap a square on the board. Tap a placed mirror to turn it (tap again to pick it up).'},
{n:'Around the wall',l:[[0,1,'R',7]],t:[[8,5,7]],w:[[4,0],[4,1],[4,2],[4,3]],inv:{mirror:2},tip:'Angle of incidence = angle of reflection. A 45° mirror turns light 90°.'},
{n:'Color filter',l:[[0,3,'R',7]],t:[[8,3,2]],w:[],inv:{fR:1,fG:1},tip:'White light is a mix of red, green and blue. A filter lets only its own color through.'},
{n:'Make yellow',l:[[0,1,'R',1],[0,5,'R',2]],t:[[6,3,3]],w:[],inv:{mirror:2},tip:'Mixing LIGHT is different from mixing paint: red + green light = yellow!'},
{n:'Rainbow prism',l:[[0,3,'R',7]],t:[[4,0,1],[8,3,2],[4,6,4]],w:[],inv:{prism:1},tip:'A prism bends each color a different amount (refraction), splitting white light apart.'},
{n:'Cast a shadow',l:[[0,3,'R',7],[0,1,'R',7]],t:[[4,6,7],[8,3,0],[8,1,0]],w:[],inv:{mirror:1,block:1},tip:'Dark sensors (⚫) must stay in shadow. Light travels in straight lines, so a solid block makes a shadow behind it.'},
{n:'Magenta mix',l:[[0,2,'R',1],[8,4,'L',4]],t:[[4,6,5]],w:[[6,6],[7,6]],inv:{mirror:3},tip:'Red + blue light = magenta.'},
{n:'Split and rejoin',l:[[0,3,'R',7]],t:[[6,3,6]],w:[[2,0]],inv:{prism:1,mirror:2},tip:'Green + blue = cyan. Can you bring two colors back together?'},
{n:'Half mirror',l:[[0,3,'R',1]],t:[[8,3,1],[4,0,1]],w:[],inv:{split:1},tip:'A beam splitter (half-silvered mirror) lets some light through and reflects the rest.'},
{n:'Make white',l:[[0,1,'R',1],[0,3,'R',2],[0,5,'R',4]],t:[[6,3,7]],w:[],inv:{mirror:2},tip:'Red + green + blue light together make white light. Screens use this trick!'},
{n:'Shadow maze',l:[[0,2,'R',1],[0,4,'R',2]],t:[[4,6,3],[8,2,0],[8,4,0]],w:[],inv:{mirror:3}},
{n:'Red only',l:[[0,3,'R',7]],t:[[8,0,1],[8,3,0]],w:[[5,1],[6,1],[7,1],[8,1]],inv:{prism:1,mirror:1,block:1}},
{n:'Double magenta',l:[[0,3,'R',1],[4,6,'U',4]],t:[[8,3,5],[4,0,5]],w:[],inv:{split:1}},
{n:'Grand finale',l:[[0,3,'R',7]],t:[[8,3,2],[8,0,1],[8,6,4]],w:[[5,2],[5,4]],inv:{prism:1,mirror:2}}];
LV.forEach((l,i)=>l.id='L'+i);
const PIECES={mirror:{n:'Mirror',ic:'╱',rot:['/','\\']},split:{n:'Beam splitter',ic:'⧄',rot:['/','\\']},prism:{n:'Prism',ic:'△',rot:[0]},block:{n:'Block',ic:'⬛',rot:[0]},fR:{n:'Red filter',ic:'🟥',rot:[0],c:1},fG:{n:'Green filter',ic:'🟩',rot:[0],c:2},fB:{n:'Blue filter',ic:'🟦',rot:[0],c:4}};
function trace(L,placed){// placed: map "x,y"->{k,o}
 const segs=[],hit={},key=(x,y)=>x+','+y,walls=new Set(L.w.map(([x,y])=>key(x,y))),tg={};L.t.forEach(t=>tg[key(t[0],t[1])]=t);const lz=new Set(L.l.map(l=>key(l[0],l[1])));
 const seen=new Set();const q=L.l.map(([x,y,d,c])=>({x,y,dx:DIRS[d][0],dy:DIRS[d][1],c}));let guard=0;
 while(q.length&&guard++<500){let b=q.shift();let x=b.x,y=b.y;const pts=[[x,y]];let c=b.c,dx=b.dx,dy=b.dy;
  while(true){x+=dx;y+=dy;if(x<0||y<0||x>=W||y>=H){pts.push([x-dx*.5,y-dy*.5]);break}
   const k=key(x,y);const sk=k+dx+','+dy+c;if(seen.has(sk)){pts.push([x,y]);break}seen.add(sk);
   if(walls.has(k)||lz.has(k)){pts.push([x-dx*.5,y-dy*.5]);break}
   if(tg[k]){hit[k]=(hit[k]||0)|c;pts.push([x,y]);break}
   const p=placed[k];if(!p)continue;pts.push([x,y]);
   if(p.k=='block'){break}
   if(p.k=='mirror'){[dx,dy]=p.o=='/'?[-dy,-dx]:[dy,dx];continue}
   if(p.k=='split'){const[rx,ry]=p.o=='/'?[-dy,-dx]:[dy,dx];q.push({x,y,dx:rx,dy:ry,c});continue}
   if(p.k[0]=='f'){c&=PIECES[p.k].c;if(!c)break;segs.push({pts:pts.slice(),c:b.c});pts.length=0;pts.push([x,y]);b={c};continue}
   if(p.k=='prism'){if(c&1)q.push({x,y,dx:dy,dy:-dx,c:1});if(c&4)q.push({x,y,dx:-dy,dy:dx,c:4});if(c&2){c=2;segs.push({pts:pts.slice(),c:b.c});pts.length=0;pts.push([x,y]);b={c};continue}break}}
  segs.push({pts,c:b.c})}
 const win=L.t.every(t=>(hit[key(t[0],t[1])]||0)===t[2]);return{segs,hit,win}}
function menu(){const tot=LV.length*3,got=LV.reduce((a,l)=>a+(SAVE.stars[l.id]||0),0);
 app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:54px">🔦🌈🪞</div><h2 style="margin:4px">Light Lab</h2><p style="color:var(--mut)">Bend, bounce, split and mix laser beams to light up every target. Discover how light really works!</p><div class="bar"><i style="width:${got/tot*100}%"></i></div><p class="stars">${got}/${tot} ★</p></div>
 <div class="grid" style="margin-top:12px"><div class="card tile" id="mL"><div class="em">📖</div><h3>Learn</h3><p>Reflection, refraction, color mixing, shadows, lenses.</p></div>
 <div class="card tile" id="mP"><div class="em">🔦</div><h3>Laser puzzles</h3><p>${LV.length} optics puzzles.</p></div>
 <div class="card tile" id="mQ"><div class="em">❓</div><h3>Quiz</h3><p>10 questions. ${starStr(SAVE.stars.quiz||0)}</p></div>
 <div class="card tile" id="mT"><div class="em">⏱️</div><h3>Timed challenge</h3><p>60 seconds! ${starStr(SAVE.stars.timed||0)}</p></div></div>`;
 $('#mL').onclick=()=>{SFX.click();learn(0)};$('#mP').onclick=()=>{SFX.click();levels()};$('#mQ').onclick=()=>{SFX.click();runQuiz('quiz','Light Quiz',QS,0,menu)};$('#mT').onclick=()=>{SFX.click();runQuiz('timed','Timed Challenge',QS,60,menu)}}
const LEARN=[
{h:'💡 Light travels in straight lines',p:'Light moves in straight lines called rays, at about 300,000 km every second — fast enough to circle Earth 7½ times in one second! Sunlight takes about 8 minutes to reach us.',k:'rays'},
{h:'🪞 Reflection',p:'When light hits a mirror it bounces off. The <b>angle of incidence</b> (coming in) equals the <b>angle of reflection</b> (going out). That is why a mirror at 45° turns a beam by 90°.',k:'reflect'},
{h:'🔍 Refraction',p:'Light slows down when it goes from air into water or glass, and that makes it bend. A straw in a glass of water looks broken because of refraction!',k:'refract'},
{h:'🌈 Prisms and rainbows',p:'White light is a mix of all colors. A prism bends each color a different amount — violet and blue bend the most, red the least — so the colors spread out. Raindrops do the same to make rainbows: red, orange, yellow, green, blue, indigo, violet.',k:'prism'},
{h:'🔴🟢🔵 Mixing light',p:'Light mixes differently from paint! The primary colors of light are <b>red, green and blue</b>. Red + green = yellow, red + blue = magenta, green + blue = cyan, and all three = white. Phone and TV screens make every color from tiny red, green and blue dots.',k:'mix'},
{h:'🟥 Filters',p:'A colored filter only lets its own color through and absorbs the rest. A red filter turns white light red — but it blocks green light completely!',k:'filter'},
{h:'⬛ Shadows',p:'An opaque object blocks light. Because light travels in straight lines, it cannot bend around the object, so a dark shadow forms behind it. Transparent things (glass) let light through, translucent things (wax paper) let some through.',k:'shadow'},
{h:'👓 Lenses',p:'A <b>convex</b> lens (thicker in the middle) bends light inward to a focus point — magnifying glasses, cameras and your eyes use them. A <b>concave</b> lens (thinner in the middle) spreads light out and helps near-sighted people see far away.',k:'lens'}];
function learn(i){const m=LEARN[i];app.innerHTML=`<div class="card"><div class="row"><b style="flex:1">${i+1} / ${LEARN.length}</b><button class="btn alt" id="bk">Menu</button></div><div style="text-align:center"><canvas id="lc" width="440" height="200" style="max-width:100%;background:#05081a;border-radius:14px"></canvas></div><h2>${m.h}</h2><p>${m.p}</p>
 <div class="row"><button class="btn alt" id="pv" ${i?'':'disabled'}>← Prev</button><span style="flex:1"></span><button class="btn" id="nx">${i<LEARN.length-1?'Next →':'Done ✓'}</button></div></div>`;
 $('#bk').onclick=menu;$('#pv').onclick=()=>learn(i-1);$('#nx').onclick=()=>{SFX.click();i<LEARN.length-1?learn(i+1):(SFX.win(),confetti(),menu())};demo($('#lc'),m.k)}
function glow(g,c,w=5){g.strokeStyle=c;g.shadowColor=c;g.shadowBlur=14;g.lineWidth=w;g.lineCap='round'}

 if(k=='rays'){glow(g,'#ffe680',3);for(let a=-3;a<=3;a++)pl(g,[[60,100],[60+380,100+a*30]]);g.shadowBlur=0;g.fillStyle='#ffd34d';g.beginPath();g.arc(60,100,24,0,7);g.fill()}
 if(k=='reflect'){g.fillStyle='#9fd8ff';g.fillRect(40,170,360,8);const a=.4+s*.6,x=220;glow(g,'#ff4040');pl(g,[[x-Math.cos(a)*200,170-Math.sin(a)*200],[x,170],[x+Math.cos(a)*200,170-Math.sin(a)*200]]);g.shadowBlur=0;g.setLineDash([4,4]);g.strokeStyle='#fff6';g.lineWidth=1;pl(g,[[x,170],[x,20]]);g.setLineDash([])}
 if(k=='refract'){g.fillStyle='#2a6cff55';g.fillRect(0,100,440,100);glow(g,'#ff4040');pl(g,[[40,0],[200,100],[260,200]]);g.shadowBlur=0;g.fillStyle='#fff';g.font='14px sans-serif';g.fillText('air',10,90);g.fillText('water — light bends!',10,190)}
 if(k=='prism'||k=='lens'||k=='mix'||k=='filter'||k=='shadow'){}
 if(k=='prism'){g.fillStyle='#bfe8ff44';g.strokeStyle='#bfe8ff';g.lineWidth=2;g.beginPath();g.moveTo(220,30);g.lineTo(290,170);g.lineTo(150,170);g.closePath();g.fill();g.stroke();glow(g,'#fff',4);pl(g,[[0,120],[190,110]]);['#ff2020','#ff8a00','#ffe600','#30ff40','#2080ff','#4b40ff','#a040ff'].forEach((cl,j)=>{glow(g,cl,3);pl(g,[[190,110],[255,115+j*2],[440,120+j*12+s*4]])})}
 if(k=='mix'){g.globalCompositeOperation='lighter';[[180,80,'#f00'],[260,80,'#0f0'],[220,140,'#00f']].forEach(([x,y,cl])=>{g.fillStyle=cl;g.beginPath();g.arc(x+Math.sin(t+x)*8,y,60,0,7);g.fill()});g.globalCompositeOperation='source-over'}
 if(k=='filter'){glow(g,'#fff');pl(g,[[0,100],[200,100]]);glow(g,'#ff3030');pl(g,[[220,100],[440,100]]);g.shadowBlur=0;g.fillStyle='#ff303099';g.fillRect(200,40,20,120)}
 if(k=='shadow'){const lx=60+s*80;g.fillStyle='#ffe68044';g.beginPath();g.moveTo(lx,100);g.lineTo(440,0);g.lineTo(440,200);g.fill();g.fillStyle='#05081a';const bx=240;g.beginPath();g.moveTo(bx,80);g.lineTo(440,80+(80-100)*(440-bx)/(bx-lx));g.lineTo(440,120+(120-100)*(440-bx)/(bx-lx));g.lineTo(bx,120);g.fill();g.fillStyle='#8a8f9e';g.fillRect(bx-10,80,20,40);g.fillStyle='#ffd34d';g.beginPath();g.arc(lx,100,12,0,7);g.fill()}

 g.shadowBlur=0;requestAnimationFrame(f)})(t0)}

   if(p.k[0]=='f'){g.fillStyle=CC[PIECES[p.k].c]+'88';g.strokeStyle=CC[PIECES[p.k].c];g.lineWidth=3;g.fillRect(-14,-38,28,76);g.strokeRect(-14,-38,28,76)}g.restore()}
  G=requestAnimationFrame(draw)})(performance.now())}
