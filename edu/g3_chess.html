// ---------- level data ----------
const PIECEINFO={R:'The ROOK moves any number of squares in straight lines: up, down, left or right.',B:'The BISHOP moves any number of squares diagonally. It always stays on one colour!',Q:'The QUEEN combines rook + bishop: straight lines AND diagonals, any distance.',N:'The KNIGHT jumps in an L-shape: two squares one way, then one square sideways. It can jump over pieces!',K:'The KING moves one square in any direction. He can never move into check.',P:'PAWNS move forward one square (two on their first move) but CAPTURE diagonally.'};
const LV=[
{name:'The rook',m:'move',p:'R'},{name:'The bishop',m:'move',p:'B'},{name:'The queen',m:'move',p:'Q'},{name:'The knight',m:'move',p:'N'},{name:'The king',m:'move',p:'K'},{name:'The pawn',m:'move',p:'P'},
{name:'Capture!',m:'cap'},{name:'Check or not?',m:'stat3'},{name:'Castling',m:'castle',n:3},{name:'En passant',m:'ep',n:3},{name:'Promotion',m:'promo',n:3},{name:'Check, mate or stalemate?',m:'stat4'},
{name:'Mate in one',m:'mate',pool:1,n:5},{name:'Mate in one: harder',m:'mate',pool:2,n:5},{name:'Chess School graduation',m:'mix'}];
const TIPS={0:PIECEINFO.R+' Tap the rook to see its moves, then tap the ⭐.',1:PIECEINFO.B,2:PIECEINFO.Q,3:PIECEINFO.N,4:PIECEINFO.K,5:PIECEINFO.P,6:'To capture, move onto an enemy piece\'s square. Capture the piece with the ⭐.',7:'CHECK means the king is under attack. The player in check MUST get out of it.',8:'CASTLING: the king moves two squares towards a rook, and the rook jumps over to the other side. Not allowed if the king or rook has moved, pieces are in between, or the king is in check or passes through an attacked square.',9:'EN PASSANT: if an enemy pawn moves two squares and lands right beside your pawn, you may capture it as if it had moved only one — but only on the very next move!',10:'PROMOTION: a pawn that reaches the far side becomes a new piece — usually a queen!',11:'CHECKMATE = in check with no way out (game over). STALEMATE = NOT in check but no legal moves (a draw).',12:'Find the move that checkmates the black king. Tap your piece, then its square.'};
function rndPos(p,extra){for(;;){const B=Array(64).fill(null);const s=p==='P'?ri(1,6)*8+ri(0,7)+8*0:ri(0,63);if(p==='P'&&(s<8||s>=56))continue;B[s]=p;for(let i=0;i<extra;i++){const t=ri(0,63);if(!B[t])B[t]=pick(['p','n','b','P'])}const P={B,t:'w',c:'',ep:-1};if(p==='P'&&Math.random()<.5&&s>=48)return{P,s};return{P,s}}}
function makeQ(){const L=LV[cur];let m=L.m;if(m==='mix')m=pick(['move','cap','stat4','mate','castle','ep','promo']);const q={m,used:(Q&&Q.used)||[],sel:-1};
 if(m==='move'){const p=L.p||pick(['R','B','Q','N','K','P']);if(qi%2===1&&L.m!=='mix'){let r;do r=rndPos(p,ri(0,3));while(legalFrom(r.P,r.s).length<2);q.P=r.P;q.cnt=legalFrom(r.P,r.s).length;q.m='count';q.piece=r.s;q.text='How many squares can this '+pname(p)+' move to? (tap it to check!)';q.opts=mo(String(q.cnt),[q.cnt+1,q.cnt-1,q.cnt+2,q.cnt-2].filter(v=>v>0).map(String));q.ans=String(q.cnt);q.why=PIECEINFO[p];q.free=1;return q}
  let r,ms;do{r=rndPos(p,ri(0,3));ms=legalFrom(r.P,r.s).filter(m=>!r.P.B[m.t])}while(!ms.length);q.P=r.P;q.goal=[pick(ms).t];q.text='Move the '+pname(p)+' to the ⭐.';q.okMsg=PIECEINFO[p]}
 else if(m==='cap'){for(;;){const p=pick(['R','B','Q','N','P']),r=rndPos(p,0);for(let i=0;i<3;i++){const t=ri(0,63);if(!r.P.B[t])r.P.B[t]=pick(['p','n','b','r'])}const caps=legalFrom(r.P,r.s).filter(m=>r.P.B[m.t]);if(caps.length){q.P=r.P;q.goal=[pick(caps).t];q.text='Capture the black piece marked ⭐ with your '+pname(p)+'.';break}}}
 else if(m==='stat3'||m==='stat4'){const pool=STAT.concat(POOL1.map(f=>{const P=parse(f);return {P:make(P,mates(P)[0])}}));const it=pick(pool);q.P=typeof it==='string'?parse(it):it.P;q.ans=status(q.P);if(m==='stat3'&&q.ans==='Stalemate')return makeQ();q.text='Look at the BLACK king. What is the situation?';q.opts=m==='stat3'?['Check','Checkmate','Not in check']:['Check','Checkmate','Stalemate','Not in check'];q.why={Check:'The king is attacked but has a way out.',Checkmate:'The king is attacked and has no escape — game over!',Stalemate:'Black is NOT in check but has no legal move — a draw.','Not in check':'Nothing attacks the black king right now.'}[q.ans];q.free=0}
 else if(m==='castle'){const k=L.m==='mix'?ri(0,2):qi;if(k===2){q.P=parse('4k3/8/b7/8/8/8/8/R3K2R w KQ -');q.text='Castle! (Careful: one side is attacked by the bishop.)'}else{q.P=parse('r3k2r/pppppppp/8/8/8/8/PPPPPPPP/R3K2R w KQkq -');q.text='Castle '+(k?'QUEENSIDE (long, towards the a-rook)':'KINGSIDE (short, towards the h-rook)')+'. Tap the king first.'}q.goal=legal(q.P).filter(m=>m.castle&&(k===2||m.castle===(k?'Q':'K'))).map(m=>m.t);q.okMsg='Castled! The king is tucked away safely and the rook joins the game.'}
 else if(m==='ep'){const f=ri(0,7),dc=f===0?1:f===7?-1:pick([-1,1]);const B=Array(64).fill(null);B[3*8+f]='P';B[3*8+f+dc]='p';B[60]='K';B[4]='k';q.P={B,t:'w',c:'',ep:2*8+f+dc};q.goal=[2*8+f+dc];q.text='Black\'s pawn just moved two squares, landing beside yours. Capture it EN PASSANT!';q.okMsg='En passant! Your pawn captured diagonally onto the square the black pawn skipped.'}
 else if(m==='promo'){const f=ri(0,7),B=Array(64).fill(null);B[8+f]='P';B[60]='K';B[f===0?7:0]='k';if(Math.random()<.5&&f<7){B[f+1]='r';q.goal=[f,f+1]}else q.goal=[f];q.P={B,t:'w',c:'',ep:-1};q.text='Get your pawn to the last row and promote it to a QUEEN!';q.okMsg='Promoted to a queen! ♛'}
 else{const pool=(L.pool===2||(L.m==='mix'&&Math.random()<.5))?POOL2:POOL1;let left=pool.filter(f=>!q.used.includes(f));const f=pick(left.length?left:pool);q.used=q.used.concat(f);q.P=parse(f);q.goal=null;q.mates=mates(q.P);q.text='White to move: find CHECKMATE in one move.';q.okMsg='Checkmate! The black king has no escape.'}
 return q}
const pname=p=>({R:'rook',B:'bishop',Q:'queen',N:'knight',K:'king',P:'pawn'})[p.toUpperCase()];
// ---------- board UI ----------
const GLY={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
let kc={r:7,c:4,on:false};
function bd(){const s=Math.floor((H-16)/8);return{s,x:10,y:Math.round((H-s*8)/2)}}
function drawBoard(q){const D=bd(),s=D.s;const hl=q.sel>=0?legalFrom(q.P,q.sel):[];
 for(let i=0;i<64;i++){const [r,c]=RC(i),x=D.x+c*s,y=D.y+r*s;cx.fillStyle=(r+c)%2?'#5f9e8f':'#e9f1df';cx.fillRect(x,y,s,s);if(i===q.sel){cx.fillStyle='#f4d35e99';cx.fillRect(x,y,s,s)}if(q.last&&(q.last.f===i||q.last.t===i)){cx.fillStyle='#f4a26155';cx.fillRect(x,y,s,s)}}
 for(let i=0;i<64;i++){const [r,c]=RC(i),x=D.x+c*s,y=D.y+r*s,p=q.P.B[i];if(q.goal&&q.goal.includes(i)&&!lock&&!q.free)txt('⭐',x+s/2,y+s/2,s*.55);if(p){cx.font=Math.round(s*.8)+'px "Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle=isW(p)?'#fff':'#1a1a1a';cx.strokeStyle=isW(p)?'#222':'#000';cx.lineWidth=1.2;const g=GLY[p.toLowerCase()]+'\uFE0E';cx.fillText(g,x+s/2,y+s/2+2);if(isW(p))cx.strokeText(g,x+s/2,y+s/2+2)}}
 hl.forEach(m=>{const [r,c]=RC(m.t),x=D.x+c*s,y=D.y+r*s;cx.fillStyle=q.P.B[m.t]||m.ep?'#e63946cc':'#1d3557aa';cx.beginPath();cx.arc(x+s/2,y+s/2,q.P.B[m.t]?s*.45:s*.15,0,7);q.P.B[m.t]?(cx.lineWidth=4,cx.strokeStyle='#e63946',cx.stroke()):cx.fill()});
 if(kc.on){cx.strokeStyle='#f4a261';cx.lineWidth=3;cx.strokeRect(D.x+kc.c*s+2,D.y+kc.r*s+2,s-4,s-4)}
 cx.font='600 9px system-ui';cx.fillStyle='#234';for(let c=0;c<8;c++)txt('abcdefgh'[c],D.x+c*s+s-6,D.y+8*s-6,9,(c%2)?'#234':'#cde');for(let r=0;r<8;r++)txt(String(8-r),D.x+5,D.y+r*s+7,9,r%2?'#cde':'#234')}
function boardTap(i){const q=Q;if(lock||!q.P)return;const p=q.P.B[i];if(q.sel>=0){const m=legalFrom(q.P,q.sel).find(m=>m.t===i);if(m){doMove(m);return}}if(p&&isW(p)){q.sel=i;sfx.tap();msg=q.free?'This '+pname(p)+' can reach '+legalFrom(q.P,i).length+' squares.':'';msgCol='#cde'}else q.sel=-1;draw()}
function doMove(m){const q=Q;if(q.free){q.sel=-1;draw();return}const np=make(q.P,m);q.P=np;q.last=m;q.sel=-1;sfx.tap();
 if(q.kind==='mate'){const st=status(np);if(st==='Checkmate')return good(q.okMsg+(q.mates.length>1?' (This puzzle has '+q.mates.length+' mating moves — any one counts.)':''));bad(st==='Check'?'That is check, but not mate — the king can escape. Try again!':st==='Stalemate'?'Stalemate — a draw! Black has no moves but isn\'t in check.':'That isn\'t check. Look for a move that attacks the king with no escape.');setTimeout(()=>{if(Q===q&&!lock){q.P=q.P0||q.P;draw()}},900);return}
 if(q.goal.includes(m.t)){return good(q.okMsg||'Nice move!')}bad('Good legal move, but not the one we need. Try again!');setTimeout(()=>{if(Q===q&&!lock){q.P=q.P0;q.last=null;draw()}},900)}
CUSTOM.board={draw(q){drawBoard(q);const D=bd(),px=D.x+D.s*8+16,pw=W-px-12;wrapC(q.text,px+pw/2,48,pw,15,'#fff',4);
 if(q.opts){const bh=38;q.opts.forEach((o,i)=>{const by=96+i*(bh+8);let c='#283070';if(q.picked!=null){if(o===q.ans)c='#2a8a3a';else if(o===q.picked)c='#a33'}card(px,by,pw,bh,c);txt((i+1)+'  '+o,px+pw/2,by+bh/2,15);btns.push({x:px,y:by,w:pw,h:bh,f:()=>choose(o)})})}
 else{wrapC(q.sel>=0?'Dots = legal moves. Rings = captures. Tap one!':'Tap one of your WHITE pieces to see where it can go.',px+pw/2,120,pw,12,'#9ec')}
 if(msg)wrapC(msg,px+pw/2,H-40,pw,13,msgCol);
 for(let i=0;i<64;i++){const [r,c]=RC(i);btns.unshift({x:D.x+c*D.s,y:D.y+r*D.s,w:D.s,h:D.s,f:()=>boardTap(i)})}},
 key(e,q){const k=e.key;const n=+k;if(q.opts&&n>=1&&n<=q.opts.length)return choose(q.opts[n-1]);const mv={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]}[k];if(mv){e.preventDefault();kc.on=true;kc.r=Math.max(0,Math.min(7,kc.r+mv[0]));kc.c=Math.max(0,Math.min(7,kc.c+mv[1]));draw()}else if(k==='Enter'||k===' '){e.preventDefault();kc.on=true;boardTap(kc.r*8+kc.c)}}};
const _mk=makeQ;makeQ=function(){const q=_mk();q.P0=q.P;q.m0=q.m;q.m='board';q.kind=q.m0;return q};
window.G={bd,inCheck,get Q(){return Q},LV,parse,legal,legalFrom,status,mates,make,MATE1,MATE2,POOL1,POOL2,STAT,nm};
resize();cur=0;Q=makeQ();draw();showLevels();
