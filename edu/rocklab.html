<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Rock Cycle Lab</title>
<style>
:root{--bg:#0f1530;--card:#1b2350;--ink:#f4f6ff;--mut:#9aa6d8;--acc:#ff9a4d;--good:#3ddc84;--bad:#ff5c7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,#2a3480,var(--bg) 60%);color:var(--ink);min-height:100vh;user-select:none;-webkit-user-select:none;overflow-x:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0008;position:sticky;top:0;z-index:5;backdrop-filter:blur(4px)}
header a{color:var(--ink);text-decoration:none;background:#fff1;padding:6px 12px;border-radius:20px;font-weight:bold}
header h1{font-size:20px;margin:0;flex:1;color:var(--acc);text-shadow:0 2px 0 #0006}
.pill{background:#fff1;padding:5px 10px;border-radius:14px;font-size:14px}
main{max-width:980px;margin:0 auto;padding:14px}
.btn{font:inherit;font-weight:bold;border:0;border-radius:14px;padding:10px 16px;background:var(--acc);color:#111;cursor:pointer;box-shadow:0 4px 0 #0007;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}.btn.alt{background:#2c3770;color:var(--ink)}.btn.sel{outline:3px solid #fff}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 6px 18px #0005;border:2px solid #ffffff10}
.tile{cursor:pointer;transition:transform .15s}.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile .em{font-size:40px}.tile h3{margin:6px 0}.tile p{margin:0;color:var(--mut);font-size:14px}
.stars{color:#ffd34d;letter-spacing:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{min-height:28px;font-weight:bold;font-size:18px;margin:8px 0}
.opt{display:block;width:100%;margin:6px 0;text-align:left;background:#2c3770;color:var(--ink)}
.opt.ok{background:var(--good);color:#111}.opt.no{background:var(--bad)}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.12)}}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
.bar{height:10px;background:#fff2;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);transition:width .3s}
.fact{background:#ffd34d22;border-left:4px solid #ffd34d;padding:8px 12px;border-radius:8px;margin:8px 0}
svg text{font-family:inherit}
</style></head><body>
<header><a href="./index.html">← Learning Lab</a><h1>Rock Cycle Lab</h1><span class="pill" id="starTotal">⭐ 0</span><button class="btn alt" id="snd" style="padding:6px 10px">🔊</button></header>
<main id="app"></main><canvas id="fx"></canvas>
<script>
// ---- shared helpers ----
const $=s=>document.querySelector(s),app=$('#app');
const SAVEKEY='__KEY__';let SAVE=JSON.parse(localStorage.getItem(SAVEKEY)||'{}');SAVE.stars=SAVE.stars||{};SAVE.best=SAVE.best||{};
function save(){localStorage.setItem(SAVEKEY,JSON.stringify(SAVE));$('#starTotal').textContent='⭐ '+Object.values(SAVE.stars).reduce((a,b)=>a+b,0)}
let AC=null,muted=!!SAVE.muted;$('#snd').textContent=muted?'🔇':'🔊';
$('#snd').onclick=()=>{muted=!muted;SAVE.muted=muted;save();$('#snd').textContent=muted?'🔇':'🔊'};
function tone(f,d=.12,type='sine',v=.15,slide=0,delay=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d=.4,v=.2,lp=800){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=lp;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}catch(e){}}
const SFX={click:()=>tone(660,.05,'square',.06),good:()=>{tone(523,.1,'triangle');tone(784,.15,'triangle',.15,0,.08)},bad:()=>tone(200,.25,'sawtooth',.08,-80),
win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.15,0,i*.1)),pick:()=>tone(440,.06,'sine',.1,200),drop:()=>tone(330,.08,'sine',.12,-100)};
// confetti
const cv=$('#fx'),cx=cv.getContext('2d');let fxp=[];function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
function confetti(x=innerWidth/2,y=innerHeight/3,n=60){for(let i=0;i<n;i++)fxp.push({x,y,vx:(Math.random()-.5)*10,vy:-Math.random()*9-2,c:`hsl(${Math.random()*360},90%,60%)`,l:90});}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);fxp=fxp.filter(p=>p.l-->0);for(const p of fxp){p.vy+=.3;p.x+=p.vx;p.y+=p.vy;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,7,7)}requestAnimationFrame(loop)})();
function flash(el,ok){el.classList.remove('pop','shake');void el.offsetWidth;el.classList.add(ok?'pop':'shake')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function starStr(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function award(id,n){if((SAVE.stars[id]||0)<n)SAVE.stars[id]=n;save()}
// generic timed quiz: qs=[{q,opts,a,fact}] ; a is correct string
function runQuiz(id,title,qs,secs,back){let i=0,score=0,t=secs,timer;qs=shuffle(qs).slice(0,10);
 function end(){clearInterval(timer);const st=score>=9?3:score>=7?2:score>=5?1:0;award(id,st);if(score>(SAVE.best[id]||0))SAVE.best[id]=score;save();if(st)SFX.win(),confetti();
  app.innerHTML=`<div class="card" style="text-align:center"><h2>${title} — done!</h2><div style="font-size:48px" class="stars">${starStr(st)}</div><p>You got <b>${score}/${qs.length}</b>. Best: ${SAVE.best[id]}</p><div class="row" style="justify-content:center"><button class="btn" id="ag">Play again</button><button class="btn alt" id="bk">Back</button></div></div>`;$('#ag').onclick=()=>runQuiz(id,title,qs,secs,back);$('#bk').onclick=back}
 function show(){if(i>=qs.length)return end();const q=qs[i];app.innerHTML=`<div class="card"><div class="row"><b style="flex:1">${title} · Q${i+1}/${qs.length}</b>${secs?`<span class="pill">⏱ <span id="tm">${t}</span>s</span>`:''}<span class="pill">✅ ${score}</span></div><div class="bar" style="margin:8px 0"><i style="width:${i/qs.length*100}%"></i></div>${q.svg||''}<h2>${q.q}</h2><div id="os"></div><div class="fb" id="fb"></div></div>`;
  shuffle(q.opts).forEach(o=>{const b=document.createElement('button');b.className='btn opt';b.innerHTML=o;b.onclick=()=>{if(b.parentNode.dataset.done)return;b.parentNode.dataset.done=1;const ok=o==q.a;if(ok){score++;SFX.good();confetti(innerWidth/2,innerHeight/2,20)}else SFX.bad();[...$('#os').children].forEach(x=>{if(x.innerHTML==q.a)x.classList.add('ok')});if(!ok)b.classList.add('no');flash(b,ok);$('#fb').innerHTML=(ok?'✅ Correct! ':'❌ Not quite. ')+(q.fact?`<div class="fact">💡 ${q.fact}</div>`:'');setTimeout(()=>{i++;show()},q.fact?2200:1100)};$('#os').appendChild(b)})}
 if(secs)timer=setInterval(()=>{t--;const e=$('#tm');if(e)e.textContent=t;if(t<=5&&t>0)tone(880,.05);if(t<=0)end()},1000);show()}
save();
</script>
<script>
const TYPES={ign:{n:'Igneous rock',c:'#d0574a',em:'🌋',ex:['Granite','Basalt','Obsidian','Pumice'],d:'Forms when melted rock (magma or lava) cools and hardens.'},
sed:{n:'Sedimentary rock',c:'#d9b26a',em:'🏜️',ex:['Sandstone','Limestone','Shale','Conglomerate'],d:'Forms when layers of sediment get pressed and cemented together. Often holds fossils!'},
met:{n:'Metamorphic rock',c:'#8a7ad8',em:'💎',ex:['Marble','Slate','Gneiss','Quartzite'],d:'Forms when rock is changed by heat and pressure deep underground, without melting.'},
mag:{n:'Magma',c:'#ff7a1a',em:'🔥',ex:['Magma'],d:'Melted rock below the surface. When it reaches the surface it is called lava.'},
sdm:{n:'Sediment',c:'#b7a07a',em:'⏳',ex:['Sand','Mud','Pebbles'],d:'Tiny bits of broken rock, sand and mud carried by water, wind and ice.'}};
const PROC={weather:{n:'Weathering & erosion',em:'🌧️'},compact:{n:'Compaction & cementation',em:'🗜️'},heat:{n:'Heat & pressure',em:'♨️'},melt:{n:'Melting',em:'🔥'},cool:{n:'Cooling & hardening',em:'❄️'}};
const NEXT={ign:{weather:'sdm',heat:'met',melt:'mag'},sed:{weather:'sdm',heat:'met',melt:'mag'},met:{weather:'sdm',heat:'met',melt:'mag'},mag:{cool:'ign'},sdm:{compact:'sed'}};
const POS={ign:[300,70],sdm:[510,210],sed:[420,420],met:[180,420],mag:[90,210]};
const MISS=[{from:'mag',to:'ign',par:1,ex:'Basalt',t:'Cool the magma into igneous rock'},{from:'ign',to:'sed',par:2,ex:'Sandstone',t:'Turn granite into sedimentary rock'},
{from:'sed',to:'met',par:1,ex:'Marble',t:'Turn limestone into marble (metamorphic)'},{from:'met',to:'ign',par:2,ex:'Granite',t:'Turn slate into igneous rock'},
{from:'sdm',to:'met',par:2,ex:'Slate',t:'Turn mud into slate'},{from:'ign',to:'ign',par:4,via:'sed',ex:'Granite',t:'Take granite all the way around: through sedimentary rock and back to igneous rock'}];
const CYCFACT={sdm:'Rivers carry sediment to lakes and oceans, where it settles in layers.',sed:'Limestone is often made from the shells of ancient sea creatures!',met:'Limestone + heat and pressure = marble. Shale + heat and pressure = slate.',mag:'Magma deep underground can be hotter than 1,000 °C!',ign:'Obsidian is volcanic glass that cools so fast that crystals cannot form.'};
function menu(){app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:54px">🪨🌋🌍</div><h2 style="margin:4px">Rock Cycle Lab</h2><p style="color:var(--mut)">Be a geologist! Change rocks, explore inside the Earth, erupt volcanoes and test minerals.</p></div><div class="grid" id="m"></div>`;
 [['cyc','🔄','Rock Cycle Sim','Use heat, pressure and weather to turn rocks into other rocks.',cycle],['lay','🌍','Earth\'s Layers','Label the layers inside our planet.',layers],['vol','🌋','Volcano Lab','Build pressure and make different volcanoes erupt.',volcano],['moh','💎','Mineral Scratch Test','Test hardness and rank minerals on the Mohs scale.',mohs],['qz','⏱️','Geo Quiz','60-second earth science challenge.',()=>runQuiz('quiz','Geo Quiz',QZ,60,menu)]].forEach(([id,em,n,p,f])=>{const d=document.createElement('div');d.className='card tile';d.innerHTML=`<div class="em">${em}</div><h3>${n}</h3><p>${p}</p><div class="stars">${starStr(SAVE.stars[id]||0)}</div>`;d.onclick=()=>{SFX.click();f()};$('#m').appendChild(d)})}
function hdr(t,sub){return `<div class="card"><div class="row"><b style="flex:1;font-size:18px">${t}</b><button class="btn alt" onclick="SFX.click();menu()">☰ Menu</button></div>${sub?`<p style="margin:6px 0 0">${sub}</p>`:''}</div>`}
// ---------- rock cycle ----------
let cur,mi,steps,done,vis;
function cycle(m){mi=m??(SAVE.cyc||0)%MISS.length;const M=MISS[mi];cur=M.from;steps=0;done=false;vis=new Set;
 app.innerHTML=hdr('🔄 Rock Cycle Sim',`Mission ${mi+1}/${MISS.length}: <b>${M.t}</b>. Pick a process to apply to your sample.`)+`<div class="card" style="background:#14203c;text-align:center;margin-top:10px"><svg id="cy" viewBox="0 0 600 500" style="width:100%;max-width:620px"></svg></div><div class="row" id="pr" style="margin:10px 0"></div><div class="fb" id="fb"></div><div id="info" class="fact"></div>`;
 for(const k in PROC){const b=document.createElement('button');b.className='btn alt';b.innerHTML=PROC[k].em+' '+PROC[k].n;b.onclick=()=>apply(k,b);$('#pr').appendChild(b)}drawCyc();info()}
function drawCyc(anim){const A=[['ign','sdm','weather'],['sdm','sed','compact'],['sed','met','heat'],['met','mag','melt'],['mag','ign','cool'],['sed','sdm','weather'],['met','sdm','weather'],['ign','met','heat'],['sed','mag','melt'],['ign','mag','melt']];let s=`<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa6d8"/></marker></defs>`;
 A.forEach(([a,b,p],i)=>{const[x1,y1]=POS[a],[x2,y2]=POS[b],dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),o=i>4?18:0,nx=-dy/L*o,ny=dx/L*o;s+=`<line x1="${x1+dx/L*62+nx}" y1="${y1+dy/L*62+ny}" x2="${x2-dx/L*62+nx}" y2="${y2-dy/L*62+ny}" stroke="#9aa6d8" stroke-width="${i>4?1.5:3}" stroke-dasharray="${i>4?'4 4':''}" marker-end="url(#ar)" opacity=".7"/>`;if(i<5)s+=`<text x="${(x1+x2)/2+nx}" y="${(y1+y2)/2+ny}" text-anchor="middle" font-size="26">${PROC[p].em}</text>`});
 for(const k in POS){const[x,y]=POS[k],T=TYPES[k],on=k==cur;s+=`<g transform="translate(${x} ${y})"><circle r="56" fill="${T.c}" opacity="${on?1:.35}" stroke="${on?'#fff':'none'}" stroke-width="4">${on?'<animate attributeName="r" values="56;60;56" dur="1.2s" repeatCount="indefinite"/>':''}</circle><text y="-4" text-anchor="middle" font-size="30">${T.em}</text><text y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">${T.n.replace(' rock','')}</text></g>`}
 $('#cy').innerHTML=s}
function info(){const T=TYPES[cur];$('#info').innerHTML=`<b>${T.em} You have: ${T.n}</b> <span style="color:var(--mut)">(e.g. ${T.ex.join(', ')})</span><br>${T.d}`}
function apply(p,b){if(done)return;const nx=NEXT[cur][p];if(!nx||nx==cur&&p=='heat'&&cur=='met'){SFX.bad();flash(b);$('#fb').innerHTML=`❌ ${PROC[p].n} can't do that to ${TYPES[cur].n.toLowerCase()}.`+(cur=='mag'?' Magma has to cool first.':cur=='sdm'?' Loose sediment has to be pressed together first.':'');return}
 steps++;cur=nx;vis.add(nx);({weather:()=>noise(.6,.25,1200),compact:()=>tone(90,.4,'square',.12,-30),heat:()=>{noise(.5,.2,400);tone(200,.4,'sawtooth',.06,300)},melt:()=>{noise(.7,.25,300);tone(120,.6,'sine',.2,-60)},cool:()=>tone(1200,.3,'sine',.1,-800)})[p]();
 drawCyc();info();$('#fb').innerHTML=`${PROC[p].em} ${PROC[p].n} → ${TYPES[cur].em} <b>${TYPES[cur].n}</b>!<div class="fact">💡 ${CYCFACT[cur]}</div>`;
 const M=MISS[mi];if(cur==M.to&&(!M.via||vis.has(M.via))){done=true;const st=steps<=M.par?3:steps<=M.par+2?2:1;SFX.win();confetti();SAVE.cyc=Math.max(SAVE.cyc||0,mi+1);if(mi==MISS.length-1)award('cyc',st);else if(!SAVE.stars.cyc)award('cyc',1);save();
  $('#fb').innerHTML+=`<div>🎉 Mission complete in ${steps} steps! <span class="stars">${starStr(st)}</span></div><button class="btn" id="nx">${mi<MISS.length-1?'Next mission →':'Play again'}</button>`;$('#nx').onclick=()=>cycle((mi+1)%MISS.length)}}
// ---------- layers ----------
const LAY=[{k:'crust',n:'Crust',r:200,c:'#6b8f3a',f:'The thin rocky outer skin we live on: about 5–70 km thick. Thinnest under the oceans.'},{k:'mantle',n:'Mantle',r:185,c:'#e0702a',f:'About 2,900 km thick, the thickest layer. Hot rock that flows very slowly, like super-thick putty.'},{k:'outer',n:'Outer core',r:100,c:'#f5b52a',f:'Liquid iron and nickel. Its swirling creates Earth\'s magnetic field, which makes compasses work!'},{k:'inner',n:'Inner core',r:52,c:'#fff0a0',f:'A solid ball of iron and nickel about as hot as the Sun\'s surface (over 5,000 °C). Huge pressure keeps it solid.'}];
let sel,placed,errs;
function layers(){sel=null;placed={};errs=0;app.innerHTML=hdr('🌍 Earth\'s Layers','Tap a label, then tap the matching layer in the cutaway.')+`<div class="row" style="margin-top:10px;align-items:flex-start"><div class="card" style="flex:1 1 320px;text-align:center;background:#091022"><svg id="ea" viewBox="0 0 440 440" style="width:100%;max-width:440px"></svg></div><div style="flex:1 1 220px"><div id="lb"></div><div class="fb" id="fb"></div></div></div>`;
 shuffle(LAY).forEach(l=>{const b=document.createElement('button');b.className='btn alt opt';b.id='L'+l.k;b.textContent=l.n;b.onclick=()=>{if(placed[l.k])return;sel=l.k;SFX.pick();document.querySelectorAll('#lb .btn').forEach(x=>x.classList.toggle('sel',x==b))};$('#lb').appendChild(b)});drawEarth()}
function drawEarth(){let s='<defs><clipPath id="cut"><path d="M220 220 L440 0 L440 440 Z"/></clipPath></defs>';
 s+=`<circle cx="220" cy="220" r="200" fill="#2a6fd6"/><path d="M90 120 q40 -40 80 -10 q30 30 -10 60 q-40 10 -70 -50z M150 300 q50 -20 70 20 q-10 50 -60 40z M260 70 q40 0 50 30 q-30 10 -50 -30z" fill="#3cae5a"/>`;
 s+=`<g clip-path="url(#cut)">`+LAY.map(l=>`<circle data-l="${l.k}" cx="220" cy="220" r="${l.r}" fill="${l.c}" stroke="#0005" style="cursor:pointer"/>`).join('')+`</g>`;
 LAY.forEach((l,i)=>{const y=[30,90,180,220][i],x=220+[175,140,85,30][i]*.92;if(placed[l.k])s+=`<text x="${Math.min(x+10,400)}" y="${220-([200,150,80,25][i])*.6}" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke" font-weight="bold" font-size="15" text-anchor="middle" pointer-events="none">${l.n}</text>`});
 $('#ea').innerHTML=s;document.querySelectorAll('#ea [data-l]').forEach(c=>c.onclick=e=>{const k=c.dataset.l;const L=LAY.find(x=>x.k==k);
  if(!sel){$('#fb').innerHTML=`<div class="fact">${placed[k]?`<b>${L.n}:</b> ${L.f}`:'Pick a label first!'}</div>`;return}
  if(sel==k){placed[k]=1;SFX.good();confetti(e.clientX,e.clientY,25);$('#L'+k).classList.add('ok');$('#L'+k).classList.remove('sel');sel=null;$('#fb').innerHTML=`✅ <div class="fact"><b>${L.n}:</b> ${L.f}</div>`;drawEarth();
   if(Object.keys(placed).length==4){const st=errs==0?3:errs<3?2:1;award('lay',st);SFX.win();confetti();$('#fb').innerHTML+=`🎉 All layers labeled! <span class="stars">${starStr(st)}</span><br>Tap any layer to read about it again. <button class="btn" onclick="layers()">Again</button>`}}
  else{errs++;SFX.bad();flash($('#ea'));$('#fb').innerHTML='❌ Not that layer. Think about the order from the outside in!'}})}
// ---------- volcano ----------
const VT={shield:{n:'Shield volcano',m:'Runny basalt lava',visc:.15,ex:'Mauna Loa in Hawaiʻi is the largest active volcano on Earth.',rock:'Basalt',shape:'wide, gentle slopes'},strato:{n:'Stratovolcano',m:'Thick, sticky, gas-rich magma',visc:.9,ex:'Mount St. Helens (USA) erupted explosively in 1980.',rock:'Andesite and pumice',shape:'a tall, steep cone built from layers'},cinder:{n:'Cinder cone',m:'Gassy magma that sprays out blobs',visc:.5,ex:'Parícutin in Mexico grew out of a cornfield in 1943!',rock:'Scoria (cinders)',shape:'a small, steep cone'}};
let vt='shield',pres=0,holding=false,vP=[],vRAF,erupting=0,seen;
function volcano(){seen=new Set(SAVE.volSeen||[]);app.innerHTML=hdr('🌋 Volcano Lab','Choose a volcano type, then HOLD the button to build pressure. Release to erupt!')+`<div class="row" id="vt" style="margin:10px 0"></div><div class="card" style="padding:0;overflow:hidden"><canvas id="vc" width="640" height="360" style="width:100%;display:block"></canvas></div><div class="row" style="margin:10px 0"><button class="btn" id="hold" style="flex:1;font-size:20px;touch-action:none">🔥 HOLD to build pressure</button></div><div class="bar"><i id="pb" style="width:0;background:linear-gradient(90deg,#ffd34d,#ff3b3b)"></i></div><div class="fb" id="fb"></div>`;
 for(const k in VT){const b=document.createElement('button');b.className='btn alt'+(k==vt?' sel':'');b.textContent=VT[k].n;b.onclick=()=>{vt=k;SFX.click();volcano()};$('#vt').appendChild(b)}
 const h=$('#hold');h.onpointerdown=e=>{e.preventDefault();holding=true;AC&&AC.resume&&AC.resume()};const up=()=>{if(holding){holding=false;if(pres>.15)erupt()}};h.onpointerup=up;h.onpointerleave=up;
 cancelAnimationFrame(vRAF);pres=0;vP=[];erupting=0;vloop()}
function erupt(){const V=VT[vt],p=pres;erupting=60+p*120;const n=Math.round(40+p*160);for(let i=0;i<n;i++){const ash=V.visc>.7;vP.push({x:320,y:150,vx:(Math.random()-.5)*(ash?6:3+V.visc*8)*p,vy:-(Math.random()*(ash?14:8)+(ash?6:2))*p-1,r:ash?6+Math.random()*10:3+Math.random()*4,ash:ash&&Math.random()<.7,l:120+Math.random()*80})}
 noise(.6+p*1.5,.2+p*.3,V.visc>.7?2000:500);tone(60,1,'sine',.3,-20);pres=0;seen.add(vt);SAVE.volSeen=[...seen];award('vol',seen.size);
 $('#fb').innerHTML=`${p>.8?'💥 HUGE':'🌋'} eruption! <b>${V.n}</b>: ${V.m}, which builds ${V.shape}. Rock formed: <b>${V.rock}</b>.<div class="fact">💡 ${V.ex}</div>${seen.size<3?`Try all 3 types for 3 stars (${seen.size}/3).`:'⭐⭐⭐ You erupted all three types!'}`}
