<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Power Town</title>
<style>
:root{--bg:#0f1530;--card:#1b2350;--ink:#f4f6ff;--mut:#9aa6d8;--acc:#5be3a0;--good:#3ddc84;--bad:#ff5c7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,#2a3480,var(--bg) 60%);color:var(--ink);min-height:100vh;user-select:none;-webkit-user-select:none;overflow-x:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0008;position:sticky;top:0;z-index:5;backdrop-filter:blur(4px)}
header a{color:var(--ink);text-decoration:none;background:#fff1;padding:6px 12px;border-radius:20px;font-weight:bold}
header h1{font-size:20px;margin:0;flex:1;color:var(--acc);text-shadow:0 2px 0 #0006}
.pill{background:#fff1;padding:5px 10px;border-radius:14px;font-size:14px}
main{max-width:980px;margin:0 auto;padding:14px}
.btn{font:inherit;font-weight:bold;border:0;border-radius:14px;padding:10px 16px;background:var(--acc);color:#111;cursor:pointer;box-shadow:0 4px 0 #0007;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}.btn.alt{background:#2c3770;color:var(--ink)}.btn.sel{outline:3px solid #fff}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 6px 18px #0005;border:2px solid #ffffff10}
.tile{cursor:pointer;transition:transform .15s}.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile .em{font-size:40px}.tile h3{margin:6px 0}.tile p{margin:0;color:var(--mut);font-size:14px}
.stars{color:#ffd34d;letter-spacing:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{min-height:28px;font-weight:bold;font-size:18px;margin:8px 0}
.opt{display:block;width:100%;margin:6px 0;text-align:left;background:#2c3770;color:var(--ink)}
.opt.ok{background:var(--good);color:#111}.opt.no{background:var(--bad)}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.12)}}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
.bar{height:10px;background:#fff2;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);transition:width .3s}
.fact{background:#ffd34d22;border-left:4px solid #ffd34d;padding:8px 12px;border-radius:8px;margin:8px 0}
svg text{font-family:inherit}
</style></head><body>
<header><a href="./index.html">← Learning Lab</a><h1>Power Town</h1><span class="pill" id="starTotal">⭐ 0</span><button class="btn alt" id="snd" style="padding:6px 10px">🔊</button></header>
<main id="app"></main><canvas id="fx"></canvas>
<script>
// ---- shared helpers ----
const $=s=>document.querySelector(s),app=$('#app');
const SAVEKEY='g1_powerTown';let SAVE=JSON.parse(localStorage.getItem(SAVEKEY)||'{}');SAVE.stars=SAVE.stars||{};SAVE.best=SAVE.best||{};
function save(){localStorage.setItem(SAVEKEY,JSON.stringify(SAVE));$('#starTotal').textContent='⭐ '+Object.values(SAVE.stars).reduce((a,b)=>a+b,0)}
let AC=null,muted=!!SAVE.muted;$('#snd').textContent=muted?'🔇':'🔊';
$('#snd').onclick=()=>{muted=!muted;SAVE.muted=muted;save();$('#snd').textContent=muted?'🔇':'🔊'};
function tone(f,d=.12,type='sine',v=.15,slide=0,delay=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d=.4,v=.2,lp=800){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=lp;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}catch(e){}}
const SFX={click:()=>tone(660,.05,'square',.06),good:()=>{tone(523,.1,'triangle');tone(784,.15,'triangle',.15,0,.08)},bad:()=>tone(200,.25,'sawtooth',.08,-80),
win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.15,0,i*.1)),pick:()=>tone(440,.06,'sine',.1,200),drop:()=>tone(330,.08,'sine',.12,-100)};
// confetti
const cv=$('#fx'),cx=cv.getContext('2d');let fxp=[];function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
function confetti(x=innerWidth/2,y=innerHeight/3,n=60){for(let i=0;i<n;i++)fxp.push({x,y,vx:(Math.random()-.5)*10,vy:-Math.random()*9-2,c:`hsl(${Math.random()*360},90%,60%)`,l:90});}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);fxp=fxp.filter(p=>p.l-->0);for(const p of fxp){p.vy+=.3;p.x+=p.vx;p.y+=p.vy;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,7,7)}requestAnimationFrame(loop)})();
function flash(el,ok){el.classList.remove('pop','shake');void el.offsetWidth;el.classList.add(ok?'pop':'shake')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function starStr(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function award(id,n){if((SAVE.stars[id]||0)<n)SAVE.stars[id]=n;save()}
// generic timed quiz: qs=[{q,opts,a,fact}] ; a is correct string
let __QZ=0;function runQuiz(id,title,qs,secs,back){let i=0,score=0,t=secs,timer;const tok=++__QZ;clearInterval(window.__qt);const alive=()=>tok===__QZ&&!!document.getElementById("qz"+tok);qs=shuffle(qs).slice(0,10);
 function end(){clearInterval(timer);if(!alive())return;const st=score>=9?3:score>=7?2:score>=5?1:0;award(id,st);if(score>(SAVE.best[id]||0))SAVE.best[id]=score;save();if(st)SFX.win(),confetti();
  app.innerHTML=`<div class="card" style="text-align:center"><h2>${title} — done!</h2><div style="font-size:48px" class="stars">${starStr(st)}</div><p>You got <b>${score}/${qs.length}</b>. Best: ${SAVE.best[id]}</p><div class="row" style="justify-content:center"><button class="btn" id="ag">Play again</button><button class="btn alt" id="bk">Back</button></div></div>`;$('#ag').onclick=()=>runQuiz(id,title,qs,secs,back);$('#bk').onclick=back}
 function show(){if(i>=qs.length)return end();const q=qs[i];app.innerHTML=`<div class="card" id="qz${tok}"><div class="row"><b style="flex:1">${title} · Q${i+1}/${qs.length}</b>${secs?`<span class="pill">⏱ <span id="tm">${t}</span>s</span>`:''}<span class="pill">✅ ${score}</span></div><div class="bar" style="margin:8px 0"><i style="width:${i/qs.length*100}%"></i></div>${q.svg||''}<h2>${q.q}</h2><div id="os"></div><div class="fb" id="fb"></div></div>`;
  shuffle(q.opts).forEach(o=>{const b=document.createElement('button');b.className='btn opt';b.innerHTML=o;b.onclick=()=>{if(b.parentNode.dataset.done)return;b.parentNode.dataset.done=1;const ok=o==q.a;if(ok){score++;SFX.good();confetti(innerWidth/2,innerHeight/2,20)}else SFX.bad();[...$('#os').children].forEach(x=>{if(x.innerHTML==q.a)x.classList.add('ok')});if(!ok)b.classList.add('no');flash(b,ok);$('#fb').innerHTML=(ok?'✅ Correct! ':'❌ Not quite. ')+(q.fact?`<div class="fact">💡 ${q.fact}</div>`:'');setTimeout(()=>{if(!alive())return;i++;show()},q.fact?2200:1100)};$('#os').appendChild(b)})}
 if(secs)window.__qt=timer=setInterval(()=>{if(!alive()){clearInterval(timer);return}t--;const e=$('#tm');if(e)e.textContent=t;if(t<=5&&t>0)tone(880,.05);if(t<=0)end()},1000);show()}
save();
</script>
<script>
// common menu/learn/levels helpers for g1 games
function learnPage(i){const m=LEARN[i];app.innerHTML=`<div class="card"><div class="row"><b style="flex:1">📖 ${i+1} / ${LEARN.length}</b><button class="btn alt" id="bk">Menu</button></div><div style="text-align:center"><canvas id="lc" width="440" height="200" style="max-width:100%;background:#05081a;border-radius:14px"></canvas></div><h2>${m.h}</h2><p style="line-height:1.5">${m.p}</p>
 <div class="row"><button class="btn alt" id="pv" ${i?'':'disabled'}>← Prev</button><span style="flex:1"></span><button class="btn" id="nx">${i<LEARN.length-1?'Next →':'Done ✓'}</button></div></div>`;
 $('#bk').onclick=menu;$('#pv').onclick=()=>learnPage(i-1);$('#nx').onclick=()=>{SFX.click();if(i<LEARN.length-1)learnPage(i+1);else{SAVE.learned=1;save();SFX.win();confetti();menu()}};
 const c=$('#lc'),g=c.getContext('2d'),t0=performance.now();(function f(n){if(!c.isConnected)return;g.clearRect(0,0,440,200);g.save();m.d(g,(n-t0)/1000);g.restore();requestAnimationFrame(f)})(t0)}
function unlocked(i){return i==0||(SAVE.stars[LV[i-1].id]||0)>0}
function levelGrid(title){app.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1;margin:0">${title}</h2><button class="btn alt" id="bk">Menu</button></div><p style="color:var(--mut)">Earn a star to unlock the next level.</p><div class="grid" id="lg"></div></div>`;$('#bk').onclick=menu;
 LV.forEach((l,i)=>{const d=document.createElement('div'),u=unlocked(i);d.className='card tile lv'+i;d.style.opacity=u?1:.45;d.innerHTML=`<div class="em">${u?l.em||'🎯':'🔒'}</div><h3>${i+1}. ${l.n}</h3><p class="stars">${starStr(SAVE.stars[l.id]||0)}</p>`;d.onclick=()=>{if(!u){SFX.bad();flash(d,0);return}SFX.click();play(i)};$('#lg').appendChild(d)})}
function winLevel(i,st,msg){award(LV[i].id,st);SFX.win();confetti();const last=i>=LV.length-1;
 $('#fb').innerHTML=`🎉 ${msg} <span class="stars">${starStr(st)}</span><div class="row" style="margin-top:6px"><button class="btn" id="nl">${last?'All levels ✓':'Next level →'}</button><button class="btn alt" id="rl">Retry</button></div>`;
 $('#nl').onclick=()=>last?levels():play(i+1);$('#rl').onclick=()=>play(i)}
function mainMenu(em,name,blurb,tiles){const tot=LV.length*3,got=LV.reduce((a,l)=>a+(SAVE.stars[l.id]||0),0);
 app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:54px">${em}</div><h2 style="margin:4px">${name}</h2><p style="color:var(--mut)">${blurb}</p><div class="bar"><i style="width:${got/tot*100}%"></i></div><p class="stars">${got}/${tot} ★</p></div><div class="grid" style="margin-top:12px" id="mg"></div>`;
 tiles.forEach(([id,e,h,p,fn])=>{const d=document.createElement('div');d.className='card tile';d.id=id;d.innerHTML=`<div class="em">${e}</div><h3>${h}</h3><p>${p}</p>`;d.onclick=()=>{SFX.click();fn()};$('#mg').appendChild(d)})}
function stdTiles(qtitle){return[['mQ','❓','Quiz',`10 questions. <span class="stars">${starStr(SAVE.stars.quiz||0)}</span>`,()=>runQuiz('quiz',qtitle,QS,0,menu)],['mT','⏱️','Timed challenge',`60 seconds! <span class="stars">${starStr(SAVE.stars.timed||0)}</span>`,()=>runQuiz('timed','Timed Challenge',QS,60,menu)]]}
// ---- Power Town core ----
const SRC={
solar:{n:'Solar farm',e:'☀️',cap:30,cost:30,co2:48,col:'#ffd34d',f:'Sunlight → electricity (photovoltaic cells). No fuel, no smoke — but nothing at night.'},
wind:{n:'Wind turbines',e:'🌬️',cap:25,cost:30,co2:12,col:'#bfe8ff',f:'Moving air (kinetic) spins blades → generator. Needs about 3 m/s to start and shuts down above ~25 m/s storms.'},
hydro:{n:'Hydro dam',e:'💧',cap:30,cost:60,co2:24,col:'#3d8bff',slot:'river',f:'Falling water (gravitational potential → kinetic) turns turbines. Needs a river.'},
geo:{n:'Geothermal',e:'♨️',cap:20,cost:50,co2:38,col:'#ff7a4d',slot:'hot',f:'Heat from inside Earth makes steam to spin turbines. Needs a hot spot.'},
nuclear:{n:'Nuclear plant',e:'⚛️',cap:60,cost:120,co2:12,col:'#b48cff',f:'Splitting uranium atoms (fission) releases heat → steam → turbine. Very low CO₂, steady day and night.'},
coal:{n:'Coal plant',e:'🏭',cap:40,cost:40,co2:820,col:'#777',f:'Burning coal (chemical → thermal) → steam → turbine. Steady, but the most CO₂ of all.'},
gas:{n:'Gas plant',e:'🔥',cap:30,cost:30,co2:490,col:'#ff9a4d',f:'Burning natural gas → turbine. Can ramp up and down quickly to follow demand.'},
battery:{n:'Battery',e:'🔋',cap:20,cost:40,co2:0,col:'#3ddc84',mwh:80,f:'Stores extra electricity as chemical energy, then gives it back later (up to 20 MW, 80 MWh).'}};
const DEM=[.5,.45,.45,.45,.5,.6,.75,.85,.8,.75,.75,.75,.75,.75,.75,.8,.9,1,1,.95,.85,.75,.65,.55];
const sunAt=h=>Math.max(0,Math.sin(Math.PI*(h+.5-6)/12));
const windP=v=>v<3||v>25?0:v>=12?1:((v-3)/9)**3;
function simDay(L,built){// built: array of keys
 const cnt={};built.forEach(k=>cnt[k]=(cnt[k]||0)+1);let soc=0;const bcap=(cnt.battery||0)*20,bmax=(cnt.battery||0)*80;const H=[];let co2=0,black=0;
 for(let h=0;h<24;h++){const d=L.peak*DEM[h],cl=L.cloud?L.cloud[h]:0,ws=L.wind[h];const out={};
  out.solar=(cnt.solar||0)*30*sunAt(h)*(1-.75*cl);out.wind=(cnt.wind||0)*25*windP(ws);out.hydro=(cnt.hydro||0)*30*(L.drought?.5:1);out.geo=(cnt.geo||0)*20;out.nuclear=(cnt.nuclear||0)*60;out.coal=(cnt.coal||0)*40;
  let base=Object.values(out).reduce((a,b)=>a+b,0),need=d-base;out.battery=0;out.gas=0;
  if(need<0){const ch=Math.min(-need,bcap,bmax-soc);soc+=ch*.9}else{const dis=Math.min(need,bcap,soc);soc-=dis;out.battery=dis;need-=dis;const g=Math.min(need,(cnt.gas||0)*30);out.gas=g;need-=g}
  const used={...out};if(base>d){const sc=d/base;['solar','wind','hydro','geo','nuclear','coal'].forEach(k=>used[k]=out[k]*sc)}// curtailed surplus
  ['coal','gas','solar','wind','hydro','geo','nuclear'].forEach(k=>co2+=(k=='coal'?out.coal:used[k]||0)*SRC[k].co2/1000);// coal burns fuel even if curtailed
  const short=need>0.01;if(short)black++;H.push({h,d,out,used,short,soc,cl,ws})}
 return{H,co2:Math.round(co2),black,cost:built.reduce((a,k)=>a+SRC[k].cost,0)}}
const calm=Array(24).fill(2),breeze=Array(24).fill(10),windy=Array(24).fill(11),night=[11,11,11,11,10,9,7,5,4,3,3,3,3,3,4,5,6,8,10,11,11,11,11,11];
const storm=[9,10,12,14,18,22,27,29,30,28,26,24,20,16,13,11,10,9,8,8,7,7,6,6];
const cloudy=Array(24).fill(1),halfc=[0,0,0,0,0,0,0,0,.2,.6,1,1,1,1,.6,.2,0,0,0,0,0,0,0,0];
const LV=[
{n:'Lights on!',em:'💡',peak:30,slots:['','',''],budget:80,cap:400,s3:170,wind:calm,only:['solar','gas','coal'],tip:'Solar only works in daytime. What can run at night?'},
{n:'Breezy bay',em:'🌬️',peak:40,slots:['','',''],budget:100,cap:300,s3:90,wind:breeze,only:['solar','wind','gas','coal'],tip:'The wind blows all day and night here.'},
{n:'Cloudy day',em:'☁️',peak:45,slots:['','','',''],budget:130,cap:150,s3:15,wind:breeze,cloud:cloudy,only:['solar','wind','gas','battery'],tip:'Thick clouds cut solar output by about three-quarters today. Wind is steady.'},
{n:'River town',em:'💧',peak:55,slots:['river','','',''],budget:130,cap:200,s3:90,wind:night,only:['solar','wind','hydro','gas'],tip:'Rivers flow day and night. Wind is strongest at night here.'},
{n:'Save the sunshine',em:'🔋',peak:40,slots:['','','',''],budget:150,cap:300,s3:170,wind:calm,only:['solar','battery','gas'],tip:'Store extra daytime solar in batteries for the night.'},
{n:'Hot springs',em:'♨️',peak:60,slots:['hot','hot','','',''],budget:170,cap:120,s3:40,wind:night,only:['solar','wind','geo','gas','battery'],tip:'Geothermal runs 24/7 on Earth\'s heat.'},
{n:'Storm warning',em:'⛈️',peak:50,slots:['','','','',''],budget:170,cap:350,s3:185,wind:storm,cloud:halfc,only:['solar','wind','gas','battery','coal'],tip:'In very strong wind (over ~25 m/s), turbines shut down to protect themselves!'},
{n:'Big city',em:'🏙️',peak:90,slots:['','','','',''],budget:220,cap:200,s3:25,wind:breeze,only:['solar','wind','nuclear','gas','coal','battery'],tip:'Nuclear gives a lot of steady, low-carbon power — but it is expensive to build.'},
{n:'Drought',em:'🏜️',peak:60,slots:['river','hot','','','',''],budget:220,cap:120,s3:35,wind:night,drought:1,only:['solar','wind','hydro','geo','gas','battery','coal'],tip:'Low rivers mean the dam makes only half its usual power.'},
{n:'Net zero hero',em:'🌍',peak:80,slots:['river','hot','','','',''],budget:260,cap:40,s3:20,wind:night,cloud:halfc,only:['solar','wind','hydro','geo','nuclear','battery'],tip:'No fossil fuels allowed! Mix steady and weather-driven sources.'}];
LV.forEach((l,i)=>l.id='E'+i);
const CHAINS=[
{n:'Solar panel',items:['☀️ Light energy','⚡ Electrical energy']},
{n:'Coal power',items:['🪨 Chemical energy (coal)','🔥 Thermal energy (steam)','⚙️ Kinetic energy (turbine)','⚡ Electrical energy']},
{n:'Hydro dam',items:['⛰️ Gravitational potential energy (water up high)','🌊 Kinetic energy (falling water)','⚙️ Kinetic energy (turbine)','⚡ Electrical energy']},
{n:'Wind turbine',items:['🌬️ Kinetic energy (moving air)','⚙️ Kinetic energy (spinning blades)','⚡ Electrical energy']},
{n:'Nuclear plant',items:['⚛️ Nuclear energy (uranium)','🔥 Thermal energy (steam)','⚙️ Kinetic energy (turbine)','⚡ Electrical energy']},
{n:'Battery torch',items:['🔋 Chemical energy','⚡ Electrical energy','💡 Light energy']},
{n:'Food to running',items:['🌞 Light energy (Sun)','🌱 Chemical energy (plants/food)','🏃 Kinetic energy (you!)']}];
const LEARN=[
{h:'⚡ What is energy?',p:'Energy is the ability to make things happen — to move, heat, light up or make sound. Energy is never created or destroyed; it just <b>changes form</b> (this is the law of conservation of energy).',d:(g,t)=>{['☀️','🔥','⚙️','⚡','💡'].forEach((e,i)=>{g.font='36px serif';g.fillText(e,30+i*85,110+Math.sin(t*3-i)*10);if(i<4){g.fillStyle='#fff';g.font='22px sans-serif';g.fillText('→',80+i*85,105)}})}},
{h:'⚙️ How power plants work',p:'Most power plants spin a <b>turbine</b> connected to a <b>generator</b>. A magnet spinning inside coils of wire makes electricity. Steam (from coal, gas, nuclear or geothermal heat), wind or falling water does the spinning. Solar panels are different — they turn light straight into electricity.',d:(g,t)=>{g.save();g.translate(220,100);g.rotate(t*3);g.fillStyle='#bfe8ff';for(let k=0;k<3;k++){g.rotate(2.094);g.fillRect(-6,0,12,70)}g.restore();g.fillStyle='#ffd34d';g.beginPath();g.arc(220,100,10,0,7);g.fill()}},
{h:'♻️ Renewable vs non-renewable',p:'<b>Renewable</b> sources refill naturally: solar, wind, hydro, geothermal. <b>Non-renewable</b> sources run out: coal, oil and natural gas (fossil fuels, made from ancient living things over millions of years) and uranium for nuclear.',d:(g,t)=>{g.font='30px serif';['☀️','🌬️','💧','♨️'].forEach((e,i)=>g.fillText(e,30+i*45,80));['🏭','🔥','⚛️'].forEach((e,i)=>g.fillText(e,270+i*50,80));g.fillStyle='#3ddc84';g.font='16px sans-serif';g.fillText('renewable',50,130);g.fillStyle='#ff9a4d';g.fillText('non-renewable',280,130)}},
{h:'🌫️ CO₂ and climate',p:'Burning coal and gas releases carbon dioxide (CO₂), which traps heat and warms the planet. Over its whole life, coal power releases about <b>820 g CO₂ per kWh</b>, gas about 490 g, while solar (~48), hydro (~24), wind (~12) and nuclear (~12) release far less (IPCC estimates).',d:(g,t)=>{Object.entries({coal:820,gas:490,solar:48,hydro:24,wind:12,nuclear:12}).forEach(([k,v],i)=>{g.fillStyle=SRC[k].col;const h=v/820*150*Math.min(1,t);g.fillRect(25+i*70,180-h,45,h);g.fillStyle='#fff';g.font='13px sans-serif';g.fillText(k,25+i*70,196)})}},
{h:'🌗 Matching supply and demand',p:'People use more electricity in the morning and especially the evening. Solar only works in daylight, and wind comes and goes. Grid operators mix steady sources, quick-to-start gas plants and <b>storage</b> like batteries so the lights never go out.',d:(g,t)=>{g.strokeStyle='#ff5c7a';g.lineWidth=3;g.beginPath();DEM.forEach((d,h)=>{const x=20+h*17,y=180-d*150;h?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.fillStyle='#ffd34d88';g.beginPath();g.moveTo(20,180);for(let h=0;h<24;h++)g.lineTo(20+h*17,180-sunAt(h)*130);g.lineTo(20+23*17,180);g.fill();const h=(t*4)%24;g.fillStyle='#fff';g.fillRect(20+h*17,20,2,160)}},
{h:'🔋 Storage',p:'Batteries store electricity as chemical energy. Pumped hydro pumps water uphill when there\'s extra power and lets it flow down through turbines later — it is the world\'s biggest form of grid storage.',d:(g,t)=>{const f=(Math.sin(t)+1)/2;g.strokeStyle='#fff';g.lineWidth=3;g.strokeRect(170,40,100,130);g.fillStyle='#3ddc84';g.fillRect(173,167-124*f,94,124*f);g.fillRect(205,28,30,12)}}];
const QS=[
{q:'Which of these is renewable?',a:'Wind',opts:['Wind','Coal','Natural gas','Oil']},
{q:'Which source releases the most CO₂ per kWh?',a:'Coal',opts:['Coal','Gas','Solar','Nuclear']},
{q:'A solar panel changes…',a:'light energy into electrical energy',opts:['light energy into electrical energy','heat into light','electricity into light','wind into heat']},
{q:'What spins in most power plants to make electricity?',a:'a turbine connected to a generator',opts:['a turbine connected to a generator','a battery','a solar cell','a light bulb']},
{q:'Nuclear power plants get heat from…',a:'splitting atoms (fission)',opts:['splitting atoms (fission)','burning uranium like coal','sunlight','lightning']},
{q:'Geothermal energy comes from…',a:'heat inside the Earth',opts:['heat inside the Earth','the Moon','ocean waves','burning trees']},
{q:'A hydro dam uses water\'s…',a:'gravitational potential energy',opts:['gravitational potential energy','chemical energy','nuclear energy','sound energy']},
{q:'Why do wind turbines stop in very strong storms?',a:'to avoid damage (cut-out speed)',opts:['to avoid damage (cut-out speed)','the wind is too weak','it is night','the blades freeze instantly']},
{q:'When is electricity demand usually highest?',a:'early evening',opts:['early evening','3 a.m.','noon on a holiday only','never changes']},
{q:'Fossil fuels formed from…',a:'ancient plants and animals',opts:['ancient plants and animals','volcano lava','meteorites','sea salt']},
{q:'Energy can be…',a:'changed from one form to another',opts:['changed from one form to another','created from nothing','destroyed completely','only stored in batteries']},
{q:'Which source can quickly ramp up to follow demand?',a:'Gas plant',opts:['Gas plant','Nuclear plant','Solar at night','Geothermal']},
{q:'Batteries store energy as…',a:'chemical energy',opts:['chemical energy','sound energy','nuclear energy','light energy']},
{q:'Which source makes nothing at night?',a:'Solar',opts:['Solar','Hydro','Nuclear','Geothermal']},
{q:'The world\'s largest form of grid energy storage is…',a:'pumped hydro',opts:['pumped hydro','phone batteries','candles','flywheels in cars']},
{q:'Main gas that coal and gas plants release that warms the climate:',a:'carbon dioxide (CO₂)',opts:['carbon dioxide (CO₂)','oxygen','helium','nitrogen']},
{q:'Uranium for nuclear power is…',a:'non-renewable',opts:['non-renewable','renewable','made by plants','a fossil fuel']},
{q:'A wind turbine turns ___ energy into electrical energy.',a:'kinetic',opts:['kinetic','chemical','nuclear','thermal']},
{q:'Iceland gets most of its heat and lots of power from…',a:'geothermal energy',opts:['geothermal energy','coal','nuclear','oil']},
{q:'Your body gets energy from food, which stores…',a:'chemical energy',opts:['chemical energy','nuclear energy','electrical energy','sound energy']}];
function menu(){mainMenu('🏘️⚡🌬️','Power Town','Build a power grid that keeps the lights on day and night — without blowing the budget or the planet!',[['mL','📖','Learn','Energy, power plants, CO₂, demand, storage.',()=>learnPage(0)],['mP','🏗️','Missions',`${LV.length} towns to power.`,()=>levels()],['mS','🧪','Sandbox','Any sources, any weather.',()=>sandbox()],['mC','🔗','Energy chains',`Order energy transformations. <span class="stars">${starStr(SAVE.stars.chains||0)}</span>`,()=>chains(0,0)],...stdTiles('Energy Quiz')])}
function levels(){levelGrid('🏗️ Power missions')}
function sandbox(){const W={calm,breeze,windy,storm,night};const L={id:'sand',n:'Sandbox',em:'🧪',peak:70,slots:['river','hot','','','','','',''],budget:999,cap:999,s3:0,wind:breeze,only:Object.keys(SRC),sandbox:1};build(L,-1)}
function build(L,li){const slots=L.slots.map(()=>null);let pick=null;
 app.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1;margin:0">${L.em} ${li>=0?li+1+'. ':''}${L.n}</h2><button class="btn alt" id="bk">${li>=0?'Levels':'Menu'}</button></div>
 <p>Peak demand <b>${L.peak} MW</b> · Budget <b>$${L.budget}M</b> · CO₂ limit <b>${L.cap} t/day</b>${L.drought?' · 🏜️ drought':''}</p>${L.tip?`<div class="fact">💡 ${L.tip}</div>`:''}
 ${L.sandbox?`<div class="row">Weather: <select id="wsel" class="btn alt">${['breeze','calm','windy','storm','night'].map(k=>`<option>${k}</option>`).join('')}</select><label><input type="checkbox" id="cld"> cloudy</label><label>Peak <input type="range" id="pk" min="20" max="200" value="70"> <b id="pkv">70</b> MW</label></div>`:''}
 <div class="row" id="pal" style="margin:8px 0"></div><div class="grid" id="sl" style="grid-template-columns:repeat(auto-fill,minmax(96px,1fr))"></div>
 <div class="row" style="margin:8px 0"><span class="pill" id="bud"></span><button class="btn" id="go">▶ Run the day</button></div><canvas id="cv" width="760" height="330" style="width:100%;border-radius:14px;background:#05081a"></canvas><div class="fb" id="fb"></div></div>`;
 $('#bk').onclick=li>=0?levels:menu;
 if(L.sandbox){const W={calm,breeze,windy,storm,night};$('#wsel').onchange=e=>L.wind=W[e.target.value];$('#cld').onchange=e=>L.cloud=e.target.checked?cloudy:null;$('#pk').oninput=e=>{L.peak=+e.target.value;$('#pkv').textContent=L.peak}}
 L.only.forEach(k=>{const b=document.createElement('button');b.className='btn alt';b.dataset.k=k;b.innerHTML=`${SRC[k].e} ${SRC[k].n}<br><small>$${SRC[k].cost}M · ${SRC[k].cap} MW</small>`;b.onclick=()=>{pick=pick==k?null:k;SFX.click();[...$('#pal').children].forEach(x=>x.classList.toggle('sel',x.dataset.k==pick));$('#fb').innerHTML=pick?`<div class="fact">${SRC[k].e} ${SRC[k].f} CO₂ ≈ ${SRC[k].co2} g/kWh.</div>`:''};$('#pal').appendChild(b)});
 const cost=()=>slots.filter(x=>x).reduce((a,k)=>a+SRC[k].cost,0);
 const draw=()=>{$('#sl').innerHTML='';slots.forEach((k,j)=>{const d=document.createElement('div');d.className='card tile';d.style.cssText='text-align:center;padding:8px;min-height:92px;background:'+(L.slots[j]=='river'?'#1d3d7a':L.slots[j]=='hot'?'#5a2a1d':'#1b2350');d.innerHTML=k?`<div style="font-size:34px">${SRC[k].e}</div><small>${SRC[k].n}</small>`:`<div style="font-size:26px;opacity:.5">${L.slots[j]=='river'?'🏞️':L.slots[j]=='hot'?'🌋':'➕'}</div><small style="color:var(--mut)">${L.slots[j]=='river'?'river plot':L.slots[j]=='hot'?'hot spot':'empty plot'}</small>`;
  d.onclick=()=>{if(k){slots[j]=null;SFX.drop();draw();return}if(!pick){$('#fb').textContent='👆 Pick a power source above first.';return}const need=SRC[pick].slot;if(need&&need!=L.slots[j]){SFX.bad();flash(d,0);$('#fb').textContent=`${SRC[pick].n} needs a ${need=='river'?'river 🏞️':'hot spot 🌋'} plot.`;return}if(cost()+SRC[pick].cost>L.budget){SFX.bad();flash(d,0);$('#fb').textContent='💸 Over budget!';return}slots[j]=pick;tone(300,.15,'square',.08,300);draw()};$('#sl').appendChild(d)});$('#bud').textContent=`💰 $${cost()}M / $${L.budget}M`};draw();
 let tries=0;const cv=$('#cv'),g=cv.getContext('2d');drawDay(g,L,null,0);
 $('#go').onclick=async()=>{const b=slots.filter(x=>x);if(!b.length){$('#fb').textContent='Build something first!';return}tries++;$('#go').disabled=true;const R=simDay(L,b);
  for(let h=0;h<=24;h+=.25){if(!cv.isConnected)return;drawDay(g,L,R,h);if(R.H[Math.min(23,h|0)].short&&h%1==0)tone(110,.1,'sawtooth',.06);await new Promise(r=>setTimeout(r,45))}
  $('#go').disabled=false;const msg=`Blackout hours: <b>${R.black}</b> · CO₂: <b>${R.co2} t</b> (limit ${L.cap}) · Cost $${R.cost}M`;
  if(L.sandbox){$('#fb').innerHTML=msg;SFX.good();return}
  if(R.black){SFX.bad();$('#fb').innerHTML='🌑 Blackout! The town went dark when supply < demand. '+msg;return}
  if(R.co2>L.cap){SFX.bad();$('#fb').innerHTML='🌫️ Too much pollution! '+msg;return}
  const st=R.co2<=L.s3?3:R.co2<=(L.cap+L.s3)/2?2:1;winLevel(li,st,'Lights stayed on all day! '+msg+(st<3?`<div class="fact">💡 For ★★★ get CO₂ down to ${L.s3} t or less.</div>`:''))}}
function drawDay(g,L,R,t){const Wd=760,Hd=330;g.clearRect(0,0,Wd,Hd);const h=Math.min(23,t|0),sun=sunAt(t%24),night=1-sun;
 g.fillStyle=`rgb(${20+80*sun|0},${30+120*sun|0},${60+150*sun|0})`;g.fillRect(0,0,Wd,140);if(sun>0){g.fillStyle='#ffd34d';g.beginPath();g.arc(60+(t-6)/12*640,130-sun*100,18,0,7);g.fill()}else{g.font='22px serif';g.fillText('🌙',600,40)}
 const cl=L.cloud?L.cloud[h]:0;if(cl){g.font='34px serif';for(let k=0;k<4*cl;k++)g.fillText('☁️',100+k*150+t*4%60,50)}
 const dark=R&&R.H[h].short;for(let k=0;k<12;k++){const x=20+k*62,hh=40+(k*37%50);g.fillStyle='#2a2f55';g.fillRect(x,140-hh,48,hh);for(let r=0;r<hh/14-1;r++)for(let c=0;c<3;c++){g.fillStyle=dark?'#111':(night>.3||k%3==0)?'#ffe680':'#88a';g.fillRect(x+6+c*14,140-hh+6+r*14,8,8)}}
 g.fillStyle='#fff';g.font='14px sans-serif';g.fillText(`🕐 ${String(h).padStart(2,'0')}:00   🌬️ ${L.wind[h]} m/s${dark?'   ⚠️ BLACKOUT':''}`,10,18);
 // chart
 const top=160,bh=150,sc=bh/(L.peak*1.4);g.fillStyle='#0008';g.fillRect(0,top-6,Wd,bh+20);
 if(R)for(let k=0;k<Math.min(24,Math.ceil(t));k++){let y=top+bh;['nuclear','coal','geo','hydro','wind','solar','battery','gas'].forEach(s=>{const v=(s=='battery'||s=='gas')?R.H[k].out[s]:R.H[k].used[s]||0;if(v>0){g.fillStyle=SRC[s].col;g.fillRect(20+k*30,y-v*sc,26,v*sc);y-=v*sc}});if(R.H[k].short){g.fillStyle='#ff5c7a';g.fillText('✕',27+k*30,top+bh+12)}}
 g.strokeStyle='#ff5c7a';g.lineWidth=3;g.beginPath();DEM.forEach((d,k)=>{const x=33+k*30,y=top+bh-d*L.peak*sc;k?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.fillStyle='#ff5c7a';g.fillText('demand',Wd-70,top+10)}
function play(i){build(LV[i],i)}
function chains(ci,score){const C=CHAINS[ci];let order=[];const sh=shuffle(C.items);
 app.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1;margin:0">🔗 ${ci+1}/${CHAINS.length}: ${C.n}</h2><button class="btn alt" id="bk">Menu</button></div><p>Tap the energy forms in the right order, from start to finish.</p><div id="ch" class="row" style="min-height:60px;background:#0004;border-radius:12px;padding:8px"></div><div id="os"></div><div class="fb" id="fb"></div></div>`;$('#bk').onclick=menu;
 sh.forEach(it=>{const b=document.createElement('button');b.className='btn opt';b.textContent=it;b.onclick=()=>{if(b.disabled)return;const nx=C.items[order.length];if(it==nx){order.push(it);b.disabled=true;SFX.good();$('#ch').innerHTML=order.map(x=>`<span class="pill pop">${x}</span>`).join(' → ');if(order.length==C.items.length){const ok=!b.parentNode.dataset.err;if(ok)score++;confetti(innerWidth/2,innerHeight/2,25);$('#fb').innerHTML=`✅ Chain complete! <button class="btn" id="nx">${ci<CHAINS.length-1?'Next →':'Finish'}</button>`;$('#nx').onclick=()=>{if(ci<CHAINS.length-1)chains(ci+1,score);else{const st=score>=7?3:score>=5?2:score>=3?1:0;award('chains',st);if(st)SFX.win(),confetti();app.innerHTML=`<div class="card" style="text-align:center"><h2>Energy chains done!</h2><div class="stars" style="font-size:48px">${starStr(st)}</div><p>${score}/${CHAINS.length} perfect chains.</p><button class="btn" id="bk2">Back</button></div>`;$('#bk2').onclick=menu}}}}else{b.parentNode.dataset.err=1;SFX.bad();flash(b,0);$('#fb').textContent='Not next — what does that energy turn into?'}};$('#os').appendChild(b)})}
menu();
</script></body></html>
