<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Recipe Ratios</title>
<style>
:root{--bg:#0f1530;--card:#1b2350;--ink:#f4f6ff;--mut:#9aa6d8;--acc:#ff8fb1;--good:#3ddc84;--bad:#ff5c7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,#2a3480,var(--bg) 60%);color:var(--ink);min-height:100vh;user-select:none;-webkit-user-select:none;overflow-x:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0008;position:sticky;top:0;z-index:5;backdrop-filter:blur(4px)}
header a{color:var(--ink);text-decoration:none;background:#fff1;padding:6px 12px;border-radius:20px;font-weight:bold}
header h1{font-size:20px;margin:0;flex:1;color:var(--acc);text-shadow:0 2px 0 #0006}
.pill{background:#fff1;padding:5px 10px;border-radius:14px;font-size:14px}
main{max-width:980px;margin:0 auto;padding:14px}
.btn{font:inherit;font-weight:bold;border:0;border-radius:14px;padding:10px 16px;background:var(--acc);color:#111;cursor:pointer;box-shadow:0 4px 0 #0007;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}.btn.alt{background:#2c3770;color:var(--ink)}.btn.sel{outline:3px solid #fff}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 6px 18px #0005;border:2px solid #ffffff10}
.tile{cursor:pointer;transition:transform .15s}.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile .em{font-size:40px}.tile h3{margin:6px 0}.tile p{margin:0;color:var(--mut);font-size:14px}
.stars{color:#ffd34d;letter-spacing:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{min-height:28px;font-weight:bold;font-size:18px;margin:8px 0}
.opt{display:block;width:100%;margin:6px 0;text-align:left;background:#2c3770;color:var(--ink)}
.opt.ok{background:var(--good);color:#111}.opt.no{background:var(--bad)}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.12)}}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
.bar{height:10px;background:#fff2;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);transition:width .3s}
.fact{background:#ffd34d22;border-left:4px solid #ffd34d;padding:8px 12px;border-radius:8px;margin:8px 0}
svg text{font-family:inherit}
</style></head><body>
<header><a href="./index.html">← Learning Lab</a><h1>Recipe Ratios</h1><span class="pill" id="starTotal">⭐ 0</span><button class="btn alt" id="snd" style="padding:6px 10px">🔊</button></header>
<main id="app"></main><canvas id="fx"></canvas>
<script>
// ---- shared helpers ----
const $=s=>document.querySelector(s),app=$('#app');
const SAVEKEY='g1_recipeRatios';let SAVE=JSON.parse(localStorage.getItem(SAVEKEY)||'{}');SAVE.stars=SAVE.stars||{};SAVE.best=SAVE.best||{};
function save(){localStorage.setItem(SAVEKEY,JSON.stringify(SAVE));$('#starTotal').textContent='⭐ '+Object.values(SAVE.stars).reduce((a,b)=>a+b,0)}
let AC=null,muted=!!SAVE.muted;$('#snd').textContent=muted?'🔇':'🔊';
$('#snd').onclick=()=>{muted=!muted;SAVE.muted=muted;save();$('#snd').textContent=muted?'🔇':'🔊'};
function tone(f,d=.12,type='sine',v=.15,slide=0,delay=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d=.4,v=.2,lp=800){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=lp;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}catch(e){}}
const SFX={click:()=>tone(660,.05,'square',.06),good:()=>{tone(523,.1,'triangle');tone(784,.15,'triangle',.15,0,.08)},bad:()=>tone(200,.25,'sawtooth',.08,-80),
win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.15,0,i*.1)),pick:()=>tone(440,.06,'sine',.1,200),drop:()=>tone(330,.08,'sine',.12,-100)};
// confetti
const cv=$('#fx'),cx=cv.getContext('2d');let fxp=[];function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
function confetti(x=innerWidth/2,y=innerHeight/3,n=60){for(let i=0;i<n;i++)fxp.push({x,y,vx:(Math.random()-.5)*10,vy:-Math.random()*9-2,c:`hsl(${Math.random()*360},90%,60%)`,l:90});}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);fxp=fxp.filter(p=>p.l-->0);for(const p of fxp){p.vy+=.3;p.x+=p.vx;p.y+=p.vy;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,7,7)}requestAnimationFrame(loop)})();
function flash(el,ok){el.classList.remove('pop','shake');void el.offsetWidth;el.classList.add(ok?'pop':'shake')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function starStr(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function award(id,n){if((SAVE.stars[id]||0)<n)SAVE.stars[id]=n;save()}
// generic timed quiz: qs=[{q,opts,a,fact}] ; a is correct string
let __QZ=0;function runQuiz(id,title,qs,secs,back){let i=0,score=0,t=secs,timer;const tok=++__QZ;clearInterval(window.__qt);const alive=()=>tok===__QZ&&!!document.getElementById("qz"+tok);qs=shuffle(qs).slice(0,10);
 function end(){clearInterval(timer);if(!alive())return;const st=score>=9?3:score>=7?2:score>=5?1:0;award(id,st);if(score>(SAVE.best[id]||0))SAVE.best[id]=score;save();if(st)SFX.win(),confetti();
  app.innerHTML=`<div class="card" style="text-align:center"><h2>${title} — done!</h2><div style="font-size:48px" class="stars">${starStr(st)}</div><p>You got <b>${score}/${qs.length}</b>. Best: ${SAVE.best[id]}</p><div class="row" style="justify-content:center"><button class="btn" id="ag">Play again</button><button class="btn alt" id="bk">Back</button></div></div>`;$('#ag').onclick=()=>runQuiz(id,title,qs,secs,back);$('#bk').onclick=back}
 function show(){if(i>=qs.length)return end();const q=qs[i];app.innerHTML=`<div class="card" id="qz${tok}"><div class="row"><b style="flex:1">${title} · Q${i+1}/${qs.length}</b>${secs?`<span class="pill">⏱ <span id="tm">${t}</span>s</span>`:''}<span class="pill">✅ ${score}</span></div><div class="bar" style="margin:8px 0"><i style="width:${i/qs.length*100}%"></i></div>${q.svg||''}<h2>${q.q}</h2><div id="os"></div><div class="fb" id="fb"></div></div>`;
  shuffle(q.opts).forEach(o=>{const b=document.createElement('button');b.className='btn opt';b.innerHTML=o;b.onclick=()=>{if(b.parentNode.dataset.done)return;b.parentNode.dataset.done=1;const ok=o==q.a;if(ok){score++;SFX.good();confetti(innerWidth/2,innerHeight/2,20)}else SFX.bad();[...$('#os').children].forEach(x=>{if(x.innerHTML==q.a)x.classList.add('ok')});if(!ok)b.classList.add('no');flash(b,ok);$('#fb').innerHTML=(ok?'✅ Correct! ':'❌ Not quite. ')+(q.fact?`<div class="fact">💡 ${q.fact}</div>`:'');setTimeout(()=>{if(!alive())return;i++;show()},q.fact?2200:1100)};$('#os').appendChild(b)})}
 if(secs)window.__qt=timer=setInterval(()=>{if(!alive()){clearInterval(timer);return}t--;const e=$('#tm');if(e)e.textContent=t;if(t<=5&&t>0)tone(880,.05);if(t<=0)end()},1000);show()}
save();
</script>
<script>
// common menu/learn/levels helpers for g1 games
function learnPage(i){const m=LEARN[i];app.innerHTML=`<div class="card"><div class="row"><b style="flex:1">📖 ${i+1} / ${LEARN.length}</b><button class="btn alt" id="bk">Menu</button></div><div style="text-align:center"><canvas id="lc" width="440" height="200" style="max-width:100%;background:#05081a;border-radius:14px"></canvas></div><h2>${m.h}</h2><p style="line-height:1.5">${m.p}</p>
 <div class="row"><button class="btn alt" id="pv" ${i?'':'disabled'}>← Prev</button><span style="flex:1"></span><button class="btn" id="nx">${i<LEARN.length-1?'Next →':'Done ✓'}</button></div></div>`;
 $('#bk').onclick=menu;$('#pv').onclick=()=>learnPage(i-1);$('#nx').onclick=()=>{SFX.click();if(i<LEARN.length-1)learnPage(i+1);else{SAVE.learned=1;save();SFX.win();confetti();menu()}};
 const c=$('#lc'),g=c.getContext('2d'),t0=performance.now();(function f(n){if(!c.isConnected)return;g.clearRect(0,0,440,200);g.save();m.d(g,(n-t0)/1000);g.restore();requestAnimationFrame(f)})(t0)}
function unlocked(i){return i==0||(SAVE.stars[LV[i-1].id]||0)>0}
function levelGrid(title){app.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1;margin:0">${title}</h2><button class="btn alt" id="bk">Menu</button></div><p style="color:var(--mut)">Earn a star to unlock the next level.</p><div class="grid" id="lg"></div></div>`;$('#bk').onclick=menu;
 LV.forEach((l,i)=>{const d=document.createElement('div'),u=unlocked(i);d.className='card tile lv'+i;d.style.opacity=u?1:.45;d.innerHTML=`<div class="em">${u?l.em||'🎯':'🔒'}</div><h3>${i+1}. ${l.n}</h3><p class="stars">${starStr(SAVE.stars[l.id]||0)}</p>`;d.onclick=()=>{if(!u){SFX.bad();flash(d,0);return}SFX.click();play(i)};$('#lg').appendChild(d)})}
function winLevel(i,st,msg){award(LV[i].id,st);SFX.win();confetti();const last=i>=LV.length-1;
 $('#fb').innerHTML=`🎉 ${msg} <span class="stars">${starStr(st)}</span><div class="row" style="margin-top:6px"><button class="btn" id="nl">${last?'All levels ✓':'Next level →'}</button><button class="btn alt" id="rl">Retry</button></div>`;
 $('#nl').onclick=()=>last?levels():play(i+1);$('#rl').onclick=()=>play(i)}
function mainMenu(em,name,blurb,tiles){const tot=LV.length*3,got=LV.reduce((a,l)=>a+(SAVE.stars[l.id]||0),0);
 app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:54px">${em}</div><h2 style="margin:4px">${name}</h2><p style="color:var(--mut)">${blurb}</p><div class="bar"><i style="width:${got/tot*100}%"></i></div><p class="stars">${got}/${tot} ★</p></div><div class="grid" style="margin-top:12px" id="mg"></div>`;
 tiles.forEach(([id,e,h,p,fn])=>{const d=document.createElement('div');d.className='card tile';d.id=id;d.innerHTML=`<div class="em">${e}</div><h3>${h}</h3><p>${p}</p>`;d.onclick=()=>{SFX.click();fn()};$('#mg').appendChild(d)})}
function stdTiles(qtitle){return[['mQ','❓','Quiz',`10 questions. <span class="stars">${starStr(SAVE.stars.quiz||0)}</span>`,()=>runQuiz('quiz',qtitle,QS,0,menu)],['mT','⏱️','Timed challenge',`60 seconds! <span class="stars">${starStr(SAVE.stars.timed||0)}</span>`,()=>runQuiz('timed','Timed Challenge',QS,60,menu)]]}
// ---- Recipe Ratios ----
const fmt=x=>{const w=Math.floor(x+1e-9),f=x-w;const F={0:'',.25:'¼',.5:'½',.75:'¾'}[Math.round(f*4)/4];if(F!==undefined&&Math.abs(f*4-Math.round(f*4))<1e-6)return (w?w:'')+(F||(w?'':'0'));return (+x.toFixed(2))+''};
const LV=[
{n:'Pancakes for 4',em:'🥞',k:'scale',from:2,to:4,ing:[['🌾 Flour',1,'cup',.25],['🥛 Milk',.75,'cup',.25],['🥚 Eggs',1,'',1]],tip:'4 people is 2× as many as 2, so multiply everything by 2.'},
{n:'Paint: orange',em:'🎨',k:'paint',a:['Red','#e23b3b'],b:['Yellow','#ffd52e'],ra:1,rb:2,total:9,tip:'Ratio 1 : 2 means for every 1 red, add 2 yellow. 9 drops = 3 groups of 3.'},
{n:'Lemonade',em:'🍋',k:'paint',a:['Lemon juice','#fff27a'],b:['Water','#9fd8ff'],ra:1,rb:4,total:10,unit:'cup',tip:'1 : 4 → each group has 5 cups. 10 cups is 2 groups.'},
{n:'Cookies for 6',em:'🍪',k:'scale',from:12,to:6,ing:[['🧈 Butter',1,'cup',.25],['🍬 Sugar',1.5,'cup',.25],['🍫 Choc chips',2,'cup',.25]],tip:'6 is half of 12 — halve everything!'},
{n:'Missing number',em:'❓',k:'prop',a:3,b:5,c:12,tip:'3/5 = 12/?  — what did 3 get multiplied by to make 12?'},
{n:'Best buy',em:'🛒',k:'rate',items:[['🧃 4 juice boxes',3.00,4],['🧃 6 juice boxes',4.20,6],['🧃 10 juice boxes',7.50,10]],tip:'Unit rate = price ÷ number of boxes.'},
{n:'Paint: green',em:'🟢',k:'paint',a:['Blue','#2f6cff'],b:['Yellow','#ffd52e'],ra:2,rb:3,total:15,tip:'2 : 3 → 5 per group. 15 ÷ 5 = 3 groups.'},
{n:'Smoothie for 3',em:'🥤',k:'scale',from:2,to:3,ing:[['🍓 Strawberries',10,'',1],['🍌 Bananas',2,'',1],['🥛 Yogurt',1,'cup',.25]],tip:'3 servings is 1½ × 2 servings. Multiply by 1.5.'},
{n:'Match the shade',em:'🖌️',k:'paint',a:['Red','#e23b3b'],b:['White','#ffffff'],ra:1,rb:3,total:8,hide:1,tip:'Compare the colours. Too dark? Add more white!'},
{n:'Speed rate',em:'🚲',k:'mc',q:'A cyclist rides 36 km in 3 hours. At the same speed, how far in 5 hours?',ans:'60 km',opts:['60 km','45 km','72 km','38 km'],tip:'Unit rate: 36 ÷ 3 = 12 km per hour.'},
{n:'Party punch',em:'🎉',k:'scale',from:4,to:10,ing:[['🧃 Juice',2,'L',.5],['🫧 Soda',1,'L',.5],['🍊 Orange slices',6,'',1]],tip:'10 ÷ 4 = 2.5. Multiply each amount by 2.5.'},
{n:'Missing number II',em:'🔍',k:'prop',a:4,b:7,c:28,inv:1,tip:'4 × 7 = 28, so multiply 7 by 7 too.'},
{n:'Super shopper',em:'🏷️',k:'rate',items:[['🥣 500 g cereal',4.00,500],['🥣 750 g cereal',5.25,750],['🥣 1 kg cereal',7.50,1000]],per:'100 g',div:100,tip:'Find the price per 100 g for each box.'},
{n:'Purple paint',em:'🟣',k:'paint',a:['Red','#e23b3b'],b:['Blue','#2f6cff'],ra:3,rb:4,total:21,tip:'3 : 4 → 7 per group. 21 ÷ 7 = 3.'}];
LV.forEach((l,i)=>l.id='R'+i);
function mixCol(c1,n1,c2,n2){if(!n1&&!n2)return'#ffffff22';const h=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));const A=h(c1),B=h(c2),t=n1+n2;return'rgb('+A.map((v,i)=>Math.round((v*n1+B[i]*n2)/t)).join(',')+')'}
const LEARN=[
{h:'⚖️ What is a ratio?',p:'A ratio compares two amounts. If a fruit bowl has 2 apples for every 3 bananas, the ratio of apples to bananas is <b>2 : 3</b>. Order matters: bananas to apples is 3 : 2.',d:(g,t)=>{g.font='36px serif';for(let k=0;k<2;k++)g.fillText('🍎',60+k*50,90);for(let k=0;k<3;k++)g.fillText('🍌',230+k*50,90);g.fillStyle='#fff';g.font='bold 34px sans-serif';g.fillText('2  :  3',160,160+Math.sin(t*3)*4)}},
{h:'✖️ Equivalent ratios',p:'Multiply or divide BOTH parts by the same number and the ratio stays the same: 2 : 3 = 4 : 6 = 6 : 9. That is how you scale a recipe — the taste stays the same!',d:(g,t)=>{const k=1+((t/1.5|0)%3);g.font='22px serif';for(let i=0;i<2*k;i++)g.fillText('🍎',20+i*30,70);for(let i=0;i<3*k;i++)g.fillText('🍌',20+i*30,120);g.fillStyle='#fff';g.font='bold 28px sans-serif';g.fillText(`${2*k} : ${3*k}`,300,180)}},
{h:'🍰 Scaling a recipe',p:'Find the <b>scale factor</b>: new servings ÷ old servings. A recipe for 4 needs 2 cups of flour. For 6 people the factor is 6 ÷ 4 = 1.5, so you need 2 × 1.5 = <b>3 cups</b>. Multiply EVERY ingredient by the same factor.',d:(g,t)=>{g.fillStyle='#fff';g.font='22px sans-serif';g.fillText('4 people → 2 cups',40,70);g.fillText('6 people → ? cups',40,130);g.fillStyle='#ffd34d';g.fillText('× 1.5',300,100);if(t%3>1.5){g.fillStyle='#3ddc84';g.fillText('3 cups!',260,160)}}},
{h:'🔍 Proportions',p:'A proportion says two ratios are equal, like 3/5 = 12/20. To find a missing number, work out what the known number was multiplied by, then do the same to the other part.',d:(g,t)=>{g.fillStyle='#fff';g.font='bold 40px sans-serif';g.fillText('3',130,80);g.fillText('5',130,150);g.fillText('12',250,80);g.fillText(t%3>1.5?'20':'?',250,150);g.fillRect(120,100,50,4);g.fillRect(245,100,60,4);g.font='30px sans-serif';g.fillText('=',195,120);g.fillStyle='#ffd34d';g.font='18px sans-serif';g.fillText('×4',190,60)}},
{h:'🛒 Unit rates',p:'A <b>unit rate</b> tells you how much for ONE of something: price per item, km per hour, cost per 100 g. To compare deals, divide: $4.20 ÷ 6 boxes = $0.70 per box. The lowest unit price is the best buy.',d:(g,t)=>{g.fillStyle='#fff';g.font='20px sans-serif';g.fillText('$3.00 ÷ 4 = $0.75 each',40,70);g.fillText('$4.20 ÷ 6 = $0.70 each',40,120);g.fillStyle='#3ddc84';if(t%2>1)g.fillText('⬅ best buy',300,120)}},
{h:'🎨 Mixing colours by ratio',p:'Paint shops use ratios so every can of a colour matches. 1 part red to 3 parts white always makes the same pink — whether you mix 4 drops or 400! Change the ratio and the shade changes.',d:(g,t)=>{[[1,3],[1,1],[3,1]].forEach(([a,b],i)=>{g.fillStyle=mixCol('#e23b3b',a,'#ffffff',b);g.beginPath();g.arc(90+i*130,100,45+Math.sin(t*2+i)*3,0,7);g.fill();g.fillStyle='#fff';g.font='18px sans-serif';g.fillText(a+' : '+b,70+i*130,180)})}}];
const QS=[
{q:'Simplify 6 : 9',a:'2 : 3',opts:['2 : 3','3 : 2','6 : 3','1 : 3']},
{q:'A recipe for 2 uses 3 eggs. For 6 people you need…',a:'9 eggs',opts:['9 eggs','6 eggs','12 eggs','7 eggs']},
{q:'Which ratio is equivalent to 1 : 4?',a:'3 : 12',opts:['3 : 12','2 : 6','4 : 1','5 : 15']},
{q:'5 pencils cost $2.50. What is the unit rate?',a:'$0.50 per pencil',opts:['$0.50 per pencil','$2 per pencil','$0.25 per pencil','$5 per pencil']},
{q:'3/4 = ?/20',a:'15',opts:['15','12','16','19']},
{q:'Juice is 1 part concentrate to 3 parts water. How much water for 2 cups of concentrate?',a:'6 cups',opts:['6 cups','3 cups','5 cups','8 cups']},
{q:'Scale factor to go from 8 servings to 2 servings?',a:'÷ 4',opts:['÷ 4','× 4','÷ 2','× 6']},
{q:'A car goes 180 km in 2 hours. Speed?',a:'90 km/h',opts:['90 km/h','360 km/h','60 km/h','180 km/h']},
{q:'Which is the better buy?',a:'12 for $6',opts:['12 for $6','5 for $3','2 for $1.20','8 for $5']},
{q:'In a class of 12 girls and 18 boys, girls : boys is…',a:'2 : 3',opts:['2 : 3','3 : 2','12 : 30','1 : 2']},
{q:'Red : white paint is 1 : 3. What fraction of the mix is red?',a:'1/4',opts:['1/4','1/3','3/4','1/2']},
{q:'Double a recipe that needs ¾ cup sugar:',a:'1½ cups',opts:['1½ cups','1¼ cups','¾ cup','2 cups']},
{q:'2 : 5 = 8 : ?',a:'20',opts:['20','11','16','40']},
{q:'Halve a recipe with 3 cups of flour:',a:'1½ cups',opts:['1½ cups','1 cup','6 cups','2 cups']},
{q:'If 4 tickets cost $28, 7 tickets cost…',a:'$49',opts:['$49','$56','$35','$31']},
{q:'Which shade is darkest? (red : white)',a:'3 : 1',opts:['3 : 1','1 : 1','1 : 3','1 : 5']},
{q:'A ratio compares…',a:'two or more amounts',opts:['two or more amounts','only money','only lengths','temperatures']},
{q:'Recipe for 4 → for 10. Scale factor?',a:'2.5',opts:['2.5','6','2','4']},
{q:'Typing 300 words in 5 minutes is how many words per minute?',a:'60',opts:['60','1500','50','305']},
{q:'Mixing 2 cups blue : 3 cups yellow. Total for 4 batches?',a:'20 cups',opts:['20 cups','5 cups','12 cups','8 cups']}];
function menu(){mainMenu('🥞🎨🧃','Recipe Ratios','Scale recipes, mix paint and juice to the perfect ratio, and hunt for the best buy!',[['mL','📖','Learn','Ratios, scaling, proportions, unit rates.',()=>learnPage(0)],['mK','👩‍🍳','Kitchen','Free recipe scaler.',()=>kitchen()],['mP','🧩','Levels',`${LV.length} ratio challenges.`,()=>levels()],...stdTiles('Ratio Quiz')])}
function levels(){levelGrid('🧩 Ratio challenges')}
function stepper(id,val,step,unit){return`<div class="row" style="justify-content:flex-end"><button class="btn alt" data-s="${id}" data-d="-1">−</button><b style="min-width:84px;text-align:center;font-size:20px" id="v${id}">${fmt(val)} ${unit}</b><button class="btn alt" data-s="${id}" data-d="1">+</button></div>`}
const KR={n:'Banana bread',sv:8,ing:[['🍌 Bananas',3,'',1],['🌾 Flour',2,'cups',.25],['🍬 Sugar',.75,'cup',.25],['🥚 Eggs',2,'',1],['🧈 Butter',.5,'cup',.25]]};
function kitchen(){let s=8;const draw=()=>{const f=s/KR.sv;app.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1;margin:0">👩‍🍳 ${KR.n}</h2><button class="btn alt" id="bk">Menu</button></div><p>Original recipe serves ${KR.sv}. Change servings and watch every ingredient scale by the same factor.</p>
 <div class="row"><button class="btn alt" id="m">−</button><b style="font-size:22px">🍽️ ${s} servings</b><button class="btn alt" id="p">+</button><span class="pill">scale factor × ${+f.toFixed(3)}</span></div>
 ${KR.ing.map(([n,a,u])=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid #fff2;padding:6px 0"><span>${n}</span><b>${fmt(a*f)} ${u}</b></div>`).join('')}<div class="fact">💡 ${s} ÷ ${KR.sv} = ${+f.toFixed(3)}, so each amount × ${+f.toFixed(3)}.</div></div>`;
 $('#bk').onclick=menu;$('#m').onclick=()=>{if(s>1){s--;SFX.click();draw()}};$('#p').onclick=()=>{if(s<32){s++;SFX.click();draw()}}};draw()}
function play(i){const L=LV[i];let tries=0;const done=m=>winLevel(i,tries<=1?3:tries<=2?2:1,m);const miss=m=>{SFX.bad();flash($('.card'),0);$('#fb').innerHTML='❌ '+m+(tries>=2&&L.tip?`<div class="fact">💡 Hint: ${L.tip}</div>`:'')};
 const head=`<div class="card"><div class="row"><h2 style="flex:1;margin:0">${L.em} ${i+1}. ${L.n}</h2><button class="btn alt" id="bk">Levels</button></div>`;
 if(L.k=='scale'){const v=L.ing.map(()=>0);app.innerHTML=head+`<p>This recipe serves <b>${L.from}</b>. Make it for <b>${L.to}</b>!</p><div class="row" style="gap:16px;flex-wrap:wrap"><div class="card" style="flex:1;min-width:220px"><h3>Original (serves ${L.from})</h3>${L.ing.map(([n,a,u])=>`<div class="row" style="justify-content:space-between"><span>${n}</span><b>${fmt(a)} ${u}</b></div>`).join('')}</div>
  <div class="card" style="flex:1;min-width:240px"><h3>Yours (serves ${L.to})</h3>${L.ing.map(([n,a,u,st],k)=>`<div class="row" style="justify-content:space-between"><span>${n}</span>${stepper(k,0,st,u)}</div>`).join('')}</div></div><button class="btn" id="go">🍳 Cook it!</button><div class="fb" id="fb"></div></div>`;
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const k=+b.dataset.s;v[k]=Math.max(0,+(v[k]+b.dataset.d*L.ing[k][3]).toFixed(3));SFX.pick();$('#v'+k).textContent=fmt(v[k])+' '+L.ing[k][2]});
  $('#go').onclick=()=>{tries++;const f=L.to/L.from,bad=L.ing.filter((x,k)=>Math.abs(v[k]-x[1]*f)>1e-6);if(!bad.length)done(`Perfect! Scale factor ${L.to} ÷ ${L.from} = ${+f.toFixed(2)}.`);else miss(`${bad.map(x=>x[0]).join(', ')} ${bad.length>1?'are':'is'} off. Use the same scale factor for everything.`)}}
 if(L.k=='paint'){let na=0,nb=0;app.innerHTML=head+`<p>${L.hide?`Match the target shade using <b>${L.total}</b> drops total.`:`Mix <b>${L.a[0]} : ${L.b[0]}</b> in the ratio <b>${L.ra} : ${L.rb}</b> using <b>${L.total}</b> ${L.unit||'drop'}s total.`}</p>
  <div class="row" style="justify-content:center;gap:24px"><div style="text-align:center"><div style="width:110px;height:110px;border-radius:50%;background:${mixCol(L.a[1],L.ra,L.b[1],L.rb)};border:4px solid #fff4"></div>Target</div><div style="text-align:center"><svg viewBox="0 0 120 130" width="130"><path d="M10 20 L20 120 L100 120 L110 20Z" fill="#ddd3" stroke="#fff" stroke-width="3"/><rect id="liq" x="18" y="120" width="84" height="0" fill="#fff"/></svg><br>Your mix</div></div>
  <div class="row" style="justify-content:center;margin:10px"><button class="btn" id="ba" style="background:${L.a[1]}">+ ${L.a[0]}</button><button class="btn" id="bb" style="background:${L.b[1]}">+ ${L.b[0]}</button><button class="btn alt" id="cl">🗑️ Empty</button></div>
  <p style="text-align:center" id="ct"></p><div style="text-align:center"><button class="btn" id="go">✅ Check</button></div><div class="fb" id="fb"></div></div>`;
  const upd=()=>{const t=na+nb;$('#liq').setAttribute('y',120-t/L.total*95);$('#liq').setAttribute('height',t/L.total*95);$('#liq').setAttribute('fill',mixCol(L.a[1],na,L.b[1],nb));$('#ct').innerHTML=`${L.a[0]}: <b>${na}</b> · ${L.b[0]}: <b>${nb}</b> · total ${t}/${L.total}`};
  $('#ba').onclick=()=>{if(na+nb<L.total){na++;tone(500,.08,'sine',.1,-200);upd()}else SFX.bad()};$('#bb').onclick=()=>{if(na+nb<L.total){nb++;tone(600,.08,'sine',.1,-200);upd()}else SFX.bad()};$('#cl').onclick=()=>{na=nb=0;noise(.2,.1);upd()};upd();
  $('#go').onclick=()=>{tries++;if(na+nb!=L.total)return miss(`Use exactly ${L.total} in total.`);if(na*L.rb==nb*L.ra)done(`${na} : ${nb} simplifies to ${L.ra} : ${L.rb}. A perfect match!`);else miss(`${na} : ${nb} isn't ${L.hide?'the right shade':L.ra+' : '+L.rb}. ${na/(na+nb)>L.ra/(L.ra+L.rb)?'Too much '+L.a[0]:'Too much '+L.b[0]}.`)}}
 if(L.k=='prop'){const ans=L.c/L.a*L.b;app.innerHTML=head+`<p>Find the missing number so the two ratios are equal.</p><div style="font-size:42px;text-align:center;font-weight:bold">${L.a} : ${L.b} = ${L.c} : <span id="x" style="color:var(--acc)">?</span></div><div class="row" style="justify-content:center;margin:10px" id="pad"></div><div style="text-align:center"><button class="btn" id="go">✅ Check</button></div><div class="fb" id="fb"></div></div>`;
  let s='';[1,2,3,4,5,6,7,8,9,0,'⌫'].forEach(d=>{const b=document.createElement('button');b.className='btn alt';b.style.minWidth='48px';b.textContent=d;b.onclick=()=>{SFX.click();s=d=='⌫'?s.slice(0,-1):(s+d).slice(0,4);$('#x').textContent=s||'?'};$('#pad').appendChild(b)});
  $('#go').onclick=()=>{tries++;if(+s===ans)done(`${L.a} × ${L.c/L.a} = ${L.c}, so ${L.b} × ${L.c/L.a} = ${ans}.`);else miss('Not equal yet. What was '+L.a+' multiplied by?')}}
 if(L.k=='rate'){const div=L.div||1,best=L.items.reduce((a,b)=>b[1]/b[2]<a[1]/a[2]?b:a);app.innerHTML=head+`<p>Which is the <b>best buy</b> (lowest price per ${L.per||'item'})? Tap 🧮 to see a unit price — but each peek costs a star!</p><div class="grid" id="it"></div><div class="fb" id="fb"></div></div>`;
  L.items.forEach(it=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<h3>${it[0]}</h3><p style="font-size:24px">$${it[1].toFixed(2)}</p><div class="row"><button class="btn alt" data-p>🧮 Unit price</button><button class="btn" data-b>Buy this</button></div><p data-u></p>`;
   d.querySelector('[data-p]').onclick=()=>{tries++;SFX.click();d.querySelector('[data-u]').textContent=`$${(it[1]/it[2]*div).toFixed(3)} per ${L.per||'item'}`};
   d.querySelector('[data-b]').onclick=()=>{tries++;if(it==best)done(`${it[0]}: $${(it[1]/it[2]*div).toFixed(2)} per ${L.per||'item'} — the cheapest!`);else{flash(d,0);miss(`That's $${(it[1]/it[2]*div).toFixed(3)} per ${L.per||'item'}. Something is cheaper.`)}};$('#it').appendChild(d)})}
 if(L.k=='mc'){app.innerHTML=head+`<h3>${L.q}</h3><div id="os"></div><div class="fb" id="fb"></div></div>`;shuffle(L.opts).forEach(o=>{const b=document.createElement('button');b.className='btn opt';b.textContent=o;b.onclick=()=>{tries++;if(o==L.ans){b.classList.add('ok');done('Correct! '+L.tip)}else{b.classList.add('no');miss('Try again.')}};$('#os').appendChild(b)})}
 $('#bk').onclick=levels}
menu();
</script></body></html>
