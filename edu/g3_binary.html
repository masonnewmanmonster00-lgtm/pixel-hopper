function picVis(p){return ()=>{const cs=Math.min((H-90)/5,(W*.4-40)/5),gx=(W*.4-cs*5)/2+8,gy=56;for(let i=0;i<25;i++){cx.fillStyle=p[1+Math.floor(i/5)][i%5]==='1'?'#ffe14d':'#1d3444';cx.fillRect(gx+(i%5)*cs+1,gy+Math.floor(i/5)*cs+1,cs-2,cs-2)}}}
function makeQ(){const L=LV[cur];let m=L.m;const q={used:(Q&&Q.used)||[]};let b=L.b||4;if(m==='mix'){m=pick(['bulb','read','count','let','word','pix','quiz']);b=pick([4,5,6])}q.m=m;
 if(m==='bulb'){const n=ri(Math.max(1,2**(b-2)),2**b-1);q.b=b;q.ans=n;q.st=Array(b).fill(0);q.check=()=>{if(lock)return;const v=q.st.reduce((a,x,i)=>a+x*2**(b-1-i),0);if(v===n)good(n+' in binary is '+bin(n,b)+'!');else bad('That makes '+v+'. Try again — '+(v<n?'you need more':'that is too much')+'.')};return q}
 if(m==='read'){const n=ri(1,2**b-1),bits=bin(n,b).split('').map(Number);q.vis=()=>{const w=W*.4-30;bulbRow(bits,20,H/2,w,b<=5)};q.text='Which number do these bulbs show?';const s=new Set([n]);while(s.size<4){const d=n^(1<<ri(0,b-1));s.add(d===0?n+1:d)}q.opts=shuffle([...s].map(String));q.ans=String(n);q.why=bin(n,b)+' = '+bits.map((x,i)=>x?2**(b-1-i):0).filter(Boolean).join(' + ')+' = '+n+'.';return q}
 if(m==='count'){const n=ri(1,2**b-2);q.big=bin(n,b)+'  →  ?';q.bigSz=28;q.text='Counting up in binary: what comes NEXT after '+bin(n,b)+'?';const a=bin(n+1,b),s=new Set([a]);[n+2,n-1,n*2,n+3].forEach(v=>{if(v>=0&&v<2**b)s.add(bin(v,b))});while(s.size<4)s.add(bin(ri(0,2**b-1),b));q.opts=shuffle([...s].slice(0,4));if(!q.opts.includes(a))q.opts[0]=a;q.ans=a;q.why=bin(n,b)+' is '+n+', so next is '+(n+1)+' = '+a+'.';return q}
 if(m==='let'){const i=ri(0,25);q.big=bin(i+1,5);q.bigSz=34;q.text='Code: A=1, B=2 … Z=26. Which letter is this?';q.opts=mo(LET[i],[LET[(i+1)%26],LET[(i+25)%26],LET[(i+2)%26],LET[(i+4)%26]]);q.ans=LET[i];q.why=bin(i+1,5)+' = '+(i+1)+' = '+LET[i]+'.';return q}
 if(m==='word'){const w=fromList(WORDS,q);q.big=w.split('').map(c=>bin(LET.indexOf(c)+1,5)).join(' ');q.bigSz=20;q.text='Decode the secret word (A=1 … Z=26)';q.opts=mo(w,WORDS.filter(x=>x.length===w.length).concat(WORDS));q.ans=w;q.why=w.split('').map(c=>c+'='+(LET.indexOf(c)+1)).join(', ');return q}
 if(m==='pix'){const p=fromList(PICS,q);q.rows=p.slice(1);q.name=p[0];q.g=Array(25).fill(0);q.check=()=>{if(lock)return;const wrong=q.g.filter((v,i)=>v!==+q.rows[Math.floor(i/5)][i%5]).length;if(!wrong)good('It\'s a '+q.name.toLowerCase()+'! Computers store pictures just like this.');else bad(wrong+' square'+(wrong>1?'s are':' is')+' wrong. Check each row of 1s and 0s.')};return q}
 if(m==='pname'){const p=fromList(PICS,q);q.big=p.slice(1).join('\n');q.vis=null;q.big=null;q.text='These rows of bits make a picture. Which one?';q.rowsTxt=p.slice(1);q.vis=()=>{p.slice(1).forEach((r,i)=>txt(r,W*.2+8,70+i*36,26,'#7fd','center','600'))};q.opts=mo(p[0],PICS.map(x=>x[0]));q.ans=p[0];q.why='Paint every 1 and you get a '+p[0].toLowerCase()+'.';q.after=p;return q}
 quizQ(q,fromList(L.k||pick([Q_PV,Q_FACT]),q));return q}
window.G={get Q(){return Q},LV,step(){const q=Q;if(!q)return null;if(q.m==='bulb'){const want=bin(q.ans,q.b);const i=q.st.findIndex((v,k)=>v!==+want[k]);return i<0?q.b:i}if(q.m==='pix'){const i=q.g.findIndex((v,k)=>v!==+q.rows[Math.floor(k/5)][k%5]);return i<0?25:i}return null}};
resize();cur=0;Q=makeQ();draw();showLevels();


</script></body></html>
