 for(const q of L.plats){const ox=q.x,oy=q.y;q.x+=q.vx*dt;q.y+=q.vy*dt;
  const riding=e=>e.x+e.hw>ox&&e.x-e.hw<ox+q.w&&Math.abs(e.y+e.hh-oy)<.06;if(rectSolid(q.x,q.y,q.x+q.w,q.y+q.h,true)||[p,...L.cubes].some(e=>e!==p.held&&!riding(e)&&e.y>q.y+q.h&&overlap(e,q.x,q.y,q.x+q.w,q.y+q.h))){q.x=ox;q.y=oy;q.vx=-q.vx;q.vy=-q.vy}q.dx=q.x-ox;q.dy=q.y-oy;
  for(const e of [p,...L.cubes]){if(e===p.held)continue;if(e.x+e.hw>ox&&e.x-e.hw<ox+q.w&&Math.abs(e.y+e.hh-oy)<.06){e.x+=q.dx;e.y=q.y-e.hh-.001;if(rectSolid(e.x-e.hw,e.y-e.hh,e.x+e.hw,e.y+e.hh))e.x-=q.dx}}}
 // player control
 const kl=keys['a']||keys['arrowleft']||inp.l,kr=keys['d']||keys['arrowright']||inp.r;const dir=(kr?1:0)-(kl?1:0);
 if(dir)p.face=dir;
 if(p.gr){const tgt=dir*RUN;const a=dir?60:45;if(Math.abs(p.vx-tgt)<a*dt)p.vx=tgt;else p.vx+=Math.sign(tgt-p.vx)*a*dt}

 p.co=p.gr?.09:p.co-dt;
 if(inp.jp){if(p.co>0){p.vy=-JUMP;p.co=0;p.gr=false;S.jump()}}inp.jp=0;
 if(inp.g){inp.g=0;if(p.held){const c=p.held;p.held=null;c.vx=p.vx*.8;c.vy=Math.min(0,p.vy);if(rectSolid(c.x-c.hw,c.y-c.hh,c.x+c.hw,c.y+c.hh)){c.x=p.x;c.y=p.y}S.grab()}
  else{let best=null,bd=1.5;for(const c of L.cubes){const d=Math.hypot(c.x-p.x,c.y-p.y);if(d<bd){bd=d;best=c}}if(best){p.held=best;S.grab()}}}

function buildGrid(){const g=$('grid');g.innerHTML='';LV.forEach((l,i)=>{const b=document.createElement('button');b.className=done[i]?'done':'';b.innerHTML=(i+1)+(done[i]?' ✓':'')+'<small>'+l.name+'</small>';b.onclick=()=>{S.grab();startLevel(i)};g.appendChild(b)})}
function show(id){['title','sel','win'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function startLevel(i){ac();show(null);load(i)}
$('playBtn').onclick=()=>{let i=0;while(done[i]&&i<LV.length-1)i++;startLevel(i)};
$('selBtn').onclick=()=>{buildGrid();show('sel');state='menu'};$('levelsBtn').onclick=()=>{buildGrid();show('sel');state='menu'};
$('backBtn').onclick=()=>{if(L){show(null);state='play'}else show('title')};
$('resetBtn').onclick=()=>{if(L){show(null);load(cur)}};
$('nextBtn').onclick=()=>startLevel(Math.min(LV.length-1,cur+1));$('wSelBtn').onclick=()=>{buildGrid();show('sel')};
$('howto').innerHTML=touch?'Move ◀ ▶ · Jump ⤒ · Grab ✋<br>Tap the level to fire — shots alternate Blue / Orange (or pick a colour).<br>Tip: turn your phone sideways for a bigger view.':'Move: A / D · Jump: W / Space · Grab cube: E<br>Aim with the mouse · Left click = Blue · Right click = Orange · R = restart';
layout();
let last=performance.now();function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(!auto){update(dt)}draw(now/1000);requestAnimationFrame(loop)}requestAnimationFrame(loop);
// automation hooks for testing
window.PG={load:i=>{load(i)},step(n,dt=1/120){for(let i=0;i<n;i++)update(dt)},get L(){return L},inp,keys,set auto(v){auto=v},fire,LV};
})();
</script></body></html>
