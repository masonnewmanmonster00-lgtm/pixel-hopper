<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Ocean Zones</title>
<style>
:root{--bg:#0f1530;--card:#1b2350;--ink:#f4f6ff;--mut:#9aa6d8;--acc:#4dd2ff;--good:#3ddc84;--bad:#ff5c7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,#2a3480,var(--bg) 60%);color:var(--ink);min-height:100vh;user-select:none;-webkit-user-select:none;overflow-x:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0008;position:sticky;top:0;z-index:5;backdrop-filter:blur(4px)}
header a{color:var(--ink);text-decoration:none;background:#fff1;padding:6px 12px;border-radius:20px;font-weight:bold}
header h1{font-size:20px;margin:0;flex:1;color:var(--acc);text-shadow:0 2px 0 #0006}
.pill{background:#fff1;padding:5px 10px;border-radius:14px;font-size:14px}
main{max-width:980px;margin:0 auto;padding:14px}
.btn{font:inherit;font-weight:bold;border:0;border-radius:14px;padding:10px 16px;background:var(--acc);color:#111;cursor:pointer;box-shadow:0 4px 0 #0007;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}.btn.alt{background:#2c3770;color:var(--ink)}.btn.sel{outline:3px solid #fff}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 6px 18px #0005;border:2px solid #ffffff10}
.tile{cursor:pointer;transition:transform .15s}.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile .em{font-size:40px}.tile h3{margin:6px 0}.tile p{margin:0;color:var(--mut);font-size:14px}
.stars{color:#ffd34d;letter-spacing:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{min-height:28px;font-weight:bold;font-size:18px;margin:8px 0}
.opt{display:block;width:100%;margin:6px 0;text-align:left;background:#2c3770;color:var(--ink)}
.opt.ok{background:var(--good);color:#111}.opt.no{background:var(--bad)}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.12)}}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
.bar{height:10px;background:#fff2;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);transition:width .3s}
.fact{background:#ffd34d22;border-left:4px solid #ffd34d;padding:8px 12px;border-radius:8px;margin:8px 0}
svg text{font-family:inherit}
</style></head><body>
<header><a href="./index.html">← Learning Lab</a><h1>Ocean Zones</h1><span class="pill" id="starTotal">⭐ 0</span><button class="btn alt" id="snd" style="padding:6px 10px">🔊</button></header>
<main id="app"></main><canvas id="fx"></canvas>
<script>
// ---- shared helpers ----
const $=s=>document.querySelector(s),app=$('#app');
const SAVEKEY='oceanZonesSave';let SAVE=JSON.parse(localStorage.getItem(SAVEKEY)||'{}');SAVE.stars=SAVE.stars||{};SAVE.best=SAVE.best||{};
function save(){localStorage.setItem(SAVEKEY,JSON.stringify(SAVE));$('#starTotal').textContent='⭐ '+Object.values(SAVE.stars).reduce((a,b)=>a+b,0)}
let AC=null,muted=!!SAVE.muted;$('#snd').textContent=muted?'🔇':'🔊';
$('#snd').onclick=()=>{muted=!muted;SAVE.muted=muted;save();$('#snd').textContent=muted?'🔇':'🔊'};
function tone(f,d=.12,type='sine',v=.15,slide=0,delay=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d=.4,v=.2,lp=800){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=lp;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}catch(e){}}
const SFX={click:()=>tone(660,.05,'square',.06),good:()=>{tone(523,.1,'triangle');tone(784,.15,'triangle',.15,0,.08)},bad:()=>tone(200,.25,'sawtooth',.08,-80),
win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.15,0,i*.1)),pick:()=>tone(440,.06,'sine',.1,200),drop:()=>tone(330,.08,'sine',.12,-100)};
// confetti
const cv=$('#fx'),cx=cv.getContext('2d');let fxp=[];function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
function confetti(x=innerWidth/2,y=innerHeight/3,n=60){for(let i=0;i<n;i++)fxp.push({x,y,vx:(Math.random()-.5)*10,vy:-Math.random()*9-2,c:`hsl(${Math.random()*360},90%,60%)`,l:90});}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);fxp=fxp.filter(p=>p.l-->0);for(const p of fxp){p.vy+=.3;p.x+=p.vx;p.y+=p.vy;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,7,7)}requestAnimationFrame(loop)})();
function flash(el,ok){el.classList.remove('pop','shake');void el.offsetWidth;el.classList.add(ok?'pop':'shake')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function starStr(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function award(id,n){if((SAVE.stars[id]||0)<n)SAVE.stars[id]=n;save()}
// generic timed quiz: qs=[{q,opts,a,fact}] ; a is correct string
function runQuiz(id,title,qs,secs,back){let i=0,score=0,t=secs,timer;qs=shuffle(qs).slice(0,10);
 function end(){clearInterval(timer);const st=score>=9?3:score>=7?2:score>=5?1:0;award(id,st);if(score>(SAVE.best[id]||0))SAVE.best[id]=score;save();if(st)SFX.win(),confetti();
  app.innerHTML=`<div class="card" style="text-align:center"><h2>${title} — done!</h2><div style="font-size:48px" class="stars">${starStr(st)}</div><p>You got <b>${score}/${qs.length}</b>. Best: ${SAVE.best[id]}</p><div class="row" style="justify-content:center"><button class="btn" id="ag">Play again</button><button class="btn alt" id="bk">Back</button></div></div>`;$('#ag').onclick=()=>runQuiz(id,title,qs,secs,back);$('#bk').onclick=back}
 function show(){if(i>=qs.length)return end();const q=qs[i];app.innerHTML=`<div class="card"><div class="row"><b style="flex:1">${title} · Q${i+1}/${qs.length}</b>${secs?`<span class="pill">⏱ <span id="tm">${t}</span>s</span>`:''}<span class="pill">✅ ${score}</span></div><div class="bar" style="margin:8px 0"><i style="width:${i/qs.length*100}%"></i></div>${q.svg||''}<h2>${q.q}</h2><div id="os"></div><div class="fb" id="fb"></div></div>`;
  shuffle(q.opts).forEach(o=>{const b=document.createElement('button');b.className='btn opt';b.innerHTML=o;b.onclick=()=>{if(b.parentNode.dataset.done)return;b.parentNode.dataset.done=1;const ok=o==q.a;if(ok){score++;SFX.good();confetti(innerWidth/2,innerHeight/2,20)}else SFX.bad();[...$('#os').children].forEach(x=>{if(x.innerHTML==q.a)x.classList.add('ok')});if(!ok)b.classList.add('no');flash(b,ok);$('#fb').innerHTML=(ok?'✅ Correct! ':'❌ Not quite. ')+(q.fact?`<div class="fact">💡 ${q.fact}</div>`:'');setTimeout(()=>{i++;show()},q.fact?2200:1100)};$('#os').appendChild(b)})}
 if(secs)timer=setInterval(()=>{t--;const e=$('#tm');if(e)e.textContent=t;if(t<=5&&t>0)tone(880,.05);if(t<=0)end()},1000);show()}
save();
</script>
<script>
const ZONES=[
{n:'Sunlight Zone',s:'Epipelagic',a:0,b:200,c1:[60,170,230],c2:[20,110,190],f:'Enough sunlight for plants and algae to photosynthesize. About 90% of all ocean life lives here!'},
{n:'Twilight Zone',s:'Mesopelagic',a:200,b:1000,c1:[20,110,190],c2:[8,30,80],f:'Only faint blue light reaches here, not enough for plants. Many animals glow (bioluminescence).'},
{n:'Midnight Zone',s:'Bathypelagic',a:1000,b:4000,c1:[8,30,80],c2:[3,6,22],f:'No sunlight at all! The only light comes from glowing animals. Water is about 4 °C.'},
{n:'Abyss',s:'Abyssopelagic',a:4000,b:6000,c1:[3,6,22],c2:[2,3,12],f:'Near-freezing water (about 2–3 °C) and crushing pressure. Covers huge flat sea floors called abyssal plains.'},
{n:'Hadal Zone (Trenches)',s:'Hadalpelagic',a:6000,b:11000,c1:[2,3,12],c2:[0,0,0],f:'The deepest trenches. The Challenger Deep in the Mariana Trench is about 10,935 m deep — deeper than Mount Everest is tall!'}];
const ZH=1000,WORLD=ZH*5;
function depthOf(y){const z=Math.min(4,Math.max(0,Math.floor(y/ZH))),Z=ZONES[z];return Z.a+(Z.b-Z.a)*Math.min(1,(y-z*ZH)/ZH)}
function yOf(d){const z=ZONES.findIndex(Z=>d<=Z.b);const Z=ZONES[z<0?4:z];return (z<0?4:z)*ZH+(d-Z.a)/(Z.b-Z.a)*ZH}
function tempAt(d){return d<200?24-d*.05:d<1000?14-(d-200)*.0125:d<4000?4-(d-1000)*.0005:d<6000?2.5-(d-4000)*.00025:2-(d-6000)*.0001}
function lightAt(d){return Math.max(0,100*Math.exp(-d/45))}
const SP=[
{id:'turtle',n:'Green sea turtle',d:[5,120],sh:'turtle',c:'#5fbf6f',sz:34,f:'Green sea turtles can hold their breath for hours while resting, and they eat mostly seagrass and algae.'},
{id:'dolphin',n:'Bottlenose dolphin',d:[5,150],sh:'dolphin',c:'#8ea6c4',sz:44,f:'Dolphins are mammals that breathe air. They find food with echolocation — clicks that bounce off objects.'},
{id:'mantaray',n:'Manta ray',d:[10,180],sh:'ray',c:'#2d3a52',sz:50,f:'Giant manta rays can be 7 m wide and have one of the biggest brains of any fish.'},
{id:'moonjelly',n:'Moon jellyfish',d:[0,190],sh:'jelly',c:'#d8e8ff',sz:24,f:'Jellyfish have no brain, heart or bones. They are about 95% water!'},
{id:'whaleshark',n:'Whale shark',d:[20,190],sh:'fish',c:'#4a6a8a',sz:70,spots:1,f:'The biggest fish in the world (up to about 18 m), but it eats tiny plankton.'},
{id:'lanternfish',n:'Lanternfish',d:[300,950],sh:'fish',c:'#7a8cb0',sz:16,glow:'#7fe8ff',f:'Lanternfish are among the most common fish on Earth. They swim up to the surface at night to feed — the biggest daily migration on the planet!'},
{id:'hatchet',n:'Hatchetfish',d:[250,900],sh:'fish',c:'#c8d0e0',sz:16,glow:'#9fd8ff',f:'Hatchetfish have glowing belly lights that hide their shadow from predators looking up (counter-illumination).'},
{id:'swordfish',n:'Swordfish',d:[200,600],sh:'sword',c:'#6c7fa6',sz:46,f:'Swordfish dive into the twilight zone to hunt and can warm their eyes and brain to see better in cold water.'},
{id:'giantsquid',n:'Giant squid',d:[400,1000],sh:'squid',c:'#c0504a',sz:60,f:'Giant squid have the largest eyes in the animal kingdom — about the size of a dinner plate!'},
{id:'vampire',n:'Vampire squid',d:[600,1200],sh:'octo',c:'#7a1f3a',sz:30,glow:'#6fd0ff',f:'Despite its name it eats "marine snow" — drifting bits of dead plankton. It lives about 600–1,200 m down, where oxygen is very low.'},
{id:'angler',n:'Anglerfish',d:[1200,3500],sh:'angler',c:'#3a2c2c',sz:30,glow:'#b6ff6a',f:'Female anglerfish dangle a glowing lure full of bacteria to attract prey in the dark.'},
{id:'gulper',n:'Gulper eel',d:[1500,3000],sh:'eel',c:'#222838',sz:50,glow:'#ff6ad0',f:'A gulper eel\'s huge mouth can swallow prey bigger than itself, like a pelican\'s pouch.'},
{id:'spermwhale',n:'Sperm whale',d:[1000,2200],sh:'whale',c:'#555e70',sz:90,f:'Sperm whales dive over 1,000 m deep to hunt squid and can hold their breath for over an hour.'},
{id:'dumbo',n:'Dumbo octopus',d:[4000,5800],sh:'octo',c:'#ff9db0',sz:26,ears:1,f:'Dumbo octopuses flap ear-like fins to "fly" through the water. Some live deeper than 7,000 m.'},
{id:'tripod',n:'Tripod fish',d:[4100,5800],sh:'tripod',c:'#9aa0b0',sz:30,f:'Tripod fish stand on three long fins on the sea floor, facing the current, waiting for food to drift by.'},
{id:'seapig',n:'Sea pig',d:[4200,5900],sh:'cuke',c:'#f0b0c0',sz:24,f:'Sea pigs are a kind of sea cucumber that walk on the sea floor on tube feet, eating mud for food.'},
{id:'snailfish',n:'Hadal snailfish',d:[6500,8300],sh:'fish',c:'#f2d8e0',sz:22,f:'Snailfish are the deepest fish ever filmed — around 8,300 m down. Their soft, jelly-like bodies handle the pressure.'},
{id:'amphipod',n:'Giant amphipod',d:[8000,10800],sh:'shrimp',c:'#f4f0e0',sz:22,f:'These shrimp-like scavengers live at the bottom of the Mariana Trench, nearly 11 km down.'},
{id:'xeno',n:'Xenophyophore',d:[7000,10600],sh:'blob',c:'#d0b890',sz:22,f:'A giant single-celled living thing — as big as a softball! Found even in the deepest trenches.'}];
const MIS=[
{id:'m1',n:'Sunny start',need:['turtle','dolphin'],bat:60,desc:'Find a sea turtle and a dolphin in the Sunlight Zone.'},
{id:'m2',n:'Gentle giant',need:['whaleshark','mantaray','moonjelly'],bat:70,desc:'Spot the whale shark, a manta ray and a moon jelly.'},
{id:'m3',n:'Into the twilight',need:['lanternfish','hatchet'],bat:80,desc:'Dive below 200 m and find two glowing fish.'},
{id:'m4',n:'Hunters of the dim',need:['swordfish','giantsquid'],bat:90,desc:'Find a swordfish and the legendary giant squid.'},
{id:'m5',n:'Midnight glow',need:['angler','vampire'],bat:100,desc:'Find a vampire squid and an anglerfish down in the dark deep sea.'},
{id:'m6',n:'Whale dive',need:['spermwhale','gulper'],bat:110,desc:'Follow a sperm whale on its deep hunt. Spot a gulper eel too.'},
{id:'m7',n:'Abyssal plain',need:['dumbo','tripod','seapig'],bat:140,desc:'Explore the abyss floor creatures.'},
{id:'m8',n:'Challenger Deep',need:['snailfish','amphipod','xeno'],bat:170,desc:'Reach the trenches below 6,000 m!'}];
SAVE.journal=SAVE.journal||{};
function menu(){const tot=MIS.length*3,got=MIS.reduce((a,m)=>a+(SAVE.stars[m.id]||0),0),jn=Object.keys(SAVE.journal).length;
 app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:54px">🌊🚢🐙</div><h2 style="margin:4px">Ocean Zones</h2><p style="color:var(--mut)">Pilot your submarine from the sunny surface to the deepest trench on Earth. Discover real creatures and learn how pressure, light and temperature change.</p><div class="bar"><i style="width:${got/tot*100}%"></i></div><p><span class="stars">${got}/${tot} ★</span> · 📘 ${jn}/${SP.length} creatures</p></div>
 <div class="grid" style="margin-top:12px"><div class="card tile" id="mM"><div class="em">🎯</div><h3>Missions</h3><p>${MIS.length} dives with battery limits.</p></div>
 <div class="card tile" id="mF"><div class="em">🤿</div><h3>Free dive</h3><p>Explore all the way down. No battery limit.</p></div>
 <div class="card tile" id="mJ"><div class="em">📘</div><h3>Field guide</h3><p>Zones & creatures you've found.</p></div>
 <div class="card tile" id="mQ"><div class="em">❓</div><h3>Quiz</h3><p>${starStr(SAVE.stars.quiz||0)}</p></div>
 <div class="card tile" id="mT"><div class="em">⏱️</div><h3>Timed quiz</h3><p>60 s! ${starStr(SAVE.stars.timed||0)}</p></div></div>`;
 $('#mM').onclick=()=>{SFX.click();missions()};$('#mF').onclick=()=>{SFX.click();dive(null)};$('#mJ').onclick=()=>{SFX.click();guide()};$('#mQ').onclick=()=>{SFX.click();runQuiz('quiz','Ocean Quiz',QS,0,menu)};$('#mT').onclick=()=>{SFX.click();runQuiz('timed','Timed Quiz',QS,60,menu)}}
function guide(){app.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1;margin:0">📘 Field guide</h2><button class="btn alt" id="bk">Menu</button></div>${ZONES.map((Z,zi)=>`<h3 style="margin:14px 0 4px;color:rgb(${Z.c1})">${Z.n} <small style="color:var(--mut)">(${Z.s}) ${Z.a.toLocaleString()}–${Z.b.toLocaleString()} m</small></h3><div class="fact">${Z.f}</div><div class="grid">${SP.filter(s=>s.d[0]>=Z.a&&s.d[0]<Z.b).map(s=>SAVE.journal[s.id]?`<div class="card"><canvas data-s="${s.id}" width="160" height="80" style="width:100%"></canvas><b>${s.n}</b><p style="font-size:13px;color:var(--mut);margin:4px 0">${s.f}</p></div>`:`<div class="card" style="opacity:.5"><div style="font-size:40px;text-align:center">❔</div><b>Undiscovered</b><p style="font-size:13px;color:var(--mut)">Dive to ${s.d[0].toLocaleString()}–${s.d[1].toLocaleString()} m</p></div>`).join('')}</div>`).join('')}</div>`;
 $('#bk').onclick=menu;document.querySelectorAll('canvas[data-s]').forEach(c=>{const g=c.getContext('2d'),s=SP.find(s=>s.id==c.dataset.s);g.fillStyle='#03122a';g.fillRect(0,0,160,80);drawSp(g,s,80,40,1,0,Math.min(1,50/s.sz),true)})}
function missions(){app.innerHTML=`<div class="card"><div class="row"><h2 style="flex:1;margin:0">🎯 Missions</h2><button class="btn alt" id="bk">Menu</button></div><p style="color:var(--mut)">Save battery for more ★.</p><div class="grid" id="lg"></div></div>`;$('#bk').onclick=menu;
 MIS.forEach((m,i)=>{const lock=i>0&&!SAVE.stars[MIS[i-1].id];const d=document.createElement('div');d.className='card tile';d.style.opacity=lock?.45:1;d.innerHTML=`<div class="em">${lock?'🔒':'🚢'}</div><h3>${i+1}. ${m.n}</h3><p>${m.desc}</p><div class="stars">${starStr(SAVE.stars[m.id]||0)}</div>`;d.onclick=()=>{if(lock){SFX.bad();flash(d,0);return}SFX.click();dive(m)};$('#lg').appendChild(d)})}
function drawSp(g,s,x,y,dir,t,k=1,lit=true){g.save();g.translate(x,y);g.scale(dir*k,k);const z=s.sz,c=lit?s.c:'#0a1020';g.fillStyle=c;g.strokeStyle=c;
 if(s.glow){g.shadowColor=s.glow;g.shadowBlur=18}
 const fish=(w,h)=>{g.beginPath();g.ellipse(0,0,w,h,0,0,7);g.fill();g.beginPath();g.moveTo(-w*.8,0);g.lineTo(-w*1.4,-h*(1+.3*Math.sin(t*8)));g.lineTo(-w*1.4,h*(1+.3*Math.sin(t*8)));g.fill()};
 const eye=(ex,ey,r=3)=>{g.shadowBlur=0;g.fillStyle='#fff';g.beginPath();g.arc(ex,ey,r,0,7);g.fill();g.fillStyle='#000';g.beginPath();g.arc(ex+1,ey,r*.5,0,7);g.fill()};
 switch(s.sh){case'fish':fish(z,z*.4);if(s.spots&&lit){g.fillStyle='#fff8';for(let i=0;i<8;i++){g.beginPath();g.arc(-z*.6+i*z*.17,(i%3-1)*z*.12,2.5,0,7);g.fill()}}if(s.glow){g.fillStyle=s.glow;for(let i=0;i<4;i++){g.beginPath();g.arc(-z*.5+i*z*.3,z*.28,2,0,7);g.fill()}}eye(z*.6,-z*.1,Math.max(2,z*.1));break;
  case'sword':fish(z*.7,z*.22);g.beginPath();g.moveTo(z*.6,-3);g.lineTo(z*1.6,0);g.lineTo(z*.6,3);g.fill();eye(z*.45,-4);break;
  case'dolphin':fish(z,z*.3);g.beginPath();g.moveTo(-z*.1,-z*.25);g.lineTo(-z*.4,-z*.6);g.lineTo(-z*.4,-z*.2);g.fill();g.beginPath();g.ellipse(z*1.05,z*.05,z*.25,z*.1,0,0,7);g.fill();eye(z*.65,-z*.08);break;
  case'whale':g.beginPath();g.roundRect?g.roundRect(-z,-z*.3,z*1.9,z*.6,z*.3):g.rect(-z,-z*.3,z*1.9,z*.6);g.fill();g.beginPath();g.moveTo(-z,0);g.lineTo(-z*1.5,-z*.3*(1+Math.sin(t*3)));g.lineTo(-z*1.5,z*.3*(1-Math.sin(t*3)));g.fill();eye(z*.5,0);break;

 const hold=(id,k)=>{const b=$('#'+id);b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>keys[k]=0};hold('cl','l');hold('cr','r');hold('cu','u');hold('cd','d');
 onkeydown=e=>{const k={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',a:'l',d:'r',w:'u',s:'d'}[e.key];if(k){keys[k]=1;e.preventDefault()}};onkeyup=e=>{const k={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',a:'l',d:'r',w:'u',s:'d'}[e.key];if(k)keys[k]=0};
