function tileAt(x,y){const r=G.map[y|0];if(!r)return '#';return r[x|0]||'#';}
function solid(x,y){const t=tileAt(x,y);return t==='#'||(t==='D');}
function blocksSight(x,y){const t=tileAt(x,y);return t==='#'||t==='D';}
function los(ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay),n=Math.ceil(d/.1);for(let i=1;i<n;i++){const k=i/n;if(blocksSight(ax+(bx-ax)*k,ay+(by-ay)*k))return false;}return true;}

function nearestFloor(x,y){if(!solid(x+.5,y+.5))return [x,y];for(let r=1;r<6;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(!solid(x+dx+.5,y+dy+.5))return [x+dx,y+dy];return [x,y];}
function bfs(sx,sy,tx,ty){sx|=0;sy|=0;tx|=0;ty|=0;if(sx===tx&&sy===ty)return [];const w=G.w,h=G.h,prev=new Int32Array(w*h).fill(-1),q=[sy*w+sx];prev[sy*w+sx]=sy*w+sx;let found=false;
 for(let qi=0;qi<q.length;qi++){const c=q[qi],cx=c%w,cy=(c/w)|0;if(cx===tx&&cy===ty){found=true;break;}
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=w||ny>=h)continue;const ni=ny*w+nx;if(prev[ni]>=0||solid(nx+.5,ny+.5))continue;prev[ni]=c;q.push(ni);}}
 if(!found)return null;const path=[];let c=ty*w+tx;while(c!==sy*w+sx){path.unshift([c%w+.5,((c/w)|0)+.5]);c=prev[c];}return path;}
function loadLevel(i){lvI=i;const L=LV[i];const map=L.m.map(r=>r.split(''));const w=Math.max(...map.map(r=>r.length));map.forEach(r=>{while(r.length<w)r.push('#')});
 G={map,w,h:map.length,px:1.5,py:1.5,pa:0,loot:0,lootTot:0,key:0,coins:3,time:0,detected:false,guards:[],cams:[],coinsF:[],noise:[],stepT:0,over:false,alarm:0,ringFx:[]};
 const camList=[];
 for(let y=0;y<G.h;y++)for(let x=0;x<w;x++){const t=map[y][x];if(t==='S'){G.px=x+.5;G.py=y+.5;map[y][x]='.';}if(t==='$')G.lootTot++;if(t==='C'){camList.push([x,y]);map[y][x]='.';}}
 for(const [x,y] of camList){let best=0,ba=0;for(let k=0;k<8;k++){const a=k*Math.PI/4,l=rayLen(x+.5,y+.5,a,9);if(l>best){best=l;ba=a;}}G.cams.push({x:x+.5,y:y+.5,base:ba,a:ba,ph:Math.random()*6,sus:0});}
 for(const route of L.g){const pts=route.map(p=>{const f=nearestFloor(p[0],p[1]);return [f[0]+.5,f[1]+.5];});G.guards.push({x:pts[0][0],y:pts[0][1],a:0,route:pts,ri:0,path:[],st:'patrol',sus:0,tgt:null,repath:0,look:0,lost:0,lx:0,ly:0,bob:0});}

function unlocked(i){return i===0||save.s[i-1]>0;}
function firstOpen(){for(let i=0;i<LV.length;i++)if(!save.s[i])return unlocked(i)?i:0;return 0;}
function startLevel(i){au();SFX.click();loadLevel(i);}
function endNext(){if(endInfo&&endInfo.win&&lvI<LV.length-1)startLevel(lvI+1);else if(endInfo&&endInfo.win)state='menu';else startLevel(lvI);}
function btns(){const r=Math.min(H*.11,46);return {sneak:{x:W-r*3.3,y:H-r*1.3,r,l:'SNEAK'},act:{x:W-r*1.25,y:H-r*2.4,r,l:'ACT'},coin:{x:W-r*3.0,y:H-r*3.6,r:r*.8,l:'COIN'},pause:{x:W-28,y:28,r:20,l:'II'},rst:{x:W-76,y:28,r:20,l:'R'}};}
function menuCells(){const cols=4,cw=Math.min(170,(W-60)/cols),ch=Math.min(70,(H-170)/2-10);const ox=(W-cols*cw)/2,oy=H*.36;return LV.map((L,i)=>({i,x:ox+(i%cols)*cw+5,y:oy+((i/cols)|0)*(ch+12),w:cw-10,h:ch}));}
function pointer(x,y,id,isTouch){au();

 if(hit(b.pause)){paused=!paused;SFX.click();return;}if(hit(b.rst)){startLevel(lvI);return;}

 if(hit(b.sneak)){touchSneak=!touchSneak;SFX.click();return;}if(hit(b.act)){interact();return;}if(hit(b.coin)){throwCoin();return;}

function interact(){if(state!=='play'||paused)return;const cx=G.px+Math.cos(G.pa)*.7,cy=G.py+Math.sin(G.pa)*.7;let done=false;
 for(let dy=-1;dy<=1&&!done;dy++)for(let dx=-1;dx<=1&&!done;dx++){const tx=(G.px|0)+dx,ty=(G.py|0)+dy,t=tileAt(tx,ty);if(Math.hypot(tx+.5-G.px,ty+.5-G.py)>1.3)continue;
  if(t==='$'){G.map[ty][tx]='.';G.loot++;SFX.loot();burst(tx+.5,ty+.5,'#ffd84a',18);flash('Loot '+G.loot+'/'+G.lootTot);done=true;}
  else if(t==='D'){if(G.key>0){G.map[ty][tx]='d';SFX.door();burst(tx+.5,ty+.5,'#6cf',10);done=true;}else{SFX.locked();flash('Locked - find a keycard');done=true;}}}

function throwCoin(){if(state!=='play'||paused||G.coins<=0){if(G&&G.coins<=0)flash('No coins left');return;}G.coins--;const d=Math.min(4.5,rayLen(G.px,G.py,G.pa,5)-.3);

function makeNoise(x,y,r,kind){G.ringFx.push({x,y,r,t:0});for(const g of G.guards){if(g.st==='alert')continue;const d=Math.hypot(g.x-x,g.y-y);if(d<r){g.st='investigate';g.tgt=[x,y];g.path=bfs(g.x,g.y,x,y)||[];g.look=0;g.sus=Math.max(g.sus,.35);if(kind==='coin')SFX.huh();}}}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*3;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6+Math.random()*.4,c});}}
// ---------- update
function inShadow(x,y){return tileAt(x,y)==='s';}
function moveCircle(o,dx,dy,r){const nx=o.x+dx;if(!solid(nx+Math.sign(dx)*r,o.y-r*.8)&&!solid(nx+Math.sign(dx)*r,o.y+r*.8))o.x=nx;const ny=o.y+dy;if(!solid(o.x-r*.8,ny+Math.sign(dy)*r)&&!solid(o.x+r*.8,ny+Math.sign(dy)*r))o.y=ny;}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=6.2832;while(d<-Math.PI)d+=6.2832;return d;}
function update(dt){tAll+=dt;if(msgT>0)msgT-=dt;
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92;p.l-=dt;}parts=parts.filter(p=>p.l>0);

 // input
 let mx=0,my=0;if(keys.a||keys.arrowleft)mx--;if(keys.d||keys.arrowright)mx++;if(keys.w||keys.arrowup)my--;if(keys.s||keys.arrowdown)my++;
 if(joy.on){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy);if(l>8){const k=Math.min(1,l/50);mx=dx/l*k;my=dy/l*k;}}
 const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
 const sneak=keys.shift||touchSneak;G.sneak=sneak;const sp=sneak?1.5:3.3;const moving=Math.hypot(mx,my)>.1;
 if(moving){G.pa=Math.atan2(my,mx);const o={x:G.px,y:G.py};moveCircle(o,mx*sp*dt,my*sp*dt,.28);G.px=o.x;G.py=o.y;G.stepT-=dt;if(G.stepT<=0){G.stepT=sneak?.5:.32;if(!sneak){SFX.step();makeNoise(G.px,G.py,2.6,'step');}}}
 G.moving=moving;
 const t=tileAt(G.px,G.py);if(t==='K'){G.map[G.py|0][G.px|0]='.';G.key++;SFX.key();flash('Keycard acquired');burst(G.px,G.py,'#6cf',14);}
 if(t==='X'){if(G.loot>=G.lootTot)return finish(true);else if(msgT<=0)flash('Steal all loot first ('+G.loot+'/'+G.lootTot+')');}
 // coins
 for(const c of G.coinsF){c.t+=dt;if(c.t>=c.dur&&!c.done){c.done=true;SFX.coin();makeNoise(c.ex,c.ey,5.5,'coin');}}G.coinsF=G.coinsF.filter(c=>c.t<c.dur+3);
 for(const r of G.ringFx)r.t+=dt;G.ringFx=G.ringFx.filter(r=>r.t<.6);
 const vis=(inShadow(G.px,G.py)?.45:1)*(sneak?.85:1)*(moving?1:.9);
 // cameras
 for(const c of G.cams){c.ph+=dt*.6;c.a=c.base+Math.sin(c.ph)*.9;const d=Math.hypot(G.px-c.x,G.py-c.y),R=6.5*vis;
  const seen=d<R&&Math.abs(angDiff(Math.atan2(G.py-c.y,G.px-c.x),c.a))<.42&&los(c.x,c.y,G.px,G.py);c.seen=seen;
  if(seen){c.sus+=dt*1.4;if(c.sus>=1&&!c.trig){c.trig=true;SFX.alert();flash('CAMERA ALARM!');G.detected=true;G.alarm=3;
    G.guards.map(g=>[g,Math.hypot(g.x-G.px,g.y-G.py)]).sort((a,b)=>a[1]-b[1]).slice(0,2).forEach(([g])=>{g.st='alert';g.sus=1;g.lx=G.px;g.ly=G.py;g.lost=0;});}}
  else{c.sus=Math.max(0,c.sus-dt*.4);if(c.sus<.2)c.trig=false;}}
 if(G.alarm>0)G.alarm-=dt;
 // guards
 for(const g of G.guards){g.bob+=dt;const d=Math.hypot(G.px-g.x,G.py-g.y),R=(g.st==='alert'?7:5.5)*vis,fov=g.st==='alert'?.75:.55;
  const sees=d<R&&Math.abs(angDiff(Math.atan2(G.py-g.y,G.px-g.x),g.a))<fov&&los(g.x,g.y,G.px,G.py)||(d<.9&&los(g.x,g.y,G.px,G.py)&&(moving&&!sneak));
  g.sees=sees;
  if(sees){g.sus+=dt*(1.1+(1-d/Math.max(R,.1))*2.6);g.lx=G.px;g.ly=G.py;g.lost=0;}else g.sus=Math.max(0,g.sus-dt*(g.st==='alert'?.08:.25));
  if(g.sus>=1&&g.st!=='alert'){g.st='alert';g.sus=1;G.detected=true;SFX.alert();flash('SPOTTED!');}
  else if(g.st==='patrol'&&g.sus>.3&&sees){g.st='suspicious';}
  let speed=1.4,target=null;
  if(g.st==='alert'){speed=2.9;g.repath-=dt;if(!sees)g.lost+=dt;if(g.repath<=0){g.repath=.25;g.path=bfs(g.x,g.y,g.lx,g.ly)||[];}
   if(d<.55){return finish(false);} if(g.lost>4){g.st='investigate';g.tgt=[g.lx,g.ly];g.path=bfs(g.x,g.y,g.lx,g.ly)||[];g.look=0;g.sus=.6;}
   if(sees&&d<1.2){target=[G.px,G.py];}}
  else if(g.st==='suspicious'){speed=0;g.a+=angDiff(Math.atan2(G.py-g.y,G.px-g.x),g.a)*Math.min(1,dt*4);if(!sees&&g.sus<.25)g.st='patrol';if(g.sus<.35&&!sees){g.st='investigate';g.tgt=[g.lx,g.ly];g.path=bfs(g.x,g.y,g.lx,g.ly)||[];g.look=0;}}
  else if(g.st==='investigate'){speed=1.9;if(!g.path.length){g.look+=dt;g.a+=dt*2.2*Math.sin(g.look*2);if(g.look>3){g.st='patrol';g.path=[];}}}
  if(g.st==='patrol'&&!g.path.length){g.ri=(g.ri+1)%g.route.length;const p=g.route[g.ri];g.path=bfs(g.x,g.y,p[0],p[1])||[];}
  if(!target&&g.path.length)target=g.path[0];
  if(target&&speed>0){const dx=target[0]-g.x,dy=target[1]-g.y,l=Math.hypot(dx,dy);if(l<.08){g.path.shift();}else{const s=Math.min(l,speed*dt);g.x+=dx/l*s;g.y+=dy/l*s;g.a+=angDiff(Math.atan2(dy,dx),g.a)*Math.min(1,dt*7);}}}
}
function finish(win){if(G.over)return;G.over=true;let stars=0;

  if(t==='K'){ctx.fillStyle='#4cf';ctx.shadowColor='#4cf';ctx.shadowBlur=10;ctx.fillRect(sx+TS*.25,sy+TS*.35+Math.sin(tAll*5)*2,TS*.5,TS*.32);ctx.shadowBlur=0;ctx.fillStyle='#035';ctx.fillRect(sx+TS*.3,sy+TS*.42+Math.sin(tAll*5)*2,TS*.18,TS*.08);}
  if(t==='X'){const open=G.loot>=G.lootTot;ctx.fillStyle=open?'rgba(80,255,140,'+(.35+.25*Math.sin(tAll*4))+')':'rgba(120,120,120,.4)';ctx.fillRect(sx+2,sy+2,TS-4,TS-4);ctx.fillStyle='#fff';ctx.font='bold '+(TS*.35|0)+'px sans-serif';ctx.textAlign='center';ctx.fillText('EXIT',sx+TS/2,sy+TS*.62);}}
 // cones
 const cone=(x,y,a,fov,R,col)=>{const n=26,[sx,sy]=W2S(x,y);ctx.beginPath();ctx.moveTo(sx,sy);for(let i=0;i<=n;i++){const aa=a-fov+2*fov*i/n,l=rayLen(x,y,aa,R);ctx.lineTo(sx+Math.cos(aa)*l*TS,sy+Math.sin(aa)*l*TS);}ctx.closePath();ctx.fillStyle=col;ctx.fill();};
 for(const c of G.cams)cone(c.x,c.y,c.a,.42,6.5,c.seen?'rgba(255,60,60,.32)':'rgba(120,200,255,.16)');
 for(const g of G.guards){const col=g.st==='alert'?'rgba(255,40,40,.3)':g.sus>.3||g.st!=='patrol'?'rgba(255,160,40,.27)':'rgba(255,240,140,.18)';cone(g.x,g.y,g.a,g.st==='alert'?.75:.55,g.st==='alert'?7:5.5,col);}
 // noise rings
 for(const r of G.ringFx){const [sx,sy]=W2S(r.x,r.y);ctx.strokeStyle='rgba(255,255,255,'+(.4*(1-r.t/.6))+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx,sy,r.r*TS*(r.t/.6),0,6.28);ctx.stroke();}
 for(const c of G.coinsF){const k=Math.min(1,c.t/c.dur),x=c.sx+(c.ex-c.sx)*k,y=c.sy+(c.ey-c.sy)*k,[sx,sy]=W2S(x,y);ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(sx,sy-Math.sin(k*Math.PI)*TS*.8,TS*.1,0,6.28);ctx.fill();}
 // cams
 for(const c of G.cams){const [sx,sy]=W2S(c.x,c.y);ctx.fillStyle='#556';ctx.beginPath();ctx.arc(sx,sy,TS*.22,0,6.28);ctx.fill();ctx.fillStyle=c.seen||((tAll*2|0)%2)?'#f33':'#622';ctx.beginPath();ctx.arc(sx+Math.cos(c.a)*TS*.15,sy+Math.sin(c.a)*TS*.15,TS*.08,0,6.28);ctx.fill();}

 for(const g of G.guards){const [sx,sy]=W2S(g.x,g.y),r=TS*.32;ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(sx,sy+r*.5,r,r*.5,0,0,6.28);ctx.fill();
  ctx.fillStyle=g.st==='alert'?'#c33':'#3858a8';ctx.beginPath();ctx.arc(sx,sy,r,0,6.28);ctx.fill();ctx.fillStyle='#e8c39e';ctx.beginPath();ctx.arc(sx+Math.cos(g.a)*r*.35,sy+Math.sin(g.a)*r*.35,r*.45,0,6.28);ctx.fill();
  ctx.fillStyle='#1a2a55';ctx.beginPath();ctx.arc(sx+Math.cos(g.a)*r*.25,sy+Math.sin(g.a)*r*.25,r*.42,g.a+1.6,g.a+4.7);ctx.fill();
  if(g.sus>.02||g.st!=='patrol'){const s=g.st==='alert'?'!':'?';ctx.fillStyle=g.st==='alert'?'#ff3b3b':'#ffb340';ctx.font='bold '+(TS*.6|0)+'px sans-serif';ctx.textAlign='center';ctx.fillText(s,sx,sy-r*1.4+Math.sin(tAll*10)*2);
   ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(sx-r,sy-r*1.25,r*2,4);ctx.fillStyle=g.st==='alert'?'#f33':'#fb4';ctx.fillRect(sx-r,sy-r*1.25,r*2*Math.min(1,g.sus),4);}}
 // player
 {const [sx,sy]=W2S(G.px,G.py),r=TS*.3,sh=inShadow(G.px,G.py);ctx.globalAlpha=sh?.55:1;ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(sx,sy+r*.5,r,r*.5,0,0,6.28);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(sx,sy,r,0,6.28);ctx.fill();ctx.strokeStyle=G.sneak?'#8f8':'#ccc';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#e8c39e';ctx.beginPath();ctx.arc(sx+Math.cos(G.pa)*r*.3,sy+Math.sin(G.pa)*r*.3,r*.42,0,6.28);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(sx+Math.cos(G.pa)*r*.3-r*.4,sy+Math.sin(G.pa)*r*.3-r*.12,r*.8,r*.22);
  if(G.loot){ctx.fillStyle='#7a5a2a';ctx.beginPath();ctx.arc(sx-Math.cos(G.pa)*r*.7,sy-Math.sin(G.pa)*r*.7,r*.4,0,6.28);ctx.fill();}ctx.globalAlpha=1;}
 for(const p of parts){const [sx,sy]=W2S(p.x,p.y);ctx.globalAlpha=Math.max(0,Math.min(1,p.l));ctx.fillStyle=p.c;ctx.fillRect(sx-2,sy-2,4,4);}ctx.globalAlpha=1;

 if(G.guards.some(g=>g.st==='alert')||G.alarm>0){ctx.fillStyle='rgba(255,0,0,'+(.08+.06*Math.sin(tAll*10))+')';ctx.fillRect(0,0,W,H);}}

 ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(96,56,250,52);ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='left';
 ctx.fillText(`L${lvI+1} ${LV[lvI].n}`,104,74);ctx.font='13px sans-serif';ctx.fillText(`💎 ${G.loot}/${G.lootTot}  🔑 ${G.key}  🪙 ${G.coins}  ⏱ ${G.time.toFixed(1)}s`,104,94);
 ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(354,56,120,22);ctx.fillStyle=maxSus>=1?'#f33':maxSus>.3?'#fb4':'#6d6';ctx.fillRect(356,58,116*Math.min(1,maxSus),18);ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.fillText(G.detected?'DETECTED':'SUSPICION',360,71);

 if(joy.on){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(joy.ox,joy.oy,50,0,6.28);ctx.stroke();const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.min(50,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.arc(joy.ox+Math.cos(a)*l,joy.oy+Math.sin(a)*l,22,0,6.28);ctx.fill();}
