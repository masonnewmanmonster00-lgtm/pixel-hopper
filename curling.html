</head><body><a class="back" href="./index.html" aria-label="Back to menu" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">← Menu</a><canvas id="c"></canvas><script>
'use strict';
// ---------- constants (metres) ----------
const HOG2=21.95,TEE=28.35,BACK=30.18,HW=2.375,R=0.145,HOUSE=1.83,FRIC=0.095,FRIC_SW=0.078,CURL=0.011,REST=0.92;
const NEAR_TEE=-6.4;
const TEAMC=['#e03a3a','#f2c230'],TEAMD=['#8e1d1d','#a07a0c'];
const SAVE_KEY='curlingSave';
// ---------- state init (before first draw) ----------
let save={settings:{mode:'cpu',diff:1,ends:8,fgz:true},stats:{played:0,wins:0,losses:0,draws2p:0,best:0,stones:0,cpuDemo:0},match:null,muted:false};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s){Object.assign(save.settings,s.settings||{});Object.assign(save.stats,s.stats||{});save.match=s.match||null;save.muted=!!s.muted;}}catch(e){}
function saveHub(){const n=Math.round(Number(save.stats&&save.stats.best)||0);if(!(n>0))return;let prev=NaN;try{prev=Number(localStorage.getItem('arcade-curl-best'))}catch(e){}if(Number.isFinite(prev)&&prev>=n)return;try{localStorage.setItem('arcade-curl-best',String(n))}catch(e){}}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}saveHub();}
saveHub();
let screen='menu',G=null,paused=false,speedMul=1.5,NID=0;
let sweepHeld=false,keySweep=false,sweepUntil=0,now=0,spaceDown=false;
let cam={x:15,z:25,tx:15,tz:25};let confetti=[];let btns=[];let drag=null;let msg='',msgT=0;
const DIFFN=['Easy','Medium','Hard'];
const DIFF=[{n:10,nv:0.05,na:0.12,top:3},{n:36,nv:0.025,na:0.05,top:1},{n:999,nv:0.01,na:0.02,top:1,robust:true}];
// ---------- physics ----------
let clackCb=null;
function stepPhys(st,dt){
  let maxv=0;for(const s of st){const v=Math.hypot(s.vx,s.vy);if(v>maxv)maxv=v}
  if(maxv===0)return false;
  const n=Math.max(1,Math.ceil(maxv*dt/0.03)),h=dt/n;
  for(let k=0;k<n;k++){
    for(const s of st){const v=Math.hypot(s.vx,s.vy);if(v===0)continue;
      if(v<0.01){s.vx=s.vy=0;continue}
      const sw=!!s.sweep,a=sw?FRIC_SW:FRIC,dx=s.vx/v,dy=s.vy/v;
      const lat=s.spin*CURL*(sw?0.5:1)/(v+0.25)*Math.min(1,v/0.2);
      let nvx=s.vx-dx*a*h-dy*lat*h,nvy=s.vy-dy*a*h+dx*lat*h;
      if(nvx*dx+nvy*dy<=0.002){nvx=0;nvy=0}
      s.vx=nvx;s.vy=nvy;s.x+=s.vx*h;s.y+=s.vy*h;s.rot+=s.spin*h*0.9;}
    for(let i=0;i<st.length;i++)for(let j=i+1;j<st.length;j++){const a=st[i],b=st[j];
      const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2>=4*R*R||d2===0)continue;
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
      if(rel>0){const jj=(1+REST)/2*rel;a.vx-=jj*nx;a.vy-=jj*ny;b.vx+=jj*nx;b.vy+=jj*ny;a.hit=b.hit=true;a.spin*=0.4;b.spin*=0.2;if(clackCb)clackCb(rel)}
      const ov=2*R-d;a.x-=nx*ov/2;a.y-=ny*ov/2;b.x+=nx*ov/2;b.y+=ny*ov/2;}
  }
  return true;
}
const isOut=s=>s.x-R>BACK||Math.abs(s.y)+R>=HW;
const distT=s=>Math.hypot(s.x-TEE,s.y);
const inFGZ=s=>s.x+R>HOG2&&s.x<TEE&&distT(s)>HOUSE+R;
function mkStone(team,spin){return{id:++NID,team,x:0,y:0,vx:0,vy:0,spin,rot:Math.random()*6,hit:false,sweep:false}}
function launch(s,shot){const ang=Math.atan2(shot.aimY,TEE);s.vx=Math.cos(ang)*shot.speed;s.vy=Math.sin(ang)*shot.speed;s.spin=shot.spin}
function clone(st){return st.map(s=>({...s,vx:0,vy:0,sweep:false,hit:false}))}
function applyRules(before,after,thrown,team,idx,fgz){
  let st=after.slice();const t=st.find(s=>s.id===thrown.id);let note='';
  if(t&&t.x-R<HOG2&&!t.hit){st=st.filter(s=>s!==t);note='Hogged! Stone removed'}
  if(fgz&&idx<5){const prot=before.filter(s=>s.team!==team&&inFGZ(s));
    if(prot.some(p=>!st.find(s=>s.id===p.id)))return{stones:clone(before),note:'Free guard zone violation – stones reset'}}
  return{stones:st,note};
}
function simulateShot(stones,shot,team,idx,fgz){
  const before=clone(stones);let st=clone(stones);const t=mkStone(team,shot.spin);launch(t,shot);st.push(t);
  let time=0;const cb=clackCb;clackCb=null;
  while(time<80){if(!stepPhys(st,1/30))break;st=st.filter(s=>!isOut(s));time+=1/30}
  clackCb=cb;return applyRules(before,st,t,team,idx,fgz);
}
function scoreEnd(st){const ins=st.map(s=>({s,d:distT(s)})).filter(o=>o.d<=HOUSE+R).sort((a,b)=>a.d-b.d);
  if(!ins.length)return{team:-1,n:0};const t=ins[0].s.team;let n=0;for(const o of ins){if(o.s.team!==t)break;n++}return{team:t,n}}
// ---------- CPU ----------
const DRAW_TAB=[],HIT_SPEEDS=[3.3,4.0],HIT_TRAJ=[];
function emptyRun(v,rec){const s=mkStone(0,1);launch(s,{speed:v,aimY:0,spin:1});const st=[s],traj=[];let t=0;
  while(t<80&&stepPhys(st,1/30)){t+=1/30;if(rec)traj.push([s.x,s.y]);if(s.x>40)break}return{x:s.x,y:s.y,traj}}
for(let v=1.9;v<=3.4;v+=0.025){const r=emptyRun(v);DRAW_TAB.push({v,x:r.x,y:r.y})}
for(const v of HIT_SPEEDS)HIT_TRAJ.push(emptyRun(v,true).traj);
function drawShot(tx,ty,spin){let i=DRAW_TAB.findIndex(e=>e.x>=tx);if(i<0)i=DRAW_TAB.length-1;if(i===0)i=1;
  const a=DRAW_TAB[i-1],b=DRAW_TAB[i],f=Math.max(0,Math.min(1.5,(tx-a.x)/(b.x-a.x)));
  const v=a.v+f*(b.v-a.v),drift=(a.y+f*(b.y-a.y))*spin;return{speed:v,aimY:(ty-drift)*TEE/tx,spin,kind:'draw'}}
function hitShot(sx,sy,k,spin,off){const tr=HIT_TRAJ[k];let p=tr.find(q=>q[0]>=sx)||tr[tr.length-1];
  return{speed:HIT_SPEEDS[k],aimY:(sy+off-p[1]*spin)*TEE/sx,spin,kind:'hit'}}
function speedToX(v){let i=DRAW_TAB.findIndex(e=>e.v>=v);if(i<=0)return v<2?DRAW_TAB[0].x:99;const a=DRAW_TAB[i-1],b=DRAW_TAB[i];return a.x+(v-a.v)/(b.v-a.v)*(b.x-a.x)}
function evalPos(st,team,nextIdx){const sc=scoreEnd(st);const v=sc.team===team?sc.n:sc.team<0?0:-sc.n;
  if(nextIdx>=16)return v*10;let own=0,opp=0,g=0;
  for(const s of st){const d=distT(s);if(d<=HOUSE+R){if(s.team===team)own++;else opp++}else if(s.team===team&&inFGZ(s)&&Math.abs(s.y)<1.2)g++}
  return v*3+(own-opp)*0.6+g*(nextIdx<10?0.5:0.1)}
function gauss(){return (Math.random()+Math.random()+Math.random()-1.5)*1.41}
function chooseShot(st,team,idx,diff,fgz){
  const P=DIFF[diff];const c=[];
  const tg=[[TEE,0],[TEE-0.3,0.35],[TEE-0.3,-0.35],[TEE+0.4,0],[TEE-0.9,0],[TEE,0.6],[TEE,-0.6]];
  if(idx<12)tg.push([TEE-3.5,0],[TEE-3.5,0.5],[TEE-3.5,-0.5],[TEE-2.4,0.25],[TEE-2.4,-0.25]);
  for(const s of st){if(s.team===team&&distT(s)<HOUSE)tg.push([s.x-2.2,s.y]);if(inFGZ(s))tg.push([s.x+2.4,s.y+(s.y>0?-0.15:0.15)])}
  for(const sp of[1,-1])for(const t of tg)c.push(drawShot(t[0],t[1],sp));
  const opps=st.filter(s=>s.team!==team).sort((a,b)=>distT(a)-distT(b)).slice(0,4);
  for(const s of opps)for(const sp of[1,-1])for(let k=0;k<2;k++)for(const off of[0,0.07,-0.07])c.push(hitShot(s.x,s.y,k,sp,off));
  for(const s of st)if(s.team===team&&distT(s)<HOUSE+1)for(const sp of[1,-1])c.push(drawShot(s.x+1.1,s.y,sp));
  let cand=c;if(cand.length>P.n){cand=c.slice().sort(()=>Math.random()-0.5).slice(0,P.n)}
  let sc=cand.map(sh=>({sh,v:evalPos(simulateShot(st,sh,team,idx,fgz).stones,team,idx+1)})).sort((a,b)=>b.v-a.v);
  if(P.robust){const top=sc.slice(0,6);for(const o of top){let tot=o.v;for(let r=0;r<3;r++){const s2={...o.sh,speed:o.sh.speed+gauss()*P.nv,aimY:o.sh.aimY+gauss()*P.na};tot+=evalPos(simulateShot(st,s2,team,idx,fgz).stones,team,idx+1)}o.v=tot/4}top.sort((a,b)=>b.v-a.v);sc=top}
  const pick=sc[Math.floor(Math.random()*Math.min(P.top,sc.length))].sh;
  return{...pick,speed:pick.speed+gauss()*P.nv,aimY:pick.aimY+gauss()*P.na};
}
function runMatchFast(dA,dB,ends,fgz=true){let hammer=Math.random()<.5?0:1;const tot=[0,0];let e=0;
  while(e<30){e++;let st=[];for(let i=0;i<16;i++){const team=i%2===0?1-hammer:hammer;const shot=chooseShot(st,team,i,team===0?dA:dB,fgz);st=simulateShot(st,shot,team,i,fgz).stones}
    const sc=scoreEnd(st);if(sc.n>0){tot[sc.team]+=sc.n;hammer=1-sc.team}if(e>=ends&&tot[0]!==tot[1])break}
  return{tot,ends:e}}
// ---------- audio ----------
let AC=null,master,rumbleG,sweepG,crowdG;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=AC.createGain();master.gain.value=save.muted?0:0.8;master.connect(AC.destination);
  const len=AC.sampleRate*2,wb=AC.createBuffer(1,len,AC.sampleRate),bb=AC.createBuffer(1,len,AC.sampleRate);
  const w=wb.getChannelData(0),b=bb.getChannelData(0);let last=0;for(let i=0;i<len;i++){w[i]=Math.random()*2-1;last=(last+0.02*w[i])/1.02;b[i]=last*3.5}
  const mk=(buf,type,f,q,g)=>{const s=AC.createBufferSource();s.buffer=buf;s.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const gn=AC.createGain();gn.gain.value=g;s.connect(fl);fl.connect(gn);gn.connect(master);s.start();return gn};
  rumbleG=mk(bb,'lowpass',160,0.7,0);sweepG=mk(wb,'bandpass',3200,1.2,0);crowdG=mk(wb,'bandpass',700,0.5,0.015);
  window.__audioWB=wb;}
function clack(i){if(!AC||save.muted)return;const t=AC.currentTime,v=Math.min(1,i/2.5)*0.9+0.1;
  const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(2100,t);o.frequency.exponentialRampToValueAtTime(700,t+0.06);
  g.gain.setValueAtTime(v*0.6,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.13);
  const s=AC.createBufferSource();s.buffer=window.__audioWB;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=2500;const g2=AC.createGain();g2.gain.setValueAtTime(v*0.5,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.05);s.connect(f);f.connect(g2);g2.connect(master);s.start(t);s.stop(t+0.06);
  cheer(0.04+v*0.08,1.2)}
let crowdBase=0.015;
function cheer(level,dur){if(!AC)return;const t=AC.currentTime;crowdG.gain.cancelScheduledValues(t);crowdG.gain.setTargetAtTime(level,t,0.15);crowdG.gain.setTargetAtTime(crowdBase,t+dur,0.6)}
clackCb=clack;
function setMuted(m){save.muted=m;persist();if(master)master.gain.setTargetAtTime(m?0:0.8,AC.currentTime,0.03)}
// ---------- match flow ----------
function teamName(t){if(!G)return'';return G.names[t]}
function newMatch(cfg){const s=cfg||save.settings;
  const diffs=s.mode==='cpu'?[null,s.diff]:s.mode==='2p'?[null,null]:[s.diff,2];
  const names=s.mode==='cpu'?['You','CPU '+DIFFN[s.diff]]:s.mode==='2p'?['Red','Yellow']:['CPU '+DIFFN[s.diff],'CPU Hard'];
  G={mode:s.mode,diffs,names,ends:s.ends,fgz:s.fgz,scores:[[],[]],end:1,hammer:Math.random()<.5?0:1,idx:0,stones:[],phase:'aim',aimY:0,power:0,spin:1,active:null,timer:0,note:'',sum:null,winner:-1,before:null};
  screen='play';paused=false;confetti=[];nextThrow();saveMatch();}
function thrower(){return G.idx%2===0?1-G.hammer:G.hammer}
function isHuman(t){return G.diffs[t]===null}
function nextThrow(){const t=thrower();G.power=0;G.active=null;G.aimY=G.lastAim?.[t]??0;G.spin=G.lastSpin?.[t]??1;
  if(isHuman(t)){G.phase='aim';cam.tx=15;cam.tz=fullZ()}else{G.phase='cpu';G.timer=0.7}}
function throwStone(shot){const t=thrower();G.before=clone(G.stones);const s=mkStone(t,shot.spin);launch(s,shot);G.stones.push(s);G.active=s;G.phase='moving';
  G.lastAim=G.lastAim||[0,0];G.lastSpin=G.lastSpin||[1,1];if(isHuman(t)){G.lastAim[t]=shot.aimY;G.lastSpin[t]=shot.spin;save.stats.stones++}G.note='';}
function finishThrow(){const t=thrower();const r=applyRules(G.before,G.stones,G.active,t,G.idx,G.fgz);G.stones=r.stones;G.note=r.note;if(r.note){msg=r.note;msgT=2.2}
  for(const s of G.stones){s.vx=s.vy=0;s.sweep=false;s.hit=false}
  G.active=null;G.idx++;
  const sc=scoreEnd(G.stones);if(sc.n>0&&!r.note)cheer(0.05,0.8);
  if(G.idx>=16){endEnd()}else{G.phase='settled';G.timer=1.0;cam.tx=TEE-2.5;cam.tz=followZ()}saveMatch();}
function totals(){return[G.scores[0].reduce((a,b)=>a+b,0),G.scores[1].reduce((a,b)=>a+b,0)]}
function endEnd(){const sc=scoreEnd(G.stones);G.scores[0].push(sc.team===0?sc.n:0);G.scores[1].push(sc.team===1?sc.n:0);
  const prevH=G.hammer;if(sc.n>0)G.hammer=1-sc.team;
  G.sum={end:G.end,team:sc.team,n:sc.n,hammerTo:G.hammer,kept:sc.n===0||sc.team!==prevH?false:false};
  if(sc.n>0&&isHuman(sc.team)&&G.mode!=='demo')save.stats.best=Math.max(save.stats.best,sc.n);
  if(sc.n>0)cheer(0.12+0.04*sc.n,1.8);

  cam.tx=TEE-1;cam.tz=followZ();persist();}
function continueAfterEnd(){if(G.winner>=0){gameOver();return}G.end++;G.stones=[];G.idx=0;nextThrow();saveMatch()}
function gameOver(){G.phase='over';const w=G.winner;save.stats.played++;
  if(G.mode==='cpu'){if(w===0)save.stats.wins++;else save.stats.losses++}else if(G.mode==='demo')save.stats.cpuDemo++;

function saveMatch(){if(!G||G.phase==='over'){return}
  save.match={mode:G.mode,diffs:G.diffs,names:G.names,ends:G.ends,fgz:G.fgz,scores:G.scores,end:G.end,hammer:G.hammer,idx:G.idx,stones:G.stones.filter(s=>s.vx===0&&s.vy===0).map(s=>({team:s.team,x:+s.x.toFixed(4),y:+s.y.toFixed(4)})),phase:G.phase,winner:G.winner};persist()}
function resumeMatch(){const m=save.match;if(!m)return;G={...m,stones:m.stones.map(o=>({...mkStone(o.team,0),x:o.x,y:o.y})),aimY:0,power:0,spin:1,active:null,timer:0,note:'',sum:null,before:null};
  screen='play';paused=false;if(m.phase==='endsum'||G.idx>=16){G.scores[0].pop();G.scores[1].pop();G.idx=16;endEnd()}else nextThrow()}
function spawnConfetti(w){for(let i=0;i<180;i++)confetti.push({x:Math.random()*W,y:-Math.random()*H,vx:(Math.random()-.5)*60,vy:60+Math.random()*120,r:Math.random()*6,c:Math.random()<.6?TEAMC[w]:['#fff','#4aa3ff','#7be07b'][i%3],s:3+Math.random()*4})}
// ---------- canvas ----------
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W=844,H=390,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,3);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener('resize',resize);resize();
const fullZ=()=>Math.min((W-16)/33.5,H*0.42/(2*HW));
const followZ=()=>Math.min(H*0.56/(2*HW),W/14);
function sheetY(){return screen==='play'&&G&&(G.phase==='aim'||G.phase==='cpu')?H*0.52:H*0.56}
function drawWorld(ox,oy,z,cx,cy,showAim){
  const X=x=>ox+(x-cx)*z,Y=y=>oy+(y-cy)*z;
  ctx.fillStyle='#3a4552';ctx.fillRect(X(-9),Y(-HW)-6,X(33)-X(-9),(2*HW)*z+12);
  const g=ctx.createLinearGradient(0,Y(-HW),0,Y(HW));g.addColorStop(0,'#dfe9f2');g.addColorStop(.5,'#f4f8fc');g.addColorStop(1,'#dbe6f0');

  for(const tx of[TEE,NEAR_TEE]){const rings=[[HOUSE,'#2f6fd0'],[1.22,'#f4f8fc'],[0.61,'#d23b3b'],[0.15,'#f4f8fc']];
    for(const[r,c]of rings){ctx.beginPath();ctx.arc(X(tx),Y(0),r*z,0,7);ctx.fillStyle=c;ctx.fill()}}
  ctx.lineWidth=Math.max(1,z*0.02);ctx.strokeStyle='#33404d';
  const ln=(x1,y1,x2,y2)=>{ctx.beginPath();ctx.moveTo(X(x1),Y(y1));ctx.lineTo(X(x2),Y(y2));ctx.stroke()};
  ln(NEAR_TEE-1.83,0,BACK+1.83,0);for(const x of[TEE,BACK,NEAR_TEE,NEAR_TEE-1.83])ln(x,-HW,x,HW);
  ctx.strokeStyle='#c42828';ctx.lineWidth=Math.max(2,z*0.1);ln(0,-HW,0,HW);ln(HOG2,-HW,HOG2,HW);
  ctx.fillStyle='#222';ctx.fillRect(X(TEE+3.66)-z*0.1,Y(0.3),z*0.2,z*0.2);ctx.fillRect(X(TEE+3.66)-z*0.1,Y(-0.1),z*0.2,z*0.2);
  if(showAim&&G){const t=thrower();ctx.setLineDash([z*0.3,z*0.25]);ctx.strokeStyle='rgba(20,40,70,.55)';ctx.lineWidth=Math.max(1.5,z*0.04);
    ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(TEE),Y(G.aimY));ctx.stroke();ctx.setLineDash([]);
    // broom target
    ctx.fillStyle=TEAMD[t];ctx.beginPath();ctx.ellipse(X(TEE),Y(G.aimY),z*0.28,z*0.12,0,0,7);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=2;ln(TEE,G.aimY,TEE-0.8,G.aimY-0.25);
    // curl hint
    const dir=G.spin;ctx.strokeStyle=TEAMC[t];ctx.lineWidth=Math.max(2,z*0.06);ctx.beginPath();
