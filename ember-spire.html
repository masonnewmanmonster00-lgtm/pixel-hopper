<style>

html,body{margin:0;height:100%;overflow:hidden;background:#120d1a;color:#f3e9d2;font-family:Georgia,"Times New Roman",serif}
body{background:radial-gradient(ellipse at 50% 20%,#2c1f3d 0%,#140e1d 60%,#0a0710 100%)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 110px;background:linear-gradient(#000a,#0000);font-size:15px;min-height:44px;flex-wrap:wrap}
.topbar b{color:#ffd76a}
a.back{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:95;display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(8,8,16,.82);color:#ffe14d;border:1px solid rgba(255,225,77,.55);font:700 12px/1 ui-monospace,monospace;letter-spacing:.04em;text-decoration:none;touch-action:manipulation}a.back:focus-visible{outline:2px solid #ffe14d;outline-offset:2px}
#mute{position:fixed;top:8px;right:8px;z-index:60;background:#0009;border:1px solid #fff3;color:#fff;border-radius:8px;padding:0 12px;min-height:40px;font-size:16px;cursor:pointer}
.screen{flex:1;position:relative;overflow:hidden}
button.btn{font-family:inherit;font-size:18px;padding:10px 22px;border-radius:10px;border:2px solid #c9a24a;background:linear-gradient(#5a3b1c,#2e1d0d);color:#ffe9b0;cursor:pointer;box-shadow:0 4px 0 #1a0f06,0 0 18px #c9a24a33;margin:6px}
button.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1a0f06}
button.btn:disabled{opacity:.4}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;overflow:auto}
h1.title{font-size:clamp(40px,10vw,84px);margin:0;letter-spacing:3px;background:linear-gradient(#ffe7a0,#e0782a 60%,#8a2c12);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 12px #e0782a66)}
.sub{opacity:.8;margin:4px 0 18px;font-style:italic}

.card{position:relative;width:var(--cw,120px);height:calc(var(--cw,120px)*1.42);border-radius:10px;flex:none;cursor:pointer;transition:transform .18s,box-shadow .18s;font-family:Georgia,serif;color:#fff;box-shadow:0 6px 14px #000a}
.card .frame{position:absolute;inset:0;border-radius:10px;border:3px solid var(--edge);background:linear-gradient(160deg,var(--c1),var(--c2));overflow:hidden}
.card .art{position:absolute;left:8%;right:8%;top:20%;height:36%;border-radius:6px;border:2px solid #0006;background:radial-gradient(circle at 50% 40%,var(--glow),#0008 80%);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw,120px)*.3)}
.card .nm{position:absolute;top:6%;left:20%;right:4%;font-size:calc(var(--cw,120px)*.105);font-weight:bold;text-align:center;white-space:nowrap;overflow:hidden;text-shadow:0 1px 2px #000}
.card .nm.up{color:#9dff8a}
.card .cost{position:absolute;top:-6px;left:-6px;width:calc(var(--cw,120px)*.27);height:calc(var(--cw,120px)*.27);border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#d9701f 70%,#6b2a05);border:2px solid #fff8;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:calc(var(--cw,120px)*.15);color:#2a1200;z-index:2}
.card .ty{position:absolute;top:56.5%;left:0;right:0;text-align:center;font-size:calc(var(--cw,120px)*.075);opacity:.8;letter-spacing:1px}
.card .ds{position:absolute;top:63%;left:7%;right:7%;bottom:5%;font-size:calc(var(--cw,120px)*.088);line-height:1.2;text-align:center;background:#0005;border-radius:6px;padding:4px;display:flex;align-items:center;justify-content:center}
.card.attack{--c1:#7a2a22;--c2:#3a0f0c;--edge:#e0846a;--glow:#ff5a3c}
.card.skill{--c1:#24507a;--c2:#0d233a;--edge:#7ab8e0;--glow:#4ab0ff}
.card.power{--c1:#6a3a86;--c2:#2a1238;--edge:#d7a0f0;--glow:#d86aff}
.card.curse{--c1:#333;--c2:#111;--edge:#777;--glow:#666}
.card.unplayable{filter:saturate(.4) brightness(.75)}
.card.rare .frame{border-color:#ffd76a;box-shadow:inset 0 0 14px #ffd76a66}
#hand{position:absolute;left:0;right:0;bottom:0;height:calc(var(--cw)*1.42 + 20px);display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px}
#hand .card{margin:0 calc(var(--ov,-10px));transform-origin:50% 120%}
#hand .card:hover{z-index:10}
#hand .card.sel{transform:translateY(-30px) scale(1.1)!important;z-index:20;box-shadow:0 0 24px #ffd76a}
.card.drag{position:fixed!important;z-index:100;transition:none;pointer-events:none;margin:0!important}
.card.flyout{transition:transform .35s ease-in,opacity .35s;opacity:0}
/* battle */
#field{position:absolute;left:0;right:0;top:0;bottom:calc(var(--cw)*1.42 + 70px);display:flex;align-items:flex-end;justify-content:space-around;padding:0 2%}
.unit{position:relative;display:flex;flex-direction:column;align-items:center;transition:transform .15s}
.unit canvas{display:block}
.hpbar{width:110px;height:12px;background:#300;border:1px solid #000;border-radius:6px;position:relative;overflow:hidden;margin-top:4px}
.hpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff6b5a,#a51d12);transition:width .3s}
.hpbar span{position:absolute;inset:0;font:bold 10px sans-serif;text-align:center;line-height:12px;text-shadow:0 0 3px #000}
.blk{position:absolute;left:-14px;bottom:-4px;background:#3b78c4;border:2px solid #cfe6ff;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;width:30px;height:30px;font:bold 13px sans-serif;display:flex;align-items:center;justify-content:center}
.statuses{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap;justify-content:center;max-width:140px;font:bold 11px sans-serif}
.statuses span{background:#0008;border-radius:5px;padding:1px 4px;border:1px solid #fff3}
.intent{font:bold 15px sans-serif;background:#000a;padding:2px 8px;border-radius:10px;border:1px solid #fff3;margin-bottom:4px;white-space:nowrap}
.enemy.target{filter:drop-shadow(0 0 10px #ff4)}
.hit{animation:hit .3s}
@keyframes hit{0%{transform:translateX(0)}25%{transform:translateX(-10px)}50%{transform:translateX(10px)}100%{transform:none}}
.lunge{animation:lunge .35s}
@keyframes lunge{50%{transform:translateX(-40px)}}
.lungeR{animation:lungeR .35s}
@keyframes lungeR{50%{transform:translateX(40px)}}
.float{position:fixed;font:bold 26px sans-serif;pointer-events:none;z-index:200;animation:flt 1s forwards;text-shadow:0 2px 4px #000}
@keyframes flt{to{transform:translateY(-60px);opacity:0}}
#energy{position:absolute;left:12px;bottom:calc(var(--cw)*1.42 + 24px);width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#e0782a 60%,#5a1f00);border:3px solid #fff8;display:flex;align-items:center;justify-content:center;font:bold 22px sans-serif;color:#2a1200;box-shadow:0 0 20px #e0782a}
#endTurn{position:absolute;right:12px;bottom:calc(var(--cw)*1.42 + 24px)}
.pile{position:absolute;bottom:calc(var(--cw)*1.42 + 30px);font:13px sans-serif;background:#0008;padding:4px 8px;border-radius:8px;cursor:pointer}
/* map */
#mapWrap{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
#mapCv{display:block;margin:0 auto}
.overlay{position:absolute;inset:0;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;padding:14px;text-align:center;overflow:auto}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.relic{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#0008;border:1px solid #ffd76a88;font-size:17px;cursor:help}
.panel{background:linear-gradient(#2b1f38,#170f20);border:2px solid #c9a24a;border-radius:14px;padding:16px;max-width:640px}
.shopItem{display:flex;flex-direction:column;align-items:center;gap:4px}
.price{color:#ffd76a;font:bold 15px sans-serif}
.tip{position:fixed;z-index:300;background:#000e;border:1px solid #c9a24a;padding:6px 10px;border-radius:8px;font:13px sans-serif;max-width:240px;pointer-events:none}
.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);font:bold 34px Georgia;color:#ffd76a;text-shadow:0 3px 10px #000;z-index:150;pointer-events:none;animation:toast 1.3s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}
.grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-height:62vh;overflow:auto;padding:10px}
#titleCv{position:absolute;inset:0;width:100%;height:100%}
.stats{font:14px sans-serif;opacity:.85;line-height:1.6}
@media(max-height:520px){h1.title{font-size:32px}.sub{margin:2px 0 8px}button.btn{padding:8px 14px;font-size:16px;margin:4px}.center{padding:52px 12px 12px}}
</style></head><body>

<script>
"use strict";
// ---------- storage ----------
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
// ---------- audio ----------
const SFX=(()=>{let ctx=null,muted=store.get('es_mute',false);
function ac(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==='suspended'){const p=ctx.resume();if(p&&p.catch)p.catch(()=>{})}return ctx}
function tone(f,d,type='sine',v=.2,slide=0,delay=0){const c=ac();if(!c||muted)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v=.2,hp=800,delay=0){const c=ac();if(!c||muted)return;const t=c.currentTime+delay,b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=c.createGain();g.gain.value=v;s.connect(f).connect(g).connect(c.destination);s.start(t)}
const p={
 card(){tone(500,.08,'triangle',.12,300)},hit(){noise(.18,.3,400);tone(140,.15,'square',.12,-80)},block(){tone(300,.12,'triangle',.18,200);noise(.06,.1,3000)},
 draw(){tone(900,.04,'sine',.05,200)},buff(){tone(400,.2,'sine',.12,400);tone(600,.25,'sine',.1,500,.08)},gold(){tone(1200,.08,'square',.06);tone(1600,.12,'square',.06,0,.07)},
 win(){[523,659,784,1046].forEach((f,i)=>tone(f,.3,'triangle',.15,0,i*.12))},lose(){[400,300,200,120].forEach((f,i)=>tone(f,.4,'sawtooth',.1,0,i*.2))},
 click(){tone(700,.05,'square',.06)},heal(){[440,554,659].forEach((f,i)=>tone(f,.3,'sine',.12,0,i*.1))},err(){tone(160,.15,'square',.1)},turn(){tone(260,.2,'triangle',.12,-60)}};
return{play(n){try{p[n]&&p[n]()}catch(e){}},toggle(){muted=!muted;store.set('es_mute',muted);return muted},get muted(){return muted},unlock(){ac()}}})();
const muteBtn=document.getElementById('mute');muteBtn.textContent=SFX.muted?'🔇':'🔊';
muteBtn.onclick=()=>{muteBtn.textContent=SFX.toggle()?'🔇':'🔊'};
document.addEventListener('pointerdown',()=>SFX.unlock(),{once:true});
// ---------- rng ----------
let seed=Date.now()%1e9;function rnd(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pick=a=>a[Math.floor(rnd()*a.length)],shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
// ---------- cards ----------
// effect fns get (g,c) where c card instance w/ up flag; v(c,a,b)
const V=(c,a,b)=>c.up?b:a;
const CARDS={
strike:{n:'Strike',t:'attack',cost:1,r:'basic',i:'🗡️',d:c=>`Deal ${V(c,6,9)} damage.`,tg:1,f:(g,c,t)=>g.atk(t,V(c,6,9))},
defend:{n:'Defend',t:'skill',cost:1,r:'basic',i:'🛡️',d:c=>`Gain ${V(c,5,8)} Block.`,f:(g,c)=>g.blk(V(c,5,8))},
bash:{n:'Bash',t:'attack',cost:2,r:'basic',i:'🔨',d:c=>`Deal ${V(c,8,10)} damage. Apply ${V(c,2,3)} Vulnerable.`,tg:1,f:(g,c,t)=>{g.atk(t,V(c,8,10));g.apply(t,'vuln',V(c,2,3))}},
cleave:{n:'Cleave',t:'attack',cost:1,r:'common',i:'🪓',d:c=>`Deal ${V(c,8,11)} damage to ALL enemies.`,f:(g,c)=>g.atkAll(V(c,8,11))},
twin:{n:'Twin Strike',t:'attack',cost:1,r:'common',i:'⚔️',d:c=>`Deal ${V(c,5,7)} damage twice.`,tg:1,f:(g,c,t)=>{g.atk(t,V(c,5,7));g.atk(t,V(c,5,7))}},
iron:{n:'Iron Wave',t:'attack',cost:1,r:'common',i:'🌊',d:c=>`Gain ${V(c,5,7)} Block. Deal ${V(c,5,7)} damage.`,tg:1,f:(g,c,t)=>{g.blk(V(c,5,7));g.atk(t,V(c,5,7))}},
pommel:{n:'Pommel Strike',t:'attack',cost:1,r:'common',i:'🗡️',d:c=>`Deal ${V(c,9,10)} damage. Draw ${V(c,1,2)} card${c.up?'s':''}.`,tg:1,f:(g,c,t)=>{g.atk(t,V(c,9,10));g.draw(V(c,1,2))}},
quick:{n:'Quick Slash',t:'attack',cost:0,r:'common',i:'💨',d:c=>`Deal ${V(c,4,7)} damage. Draw 1 card.`,tg:1,f:(g,c,t)=>{g.atk(t,V(c,4,7));g.draw(1)}},
heavy:{n:'Heavy Blade',t:'attack',cost:2,r:'common',i:'🗡️',d:c=>`Deal 14 damage. Strength affects this ${V(c,3,5)} times.`,tg:1,f:(g,c,t)=>g.atk(t,14,V(c,3,5))},
anger:{n:'Anger',t:'attack',cost:0,r:'common',i:'😤',d:c=>`Deal ${V(c,6,8)} damage. Add a copy to discard.`,tg:1,f:(g,c,t)=>{g.atk(t,V(c,6,8));g.discard.push({id:'anger',up:c.up,uid:g.uid()})}},
clothes:{n:'Clothesline',t:'attack',cost:2,r:'common',i:'💪',d:c=>`Deal ${V(c,12,14)} damage. Apply ${V(c,2,3)} Weak.`,tg:1,f:(g,c,t)=>{g.atk(t,V(c,12,14));g.apply(t,'weak',V(c,2,3))}},
thunder:{n:'Thunderclap',t:'attack',cost:1,r:'common',i:'⚡',d:c=>`Deal ${V(c,4,7)} damage and 1 Vulnerable to ALL.`,f:(g,c)=>{g.atkAll(V(c,4,7));g.enemies.forEach(e=>e.hp>0&&g.apply(e,'vuln',1))}},
poisonstab:{n:'Venom Stab',t:'attack',cost:1,r:'common',i:'🐍',d:c=>`Deal 6 damage. Apply ${V(c,3,5)} Poison.`,tg:1,f:(g,c,t)=>{g.atk(t,6);g.apply(t,'poison',V(c,3,5))}},
shrug:{n:'Shrug It Off',t:'skill',cost:1,r:'common',i:'🤷',d:c=>`Gain ${V(c,8,11)} Block. Draw 1 card.`,f:(g,c)=>{g.blk(V(c,8,11));g.draw(1)}},
armaments:{n:'Armaments',t:'skill',cost:1,r:'common',i:'🔧',d:c=>`Gain 5 Block. Upgrade ${c.up?'ALL cards':'a random card'} in hand.`,f:(g,c)=>{g.blk(5);const h=g.hand.filter(x=>!x.up&&x!==c);if(c.up)h.forEach(x=>x.up=true);else if(h.length)pick(h).up=true}},
flex:{n:'Flex',t:'skill',cost:0,r:'common',i:'💪',d:c=>`Gain ${V(c,2,4)} Strength this turn.`,f:(g,c)=>{g.applyP('str',V(c,2,4));g.applyP('strDown',V(c,2,4))}},
warcry:{n:'Battle Cry',t:'skill',cost:0,r:'common',i:'📣',d:c=>`Draw ${V(c,2,3)} cards. Exhaust.`,ex:1,f:(g,c)=>g.draw(V(c,2,3))},
backflip:{n:'Backflip',t:'skill',cost:1,r:'common',i:'🤸',d:c=>`Gain ${V(c,5,8)} Block. Draw 2 cards.`,f:(g,c)=>{g.blk(V(c,5,8));g.draw(2)}},
deflect:{n:'Deflect',t:'skill',cost:0,r:'common',i:'✋',d:c=>`Gain ${V(c,4,7)} Block.`,f:(g,c)=>g.blk(V(c,4,7))},
toxic:{n:'Toxic Cloud',t:'skill',cost:1,r:'common',i:'☁️',d:c=>`Apply ${V(c,3,4)} Poison to ALL enemies.`,f:(g,c)=>g.enemies.forEach(e=>e.hp>0&&g.apply(e,'poison',V(c,3,4)))},
taunt:{n:'Intimidate',t:'skill',cost:0,r:'common',i:'👁️',d:c=>`Apply ${V(c,1,2)} Weak to ALL enemies. Exhaust.`,ex:1,f:(g,c)=>g.enemies.forEach(e=>e.hp>0&&g.apply(e,'weak',V(c,1,2)))},
carnage:{n:'Carnage',t:'attack',cost:2,r:'uncommon',i:'🩸',d:c=>`Deal ${V(c,20,28)} damage. Ethereal.`,eth:1,tg:1,f:(g,c,t)=>g.atk(t,V(c,20,28))},
uppercut:{n:'Uppercut',t:'attack',cost:2,r:'uncommon',i:'👊',d:c=>`Deal 13 damage. Apply ${V(c,1,2)} Weak and Vulnerable.`,tg:1,f:(g,c,t)=>{g.atk(t,13);g.apply(t,'weak',V(c,1,2));g.apply(t,'vuln',V(c,1,2))}},
whirl:{n:'Whirlwind',t:'attack',cost:'X',r:'uncommon',i:'🌀',d:c=>`Deal ${V(c,5,8)} damage to ALL enemies X times.`,f:(g,c,t,x)=>{for(let i=0;i<x;i++)g.atkAll(V(c,5,8))}},
pummel:{n:'Pummel',t:'attack',cost:1,r:'uncommon',i:'🥊',d:c=>`Deal 2 damage ${V(c,4,5)} times. Exhaust.`,ex:1,tg:1,f:(g,c,t)=>{for(let i=0;i<V(c,4,5);i++)g.atk(t,2)}},
bodyslam:{n:'Body Slam',t:'attack',cost:1,r:'uncommon',i:'🏋️',d:c=>`Deal damage equal to your Block.${c.up?' Costs 0.':''}`,cost2:0,tg:1,f:(g,c,t)=>g.atk(t,g.p.block)},
catalyst:{n:'Catalyst',t:'skill',cost:1,r:'uncommon',i:'⚗️',d:c=>`${c.up?'Triple':'Double'} an enemy's Poison. Exhaust.`,ex:1,tg:1,f:(g,c,t)=>{t.st.poison=(t.st.poison||0)*V(c,2,3)}},
entrench:{n:'Entrench',t:'skill',cost:2,r:'uncommon',i:'🏰',d:c=>`Double your Block.${c.up?' Costs 1.':''}`,cost2:1,f:(g,c)=>g.blk(g.p.block,true)},
secondwind:{n:'Second Wind',t:'skill',cost:1,r:'uncommon',i:'🌬️',d:c=>`Gain ${V(c,12,16)} Block. Heal 3 HP. Exhaust.`,ex:1,f:(g,c)=>{g.blk(V(c,12,16));g.heal(3)}},
adrenaline:{n:'Adrenaline',t:'skill',cost:0,r:'uncommon',i:'💉',d:c=>`Gain ${V(c,1,2)} Energy. Draw 2 cards. Exhaust.`,ex:1,f:(g,c)=>{g.energy+=V(c,1,2);g.draw(2)}},
bloodletting:{n:'Bloodletting',t:'skill',cost:0,r:'uncommon',i:'🩸',d:c=>`Lose 3 HP. Gain ${V(c,2,3)} Energy.`,f:(g,c)=>{g.loseHp(3);g.energy+=V(c,2,3)}},
disarm:{n:'Disarm',t:'skill',cost:1,r:'uncommon',i:'🫳',d:c=>`Enemy loses ${V(c,2,3)} Strength. Exhaust.`,ex:1,tg:1,f:(g,c,t)=>g.apply(t,'str',-V(c,2,3))},

  if(rw.t==='gold'){b.textContent=`💰 ${rw.v} Gold`;b.onclick=()=>{run.gold+=rw.v;stats.gold+=rw.v;SFX.play('gold');b.remove();renderTop();saveRun()}}
  else if(rw.t==='relic'){const k=newRelic();if(!k)return;b.innerHTML=`${RELICS[k].i} ${RELICS[k].n} <small>(${RELICS[k].d})</small>`;b.onclick=()=>{gainRelic(k);b.remove();renderTop();saveRun()}}
  else{b.textContent='🃏 Add a card to your deck';b.onclick=()=>{const cs=rollCards(3,rw.rare);const ov=el('div','overlay');ov.innerHTML='<h2>Choose a Card</h2>';const r=el('div','row');cs.forEach(c=>{const ce=cardEl(c,Math.min(130,innerWidth/3.6));ce.onclick=()=>{run.deck.push({id:c.id,up:c.up});SFX.play('card');ov.remove();b.remove();renderTop();saveRun()};r.appendChild(ce)});ov.appendChild(r);const s=el('button','btn','Skip');s.onclick=()=>ov.remove();ov.appendChild(s);screen.appendChild(ov)}}
  b.classList.add('reward');p.appendChild(b)});
 const go=el('button','btn',boss?(run.act<3?`Ascend to Act ${run.act+1} ➜`:'Claim Victory 👑'):'Proceed ➜');go.id='proceed';go.onclick=()=>{SFX.play('click');if(boss){if(run.act>=3){victory();return}run.act++;run.hp=run.maxHp;genMap();saveRun();toast('Act '+run.act)}saveRun();goMap()};o.appendChild(go);screen.appendChild(o);saveRun()}
function restSite(){screen.innerHTML='';renderTop();const o=el('div','overlay');o.innerHTML='<div style="font-size:70px">🔥</div><h2>Rest Site</h2><div class="sub">The campfire crackles warmly.</div>';const r=el('div','row');
 const heal=Math.round(run.maxHp*.3);const b1=el('button','btn',`💤 Rest (heal ${heal})`);b1.id='restBtn';b1.disabled=has('coffee');b1.onclick=()=>{run.hp=Math.min(run.maxHp,run.hp+heal);SFX.play('heal');done()};
 const b2=el('button','btn','⚒️ Smith (upgrade a card)');b2.id='smithBtn';b2.onclick=()=>{const up=run.deck.filter(c=>!c.up&&CARDS[c.id].r!=='status');showPile('Choose a card to upgrade',up,c=>{c.up=true;SFX.play('buff');toast(CARDS[c.id].n+'+');done()})};
 r.append(b1,b2);o.appendChild(r);screen.appendChild(o);function done(){saveRun();goMap()}}
function shop(){screen.innerHTML='';renderTop();const o=el('div','overlay');o.innerHTML='<h2>💰 The Merchant</h2><div class="sub">"Coin for cards, friend."</div>';
 const r=el('div','row');const cs=rollCards(5,false);cs.forEach(c=>{const price=({common:50,uncommon:75,rare:150})[CARDS[c.id].r]+ri(-5,10);const it=el('div','shopItem');const ce=cardEl(c,Math.min(105,innerWidth/5.6));const pr=el('div','price',price+'g');it.append(ce,pr);
  ce.onclick=()=>{if(run.gold<price||it.dataset.sold){SFX.play('err');return}run.gold-=price;run.deck.push({id:c.id,up:c.up});it.dataset.sold=1;it.style.opacity=.3;SFX.play('gold');renderTop();saveRun()};r.appendChild(it)});o.appendChild(r);
 const r2=el('div','row');r2.style.marginTop='10px';const rk=newRelic();if(rk){const price=150;const b=el('button','btn',`${RELICS[rk].i} ${RELICS[rk].n} — ${price}g`);tip(b,RELICS[rk].d);b.onclick=()=>{if(run.gold<price){SFX.play('err');return}run.gold-=price;gainRelic(rk);b.remove();renderTop();saveRun()};r2.appendChild(b)}
 const rm=el('button','btn','🗑️ Remove a card — 75g');rm.onclick=()=>{if(run.gold<75){SFX.play('err');return}showPile('Remove which card?',run.deck,(c,i)=>{run.gold-=75;run.deck.splice(i,1);rm.remove();renderTop();saveRun()})};r2.appendChild(rm);
 const lv=el('button','btn','Leave ➜');lv.id='leaveShop';lv.onclick=()=>{saveRun();goMap()};r2.appendChild(lv);o.appendChild(r2);screen.appendChild(o)}
function treasure(){screen.innerHTML='';renderTop();const o=el('div','overlay');o.innerHTML='<div style="font-size:80px">🎁</div><h2>Treasure!</h2>';const k=newRelic();const g=ri(30,60);const b=el('button','btn',`Open chest`);b.onclick=()=>{run.gold+=g;SFX.play('gold');gainRelic(k);b.remove();o.insertAdjacentHTML('beforeend',`<p>${k?RELICS[k].i+' '+RELICS[k].n+' — '+RELICS[k].d:''}<br>+${g} gold</p>`);const c=el('button','btn','Continue ➜');c.onclick=()=>{saveRun();goMap()};o.appendChild(c);renderTop();saveRun()};o.appendChild(b);screen.appendChild(o)}
const EVENTS=[
{t:'The Golden Shrine',i:'⛩️',d:'A shrine glitters with offerings.',o:[['Pray (+100 gold)',()=>{run.gold+=100;SFX.play('gold')}],['Desecrate (+275 gold, lose 8 HP)',()=>{run.gold+=275;run.hp=Math.max(1,run.hp-8)}],['Leave',()=>{}]]},
{t:'Big Fish',i:'🐟',d:'A merchant offers you food.',o:[['Banana (heal 1/3 HP)',()=>{run.hp=Math.min(run.maxHp,run.hp+Math.round(run.maxHp/3));SFX.play('heal')}],['Donut (+5 Max HP)',()=>{run.maxHp+=5;run.hp+=5}],['Box (random relic, add a Wound)',()=>{gainRelic(newRelic());run.deck.push({id:'wound',up:false})}]]},
{t:'Living Wall',i:'🧱',d:'A wall of flesh blocks the way. "Change," it whispers.',o:[['Forget (remove a card)',()=>'remove'],['Grow (upgrade a card)',()=>'upgrade'],['Leave',()=>{}]]},
{t:'Wheel of Fortune',i:'🎡',d:'A tattered wheel spins on its own.',o:[['Spin!',()=>{const x=rnd();if(x<.35){run.gold+=120;toast('+120 Gold');SFX.play('gold')}else if(x<.6){gainRelic(newRelic())}else if(x<.8){run.hp=run.maxHp;toast('Full Heal');SFX.play('heal')}else{run.hp=Math.max(1,run.hp-10);toast('Ouch! -10 HP');SFX.play('hit')}}],['Walk away',()=>{}]]},
{t:'Scrap Ooze',i:'🫧',d:'Something shines inside a pool of ooze.',o:[['Reach in (lose 5 HP, gain a relic)',()=>{run.hp=Math.max(1,run.hp-5);gainRelic(newRelic())}],['Leave',()=>{}]]},
{t:'Wandering Mystic',i:'🧙',d:'"I can teach you something new."',o:[['Learn (choose 1 of 3 rare cards)',()=>'rare'],['Leave',()=>{}]]}];
function eventNode(){screen.innerHTML='';renderTop();const ev=pick(EVENTS);const o=el('div','overlay');o.innerHTML=`<div style="font-size:70px">${ev.i}</div><h2>${ev.t}</h2><div class="sub">${ev.d}</div>`;const p=el('div','panel');
 ev.o.forEach(([t,f])=>{const b=el('button','btn',t);b.style.display='block';b.style.width='100%';b.onclick=()=>{SFX.play('click');const r=f();renderTop();if(r==='remove')showPile('Remove a card',run.deck,(c,i)=>{run.deck.splice(i,1);fin()},true);else if(r==='upgrade')showPile('Upgrade a card',run.deck.filter(c=>!c.up&&CARDS[c.id].r!=='status'),c=>{c.up=true;fin()},true);else if(r==='rare'){const cs=[];while(cs.length<3){const id=pick(POOL.rare);if(!cs.some(c=>c.id===id))cs.push({id,up:false})}showPile('Choose a card',cs,c=>{run.deck.push(c);fin()},true)}else fin()};p.appendChild(b)});o.appendChild(p);screen.appendChild(o);function fin(){saveRun();goMap()}}
function gameOver(){if(run.over)return;run.over=true;clearRun();SFX.play('lose');screen.innerHTML='';const o=el('div','overlay');o.innerHTML=`<div style="font-size:80px">💀</div><h1 class="title" style="font-size:54px">DEFEATED</h1><p>You fell on Act ${run.act}, floor ${run.floor}.</p>`;const b=el('button','btn','Title Screen');b.onclick=titleScreen;o.appendChild(b);screen.appendChild(o);G=null}
function victory(){run.over=true;clearRun();stats.wins++;saveStats();SFX.play('win');screen.innerHTML='';const o=el('div','overlay');o.innerHTML=`<div style="font-size:80px">👑</div><h1 class="title" style="font-size:54px">VICTORY</h1><p>You conquered the Ember Spire with ${run.deck.length} cards and ${run.relics.length} relics!</p>`;const b=el('button','btn','Title Screen');b.onclick=titleScreen;o.appendChild(b);screen.appendChild(o)}
window.addEventListener('resize',()=>{if(G){screen.style.setProperty('--cw',cardW()+'px');renderHand()}else if(run&&$('#mapCv'))goMap()});
document.addEventListener('keydown',e=>{if(!G||G.busy)return;if(e.key==='e'||e.key==='E')endTurn();const n=parseInt(e.key);if(n>=1&&n<=9&&G.hand[n-1]){const c=G.hand[n-1];tryPlay(c,G.enemies.find(x=>x.hp>0))}});
// test hook
window.__es={get run(){return run},get G(){return G},tryPlay,endTurn,enterNode,available,CARDS,startCombat};
titleScreen();
</script></body></html>
