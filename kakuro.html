 const list=P[tier],gy=ty+54,cols=land?8:4,gw=(W-28),bw=gw/cols-6,bh=Math.min(64,(H-gy-10)/Math.ceil(list.length/cols)-6);
 list.forEach((p,i)=>{const x=14+(i%cols)*(bw+6),y=gy+Math.floor(i/cols)*(bh+6);const k=key(tier,i),b=save.solved[k],ip=save.prog[k];
  btn(x,y,bw,bh,String(i+1),()=>{openPuzzle(tier,i);sfx.tap()},{col:b!=null?'#235c45':ip?'#4a4120':'#2b3350',fs:Math.min(20,bh*.4),sub:b!=null?'★ '+fmt(b):ip?'… '+fmt(ip.t||0):p.n-1+'×'+(p.n-1)})});
 ctx.fillStyle='#6f7aa3';ctx.font='11px system-ui';ctx.textAlign='left';ctx.fillText('Fill each white cell 1–9 so every run adds up to its clue, with no repeated digits in a run.',14,H-8)}
// ---------- play ----------
function drawPlay(dt){bg();hits=[];layout();const N=pz.n,cs=L.cs;
 // board shadow
 ctx.fillStyle='rgba(0,0,0,.35)';rr(L.bx-4,L.by-2,cs*N+8,cs*N+8,10);ctx.fill();
 const selC=sel>=0?cells[sel]:null;const hiRuns=selC?new Set([selC.h,selC.v]):new Set();
 const rs=runs.map((_,r)=>runState(r));
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=L.bx+c*cs,y=L.by+r*cs;
  if(!grid[r][c]){const g=ctx.createLinearGradient(x,y,x+cs,y+cs);g.addColorStop(0,'#2a3152');g.addColorStop(1,'#20263f');ctx.fillStyle=g;ctx.fillRect(x,y,cs,cs);ctx.strokeStyle='#151a2d';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,cs-1,cs-1);
   const cl=pz.clue[r+','+c];if(cl){ctx.strokeStyle='#59618a';ctx.beginPath();ctx.moveTo(x+2,y+2);ctx.lineTo(x+cs-2,y+cs-2);ctx.stroke();ctx.font='bold '+Math.floor(cs*.3)+'px system-ui';ctx.textBaseline='middle';
    const right=cellAt[r+','+(c+1)],down=cellAt[(r+1)+','+c];
    if(cl.h!=null){const st=rs[cells[right].h];ctx.fillStyle=st.bad?'#ff6b81':st.ok?'#6be3a4':(hiRuns.has(cells[right].h)?'#ffd166':'#e6eaff');ctx.textAlign='right';ctx.fillText(cl.h,x+cs-3,y+cs*.3)}
    if(cl.v!=null){const st=rs[cells[down].v];ctx.fillStyle=st.bad?'#ff6b81':st.ok?'#6be3a4':(hiRuns.has(cells[down].v)?'#ffd166':'#e6eaff');ctx.textAlign='left';ctx.fillText(cl.v,x+3,y+cs*.72)}}}
  else{const i=cellAt[r+','+c],C=cells[i];let f='#f4f1e8';if(hiRuns.has(C.h)||hiRuns.has(C.v))f='#fbe9b7';if(i===sel)f='#ffd166';if(isDup(i)||wrongMark.has(i))f=i===sel?'#ff9aa8':'#ffc9d0';
   if(won){const ph=(winT*3-(r+c)*.15);if(ph>0&&ph<1)f='hsl('+((r*40+c*25+winT*200)%360)+',80%,75%)'}
   ctx.fillStyle=f;ctx.fillRect(x+1,y+1,cs-2,cs-2);
   if(val[i]){ctx.fillStyle=(isDup(i)||wrongMark.has(i))?'#c0122e':'#1d2a5b';ctx.font='bold '+Math.floor(cs*.58)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(val[i],x+cs/2,y+cs/2+2)}
   else if(notes[i]){ctx.fillStyle='#5a6386';ctx.font=Math.floor(cs*.24)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';for(let d=1;d<=9;d++)if(notes[i]&(1<<d))ctx.fillText(d,x+cs*(.2+((d-1)%3)*.3),y+cs*(.2+Math.floor((d-1)/3)*.3)+1)}
   hits.push({x,y,w:cs,h:cs,fn:()=>{if(!won&&!paused){sel=i;sfx.tap()}}})}}
 if(selC){const b=cellRect(sel);ctx.strokeStyle='#ff9f1c';ctx.lineWidth=3;ctx.strokeRect(b.x+1.5,b.y+1.5,b.w-3,b.h-3)}
 // panel
 const px=L.px,pw=L.pw;let y=L.py;const tb=Math.min(40,L.ph*.11);
 ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=TC[pz.t];ctx.font='bold '+Math.min(18,tb*.5)+'px system-ui';ctx.fillText(pz.t+' #'+(pz.i+1),px,y+tb*.3);
 ctx.fillStyle='#e6eaff';ctx.font='bold '+Math.min(20,tb*.55)+'px ui-monospace,monospace';ctx.fillText('⏱ '+fmt(elapsed),px,y+tb*.85);
 const b=save.solved[pz.key];ctx.fillStyle='#8f9ac4';ctx.font='11px system-ui';ctx.textAlign='right';ctx.fillText((b!=null?'Best '+fmt(b):'Unsolved')+(hints?' · hints '+hints:''),px+pw,y+tb*.85);
 const sbw=Math.min(44,(pw-12)/4);
 [['☰',()=>{saveProg();screen='menu';sfx.tap()}],['↻',restart],[paused?'▶':'II',()=>{if(!won){paused=!paused;sfx.tap()}}],[save.mute?'🔇':'🔊',()=>{save.mute=!save.mute;persist();if(!save.mute)sfx.tap()}]].forEach((a,k)=>btn(px+pw-(4-k)*(sbw+4)+4,y-2,sbw,tb*.62,a[0],a[1],{fs:15}));
 y+=tb+8;const rest=L.ph-(y-L.py);const gap=5;const bh=Math.min((rest-gap*4)/5,58),bw=(pw-gap*2)/3;
 for(let d=1;d<=9;d++){const x=px+((d-1)%3)*(bw+gap),yy=y+Math.floor((d-1)/3)*(bh+gap);btn(x,yy,bw,bh,String(d),()=>{if(sel>=0)setCell(sel,d,notesMode)},{col:notesMode?'#3a3f6b':'#2e3a6e',fs:Math.min(bh*.55,28)})}
 y+=3*(bh+gap);const tw=(pw-gap*4)/5;
 [['✎',()=>{notesMode=!notesMode;sfx.tap()},'Notes',notesMode],['⌫',erase,'Erase'],['↶',undo,'Undo'],['💡',hint,'Hint'],['✓',check,'Check']].forEach((a,k)=>btn(px+k*(tw+gap),y,tw,bh*1.05,a[0],a[1],{on:a[3],fs:Math.min(bh*.4,20),sub:a[2]}));
 y+=bh*1.05+gap;ctx.fillStyle='#6f7aa3';ctx.font='10px system-ui';ctx.textAlign='left';if(L.land&&y+10<H)ctx.fillText('Keys: arrows · 1-9 · ⌫ · N notes · U undo · H hint · C check · P pause · R restart',px,Math.min(H-8,y+8));
 // pause overlay
 if(paused){ctx.fillStyle='rgba(10,12,24,.88)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffd166';ctx.font='bold 36px system-ui';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2-40);btn(W/2-130,H/2,120,46,'Resume',()=>{paused=false;sfx.tap()},{col:'#2f7a55'});btn(W/2+10,H/2,120,46,'Menu',()=>{paused=false;saveProg();screen='menu'})}
 if(won){winT+=dt;const a=Math.min(1,Math.max(0,winT-.6)*2);if(a>0){ctx.globalAlpha=a;ctx.fillStyle='rgba(10,12,24,.8)';const bw2=Math.min(340,W-30),bh2=200,bx=(W-bw2)/2,by=(H-bh2)/2;rr(bx,by,bw2,bh2,16);ctx.fill();ctx.strokeStyle='#ffd166';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#ffd166';ctx.font='bold 30px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Solved! 🎉',W/2,by+36);ctx.fillStyle='#e6eaff';ctx.font='18px system-ui';ctx.fillText('Time '+fmt(elapsed)+(hints?'  ·  '+hints+' hint'+(hints>1?'s':''):''),W/2,by+72);
  ctx.fillStyle=pz.record||pz.first?'#6be3a4':'#9aa5cc';ctx.font='14px system-ui';ctx.fillText(pz.first?'First solve!':pz.record?'New best time!':'Best '+fmt(save.solved[pz.key]),W/2,by+98);
  if(a>=1){btn(bx+16,by+bh2-62,(bw2-48)/2,46,'Menu',()=>{screen='menu';parts=[]});const nx=nextPuzzle();btn(bx+32+(bw2-48)/2,by+bh2-62,(bw2-48)/2,46,nx?'Next ▶':'Replay',()=>{if(nx)openPuzzle(nx[0],nx[1]);else restart()},{col:'#2f7a55'})}ctx.globalAlpha=1}}}
function nextPuzzle(){let t=TIERS.indexOf(pz.t),i=pz.i+1;while(t<4){if(i<P[TIERS[t]].length)return[TIERS[t],i];t++;i=0}return null}
function drawParts(dt){for(const p of parts){p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=.35*dt*60;p.l-=dt*.45;p.rot+=dt*8}parts=parts.filter(p=>p.l>0&&p.y<H+20);
 for(const p of parts){ctx.globalAlpha=Math.min(1,p.l*2);ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()}ctx.globalAlpha=1}
function frame(t){const dt=Math.min(.1,(t-lastT)/1000);lastT=t;
 if(screen==='play'&&!paused&&!won&&!document.hidden){const before=Math.floor(elapsed);elapsed+=dt;if(Math.floor(elapsed)!==before&&Math.floor(elapsed)%5===0)saveProg()}
 if(screen==='menu')drawMenu();else drawPlay(dt);drawParts(dt);
 if(toastT>0){toastT-=dt;ctx.globalAlpha=Math.min(1,toastT*2);ctx.font='bold 15px system-ui';const w=ctx.measureText(toast).width+28;ctx.fillStyle='rgba(20,24,40,.95)';rr(W/2-w/2,H-50,w,34,17);ctx.fill();ctx.fillStyle='#ffd166';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(toast,W/2,H-33);ctx.globalAlpha=1}
 requestAnimationFrame(frame)}
// ---------- input ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();const x=e.clientX,y=e.clientY;for(let k=hits.length-1;k>=0;k--){const h=hits[k];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.fn();return}}},{passive:false});
addEventListener('keydown',e=>{ac();const k=e.key;
 if(screen==='menu'){if(k>='1'&&k<='4'){tier=TIERS[+k-1];sfx.tap()}if(k==='Enter'&&save.last&&save.prog[save.last]){const[t,i]=save.last.split('-');openPuzzle(t,+i)}return}
 if(k==='p'||k==='P'){if(!won){paused=!paused;sfx.tap()}return}
 if(k==='r'||k==='R'){restart();return}
 if(k==='Escape'){saveProg();screen='menu';return}
 if(paused||won)return;
 if(k>='1'&&k<='9'){if(sel>=0)setCell(sel,+k,notesMode!==e.shiftKey);e.preventDefault();return}
 const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[k];if(m){move(m[0],m[1]);e.preventDefault();return}
 if(k==='Backspace'||k==='Delete'||k==='0'){erase();e.preventDefault();return}
 if(k==='n'||k==='N'){notesMode=!notesMode;sfx.tap();return}
 if(k==='u'||k==='U'||(k==='z'&&(e.ctrlKey||e.metaKey))){undo();return}
 if(k==='h'||k==='H'){hint();return}if(k==='c'||k==='C'){check();return}});
addEventListener('resize',resize);addEventListener('visibilitychange',()=>{if(document.hidden)saveProg()});addEventListener('pagehide',saveProg);
resize();requestAnimationFrame(frame);
</script></body></html>
