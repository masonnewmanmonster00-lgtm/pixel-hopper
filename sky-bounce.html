// audio

// save
const SKINS=[{n:'Bouncy',c:'#7ce35a',p:0},{n:'Ocean',c:'#3fb6ff',p:50},{n:'Lava',c:'#ff6a3d',p:120},{n:'Ghost',c:'#e8e8ff',p:200},{n:'Royal',c:'#b46bff',p:350},{n:'Gold',c:'#ffd23f',p:600}];
let best=0,coins=0,owned=[0],skin=0;
try{best=+localStorage.getItem('skyBest')||0;coins=+localStorage.getItem('skyCoins')||0;const raw=JSON.parse(localStorage.getItem('skySkins')||'[0]');if(Array.isArray(raw))owned=raw;skin=+localStorage.getItem('skySkin')||0;}catch(e){owned=[0];}
function saveHub(n){n=Math.floor(n)||0;if(!(n>0))return;try{const prev=+localStorage.getItem('arcade-skybounce-best')||0;if(n>prev)localStorage.setItem('arcade-skybounce-best',String(n));}catch(e){}}

// state (all initialised up front)
let state='menu',paused=false,P={x:200,y:500,vx:0,vy:0,face:1,shield:0,jet:0,prop:0,squash:0,dead:false},plats=[],mons=[],holes=[],items=[],bullets=[],parts=[],camY=0,maxH=0,runCoins=0,topGen=600,shake=0,t=0,keys={},touchDir=0,newBest=false,deathT=0;

function mix(a,b,f){const p=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));const A=p(a),B=p(b);return'rgb('+A.map((v,i)=>v+(B[i]-v)*f|0).join(',')+')';}
function reset(){P={x:200,y:520,vx:0,vy:-14,face:1,shield:0,jet:0,prop:0,squash:0,dead:false};plats=[];mons=[];holes=[];items=[];bullets=[];parts=[];camY=0;maxH=0;runCoins=0;topGen=580;newBest=false;deathT=0;
 plats.push({x:150,y:570,w:100,type:'n',vx:0,broken:false,vis:1,sp:null});
 while(topGen>-VH)gen();}
function gen(){const h=-topGen,diff=Math.min(1,h/15000);const gap=55+diff*65+Math.random()*25;topGen-=gap;const y=topGen;
 let r=Math.random(),type='n';if(h>500){if(r<.18+diff*.15)type='m';else if(r<.3+diff*.2)type='b';else if(r<.38+diff*.2&&h>2000)type='v';}
 const w=70;const p={x:Math.random()*(WW-w),y,w,type,vx:type=='m'?(1+diff*2)*(Math.random()<.5?-1:1):0,broken:false,vis:1,sp:null,by:0};
 if(type!='b'&&type!='v'){let q=Math.random();if(q<.07)p.sp={k:'spring',o:Math.random()*(w-16)};else if(q<.1)p.sp={k:'tramp',o:Math.random()*(w-30)};
  else if(q<.13&&h>800)items.push({k:['jet','prop','shield'][Math.random()*3|0],x:p.x+w/2,y:y-20,got:false});
  else if(q<.35)items.push({k:'coin',x:p.x+w/2,y:y-22,got:false});}

 if(type=='b'&&Math.random()<.5){} // breaking platform is a decoy; ensure a solid one nearby
 if(type=='b'){const y2=y-gap*.5;plats.push({x:Math.random()*(WW-w),y:y2,w,type:'n',vx:0,broken:false,vis:1,sp:null});}

function die(why){if(P.dead)return;P.dead=true;state='dead';deathT=0;const h=Math.floor(maxH/10);coins+=runCoins;if(h>best){best=h;newBest=true;}save();snd(400,.6,'sawtooth',.2,60);shake=12;}
function shoot(){if(state!='play'||paused)return;bullets.push({x:P.x,y:P.y-30,vy:-16});snd(900,.08,'square',.08,1400);}
function boom(x,y,c,n=14){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,l:30,c});}
function update(){t++;if(state!='play'||paused){parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l--});parts=parts.filter(p=>p.l>0);if(state=='dead'){deathT++;P.vy+=.5;P.y+=P.vy;}return;}
 let dir=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0)+touchDir;dir=Math.max(-1,Math.min(1,dir));

   else snd(420,.1,'sine',.15,800);

  if(Math.abs(mx-P.x)<30&&Math.abs(m.y-(P.y-18))<30){

   else if(P.vy>0&&P.y<m.y){m.dead=true;P.vy=-16;boom(mx,m.y,'#f4f',16);snd(700,.2,'square',.15,200);}

// drawing

function drawPlayer(x,y){const c=SKINS[skin].c;cx.save();cx.translate(x,y);const sq=P.squash*.25;cx.scale(1+sq,1-sq);cx.scale(P.face,1);

 cx.fillStyle=c;rr(-16,-36,32,34,12);cx.fill();cx.fillStyle='rgba(0,0,0,.15)';cx.fillRect(-16,-12,32,6);
 cx.fillStyle='#fff';cx.beginPath();cx.arc(5,-26,6,0,7);cx.fill();cx.fillStyle='#111';cx.beginPath();cx.arc(7,-26,3,0,7);cx.fill();
 cx.fillStyle=c;cx.fillRect(14,-22,10,8);cx.fillStyle='#333';cx.fillRect(-12,-4,8,4);cx.fillRect(4,-4,8,4);
 if(P.prop>0){cx.fillStyle='#f33';cx.fillRect(-2,-44,4,8);cx.fillStyle='#ff0';const a=Math.sin(t*.8)*18;cx.fillRect(-a,-46,a*2,3);}

 if(P.shield>0&&(P.shield>90||t%10<5)){cx.strokeStyle='rgba(120,220,255,.8)';cx.lineWidth=3;cx.beginPath();cx.arc(x,y-18,30,0,7);cx.stroke();}}
function draw(){cx.setTransform(DPR,0,0,DPR,0,0);const h=Math.max(0,maxH/10),bi=biome(h),B=BIOMES[bi],N=BIOMES[Math.min(bi+1,3)];

 const ox=OX,cw=WW*S;

 // parallax: stars / clouds / hills
 if(bi>=2){cx.fillStyle='#fff';for(let i=0;i<60;i++){const sx=(i*137)%WW,sy=((i*251-camY*.1)%VH+VH)%VH;cx.globalAlpha=.4+.6*Math.abs(Math.sin(t*.02+i));cx.fillRect(sx,sy,2,2);}cx.globalAlpha=1;}
 cx.fillStyle=bi>=2?'rgba(255,255,255,.06)':'rgba(255,255,255,.55)';
 for(let i=0;i<8;i++){const sx=((i*173+t*.15*(i%2?1:-1))%(WW+120)+WW+120)%(WW+120)-60,sy=((i*211-camY*.3)%(VH+100)+VH+100)%(VH+100)-50;cx.beginPath();cx.arc(sx,sy,22,0,7);cx.arc(sx+24,sy+4,18,0,7);cx.arc(sx-22,sy+6,15,0,7);cx.fill();}
 const hy=600-camY*.2+(-520*.0);if(hy<VH+200){cx.fillStyle='#5fb04a';cx.beginPath();cx.moveTo(0,VH);for(let x=0;x<=WW;x+=20)cx.lineTo(x,hy-30*Math.sin(x/60)-20+(VH-600));cx.lineTo(WW,VH);cx.fill();}
 cx.translate(0,-camY);
 // grid paper lines
 for(const ho of holes){const gr=cx.createRadialGradient(ho.x,ho.y,4,ho.x,ho.y,50);gr.addColorStop(0,'#000');gr.addColorStop(.5,'#200a3a');gr.addColorStop(1,'rgba(80,0,120,0)');cx.fillStyle=gr;cx.beginPath();cx.arc(ho.x,ho.y,50,0,7);cx.fill();cx.strokeStyle='rgba(200,120,255,.6)';cx.lineWidth=2;cx.beginPath();cx.arc(ho.x,ho.y,22+Math.sin(t*.1)*3,t*.05,t*.05+4);cx.stroke();}
 for(const p of plats){const col={n:'#4cc94c',m:'#4aa8ff',b:'#a0602a',v:'#ffffff'}[p.type];cx.globalAlpha=p.type=='v'?Math.max(0,p.vis)*.9:1;
  if(p.broken){cx.fillStyle=col;cx.save();cx.translate(p.x+p.w/4,p.y+p.by);cx.rotate(-.4);cx.fillRect(-p.w/4,0,p.w/2-2,12);cx.restore();cx.save();cx.translate(p.x+p.w*.75,p.y+p.by);cx.rotate(.4);cx.fillRect(-p.w/4,0,p.w/2-2,12);cx.restore();}
  else{cx.fillStyle='rgba(0,0,0,.2)';rr(p.x+2,p.y+3,p.w,13,6);cx.fill();cx.fillStyle=col;rr(p.x,p.y,p.w,13,6);cx.fill();cx.fillStyle='rgba(255,255,255,.35)';cx.fillRect(p.x+5,p.y+2,p.w-10,3);
   if(p.type=='b'){cx.strokeStyle='#5a3010';cx.beginPath();cx.moveTo(p.x+p.w/2,p.y);cx.lineTo(p.x+p.w/2-4,p.y+13);cx.stroke();}}
  cx.globalAlpha=1;
  if(p.sp&&!p.broken){const s=p.sp,hit=s.hit>0;if(hit)s.hit--;if(s.k=='spring'){cx.strokeStyle='#ccc';cx.lineWidth=3;cx.beginPath();const sh=hit?18:9;for(let i=0;i<=4;i++)cx.lineTo(p.x+s.o+(i%2?14:2),p.y-i*sh/4);cx.stroke();cx.fillStyle='#999';cx.fillRect(p.x+s.o,p.y-sh-3,16,3);}

 for(const it of items){const by=it.y+Math.sin(t*.1+it.x)*3;if(it.k=='coin'){cx.fillStyle='#ffd23f';cx.beginPath();cx.ellipse(it.x,by,8*Math.abs(Math.cos(t*.06+it.x)),8,0,0,7);cx.fill();cx.strokeStyle='#c99a00';cx.lineWidth=2;cx.stroke();}

 for(const m of mons){const mx=m.x+m.bx;cx.save();cx.translate(mx,m.y);if(m.dead)cx.rotate(t*.3);

 cx.fillStyle='#ff4';for(const b of bullets){cx.beginPath();cx.arc(b.x,b.y,5,0,7);cx.fill();}

 }else{cx.font='bold 16px sans-serif';cx.textAlign='left';const hudX=(ox<90&&oy<48)?100:ox+8;cx.fillText(Math.floor(maxH/10)+'m  ● '+(coins+runCoins),hudX,Math.max(oy+18,56));}

 const u=VH*S/600;
 if(state=='menu'){cx.font='bold '+(48*u|0)+'px sans-serif';cx.fillStyle='#ffd23f';cx.fillText('SKY BOUNCE',mx,oy+120*u);cx.save();cx.translate(mx,oy+250*u+Math.abs(Math.sin(t*.08))*-30*u);cx.scale(u*1.5,u*1.5);P.face=1;drawPlayer(0,0);cx.restore();
  btn('PLAY',oy+340*u);btn('SHOP',oy+430*u);cx.font=(18*u|0)+'px sans-serif';cx.fillStyle='#fff';cx.fillText('Best: '+best+'m   Coins: '+coins,mx,oy+520*u);}
 if(state=='shop'){cx.font='bold '+(36*u|0)+'px sans-serif';cx.fillStyle='#ffd23f';cx.fillText('SKIN SHOP  ● '+coins,mx,oy+50*u);
  SKINS.forEach((s,i)=>{const r=shopRect(i);cx.fillStyle=i==skin?'rgba(255,255,255,.4)':'rgba(255,255,255,.15)';rr(r.x,r.y,r.w,r.h,10);cx.fill();cx.fillStyle=s.c;rr(r.x+r.w/2-14*u,r.y+16*u,28*u,30*u,8);cx.fill();cx.fillStyle='#fff';cx.font=(15*u|0)+'px sans-serif';cx.fillText(s.n,r.x+r.w/2,r.y+r.h-38*u);cx.fillText(owned.includes(i)?(i==skin?'EQUIPPED':'Owned'):'● '+s.p,r.x+r.w/2,r.y+r.h-16*u);});
  btn('BACK',oy+540*u);}
 if(state=='dead'&&deathT>20){cx.font='bold '+(40*u|0)+'px sans-serif';cx.fillStyle='#ff6060';cx.fillText('GAME OVER',mx,oy+150*u);cx.fillStyle='#fff';cx.font=(24*u|0)+'px sans-serif';cx.fillText(Math.floor(maxH/10)+'m   +'+runCoins+' coins',mx,oy+210*u);
  if(newBest){cx.fillStyle='#ffd23f';cx.fillText('NEW BEST!',mx,oy+250*u);}btn('AGAIN',oy+340*u);btn('MENU',oy+430*u);}
 if(paused&&state=='play'){cx.font='bold '+(44*u|0)+'px sans-serif';cx.fillText('PAUSED',mx,oy+260*u);cx.font=(18*u|0)+'px sans-serif';cx.fillText('P or tap to resume',mx,oy+310*u);}}
let tdev=false;
function btn(txt,y){const u=VH*S/600,w=200*u,h=60*u;cx.fillStyle='#ffd23f';rr(W/2-w/2,y-h/2,w,h,14);cx.fill();cx.fillStyle='#402000';cx.font='bold '+(26*u|0)+'px sans-serif';cx.textAlign='center';cx.fillText(txt,W/2,y+2);}
function hitBtn(x,y,by){const u=VH*S/600;return Math.abs(x-W/2)<100*u&&Math.abs(y-by)<30*u;}
function shopRect(i){const u=VH*S/600,oy=(H-VH*S)/2,w=110*u,h=130*u,c=i%3,r=i/3|0;return{x:W/2-w*1.5-10*u+c*(w+10*u),y:oy+90*u+r*(h+15*u),w,h};}
function click(x,y){const u=VH*S/600,oy=(H-VH*S)/2;
 if(state=='menu'){if(hitBtn(x,y,oy+340*u))start();else if(hitBtn(x,y,oy+430*u)){state='shop';snd(500,.1);}return true;}
 if(state=='shop'){for(let i=0;i<SKINS.length;i++){const r=shopRect(i);if(x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h){if(owned.includes(i)){skin=i;snd(700,.1);}else if(coins>=SKINS[i].p){coins-=SKINS[i].p;owned.push(i);skin=i;snd(1000,.3,'triangle',.2,1600);}else snd(120,.2);save();}}
  if(hitBtn(x,y,oy+540*u))state='menu';return true;}
 if(state=='dead'){if(deathT>20){if(hitBtn(x,y,oy+340*u))start();else if(hitBtn(x,y,oy+430*u))state='menu';}return true;}
 if(paused){paused=false;return true;}return false;}
// input
addEventListener('keydown',e=>{keys[e.key.length==1?e.key.toLowerCase():e.key]=true;const k=e.key.toLowerCase();
 if(k==' '||e.key=='ArrowUp'){e.preventDefault();if(state=='play')shoot();else if(!e.repeat&&state!='shop'&&(state!='dead'||deathT>20))start();}
 if(!e.repeat){if(k=='p'&&state=='play')paused=!paused;if(k=='r')start();if(e.key=='Enter'&&state!='play')start();}});
addEventListener('keyup',e=>{keys[e.key.length==1?e.key.toLowerCase():e.key]=false;});
const tz={};function zone(x){return x<OX?-1:x>W-OX?1:0;}
function recompute(){let d=0;for(const k in tz)d+=tz[k];touchDir=Math.max(-1,Math.min(1,d));}
cv.addEventListener('touchstart',e=>{e.preventDefault();tdev=true;for(const tc of e.changedTouches){const x=tc.clientX,y=tc.clientY;if(click(x,y))continue;if(state!='play')continue;
 let z=zone(x);if(OX<60)z=x<W/3?-1:x>W*2/3?1:0;if(z)tz[tc.identifier]=z;else shoot();}recompute();},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();for(const tc of e.changedTouches)delete tz[tc.identifier];recompute();},{passive:false});
cv.addEventListener('touchcancel',e=>{for(const tc of e.changedTouches)delete tz[tc.identifier];recompute();});
cv.addEventListener('mousedown',e=>{if(tdev)return;if(!click(e.clientX,e.clientY)&&state=='play')shoot();});
function loop(){update();draw();requestAnimationFrame(loop);}reset();state='menu';loop();
window.__sky={start,die,get state(){return state},get paused(){return paused},get best(){return best},setH(n){maxH=n}};
</script></body></html>
