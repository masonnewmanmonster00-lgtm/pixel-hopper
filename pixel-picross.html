// ---- solver ----
function clues(line){const r=[];let c=0;for(const v of line){if(v)c++;else if(c){r.push(c);c=0}}if(c)r.push(c);return r}
function solveLine(cl,cur){const n=cur.length,c0=Array(n).fill(false),c1=Array(n).fill(false),m=new Map();
 function ok(i,k){const key=i*100+k;if(m.has(key))return m.get(key);let res=false;
  if(k===cl.length){res=true;for(let j=i;j<n;j++)if(cur[j]===1){res=false;break}if(res)for(let j=i;j<n;j++)c0[j]=true;m.set(key,res);return res}
  if(i>=n){m.set(key,false);return false}
  if(cur[i]!==1&&ok(i+1,k)){c0[i]=true;res=true}
  const L=cl[k];if(i+L<=n){let f=true;for(let j=i;j<i+L;j++)if(cur[j]===0){f=false;break}
   if(f&&(i+L===n||cur[i+L]!==1)){if(ok(i+L+(i+L<n?1:0),k+1)){res=true;for(let j=i;j<i+L;j++)c1[j]=true;if(i+L<n)c0[i+L]=true}}}
  m.set(key,res);return res}
 if(!ok(0,0))return null;return cur.map((v,j)=>c1[j]&&!c0[j]?1:c0[j]&&!c1[j]?0:v)}
function lineSolve(R,C){const h=R.length,w=C.length,g=Array.from({length:h},()=>Array(w).fill(-1));let ch=true;
 while(ch){ch=false;for(let y=0;y<h;y++){const r=solveLine(R[y],g[y]);if(!r)return null;r.forEach((v,x)=>{if(v!==g[y][x]){g[y][x]=v;ch=true}})}
 for(let x=0;x<w;x++){const r=solveLine(C[x],g.map(q=>q[x]));if(!r)return null;r.forEach((v,y)=>{if(v!==g[y][x]){g[y][x]=v;ch=true}})}}return g}
const LV=PUZ.map(([name,color,rows],i)=>{const sol=rows.map(r=>[...r].map(c=>c==='#'?1:0));const n=sol.length;
 return {i,name,color,n,sol,R:sol.map(clues),C:sol[0].map((_,x)=>clues(sol.map(r=>r[x])))}});
function verifyAll(){return LV.map(L=>{const s=lineSolve(L.R,L.C);return !!s&&s.every((r,y)=>r.every((v,x)=>v===L.sol[y][x]))})}

function tone(f,d=.06,type='square',v=.06,sl=0){try{const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;if(sl)o.frequency.exponentialRampToValueAtTime(f*sl,a.currentTime+d);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}

function start(i){const L=LV[i];S.L=L;S.g=Array.from({length:L.n},()=>Array(L.n).fill(0));S.undo=[];S.t=0;S.paused=false;S.done=false;S.mist=0;S.cur={x:0,y:0};S.scene='play';S.solveT=0;sfx.click()}
function setCell(x,y,v,group){const g=S.g;if(g[y][x]===v)return false;
 if(v===1&&save.mistakeMode&&!S.L.sol[y][x]){S.mist++;sfx.err();S.undo.push({group,x,y,p:g[y][x]});g[y][x]=2;S.flash={x,y,t:.4};return true}
 S.undo.push({group,x,y,p:g[y][x]});g[y][x]=v;return true}
function lineDone(arr,cl){const c=clues(arr.map(v=>v===1?1:0));return c.length===cl.length&&c.every((v,i)=>v===cl[i])||(cl.length===0&&c.length===0)}
function checkWin(){const L=S.L;for(let y=0;y<L.n;y++)if(!lineDone(S.g[y],L.R[y]))return;for(let x=0;x<L.n;x++)if(!lineDone(S.g.map(r=>r[x]),L.C[x]))return;
 S.done=true;S.solveT=0;sfx.win();const id=L.i;save.solved[id]=1;const t=Math.floor(S.t*10)/10;if(!save.best[id]||t<save.best[id])save.best[id]=t;persist()}

// ---- layout ----
function computeLayout(){const L=S.L,n=L.n;const maxR=Math.max(1,...L.R.map(r=>r.length)),maxC=Math.max(1,...L.C.map(r=>r.length));
 const panel=Math.min(170,Math.max(120,W*.24));const availW=W-panel-16,availH=H-12;
 let cell=Math.floor(Math.min(availW/(n+maxR*.62),availH/(n+maxC*.62)));cell=Math.max(10,cell);
 const cw=cell*.62,gw=cell*n,lw=maxR*cw,th=maxC*cw;let ox=Math.round(8+(availW-gw-lw)/2+lw),oy=Math.round(6+(availH-gw-th)/2+th);

function cellAt(px,py){const l=layout;if(!l)return null;const x=Math.floor((px-l.ox)/l.cell),y=Math.floor((py-l.oy)/l.cell);if(x<0||y<0||x>=l.n||y>=l.n)return null;return{x,y}}
// ---- drawing ----
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function button(x,y,w,h,label,fn,on,col){btns.push({x,y,w,h,fn});rr(x,y,w,h,8);ctx.fillStyle=on?(col||'#5b7cfa'):'#2d3150';ctx.fill();ctx.strokeStyle='#4a5080';ctx.lineWidth=1;ctx.stroke();

function thumb(L,x,y,s,solved){const c=s/L.n;ctx.fillStyle='#0e1020';ctx.fillRect(x,y,s,s);if(!solved){ctx.fillStyle='#4a5080';ctx.font=`bold ${s*.45}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',x+s/2,y+s/2);return}

function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=(n>>16)+a,g=((n>>8)&255)+a,b=(n&255)+a;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return`rgb(${r},${g},${b})`}

 let packY=58;if(W>=760)button(W-168,10,154,34,'Mistakes: '+(save.mistakeMode?'ON':'OFF'),()=>{save.mistakeMode=!save.mistakeMode;persist();sfx.click()},save.mistakeMode,'#c0392b');
 else{button(116,56,168,34,'Mistakes: '+(save.mistakeMode?'ON':'OFF'),()=>{save.mistakeMode=!save.mistakeMode;persist();sfx.click()},save.mistakeMode,'#c0392b');packY=98}
 PACKS.forEach((p,k)=>{const cnt=LV.filter(L=>L.n===p).length,sv=LV.filter(L=>L.n===p&&save.solved[L.i]).length;button(16+k*112,packY,104,34,`${p}×${p}  ${sv}/${cnt}`,()=>{S.pack=k;sfx.click()},S.pack===k)});

function drawPlay(dt){const l=computeLayout(),L=S.L,n=L.n,c=l.cell,g=S.g;

 else if(S.done){S.solveT+=dt;const p=S.solveT;for(let y=0;y<n;y++)for(let x=0;x<n;x++){const d=(x+y)/(2*n);const a=Math.max(0,Math.min(1,(p*1.6-d)*3));

function frame(now){const dt=Math.min(.1,(now-lastTime)/1000);lastTime=now;if(S.scene==='play'&&!S.paused&&!S.done)S.t+=dt;

function lineCells(a,b){const cells=[];if(Math.abs(b.x-a.x)>=Math.abs(b.y-a.y)){const s=Math.sign(b.x-a.x)||1;for(let x=a.x;x!==b.x+s;x+=s)cells.push([x,a.y])}else{const s=Math.sign(b.y-a.y);for(let y=a.y;y!==b.y+s;y+=s)cells.push([a.x,y])}return cells}

function move(px,py){const p=cellAt(px,py);if(S.scene==='play')S.hover=p;if(!drag||!p||S.done)return;if(p.x===drag.last.x&&p.y===drag.last.y)return;

 const g0=gid;let ch=false;for(const[x,y]of cells)ch=setCell(x,y,drag.v,g0)||ch;if(ch){drag.v===1?sfx.fill():drag.v===2?sfx.x():sfx.clear();checkWin()}

 else if(k==='z'||k==='x'){const w=k==='z'?1:2;applyStroke([[c.x,c.y]],S.g[c.y][c.x]===w?0:w)}else if(k==='u')doUndo();else return;e.preventDefault()});
