<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#020b1a;color:#dff6ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
#sea{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
a.back{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:80;display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(8,8,16,.82);color:#ffe14d;border:1px solid rgba(255,225,77,.55);font:700 12px/1 ui-monospace,monospace;letter-spacing:.04em;text-decoration:none;touch-action:manipulation}a.back:focus-visible{outline:2px solid #ffe14d;outline-offset:2px}
#muteBtn{position:fixed;top:10px;right:10px;z-index:60;background:rgba(0,20,40,.7);border:1px solid #2a6c8a;color:#7fe9ff;border-radius:20px;padding:6px 12px;font-size:16px;cursor:pointer}
.screen{position:relative;z-index:5;min-height:100%;display:none;flex-direction:column;align-items:center;padding:56px 10px 20px}
.screen.on{display:flex}
h1{font-size:clamp(36px,9vw,72px);margin:20px 0 4px;letter-spacing:4px;background:linear-gradient(180deg,#bff6ff,#28b6ff 60%,#0a5aa8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(40,180,255,.35);text-align:center}
.sub{color:#8cc6dd;margin-bottom:24px;text-align:center}
.btn{background:linear-gradient(180deg,#1aa3e0,#0b5f99);color:#fff;border:none;border-radius:12px;padding:12px 22px;font-size:17px;font-weight:700;cursor:pointer;margin:6px;box-shadow:0 4px 0 #063a5e,0 0 18px rgba(30,160,255,.3);min-width:150px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #063a5e}
.btn.alt{background:linear-gradient(180deg,#355,#233);box-shadow:0 4px 0 #122}
.btn.sel{outline:3px solid #ffd34d}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.panel{background:rgba(3,25,48,.78);border:1px solid #1d5b7c;border-radius:16px;padding:14px;backdrop-filter:blur(4px);box-shadow:0 10px 40px rgba(0,0,0,.4)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);width:var(--gs);height:var(--gs);position:relative;border:2px solid #2a8fbf;border-radius:6px;background:rgba(10,60,100,.35);touch-action:none}
.cell{border:1px solid rgba(80,180,230,.18);position:relative}
.grid.target .cell{cursor:crosshair}
.grid.target .cell:hover{background:rgba(255,220,80,.18)}
.cell.miss::after{content:"";position:absolute;left:35%;top:35%;width:30%;height:30%;border-radius:50%;background:#bfe9ff;opacity:.8;box-shadow:0 0 6px #8fdcff}
.cell.hit::after{content:"";position:absolute;left:18%;top:18%;width:64%;height:64%;border-radius:50%;background:radial-gradient(#ffe08a,#ff5a1f 55%,#a01000);box-shadow:0 0 10px #ff6a00;animation:pulse 1s infinite alternate}
.cell.sunk{background:rgba(160,20,10,.45)}
@keyframes pulse{from{transform:scale(.85)}to{transform:scale(1.05)}}
.ship{position:absolute;border-radius:40px;background:linear-gradient(180deg,#9fb4c4,#566d80 50%,#3a4b59);border:2px solid #cfe3f0;box-shadow:inset 0 0 8px rgba(0,0,0,.5);z-index:2;pointer-events:none}
.ship.v{background:linear-gradient(90deg,#9fb4c4,#566d80 50%,#3a4b59)}
.ship.dead{background:linear-gradient(180deg,#5a2a22,#2a1210);border-color:#ff6a3a}
.ship.place{pointer-events:auto;cursor:grab}
.ship.bad{border-color:#ff4040;background:rgba(255,60,60,.5)}
.ship.selected{border-color:#ffd34d;box-shadow:0 0 14px #ffd34d}
#dock{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0;min-height:30px;max-width:520px}
.dockShip{height:26px;border-radius:20px;background:linear-gradient(180deg,#9fb4c4,#566d80);border:2px solid #cfe3f0;cursor:grab;touch-action:none;font-size:11px;color:#012;display:flex;align-items:center;justify-content:center;font-weight:700}
.dockShip.selected{border-color:#ffd34d;box-shadow:0 0 12px #ffd34d}
#boards{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-start}
.bwrap h3{margin:4px 0 6px;text-align:center;font-size:15px;color:#9fe3ff;letter-spacing:2px}
#status{font-size:18px;font-weight:700;margin:6px 0 10px;min-height:26px;text-align:center;color:#ffe48a}
.tracker{display:flex;flex-direction:column;gap:3px;margin-top:8px;font-size:12px}
.tr{display:flex;align-items:center;gap:6px}
.pips{display:flex;gap:2px}.pip{width:10px;height:10px;border-radius:3px;background:#5fa8c8}
.tr.sunkT{color:#ff7a5a;text-decoration:line-through}.tr.sunkT .pip{background:#a12}
table{border-collapse:collapse;margin:8px auto}td,th{padding:6px 12px;border-bottom:1px solid #1d5b7c;text-align:center}
#overlay{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,8,20,.7)}
#overlay.on{display:flex}
#overlay .panel{text-align:center;max-width:90vw;animation:pop .4s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.big{font-size:44px;font-weight:900;margin:6px}
.help{font-size:13px;color:#8cc6dd;text-align:center;max-width:520px;margin:4px}
@media (max-height:460px){.tracker{display:none}#place .help{display:none}.bwrap h3{margin:0 0 4px;font-size:12px}.panel{padding:8px}#status2{margin:0 0 4px;min-height:20px;font-size:15px}.screen{padding-top:48px;padding-bottom:8px}.btn{padding:8px 16px;font-size:15px}}
</style></head><body>
<canvas id="sea"></canvas><canvas id="fx"></canvas>
<a class="back" href="./index.html" aria-label="Back to menu" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">← Menu</a>
<button id="muteBtn" title="Mute">🔊</button>

<div class="screen on" id="title">
 <h1>NEON FLEET</h1><div class="sub">Battleship · Command the seas</div>
 <div class="panel" style="text-align:center">
  <div style="margin-bottom:6px;color:#9fe3ff">Enemy Admiral</div>
  <div class="row" id="diffRow">
   <button class="btn alt" data-d="easy">Easy</button>
   <button class="btn alt" data-d="normal">Normal</button>
   <button class="btn alt" data-d="hard">Hard</button>
  </div>

  <div class="row" style="margin-top:12px"><button class="btn" id="playBtn">⚓ Deploy Fleet</button><button class="btn alt" id="statsBtn">📊 Stats</button></div>
 </div>
</div>

<div class="screen" id="place">
 <div id="status">Place your fleet</div>
 <div class="help">Drag ships onto the grid (or tap a ship, then tap a cell). Tap a placed ship or press R / ⟳ to rotate.</div>
 <div id="dock"></div>
 <div class="bwrap"><div class="grid" id="pgrid"></div></div>
 <div class="row" style="margin-top:10px">
  <button class="btn alt" id="rotBtn">⟳ Rotate</button>
  <button class="btn alt" id="randBtn">🎲 Random</button>

 </div>
</div>

<div class="screen" id="battle">
 <div id="status2" class="" style="font-size:18px;font-weight:700;min-height:26px;color:#ffe48a;margin:4px 0 10px;text-align:center"></div>
 <div id="boards">
  <div class="bwrap panel"><h3>ENEMY WATERS</h3><div class="grid target" id="egrid"></div><div class="tracker" id="etrack"></div></div>
  <div class="bwrap panel"><h3>YOUR FLEET</h3><div class="grid" id="mgrid"></div><div class="tracker" id="mtrack"></div></div>
 </div>

</div>

</div>

<div id="overlay"><div class="panel"><div class="big" id="ovTitle"></div><div id="ovText"></div>
 <div class="row" style="margin-top:12px"><button class="btn" id="againBtn">Play Again</button><button class="btn alt" id="toTitle">Title</button></div></div></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const N=10;
const FLEET=[{n:'Carrier',l:5},{n:'Battleship',l:4},{n:'Cruiser',l:3},{n:'Submarine',l:3},{n:'Destroyer',l:2}];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let diff=store.get('nf_diff','normal');
let muted=store.get('nf_muted',false);

/* ---------- audio ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function noise(dur,f0,f1,vol,type){const a=ac();if(!a||muted)return;const len=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(f0,a.currentTime);f.frequency.exponentialRampToValueAtTime(f1,a.currentTime+dur);const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
function tone(fr,dur,type,vol,slide,delay){const a=ac();if(!a||muted)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(fr,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur)}
const SFX={
 click(){tone(660,.06,'square',.08)},
 place(){tone(300,.08,'triangle',.2,180)},
 rotate(){tone(500,.07,'triangle',.15,700)},
 fire(){tone(900,.25,'sawtooth',.06,120)},
 splash(){noise(.5,3000,300,.35,'bandpass')},
 boom(){noise(.9,1200,60,.7);tone(90,.5,'sine',.5,30)},
 sunk(){noise(1.3,800,40,.8);[392,330,262,196].forEach((f,i)=>tone(f,.25,'square',.09,0,.15+i*.14))},
 win(){[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.2,0,i*.15))},
 lose(){[392,349,311,262].forEach((f,i)=>tone(f,.4,'sawtooth',.08,0,i*.22))}
};
function setMute(){$('muteBtn').textContent=muted?'🔇':'🔊'}
$('muteBtn').onclick=()=>{muted=!muted;store.set('nf_muted',muted);setMute();if(!muted)SFX.click()};setMute();

/* ---------- ocean bg ---------- */
const sea=$('sea'),sx=sea.getContext('2d'),fx=$('fx'),fxx=fx.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;[sea,fx].forEach(c=>{c.width=W*DPR;c.height=H*DPR});sx.setTransform(DPR,0,0,DPR,0,0);fxx.setTransform(DPR,0,0,DPR,0,0);layout()}
let parts=[];
function drawSea(t){
 const g=sx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#03213d');g.addColorStop(1,'#010812');sx.fillStyle=g;sx.fillRect(0,0,W,H);
 for(let k=0;k<7;k++){sx.beginPath();const y0=H*(k+1)/8;sx.moveTo(0,y0);for(let x=0;x<=W;x+=16){sx.lineTo(x,y0+Math.sin(x*.012+t*.0009*(1+k*.15)+k)*10+Math.sin(x*.031-t*.0013)*4)}sx.strokeStyle=`rgba(60,170,230,${.05+k*.012})`;sx.lineWidth=2;sx.stroke()}
 for(let i=0;i<40;i++){const x=(i*137.5+t*.01*(i%3+1))%W,y=(i*91.3)%H+Math.sin(t*.002+i)*6;sx.fillStyle=`rgba(150,230,255,${.08+.06*Math.sin(t*.003+i)})`;sx.fillRect(x,y,2,2)}
}
function drawFx(){fxx.clearRect(0,0,W,H);parts=parts.filter(p=>p.life>0);for(const p of parts){p.life-=1;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.98;const a=Math.max(0,p.life/p.max);if(p.ring){fxx.beginPath();fxx.arc(p.x,p.y,p.r*(1-a)*1+4,0,7);fxx.strokeStyle=`rgba(${p.c},${a})`;fxx.lineWidth=3*a;fxx.stroke()}else{fxx.beginPath();fxx.arc(p.x,p.y,p.r*(.4+a*.6),0,7);fxx.fillStyle=`rgba(${p.c},${a})`;fxx.fill()}}}
function cellCenter(grid,i){const r=grid.children[i].getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2,r.width]}
function splashAt(grid,i){const [x,y,w]=cellCenter(grid,i);for(let k=0;k<26;k++){const a=-Math.PI/2+(Math.random()-.5)*1.6,s=2+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.25,r:2+Math.random()*3,life:40,max:40,c:'170,230,255'})}parts.push({x,y,vx:0,vy:0,g:0,r:w*1.2,life:30,max:30,ring:1,c:'200,240,255'})}
function boomAt(grid,i,big){const [x,y,w]=cellCenter(grid,i);const n=big?80:40;for(let k=0;k<n;k++){const a=Math.random()*7,s=Math.random()*(big?8:5);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,g:.06,r:3+Math.random()*5,life:30+Math.random()*30,max:60,c:Math.random()<.5?'255,200,60':'255,90,20'})}for(let k=0;k<12;k++)parts.push({x,y,vx:(Math.random()-.5)*1.5,vy:-Math.random()*1.5,g:-.01,r:6+Math.random()*6,life:70,max:70,c:'80,80,90'});parts.push({x,y,vx:0,vy:0,g:0,r:w*(big?3:1.8),life:25,max:25,ring:1,c:'255,180,80'});if(big)shake()}
function shake(){document.body.animate([{transform:'translate(0,0)'},{transform:'translate(-6px,4px)'},{transform:'translate(5px,-4px)'},{transform:'translate(-3px,2px)'},{transform:'translate(0,0)'}],{duration:350})}
function loop(t){drawSea(t);drawFx();requestAnimationFrame(loop)}

/* ---------- board model ---------- */
function newBoard(){return{ships:[],shots:new Array(N*N).fill(0),owner:new Array(N*N).fill(-1)}}// shots:0 none,1 miss,2 hit
function cellsOf(s){const c=[];for(let k=0;k<s.l;k++)c.push((s.r+(s.v?k:0))*N+(s.c+(s.v?0:k)));return c}
function fits(b,s,ignore){if(s.r<0||s.c<0)return false;if(s.v?s.r+s.l>N:s.c+s.l>N)return false;for(const i of cellsOf(s)){const o=b.owner[i];if(o!==-1&&o!==ignore)return false}return true}
function addShip(b,s){s.hits=0;b.ships.push(s);const id=b.ships.length-1;for(const i of cellsOf(s))b.owner[i]=id}
function rebuildOwner(b){b.owner.fill(-1);b.ships.forEach((s,id)=>{for(const i of cellsOf(s))b.owner[i]=id})}
function randomFleet(){const b=newBoard();for(const f of FLEET){let s,tries=0;do{s={n:f.n,l:f.l,v:Math.random()<.5,r:Math.floor(Math.random()*N),c:Math.floor(Math.random()*N)};tries++}while(!fits(b,s)&&tries<1000);addShip(b,s)}return b}
function fire(b,i){if(b.shots[i])return null;const o=b.owner[i];if(o<0){b.shots[i]=1;return{hit:false}}b.shots[i]=2;const s=b.ships[o];s.hits++;return{hit:true,sunk:s.hits>=s.l?s:null,ship:s}}
function allSunk(b){return b.ships.every(s=>s.hits>=s.l)}

/* ---------- AI ---------- */
const AI={
 reset(){this.targets=[];this.hitsOpen=[]},
 pick(b){const free=[];for(let i=0;i<N*N;i++)if(!b.shots[i])free.push(i);
  if(diff==='easy')return free[Math.floor(Math.random()*free.length)];
  // open hits = hits on unsunk ships
  const open=[];for(let i=0;i<N*N;i++)if(b.shots[i]===2){const s=b.ships[b.owner[i]];if(s.hits<s.l)open.push(i)}
  if(diff==='normal'){
   if(open.length){
    // if two+ aligned, extend line
    let cand=[];
    if(open.length>=2){const rs=new Set(open.map(i=>Math.floor(i/N))),cs=new Set(open.map(i=>i%N));
     if(rs.size===1){const r=[...rs][0],cc=open.map(i=>i%N);const mn=Math.min(...cc),mx=Math.max(...cc);[mn-1,mx+1].forEach(c=>{if(c>=0&&c<N&&!b.shots[r*N+c])cand.push(r*N+c)})}
     else if(cs.size===1){const c=[...cs][0],rr=open.map(i=>Math.floor(i/N));const mn=Math.min(...rr),mx=Math.max(...rr);[mn-1,mx+1].forEach(r=>{if(r>=0&&r<N&&!b.shots[r*N+c])cand.push(r*N+c)})}}
    if(!cand.length)for(const i of open)for(const n of nb(i))if(!b.shots[n])cand.push(n);
    if(cand.length)return cand[Math.floor(Math.random()*cand.length)];
   }
   const par=free.filter(i=>(Math.floor(i/N)+i%N)%2===0);const p=par.length?par:free;return p[Math.floor(Math.random()*p.length)];
  }
  // hard: probability density
  const rem=b.ships.filter(s=>s.hits<s.l).map(s=>s.l);
  const dens=new Array(N*N).fill(0);
  for(const L of rem)for(let v=0;v<2;v++)for(let r=0;r<N;r++)for(let c=0;c<N;c++){
   if(v?r+L>N:c+L>N)continue;let ok=true,cover=0;const cl=[];
   for(let k=0;k<L;k++){const i=(r+(v?k:0))*N+c+(v?0:k);const st=b.shots[i];if(st===1){ok=false;break}if(st===2){const s=b.ships[b.owner[i]];if(s.hits>=s.l){ok=false;break}cover++}cl.push(i)}
   if(!ok)continue;const w=cover?1+cover*40:1;for(const i of cl)if(!b.shots[i])dens[i]+=w}
  let best=-1,bi=[];for(const i of free){if(dens[i]>best){best=dens[i];bi=[i]}else if(dens[i]===best)bi.push(i)}
  return bi[Math.floor(Math.random()*bi.length)];
 }
};
function nb(i){const r=Math.floor(i/N),c=i%N,o=[];if(r>0)o.push(i-N);if(r<N-1)o.push(i+N);if(c>0)o.push(i-1);if(c<N-1)o.push(i+1);return o}

/* ---------- UI ---------- */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
const HELP={easy:'Fires at random. A gentle warm-up.',normal:'Hunts in a checkerboard, then targets around every hit.',hard:'Calculates probability density for every square. Ruthless.'};
function setDiff(d){diff=d;store.set('nf_diff',d);document.querySelectorAll('#diffRow .btn').forEach(b=>b.classList.toggle('sel',b.dataset.d===d));$('diffHelp').textContent=HELP[d]}
document.querySelectorAll('#diffRow .btn').forEach(b=>b.onclick=()=>{SFX.click();setDiff(b.dataset.d)});setDiff(diff);
function mkGrid(el){el.innerHTML='';for(let i=0;i<N*N;i++){const c=document.createElement('div');c.className='cell';c.dataset.i=i;el.appendChild(c)}}
['pgrid','egrid','mgrid'].forEach(id=>mkGrid($(id)));
function gs(){const two=innerWidth>=760;let s=two?Math.min(380,(innerWidth-80)/2):Math.min(innerWidth-40,420);const battle=$('battle').classList.contains('on'),place=$('place').classList.contains('on');if(battle||place){const rows=battle&&!two?2:1;const chrome=battle?(two?200:240):(innerHeight<520?270:190);s=Math.min(s,(innerHeight-chrome)/rows)}return Math.max(110,Math.floor(s/10)*10)}
function layout(){if(!$('pgrid'))return;const s=gs();document.documentElement.style.setProperty('--gs',s+'px');renderAll()}
function shipEl(grid,s,cls){const cs=grid.clientWidth/N;const e=document.createElement('div');e.className='ship '+(s.v?'v ':'')+(cls||'');e.style.left=(s.c*cs+3)+'px';e.style.top=(s.r*cs+3)+'px';e.style.width=((s.v?1:s.l)*cs-6)+'px';e.style.height=((s.v?s.l:1)*cs-6)+'px';grid.appendChild(e);return e}
function clearShips(g){g.querySelectorAll('.ship').forEach(e=>e.remove())}

/* placement */
let pb,pending,selDock=-1,selPlaced=-1,orientV=false;
function startPlacement(){pb=newBoard();pending=FLEET.map(f=>({...f}));selDock=0;selPlaced=-1;show('place');layout();renderPlace()}
function renderPlace(){const g=$('pgrid');clearShips(g);pb.ships.forEach((s,id)=>{const e=shipEl(g,s,'place'+(id===selPlaced?' selected':''));e.dataset.id=id});
 const d=$('dock');d.innerHTML='';const cs=Math.min(30,$('pgrid').clientWidth/N);pending.forEach((f,k)=>{const e=document.createElement('div');e.className='dockShip'+(k===selDock?' selected':'');e.style.width=(f.l*cs)+'px';e.textContent=f.n;e.dataset.k=k;d.appendChild(e)});
 if(!pending.length)d.innerHTML='<div class="help">Fleet ready! Hit Battle!</div>';
 $('status').textContent=pending.length?`Place your ${pending[selDock>=0?selDock:0].n} (${pending[selDock>=0?selDock:0].l})`+(orientV?' · vertical':' · horizontal'):'All ships placed';
 $('startBtn').style.opacity=pending.length?.5:1}
function cellFromPoint(x,y){const r=$('pgrid').getBoundingClientRect();if(x<r.left||y<r.top||x>r.right||y>r.bottom)return null;const cs=r.width/N;return{r:Math.floor((y-r.top)/cs),c:Math.floor((x-r.left)/cs)}}
let drag=null;
function ghost(s,ok){let g=$('ghost');const grid=$('pgrid');if(!g){g=document.createElement('div');g.id='ghost';grid.appendChild(g)}const cs=grid.clientWidth/N;g.className='ship '+(s.v?'v':'')+(ok?' selected':' bad');g.style.left=(s.c*cs+3)+'px';g.style.top=(s.r*cs+3)+'px';g.style.width=((s.v?1:s.l)*cs-6)+'px';g.style.height=((s.v?s.l:1)*cs-6)+'px';g.style.opacity=.75}
function noGhost(){const g=$('ghost');if(g)g.remove()}
function beginDrag(e,src){ac();drag={...src,x0:e.clientX,y0:e.clientY,moved:false};e.preventDefault()}
$('dock').addEventListener('pointerdown',e=>{const t=e.target.closest('.dockShip');if(!t)return;const k=+t.dataset.k;selDock=k;selPlaced=-1;SFX.click();renderPlace();beginDrag(e,{kind:'dock',k,l:pending[k].l,n:pending[k].n,v:orientV})});
$('pgrid').addEventListener('pointerdown',e=>{const cell=cellFromPoint(e.clientX,e.clientY);if(!cell)return;const id=pb.owner[cell.r*N+cell.c];
 if(id>=0){const s=pb.ships[id];beginDrag(e,{kind:'placed',id,l:s.l,n:s.n,v:s.v,off:s.v?cell.r-s.r:cell.c-s.c})}
 else if(pending.length){const k=selDock>=0?selDock:0;const s={n:pending[k].n,l:pending[k].l,v:orientV,r:cell.r,c:cell.c};if(!fits(pb,s)){if(s.v)s.r=N-s.l;else s.c=N-s.l}if(fits(pb,s)){addShip(pb,s);pending.splice(k,1);selDock=pending.length?0:-1;SFX.place();renderPlace()}else SFX.click()}});
window.addEventListener('pointermove',e=>{if(!drag)return;if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>6)drag.moved=true;if(!drag.moved)return;const cell=cellFromPoint(e.clientX,e.clientY);if(!cell){noGhost();return}const off=drag.kind==='placed'?drag.off:0;const s={l:drag.l,v:drag.v,r:cell.r-(drag.v?off:0),c:cell.c-(drag.v?0:off)};ghost(s,fits(pb,s,drag.kind==='placed'?drag.id:undefined))});
window.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;noGhost();
 if(!d.moved){if(d.kind==='placed'){selPlaced=d.id;rotatePlaced(d.id)}return}
 const cell=cellFromPoint(e.clientX,e.clientY);if(!cell){if(d.kind==='placed'){/*drag off grid: return to dock*/const s=pb.ships.splice(d.id,1)[0];pending.push({n:s.n,l:s.l});rebuildOwner(pb);selDock=pending.length-1;SFX.click();renderPlace()}return}
 const off=d.kind==='placed'?d.off:0;const s={n:d.n,l:d.l,v:d.v,r:cell.r-(d.v?off:0),c:cell.c-(d.v?0:off)};
 if(d.kind==='dock'){if(fits(pb,s)){addShip(pb,s);pending.splice(d.k,1);selDock=pending.length?0:-1;SFX.place()}}
 else{if(fits(pb,s,d.id)){const o=pb.ships[d.id];o.r=s.r;o.c=s.c;rebuildOwner(pb);SFX.place()}}
 renderPlace()});
function rotatePlaced(id){const s=pb.ships[id];const t={...s,v:!s.v};if(!fits(pb,t,id)){// try shifting
  for(let sh=1;sh<s.l;sh++){if(t.v)t.r=s.r-sh;else t.c=s.c-sh;if(fits(pb,t,id))break}}
 if(fits(pb,t,id)){s.v=t.v;s.r=t.r;s.c=t.c;rebuildOwner(pb);SFX.rotate()}else SFX.click();renderPlace()}
function doRotate(){if(selPlaced>=0&&pb.ships[selPlaced])rotatePlaced(selPlaced);else{orientV=!orientV;SFX.rotate();renderPlace()}}
$('rotBtn').onclick=doRotate;
window.addEventListener('keydown',e=>{if($('place').classList.contains('on')&&(e.key==='r'||e.key==='R'))doRotate()});
$('randBtn').onclick=()=>{pb=randomFleet();pending=[];selDock=-1;selPlaced=-1;SFX.place();renderPlace()};
$('clearBtn').onclick=()=>{startPlacement();SFX.click()};
$('startBtn').onclick=()=>{if(pending.length){$('status').textContent='Place all ships first!';SFX.click();return}startBattle()};
$('playBtn').onclick=()=>{ac();SFX.click();startPlacement()};

/* battle */
let me,en,turn,busy,shotsFired,hitsLanded,over;
function startBattle(){me=pb;me.ships.forEach(s=>s.hits=0);me.shots.fill(0);en=randomFleet();AI.reset();turn='p';busy=false;over=false;shotsFired=0;hitsLanded=0;show('battle');layout();setStatus('Your turn — fire on enemy waters!');SFX.click()}
function setStatus(t){$('status2').textContent=t}
function renderBoard(grid,b,reveal){clearShips(grid);for(let i=0;i<N*N;i++){const c=grid.children[i];c.className='cell'+(b.shots[i]===1?' miss':b.shots[i]===2?' hit':'')+(b.shots[i]===2&&b.ships[b.owner[i]].hits>=b.ships[b.owner[i]].l?' sunk':'')}
 b.ships.forEach(s=>{const dead=s.hits>=s.l;if(reveal||dead){const e=shipEl(grid,s,dead?'dead':'');e.style.opacity=dead?.85:1}})}
function renderTrack(el,b){el.innerHTML=b.ships.map(s=>`<div class="tr ${s.hits>=s.l?'sunkT':''}"><div class="pips">${'<div class="pip"></div>'.repeat(s.l)}</div>${s.n}</div>`).join('')}
function renderAll(){if($('place').classList.contains('on')&&pb)renderPlace();if($('battle').classList.contains('on')&&me){renderBoard($('egrid'),en,over);renderBoard($('mgrid'),me,true);renderTrack($('etrack'),en);renderTrack($('mtrack'),me);$('shotInfo').textContent=`Shots ${shotsFired} · Hits ${hitsLanded} · Accuracy ${shotsFired?Math.round(hitsLanded/shotsFired*100):0}% · ${diff[0].toUpperCase()+diff.slice(1)}`}}
$('egrid').addEventListener('pointerdown',e=>{const c=e.target.closest('.cell');if(!c)return;playerFire(+c.dataset.i)});
function playerFire(i){if(turn!=='p'||busy||over||en.shots[i])return;busy=true;SFX.fire();shotsFired++;
 setTimeout(()=>{const r=fire(en,i);if(r.hit){hitsLanded++;boomAt($('egrid'),i,!!r.sunk);r.sunk?SFX.sunk():SFX.boom();setStatus(r.sunk?`You sunk their ${r.sunk.n}! 💥`:'Direct hit! 🔥')}else{splashAt($('egrid'),i);SFX.splash();setStatus('Miss… enemy is aiming')}
  renderAll();if(allSunk(en))return endGame(true);turn='e';setTimeout(enemyFire,T.enemy)},T.fly)}
function enemyFire(){if(over)return;const i=AI.pick(me);const r=fire(me,i);if(r.hit){boomAt($('mgrid'),i,!!r.sunk);r.sunk?SFX.sunk():SFX.boom();setStatus(r.sunk?`They sunk your ${r.sunk.n}!`:'You took a hit!')}else{splashAt($('mgrid'),i);SFX.splash();setStatus('They missed. Your turn!')}
 renderAll();if(allSunk(me))return endGame(false);turn='p';busy=false}
const T={fly:280,enemy:650};
function endGame(win){over=true;busy=false;renderAll();const st=store.get('nf_stats',{});const d=st[diff]||{g:0,w:0,l:0,shots:0,hits:0,best:null,streak:0,bestStreak:0};d.g++;d.shots+=shotsFired;d.hits+=hitsLanded;if(win){d.w++;d.streak++;d.bestStreak=Math.max(d.bestStreak,d.streak);if(d.best==null||shotsFired<d.best)d.best=shotsFired}else{d.l++;d.streak=0}st[diff]=d;store.set('nf_stats',st);if(win){let best=Infinity;for(const k of['easy','normal','hard']){const b=st[k]&&st[k].best;if(typeof b==='number'&&b<best)best=b}if(best<Infinity)try{localStorage.setItem('arcade-fleet-best',String(best))}catch(e){}}
 setTimeout(()=>{win?SFX.win():SFX.lose();$('ovTitle').textContent=win?'VICTORY':'DEFEAT';$('ovTitle').style.color=win?'#7dffb0':'#ff6a5a';$('ovText').innerHTML=`${win?'The enemy fleet rests on the seabed.':'Your fleet has been sunk.'}<br>Shots: ${shotsFired} · Accuracy: ${shotsFired?Math.round(hitsLanded/shotsFired*100):0}%`+(win&&d.best===shotsFired?'<br>🏆 New best!':'');$('overlay').classList.add('on');if(win)for(let k=0;k<6;k++)setTimeout(()=>boomAt($('egrid'),Math.floor(Math.random()*100),true),k*200)},T.fly+300)}
$('againBtn').onclick=()=>{$('overlay').classList.remove('on');SFX.click();startPlacement()};
$('toTitle').onclick=()=>{$('overlay').classList.remove('on');SFX.click();show('title')};
function renderStats(){const st=store.get('nf_stats',{});let h='<table><tr><th></th><th>Played</th><th>Won</th><th>Lost</th><th>Win%</th><th>Acc.</th><th>Best</th><th>Streak</th></tr>';for(const d of ['easy','normal','hard']){const s=st[d]||{g:0,w:0,l:0,shots:0,hits:0,best:null,bestStreak:0};h+=`<tr><th>${d}</th><td>${s.g}</td><td>${s.w}</td><td>${s.l}</td><td>${s.g?Math.round(s.w/s.g*100):0}%</td><td>${s.shots?Math.round(s.hits/s.shots*100):0}%</td><td>${s.best??'–'}</td><td>${s.bestStreak||0}</td></tr>`}$('statsBody').innerHTML=h+'</table><div class="help">Best = fewest shots to win</div>'}
$('statsBtn').onclick=()=>{SFX.click();renderStats();show('stats')};
$('statsBack').onclick=()=>{SFX.click();show('title')};
$('resetStats').onclick=()=>{store.set('nf_stats',{});try{localStorage.removeItem('arcade-fleet-best')}catch(e){}renderStats()};
window.addEventListener('resize',resize);resize();requestAnimationFrame(loop);
window.__bs={get me(){return me},get en(){return en},get turn(){return turn},get busy(){return busy},get over(){return over},T,playerFire,setDiff};
})();
</script></body></html>
