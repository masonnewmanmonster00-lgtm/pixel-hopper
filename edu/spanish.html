<script>
const SAVEKEY='spanishQuestSave',TITLE='🇪🇸 Spanish Quest',INTRO='Learn beginner Spanish: greetings, numbers, colours, food, animals and phrases. Match pictures, listen, and spell with accents!';

const cv=$('c'),cx=cv.getContext('2d');let W=0,H=0,DPR=1;

let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=0.12,t='sine',v=0.15,dl=0){if(save.mute)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;const s=a.currentTime+dl;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(0.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+0.02)}
const sfx={ok(){tone(660,.1,'triangle');tone(990,.15,'triangle',.15,.08)},bad(){tone(200,.25,'sawtooth',.08)},tap(){tone(500,.05,'square',.05)},win(){[523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.15,i*.12))}};
function resize(){DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight-40;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';cx.setTransform(DPR,0,0,DPR,0,0)}

function txt(s,x,y,sz,col='#fff',al='center',wt='700'){cx.font=wt+' '+sz+'px system-ui,Segoe UI,Roboto,sans-serif';cx.fillStyle=col;cx.textAlign=al;cx.textBaseline='middle';cx.fillText(s,x,y)}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

let paused=false,btns=[];
function hit(x,y){for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.f();return true}}return false}
function ptr(e){ac();if(paused||$('ov').style.display==='flex')return;const r=cv.getBoundingClientRect();const p=e.changedTouches?e.changedTouches[0]:e;onTap(p.clientX-r.left,p.clientY-r.top)}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ptr(e)});

function finishLevel(stars){sfx.win();const i=cur;save.stars[i]=Math.max(save.stars[i]||0,stars);save.unlocked=Math.max(save.unlocked,Math.min(LV.length,i+2));persist();

addEventListener('keydown',e=>{const k=e.key;if(k==='p'||k==='P'){setPause(!paused);return}if(paused)return;if($('ov').style.display==='flex'){if(k==='Enter'&&$('nextB'))$('nextB').click();return}

['sí','yes','phr'],['no','no','phr'],['de nada','you\'re welcome','phr'],['lo siento','I\'m sorry','phr'],['me llamo…','my name is…','phr'],['¿cómo estás?','how are you?','phr'],['estoy bien','I\'m fine','phr'],['hasta luego','see you later','phr'],['tengo hambre','I\'m hungry','phr'],['¿dónde está…?','where is…?','phr'],['no entiendo','I don\'t understand','phr'],['¿cuántos años tienes?','how old are you?','phr'],

...['uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte'].map((w,i)=>[w,String(i+1),'num',i+1]),
// colours
['rojo','red','col','#e53935'],['azul','blue','col','#1e66f5'],['verde','green','col','#2ea043'],['amarillo','yellow','col','#fdd835'],['naranja','orange','col','#fb8c00'],['morado','purple','col','#8e44ad'],['rosa','pink','col','#f48fb1'],['negro','black','col','#111'],['blanco','white','col','#fafafa'],['marrón','brown','col','#7b4a24'],['gris','grey','col','#8a8a8a'],

].map(a=>({es:a[0],en:a[1],cat:a[2],ic:a[3]}));
const by=(c,f)=>V.filter(v=>c.includes(v.cat)&&(!f||f(v)));
const num=(a,b)=>v=>v.cat!=='num'||(v.ic>=a&&v.ic<=b);
const LV=[
{name:'Saludos (greetings)',m:['p2w'],pool:by(['greet'])},
{name:'Números 1–10',m:['w2p'],pool:by(['num'],num(1,10))},

{name:'La comida (food)',m:['w2p'],pool:by(['food'])},
{name:'Los animales',m:['p2w'],pool:by(['ani'])},
{name:'Escucha: números',m:['listen'],pool:by(['num'],num(1,10))},
{name:'Escucha: colores y animales',m:['listen'],pool:by(['col','ani'])},

// ---------- speech ----------
function loadVoices(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();esVoice=vs.find(v=>/^es[-_]ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;if(vs.length)voicesChecked=true}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();draw()}}
setTimeout(()=>{voicesChecked=true;draw()},1500);
function canSpeak(){return 'speechSynthesis' in window&&(esVoice||!voicesChecked)}
function say(t){if(save.mute||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[¿?…]/g,''));u.lang='es-ES';if(esVoice)u.voice=esVoice;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
// ---------- questions ----------
const hasPic=v=>v.cat!=='phr';
function distract(v,pool,n,key){const same=pool.filter(o=>o!==v&&o[key]!==v[key]);let src=same.length>=n?same:V.filter(o=>o.cat===v.cat&&o!==v&&o[key]!==v[key]);return shuffle(src).slice(0,n)}
function makeQ(){const L=LV[cur];let v=pick(L.pool);while(Q&&L.pool.length>1&&Q.v===v)v=pick(L.pool);let m=pick(L.m);if(m==='spell'&&v.cat==='phr')m='en2es';if(m==='p2w'&&!hasPic(v))m='en2es';
 const q={v,m,picked:null};const opts=shuffle([v,...distract(v,L.pool,3,'es')]);q.opts=opts;
 if(m==='spell'){q.target=v.es;q.pos=0;const letters=[...v.es.replace(/ /g,'')];const dec=[];const pairs={a:'á',e:'é',i:'í',o:'ó',u:'ú',n:'ñ','á':'a','é':'e','í':'i','ó':'o','ú':'u','ñ':'n'};
  letters.forEach(c=>{if(pairs[c]&&!letters.includes(pairs[c])&&!dec.includes(pairs[c])&&dec.length<4)dec.push(pairs[c])});while(letters.length+dec.length<10)dec.push(pick([...'abcdeilmnorstu']));q.tiles=shuffle([...letters,...dec]).map(c=>({c,used:false}))}
 return q}
function startLevel(i){ov('');paused=false;cur=i;qi=0;miss=0;msg='';lock=false;Q=null;Q=makeQ();draw();speakPrompt()}
function speakPrompt(){if(!Q)return;if(Q.m==='w2p'||Q.m==='listen')setTimeout(()=>say(Q.v.es),250)}

 else if(k==='wave'){E(0,10,22,26,'#f2c18d');[-18,-7,4,15].forEach((fx,i)=>E(fx,-22,5,14,'#f2c18d'));E(24,8,6,13,'#f2c18d',-.6);cx.strokeStyle='#fff';cx.lineWidth=3;[0,1].forEach(i=>{cx.beginPath();cx.arc(0,0,40+i*8,-2.4,-1.9);cx.stroke()})}
 else if(k==='bye'){cx.fillStyle='#8d5a2b';cx.fillRect(-25,-40,50,80);C(14,0,4,'#ffd54a');E(-38,0,10,14,'#f2c18d');cx.strokeStyle='#fff';cx.lineWidth=3;cx.beginPath();cx.arc(-38,0,22,2.3,3.9);cx.stroke()}
 else if(k==='sun'||k==='sunset'){const yy=k==='sun'?-5:18;if(k==='sunset'){cx.fillStyle='#f57c00';cx.fillRect(-45,18,90,4)}C(0,yy,20,'#ffca28');cx.strokeStyle='#ffca28';cx.lineWidth=4;for(let i=0;i<10;i++){const a=i/10*Math.PI*2;if(k==='sunset'&&Math.sin(a)>0)continue;cx.beginPath();cx.moveTo(Math.cos(a)*27,yy+Math.sin(a)*27);cx.lineTo(Math.cos(a)*38,yy+Math.sin(a)*38);cx.stroke()}if(k==='sunset'){cx.fillStyle='#3a2a6a';cx.fillRect(-45,22,90,25)}}

 else if(k==='bird'){E(-5,8,30,22,'#42a5f5');C(20,-12,16,'#42a5f5');poly([[34,-14],[48,-8],[34,-4]],'#ffb300');C(24,-16,3,'#111');E(-10,8,16,9,'#1e88e5',-.4);cx.strokeStyle='#ffb300';cx.lineWidth=3;cx.beginPath();cx.moveTo(-8,28);cx.lineTo(-8,40);cx.moveTo(4,28);cx.lineTo(4,40);cx.stroke()}

 else if(k==='cow'){E(-30,-14,12,6,'#fff',.3);E(30,-14,12,6,'#fff',-.3);E(0,0,26,30,'#fafafa');E(-10,-8,8,10,'#222');E(0,20,20,13,'#f8bbd0');C(-7,20,3,'#a55');C(7,20,3,'#a55');eyes(0,-6,10);cx.strokeStyle='#ccc';cx.lineWidth=4;cx.beginPath();cx.moveTo(-14,-28);cx.lineTo(-20,-40);cx.moveTo(14,-28);cx.lineTo(20,-40);cx.stroke()}
 else if(k==='pig'){poly([[-26,-14],[-22,-38],[-8,-24]],'#f48fb1');poly([[26,-14],[22,-38],[8,-24]],'#f48fb1');C(0,0,32,'#f8bbd0');E(0,12,14,10,'#f48fb1');C(-5,12,3,'#a55');C(5,12,3,'#a55');eyes(0,-10,12)}

// ---------- layout/draw ----------
function card(x,y,w,h,col,stroke){cx.fillStyle=col;rr(x,y,w,h,12);cx.fill();if(stroke){cx.strokeStyle=stroke;cx.lineWidth=3;cx.stroke()}}
function wrapC(s,x,y,w,sz,col){cx.font='700 '+sz+'px system-ui';const ws=s.split(' ');let lines=[],l='';for(const wd of ws){const t=l?l+' '+wd:wd;if(cx.measureText(t).width>w&&l){lines.push(l);l=wd}else l=t}lines.push(l);lines.forEach((ln,i)=>txt(ln,x,y+(i-(lines.length-1)/2)*(sz+4),sz,col))}
function draw(){btns=[];cx.clearRect(0,0,W,H);const g=cx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#5a1020');g.addColorStop(1,'#2a0c3a');cx.fillStyle=g;cx.fillRect(0,0,W,H);
 if(!Q)return;$('st').textContent='Lv '+(cur+1)+' · '+Math.min(qi+1,NQ)+'/'+NQ+' · ✗'+miss;
 const q=Q,v=q.v,lw=Math.min(W*.38,H*1.05),lx=10,ly=8,lh=H-16,rx=lx+lw+12,rw=W-rx-10;
 card(lx,ly,lw,lh,'#ffffff14','#ffcf5a55');txt(LV[cur].name,lx+lw/2,ly+14,12,'#ffcf5a');
 const prompts={p2w:'What is this in Spanish?',w2p:'Tap the matching picture',listen:'Listen! Tap what you hear',spell:'Spell it in Spanish',en2es:'Choose the Spanish',es2en:'What does it mean?'};
 txt(prompts[q.m],rx+rw/2,16,15,'#fff');
 const ps=Math.min(lw-40,lh-110);
 if(q.m==='p2w'||q.m==='spell'){drawIcon(v,lx+(lw-ps)/2,ly+26,ps);txt(v.cat==='num'?'':(v.cat==='greet'||q.m==='spell'?'('+v.en+')':''),lx+lw/2,ly+ps+36,14,'#cde')}
 if(q.m==='w2p'||q.m==='es2en'){wrapC(v.es,lx+lw/2,ly+lh*.42,lw-20,fit(v.es,lw-20,34),'#fff')}
 if(q.m==='en2es')wrapC('“'+v.en+'”',lx+lw/2,ly+lh*.42,lw-20,fit('“'+v.en+'”',lw-20,28),'#fff');
 if(q.m==='listen'){if(canSpeak()){C(lx+lw/2,ly+lh*.42,44,'#e07a10');txt('🔊',lx+lw/2,ly+lh*.42,40)}else{wrapC(v.es,lx+lw/2,ly+lh*.38,lw-20,fit(v.es,lw-20,30),'#fff');wrapC('(No Spanish voice on this device — read it aloud instead!)',lx+lw/2,ly+lh*.62,lw-30,12,'#fbb')}}
 if(q.m!=='spell'&&q.m!=='en2es'&&q.m!=='p2w'||q.m==='p2w'&&false){}
 if(q.m==='w2p'||q.m==='listen'||q.m==='es2en'||q.m==='p2w'||q.m==='en2es'){const sb={x:lx+lw/2-60,y:ly+lh-44,w:120,h:34};if(q.m!=='en2es'&&q.m!=='p2w'||q.picked){card(sb.x,sb.y,sb.w,sb.h,'#283070');txt('🔊 Hear it (H)',sb.x+60,sb.y+17,13);btns.push({...sb,f:()=>say(v.es)})}}
 if(q.m==='spell')return drawSpell(rx,rw,lx,lw);
 const picOpts=(q.m==='w2p'||q.m==='listen')&&hasPic(v);const bw=(rw-10)/2,top=32,bh=(H-top-58)/2;
 q.opts.forEach((o,i)=>{const bx=rx+(i%2)*(bw+10),by=top+Math.floor(i/2)*(bh+10);let col='#283070';if(q.picked){if(o===v)col='#2a8a3a';else if(o===q.picked)col='#a33'}card(bx,by,bw,bh,col);txt(i+1,bx+12,by+12,12,'#ffcf5a');
  if(picOpts){const s=Math.min(bw,bh)-10;drawIcon(o,bx+(bw-s)/2,by+(bh-s)/2,s)}else{const label=q.m==='es2en'||q.m==='listen'?o.en:o.es;wrapC(label,bx+bw/2,by+bh/2,bw-16,fit(label,bw-16,22),'#fff')}
  btns.push({x:bx,y:by,w:bw,h:bh,f:()=>choose(o)})});
 if(msg)wrapC(msg,rx+rw/2,H-22,rw,14,msgCol)}
function drawSpell(rx,rw){const q=Q,t=[...q.target];const n=t.length,sw=Math.min(34,(rw-4)/n-3);let x=rx+(rw-n*(sw+3))/2;
 t.forEach((c,i)=>{if(c===' '){x+=sw+3;return}card(x,34,sw,sw*1.25,i<q.pos?'#2a8a3a':'#ffffff22');if(i<q.pos)txt(c,x+sw/2,34+sw*.62,sw*.7);x+=sw+3});
 const cols=Math.ceil(q.tiles.length/2),tw=Math.min(62,(rw-(cols-1)*8)/cols),th=Math.min(58,tw);const ty=34+sw*1.25+24;
 q.tiles.forEach((tl,i)=>{const r=Math.floor(i/cols),c=i%cols,bx=rx+(rw-cols*(tw+8)+8)/2+c*(tw+8),by=ty+r*(th+10);if(tl.used)return;card(bx,by,tw,th,'#fff');txt(tl.c,bx+tw/2,by+th/2,th*.55,'#a01830','center','800');btns.push({x:bx,y:by,w:tw,h:th,f:()=>tile(i)})});
 if(msg)wrapC(msg,rx+rw/2,H-22,rw,14,msgCol);else wrapC('Watch the accents: á é í ó ú and ñ are different letters!',rx+rw/2,H-22,rw,12,'#fcd')}
function curChar(){const t=Q.target;while(t[Q.pos]===' ')Q.pos++;return t[Q.pos]}
function tile(i){if(lock)return;const tl=Q.tiles[i],need=curChar();if(tl.c===need){tl.used=true;Q.pos++;sfx.tap();if(curChar()===undefined){lock=true;sfx.ok();msg='✔ ¡Muy bien! '+Q.v.es+' = '+Q.v.en;msgCol='#7f7';say(Q.v.es);draw();setTimeout(next,1300);return}msg=''}else{sfx.bad();miss++;msg=(tl.c.normalize('NFD')[0]===need.normalize('NFD')[0])?'✘ Careful with the accent: you need “'+need+'”':'✘ Not that letter. Next letter is '+(Q.pos+1)+' of the word.';msgCol='#f99'}draw()}
function next(){msg='';lock=false;qi++;if(qi>=NQ){finishLevel(miss===0?3:miss<=2?2:1);return}Q=makeQ();draw();speakPrompt()}
function choose(o){if(lock)return;Q.picked=o;lock=true;const ok=o===Q.v;if(ok){sfx.ok();msg='✔ ¡Correcto! '+Q.v.es+' = '+Q.v.en;msgCol='#7f7'}else{sfx.bad();miss++;msg='✘ '+Q.v.es+' means “'+Q.v.en+'”';msgCol='#f99'}say(Q.v.es);draw();setTimeout(next,ok?1100:2000)}
function onTap(x,y){hit(x,y)}
function onKey(e){if(!Q)return;const k=e.key;if(Q.m==='spell'){const i=Q.tiles.findIndex(t=>!t.used&&t.c===k.toLowerCase());if(i>=0)tile(i);else if(k.length===1&&/[a-zñáéíóú]/i.test(k)){miss++;sfx.bad();msg='✘ Try again — tap the tiles for accented letters.';msgCol='#f99';draw()}return}
 if(k==='h'||k==='H'){say(Q.v.es);return}const n=+k;if(n>=1&&n<=4&&Q.opts[n-1])choose(Q.opts[n-1])}
window.SQ={get Q(){return Q},V,LV};
resize();cur=0;Q=makeQ();draw();showLevels();
