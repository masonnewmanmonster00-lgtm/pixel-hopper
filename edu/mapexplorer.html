*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;background:#e0f2fe;color:#0f172a;-webkit-user-select:none;user-select:none;touch-action:none}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff}
header h1{font-size:18px;margin:0 6px 0 0;white-space:nowrap}
header a{color:#fff;font-size:13px;text-decoration:none;background:rgba(255,255,255,.18);padding:5px 9px;border-radius:999px}
select,button{font:inherit;font-size:14px;border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
select{background:#fff;color:#1e293b}
.go{background:#facc15;color:#422006;font-weight:700}
.stats{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.18);border-radius:10px;padding:3px 8px;font-size:13px;white-space:nowrap}.stat b{font-size:15px}
#wrap{position:relative;flex:1;min-height:0}
svg{width:100%;height:100%;display:block;background:radial-gradient(circle at 50% 40%,#bae6fd,#7dd3fc);cursor:grab}
svg.drag{cursor:grabbing}
path.r{stroke:#fff;stroke-width:.8;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .25s}
path.r.on{cursor:pointer}path.r.off{fill:#cbd5e1!important;opacity:.55}
path.r.on:hover{filter:brightness(1.12)}
path.r.ok{fill:#22c55e!important}path.r.bad{fill:#ef4444!important}
path.r.show{fill:#f97316!important;animation:pulse .5s 4 alternate}
path.r.done{fill:#86efac!important}
@keyframes pulse{to{opacity:.35}}
#prompt{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:8px 20px;font-size:20px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#prompt small{display:block;font-size:11px;font-weight:500;color:#64748b;text-align:center}
#tip{position:absolute;pointer-events:none;background:#0f172a;color:#fff;font-size:13px;padding:4px 8px;border-radius:8px;display:none;white-space:nowrap;z-index:5}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:42px;height:42px;padding:0;font-size:22px;font-weight:700;background:#fff;color:#2563eb;box-shadow:0 2px 8px rgba(0,0,0,.2);border-radius:12px}
#skip{position:absolute;left:10px;bottom:10px;background:#fff;color:#7c3aed;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#toast{position:absolute;top:62px;left:50%;transform:translateX(-50%);font-weight:800;font-size:18px;padding:6px 14px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
#overlay{position:absolute;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:10}
.card{background:#fff;border-radius:20px;padding:20px 24px;max-width:460px;width:92%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);max-height:96%;overflow:auto}
.card h2{margin:0 0 8px;color:#7c3aed}.card p{margin:6px 0;color:#334155}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.card select{border:2px solid #c7d2fe}
.big{font-size:34px;font-weight:800;color:#2563eb}
@media (max-height:450px){header{padding:3px 8px;gap:4px}header h1{font-size:15px}select,button{font-size:12px;padding:4px 9px}header a{font-size:11px;padding:3px 7px}.stat{font-size:11px;padding:2px 6px}.stat b{font-size:12px}#prompt{font-size:16px;padding:4px 14px;top:6px}#toast{top:46px;font-size:15px}#zoom button{width:36px;height:36px;font-size:19px}.card{padding:10px 16px}.card h2{font-size:18px;margin:0 0 4px}.big{font-size:24px}.card p{margin:3px 0;font-size:13px}}

svg.addEventListener('pointerleave',()=>{$('tip').style.display='none'});
function tipAt(p,x,y){const t=$('tip'),r=$('wrap').getBoundingClientRect();t.textContent=p.dataset.n;t.style.display='block';t.style.left=Math.min(x-r.left+12,r.width-t.offsetWidth-4)+'px';t.style.top=Math.max(0,y-r.top-30)+'px'}
function hover(e){if(S.mode!=='practice'||e.pointerType==='touch'){return}const p=e.target;if(p._act)tipAt(p,e.clientX,e.clientY);else $('tip').style.display='none'}
// ---- game
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function bestKey(){return S.map+'_'+S.mode}
function hud(){$('sc').textContent=S.score;$('st').textContent=S.streak;$('ac').textContent=S.tries?Math.round(100*S.right/S.tries)+'%':'–';$('tm').textContent=S.mode==='timed'?S.t+'s':'∞';$('bs').textContent=save.best[bestKey()]||0}
function next(){S.lock=false;S.wrongOnTarget=0;if(!S.queue.length){if(S.mode==='timed'||S.map){if(S.mode==='practice'){finish(true);return}S.queue=shuffle(els.slice())}}
 S.target=S.queue.pop();$('prompt').innerHTML=`Find: ${S.target.dataset.n}<small>${MAPS[S.map].t} · ${S.queue.length} left</small>`}
function toast(txt,c){const t=$('toast');t.textContent=txt;t.style.background=c;t.style.color='#fff';t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,900)}
function flash(p,c,ms){p.classList.add(c);setTimeout(()=>p.classList.remove(c),ms)}
function pick(p,e){if(S.mode==='practice'&&e)tipAt(p,e.clientX,e.clientY);if(!S.on||S.lock)return;S.tries++;save.total++;
 if(p===S.target){S.right++;save.correct++;S.streak++;save.bestStreak=Math.max(save.bestStreak,S.streak);const pts=10+Math.min(S.streak-1,10)*2;S.score+=pts;
  flash(p,'ok',700);toast(`✔ +${pts}${S.streak>2?' 🔥'+S.streak:''}`,'#16a34a');if(S.mode==='practice')setTimeout(()=>p.classList.add('done'),700);S.lock=true;setTimeout(next,450)}
 else{S.streak=0;flash(p,'bad',700);toast(`✘ That's ${p.dataset.n}`,'#dc2626');S.lock=true;reveal(S.target);setTimeout(next,1500)}
 saveBest();hud();persist()}
function reveal(p){p.classList.add('show');setTimeout(()=>p.classList.remove('show'),1500);const b=p.getBBox();if(b.width*V.k<8||b.height*V.k<8){V.k=Math.max(V.k,Math.min(home.k*40,30/Math.max(b.width,b.height,0.5)))}
 const cx=b.x+b.width/2,cy=b.y+b.height/2,sx=cx*V.k+V.x,sy=cy*V.k+V.y;if(sx<40||sx>DATA.W-40||sy<40||sy>DATA.H-40||b.width*V.k<8){V.x=DATA.W/2-cx*V.k;V.y=DATA.H/2-cy*V.k}apply()}
function saveBest(){const k=bestKey();if(S.score>(save.best[k]||0))save.best[k]=S.score}
$('skip').onclick=()=>{if(!S.on||S.lock)return;S.streak=0;S.tries++;save.total++;S.lock=true;toast('Here it is!','#f97316');reveal(S.target);hud();persist();setTimeout(next,1500)};
function start(){S.map=$('selMap').value;S.mode=$('selMode').value;save.lastMap=S.map;save.lastMode=S.mode;persist();draw();
 Object.assign(S,{score:0,streak:0,right:0,tries:0,on:true,queue:shuffle(els.slice())});$('overlay').style.display='none';clearInterval(S.timer);
 if(S.mode==='timed'){S.t=90;S.timer=setInterval(()=>{S.t--;hud();if(S.t<=0)finish()},1000)}next();hud()}
function finish(all){clearInterval(S.timer);S.on=false;saveBest();persist();const acc=S.tries?Math.round(100*S.right/S.tries):0;
 menu(`<h2>${all?'🎉 You found them all!':'⏰ Time\'s up!'}</h2><div class="big">${S.score} pts</div><p>Accuracy ${acc}% · ${S.right}/${S.tries} correct</p><p>🏆 Best for this map: ${save.best[bestKey()]||0}</p>`)}
function menu(head){const opts=Object.entries(MAPS).map(([k,m])=>`<option value="${k}"${k===S.map?' selected':''}>${m.t}</option>`).join('');
 const acc=save.total?Math.round(100*save.correct/save.total)+'%':'–';
 $('card').innerHTML=(head||`<h2>🌍 Map Explorer</h2><p>Find places on the map! Tap or click the country, province or state that matches the name.</p>`)+
 `<div class="row"><select id="selMap">${opts}</select><select id="selMode"><option value="timed"${S.mode==='timed'?' selected':''}>⏱ Timed (90 s)</option><option value="practice"${S.mode==='practice'?' selected':''}>🧭 Practice (labels on hover/tap)</option></select></div>
 <div class="row"><button class="go" id="goBtn">▶ Play</button>${S.on?'<button id="resume">Resume</button>':''}</div><p style="font-size:12px;color:#64748b">All-time accuracy ${acc} · best streak ${save.bestStreak} · scroll/pinch to zoom, drag to pan</p>`;
 $('overlay').style.display='flex';$('goBtn').onclick=start;if($('resume'))$('resume').onclick=()=>{$('overlay').style.display='none';if(S.mode==='timed')S.timer=setInterval(()=>{S.t--;hud();if(S.t<=0)finish()},1000)};
 $("selMap").onchange=()=>{if(S.on)return;S.map=$("selMap").value;draw();hud()}}
$('menuBtn').onclick=()=>{clearInterval(S.timer);menu()};
draw();hud();menu();
</script></body></html>
