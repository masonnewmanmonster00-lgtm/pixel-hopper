const TIPS={0:'A CIPHER swaps letters to hide a message. Only people who know the KEY can read it.',1:'CAESAR SHIFT: move each letter forward along the alphabet. With shift 3: A→D, B→E… and X→A (wrap around).',2:'Tap ◀ ▶ to turn the inner ring. When the preview shows a real word, tap Check.',4:'PIGPEN draws each letter as the shape of its box in the key. The second grid and X have dots.',6:'ATBASH flips the alphabet: A↔Z, B↔Y, C↔X… It is about 2,500 years old and was used for Hebrew.',8:'A KEYWORD cipher writes the keyword first (no repeated letters), then the rest of the alphabet in order.',10:'In long English messages E is usually the most common letter. Find the tallest bar!',11:'Now nobody tells you the shift. Turn the wheel until the message makes sense.'};
CUSTOM.wh={draw(q){const R=Math.min(H*.42,W*.2);wheel(20+R,H/2+4,R,q.k);const px=40+R*2,pw=W-px-14;
 wrapC(q.known?'Ciphertext made with shift '+q.ans+'. Turn the wheel to shift '+q.ans+' to decode it.':'Crack it! Turn the wheel until the message makes sense.',px+pw/2,40,pw,15,'#fff');card(px,62,pw,46,'#efe6ff');wrapC(q.ct,px+pw/2,85,pw-16,18,'#5a2a8a',2);
 txt('↓ decoded with shift '+q.k,px+pw/2,122,12,'#ccc');card(px,134,pw,46,'#0006');wrapC(sh(q.ct,-q.k),px+pw/2,157,pw-16,18,'#ffcf5a',2);
 const bw=(pw-20)/3;[['◀',()=>q.turn(-1)],['▶',()=>q.turn(1)],['✔ Check',()=>q.check()]].forEach((b,i)=>{const bx=px+i*(bw+10);card(bx,192,bw,44,i===2?'#2a8a3a':'#5a3a8a');txt(b[0],bx+bw/2,214,17);btns.push({x:bx,y:192,w:bw,h:44,f:b[1]})});if(msg)wrapC(msg,px+pw/2,H-24,pw,13,msgCol)},
 key(e,q){if(e.key==='ArrowLeft')q.turn(-1);else if(e.key==='ArrowRight')q.turn(1);else if(e.key==='Enter')q.check()}};
function wordOpts(w){return mo(w,WORDS.filter(x=>x.length===w.length).concat(shuffle(WORDS).slice(0,4)))}
function makeQ(){const L=LV[cur];let m=L.m;if(m==='mix')m=pick(['cl','wh','cw','pl','pw','al','aw','kw','fq','which']);const q={m,used:(Q&&Q.used)||[]};
 if(m==='cl'){const k=ri(1,8),c=ri(0,25);q.vis=()=>{const R=Math.min(H*.42,W*.18);wheel(W*.2+8,H/2+4,R,k)};q.text='Shift '+k+': what does '+AB[c]+' become? (outer ring → inner ring)';q.opts=mo(AB[(c+k)%26],[AB[(c+k+1)%26],AB[(c+k+25)%26],AB[(c+26-k)%26],AB[(c+k+2)%26]]);q.ans=AB[(c+k)%26];q.why=AB[c]+' + '+k+' = '+q.ans+'.';return q}
 if(m==='wh'){const k=ri(2,24);q.known=L.m==='wh'?L.known:Math.random()<.5;q.ans=k;q.pt=L.m==='wh'&&!L.known?pick(SENT):fromList(WORDS,q);q.ct=sh(q.pt,k);q.k=0;q.turn=d=>{if(lock)return;q.k=(q.k+d+26)%26;sfx.tap();msg='';draw()};q.check=()=>{if(lock)return;if(q.k===k)good('Decoded: '+q.pt+'!');else bad(q.known?'The wheel is on '+q.k+', not '+k+'.':'That still looks like gibberish. Keep turning!')};return q}
 if(m==='cw'){const w=fromList(WORDS,q),k=ri(1,6);q.big=sh(w,k);q.bigSz=30;q.text='This was encrypted with Caesar shift '+k+'. Decode it (shift back '+k+').';q.opts=wordOpts(w);q.ans=w;q.why=q.big+' − '+k+' = '+w+'.';return q}
 if(m==='pl'){const c=pick(AB.split(''));q.vis=()=>{card(16,50,W*.4-16,H-80,'#efe6ff');pig(c,W*.2+8,H/2-30,70);txt('',0,0,1)};q.wide=0;q.text='Which letter is this pigpen symbol?';q.opts=mo(c,AB.split('').filter(x=>Math.abs(AB.indexOf(x)-AB.indexOf(c))%9===0||Math.random()<.2));q.ans=c;q.why='Check the key: '+c+'.';q.key=1;return q}
 if(m==='pw'){const w=fromList(WORDS.filter(x=>x.length<=6),q);q.vis=pigWord(w);q.text='Decode the pigpen word';q.opts=wordOpts(w);q.ans=w;q.why='It spells '+w+'.';q.key=1;return q}
 if(m==='al'){const c=ri(0,25);q.big=AB[c]+' → ?';q.bigSz=40;q.text='Atbash flips the alphabet (A↔Z). What does '+AB[c]+' become?';q.opts=mo(AB[25-c],[AB[(26-c)%26],AB[(24-c+26)%26],AB[c],AB[(c+3)%26]]);q.ans=AB[25-c];q.why=AB[c]+' is letter '+(c+1)+' from the start; '+q.ans+' is letter '+(c+1)+' from the end.';return q}
 if(m==='aw'){const w=fromList(WORDS,q);q.big=atb(w);q.bigSz=30;q.text='Decode this Atbash message';q.opts=wordOpts(w);q.ans=w;q.why=q.big+' flipped = '+w+'.';return q}
 if(m==='kw'){const k=pick(KW),w=fromList(WORDS,q),a=keyAB(k);q.wide=1;q.text='Keyword '+k+'. Plain row on top, cipher row below. Decode: '+kenc(w,k);q.vis=null;q.opts=wordOpts(w);q.ans=w;q.why=kenc(w,k)+' → '+w+'.';q.tab=a;return q}
 if(m==='fq'){let s,k,ct,cnt,top;do{s=pick(SENT);k=ri(1,25);ct=sh(s,k);cnt={};for(const c of ct.replace(/ /g,''))cnt[c]=(cnt[c]||0)+1;const v=Object.values(cnt).sort((a,b)=>b-a);top=v[0]>v[1]?Object.keys(cnt).find(c=>cnt[c]===v[0]):null}while(!top);
  q.wide=1;q.ct=ct;q.cnt=cnt;q.text='Ciphertext: '+ct;q.opts=mo(top,Object.keys(cnt).filter(c=>c!==top));q.ans=top;q.why=top+' appears '+cnt[top]+' times — it probably stands for E. (Shift '+k+': '+s+')';q.fq=1;q.text2='Which cipher letter most likely stands for E?';return q}
 if(m==='which'){const w=fromList(WORDS,q),t=pick(['c','a','k']);let ct,ans;const k=ri(1,5),kk=pick(KW);if(t==='c'){ct=sh(w,k);ans='Caesar shift '+k}else if(t==='a'){ct=atb(w);ans='Atbash'}else{ct=kenc(w,kk);ans='Keyword '+kk}
  if(ct===w)return makeQ();const others=['Caesar shift '+(k%5+1),'Caesar shift '+((k+1)%5+1),'Atbash','Keyword '+pick(KW.filter(x=>x!==kk))].filter(o=>{const f=o==='Atbash'?atb(w):o.startsWith('Caesar')?sh(w,+o.split(' ')[2]):kenc(w,o.split(' ')[1]);return f!==ct&&o!==ans});
  q.big=w+'\n→ '+ct;q.big=w+'  →  '+ct;q.bigSz=20;q.text='Which cipher turned '+w+' into '+ct+'?';q.opts=shuffle([ans,...shuffle(others).slice(0,3)]);q.ans=ans;q.why='That was '+ans+'.';return q}
 quizQ(q,fromList(L.k||pick([Q_INTRO,Q_FREQ]),q));return q}

 if(q.tab){const y=H-118,cw=(W-40)/26;card(14,y-8,W-28,60,'#0006');for(let i=0;i<26;i++){txt(AB[i],20+cw*(i+.5),y+8,13,'#fff');txt(q.tab[i],20+cw*(i+.5),y+32,13,'#ffcf5a')}}
 if(q.fq){const ks=Object.keys(q.cnt).sort(),mx=Math.max(...Object.values(q.cnt)),bw=(W-40)/ks.length,y0=H-28,hh=H-262;cx.fillStyle='#0005';cx.fillRect(14,y0-hh-24,W-28,hh+44);ks.forEach((c,i)=>{const h=q.cnt[c]/mx*hh;cx.fillStyle='#9a6ae0';cx.fillRect(20+i*bw+2,y0-h,bw-4,h);txt(c,20+i*bw+bw/2,y0+10,11,'#fff');txt(String(q.cnt[c]),20+i*bw+bw/2,y0-h-8,9,'#ccc')});txt(q.text2,W/2,y0-hh-14,13,'#ffcf5a')}
 if(q.key){const px=W*.4+24,pw=W-px-14,s=Math.min(pw/12.6,26);pigKey(px+s*.6,H-58-s*2.4,s)}};
