function column(t,x,y,s){const w=s*.22,h=s*.8,top=y-h/2,c='#efe7d6',sh='#c9bea6';cx.fillStyle=c;cx.fillRect(x-w/2,top+s*.1,w,h-s*.16);cx.strokeStyle=sh;cx.lineWidth=1.5;for(let i=1;i<6;i++){const fx=x-w/2+i*w/6;cx.beginPath();cx.moveTo(fx,top+s*.1);cx.lineTo(fx,top+h-s*.06);cx.stroke()}
 cx.fillStyle=c;if(t==='Doric'){cx.fillRect(x-w*.75,top,w*1.5,s*.04);cx.beginPath();cx.ellipse(x,top+s*.07,w*.68,s*.035,0,0,7);cx.fill()}
 else if(t==='Ionic'){cx.fillRect(x-w*.75,top,w*1.5,s*.05);[-1,1].forEach(d=>{cx.beginPath();cx.arc(x+d*w*.6,top+s*.08,s*.045,0,7);cx.fill();cx.strokeStyle=sh;cx.beginPath();cx.arc(x+d*w*.6,top+s*.08,s*.025,0,7);cx.stroke()});cx.fillRect(x-w*.7,top+h-s*.06,w*1.4,s*.05)}
 else{cx.fillRect(x-w*.8,top,w*1.6,s*.04);for(let r=0;r<2;r++)for(let i=-2;i<=2;i++){cx.fillStyle=r?'#d9cfb5':'#e8dfc8';cx.beginPath();cx.ellipse(x+i*w*.28,top+s*.1-r*s*.04,w*.14,s*.05,0,0,7);cx.fill()}cx.fillStyle=c;cx.fillRect(x-w*.7,top+h-s*.06,w*1.4,s*.05)}
 cx.fillStyle='#d8cfb8';cx.fillRect(x-w*.9,top+h-s*.01,w*1.8,s*.04)}
const LV=[
{name:'Alpha to Omega',m:'abc'},
{name:'Gods of Olympus',m:'gods'},
{name:'Athens or Sparta?',m:'as'},
{name:'The first Olympics',m:'quiz',k:Q_OLY},
{name:'Greek letter sounds',m:'abc2'},
{name:'Column detective',m:'col'},
{name:'Birth of democracy',m:'quiz',k:Q_DEM},
{name:'Myths & heroes',m:'quiz',k:Q_MYTH},
{name:'Build a Greek temple',m:'order',list:TEMPLE},
{name:'Greek timeline',m:'tl',reps:3},
{name:'Greek words we still use',m:'quiz',k:Q_WORD},
{name:'Gods & their symbols',m:'sym'},
{name:'Thinkers & inventors',m:'quiz',k:Q_THINK},
{name:'Greece master',m:'mix'}];
const TIPS={0:'The Greek alphabet has 24 letters. Our word "alphabet" comes from its first two: alpha and beta!',2:'Athens and Sparta were rival city-states (poleis). Athens loved debate and the arts; Sparta was famous for its army.',5:'There are three main styles (orders) of Greek column: Doric, Ionic and Corinthian. Look at the top — the capital!',9:'BC years count DOWN towards year 1, so 776 BC is older than 480 BC.'};
function makeQ(){const L=LV[cur];let m=L.m;if(m==='mix')m=pick(['abc','gods','as','quiz','col','sym','abc2']);const q={m,used:(Q&&Q.used)||[]};
 if(m==='abc'){const l=fromList(GK,q);q.icon=null;q.vis=(x,y)=>{card(x-80,y-90,160,170,'#fdf6e3');txt(l[0]+' '+l[1],x,y-10,64,'#1f3b63')};q.text='What is this Greek letter called?';q.opts=mo(l[2],GK.map(g=>g[2]));q.ans=l[2];q.why=l[0]+' '+l[1]+' is '+l[2]+', sounding like "'+l[3]+'".'}
 else if(m==='abc2'){const l=fromList(GK,q);q.vis=(x,y)=>{card(x-80,y-90,160,170,'#fdf6e3');txt(l[1],x,y-10,72,'#1f3b63')};q.text='Which sound does this lowercase letter make?';q.opts=mo(l[3],GK.map(g=>g[3]));q.ans=l[3];q.why=l[1]+' ('+l[2]+') = '+l[3]+'.'}
 else if(m==='gods'){const g=fromList(GODS,q);q.big=g[1];q.text='Which Olympian god or goddess is this?';q.opts=mo(g[0],GODS.map(x=>x[0]));q.ans=g[0];q.why=g[0]+': '+g[1]+'. Symbol: '+g[2]+'.'}
 else if(m==='sym'){const g=fromList(GODS,q);q.icon=g[2].split(' ')[0];q.text='Whose symbol is the '+g[2].split(' ').slice(1).join(' ')+'?';q.opts=mo(g[0],GODS.map(x=>x[0]));q.ans=g[0];q.why=g[0]+' — '+g[1]+'.'}
 else if(m==='as'){const f=fromList(AS,q);q.big=f[0];q.text='Athens or Sparta?';q.opts=['Athens','Sparta'];q.ans=f[1];q.why=''}
 else if(m==='col'){const c=pick(COLS);q.vis=(x,y,s)=>column(c[0],x,y,Math.min(s,H-40));q.text='Which style of column is this?';q.opts=COLS.map(x=>x[0]);q.ans=c[0];q.why=c[0]+': '+c[1]+'. The Parthenon uses Doric columns.'}
 else if(m==='order'){orderQ(q,L.list);q.done='Temples like the Parthenon were built of marble and brightly painted!'}
 else if(m==='tl')tlQ(q,TL,yr);
 else quizQ(q,fromList(L.k||pick([Q_OLY,Q_DEM,Q_MYTH,Q_WORD,Q_THINK]),q));
 return q}
window.G={get Q(){return Q},LV};
resize();cur=0;Q=makeQ();draw();showLevels();


</script></body></html>
