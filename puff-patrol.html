<script>
(()=>{'use strict';
const cv=document.getElementById('c'),cx=cv.getContext('2d');const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1;function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR|0;cv.height=H*DPR|0}addEventListener('resize',resize);resize();
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
// ---------------- audio ----------------

function tone(f,d,type,v,f2,delay){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}

let lastHit=0;
const SFX={stretch:()=>tone(200,.25,'triangle',.06,420),launch:()=>{noise(.25,.25,1500,'bandpass');tone(500,.3,'sine',.08,900)},
 wood:v=>{noise(.12,.12*v,700);tone(180,.08,'triangle',.08*v,120)},stone:v=>{noise(.15,.15*v,350);tone(90,.12,'sine',.12*v,60)},glass:v=>{noise(.18,.1*v,4000,'highpass');tone(1800+Math.random()*800,.15,'sine',.05*v)},
 break:m=>{if(m==='glass'){noise(.4,.22,5000,'highpass');[2200,2900,3400].forEach((f,i)=>tone(f,.2,'sine',.05,0,i*.03))}else if(m==='stone'){noise(.45,.3,300)}else{noise(.35,.28,900);tone(140,.15,'square',.05,70)}},
 pop:()=>{tone(700,.12,'square',.08,200);noise(.2,.15,1200)},boom:()=>{noise(.8,.5,250);tone(80,.6,'sine',.3,30)},ability:()=>tone(900,.15,'sawtooth',.06,1600),
 win:()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,.35,'triangle',.12,0,i*.12)),lose:()=>[400,330,260,200].forEach((f,i)=>tone(f,.35,'triangle',.1,0,i*.18)),star:i=>tone(880+i*220,.3,'triangle',.12),click:()=>tone(650,.05,'square',.05)};
// ---------------- physics engine ----------------
const G=700,GY=800,clamp=(v,a,b)=>v<a?a:v>b?b:v;
const MAT={wood:{d:.7,hp:70,mu:.6,e:.08,score:500},stone:{d:2.1,hp:210,mu:.8,e:.04,score:800},glass:{d:.55,hp:24,mu:.35,e:.1,score:300},enemy:{d:.6,hp:20,mu:.6,e:.2,score:5000},bird:{d:3,hp:1e9,mu:.5,e:.3},rock:{d:0,hp:1e9,mu:.9,e:.05},ground:{d:0,hp:1e9,mu:.95,e:.1}};
let bodies=[],cache=new Map(),nid=1,damageOn=false;
function mk(shape,x,y,p,mat,stat){const b={id:nid++,shape,x,y,a:0,vx:0,vy:0,w:0,mat,stat:!!stat,sleep:false,st:0,dead:false,flash:0};
 if(shape==='box'){b.hw=p[0]/2;b.hh=p[1]/2;b.r=Math.hypot(b.hw,b.hh)}else b.r=p;
 const M=MAT[mat],area=shape==='box'?p[0]*p[1]:Math.PI*p*p;b.m=stat?0:area*M.d/1000;b.im=stat?0:1/b.m;
 const I=shape==='box'?b.m*(p[0]*p[0]+p[1]*p[1])/12:b.m*p*p/2;b.ii=stat?0:1/I;b.hp=b.maxhp=M.hp*(shape==='box'?Math.max(.6,Math.sqrt(area/1800)):1);b.mu=M.mu;b.e=M.e;b.seed=Math.random();bodies.push(b);return b}
function polyV(b){const c=Math.cos(b.a),s=Math.sin(b.a),v=[],n=[];for(const[x,y]of[[-b.hw,-b.hh],[b.hw,-b.hh],[b.hw,b.hh],[-b.hw,b.hh]])v.push({x:b.x+x*c-y*s,y:b.y+x*s+y*c});for(const[x,y]of[[0,-1],[1,0],[0,1],[-1,0]])n.push({x:x*c-y*s,y:x*s+y*c});return{v,n}}
function maxSep(A,B){let best=-Infinity,bi=0;for(let i=0;i<4;i++){const n=A.n[i],v=A.v[i];let mn=Infinity;for(const p of B.v){const d=n.x*(p.x-v.x)+n.y*(p.y-v.y);if(d<mn)mn=d}if(mn>best){best=mn;bi=i}}return[best,bi]}
function clip(p,nx,ny,off){const o=[];const d0=nx*p[0].x+ny*p[0].y-off,d1=nx*p[1].x+ny*p[1].y-off;if(d0<=0)o.push(p[0]);if(d1<=0)o.push(p[1]);if(d0*d1<0){const t=d0/(d0-d1);o.push({x:p[0].x+(p[1].x-p[0].x)*t,y:p[0].y+(p[1].y-p[0].y)*t})}return o}
function boxBox(a,b){const A=polyV(a),B=polyV(b);const[sa,ia]=maxSep(A,B);if(sa>.5)return null;const[sb,ib]=maxSep(B,A);if(sb>.5)return null;
 let R,I,ri,flip;if(sb>sa+.3){R=B;I=A;ri=ib;flip=true}else{R=A;I=B;ri=ia;flip=false}
 const n=R.n[ri];let ie=0,mn=Infinity;for(let i=0;i<4;i++){const d=n.x*I.n[i].x+n.y*I.n[i].y;if(d<mn){mn=d;ie=i}}
 let pts=[I.v[ie],I.v[(ie+1)%4]];const v1=R.v[ri],v2=R.v[(ri+1)%4];let tx=v2.x-v1.x,ty=v2.y-v1.y;const tl=Math.hypot(tx,ty);tx/=tl;ty/=tl;
 pts=clip(pts,-tx,-ty,-(tx*v1.x+ty*v1.y));if(pts.length<2)return null;pts=clip(pts,tx,ty,tx*v2.x+ty*v2.y);if(pts.length<2)return null;
 const out=[];for(let k=0;k<2;k++){const p=pts[k],s=n.x*(p.x-v1.x)+n.y*(p.y-v1.y);if(s<=.5)out.push({x:p.x,y:p.y,d:-s,id:(flip?1:0)+ri*2+ie*8+k*32})}
 return out.length?{nx:flip?-n.x:n.x,ny:flip?-n.y:n.y,pts:out}:null}
function circBox(cc,b){const c=Math.cos(b.a),s=Math.sin(b.a),dx=cc.x-b.x,dy=cc.y-b.y,lx=dx*c+dy*s,ly=-dx*s+dy*c;const qx=clamp(lx,-b.hw,b.hw),qy=clamp(ly,-b.hh,b.hh);let nx,ny,d;
 if(qx===lx&&qy===ly){const px=b.hw-Math.abs(lx),py=b.hh-Math.abs(ly);if(px<py){nx=lx<0?-1:1;ny=0;d=px+cc.r}else{nx=0;ny=ly<0?-1:1;d=py+cc.r}}
 else{const ex=lx-qx,ey=ly-qy,dist=Math.hypot(ex,ey);if(dist>cc.r+.5)return null;nx=ex/dist;ny=ey/dist;d=cc.r-dist}
 const wx=nx*c-ny*s,wy=nx*s+ny*c;return{nx:wx,ny:wy,pts:[{x:cc.x-wx*cc.r,y:cc.y-wy*cc.r,d,id:0}]}}
function collide(a,b){if(a.shape==='box'&&b.shape==='box')return boxBox(a,b);
 if(a.shape==='box'){return circBox(b,a)}
 if(b.shape==='box'){const m=circBox(a,b);if(m){m.nx=-m.nx;m.ny=-m.ny}return m}
 const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>a.r+b.r+.5||d===0)return null;const nx=dx/d,ny=dy/d;return{nx,ny,pts:[{x:a.x+nx*a.r,y:a.y+ny*a.r,d:a.r+b.r-d,id:0}]}}
function wake(b){if(b.sleep){b.sleep=false;b.st=0}}
function speed(b){return Math.hypot(b.vx,b.vy)+Math.abs(b.w)*b.r}
let impacts=[];
function step(dt){impacts.length=0;
 for(const b of bodies)if(!b.stat&&!b.sleep){b.vy+=G*dt;b.vx*=.9995;b.vy*=.9995;b.w*=.998;if(b.shape==='circle'){b.w*=.993;b.vx*=.998}}
 const cs=[];
 for(let i=0;i<bodies.length;i++){const a=bodies[i];if(a.dead)continue;for(let j=i+1;j<bodies.length;j++){const b=bodies[j];if(b.dead)continue;
  const sa=a.stat||a.sleep,sb=b.stat||b.sleep;if(sa&&sb)continue;if(Math.abs(a.x-b.x)>a.r+b.r+2||Math.abs(a.y-b.y)>a.r+b.r+2)continue;
  const m=collide(a,b);if(!m)continue;if(a.sleep&&speed(b)>14)wake(a);if(b.sleep&&speed(a)>14)wake(b);m.a=a;m.b=b;cs.push(m)}}
 const nc=new Map();
 for(const m of cs){const a=m.a,b=m.b;m.ima=a.sleep?0:a.im;m.imb=b.sleep?0:b.im;m.iia=a.sleep?0:a.ii;m.iib=b.sleep?0:b.ii;m.mu=Math.sqrt(a.mu*b.mu);const e=Math.max(a.e,b.e);m.maxvn=0;const nx=m.nx,ny=m.ny,tx=-ny,ty=nx;
  for(const p of m.pts){p.rax=p.x-a.x;p.ray=p.y-a.y;p.rbx=p.x-b.x;p.rby=p.y-b.y;
   const rna=p.rax*ny-p.ray*nx,rnb=p.rbx*ny-p.rby*nx;p.nm=1/(m.ima+m.imb+m.iia*rna*rna+m.iib*rnb*rnb||1e9);
   const rta=p.rax*ty-p.ray*tx,rtb=p.rbx*ty-p.rby*tx;p.tm=1/(m.ima+m.imb+m.iia*rta*rta+m.iib*rtb*rtb||1e9);
   const rvx=(b.vx-b.w*p.rby)-(a.vx-a.w*p.ray),rvy=(b.vy+b.w*p.rbx)-(a.vy+a.w*p.rax),vn=rvx*nx+rvy*ny;if(-vn>m.maxvn)m.maxvn=-vn;
   p.bias=Math.min(240,.22/dt*Math.max(0,p.d-.4));if(vn<-90)p.bias=Math.max(p.bias,-e*vn);
   p.key=a.id*65536+b.id*64+p.id;const old=cache.get(p.key);p.jn=old?old[0]*.85:0;p.jt=old?old[1]*.85:0;
   if(p.jn||p.jt)imp(m,p,nx*p.jn+tx*p.jt,ny*p.jn+ty*p.jt)}}
 for(let it=0;it<10;it++)for(const m of cs){const a=m.a,b=m.b,nx=m.nx,ny=m.ny,tx=-ny,ty=nx;for(const p of m.pts){
  let rvx=(b.vx-b.w*p.rby)-(a.vx-a.w*p.ray),rvy=(b.vy+b.w*p.rbx)-(a.vy+a.w*p.rax);
  let dj=-(rvx*tx+rvy*ty)*p.tm;const mf=m.mu*p.jn;let nj=clamp(p.jt+dj,-mf,mf);dj=nj-p.jt;p.jt=nj;imp(m,p,tx*dj,ty*dj);

  dj=(-(rvx*nx+rvy*ny)+p.bias)*p.nm;nj=Math.max(0,p.jn+dj);dj=nj-p.jn;p.jn=nj;imp(m,p,nx*dj,ny*dj)}}
 for(const m of cs)for(const p of m.pts)nc.set(p.key,[p.jn,p.jt]);cache=nc;
 for(const b of bodies){if(b.stat||b.sleep||b.dead)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.w*dt;
  if(b.vx*b.vx+b.vy*b.vy<50&&Math.abs(b.w)<.12){b.st+=dt;if(b.st>.7&&!b.bird){b.sleep=true;b.vx=b.vy=b.w=0}}else b.st=0;
  if(b.y>GY+600||b.x<-900||b.x>WW+1200)b.dead=true,b.fell=true}

  impacts.push({x:m.pts[0].x,y:m.pts[0].y,v:m.maxvn,mat:(a.stat?b:a).mat,mat2:b.mat,bird:a.bird||b.bird})}}
function imp(m,p,Px,Py){const a=m.a,b=m.b;a.vx-=Px*m.ima;a.vy-=Py*m.ima;a.w-=m.iia*(p.rax*Py-p.ray*Px);b.vx+=Px*m.imb;b.vy+=Py*m.imb;b.w+=m.iib*(p.rbx*Py-p.rby*Px)}
// ---------------- levels ----------------
let WW=1800;
function box(x,yb,w,h,mat){mk('box',x,yb-h/2,[w,h],mat);return yb-h}
function post(x,yb,h,mat){return box(x,yb,20,h,mat)}
function plank(x,yb,w,mat){return box(x,yb,w,20,mat)}
function hut(x,yb,w,mat,h){h=h||90;post(x-w/2+10,yb,h,mat);post(x+w/2-10,yb,h,mat);if(w>170)post(x,yb,h,mat);return plank(x,yb-h,w,mat)}
function E(x,yb,r,helm){r=r||18;const b=mk('circle',x,yb-r,r,'enemy');b.enemy=1;b.helm=!!helm;b.hp=b.maxhp=helm?48:20;if(r>24)b.hp=b.maxhp=b.hp*1.6;return b}

function wall(x,yb,n,mat){let y=yb;for(let i=0;i<n;i++)y=box(x,y,36,70,mat);return y}
const LV=[
