<script>
"use strict";
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
// ---------- audio ----------
const SFX=(()=>{let ctx=null,muted=store.get('pr_mute',false),wind=null,windG=null;
function ac(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==='suspended'){const p=ctx.resume();if(p&&p.catch)p.catch(()=>{})}return ctx}
function tone(f,d,type='sine',v=.2,slide=0,delay=0){const c=ac();if(!c||muted)return;const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v=.2,f=800,type='lowpass',delay=0){const c=ac();if(!c||muted)return;const t=c.currentTime+delay,b=c.createBuffer(1,Math.max(1,c.sampleRate*d|0),c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=c.createGain();g.gain.value=v;s.connect(fl).connect(g).connect(c.destination);s.start(t)}
function startWind(){const c=ac();if(!c||wind)return;const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;wind=c.createBufferSource();wind.buffer=b;wind.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=600;windG=c.createGain();windG.gain.value=0;wind.connect(f).connect(windG).connect(c.destination);wind.start()}
const P={jump(){noise(.15,.25,2000,'highpass');tone(300,.12,'triangle',.1,200)},land(){noise(.2,.35,500)},clean(){[660,880,1100].forEach((f,i)=>tone(f,.15,'triangle',.12,0,i*.06))},
crash(){noise(.6,.5,400);tone(200,.5,'sawtooth',.15,-150)},coin(){tone(1300,.06,'square',.06);tone(1750,.12,'square',.06,0,.06)},boost(){tone(200,.5,'sawtooth',.1,600);noise(.5,.2,1500,'highpass')},
grind(){tone(1800+Math.random()*300,.05,'sawtooth',.03)},trick(){tone(500,.08,'sine',.08,300)},click(){tone(800,.05,'square',.06)},over(){[500,400,300,200].forEach((f,i)=>tone(f,.35,'triangle',.12,0,i*.18))},rumble(){noise(.4,.15,150)},unlock(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.12,0,i*.08))}};
return{play(n){try{P[n]()}catch(e){}},toggle(){muted=!muted;store.set('pr_mute',muted);if(windG)windG.gain.value=0;return muted},get muted(){return muted},unlock(){ac();try{startWind()}catch(e){}},wind(v){if(windG&&ctx)windG.gain.setTargetAtTime(muted?0:v,ctx.currentTime,.1)}}})();
const $=id=>document.getElementById(id);
$('mute').textContent=SFX.muted?'🔇':'🔊';$('mute').onclick=()=>{$('mute').textContent=SFX.toggle()?'🔇':'🔊'};
// ---------- boards ----------
const BOARDS=[
{id:'rookie',n:'Rookie',price:0,c1:'#3a8ad8',c2:'#8cf',spd:1,rot:1,grip:1,d:'Balanced starter'},
{id:'flame',n:'Flame',price:60,c1:'#ff5a2a',c2:'#ffd23a',spd:1.08,rot:1,grip:1,d:'+Speed'},
{id:'spinner',n:'Cyclone',price:120,c1:'#2ad89a',c2:'#d8ff6a',spd:1,rot:1.3,grip:1.05,d:'+Rotation'},
{id:'shadow',n:'Shadow',price:220,c1:'#222',c2:'#a03aff',spd:1.12,rot:1.15,grip:1.15,d:'Fast & forgiving'},
{id:'gold',n:'Golden Yeti',price:400,c1:'#b8860b',c2:'#fff0a0',spd:1.18,rot:1.35,grip:1.3,d:'Legendary'}];
let save=store.get('pr_save',{coins:0,owned:['rookie'],board:'rookie',best:{ride:0,avalanche:0},runs:0,tricks:0});
const saveGame=()=>store.set('pr_save',save);
const board=()=>BOARDS.find(b=>b.id===save.board)||BOARDS[0];
// ---------- canvas ----------
const cv=$('cv'),ctx=cv.getContext('2d');let W,H,DPR,SCALE;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;SCALE=Math.max(.55,Math.min(1.1,Math.min(W/900,H/600)+.15));}
addEventListener('resize',resize);resize();
// ---------- terrain ----------
const DX=8;let pts,feat,objs,rails,genX,gs;
function rnd(){return Math.random()}
function resetWorld(){pts=[0];genX=0;objs=[];rails=[];gs={queue:[],ph:0};for(let i=0;i<60;i++)pushDy(.42);while(pts.length<400)genChunk()}
function pushDy(dy){pts.push(pts[pts.length-1]+dy*DX)}
function idx(x){return Math.max(0,Math.floor(x/DX))}
function ensure(x){while(pts.length*DX<x+3000)genChunk()}
function groundY(x){const i=idx(x),f=x/DX-i;const a=pts[i]??pts[pts.length-1],b=pts[i+1]??a;return a+(b-a)*f}
function slopeAt(x){const i=idx(x);const a=pts[i]??0,b=pts[i+1]??a;return Math.atan2(b-a,DX)}
function genChunk(){const startI=pts.length;const r=rnd();const dist=startI*DX;const diff=Math.min(1,dist/40000);
 if(r<.28){// kicker
  const n=ri(16,26),h=.55+rnd()*.35+diff*.2;for(let i=0;i<10;i++)pushDy(.45);for(let i=0;i<n;i++)pushDy(.4-(h+.4)*Math.sin(i/n*Math.PI/2));const lip=pts.length*DX;for(let i=0;i<14;i++)pushDy(1.45);for(let i=0;i<20;i++)pushDy(.9-i*.02);
  addCoinArc(lip,groundY(lip)-60,n);
 }else if(r<.45){// rail
  for(let i=0;i<8;i++)pushDy(.42);const x0=pts.length*DX,n=ri(28,46);for(let i=0;i<n;i++)pushDy(.32);const x1=pts.length*DX;const hh=34;rails.push({x0,x1,y0:groundY(x0)-hh,y1:groundY(x1)-hh});for(let i=0;i<10;i++)pushDy(.4);
  for(let k=1;k<5;k++){const cx=x0+(x1-x0)*k/5;objs.push({t:'coin',x:cx,y:groundY(cx)-hh-26})}
 }else if(r<.55){// cliff drop
  for(let i=0;i<14;i++)pushDy(.3);for(let i=0;i<10;i++)pushDy(2.6);for(let i=0;i<20;i++)pushDy(.75-i*.015);
 }else{// cruising with obstacles
  const n=ri(40,80);const w=rnd()*6;for(let i=0;i<n;i++)pushDy(.42+.22*Math.sin(i/9+w)+diff*.12);
  const k=ri(1,3);for(let j=0;j<k;j++){const ox=(startI+ri(8,n-6))*DX;const t=rnd()<.6?'tree':'rock';if(!objs.some(o=>Math.abs(o.x-ox)<120))objs.push({t,x:ox,h:t==='tree'?ri(55,90):ri(18,28),w:t==='tree'?14:22})}
  if(rnd()<.35){const bx=(startI+ri(4,n-4))*DX;if(!objs.some(o=>Math.abs(o.x-bx)<120))objs.push({t:'boost',x:bx})}
  if(rnd()<.6){const cx=(startI+ri(4,n-12))*DX;for(let j=0;j<5;j++){const x=cx+j*30;if(!objs.some(o=>o.t!=='coin'&&Math.abs(o.x-x)<40))objs.push({t:'coin',x,y:groundY(x)-24})}}
 }}
function addCoinArc(x,y,n){for(let j=0;j<6;j++){const t=j/5;objs.push({t:'coin',x:x+40+t*260,y:y-70*Math.sin(t*Math.PI)-20+t*90})}}
function ri(a,b){return a+Math.floor(rnd()*(b-a+1))}
// ---------- game state ----------
let S=null,mode='ride',state='title',keys={},touch={};
const GRAV=1300;
function newGame(m){mode=m;resetWorld();const b=board();
 S={x:200,y:0,vx:0,vy:0,s:320,ang:0,spin:0,ground:true,rail:null,airT:0,rot:0,spinTot:0,grabT:0,crashT:0,score:0,coins:0,lives:3,combo:0,comboPts:0,comboT:0,mult:1,boost:.3,boosting:0,t:0,tricks:[],av:-500,avSpeed:330,dist:0,parts:[],shake:0,best:0,events:{landed:0,crashed:0,coins:0,grinds:0},msgT:0,b};
 S.y=groundY(S.x);state='play';$('title').classList.add('hide');$('over').classList.add('hide');$('hud').style.display='block';$('pauseBtn').style.display='block';
 $('hLives').textContent=mode==='ride'?'❤️'.repeat(S.lives):'🏔️ AVALANCHE';
 if(isTouch())$('touch').style.display='flex';save.runs++;saveGame();showTrick(mode==='ride'?'Shred it!':'RUN! The avalanche is coming!',1.6)}
function isTouch(){return 'ontouchstart' in window||navigator.maxTouchPoints>0}
let trickT=0;function showTrick(t,d=1.4){$('trick').innerHTML=t;trickT=d}
const norm=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
function input(){return{L:keys.ArrowLeft||keys.KeyA||touch.L,R:keys.ArrowRight||keys.KeyD||touch.R,J:keys.ArrowUp||keys.KeyW||keys.Space||touch.J,G:keys.ArrowDown||keys.KeyS||touch.G,SP:keys.KeyZ||keys.KeyX||keys.KeyQ||keys.KeyE||touch.S,B:keys.ShiftLeft||keys.ShiftRight||keys.KeyB||touch.B}}
let jumpHeld=false,spinDir=1;
function update(dt){const p=S,b=p.b,inp=input();p.t+=dt;ensure(p.x);
 if(trickT>0){trickT-=dt;if(trickT<=0)$('trick').innerHTML=''}
 // avalanche
 if(mode==='avalanche'){p.avSpeed=330+p.t*7;p.av+=p.avSpeed*dt;p.av=Math.max(p.av,p.x-1500);if(p.x-p.av<420&&Math.random()<dt*3)SFX.play('rumble');if(p.av>=p.x-10&&state==='play'){gameOver('The avalanche swallowed you!');return}}
 if(p.crashT>0){p.crashT-=dt;p.vy+=GRAV*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const gy=groundY(p.x);if(p.y>gy){p.y=gy;p.vy*=-.3;p.vx*=.9}p.ang+=dt*8*(p.vx>0?1:-1)*Math.min(1,Math.abs(p.vx)/200);
  if(p.crashT<=0){if(mode==='ride'&&p.lives<=0){gameOver('Out of lives!');return}p.ground=true;p.ang=slopeAt(p.x);p.spin=0;p.s=300;p.y=groundY(p.x);p.rail=null;p.grabT=0}return}
 // boost
 if(inp.B&&p.boost>=.25&&p.boosting<=0){p.boosting=1.4;p.boost-=.25;SFX.play('boost')}
 if(p.boosting>0)p.boosting-=dt;
 const maxS=(600+(p.boosting>0?220:0))*b.spd;
 if(p.rail){const r=p.rail;const ang=Math.atan2(r.y1-r.y0,r.x1-r.x0);p.s=Math.min(maxS,p.s+GRAV*Math.sin(ang)*dt*.6);p.x+=p.s*Math.cos(ang)*dt;p.y=r.y0+(r.y1-r.y0)*(p.x-r.x0)/(r.x1-r.x0);p.ang=ang;p.comboPts+=Math.round(140*dt);p.comboT=2.2;if(Math.random()<dt*20){SFX.play('grind');spark(p.x,p.y)}
  if(inp.J&&!jumpHeld){jumpHeld=true;leaveRail(ang,1);}else if(p.x>=r.x1){leaveRail(ang,0)}}
 else if(p.ground){const th=slopeAt(p.x);let acc=GRAV*Math.sin(th)*.9-p.s*.12;if(inp.R)acc+=110;if(inp.L)acc-=260;if(p.boosting>0)acc+=600;p.s=Math.max(160,Math.min(maxS,p.s+acc*dt));
  const nx=p.x+p.s*Math.cos(th)*dt;const th2=slopeAt(nx);
  if(th2-th>.38){// lip: launch
   p.ground=false;p.vx=p.s*Math.cos(th);p.vy=p.s*Math.sin(th);startAir();p.x=nx;p.y+=p.s*Math.sin(th)*dt;}
  else{p.x=nx;p.y=groundY(p.x);p.ang+=norm(th-p.ang)*Math.min(1,dt*20)}
  if(inp.J&&!jumpHeld){jumpHeld=true;p.ground=false;p.vx=p.s*Math.cos(th)+Math.sin(th)*120;p.vy=p.s*Math.sin(th)-460;startAir();SFX.play('jump');p.y-=2}
  if(Math.random()<dt*p.s/40)p.parts.push({x:p.x-8,y:p.y,vx:-p.s*.2+Math.random()*40,vy:-Math.random()*120,l:.5,c:'#fff'});
  if(p.comboT>0){p.comboT-=dt;if(p.comboT<=0)bankCombo()}}
 else{// air
  p.airT+=dt;p.vy+=GRAV*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const rs=5.2*b.rot;let dr=0;if(inp.L)dr-=rs*dt;if(inp.R)dr+=rs*dt;p.ang+=dr;p.rot+=dr;if(!dr)p.ang+=norm(slopeAt(p.x)-p.ang)*Math.min(1,dt*3.5);
  if(inp.SP){p.spin+=spinDir*9*b.rot*dt;p.spinTot+=9*b.rot*dt}
  if(inp.G){p.grabT+=dt;p.grabbing=true}else p.grabbing=false;
  if(inp.J&&!jumpHeld)jumpHeld=true;
  // rails
  for(const r of rails){if(p.x>=r.x0&&p.x<=r.x1&&p.vy>0){const ry=r.y0+(r.y1-r.y0)*(p.x-r.x0)/(r.x1-r.x0);if(p.y>=ry&&p.y-p.vy*dt<=ry+4){const sp=norm(p.spin);const okA=Math.abs(norm(p.ang-Math.atan2(r.y1-r.y0,r.x1-r.x0)))<.8&&(Math.abs(sp)<.7||Math.abs(Math.abs(sp)-Math.PI)<.7);if(okA){awardAir(false);p.rail=r;p.s=Math.hypot(p.vx,p.vy)*.9;p.y=ry;p.spin=Math.abs(sp)<.7?0:Math.PI;p.events.grinds++;addTrick('Rail Grind',0);SFX.play('land')}else{crash('Bad rail landing!')}return}}}
  const gy=groundY(p.x);if(p.y>=gy){land(gy)}}
 // obstacles & pickups
 for(const o of objs){if(Math.abs(o.x-p.x)>60)continue;
  if(o.t==='coin'&&!o.got){if(Math.hypot(o.x-p.x,o.y-(p.y-18))<30){o.got=1;p.coins++;p.events.coins++;p.score+=10;SFX.play('coin');for(let i=0;i<6;i++)p.parts.push({x:o.x,y:o.y,vx:Math.random()*160-80,vy:Math.random()*-160,l:.5,c:'#ffd23a'})}}
  else if((o.t==='tree'||o.t==='rock')&&!o.hit&&p.crashT<=0){const gy=groundY(o.x);if(Math.abs(o.x-p.x)<o.w&&p.y>gy-o.h+4){o.hit=1;crash(o.t==='tree'?'Hit a tree!':'Hit a rock!')}}
  else if(o.t==='boost'&&p.ground&&!o.used&&Math.abs(o.x-p.x)<26){o.used=1;p.boosting=1.6;p.s=Math.min(maxS+200,p.s+200);SFX.play('boost');showTrick('⚡ SPEED BOOST',1)}}
 p.dist=Math.max(p.dist,(p.x-200)/40);
