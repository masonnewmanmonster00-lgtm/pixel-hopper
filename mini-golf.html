<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b14">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Mini Golf</title>
<style>html,body{margin:0;height:100%;overflow:hidden;touch-action:none;background:#1b3b1b;font-family:system-ui,sans-serif;color:#fff;user-select:none}canvas{display:block}
#P{position:fixed;top:12px;right:12px;width:46px;height:46px;border-radius:10px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.5);font-weight:bold;font-size:20px;display:flex;align-items:center;justify-content:center}a.back{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:80;display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(8,8,16,.82);color:#ffe14d;border:1px solid rgba(255,225,77,.55);font:700 12px/1 ui-monospace,monospace;letter-spacing:.04em;text-decoration:none;touch-action:manipulation}a.back:focus-visible{outline:2px solid #ffe14d;outline-offset:2px}</style></head><body>
<a class="back" href="./index.html" aria-label="Back to menu" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">← Menu</a>
<canvas id="c"></canvas><div id="P">II</div>
<script>
// course coords in 1000x560 units
const HOLES=[
{par:2,ball:[150,280],cup:[850,280],walls:[],sand:[],water:[],mov:[]},
{par:3,ball:[120,460],cup:[880,100],walls:[[400,0,40,380],[600,180,40,380]],sand:[],water:[],mov:[]},
{par:3,ball:[120,280],cup:[880,280],walls:[[480,120,40,320]],sand:[[650,180,150,200]],water:[],mov:[]},
{par:3,ball:[100,280],cup:[900,280],walls:[],sand:[],water:[[350,0,120,200],[350,360,120,200],[600,140,140,280]],mov:[]},
{par:3,ball:[120,280],cup:[880,280],walls:[],sand:[],water:[],mov:[{x:450,y:0,w:30,h:220,ax:'y',a:0,b:340,s:2.4},{x:650,y:340,w:30,h:220,ax:'y',a:0,b:340,s:3}]},
{par:4,ball:[100,480],cup:[900,480],walls:[[250,140,40,420],[500,0,40,420],[750,140,40,420]],sand:[[540,440,210,120]],water:[],mov:[]},
{par:3,ball:[500,500],cup:[500,80],walls:[[300,250,160,30],[540,250,160,30]],sand:[],water:[[0,0,250,560],[750,0,250,560]],mov:[{x:430,y:160,w:140,h:24,ax:'x',a:260,b:600,s:3}]},
{par:4,ball:[100,100],cup:[900,460],walls:[[200,200,600,30],[200,330,600,30]],sand:[[820,0,180,200]],water:[[0,360,180,200]],mov:[{x:400,y:230,w:30,h:100,ax:'x',a:220,b:770,s:3.5}]},
{par:4,ball:[100,280],cup:[900,280],walls:[[300,100,30,360],[670,100,30,360],[330,100,340,30],[330,430,160,30],[510,430,160,30]],sand:[],water:[[0,0,1000,60],[0,500,1000,60]],mov:[{x:480,y:200,w:40,h:160,ax:'y',a:140,b:280,s:2}]}];
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,K,ox,oy;
function rs(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0);K=Math.min((W-20)/1000,(H-70)/560);ox=(W-1000*K)/2;oy=(H-560*K)/2+22}rs();addEventListener('resize',rs);
const touch='ontouchstart'in window||navigator.maxTouchPoints>0;
let AC;function snd(f,d,t,v,f2){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);g.gain.value=v||.06;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
let state='title',paused=false,hi,h,ball,strokes,cards,drag=null,sunk=0,lastPos,parts=[],msgT=null,best=(()=>{try{return +localStorage.getItem('arcade-golf-best')||0}catch(e){return 0}})(),kAim={a:0,p:0};
const BR=9,CR=15;
function load(i){hi=i;h=JSON.parse(JSON.stringify(HOLES[i]));ball={x:h.ball[0],y:h.ball[1],vx:0,vy:0,s:1};lastPos=[ball.x,ball.y];strokes=0;sunk=0;drag=null}
function start(){cards=[];load(0);state='play';paused=false}
const toW=(px,py)=>[(px-ox)/K,(py-oy)/K];
function moving(){return Math.hypot(ball.vx,ball.vy)>.05}
function shoot(dx,dy){const p=Math.min(1,Math.hypot(dx,dy)/220);if(p<.03)return;const a=Math.atan2(dy,dx);ball.vx=-Math.cos(a)*p*26;ball.vy=-Math.sin(a)*p*26;strokes++;lastPos=[ball.x,ball.y];snd(200+p*300,.08,'triangle',.08)}
function down(px,py){if(state=='title'||state=='end'){start();return}if(state=='card'){next();return}if(paused||moving()||sunk)return;drag={sx:px,sy:py,cx:px,cy:py}}
function mv(px,py){if(drag){drag.cx=px;drag.cy=py}}
function up(){if(drag){shoot((drag.cx-drag.sx)/K,(drag.cy-drag.sy)/K);drag=null}}
c.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];down(t.clientX,t.clientY)},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];mv(t.clientX,t.clientY)},{passive:false});c.addEventListener('touchend',e=>{e.preventDefault();up()},{passive:false});
c.addEventListener('mousedown',e=>down(e.clientX,e.clientY));addEventListener('mousemove',e=>mv(e.clientX,e.clientY));addEventListener('mouseup',up);
const kk={};addEventListener('keydown',e=>{kk[e.key]=1;if(e.key=='p'||e.key=='Escape'){if(e.repeat)return;tp();return}if(e.key=='Enter'){if(state=='title'||state=='end')start();else if(state=='card')next()}
if(e.key==' '&&state=='play'&&!moving()&&!sunk&&!paused){e.preventDefault();if(kAim.p>.03){shoot(-Math.cos(kAim.a)*kAim.p*220,-Math.sin(kAim.a)*kAim.p*220);kAim.p=0}}});addEventListener('keyup',e=>kk[e.key]=0);
function tp(e){e&&e.preventDefault&&e.preventDefault();if(state=='play')paused=!paused}const P=document.getElementById('P');P.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();tp(e)});
function next(){if(hi+1<HOLES.length){load(hi+1);state='play'}else{const tot=cards.reduce((a,b)=>a+b,0);if(!best||tot<best){best=tot;try{localStorage.setItem('arcade-golf-best',best)}catch(e){}}state='end'}}
function inR(px,py,r,m){return px>r[0]-m&&px<r[0]+r[2]+m&&py>r[1]-m&&py<r[1]+r[3]+m}
function collide(r){const cx=Math.max(r[0],Math.min(ball.x,r[0]+r[2])),cy=Math.max(r[1],Math.min(ball.y,r[1]+r[3]));const dx=ball.x-cx,dy=ball.y-cy,d=Math.hypot(dx,dy);
if(d<BR&&d>0){const nx=dx/d,ny=dy/d;ball.x=cx+nx*BR;ball.y=cy+ny*BR;const dot=ball.vx*nx+ball.vy*ny;if(dot<0){ball.vx-=2*dot*nx*.85;ball.vy-=2*dot*ny*.85;ball.vx*=.92;ball.vy*=.92;snd(300,.04,'square',.03)}return 1}
if(d==0){ball.vx*=-.8;ball.vy*=-.8}return 0}
const names=['Easy Start','The Zigzag','Sand Trap','Island Hop','Gatekeepers','Switchback','The Bridge','Sliding Doors','The Fortress'];
function word(s,p){const d=s-p;if(s==1)return'HOLE IN ONE!';return d<=-2?'EAGLE!':d==-1?'BIRDIE!':d==0?'PAR':d==1?'BOGEY':d==2?'DOUBLE BOGEY':'+'+d}
let last=performance.now(),tt=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(2,(now-last)/16.7);last=now;tt+=dt;
if(state=='play'&&!paused){
for(const m of h.mov){if(m.ax=='y'){m.y+=m.s*dt;if(m.y<m.a||m.y>m.b){m.s*=-1;m.y=Math.max(m.a,Math.min(m.b,m.y))}}else{m.x+=m.s*dt;if(m.x<m.a||m.x>m.b){m.s*=-1;m.x=Math.max(m.a,Math.min(m.b,m.x))}}}
if(kk.ArrowLeft)kAim.a-=.04*dt;if(kk.ArrowRight)kAim.a+=.04*dt;if(kk.ArrowUp)kAim.p=Math.min(1,kAim.p+.015*dt);if(kk.ArrowDown)kAim.p=Math.max(0,kAim.p-.015*dt);
if(!sunk){const steps=6;for(let s=0;s<steps;s++){ball.x+=ball.vx*dt/steps;ball.y+=ball.vy*dt/steps;
if(ball.x<BR){ball.x=BR;ball.vx=Math.abs(ball.vx)*.85;snd(300,.04,'square',.03)}if(ball.x>1000-BR){ball.x=1000-BR;ball.vx=-Math.abs(ball.vx)*.85;snd(300,.04,'square',.03)}if(ball.y<BR){ball.y=BR;ball.vy=Math.abs(ball.vy)*.85}if(ball.y>560-BR){ball.y=560-BR;ball.vy=-Math.abs(ball.vy)*.85}
h.walls.forEach(collide);h.mov.forEach(m=>{if(collide([m.x,m.y,m.w,m.h])){const push=m.s*1.2;if(m.ax=='y')ball.vy+=push*.3;else ball.vx+=push*.3}})}
const sand=h.sand.some(r=>inR(ball.x,ball.y,r,0));const f=sand?.93:.985;ball.vx*=Math.pow(f,dt);ball.vy*=Math.pow(f,dt);const sp=Math.hypot(ball.vx,ball.vy);if(sp<.08){ball.vx=ball.vy=0}
if(h.water.some(r=>inR(ball.x,ball.y,r,-3))){strokes++;for(let i=0;i<20;i++)parts.push({x:ball.x,y:ball.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,l:30,c:'#9be7ff'});snd(150,.3,'sine',.08,60);ball.x=lastPos[0];ball.y=lastPos[1];ball.vx=ball.vy=0;msgT={t:'SPLASH! +1',l:60}}
const dc=Math.hypot(ball.x-h.cup[0],ball.y-h.cup[1]);if(dc<CR&&sp<11){sunk=1;ball.vx=ball.vy=0;for(let i=0;i<40;i++)parts.push({x:h.cup[0],y:h.cup[1],vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*9,l:50,c:['#ffd700','#fff','#ff6b6b','#6bcBff'][i%4]});
[523,659,784,1047].forEach((f2,i)=>setTimeout(()=>snd(f2,.18,'triangle',.07),i*90));cards.push(strokes);setTimeout(()=>{if(state=='play')state='card'},1300)}
else if(dc<CR*2.2&&sp>0){ball.vx+=(h.cup[0]-ball.x)*.004*dt;ball.vy+=(h.cup[1]-ball.y)*.004*dt}
if(strokes>=10&&!moving()&&!sunk){sunk=1;cards.push(10);msgT={t:'Max strokes',l:80};setTimeout(()=>{if(state=='play')state='card'},1300)}}}
parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);if(msgT){msgT.l-=dt;if(msgT.l<=0)msgT=null}
x.fillStyle='#163316';x.fillRect(0,0,W,H);for(let i=0;i<40;i++){x.fillStyle='rgba(0,0,0,.15)';x.beginPath();x.arc((i*173)%W,(i*97)%H,20+i%4*8,0,7);x.fill()}
if(state=='title'||!h){draw0();return}
x.save();x.translate(ox,oy);x.scale(K,K);
x.fillStyle='#5d3a1a';x.beginPath();x.roundRect(-14,-14,1028,588,18);x.fill();x.fillStyle='#7a4d24';x.beginPath();x.roundRect(-8,-8,1016,576,14);x.fill();
for(let i=0;i<10;i++){x.fillStyle=i%2?'#3faa48':'#47b752';x.fillRect(i*100,0,100,560)}
h.water.forEach(r=>{const g=x.createLinearGradient(r[0],r[1],r[0]+r[2],r[1]+r[3]);g.addColorStop(0,'#1e88e5');g.addColorStop(1,'#0d47a1');x.fillStyle=g;x.fillRect(...r);x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=2;for(let y=r[1]+15;y<r[1]+r[3];y+=25){x.beginPath();for(let xx=r[0];xx<=r[0]+r[2];xx+=10)x.lineTo(xx,y+Math.sin(xx*.05+tt*.08)*3);x.stroke()}});
h.sand.forEach(r=>{x.fillStyle='#e8d38c';x.beginPath();x.roundRect(...r,30);x.fill();x.fillStyle='rgba(160,130,60,.35)';for(let i=0;i<40;i++)x.fillRect(r[0]+((i*37)%r[2]),r[1]+((i*61)%r[3]),3,3)});
x.fillStyle='rgba(0,0,0,.25)';h.walls.forEach(r=>x.fillRect(r[0]+5,r[1]+6,r[2],r[3]));h.walls.forEach(r=>{const g=x.createLinearGradient(r[0],r[1],r[0]+r[2],r[1]+r[3]);g.addColorStop(0,'#a1662f');g.addColorStop(1,'#6d4220');x.fillStyle=g;x.fillRect(...r);x.strokeStyle='#4a2c13';x.lineWidth=2;x.strokeRect(...r)});
h.mov.forEach(m=>{x.fillStyle='rgba(0,0,0,.3)';x.fillRect(m.x+5,m.y+6,m.w,m.h);x.fillStyle='#e53935';x.fillRect(m.x,m.y,m.w,m.h);x.fillStyle='#fff';const n=Math.max(m.w,m.h)/20;for(let i=0;i<n;i+=2){if(m.ax=='y')x.fillRect(m.x,m.y+i*20,m.w,20);else x.fillRect(m.x+i*20,m.y,20,m.h)}});
x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.arc(h.cup[0],h.cup[1],CR+5,0,7);x.fill();x.fillStyle='#0a0a0a';x.beginPath();x.arc(h.cup[0],h.cup[1],CR,0,7);x.fill();
x.strokeStyle='#ddd';x.lineWidth=3;x.beginPath();x.moveTo(h.cup[0],h.cup[1]);x.lineTo(h.cup[0],h.cup[1]-70);x.stroke();x.fillStyle='#ff3b3b';x.beginPath();x.moveTo(h.cup[0],h.cup[1]-70);x.lineTo(h.cup[0]+36+Math.sin(tt*.15)*4,h.cup[1]-60);x.lineTo(h.cup[0],h.cup[1]-48);x.fill();
if(!sunk){x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.arc(ball.x+3,ball.y+4,BR,0,7);x.fill();const g=x.createRadialGradient(ball.x-3,ball.y-3,1,ball.x,ball.y,BR);g.addColorStop(0,'#fff');g.addColorStop(1,'#cfd8dc');x.fillStyle=g;x.beginPath();x.arc(ball.x,ball.y,BR,0,7);x.fill()}
let aim=null;if(drag){const dx=(drag.cx-drag.sx)/K,dy=(drag.cy-drag.sy)/K;aim={a:Math.atan2(dy,dx)+Math.PI,p:Math.min(1,Math.hypot(dx,dy)/220)}}else if(!touch&&kAim.p>0&&!moving()&&!sunk)aim={a:kAim.a+Math.PI,p:kAim.p};
if(!touch&&!drag&&!moving()&&!sunk&&state=='play'){x.strokeStyle='rgba(255,255,255,.25)';x.setLineDash([4,6]);x.beginPath();x.moveTo(ball.x,ball.y);x.lineTo(ball.x+Math.cos(kAim.a+Math.PI)*60,ball.y+Math.sin(kAim.a+Math.PI)*60);x.stroke();x.setLineDash([])}
if(aim&&aim.p>.03){const col='hsl('+(120-aim.p*120)+',90%,55%)';x.strokeStyle=col;x.lineWidth=4;x.setLineDash([10,8]);x.beginPath();x.moveTo(ball.x,ball.y);x.lineTo(ball.x+Math.cos(aim.a)*aim.p*260,ball.y+Math.sin(aim.a)*aim.p*260);x.stroke();x.setLineDash([]);
x.fillStyle=col;x.save();x.translate(ball.x+Math.cos(aim.a)*aim.p*260,ball.y+Math.sin(aim.a)*aim.p*260);x.rotate(aim.a);x.beginPath();x.moveTo(12,0);x.lineTo(-8,-9);x.lineTo(-8,9);x.fill();x.restore()}
parts.forEach(p=>{x.globalAlpha=p.l/50;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,5,0,7);x.fill()});x.globalAlpha=1;x.restore();
x.fillStyle='rgba(0,0,0,.45)';x.beginPath();x.roundRect(10,56,Math.min(W-80,420),34,10);x.fill();x.fillStyle='#fff';x.font='bold 16px system-ui';x.textAlign='left';
const tot=cards.reduce((a,b)=>a+b,0),parTot=HOLES.slice(0,cards.length).reduce((a,b)=>a+b.par,0);x.fillText('Hole '+(hi+1)+'/9 · Par '+h.par+' · Strokes '+strokes+' · Total '+(tot-parTot>=0?'+':'')+(tot-parTot),20,79);
if(aim&&aim.p>0){x.fillStyle='rgba(0,0,0,.45)';x.fillRect(W-170,H-30,150,16);x.fillStyle='hsl('+(120-aim.p*120)+',90%,55%)';x.fillRect(W-170,H-30,150*aim.p,16)}
x.textAlign='center';if(msgT){x.fillStyle='#9be7ff';x.font='900 30px system-ui';x.strokeStyle='#000';x.lineWidth=5;x.strokeText(msgT.t,W/2,H/2);x.fillText(msgT.t,W/2,H/2)}
if(sunk&&state=='play'&&cards.length&&strokes<10){x.fillStyle='#ffd700';x.font='900 40px system-ui';x.strokeStyle='#000';x.lineWidth=6;const t=word(strokes,h.par);x.strokeText(t,W/2,H/2);x.fillText(t,W/2,H/2)}
if(state=='card')card();if(state=='end')card(1);if(paused)panel('PAUSED',[touch?'Tap II to resume':'Press P to resume'])}
function panel(a,lines){x.fillStyle='rgba(5,25,5,.85)';x.fillRect(0,H/2-90,W,180);x.textAlign='center';x.fillStyle='#ffd700';x.font='900 38px system-ui';x.fillText(a,W/2,H/2-35);x.fillStyle='#eee';x.font='16px system-ui';lines.forEach((l,i)=>x.fillText(l,W/2,H/2+i*24))}
function card(end){const tot=cards.reduce((a,b)=>a+b,0),parTot=HOLES.slice(0,cards.length).reduce((a,b)=>a+b.par,0);const row=cards.map((s,i)=>s+'').join('  ');
panel(end?'ROUND COMPLETE':'Hole '+(hi+1)+': '+word(cards[cards.length-1],h.par),['Scorecard: '+row,'Total '+tot+' ('+(tot-parTot>=0?'+':'')+(tot-parTot)+')'+(best?' · Best round '+best:''),end?(touch?'Tap to play again':'Click or Enter to play again'):(touch?'Tap for the next hole':'Click or Enter for the next hole')])}
function draw0(){panel('MINI GOLF',['9 holes with sand, water and moving gates',touch?'Drag back from anywhere and let go to putt · Tap to start':'Drag back with the mouse and release, or ←→ aim, ↑↓ power, Space putt','Best round: '+(best||'none yet')])}
requestAnimationFrame(loop);
</script></body></html>
