function saveHub(){const n=bestTotal();if(!(n>0))return;let prev=NaN;try{prev=Number(localStorage.getItem('arcade-walk-best'))}catch(e){}if(Number.isFinite(prev)&&prev>=n)return;try{localStorage.setItem('arcade-walk-best',String(n))}catch(e){}}

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){const p=AC.resume();if(p&&p.catch)p.catch(()=>{})}return AC}
function tone(f,d,type,v,f2,delay){if(save.muted)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v,lp){if(save.muted)return;const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=lp||1200;const g=a.createGain();g.gain.value=v||.2;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
const SFX={
 click:()=>tone(660,.05,'square',.05),

// ================= WORLD =================
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967296}
function makeWorld(L){
 const W=L.w,m=new Uint8Array(W*H),col=new Uint32Array(W*H),haz=[];
 const th=THEMES[L.th||0];
 const pack=(r,g,b,a)=>((a<<24)|(b<<16)|(g<<8)|r)>>>0;
 const dirtC=(x,y)=>{const v=hash(x>>1,y>>1),c=th.d[v<.55?0:v<.85?1:2],n=(hash(x,y)-.5)*16;return pack(Math.max(0,Math.min(255,c[0]+n))|0,Math.max(0,Math.min(255,c[1]+n))|0,Math.max(0,Math.min(255,c[2]+n))|0,255)};
 const steelC=(x,y)=>{const bx=x%8,by=y%8;let v=150;if(bx===0||by===0)v=95;else if(bx===7||by===7)v=200;if(bx===2&&by===2)v=230;v+=(hash(x,y)*10)|0;return pack(v-10,v,v+12,255)};
 const set=(x,y,t)=>{if(x<0||x>=W||y<0||y>=H)return;const i=y*W+x;m[i]=t;col[i]=t===0?0:t===2?steelC(x,y):dirtC(x,y)};
 for(const o of L.ops){const k=o[0];
  if(k==='d'||k==='s'||k==='x'){for(let y=o[2];y<o[2]+o[4];y++)for(let x=o[1];x<o[1]+o[3];x++)set(x,y,k==='d'?1:k==='s'?2:0)}
  else if(k==='c'){for(let y=o[2]-o[3];y<=o[2]+o[3];y++)for(let x=o[1]-o[3];x<=o[1]+o[3];x++)if((x-o[1])**2+(y-o[2])**2<=o[3]*o[3])set(x,y,1)}
  else if(k==='w'||k==='l'){haz.push({t:k,x:o[1],y:o[2],w:o[3],h:o[4]});for(let y=o[2];y<o[2]+o[4];y++)for(let x=o[1];x<o[1]+o[3];x++)set(x,y,0)}
 }
 // grass/highlight tops
 for(let x=0;x<W;x++)for(let y=1;y<H;y++){const i=y*W+x;if(m[i]===1&&m[i-W]===0){const t=th.top;col[i]=pack(t[0],t[1],t[2],255);if(y+1<H&&m[i+W]===1){col[i+W]=pack(t[0]*.7|0,t[1]*.7|0,t[2]*.7|0,255)}}}
 return {W,m,col,haz,dirty:true,dirtC,pack};
}
// ================= GAME =================
function newGame(li){
 const L=LEVELS[li];
 const g={li,L,wd:makeWorld(L),ws:[],tick:0,out:0,saved:0,dead:0,rr:L.rr,sk:SK.map(k=>L.sk[k]||0),used:0,
  spawnT:0,hatchOpen:0,nuking:false,over:false,timeLeft:L.time*TPS,events:[]};
 return g;
}
function W_(g){return g.wd.W}
function solid(g,x,y){if(x<0||x>=g.wd.W)return true;if(y<0||y>=H)return false;return g.wd.m[y*g.wd.W+x]!==0}
function steel(g,x,y){if(x<0||x>=g.wd.W)return true;if(y<0||y>=H)return false;return g.wd.m[y*g.wd.W+x]===2}
function clearPx(g,x,y){if(x<0||x>=g.wd.W||y<0||y>=H)return;const i=y*g.wd.W+x;if(g.wd.m[i]===1){g.wd.m[i]=0;g.wd.col[i]=0;g.wd.dirty=true}}
function brickPx(g,x,y){if(x<0||x>=g.wd.W||y<0||y>=H)return;const i=y*g.wd.W+x;if(g.wd.m[i]===0){g.wd.m[i]=1;g.wd.col[i]=g.wd.pack(214,170,98,255);g.wd.dirty=true}}
function clearCircle(g,cx,cy,r){for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++)if((x-cx)**2+(y-cy)**2<=r*r)clearPx(g,x,y)}
function circleHasSteel(g,cx,cy,r){for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++)if(x>=0&&x<g.wd.W&&(x-cx)**2+(y-cy)**2<=r*r&&steel(g,x,y))return true;return false}
function inHaz(g,x,y){for(const h of g.wd.haz)if(x>=h.x&&x<h.x+h.w&&y>=h.y&&y<h.y+h.h)return h.t;return null}
function alive(w){return w.st<ST.SPLAT||w.st===ST.SHRUG}
function spawnW(g){const L=g.L;const w={id:g.out,x:L.hatch[0],y:L.hatch[1],dir:1,st:ST.FALL,fd:0,t:0,climber:false,floater:false,bomb:0,bricks:0,anim:0};g.ws.push(w);g.out++;return w}
function ev(g,e){g.events.push(e)}
function toWalk(g,w){w.st=ST.WALK;w.t=0}
function groundCheck(g,w){let d=0;while(d<3&&!solid(g,w.x,w.y+1)){w.y++;d++}if(!solid(g,w.x,w.y+1)){w.st=ST.FALL;w.fd=d;w.t=0;return false}return true}
function explode(g,w){clearCircle(g,w.x,w.y-4,11);w.st=ST.DEAD;g.dead++;ev(g,{k:'boom',x:w.x,y:w.y-4})}
function stepW(g,w){
 w.anim++;
 if(w.bomb>0&&alive(w)){w.bomb--;if(w.bomb===0){explode(g,w);return}}
 switch(w.st){
 case ST.WALK:{
  for(const b of g.ws)if(b.st===ST.BLOCK&&b!==w&&Math.abs(b.x-w.x)<=5&&Math.abs(b.y-w.y)<=10&&Math.sign(b.x-w.x)===w.dir){w.dir=-w.dir;break}
  const nx=w.x+w.dir;
  if(solid(g,nx,w.y)){let k=1;while(k<=6&&solid(g,nx,w.y-k))k++;if(k<=6){w.x=nx;w.y-=k}else{if(w.climber){w.st=ST.CLIMB;w.t=0;return}w.dir=-w.dir;return}}
  else{w.x=nx;groundCheck(g,w)}
  break}
 case ST.FALL:case ST.FLOAT:{
  const sp=w.st===ST.FLOAT?1:2;
  for(let i=0;i<sp;i++){
   if(solid(g,w.x,w.y+1)){if(w.fd>MAXFALL&&w.st!==ST.FLOAT){w.st=ST.SPLAT;w.t=0;ev(g,{k:'splat',x:w.x,y:w.y});}else toWalk(g,w);return}
   w.y++;w.fd++;if(w.y>=H+10){w.st=ST.DEAD;g.dead++;return}
  }
  if(w.floater&&w.st===ST.FALL&&w.fd>14)w.st=ST.FLOAT;
  break}
 case ST.CLIMB:{
  w.t++;if(w.t%2)break;
  if(solid(g,w.x,w.y-10)||solid(g,w.x-w.dir,w.y-10)){w.dir=-w.dir;w.x+=w.dir;w.st=ST.FALL;w.fd=0;break}
  w.y--;if(!solid(g,w.x+w.dir,w.y)){w.x+=w.dir;w.y--;toWalk(g,w);groundCheck(g,w)}
  break}
 case ST.BLOCK:{if(!solid(g,w.x,w.y+1)){w.st=ST.FALL;w.fd=0}break}
 case ST.BUILD:{
  w.t++;if(w.t%5)break;
  for(let i=0;i<6;i++)brickPx(g,w.x+w.dir*i,w.y);
  w.bricks--;ev(g,{k:'brick'});
  const nx=w.x+w.dir*2,ny=w.y-1;
  if(solid(g,nx,ny)||solid(g,nx,ny-7)||solid(g,w.x+w.dir,ny-1)){w.dir=-w.dir;toWalk(g,w);break}
  w.x=nx;w.y=ny;
  if(w.bricks<=0){w.st=ST.SHRUG;w.t=0}
  break}
 case ST.SHRUG:{w.t++;if(w.t>=8)toWalk(g,w);break}
 case ST.BASH:{
  w.t++;if(w.t%2)break;
  let st=false;for(let dx=1;dx<=4&&!st;dx++)for(let dy=0;dy<=8;dy++)if(steel(g,w.x+w.dir*dx,w.y-dy)){st=true;break}
  if(st){w.dir=-w.dir;toWalk(g,w);ev(g,{k:'clink'});break}
  for(let dx=1;dx<=4;dx++)for(let dy=0;dy<=8;dy++)clearPx(g,w.x+w.dir*dx,w.y-dy);
  w.x+=w.dir;if(!groundCheck(g,w))break;
  let more=false;for(let dx=1;dx<=10&&!more;dx++)for(let dy=0;dy<=8;dy++)if(solid(g,w.x+w.dir*dx,w.y-dy)&&!steel(g,w.x+w.dir*dx,w.y-dy)){more=true;break}
  if(!more)toWalk(g,w);
  break}
 case ST.MINE:{
  w.t++;if(w.t%3)break;

  w.t++;if(w.t%3)break;

  if(st){toWalk(g,w);ev(g,{k:'clink'});break}
  let c=0;for(let dx=-4;dx<=4;dx++)if(solid(g,w.x+dx,w.y+1))c++;

 case ST.SPLAT:case ST.DROWN:case ST.BURN:{w.t++;if(w.t>=16){w.st=ST.DEAD;g.dead++}return}
 case ST.EXIT:{w.t++;if(w.t>=12){w.st=ST.DEAD;w.home=true}return}
 }
 if(!alive(w))return;
 const hz=inHaz(g,w.x,w.y)||inHaz(g,w.x,w.y+1);
 if(hz){w.st=hz==='w'?ST.DROWN:ST.BURN;w.t=0;w.bomb=0;ev(g,{k:hz==='w'?'drown':'burn',x:w.x,y:w.y});return}
 const E=g.L.exit;
 if((w.st===ST.WALK||w.st===ST.FALL||w.st===ST.FLOAT)&&Math.abs(w.x-E[0])<=3&&w.y>=E[1]-6&&w.y<=E[1]+1){w.st=ST.EXIT;w.t=0;w.bomb=0;g.saved++;ev(g,{k:'exit',x:w.x,y:w.y})}

function canAssign(g,w,s){
 if(!w||!alive(w)||w.st===ST.SHRUG&&false)return false;

 if(k==='climb')return !w.climber;
 if(k==='float')return !w.floater;
 if(k==='bomb')return w.bomb===0;
 if(w.st===ST.FALL||w.st===ST.FLOAT||w.st===ST.CLIMB||w.st===ST.BLOCK)return false;

}
function assign(g,w,s){
 if(g.sk[s]<=0||!canAssign(g,w,s))return false;
 g.sk[s]--;g.used++;
 const k=SK[s];
 if(k==='climb')w.climber=true;else if(k==='float')w.floater=true;else if(k==='bomb')w.bomb=BOMBT;

function scriptStep(g,sol,done){
 for(let j=0;j<sol.length;j++){
  if(done[j])continue;
  const [k,i,c]=sol[j];
  let blocked=false;for(let q=0;q<j;q++)if(!done[q]&&sol[q][1]===i){blocked=true;break}
  if(blocked)continue;
  const w=g.ws[i];if(!w||!alive(w))continue;
  if(c.t!=null&&g.tick<c.t)continue;
  if(c.st!=null&&STN[w.st]!==c.st)continue;
  if(c.x!=null&&(w.x!==c.x||w.st!==ST.WALK))continue;
  if(c.d!=null&&w.dir!==c.d)continue;
  const s=SK.indexOf(k);
  if(assign(g,w,s))done[j]=true;
 }
}
