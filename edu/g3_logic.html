// ---- AND / OR / NOT ----
function fact(){const t=ri(0,3);if(t===0){const n=ri(2,40);return[n+' is even',n%2===0]}if(t===1){const a=ri(1,30),b=ri(1,30);if(a===b)return fact();return[a+' is greater than '+b,a>b]}if(t===2){const a=ri(2,9),b=ri(2,9),c=Math.random()<.5?a*b:a*b+ri(1,3);return[a+' × '+b+' = '+c,c===a*b]}const n=ri(2,9);const sq=n*n+(Math.random()<.5?0:1);return[sq+' is a square number',Number.isInteger(Math.sqrt(sq))]}

function seqQ(hard){const kinds=hard?['geo','sq','tri','inc','alt','fib','let','down']:['ar','ar','down','geo2','let'];const k=pick(kinds);let s=[],ans,rule;
 if(k==='ar'){const a=ri(1,20),d=ri(2,9);s=[0,1,2,3,4].map(i=>a+i*d);ans=a+5*d;rule='Add '+d+' each time.'}
 else if(k==='down'){const d=ri(2,8),a=ri(5*d+5,90);s=[0,1,2,3,4].map(i=>a-i*d);ans=a-5*d;rule='Subtract '+d+' each time.'}
 else if(k==='geo2'||k==='geo'){const r=k==='geo2'?2:pick([2,3]),a=ri(1,k==='geo2'?5:3);s=[0,1,2,3,4].map(i=>a*r**i);ans=a*r**5;rule='Multiply by '+r+' each time.'}
 else if(k==='sq'){const o=ri(1,4);s=[0,1,2,3,4].map(i=>(i+o)**2);ans=(5+o)**2;rule='Square numbers: '+o+'², '+(o+1)+'², …'}
 else if(k==='tri'){s=[1,3,6,10,15];ans=21;rule='Triangular numbers: add 2, 3, 4, 5, then 6.'}
 else if(k==='inc'){const a=ri(1,10),d=ri(1,3);s=[a];for(let i=1;i<5;i++)s.push(s[i-1]+d*i);ans=s[4]+d*5;rule='The gap grows by '+d+' each time.'}
 else if(k==='alt'){const a=ri(10,30),u=ri(3,8),v=ri(1,u-1);s=[a];for(let i=1;i<5;i++)s.push(s[i-1]+(i%2?u:-v));ans=s[4]+u;rule='Alternately add '+u+' and subtract '+v+'.'}
 else if(k==='fib'){const a=ri(1,3),b=ri(a,5);s=[a,b];for(let i=2;i<5;i++)s.push(s[i-1]+s[i-2]);ans=s[3]+s[4];rule='Add the two previous numbers.'}
 else{const st=ri(0,8),d=pick([1,2,3]);const L=i=>String.fromCharCode(65+st+i*d);s=[0,1,2,3,4].map(L);ans=L(5);rule='Skip '+(d-1)+' letter'+(d===2?'':'s')+' each time.';if(st+5*d>25)return seqQ(hard)}

const PEOPLE=['Ava','Ben','Cleo','Dev','Eli','Fay'];
const THEMES=[['🐶 Dog','🐱 Cat','🐟 Fish','🐰 Rabbit'],['🍎 Apple','🍌 Banana','🍇 Grapes','🍓 Strawberry'],['⚽ Football','🎾 Tennis','🏊 Swimming','🎨 Painting'],['🔴 Red','🔵 Blue','🟢 Green','🟡 Yellow']];
function perms(n){if(n===1)return[[0]];const out=[];perms(n-1).forEach(p=>{for(let i=0;i<=p.length;i++){const c=p.slice();c.splice(i,0,n-1);out.push(c)}});return out}
function sat(c,p){if(c.t==='pos')return p[c.a]===c.i;if(c.t==='neg')return p[c.a]!==c.i;if(c.t==='or')return p[c.a]===c.i||p[c.a]===c.j;return true}
function countSol(cl,n){return perms(n).filter(p=>cl.every(c=>sat(c,p))).length}
function genGrid(n,noPos){const P=shuffle(PEOPLE).slice(0,n),T=pick(THEMES).slice(0,n),sol=shuffle([...Array(n).keys()]);let cand=[];for(let a=0;a<n;a++)for(let i=0;i<n;i++){if(sol[a]===i){if(!noPos)cand.push({t:'pos',a,i})}else{cand.push({t:'neg',a,i});const j=sol[a];cand.push({t:'or',a,i:Math.min(i,j),j:Math.max(i,j)})}}cand=shuffle(cand);const cl=[];for(const c of cand){if(countSol(cl,n)===1)break;cl.push(c)}
 for(let k=cl.length-1;k>=0;k--){const t=cl.slice(0,k).concat(cl.slice(k+1));if(countSol(t,n)===1)cl.splice(k,1)}
 const txtC=c=>{const nm=P[c.a],it=x=>T[x].split(' ').slice(1).join(' ').toLowerCase();if(c.t==='pos')return nm+' has the '+it(c.i)+'.';if(c.t==='neg')return pick([nm+' does not have the '+it(c.i)+'.','The '+it(c.i)+' does not belong to '+nm+'.']);return nm+' has either the '+it(c.i)+' or the '+it(c.j)+'.'};
 return{P,T,sol,cl,clues:cl.map(txtC),unique:countSol(cl,n)===1}}
CUSTOM.grid={draw(q){const n=q.g.P.length,lw=W*.42;wrapC('Clues:',lw/2+10,36,lw,14,'#ffcf5a');q.g.clues.forEach((c,i)=>wrapC((i+1)+'. '+c,lw/2+10,58+i*(Math.min(34,(H-120)/q.g.clues.length)),lw-10,12,'#fff',2));
 const gx=lw+90,cs=Math.min(58,(W-gx-14)/n,(H-110)/n),gy=74;q.g.T.forEach((t,j)=>{txt(t.split(' ')[0],gx+j*cs+cs/2,gy-26,20);txt(t.split(' ').slice(1).join(' '),gx+j*cs+cs/2,gy-8,9,'#ccd')});
 q.g.P.forEach((p,i)=>{txt(p,gx-40,gy+i*cs+cs/2,15,'#fff');for(let j=0;j<n;j++){const v=q.marks[i][j],x=gx+j*cs,y=gy+i*cs;card(x+2,y+2,cs-4,cs-4,v===2?'#2a8a3a':v===1?'#5a2a3a':'#283070');if(v)txt(v===2?'✓':'✗',x+cs/2,y+cs/2,22,'#fff');btns.push({x,y,w:cs,h:cs,f:()=>{if(lock)return;q.marks[i][j]=(v+1)%3;if(q.marks[i][j]===2){for(let k=0;k<n;k++){if(k!==j&&q.marks[i][k]===2)q.marks[i][k]=1;if(k!==i&&q.marks[k][j]===2)q.marks[k][j]=1}}sfx.tap();msg='';draw()}})}});
 const by=gy+n*cs+12;if(!lock){card(gx,by,n*cs,38,'#e07a10');txt('✔ Check',gx+n*cs/2,by+19,15);btns.push({x:gx,y:by,w:n*cs,h:38,f:()=>checkGrid(q)})}txt('Tap: ✗ → ✓ → blank',gx+n*cs/2,by+50,10,'#9ab');if(msg)wrapC(msg,gx+n*cs/2-20,H-16,W-gx,12,msgCol)},
 key(e,q){if(e.key==='Enter')checkGrid(q)}};
function checkGrid(q){if(lock)return;const n=q.g.P.length;for(let i=0;i<n;i++)if(!q.marks[i].includes(2))return bad('Put one ✓ in every row first.');const wrong=q.g.P.filter((p,i)=>q.marks[i].indexOf(2)!==q.g.sol[i]);if(!wrong.length)good('Solved! Every clue fits only this answer.');else bad('Not quite — check '+wrong.join(' and ')+' against the clues.')}
// ---- knights and knaves ----
function kkGen(n){const names=shuffle(['Ari','Bo','Cass','Dax','Eve']).slice(0,n);for(let t=0;t<500;t++){const st=names.map((_,i)=>{const o=pick([...Array(n).keys()].filter(j=>j!==i));const k=ri(0,5);
  if(k===0)return{s:names[o]+' is a knight.',f:a=>a[o]};if(k===1)return{s:names[o]+' is a knave.',f:a=>!a[o]};if(k===2)return{s:names[o]+' and I are the same type.',f:a=>a[o]===a[i]};if(k===3)return{s:names[o]+' and I are different types.',f:a=>a[o]!==a[i]};if(k===4)return{s:'At least one of us is a knave.',f:a=>a.some(x=>!x)};return{s:'We are all knights.',f:a=>a.every(x=>x)}});
  const sols=[];for(let m=0;m<1<<n;m++){const a=names.map((_,i)=>!!(m>>i&1));if(st.every((s,i)=>s.f(a)===a[i]))sols.push(a)}if(sols.length===1)return{names,st,sol:sols[0]}}return kkGen(n)}
CUSTOM.kk={draw(q){wrapC('Knights always tell the TRUTH. Knaves always LIE. Tap each person to choose.',W/2,38,W-40,14,'#fff');const n=q.k.names.length,bw=Math.min(240,(W-40-(n-1)*12)/n),x0=(W-(n*bw+(n-1)*12))/2;q.k.names.forEach((nm,i)=>{const x=x0+i*(bw+12),y=62,v=q.guess[i];card(x,y,bw,90,'#fdf6e3');wrapC('"'+q.k.st[i].s+'"',x+bw/2,y+45,bw-16,14,'#2b1d0e');const by=y+104;card(x,by,bw,62,v===1?'#2a6a9a':v===2?'#8a2a2a':'#283070');txt((v===1?'🛡️ ':v===2?'🦹 ':'❓ ')+nm,x+bw/2,by+22,18);txt(v===1?'Knight':v===2?'Knave':'tap to choose',x+bw/2,by+46,12,'#ddd');btns.push({x,y:by,w:bw,h:62,f:()=>{if(lock)return;q.guess[i]=v===1?2:1;sfx.tap();msg='';draw()}})});
 if(!lock){card(W/2-80,H-56,160,40,'#e07a10');txt('✔ Check',W/2,H-36,16);btns.push({x:W/2-80,y:H-56,w:160,h:40,f:()=>checkKK(q)})}if(msg)wrapC(msg,W/2,H-74,W-40,13,msgCol)},key(e,q){const n=+e.key;if(n>=1&&n<=q.guess.length){q.guess[n-1]=q.guess[n-1]===1?2:1;draw()}else if(e.key==='Enter')checkKK(q)}};
function checkKK(q){if(lock)return;if(q.guess.some(v=>!v))return bad('Choose knight or knave for everyone.');const ok=q.guess.every((v,i)=>(v===1)===q.k.sol[i]);if(ok)good('Brilliant deduction! Only this answer makes every statement work.');else bad('That doesn\'t work — try assuming someone is a knight and see if their statement holds.')}
// ---- Venn custom draw ----
CUSTOM.venn={draw(q){const cx0=W*.24,cy0=H/2+10,r=Math.min(H*.36,W*.15);cx.globalAlpha=.35;cx.fillStyle='#e74c3c';cx.beginPath();cx.arc(cx0-r*.55,cy0,r,0,7);cx.fill();cx.fillStyle='#3498db';cx.beginPath();cx.arc(cx0+r*.55,cy0,r,0,7);cx.fill();cx.globalAlpha=1;cx.strokeStyle='#fff';cx.lineWidth=2;cx.strokeRect(cx0-r*1.75,cy0-r*1.2,r*3.5,r*2.4);
 txt('A: '+q.A,cx0-r*.6,cy0-r*1.2-12,12,'#f99');txt('B: '+q.B,cx0+r*.6,cy0-r*1.2-12,12,'#9cf');
 const pos=[[cx0-r*.95,cy0],[cx0+r*.95,cy0],[cx0,cy0],[cx0-r*1.5,cy0+r*1.05]];q.placed.forEach((p,k)=>{const [x,y]=pos[p.r];txt(p.v,x+((k%3)-1)*18,y-r*.4+Math.floor(k/3)*16,13,'#fff')});
 const px=W*.5,pw=W-px-14;card(px+pw/2-70,40,140,46,'#fdf6e3');txt(q.item,px+pw/2,63,fit(q.item,130,24),'#2b1d0e');txt('Where does it go?',px+pw/2,104,15,'#fff');const bw=(pw-10)/2,bh=42;REG.forEach((o,i)=>{const bx=px+(i%2)*(bw+10),by=122+Math.floor(i/2)*(bh+10);let col='#283070';if(q.picked!=null){if(i===q.ans)col='#2a8a3a';else if(i===q.picked)col='#a33'}card(bx,by,bw,bh,col);txt((i+1)+'  '+o,bx+bw/2,by+bh/2,15);btns.push({x:bx,y:by,w:bw,h:bh,f:()=>vpick(q,i)})});if(msg)wrapC(msg,px+pw/2,H-30,pw,13,msgCol)},key(e,q){const n=+e.key;if(n>=1&&n<=4)vpick(q,n-1)}};
function vpick(q,i){if(lock||q.picked!=null)return;q.picked=i;const ok=i===q.ans;if(ok){sfx.ok();q.placed.push({v:q.item,r:i})}else{sfx.bad();miss++}msg=(ok?'✔ ':'✘ It goes '+REG[q.ans].toLowerCase()+'. ')+q.why;msgCol=ok?'#7f7':'#f99';lock=true;draw();setTimeout(()=>{const keep=q.placed;next();if(Q&&Q.m==='venn'&&Q.A===q.A)Q.placed=keep;draw()},ok?1400:2800)}
const LV=[
{name:'True or false?',m:'tf'},
{name:'Number sequences',m:'seq'},
{name:'Venn diagram: numbers',m:'vennN',n:8},
{name:'Logic grid 3 × 3',m:'grid',g:3,n:3},
{name:'Knights & knaves (2)',m:'kk',k:2,n:3},
{name:'Tricky sequences',m:'seq',hard:1},
{name:'Venn diagram: animals',m:'vennA',n:8},
{name:'Logic grid 4 × 4',m:'grid',g:4,n:3},
{name:'True, false or can\'t tell?',m:'ct'},
{name:'Knights & knaves (3)',m:'kk',k:3,n:3},
{name:'AND, OR, NOT',m:'bool'},
{name:'Expert grid (no free answers)',m:'grid',g:4,noPos:1,n:3},
{name:'Letter & number patterns',m:'seq',hard:1},
{name:'Logic master',m:'mix'}];
const TIPS={0:'Read the facts, then decide: does the conclusion HAVE to be true? Only use what you are told.',2:'A Venn diagram sorts things into circles. The overlap holds things that belong in BOTH circles.',3:'Each person has exactly one thing, and no two people share. Mark ✗ for what clues rule out, then find the ✓.',4:'Knights always tell the truth, knaves always lie. Imagine each person is a knight: does everything still make sense?',8:'"Can\'t tell" means the facts don\'t give enough information to be sure.',10:'AND is true only if BOTH parts are true. OR is true if AT LEAST ONE part is true. NOT flips true and false.'};
function makeQ(){const L=LV[cur];let m=L.m;if(m==='mix')m=pick(['tf','seq','vennN','grid','kk','ct','bool','vennA']);const q={m,used:(Q&&Q.used)||[]};
 if(m==='tf'||m==='ct'){const f=fromList(m==='tf'?TF:TF.concat(CT,CT),q);q.big='Facts: '+f[0];q.bigSz=17;q.text='So… "'+f[1]+'"';q.opts=m==='tf'?['True','False']:['True','False','Can\'t tell'];q.ans=f[2];q.why=f[3]||(f[2]==='True'?'It must follow from the facts.':'The facts show it can\'t be true.')}
 else if(m==='seq'){const s=seqQ(L.hard||LV[cur].m==='mix');q.big=s.s.join(',  ')+',  ?';q.bigSz=24;q.text='What comes next?';q.opts=s.opts;q.ans=s.ans;q.why=s.rule}
 else if(m==='bool'){const [a,av]=fact(),[b,bv]=fact(),op=pick(['AND','OR','NOT']);let s,v;if(op==='NOT'){s='It is NOT true that '+a+'.';v=!av}else{s='"'+a+'" '+op+' "'+b+'"';v=op==='AND'?av&&bv:av||bv}q.big=s;q.bigSz=18;q.text='Is this whole statement true or false?';q.opts=['True','False'];q.ans=v?'True':'False';q.why=op==='NOT'?'"'+a+'" is '+(av?'true':'false')+', so NOT flips it.':'"'+a+'" is '+(av?'true':'false')+' and "'+b+'" is '+(bv?'true':'false')+'. '+op+(op==='AND'?' needs both.':' needs at least one.')}
 else if(m==='vennN'||m==='vennA'){const prev=Q&&Q.m==='venn'&&qi>0?Q:null;q.m='venn';q.placed=[];if(m==='vennN'){let pa,pb;if(prev){q.A=prev.A;q.B=prev.B;pa=prev.fa;pb=prev.fb}else{const two=shuffle(PROPS.filter(p=>p[0]!=='Odd numbers')).slice(0,2);q.A=two[0][0];q.B=two[1][0];pa=two[0][1];pb=two[1][1]}q.fa=pa;q.fb=pb;let n;do n=ri(1,30);while(q.used.includes(n));q.used=q.used.concat(n);q.item=String(n);q.ans=region(pa(n),pb(n));q.why=n+(pa(n)?' IS ':' is NOT ')+'in A, and'+(pb(n)?' IS ':' is NOT ')+'in B.'}
  else{q.A='Can fly';q.B='Lays eggs';const a=fromList(ANI,q);q.item=a[0];q.ans=region(a[1],a[2]);q.why=a[0]+(a[1]?' can fly':' can\'t fly')+' and '+(a[2]?'lays eggs.':'doesn\'t lay eggs.')}}
 else if(m==='grid'){const n=L.g||3;q.g=genGrid(n,L.noPos);q.marks=[...Array(n)].map(()=>Array(n).fill(0))}
 else if(m==='kk'){q.k=kkGen(L.k||2);q.guess=q.k.names.map(()=>0)}
 return q}
