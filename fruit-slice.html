<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b0b14"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg"><title>Fruit Slice</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;touch-action:none;background:#2b1608;font-family:system-ui,sans-serif;user-select:none}canvas{display:block;touch-action:none}
#P{position:fixed;z-index:40;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:46px;height:46px;border-radius:10px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.5);color:#fff;font-weight:bold;font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}
a.back{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:80;display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(8,8,16,.82);color:#ffe14d;border:1px solid rgba(255,225,77,.55);font:700 12px/1 ui-monospace,monospace;letter-spacing:.04em;text-decoration:none;touch-action:manipulation}
a.back:focus-visible{outline:2px solid #ffe14d;outline-offset:2px}</style></head><body>
<a class="back" href="./index.html" aria-label="Back to menu" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">← Menu</a>
<canvas id="c"></canvas><div id="P">II</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D;
function rs(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0)}rs();addEventListener('resize',rs);
const touch='ontouchstart'in window;
const F=[{n:'apple',c:'#e53935',i:'#fff3c4',r:30},{n:'orange',c:'#fb8c00',i:'#ffcc80',r:30},{n:'melon',c:'#2e7d32',i:'#ff5252',r:42},{n:'lime',c:'#7cb342',i:'#dcedc8',r:24},{n:'grape',c:'#7b1fa2',i:'#e1bee7',r:22},{n:'banana',c:'#fdd835',i:'#fff9c4',r:28}];
let state='title',paused=false,best=0,obs,halves,parts,trail,sc,lives,t,combo,cT,flash,diff,auto;
try{best=+localStorage.getItem('arcade-fruit-best')||0}catch(e){}
function reset(){obs=[];halves=[];parts=[];trail=[];sc=0;lives=3;t=0;combo=0;cT=0;flash=0;diff=1}reset();
function start(){if(state!='play'){reset();state='play';paused=false}}
function spawn(){const n=1+Math.floor(Math.random()*Math.min(4,diff));for(let i=0;i<n;i++){const bomb=Math.random()<Math.min(.25,.08+t/20000);const sx=W*(.2+Math.random()*.6);
const g=.25*H/700;const peak=H*(.15+Math.random()*.25);const vy=-Math.sqrt(2*g*(H-peak));obs.push({x:sx,y:H+50,vx:(W/2-sx)*.006+(Math.random()-.5)*2,vy,g,rot:0,vr:(Math.random()-.5)*.15,bomb,f:F[Math.random()*F.length|0],cut:0})}}
let sTimer=60;
function seg(a,b,o,r){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let u=l?((o.x-a.x)*dx+(o.y-a.y)*dy)/l:0;u=Math.max(0,Math.min(1,u));const px=a.x+u*dx-o.x,py=a.y+u*dy-o.y;return px*px+py*py<r*r}
function slice(a,b){if(state!='play'||paused)return;for(const o of obs){if(o.cut)continue;const r=o.bomb?26:o.f.r;if(seg(a,b,o,r)){o.cut=1;
if(o.bomb){flash=20;lives=0;for(let i=0;i<50;i++)parts.push({x:o.x,y:o.y,vx:(Math.random()-.5)*14,vy:(Math.random()-.5)*14,l:50,c:['#fff','#ffb300','#ff3d00','#444'][i%4],s:6});die();return}
const ang=Math.atan2(b.y-a.y,b.x-a.x);combo++;cT=20;sc+=1;if(combo>=3)sc+=combo-2;
for(const sgn of[-1,1])halves.push({x:o.x,y:o.y,vx:o.vx+Math.cos(ang+sgn*Math.PI/2)*3,vy:o.vy*.4+Math.sin(ang+sgn*Math.PI/2)*3,g:o.g,rot:ang,vr:sgn*.08,f:o.f,s:sgn,l:120});
for(let i=0;i<18;i++)parts.push({x:o.x,y:o.y,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*9,l:35,c:o.f.i,s:4+Math.random()*4})}}}
function die(){state='over';if(sc>best){best=sc;try{localStorage.setItem('arcade-fruit-best',String(best))}catch(e){}}}
let down=0,lp=null;
function mv(px,py){const p={x:px,y:py,l:12};if(lp&&down){slice(lp,p);trail.push(p)}lp=p}
c.addEventListener('touchstart',e=>{e.preventDefault();if(state!='play'){start();return}down=1;lp=null;const t=e.touches[0];mv(t.clientX,t.clientY)},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];mv(t.clientX,t.clientY)},{passive:false});c.addEventListener('touchend',()=>{down=0;lp=null});
c.addEventListener('mousedown',e=>{if(state!='play'){start();return}down=1;lp=null;mv(e.clientX,e.clientY)});addEventListener('mousemove',e=>mv(e.clientX,e.clientY));addEventListener('mouseup',()=>{down=0;lp=null});
const tp=()=>{if(state=='play')paused=!paused};const P=document.getElementById('P');P.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();tp()});
addEventListener('keydown',e=>{if(e.repeat)return;if(e.key=='p'||e.key=='P'||e.key=='Escape')tp();if(e.key=='Enter'||e.key==' '||e.key=='r'||e.key=='R'){if(state!='play'||e.key=='r'||e.key=='R'){state='x';start()}}});
function drawFruit(o,half){x.save();x.translate(o.x,o.y);x.rotate(o.rot);const r=o.f.r;
if(half){x.beginPath();x.arc(0,0,r,o.s>0?0:Math.PI,o.s>0?Math.PI:Math.PI*2);x.closePath();x.clip()}
x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.arc(4,6,r,0,7);x.fill();
const g=x.createRadialGradient(-r*.35,-r*.35,r*.1,0,0,r);g.addColorStop(0,'#fff');g.addColorStop(.25,o.f.c);g.addColorStop(1,'#000');x.globalAlpha=1;x.fillStyle=g;x.beginPath();x.arc(0,0,r,0,7);x.fill();
x.fillStyle=o.f.c;x.globalAlpha=.55;x.beginPath();x.arc(0,0,r*.92,0,7);x.fill();x.globalAlpha=1;
if(half){x.fillStyle=o.f.i;x.fillRect(-r,o.s>0?-2:-2,2*r,4)}
if(o.f.n=='melon'){x.strokeStyle='#1b5e20';x.lineWidth=3;for(let i=-2;i<=2;i++){x.beginPath();x.ellipse(i*r*.35,0,3,r*.9,0,0,7);x.stroke()}}
x.fillStyle='#5d4037';x.fillRect(-2,-r-6,4,8);x.fillStyle='#43a047';x.beginPath();x.ellipse(6,-r-3,7,3,.5,0,7);x.fill();x.restore()}
function drawBomb(o){x.save();x.translate(o.x,o.y);x.rotate(o.rot);x.shadowColor='#f30';x.shadowBlur=18;const g=x.createRadialGradient(-8,-8,2,0,0,26);g.addColorStop(0,'#666');g.addColorStop(1,'#000');x.fillStyle=g;x.beginPath();x.arc(0,0,26,0,7);x.fill();x.shadowBlur=0;
x.strokeStyle='#bbb';x.lineWidth=3;x.beginPath();x.moveTo(0,-26);x.quadraticCurveTo(8,-36,4,-42);x.stroke();x.fillStyle=Math.random()<.5?'#ffeb3b':'#ff5722';x.beginPath();x.arc(4,-43,4+Math.random()*3,0,7);x.fill();
x.fillStyle='#e53935';x.font='bold 20px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText('✕',0,2);x.restore()}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(2,(now-last)/16.7);last=now;
if(state=='play'&&!paused){t+=dt;diff=1+t/900;sTimer-=dt;if(sTimer<=0){spawn();sTimer=Math.max(35,90-t/60)}
for(const o of obs){o.x+=o.vx*dt;o.y+=o.vy*dt;o.vy+=o.g*dt;o.rot+=o.vr*dt}
for(const o of obs)if(!o.cut&&!o.bomb&&o.vy>0&&o.y>H+60){o.cut=1;lives--;flash=8;if(lives<=0)die()}
obs=obs.filter(o=>!o.cut&&o.y<H+80);if(cT>0)cT-=dt;else combo=0}
if(!paused){for(const h of halves){h.x+=h.vx*dt;h.y+=h.vy*dt;h.vy+=h.g*dt;h.rot+=h.vr*dt;h.l-=dt}halves=halves.filter(h=>h.l>0&&h.y<H+80);
for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=.2*dt;q.l-=dt}parts=parts.filter(q=>q.l>0)}
trail.forEach(p=>p.l-=dt);trail=trail.filter(p=>p.l>0);
const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#6d3b17');bg.addColorStop(1,'#2b1608');x.fillStyle=bg;x.fillRect(0,0,W,H);
x.strokeStyle='rgba(0,0,0,.25)';x.lineWidth=3;for(let i=0;i<W;i+=90){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}x.strokeStyle='rgba(255,255,255,.05)';for(let i=0;i<H;i+=37){x.beginPath();x.moveTo(0,i);x.bezierCurveTo(W*.3,i+10,W*.6,i-10,W,i);x.stroke()}
halves.forEach(h=>drawFruit(h,1));obs.forEach(o=>o.bomb?drawBomb(o):drawFruit(o,0));
parts.forEach(q=>{x.globalAlpha=Math.max(0,q.l/35);x.fillStyle=q.c;x.beginPath();x.arc(q.x,q.y,q.s,0,7);x.fill()});x.globalAlpha=1;
if(trail.length>1){x.lineCap='round';x.shadowColor='#9ef';x.shadowBlur=15;for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i];x.strokeStyle='rgba(220,250,255,'+(b.l/12)+')';x.lineWidth=b.l*.9;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}x.shadowBlur=0}
if(flash>0){x.fillStyle='rgba(255,255,255,'+flash/25+')';x.fillRect(0,0,W,H);flash-=dt}
x.textAlign='left';x.textBaseline='alphabetic';x.fillStyle='#ffd54f';x.font='900 34px system-ui';x.shadowColor='#000';x.shadowBlur=6;x.fillText(sc,18,96);x.fillStyle='#fff';x.font='bold 15px system-ui';x.fillText('BEST '+best,20,118);
x.textAlign='right';x.font='26px system-ui';x.fillText('❤'.repeat(Math.max(0,lives))+'♡'.repeat(3-Math.max(0,lives)),W-70,42);x.shadowBlur=0;
if(combo>=3&&cT>0){x.textAlign='center';x.fillStyle='#ffeb3b';x.font='900 30px system-ui';x.fillText(combo+'x COMBO!',W/2,90)}
x.textAlign='center';const msg=(a,b)=>{x.fillStyle='rgba(0,0,0,.7)';x.fillRect(0,H/2-75,W,150);x.fillStyle='#ffd54f';x.font='900 42px system-ui';x.fillText(a,W/2,H/2-5);x.fillStyle='#eee';x.font='17px system-ui';x.fillText(b,W/2,H/2+32)};
if(state=='title')msg('FRUIT SLICE',touch?'Tap to start. Swipe to slice fruit, avoid bombs':'Click to start. Drag the mouse to slice, avoid bombs. P pause');
if(state=='over')msg('GAME OVER  '+sc,touch?'Tap to play again':'Click or Enter to play again');if(paused)msg('PAUSED',touch?'Tap II to resume':'Press P to resume')}
requestAnimationFrame(loop);
</script></body></html>
