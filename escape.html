<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0b10;color:#eee;font-family:Georgia,'Times New Roman',serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
a.back{position:fixed;z-index:95;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));color:#fff;background:#16162a;border:1px solid #2a2a44;border-radius:8px;padding:8px 12px;text-decoration:none;font:600 14px/1.2 system-ui,sans-serif;min-height:40px;display:inline-flex;align-items:center;box-sizing:border-box}
#top{position:fixed;left:0;right:0;top:0;min-height:52px;height:auto;display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 112px;background:linear-gradient(#1d1822,#141017);border-bottom:1px solid #3a2f40;z-index:20}

#tools{display:flex;gap:6px}
.tb{background:#2a2230;color:#e9d8a6;border:1px solid #4a3d52;border-radius:8px;font:600 14px system-ui,sans-serif;padding:8px 12px;cursor:pointer;white-space:nowrap;min-height:40px;min-width:44px}
.tb:active{transform:scale(.95)}
#game{position:fixed;left:0;right:0;top:56px;bottom:0;display:none;flex-direction:column;align-items:center}@media (orientation:portrait){#game{justify-content:center;padding-bottom:40px}}
#cv{display:block;margin-top:4px;border-radius:6px;box-shadow:0 0 30px #000;cursor:pointer;touch-action:none}
#msg{min-height:34px;width:100%;max-width:1000px;padding:6px 10px;font-size:15px;color:#f2e6c9;text-align:center;line-height:1.3}
#inv{display:flex;gap:6px;padding:4px;flex-wrap:wrap;justify-content:center;max-width:100%}
.slot{width:54px;height:54px;border-radius:10px;background:#211a26;border:2px solid #4a3d52;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.slot.sel{border-color:#ffd166;box-shadow:0 0 10px #ffd16688}
.slot canvas{width:44px;height:44px}
#title{position:fixed;inset:56px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:16px 12px 12px;z-index:5}
#tbg{position:fixed;inset:0;z-index:0}
#title h1{font-size:clamp(40px,11vw,92px);margin:0;letter-spacing:4px;color:#ffd166;text-shadow:0 0 18px #ff9f1c88,0 4px 0 #6b3e00;position:relative}
#title p{color:#cfc3dd;max-width:520px;position:relative;font-size:16px}
.big{font:700 20px system-ui,sans-serif;padding:12px 30px;border-radius:14px;border:none;background:linear-gradient(#ffd166,#f4a300);color:#2b1700;cursor:pointer;margin:6px;box-shadow:0 5px 0 #8a5a00;position:relative;min-height:44px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #8a5a00}
#best{position:relative;color:#bda9d6;font:14px system-ui,sans-serif;margin-top:10px;white-space:pre-line}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:safe center;justify-content:center;z-index:30;padding:56px 12px 12px}
.box{background:linear-gradient(#2b2333,#1b1520);border:2px solid #6b5878;border-radius:16px;padding:16px;max-width:94vw;max-height:calc(100vh - 72px);overflow:auto;text-align:center;box-shadow:0 10px 40px #000}
.box h2{margin:0 0 10px;color:#ffd166;font-size:20px}
.keys{display:grid;grid-template-columns:repeat(3,62px);gap:8px;justify-content:center}
.keys button,.wheel button{font:700 22px system-ui,sans-serif;height:54px;min-height:40px;min-width:44px;border-radius:10px;border:none;background:#463a52;color:#fff;cursor:pointer}
.keys button:active,.wheel button:active{background:#6b5a7d}
.disp{font:700 30px monospace;letter-spacing:10px;background:#0a1a0a;color:#6f6;padding:8px;border-radius:8px;margin-bottom:10px;min-height:52px}
.wheels{display:flex;gap:8px;justify-content:center;margin:8px 0}
.wheel{display:flex;flex-direction:column;gap:4px;width:58px}
.wheel button{height:40px;font-size:18px}
.wv{font:700 32px monospace;background:#e8dcc0;color:#222;border-radius:8px;padding:6px 0}
.lgrid{display:grid;grid-template-columns:repeat(3,70px);gap:10px;justify-content:center;margin:10px}
.lt{height:70px;min-width:44px;min-height:44px;border-radius:12px;border:3px solid #222;background:#2a2a2a;cursor:pointer}
.lt.on{background:radial-gradient(#fff6a0,#f5c400);box-shadow:0 0 18px #ffd000}
.close{margin-top:12px}
#win .box p{font-size:17px}
@media (max-height:520px){
.modal{padding:56px 8px 8px}
.box{padding:8px}
.box h2{font-size:16px;margin:0 0 4px}
.keys{gap:4px}
.keys button{height:40px;font-size:18px}
.disp{font-size:22px;min-height:36px;padding:4px;margin-bottom:6px;letter-spacing:6px}
.wheel button{height:40px}
.wv{font-size:22px;padding:2px 0}
.lgrid{grid-template-columns:repeat(3,48px);gap:6px;margin:6px}
.lt{height:48px}
.big{padding:8px 18px;font-size:16px;min-height:40px}
.close{margin-top:6px}
#title h1{font-size:32px}
#title p{font-size:14px;margin:4px 0}
}
body.overlay #top,body.overlay #game,body.overlay #title{display:none !important}
</style></head><body>
<canvas id="tbg"></canvas>
<a class="back" href="./index.html" aria-label="Back to menu" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">← Menu</a>
<div id="top"><div id="mid">Locked In</div><div id="tools"><button class="tb" id="hintB" style="display:none">💡 Hint</button><button class="tb" id="muteB">🔊</button></div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
// ---------- audio ----------
let AC=null,muted=LS.get('lockedin_mute',false);
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){const p=AC.resume();if(p&&p.catch)p.catch(()=>{})}return AC}
function tone(f,d,type,vol,slide,delay){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,vol){if(muted)return;const a=ac();if(!a)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=vol||.2;s.connect(g);g.connect(a.destination);s.start()}
const S={click:()=>tone(700,.05,'square',.06),pick:()=>{tone(660,.08,'triangle',.15);tone(990,.12,'triangle',.15,0,.07)},bad:()=>tone(160,.25,'sawtooth',.1,90),good:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.14,0,i*.08))},door:()=>{noise(.5,.25);tone(90,.6,'sine',.2,50)},key:()=>tone(1200,.04,'square',.05),swit:()=>{noise(.06,.3);tone(300,.05,'square',.08)},combine:()=>{tone(400,.1,'sine',.15,800);tone(800,.15,'triangle',.12,0,.1)},hint:()=>tone(880,.3,'sine',.1,1320)};
function setMute(m){muted=m;LS.set('lockedin_mute',m);$('muteB').textContent=m?'🔇':'🔊'}
$('muteB').onclick=()=>{setMute(!muted);if(!muted)S.click()};setMute(muted);
// ---------- items ----------
const ITEMS={
 key:{n:'Small brass key',d:(g)=>{g.fillStyle='#d4a017';g.beginPath();g.arc(12,22,7,0,7);g.fill();g.fillRect(17,20,20,5);g.fillRect(30,25,3,6);g.fillRect(35,25,3,5);g.fillStyle='#211a26';g.beginPath();g.arc(12,22,3,0,7);g.fill()}},
 flash:{n:'Flashlight (no batteries)',d:(g)=>{g.fillStyle='#555';g.fillRect(6,17,24,10);g.fillStyle='#777';g.beginPath();g.moveTo(30,14);g.lineTo(40,10);g.lineTo(40,34);g.lineTo(30,30);g.fill();g.fillStyle='#333';g.fillRect(14,15,4,3)}},
 batt:{n:'Batteries',d:(g)=>{for(let i=0;i<2;i++){g.fillStyle='#2b6';g.fillRect(8+i*14,10,10,26);g.fillStyle='#ccc';g.fillRect(10+i*14,7,6,4);g.fillStyle='#111';g.fillRect(8+i*14,26,10,10)}}},
 uv:{n:'UV flashlight',d:(g)=>{g.fillStyle='#4b2b7a';g.fillRect(6,17,24,10);g.fillStyle='#9d6bff';g.beginPath();g.moveTo(30,14);g.lineTo(40,10);g.lineTo(40,34);g.lineTo(30,30);g.fill();g.fillStyle='#d9b3ff';g.fillRect(39,12,3,20)}},
 screw:{n:'Screwdriver',d:(g)=>{g.save();g.translate(22,22);g.rotate(-.7);g.fillStyle='#d33';g.fillRect(-16,-5,14,10);g.fillStyle='#bbb';g.fillRect(-2,-2,18,4);g.restore()}},
 cardA:{n:'Keycard (left half)',d:(g)=>{g.fillStyle='#2a7de1';g.fillRect(8,12,16,22);g.fillStyle='#fff';g.fillRect(11,16,8,3);g.strokeStyle='#fff';g.setLineDash([2,2]);g.beginPath();g.moveTo(24,12);g.lineTo(24,34);g.stroke();g.setLineDash([])}},
 cardB:{n:'Keycard (right half)',d:(g)=>{g.fillStyle='#2a7de1';g.fillRect(20,12,16,22);g.fillStyle='#ffd166';g.fillRect(26,26,7,5);g.strokeStyle='#fff';g.setLineDash([2,2]);g.beginPath();g.moveTo(20,12);g.lineTo(20,34);g.stroke();g.setLineDash([])}},
 card:{n:'Repaired keycard',d:(g)=>{g.fillStyle='#2a7de1';g.fillRect(6,12,32,22);g.fillStyle='#fff';g.fillRect(9,16,10,3);g.fillStyle='#ffd166';g.fillRect(28,26,7,5);g.fillStyle='#ccc';g.fillRect(6,20,32,2)}},
 fuse:{n:'Glass fuse',d:(g)=>{g.fillStyle='#bbb';g.fillRect(6,17,7,10);g.fillRect(31,17,7,10);g.fillStyle='#bde3ff99';g.fillRect(13,18,18,8);g.strokeStyle='#c60';g.beginPath();g.moveTo(13,22);g.lineTo(31,22);g.stroke()}},
 mag:{n:'Magnifying glass',d:(g)=>{g.strokeStyle='#caa';g.lineWidth=4;g.beginPath();g.arc(18,18,10,0,7);g.stroke();g.fillStyle='#9cf6';g.fill();g.lineWidth=6;g.strokeStyle='#6b3e1f';g.beginPath();g.moveTo(26,26);g.lineTo(38,38);g.stroke();g.lineWidth=1}}
};
const COMBOS=[['flash','batt','uv','You slot the batteries in. It glows violet — a UV light!'],['cardA','cardB','card','You press the two halves together. The magnetic strip lines up!']];
// ---------- state ----------
let st,running=false,lastT=0;
function newState(){return{room:0,f:{},inv:[],sel:null,t:0,rt:[0,0,0],hints:0}}
const W=1000,H=600;
const cv=$('cv'),g=cv.getContext('2d');let scale=1;
function layout(){const topH=Math.ceil($('top').getBoundingClientRect().height)||56;$('game').style.top=topH+'px';$('title').style.top=topH+'px';const iw=innerWidth,ih=innerHeight-topH-34-70-10;let w=Math.min(iw-8,1000,ih*W/H);w=Math.max(200,w);const h=w*H/W;scale=w/W;const dpr=Math.min(devicePixelRatio||1,2);cv.style.width=w+'px';cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);g.setTransform(cv.width/W,0,0,cv.height/H,0,0);sizeTbg()}
addEventListener('resize',layout);
function say(t){$('msg').textContent=t}
function has(i){return st.inv.includes(i)}
function give(i,m){if(!has(i)){st.inv.push(i);S.pick();renderInv();say(m||('You got: '+ITEMS[i].n))}}
function take(i){st.inv=st.inv.filter(x=>x!==i);if(st.sel===i)st.sel=null;renderInv()}
function renderInv(){const el=$('inv');el.innerHTML='';const n=Math.max(6,st.inv.length);for(let k=0;k<n;k++){const it=st.inv[k];const d=document.createElement('div');d.className='slot'+(it&&st.sel===it?' sel':'');if(it){d.id='inv_'+it;d.title=ITEMS[it].n;const c=document.createElement('canvas');c.width=44;c.height=44;ITEMS[it].d(c.getContext('2d'));d.appendChild(c);d.onclick=()=>invClick(it)}el.appendChild(d)}}
function invClick(it){S.click();if(st.sel&&st.sel!==it){const c=COMBOS.find(c=>(c[0]===st.sel&&c[1]===it)||(c[1]===st.sel&&c[0]===it));if(c){take(c[0]);take(c[1]);st.inv.push(c[2]);st.sel=null;S.combine();renderInv();say(c[3]);return}S.bad();say("Those don't go together.");st.sel=null;renderInv();return}st.sel=st.sel===it?null:it;renderInv();say(st.sel?('Selected: '+ITEMS[it].n+'. Click something to use it, or another item to combine.'):'Deselected.')}
// ---------- drawing helpers ----------
function rr(x,y,w,h,r,fill,stroke){g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.stroke()}}
function lin(x0,y0,x1,y1,stops){const l=g.createLinearGradient(x0,y0,x1,y1);stops.forEach((s,i)=>l.addColorStop(i/(stops.length-1),s));return l}
function txt(t,x,y,size,col,font,align){g.font=(font||'bold ')+size+'px '+(font&&font.includes('mono')?'monospace':'Georgia');g.fillStyle=col;g.textAlign=align||'center';g.textBaseline='middle';g.fillText(t,x,y)}
function roomShell(wallA,wallB,floorA,floorB){g.fillStyle=lin(0,0,0,430,[wallA,wallB]);g.fillRect(0,0,W,430);for(let x=0;x<W;x+=50){g.fillStyle='rgba(0,0,0,.05)';g.fillRect(x,0,25,430)}g.fillStyle=lin(0,430,0,600,[floorA,floorB]);g.fillRect(0,430,W,170);g.strokeStyle='rgba(0,0,0,.25)';for(let i=0;i<12;i++){g.beginPath();g.moveTo(i*100-100,600);g.lineTo(i*90-40,430);g.stroke()}g.fillStyle='#2b1d12';g.fillRect(0,422,W,12)}
function door(x,y,open,col){g.fillStyle='#1a120c';g.fillRect(x-8,y-8,176,338);if(open){g.fillStyle=lin(x,y,x+160,y,['#000','#2a2420']);g.fillRect(x,y,160,330);g.fillStyle='#fff3';g.fillRect(x+10,y+10,140,310);txt('EXIT →',x+80,y+160,24,'#ffd166')}else{g.fillStyle=lin(x,y,x+160,y,[col||'#6b4226','#4a2c18']);g.fillRect(x,y,160,330);g.strokeStyle='#0004';g.lineWidth=3;g.strokeRect(x+18,y+20,124,130);g.strokeRect(x+18,y+175,124,135);g.lineWidth=1;g.fillStyle='#d4a017';g.beginPath();g.arc(x+140,y+170,7,0,7);g.fill()}}
// ---------- rooms ----------
function hsAt(list,x,y){for(let i=list.length-1;i>=0;i--){const h=list[i];if((!h.vis||h.vis())&&x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h)return h}return null}
function need(sel,item,ok,elseMsg){if(st.sel===item){st.sel=null;ok();renderInv();return true}if(st.sel){S.bad();say("That doesn't work here.");st.sel=null;renderInv();return true}say(elseMsg);return false}
const RD=[
{name:'The Study',
 draw(){const f=st.f;roomShell('#5a3d2e','#3b281e','#6e4a2c','#3d2816');
  // painting
  g.fillStyle='#8a6a1a';g.fillRect(230,70,210,160);g.fillStyle=lin(0,82,0,218,['#f6a04d','#4a6fa5']);g.fillRect(242,82,186,136);g.fillStyle='#2b4a6b';g.fillRect(242,180,186,38);g.fillStyle='#eee';g.fillRect(326,120,18,62);g.fillStyle='#c33';g.fillRect(326,130,18,8);g.fillRect(326,150,18,8);g.fillStyle='#ffe066';g.fillRect(324,110,22,12);g.fillStyle='#9d6bff';g.beginPath();g.arc(420,222,4,0,7);g.fill();
  if(f.uvSeen){g.fillStyle='#000b';g.fillRect(242,82,186,136);g.shadowColor='#c08bff';g.shadowBlur=18;txt('3  8  1  5',335,150,40,'#d9b3ff');g.shadowBlur=0}
  // bookshelf
  g.fillStyle='#4a2c18';g.fillRect(30,250,170,175);const cols=['#7a4','#36a','#a83','#555','#8a3a8a','#2a7','#3a6','#a63'];for(let s=0;s<3;s++){g.fillStyle='#2b1a0e';g.fillRect(38,258+s*56,154,48);for(let b=0;b<9;b++){const red=s===1&&b===5;g.fillStyle=red?(f.gotBatt?'#7a1515':'#e02020'):cols[(b+s*3)%8];g.fillRect(42+b*16,262+s*56+(b%3),13,44-(b%3))}}
  // desk
  g.fillStyle='#5b3a1e';g.fillRect(460,300,290,26);g.fillStyle='#4a2e18';g.fillRect(470,326,20,100);g.fillRect(720,326,20,100);g.fillRect(590,326,140,70);g.fillStyle=f.drawerOpen?'#1a0f08':'#6b4528';g.fillRect(600,336,120,50);g.fillStyle='#d4a017';g.fillRect(652,340,16,6);if(!f.drawerOpen){g.fillStyle='#111';g.fillRect(658,360,4,9)}
  if(f.drawerOpen&&!f.gotFlash){g.fillStyle='#666';g.fillRect(625,354,50,14);g.fillStyle='#888';g.fillRect(675,350,14,22)}
  g.fillStyle='#ffe06618';g.beginPath();g.moveTo(500,240);g.lineTo(560,240);g.lineTo(600,300);g.lineTo(460,300);g.fill();g.fillStyle='#2b6';g.beginPath();g.moveTo(500,240);g.lineTo(560,240);g.lineTo(545,205);g.lineTo(515,205);g.fill();g.fillStyle='#444';g.fillRect(526,240,8,60);
  // clock
  g.fillStyle='#e8dcc0';g.beginPath();g.arc(620,110,38,0,7);g.fill();g.strokeStyle='#5b3a1e';g.lineWidth=5;g.stroke();g.lineWidth=3;g.strokeStyle='#222';const a=st.t/10;g.beginPath();g.moveTo(620,110);g.lineTo(620+Math.sin(a)*28,110-Math.cos(a)*28);g.moveTo(620,110);g.lineTo(638,118);g.stroke();g.lineWidth=1;
  // rug
  if(!f.rug){g.fillStyle='#7a1f2b';g.beginPath();g.ellipse(430,510,170,50,0,0,7);g.fill();g.strokeStyle='#e0b04a';g.lineWidth=4;g.beginPath();g.ellipse(430,510,150,40,0,0,7);g.stroke();g.lineWidth=1}else{g.fillStyle='#7a1f2b';g.beginPath();g.ellipse(580,540,120,34,.1,0,7);g.fill();if(!f.gotKey){g.save();g.translate(380,488);g.scale(1.3,1.3);ITEMS.key.d(g);g.restore()}}
  door(800,92,f.doorOpen);rr(764,220,26,40,4,'#222','#888');for(let i=0;i<6;i++){g.fillStyle=f.doorOpen?'#6f6':'#999';g.fillRect(768+(i%2)*10,226+Math.floor(i/2)*10,7,7)}
 },
 hs:[
  {id:'rug',x:260,y:460,w:340,h:100,vis:()=>!st.f.rug,click(){st.f.rug=1;S.swit();say('You pull the rug aside... something glints on the floorboards.')}},
  {id:'key',x:370,y:480,w:70,h:50,vis:()=>st.f.rug&&!st.f.gotKey,click(){st.f.gotKey=1;give('key','A small brass key was hidden under the rug!')}},
  {id:'shelf',x:30,y:250,w:170,h:175,click(){say('Dusty books on rows of shelves. One red spine sticks out a little.')}},

 $('mbox').querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.textContent;S.key();if(k==='C'){v=''}else if(k==='✓'){if(v===code){closeModal();ok()}else{S.bad();d.style.color='#f55';setTimeout(()=>d.style.color='',400);v=''}}else if(v.length<4)v+=k;up()});$('mclose').onclick=closeModal}
function openLetters(title,n,code,ok){const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';const v=Array(n).fill(0);modal(`<h2>${title}</h2><div class="wheels">${v.map((_,i)=>`<div class="wheel"><button id="lu${i}">▲</button><div class="wv" id="lv${i}">A</div><button id="ld${i}">▼</button></div>`).join('')}</div><button class="big" id="ltry">Open</button><br><button class="tb close" id="mclose">Close</button>`);
