<script>

x.fillStyle=body;x.beginPath();x.ellipse(h.x,cy,r*.8,r*1.15,0,0,7);x.fill();if(m.t=='gold'){x.shadowColor='#ffd700';x.shadowBlur=25;x.fill();x.shadowBlur=0}
x.fillStyle=belly;x.beginPath();x.ellipse(h.x,cy+r*.35,r*.5,r*.6,0,0,7);x.fill();

x.fillStyle='#111';x.strokeStyle='#111';x.lineWidth=3;[-1,1].forEach(s=>{if(hit){x.beginPath();x.moveTo(h.x+s*r*.28-6,ey-6);x.lineTo(h.x+s*r*.28+6,ey+6);x.moveTo(h.x+s*r*.28+6,ey-6);x.lineTo(h.x+s*r*.28-6,ey+6);x.stroke()}else{x.beginPath();x.arc(h.x+s*r*.28,ey+2,r*.08,0,7);x.fill()}});
x.fillStyle='#ff7aa8';x.beginPath();x.ellipse(h.x,ey+r*.3,r*.15,r*.11,0,0,7);x.fill();x.fillStyle='#fff';x.fillRect(h.x-r*.12,ey+r*.42,r*.1,r*.15);x.fillRect(h.x+r*.02,ey+r*.42,r*.1,r*.15);
x.strokeStyle='rgba(0,0,0,.5)';x.lineWidth=1.5;[-1,1].forEach(s=>{for(let k=-1;k<=1;k++){x.beginPath();x.moveTo(h.x+s*r*.2,ey+r*.32);x.lineTo(h.x+s*r*.6,ey+r*.25+k*r*.1);x.stroke()}});
if(m.t=='helmet'&&m.hp>1){x.fillStyle='#9aa4ad';x.beginPath();x.ellipse(h.x,cy-r*.75,r*.85,r*.55,0,Math.PI,0);x.fill();x.fillStyle='#c5ced6';x.fillRect(h.x-r*.9,cy-r*.8,r*1.8,r*.14);x.fillStyle='#fff';x.globalAlpha=.4;x.beginPath();x.ellipse(h.x-r*.3,cy-r*1.05,r*.2,r*.1,-.4,0,7);x.fill();x.globalAlpha=1}
else if(m.t=='helmet'){x.fillStyle='#ffd34d';x.font='bold '+r*.4+'px system-ui';x.textAlign='center';x.fillText('★',h.x+r*.5,cy-r*.9)}
if(m.t=='gold'){x.fillStyle='#ffe066';x.beginPath();x.moveTo(h.x-r*.45,cy-r*.95);for(let i=0;i<5;i++){x.lineTo(h.x-r*.45+i*r*.225,cy-r*(i%2?1.05:1.35))}x.lineTo(h.x+r*.45,cy-r*.95);x.fill()}
x.restore()}
let last=performance.now(),tt=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(2,(now-last)/16.7);last=now;tt+=dt;
if(state=='play'&&!paused){time-=dt;if(time<=0){time=0;state='over';if(sc>best){best=sc;try{localStorage.setItem('arcade-mole-best',best)}catch(e){}}snd(330,.3,'triangle',.08,110)}
const prog=1-time/3600;spawnT-=dt;if(spawnT<=0){spawn();if(prog>.5&&Math.random()<.4)spawn();spawnT=Math.max(14,45-prog*30)*(.7+Math.random()*.6)}
for(const h of holes){const m=h.m;if(!m)continue;if(m.st=='rise'){m.up=Math.min(1,m.up+.12*dt);if(m.up>=1)m.st='stay'}else if(m.st=='stay'){m.stay-=dt;if(m.stay<=0)m.st='down'}else if(m.st=='down'){m.up-=.1*dt;if(m.up<=0){if(m.t!='bomb')combo=0;h.m=null}}else if(m.st=='hit'){m.hit-=dt;if(m.hit<=0){m.up-=.2*dt;if(m.up<=0)h.m=null}}}}
parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.35*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);pops.forEach(p=>{p.y-=1*dt;p.l-=dt});pops=pops.filter(p=>p.l>0);if(hammer.sw>0)hammer.sw-=dt;

x.fillStyle='#fff';[[.15,.06],[.55,.1],[.85,.05]].forEach(([a,b],i)=>{const cx=((a*W+tt*.3*(i+1))%(W+200))-100;x.beginPath();x.arc(cx,b*H,18,0,7);x.arc(cx+20,b*H-8,22,0,7);x.arc(cx+42,b*H,18,0,7);x.fill()});
x.fillStyle='#4f9a35';x.beginPath();x.moveTo(-20,H*.2);for(let i=0;i<=W+40;i+=40)x.lineTo(i,H*.17+Math.sin(i*.02)*8);x.lineTo(W+20,H*.2);x.fill();
const gr=x.createLinearGradient(0,H*.18,0,H);gr.addColorStop(0,'#6cc24a');gr.addColorStop(1,'#3d8a2a');x.fillStyle=gr;x.fillRect(-20,H*.18,W+40,H);
x.fillStyle='rgba(0,60,0,.25)';for(let i=0;i<70;i++){const gx=(i*137)%W,gy=H*.2+((i*89)%(H*.8));x.fillRect(gx,gy,2,7);x.fillRect(gx+4,gy+2,2,6)}
holes.forEach((h,i)=>{x.fillStyle='#6b4423';x.beginPath();x.ellipse(h.x,h.y+4,HR*1.25,HR*.5,0,0,7);x.fill();x.fillStyle='#1d0f05';x.beginPath();x.ellipse(h.x,h.y,HR*1.05,HR*.38,0,0,7);x.fill();
if(h.m)mole(h,h.m);x.fillStyle='#7a4f2a';x.beginPath();x.ellipse(h.x,h.y+2,HR*1.1,HR*.42,0,0,Math.PI);x.ellipse(h.x,h.y+HR*.18,HR*1.25,HR*.5,0,Math.PI,0,true);x.fill();
if(!touch){x.fillStyle='rgba(255,255,255,.55)';x.font='bold 13px system-ui';x.textAlign='center';x.fillText(keys[i].toUpperCase(),h.x,h.y+HR*.85)}});
parts.forEach(p=>{x.globalAlpha=p.l/40;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,4,0,7);x.fill()});x.globalAlpha=1;
x.textAlign='center';pops.forEach(p=>{x.globalAlpha=Math.min(1,p.l/20);x.fillStyle=p.c;x.strokeStyle='#000';x.lineWidth=4;x.font='900 '+HR*.45+'px system-ui';x.strokeText(p.t,p.x,p.y);x.fillText(p.t,p.x,p.y)});x.globalAlpha=1;
if(!touch||hammer.sw>0){x.save();x.translate(hammer.x,hammer.y);x.rotate(hammer.sw>0?-.2+(10-hammer.sw)*.0:-.7);const s=HR*.9;x.fillStyle='#8b5a2b';x.fillRect(s*.1,-s*.1,s*1.2,s*.2);x.fillStyle='#c0392b';x.beginPath();x.roundRect(-s*.35,-s*.35,s*.55,s*.7,6);x.fill();x.fillStyle='#e74c3c';x.fillRect(-s*.3,-s*.3,s*.15,s*.6);x.restore()}
x.restore();
x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.roundRect(10,56,190,60,12);x.fill();x.textAlign='left';x.fillStyle='#fff';x.font='900 24px system-ui';x.fillText(sc,22,86);x.fillStyle='#ffd700';x.font='bold 14px system-ui';x.fillText('BEST '+best,22,106);
if(combo>=5){x.fillStyle='#ffeb3b';x.font='bold 15px system-ui';x.fillText('x'+Math.min(5,1+Math.floor(combo/5))+' combo',110,106)}
const sec=Math.ceil(time/60);x.textAlign='center';x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.roundRect(W/2-55,10,110,40,12);x.fill();x.fillStyle=sec<=10&&(tt|0)%30<15?'#ff5252':'#fff';x.font='900 24px system-ui';x.fillText('⏱ '+sec,W/2,39);
const msg=(a,b,cc)=>{x.fillStyle='rgba(20,10,0,.75)';x.fillRect(0,H/2-85,W,170);x.fillStyle=cc||'#ffd700';x.font='900 44px system-ui';x.shadowColor='#000';x.shadowBlur=10;x.fillText(a,W/2,H/2-20);x.shadowBlur=0;x.fillStyle='#fff';x.font='16px system-ui';x.fillText(b[0],W/2,H/2+15);x.fillStyle='#ffe9a8';x.fillText(b[1]||'',W/2,H/2+42)};
if(state=='title')msg('WHACK-A-MOLE',[touch?'Tap to start, then tap the moles!':'Click to start. Click moles, or use Q W E / A S D / Z X C','Gold = +50 and +3s · Helmets need 2 hits · Bombs cost 5s']);
