"use strict";
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const $=id=>document.getElementById(id);
const GR=10.7;
const CLUBS=[{n:'Driver',d:255,loft:13},{n:'3 Wood',d:228,loft:16},{n:'5 Iron',d:190,loft:22},{n:'7 Iron',d:162,loft:28},{n:'9 Iron',d:135,loft:36},{n:'P Wedge',d:110,loft:44},{n:'S Wedge',d:80,loft:52},{n:'Putter',d:40,loft:0}];
const TER={green:{c:'#4fbf4f',mu:1.7,b:.22,lie:1,name:'Green'},fairway:{c:'#5aab3e',mu:4,b:.28,lie:1,name:'Fairway'},tee:{c:'#64b84a',mu:4,b:.28,lie:1,name:'Tee'},
 rough:{c:'#3a7d2c',mu:10,b:.14,lie:.82,name:'Rough'},sand:{c:'#e8d49c',mu:28,b:.05,lie:.65,name:'Bunker'},water:{name:'Water'},ob:{name:'Out of bounds'}};
const HOLES=[
 {par:4,path:[[0,0],[0,220],[25,385]],fw:38,gr:14,pin:[3,-3],slope:[.25,-.15],sand:[[-24,230,10,7],[42,368,9,6],[6,404,11,5]],water:[]},
 {par:3,path:[[0,0],[5,168]],fw:24,fwFrom:120,gr:13,pin:[-4,2],slope:[-.3,.2],sand:[[-19,172,7,5],[22,160,7,6]],water:[[2,82,46,24]]},
 {par:5,path:[[0,0],[0,250],[-70,390],[-95,515]],fw:40,gr:15,pin:[4,3],slope:[.1,-.35],sand:[[26,255,12,8],[-42,322,10,8],[-112,502,9,6],[-82,530,8,5]],water:[[-42,452,18,13]]},
 {par:4,path:[[0,0],[0,200],[60,330],[75,410]],fw:36,gr:14,pin:[-3,4],slope:[.35,.1],sand:[[96,396,8,8],[56,422,8,6]],water:[[50,228,28,38]]},
 {par:3,path:[[0,0],[-10,195]],fw:22,fwFrom:150,gr:14,pin:[5,-2],slope:[.2,.3],sand:[[-31,186,9,7],[11,202,8,8],[-12,174,12,4]],water:[]},
 {par:4,path:[[0,0],[0,360]],fw:36,gr:13,pin:[-2,3],slope:[-.25,-.25],sand:[[20,190,10,8],[-21,346,8,6],[18,370,8,6]],water:[[0,252,95,6]]},
 {par:5,path:[[0,0],[30,200],[-20,380],[10,545]],fw:38,gr:15,pin:[-4,-3],slope:[.3,-.2],sand:[[62,210,10,8],[-52,392,12,8],[-12,452,10,6],[30,541,8,6]],water:[[-38,292,18,14]]},
 {par:3,path:[[0,0],[0,140]],fw:0,gr:12,pin:[2,2],slope:[-.2,-.3],sand:[],water:[[0,137,32,30]],island:1},
 {par:4,path:[[0,0],[-10,230],[10,430]],fw:38,gr:15,pin:[-3,-4],slope:[.15,.35],sand:[[30,236,10,8],[-16,446,8,7],[29,421,7,6]],water:[[-58,300,20,88]]}];
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function segD(px,py,a,b){const vx=b[0]-a[0],vy=b[1]-a[1],l2=vx*vx+vy*vy;let t=((px-a[0])*vx+(py-a[1])*vy)/l2;t=Math.max(0,Math.min(1,t));return Math.hypot(a[0]+t*vx-px,a[1]+t*vy-py)}
function pathD(h,x,y){let d=1e9;for(let i=0;i<h.path.length-1;i++)d=Math.min(d,segD(x,y,h.path[i],h.path[i+1]));return d}
function pathLen(h){let l=0;for(let i=0;i<h.path.length-1;i++)l+=Math.hypot(h.path[i+1][0]-h.path[i][0],h.path[i+1][1]-h.path[i][1]);return l}
HOLES.forEach((h,i)=>{const g=h.path[h.path.length-1];h.g=g;h.cup=[g[0]+h.pin[0],g[1]+h.pin[1]];h.yds=Math.round(pathLen(h));
 let x0=1e9,x1=-1e9,y1=-1e9;h.path.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])});h.b={x0:x0-75,x1:x1+75,y0:-30,y1:y1+45};
 const r=rng(i*977+13);h.trees=[];const L=h.yds;
 for(let s=10;s<L-10;s+=13){const p=along(h,s);for(const side of[-1,1]){if(r()<.25)continue;const off=(h.fw||30)/2+14+r()*40;const tx=p.x+p.nx*off*side,ty=p.y+p.ny*off*side;
  if(Math.hypot(tx-h.g[0],ty-h.g[1])<h.gr+16)continue;if(h.water.some(w=>((tx-w[0])/(w[2]+8))**2+((ty-w[1])/(w[3]+8))**2<1))continue;if(ty<12&&Math.abs(tx)<20)continue;
  if(tx<h.b.x0+3||tx>h.b.x1-3)continue;h.trees.push([tx,ty,5+r()*4,11+r()*7])}}});
function along(h,s){for(let i=0;i<h.path.length-1;i++){const a=h.path[i],b=h.path[i+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(s<=l||i===h.path.length-2){const t=Math.min(1,s/l);const dx=(b[0]-a[0])/l,dy=(b[1]-a[1])/l;return{x:a[0]+dx*l*t,y:a[1]+dy*l*t,nx:dy,ny:-dx}}s-=l}}
function projS(h,x,y){let best=1e9,bs=0,acc=0;for(let i=0;i<h.path.length-1;i++){const a=h.path[i],b=h.path[i+1],vx=b[0]-a[0],vy=b[1]-a[1],l=Math.hypot(vx,vy);let t=((x-a[0])*vx+(y-a[1])*vy)/(l*l);t=Math.max(0,Math.min(1,t));const d=Math.hypot(a[0]+t*vx-x,a[1]+t*vy-y);if(d<best){best=d;bs=acc+t*l}acc+=l}return bs}
function onGreen(h,x,y){const dx=(x-h.g[0])/(h.gr*1.15),dy=(y-h.g[1])/(h.gr*.92);return dx*dx+dy*dy<=1}
function terrain(h,x,y){if(x<h.b.x0||x>h.b.x1||y<h.b.y0||y>h.b.y1)return'ob';if(onGreen(h,x,y))return'green';if(Math.abs(x)<6&&Math.abs(y)<5)return'tee';
 if(h.island&&Math.hypot(x-h.g[0],y-h.g[1])<h.gr+4)return'fairway';for(const w of h.water)if(((x-w[0])/w[2])**2+((y-w[1])/w[3])**2<=1)return'water';
 for(const s of h.sand)if(((x-s[0])/s[2])**2+((y-s[1])/s[3])**2<=1)return'sand';
 if(h.fw&&y>=(h.fwFrom||25)&&pathD(h,x,y)<=h.fw/2)return'fairway';if(h.island&&Math.hypot(x-h.g[0],y-h.g[1])<h.gr+4)return'fairway';return'rough'}
function slope(h,x,y){return[h.slope[0]+.18*Math.sin((y-h.g[1])/5),h.slope[1]+.18*Math.cos((x-h.g[0])/5)]}
// ---------- audio ----------
let muted=store.get('gs_mute',false),AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){const p=AC.resume();if(p&&p.catch)p.catch(()=>{})}return AC}
function tone(f,d,type,v,f2,delay){if(muted)return;const a=ac();if(!a)return;const t0=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(v||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d+.02)}
function noise(d,v,fc,type,delay){if(muted)return;const a=ac();if(!a)return;const b=a.createBuffer(1,Math.max(1,a.sampleRate*d|0),a.sampleRate),da=b.getChannelData(0);for(let i=0;i<da.length;i++)da[i]=(Math.random()*2-1)*(1-i/da.length);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=fc||2000;const g=a.createGain();g.gain.value=v||.3;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+(delay||0))}
let headless=false;
function sfx(t){if(headless)return;switch(t){case'hit':noise(.08,.6,4000,'highpass');tone(900,.08,'triangle',.15,300);break;case'putt':tone(600,.06,'sine',.2,500);break;case'whoosh':noise(.3,.25,1200,'bandpass');break;
 case'land':noise(.1,.2,500);break;case'sand':noise(.3,.3,700);break;case'splash':noise(.6,.45,1100);tone(300,.3,'sine',.08,90);break;case'tree':tone(180,.12,'square',.12,90);noise(.25,.2,2500,'highpass');break;
 case'cup':[0,.07,.13].forEach(d=>tone(1200,.05,'triangle',.12,900,d));for(let i=0;i<6;i++)noise(.25,.12,3000,'bandpass',.3+i*.08);break;
 case'birdie':[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.13,0,i*.11));break;case'bad':tone(220,.35,'sawtooth',.06,140);break;case'click':tone(650,.04,'square',.04);break}}
// ---------- state ----------
let hi=0,H=HOLES[0],scores=[],strokes=0,ball={x:0,y:0,z:0,vx:0,vy:0,vz:0},prev={x:0,y:0},phase='aim',aim=0,club=0,spin={x:0,y:0},wind={x:0,y:0,mph:0},power=0,charging=false,chT=0,trail=[],flightT=0,lastLand=null;
const cv=$('c'),cx=cv.getContext('2d');let W=0,Hh=0,DPR=1;let cam={x:0,y:0,s:3};let off=null,PX=3;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;Hh=innerHeight;cv.width=W*DPR;cv.height=Hh*DPR;cv.style.width=W+'px';cv.style.height=Hh+'px'}
function rnd(){return Math.random()}
function startHole(i){hi=i;H=HOLES[i];strokes=0;ball={x:0,y:-1,z:0,vx:0,vy:0,vz:0};prev={x:0,y:-1};phase='aim';trail=[];spin={x:0,y:0};setSpinDot();
 const a=rnd()*Math.PI*2,m=Math.round(rnd()*14);wind={mph:m,x:Math.sin(a)*m,y:Math.cos(a)*m,a};if(!headless){renderHole();drawWind()}autoAim();autoClub();snapCam();updInfo();saveRound();if(!headless)flash('Hole '+(i+1)+' · Par '+H.par,1600)}
function toPin(){return Math.hypot(H.cup[0]-ball.x,H.cup[1]-ball.y)}
function lieT(){return terrain(H,ball.x,ball.y)}
function autoAim(){const d=toPin();let t;if(d<250||lieT()==='green')t={x:H.cup[0],y:H.cup[1]};else{const s=projS(H,ball.x,ball.y);t=along(H,Math.min(H.yds,s+235))}aim=Math.atan2(t.x-ball.x,t.y-ball.y)}
function lieF(c){const t=lieT();if(t==='sand'&&CLUBS[c].n==='S Wedge')return .9;return TER[t]?TER[t].lie||1:1}
function autoClub(){if(lieT()==='green'){club=7;updClub();return}const d=toPin()*.93;club=6;for(let c=0;c<7;c++){if(c===0&&lieT()!=='tee')continue;if(CLUBS[c].d*lieF(c)<d){club=Math.max(0,c-1);if(club===0&&lieT()!=='tee')club=1;break}club=c}updClub()}
function updClub(){const C=CLUBS[club];$('club').innerHTML='<b>'+C.n+'</b>'+Math.round(C.d*(club===7?1:lieF(club)))+' yd'}
function updInfo(){const sc=total();$('info').innerHTML='<b>Hole '+(hi+1)+'</b> · Par '+H.par+' · '+H.yds+' yd<br>Stroke '+(strokes+1)+' · '+Math.round(toPin())+' yd to pin<br>Lie: '+(TER[lieT()]||{name:'?'}).name+' · Total '+fmtPar(sc)}
function total(){let s=0;scores.forEach((v,i)=>{if(v!=null)s+=v-HOLES[i].par});return s}
function fmtPar(v){return v===0?'E':v>0?'+'+v:''+v}
let msgT=0;function flash(t,ms){const e=$('msg');e.textContent=t;e.style.opacity=1;clearTimeout(msgT);msgT=setTimeout(()=>e.style.opacity=0,ms||1400)}
function saveRound(){store.set('gs_round',{hi,scores})}
// ---------- shot physics ----------
function shoot(p){if(phase!=='aim')return;p=Math.max(.03,Math.min(1,p));prev={x:ball.x,y:ball.y};strokes++;const C=CLUBS[club];trail=[];flightT=0;lastLand=null;
 const dx=Math.sin(aim),dy=Math.cos(aim);
 if(club===7){const D=C.d*p;const v=Math.sqrt(2*TER.green.mu*D)*(lieT()==='green'?1:1.6);ball.vx=dx*v;ball.vy=dy*v;ball.vz=0;ball.z=0;phase='roll';sfx('putt')}
 else{const D=C.d*p*lieF(club)*(headless?1:1+(rnd()-.5)*.03);const th=C.loft*Math.PI/180;const v=Math.sqrt(D*GR/Math.sin(2*th));const vh=v*Math.cos(th);const err=headless?0:(rnd()-.5)*.02*(lieT()==='rough'?2:1);
  ball.vx=Math.sin(aim+err)*vh;ball.vy=Math.cos(aim+err)*vh;ball.vz=v*Math.sin(th);ball.z=0;phase='fly';sfx('hit');sfx('whoosh')}
 ball.spin={x:spin.x,y:spin.y};}
function step(dt){const b=ball;
 if(phase==='fly'){flightT+=dt;const sp=Math.hypot(b.vx,b.vy)||1;b.vx+=(wind.x*.06+(-b.vy/sp)*b.spin.x*-1.3)*dt*(b.z>1?1:0);b.vy+=(wind.y*.06+(b.vx/sp)*b.spin.x*-1.3)*dt*(b.z>1?1:0);
  b.vz-=GR*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;if(trail.length===0||flightT-trail[trail.length-1].t>.04)trail.push({x:b.x,y:b.y,z:b.z,t:flightT});
  for(const t of H.trees){if(b.z<t[3]&&Math.hypot(b.x-t[0],b.y-t[1])<t[2]*.75&&!b.treeHit){b.treeHit=1;b.vx*=-.15;b.vy*=-.15;b.vz=Math.min(b.vz,0);sfx('tree');if(!headless)flash('Timber!',900)}}
  if(b.z<=0){b.z=0;const t=terrain(H,b.x,b.y);if(t==='water'||t==='ob'){penalty(t);return}
   if(t==='green'&&Math.hypot(b.x-H.cup[0],b.y-H.cup[1])<.25){holed();return}
   const T=TER[t];const hk=Math.max(0,Math.min(1,T.b*(1+.45*b.spin.y)));b.vx*=hk;b.vy*=hk;
   if(!lastLand){lastLand=1;if(b.spin.y<-.3&&(t==='green'||t==='fairway')){b.vx*=1+b.spin.y*.9;b.vy*=1+b.spin.y*.9}}
