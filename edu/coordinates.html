<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Grid Quest</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#0a1426;color:#eef;font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;user-select:none}
#top{position:absolute;top:0;left:0;right:0;height:40px;display:flex;align-items:center;gap:6px;padding:0 8px;background:#0008;z-index:3}
#top a,#top button{color:#fff;background:#283070;border:0;border-radius:8px;padding:6px 10px;font-size:13px;text-decoration:none;cursor:pointer;white-space:nowrap}
#title{flex:1;font-weight:800;white-space:nowrap;overflow:hidden}#title b{color:#ffcf5a}#st{font-size:13px;white-space:nowrap}
canvas{position:absolute;top:40px;left:0;touch-action:none}
.btn{background:linear-gradient(#ffb340,#e07a10);color:#fff;border:0;border-radius:12px;padding:9px 13px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #8a4a00;margin:3px}
.btn:active{transform:translateY(2px)}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#ov>div{background:#121a4a;border:2px solid #ffcf5a;border-radius:16px;padding:12px 16px;text-align:center;max-width:96%;max-height:94%;overflow:auto}
#ov h2{margin:4px 0}#ov p{margin:6px 0;font-size:14px}
.lv{display:inline-block;margin:3px;padding:5px 8px;border-radius:8px;background:#283070;font-size:13px;cursor:pointer;min-width:120px}
.lv:hover{background:#e07a10}.lv.lock{opacity:.45;cursor:default}.stars{font-size:34px;color:#ffd54a}
.lv small,span.lv small{font-size:13px!important}</style></head><body>
<div id="top"><a id="lz" href="./index.html">◀ Learning Lab</a><a id="menu" href="../index.html">🏠</a><div id="title">🧭 Grid <b>Quest</b></div><span id="st"></span><button id="lvB">Levels</button><button id="pB">⏸</button><button id="mu">🔊</button></div>
<canvas id="c"></canvas><div id="ov"><div id="ovc"></div></div>
<script>
const SAVEKEY='gridQuestSave',TITLE='🧭 Grid Quest',INTRO='Plot points, read coordinates in all four quadrants, follow compass directions and grid references, then sink the CPU fleet!';

// shared skeleton injected into both games
const $=id=>document.getElementById(id);
const cv=$('c'),cx=cv.getContext('2d');let W=0,H=0,DPR=1;
let save={mute:false,stars:{},unlocked:1};
try{const s=JSON.parse(localStorage.getItem(SAVEKEY)||'null');if(s)save=Object.assign(save,s)}catch(e){}
function persist(){try{localStorage.setItem(SAVEKEY,JSON.stringify(save))}catch(e){}}
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=0.12,t='sine',v=0.15,dl=0){if(save.mute)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;const s=a.currentTime+dl;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(0.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+0.02)}
const sfx={ok(){tone(660,.1,'triangle');tone(990,.15,'triangle',.15,.08)},bad(){tone(200,.25,'sawtooth',.08)},tap(){tone(500,.05,'square',.05)},win(){[523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.15,i*.12))}};
function resize(){DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight-40;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';cx.setTransform(DPR,0,0,DPR,0,0)}
function rr(x,y,w,h,r){cx.beginPath();cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h)}
function txt(s,x,y,sz,col='#fff',al='center',wt='700'){cx.font=wt+' '+sz+'px system-ui,Segoe UI,Roboto,sans-serif';cx.fillStyle=col;cx.textAlign=al;cx.textBaseline='middle';cx.fillText(s,x,y)}
function fit(s,maxw,sz){cx.font='700 '+sz+'px system-ui';while(sz>9&&cx.measureText(s).width>maxw){sz--;cx.font='700 '+sz+'px system-ui'}return sz}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(a){return a[Math.random()*a.length|0]}
let paused=false,btns=[];
function hit(x,y){for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.f();return true}}return false}
function ptr(e){ac();if(paused||$('ov').style.display==='flex')return;const r=cv.getBoundingClientRect();const p=e.changedTouches?e.changedTouches[0]:e;onTap(p.clientX-r.left,p.clientY-r.top)}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ptr(e)});
function ov(html){$('ovc').innerHTML=html;$('ov').style.display=html?'flex':'none'}
function setPause(p){if($('ov').style.display==='flex'&&!paused)return;paused=p;$('pB').textContent=p?'▶':'⏸';ov(p?'<h2>⏸ Paused</h2><p>Press P or tap to resume. R restarts the level.</p><button class="btn" onclick="setPause(false)">▶ Resume</button> <button class="btn" onclick="setPause(false);restart()">↻ Restart</button>':'')}
$('pB').onclick=()=>setPause(!paused);
$('mu').textContent=save.mute?'🔇':'🔊';$('mu').onclick=()=>{save.mute=!save.mute;$('mu').textContent=save.mute?'🔇':'🔊';persist()};
$('lvB').onclick=()=>{paused=false;showLevels()};
function starStr(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function showLevels(){let h='<h2>'+TITLE+'</h2><p>'+INTRO+'</p>';LV.forEach((L,i)=>{const ok=i<save.unlocked;h+='<span class="lv'+(ok?'':' lock')+'" data-lv="'+i+'" '+(ok?'onclick="startLevel('+i+')"':'')+'>'+(ok?'':'🔒 ')+(i+1)+'. '+L.name+'<br><small>'+starStr(save.stars[i]||0)+'</small></span>'});h+='<p><small>Keys: 1-4 choose · P pause · R restart · M mute</small></p>';ov(h)}
function finishLevel(stars){sfx.win();const i=cur;save.stars[i]=Math.max(save.stars[i]||0,stars);save.unlocked=Math.max(save.unlocked,Math.min(LV.length,i+2));persist();
 ov('<h2>Level complete!</h2><div class="stars">'+starStr(stars)+'</div><p>'+LV[i].name+'</p>'+(i+1<LV.length?'<button class="btn" id="nextB" onclick="startLevel('+(i+1)+')">Next level ▶</button> ':'')+'<button class="btn" onclick="restart()">↻ Replay</button> <button class="btn" onclick="showLevels()">Levels</button>')}
function restart(){ov('');startLevel(cur)}
addEventListener('keydown',e=>{const k=e.key;if(k==='p'||k==='P'){setPause(!paused);return}if(paused)return;if($('ov').style.display==='flex'){if(k==='Enter'&&$('nextB'))$('nextB').click();return}
 if(keyTyping()&&k.length===1&&k!=='p'&&k!=='P'){onKey(e);return}
 if(k==='r'||k==='R'){restart();return}if(k==='m'||k==='M'){$('mu').click();return}onKey(e)});
addEventListener('resize',()=>{resize();draw()});
const LV=[
{name:'Plot points (Quadrant I)',t:['plot'],r:[0,8]},
{name:'Read points (Quadrant I)',t:['read'],r:[0,8]},
{name:'Four quadrants: plot',t:['plot'],r:[-6,6]},
{name:'Four quadrants: read',t:['read'],r:[-6,6]},
{name:'Name the quadrant',t:['quad'],r:[-6,6]},
{name:'Compass moves',t:['move'],r:[-6,6]},
{name:'Map grid references',t:['ref']},
{name:'Treasure hunt',t:['hunt'],legs:1},
{name:'Battle: Rookie CPU',battle:1,smart:false},
{name:'Mirror moves',t:['reflect'],r:[-6,6]},
{name:'Mixed challenge',t:['plot','read','quad','move'],r:[-6,6]},
{name:'Long treasure hunt',t:['hunt'],legs:3},
{name:'Battle: Admiral CPU',battle:1,smart:true},
{name:'Grand Quest',t:['plot','read','reflect','move','ref','hunt','quad'],r:[-6,6],legs:2}];
const NQ=8,COLS='ABCDEFGH',LM=[['palm tree','tree'],['hut','hut'],['rock','rock'],['lake','lake'],['boat','boat'],['cave','cave'],['volcano','volc'],['flag','flag']];
const DIRS={north:[0,1],south:[0,-1],east:[1,0],west:[-1,0]};
let cur=0,qi=0,miss=0,Q=null,msg='',msgCol='#fff',mark=null,landmarks=[],B=null,lock=false;
function fmt(x,y){return '('+x+', '+y+')'}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function gref(c,r){return COLS[c]+(r+1)}
function placeLandmarks(){const cells=shuffle([...Array(48).keys()]);landmarks=LM.map((l,i)=>({n:l[0],k:l[1],c:cells[i]%8,r:Math.floor(cells[i]/8)}))}
function quadOf(x,y){if(x===0||y===0)return 'On an axis';return x>0?(y>0?'Quadrant I':'Quadrant IV'):(y>0?'Quadrant II':'Quadrant III')}
function makeQ(){const L=LV[cur],t=pick(L.t),r=L.r||[-6,6];let lo=r[0],hi=r[1],q={t,lo,hi};
 const rp=()=>{let x,y;do{x=ri(lo,hi);y=ri(lo,hi)}while(lo<0&&(x===0||y===0)&&Math.random()<.85);return[x,y]};
 if(t==='plot'){const[x,y]=rp();Object.assign(q,{ax:x,ay:y,text:'Tap the point '+fmt(x,y),hint:'x first (across), then y (up/down).'})}
 else if(t==='read'||t==='quad'){const[x,y]=rp();q.px=x;q.py=y;
  if(t==='read'){const a=fmt(x,y),s=new Set([a]);const c=[fmt(y,x),fmt(-x,y),fmt(x,-y),fmt(-x,-y),fmt(x+1,y),fmt(x,y-1)];for(const o of shuffle(c))if(s.size<4)s.add(o);q.opts=shuffle([...s]);q.ans=a;q.text='What are the coordinates of the star?';q.hint='Read across to x first, then up or down to y.'}
  else{q.opts=['Quadrant I','Quadrant II','Quadrant III','Quadrant IV'];if(x===0||y===0)q.opts[ri(0,3)]='On an axis';q.ans=quadOf(x,y);if(!q.opts.includes(q.ans))q.opts[0]=q.ans;q.text='Which quadrant is the star in?';q.hint='I is top-right, then II, III, IV going anticlockwise.'}}
 else if(t==='move'){let sx,sy,ex,ey,d1,d2,n1,n2;do{sx=ri(-4,4);sy=ri(-4,4);d1=pick(['north','south','east','west']);d2=pick(d1==='north'||d1==='south'?['east','west']:['north','south']);n1=ri(1,5);n2=ri(1,5);ex=sx+DIRS[d1][0]*n1+DIRS[d2][0]*n2;ey=sy+DIRS[d1][1]*n1+DIRS[d2][1]*n2}while(ex<lo||ex>hi||ey<lo||ey>hi);
  Object.assign(q,{sx,sy,ax:ex,ay:ey,text:'Start at '+fmt(sx,sy)+'. Move '+n1+' '+d1+', then '+n2+' '+d2+'. Tap where you end.',hint:'North = up (+y), south = down, east = right (+x), west = left.'})}
 else if(t==='reflect'){const[x,y]=rp();const ax=pick(['x','y']);Object.assign(q,{px:x,py:y,ax:ax==='x'?x:-x,ay:ax==='x'?-y:y,text:'Reflect the star '+fmt(x,y)+' over the '+ax+'-axis. Tap its mirror image.',hint:ax==='x'?'Over the x-axis: x stays, y changes sign.':'Over the y-axis: y stays, x changes sign.'})}
 else if(t==='ref'){const l=pick(landmarks);q.lm=l;q.ans=gref(l.c,l.r);const s=new Set([q.ans]);while(s.size<4)s.add(gref(Math.max(0,Math.min(7,l.c+ri(-2,2))),Math.max(0,Math.min(5,l.r+ri(-2,2)))));q.opts=shuffle([...s]);q.text='What is the grid reference of the '+l.n+'?';q.hint='Letter across the bottom first, then number up the side.'}
 else if(t==='hunt'){const legs=L.legs||1;let ok=false,tries=0;while(!ok&&tries++<200){const l=pick(landmarks);let c=l.c,r=l.r,steps=[];for(let i=0;i<legs;i++){const d=pick(Object.keys(DIRS)),n=ri(1,3);c+=DIRS[d][0]*n;r+=DIRS[d][1]*n;steps.push(n+' '+d)}if(c>=0&&c<8&&r>=0&&r<6&&!(c===l.c&&r===l.r)){ok=true;Object.assign(q,{lm:l,ac:c,ar:r,text:'Start at the '+l.n+' ('+gref(l.c,l.r)+'). Walk '+steps.join(', then ')+'. Tap the treasure square!',hint:'Each step is one square. North is up, east is right.'})}}}
 return q}
function startLevel(i){ov('');paused=false;cur=i;qi=0;miss=0;msg='';mark=null;lock=false;placeLandmarks();B=null;if(LV[i].battle)initBattle();else Q=makeQ();draw()}
function keyTyping(){return false}
// ---------- layout ----------
function planeBox(){const sz=Math.min(H-16,W*0.56);return{x:8,y:(H-sz)/2,s:sz}}
function g2s(x,y,q){const b=planeBox(),n=q.hi-q.lo,m=22,st=(b.s-2*m)/n;return[b.x+m+(x-q.lo)*st,b.y+m+(q.hi-y)*st,st]}
function s2g(px,py,q){const b=planeBox(),n=q.hi-q.lo,m=22,st=(b.s-2*m)/n;return[Math.round((px-b.x-m)/st)+q.lo,q.hi-Math.round((py-b.y-m)/st)]}
function mapBox(){const b=planeBox(),cs=Math.min((b.s-30)/6,(b.s+40-30)/8);return{x:b.x+24,y:b.y+4,cs}}
function cellXY(c,r){const m=mapBox();return[m.x+c*m.cs,m.y+(5-r)*m.cs,m.cs]}
// ---------- drawing ----------
function drawPlane(q,o={}){const b=planeBox();cx.fillStyle='#0f2a1f';rr(b.x,b.y,b.s,b.s,12);cx.fill();
 for(let v=q.lo;v<=q.hi;v++){const[a,ay]=g2s(v,q.lo,q),[,by]=g2s(v,q.hi,q),[ax2,cyy]=g2s(q.lo,v,q),[bx2]=g2s(q.hi,v,q);cx.strokeStyle=v===0?'#ffffffcc':'#ffffff22';cx.lineWidth=v===0?2:1;cx.beginPath();cx.moveTo(a,ay);cx.lineTo(a,by);cx.moveTo(ax2,cyy);cx.lineTo(bx2,cyy);cx.stroke()}
 const z=Math.max(q.lo,Math.min(0,q.hi)),st=g2s(0,0,q)[2],fs=Math.min(11,st*.55);
 for(let v=q.lo;v<=q.hi;v++){if(v===0&&q.lo<0)continue;const[x,y]=g2s(v,z,q);txt(v,x,y+fs+2,fs,'#9fd');const[x2,y2]=g2s(z,v,q);if(v!==0)txt(v,x2-fs-1,y2,fs,'#9fd')}
 const[ox,oy]=g2s(q.hi,z,q);txt('x',ox+12,oy,13,'#ffcf5a');const[yx,yy]=g2s(z,q.hi,q);txt('y',yx,yy-13,13,'#ffcf5a');
 if(q.lo<0){const c=['II','I','III','IV'],p=[[-1,1],[1,1],[-1,-1],[1,-1]];p.forEach((pp,i)=>{const[x,y]=g2s(pp[0]*q.hi*.75,pp[1]*q.hi*.75,q);txt(c[i],x,y,16,'#ffffff30')})}}
function star(x,y,r,col){cx.fillStyle=col;cx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rd=i%2?r*.45:r;cx.lineTo(x+Math.cos(a)*rd,y+Math.sin(a)*rd)}cx.fill()}
function dot(x,y,col,r=6){cx.fillStyle=col;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill()}
function icon(k,x,y,s){cx.save();cx.translate(x+s/2,y+s/2);const u=s/40;cx.scale(u,u);
 if(k==='tree'){cx.fillStyle='#7a4a1c';cx.fillRect(-2,-2,4,16);cx.fillStyle='#3c3';for(let i=0;i<5;i++){cx.beginPath();cx.ellipse(Math.cos(i*1.25)*7,-5+Math.sin(i*1.25)*3,9,3,i*1.25,0,7);cx.fill()}}
 if(k==='hut'){cx.fillStyle='#c84';cx.fillRect(-10,-2,20,14);cx.fillStyle='#a52';cx.beginPath();cx.moveTo(-14,-2);cx.lineTo(0,-14);cx.lineTo(14,-2);cx.fill();cx.fillStyle='#420';cx.fillRect(-3,4,6,8)}
 if(k==='rock'){cx.fillStyle='#999';cx.beginPath();cx.moveTo(-13,10);cx.lineTo(-8,-6);cx.lineTo(4,-10);cx.lineTo(13,10);cx.fill()}
 if(k==='lake'){cx.fillStyle='#39f';cx.beginPath();cx.ellipse(0,2,15,9,0,0,7);cx.fill()}
 if(k==='boat'){cx.fillStyle='#853';cx.beginPath();cx.moveTo(-14,4);cx.lineTo(14,4);cx.lineTo(9,11);cx.lineTo(-9,11);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.moveTo(0,2);cx.lineTo(0,-14);cx.lineTo(10,2);cx.fill()}
 if(k==='cave'){cx.fillStyle='#776';cx.beginPath();cx.arc(0,10,14,Math.PI,0);cx.fill();cx.fillStyle='#111';cx.beginPath();cx.arc(0,10,7,Math.PI,0);cx.fill()}
 if(k==='volc'){cx.fillStyle='#753';cx.beginPath();cx.moveTo(-15,12);cx.lineTo(-4,-8);cx.lineTo(4,-8);cx.lineTo(15,12);cx.fill();cx.fillStyle='#f50';cx.beginPath();cx.arc(0,-10,5,0,7);cx.fill()}
 if(k==='flag'){cx.fillStyle='#ddd';cx.fillRect(-6,-14,2,26);cx.fillStyle='#e33';cx.beginPath();cx.moveTo(-4,-14);cx.lineTo(10,-9);cx.lineTo(-4,-4);cx.fill()}
 if(k==='x'){cx.strokeStyle='#ff0';cx.lineWidth=5;cx.beginPath();cx.moveTo(-10,-10);cx.lineTo(10,10);cx.moveTo(10,-10);cx.lineTo(-10,10);cx.stroke()}
 cx.restore()}
function drawMap(){const m=mapBox();cx.fillStyle='#e8d6a0';rr(m.x-4,m.y-4,m.cs*8+8,m.cs*6+8,8);cx.fill();
 for(let c=0;c<8;c++)for(let r=0;r<6;r++){const[x,y,s]=cellXY(c,r);cx.fillStyle=(c+r)%2?'#cfe8a8':'#bfe09a';cx.fillRect(x,y,s,s);cx.strokeStyle='#6a5';cx.strokeRect(x,y,s,s)}
 for(let c=0;c<8;c++){const[x,y,s]=cellXY(c,0);txt(COLS[c],x+s/2,y+s+11,13,'#ffcf5a')}for(let r=0;r<6;r++){const[x,y,s]=cellXY(0,r);txt(r+1,x-12,y+s/2,13,'#ffcf5a')}
 landmarks.forEach(l=>{const[x,y,s]=cellXY(l.c,l.r);icon(l.k,x,y,s)});
 const[nx,ny]=cellXY(7,5);txt('N▲',nx+m.cs+16,ny+8,12,'#fff')}
function optBtns(opts,x,y,w,cb){const bw=(w-8)/2,bh=44;opts.forEach((o,i)=>{const bx=x+(i%2)*(bw+8),by=y+Math.floor(i/2)*(bh+8);const st=Q&&Q.picked===o;cx.fillStyle=st?(o===Q.ans?'#2a8a3a':'#a33'):'#283070';rr(bx,by,bw,bh,10);cx.fill();txt((i+1)+'  '+o,bx+bw/2,by+bh/2,fit((i+1)+'  '+o,bw-10,16));btns.push({x:bx,y:by,w:bw,h:bh,f:()=>choose(o)})})}
function wrap(s,x,y,w,sz,col){cx.font='700 '+sz+'px system-ui';const ws=s.split(' ');let line='',yy=y;for(const wd of ws){const t=line?line+' '+wd:wd;if(cx.measureText(t).width>w&&line){txt(line,x,yy,sz,col,'left');line=wd;yy+=sz+5}else line=t}txt(line,x,yy,sz,col,'left');return yy+sz+5}
function draw(){btns=[];cx.clearRect(0,0,W,H);const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#10203a');g.addColorStop(1,'#0a1426');cx.fillStyle=g;cx.fillRect(0,0,W,H);
 $('st').textContent='Lv '+(cur+1)+(B?'':' · Q '+Math.min(qi+1,NQ)+'/'+NQ+' · ✗'+miss);
 if(B)return drawBattle();
 const q=Q,b=planeBox(),px=b.x+b.s+14,pw=W-px-10;
 if(q.t==='ref'||q.t==='hunt'){drawMap();if(mark){const[x,y,s]=cellXY(mark.c,mark.r);cx.strokeStyle=mark.ok?'#3f3':'#f33';cx.lineWidth=3;cx.strokeRect(x+2,y+2,s-4,s-4);if(mark.ok)icon('x',x,y,s)}}
 else{drawPlane(q);if(q.px!==undefined){const[x,y]=g2s(q.px,q.py,q);star(x,y,10,'#ffd54a')}if(q.sx!==undefined){const[x,y]=g2s(q.sx,q.sy,q);dot(x,y,'#4cf',7);txt('start',x,y-14,11,'#4cf')}
  if(mark){const[x,y]=g2s(mark.x,mark.y,q);dot(x,y,mark.ok?'#3f3':'#f44',7);if(!mark.ok){const[ax,ay]=g2s(q.ax,q.ay,q);cx.strokeStyle='#3f3';cx.lineWidth=2;cx.beginPath();cx.arc(ax,ay,9,0,7);cx.stroke()}}}
 txt(LV[cur].name,px,14,13,'#ffcf5a','left');let yy=wrap(q.text,px,40,pw,Math.min(18,Math.max(13,pw/18)),'#fff');
 if(q.opts)optBtns(q.opts,px,yy+4,pw);
 if(msg){wrap(msg,px,H-46,pw,14,msgCol)}else wrap('💡 '+q.hint,px,H-40,pw,12,'#9ab')}
function next(){mark=null;msg='';lock=false;qi++;if(qi>=NQ){finishLevel(miss===0?3:miss<=2?2:1);return}Q=makeQ();draw()}
function judge(ok,info){if(ok){sfx.ok();msg='✔ Correct! '+(info||'');msgCol='#7f7'}else{sfx.bad();miss++;msg='✘ Not quite. '+(info||'');msgCol='#f99'}lock=true;draw();setTimeout(next,ok?700:1500)}
function choose(o){if(lock)return;Q.picked=o;judge(o===Q.ans,'Answer: '+Q.ans)}
function onTap(x,y){if(B)return battleTap(x,y);if(hit(x,y)||lock)return;const q=Q;
 if(q.t==='ref'||q.t==='hunt'){if(q.t!=='hunt')return;const m=mapBox(),c=Math.floor((x-m.x)/m.cs),r=5-Math.floor((y-m.y)/m.cs);if(c<0||c>7||r<0||r>5)return;const ok=c===q.ac&&r===q.ar;mark={c,r,ok};judge(ok,'Treasure was at '+gref(q.ac,q.ar))}
 else if(q.ax!==undefined){const[gx,gy]=s2g(x,y,q);if(gx<q.lo||gx>q.hi||gy<q.lo||gy>q.hi)return;const ok=gx===q.ax&&gy===q.ay;mark={x:gx,y:gy,ok};judge(ok,'You tapped '+fmt(gx,gy)+(ok?'':', answer '+fmt(q.ax,q.ay)))}}
function onKey(e){if(B)return;const n=+e.key;if(Q&&Q.opts&&n>=1&&n<=Q.opts.length)choose(Q.opts[n-1])}
// ---------- battle ----------
function placeFleet(){const sh=[];const occ=new Set();for(const len of [3,2,2]){let ok=false;while(!ok){const h=Math.random()<.5,x=ri(-4,h?4-len+1:4),y=ri(-4,h?4:4-len+1);const cells=[];for(let i=0;i<len;i++)cells.push((h?x+i:x)+','+(h?y:y+i));if(cells.every(c=>!occ.has(c))){cells.forEach(c=>occ.add(c));sh.push({cells,hit:0});ok=true}}}return{ships:sh,occ,shots:new Set()}}
function initBattle(){B={cpu:placeFleet(),me:placeFleet(),turn:'me',myShots:0,log:'Your turn: tap a point on the CPU\'s sea to fire!',q:{lo:-4,hi:4},targets:[],over:false};Q=null}
function shoot(f,key){f.shots.add(key);if(f.occ.has(key)){const s=f.ships.find(s=>s.cells.includes(key));s.hit++;return s.hit===s.cells.length?'sunk':'hit'}return 'miss'}
function alive(f){return f.ships.some(s=>s.hit<s.cells.length)}
function battleTap(x,y){if(B.over||B.turn!=='me'||lock)return;const[gx,gy]=s2g(x,y,B.q);if(gx<-4||gx>4||gy<-4||gy>4)return;const k=gx+','+gy;if(B.cpu.shots.has(k)){B.log='You already fired at '+fmt(gx,gy)+'.';draw();return}
 B.myShots++;const r=shoot(B.cpu,k);r==='miss'?sfx.tap():sfx.ok();B.log='You fired at '+fmt(gx,gy)+': '+r.toUpperCase()+'!';
 if(!alive(B.cpu)){B.over=true;draw();const s=B.myShots<=30?3:B.myShots<=45?2:1;setTimeout(()=>finishLevel(s),600);return}
 B.turn='cpu';draw();lock=true;setTimeout(cpuTurn,650)}
function cpuTurn(){if(paused){setTimeout(cpuTurn,300);return}lock=false;const f=B.me;let k;
 if(LV[cur].smart){while(B.targets.length&&f.shots.has(B.targets[0]))B.targets.shift();k=B.targets.shift()}
 if(!k){do{k=ri(-4,4)+','+ri(-4,4)}while(f.shots.has(k)||(LV[cur].smart&&((+k.split(',')[0]+ +k.split(',')[1])%2!==0)&&Math.random()<.8))}
 const r=shoot(f,k);const[a,b]=k.split(',').map(Number);if(r!=='miss'){sfx.bad();if(LV[cur].smart)[[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{const nx=a+d[0],ny=b+d[1];if(Math.abs(nx)<=4&&Math.abs(ny)<=4)B.targets.push(nx+','+ny)})}
 B.log+='  CPU fired at '+fmt(a,b)+': '+r.toUpperCase()+'.';
 if(!alive(f)){B.over=true;draw();setTimeout(()=>ov('<h2>The CPU sank your fleet!</h2><p>Tip: after a hit, try the points next to it.</p><button class="btn" onclick="restart()">↻ Try again</button> <button class="btn" onclick="showLevels()">Levels</button>'),600);return}
 B.turn='me';draw()}
function drawBattle(){const q=B.q;drawPlane(q);const st=g2s(0,0,q)[2];
 B.cpu.shots.forEach(k=>{const[a,b]=k.split(',').map(Number),[x,y]=g2s(a,b,q);if(B.cpu.occ.has(k)){dot(x,y,'#f50',st*.35);}else dot(x,y,'#8af8',st*.2)});
 if(B.over)B.cpu.ships.forEach(s=>s.cells.forEach(k=>{const[a,b]=k.split(',').map(Number),[x,y]=g2s(a,b,q);cx.strokeStyle='#ff0';cx.strokeRect(x-st*.4,y-st*.4,st*.8,st*.8)}));
 const b=planeBox(),px=b.x+b.s+14,pw=W-px-10;txt(LV[cur].name+' · shots: '+B.myShots,px,14,13,'#ffcf5a','left');
 let yy=wrap(B.turn==='me'?'🎯 Your turn — fire at a coordinate!':'🤖 CPU is aiming…',px,36,pw,15,'#fff');yy=wrap(B.log,px,yy,pw,12,'#cde');
 const ms=Math.min(pw,H-yy-30),cs=ms/9,ox=px,oy=yy+4;cx.fillStyle='#0d2240';cx.fillRect(ox,oy,ms,ms);txt('Your fleet',ox+ms/2,oy+ms+10,11,'#9ab');
 for(let a=-4;a<=4;a++)for(let c=-4;c<=4;c++){const k=a+','+c,x=ox+(a+4)*cs,y=oy+(4-c)*cs;cx.strokeStyle='#ffffff18';cx.strokeRect(x,y,cs,cs);if(B.me.occ.has(k)){cx.fillStyle='#889';cx.fillRect(x+1,y+1,cs-2,cs-2)}if(B.me.shots.has(k)){dot(x+cs/2,y+cs/2,B.me.occ.has(k)?'#f50':'#8af',cs*.3)}}
 const left=B.cpu.ships.filter(s=>s.hit<s.cells.length).length;txt('CPU ships left: '+left+'/3',px+pw,14,12,'#f9a','right')}
window.GQ={get Q(){return Q},get B(){return B},g2s,cellXY,get cur(){return cur}};
resize();cur=0;placeLandmarks();Q=makeQ();draw();showLevels();
</script></body></html>
