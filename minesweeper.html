<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Minefield</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0b14;color:#f4f1ea;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:44px 8px 8px;user-select:none;touch-action:manipulation}
a.back{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:30;box-sizing:border-box;display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(8,8,16,.82);color:#ffe14d;border:1px solid rgba(255,225,77,.55);font:700 12px/1 ui-monospace,monospace;letter-spacing:.04em;text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a.back:focus-visible{outline:2px solid #ffe14d;outline-offset:2px}
.hud{margin:0;font:700 12px/1.25 ui-monospace,monospace;color:#c8c4d8;text-align:center;flex:0 0 auto}
.stage{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{border-radius:12px;max-width:100%;max-height:100%;width:auto;height:auto;touch-action:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(560px,100%);flex:0 0 auto}
button{min-height:40px;min-width:44px;padding:0 12px;border-radius:10px;border:1px solid #3a3358;background:#171426;color:#ffe14d;font:700 15px/1 ui-monospace,monospace;touch-action:manipulation}
button.on{background:#ffe14d;color:#0b0b14}
#c{background:#16301c}
</style>
</head>
<body data-state="ready">
<a class="back" href="./index.html" aria-label="Back to menu" onpointerdown="event.stopPropagation()" ontouchstart="event.stopPropagation()">← Menu</a>
<p class="hud">Minefield · Score <span id="score">0</span> · Best <span id="best">0</span><br>Tap to reveal · long-press or Flag · arrows + Space · P pause · R restart</p>
<div class="stage"><canvas id="c" width="324" height="324"></canvas></div>
<div class="bar">
<button type="button" id="flag">Flag</button>
<button type="button" id="pause">Pause</button>
<button type="button" id="restart">Restart</button>
</div>
<script>
"use strict";
const N=9,MINES=10,CS=36,cv=document.getElementById("c"),ctx=cv.getContext("2d");
const NUM=["#9fd3ff","#7ad07a","#ff6b6b","#7a6bff","#e07040","#3ec8c0","#111","#888"];
let grid,score=0,best=0,state="ready",paused=false,cursor={x:0,y:0},flagMode=false,planted=false,won=false,hold=0,held=false,down=null;
function loadBest(){try{return +localStorage.getItem("arcade-mine-best")||0}catch(e){return 0}}
function saveBest(){try{if(score>best){best=score;localStorage.setItem("arcade-mine-best",String(best))}}catch(e){}}
best=loadBest();
function beep(f,d){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!beep.ac)beep.ac=new AC();const a=beep.ac;if(a.state==="suspended")a.resume();const o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function sync(){document.body.dataset.state=state;document.getElementById("score").textContent=score;document.getElementById("best").textContent=best;document.getElementById("flag").classList.toggle("on",flagMode)}
function fresh(){grid=Array.from({length:N},()=>Array.from({length:N},()=>({mine:false,open:false,flag:false,n:0})));score=0;planted=false;won=false;cursor={x:0,y:0};sync()}
function plant(sx,sy){let left=MINES,guard=0;while(left&&guard++<5000){const x=Math.random()*N|0,y=Math.random()*N|0;if(grid[y][x].mine)continue;if(Math.abs(x-sx)<=1&&Math.abs(y-sy)<=1)continue;grid[y][x].mine=true;left--}for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(grid[y][x].mine)continue;let c=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const yy=y+j,xx=x+i;if(grid[yy]&&grid[yy][xx]&&grid[yy][xx].mine)c++}grid[y][x].n=c}planted=true}
function flood(x,y){const cell=grid[y]&&grid[y][x];if(!cell||cell.open||cell.flag||cell.mine)return;cell.open=true;if(cell.n===0)for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)if(i||j)flood(x+i,y+j)}
function opened(){let n=0;for(const row of grid)for(const c of row)if(c.open)n++;return n}
function cleared(){for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!grid[y][x].mine&&!grid[y][x].open)return false;return true}
function reveal(x,y){if(state!=="play"||paused)return;const cell=grid[y]&&grid[y][x];if(!cell||cell.open||cell.flag)return;if(!planted)plant(x,y);if(cell.mine){cell.open=true;state="over";won=false;saveBest();beep(120,.2);sync();return}flood(x,y);score=opened();saveBest();beep(520,.03);if(cleared()){score+=100;saveBest();won=true;state="over";beep(880,.12)}sync()}
function toggleFlag(x,y){if(state!=="play"||paused)return;const cell=grid[y]&&grid[y][x];if(!cell||cell.open)return;cell.flag=!cell.flag;beep(300,.03)}
function start(){if(state==="play")return;state="play";paused=false;fresh();beep(480,.05)}
function cellAt(e){const r=cv.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*N),y=Math.floor((e.clientY-r.top)/r.height*N);if(x<0||y<0||x>=N||y>=N)return null;return {x,y}}
function draw(){ctx.fillStyle="#16301c";ctx.fillRect(0,0,cv.width,cv.height);if(!grid)return;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=grid[y][x],px=x*CS,py=y*CS;ctx.fillStyle=c.open?(c.mine?"#6a2020":"#d7efe0"):"#2f6a3e";ctx.fillRect(px+1,py+1,CS-2,CS-2);ctx.fillStyle="#143";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";if(c.open&&c.mine)ctx.fillText("•",px+CS/2,py+CS/2);else if(c.open&&c.n){ctx.fillStyle=NUM[c.n-1];ctx.fillText(String(c.n),px+CS/2,py+CS/2)}else if(c.flag){ctx.fillStyle="#ffe14d";ctx.fillText("⚑",px+CS/2,py+CS/2)}if(state==="play"&&cursor.x===x&&cursor.y===y){ctx.strokeStyle="#fff";ctx.strokeRect(px+2,py+2,CS-4,CS-4)}}ctx.textBaseline="alphabetic";ctx.fillStyle="#fff";ctx.font="bold 16px sans-serif";if(state==="ready")ctx.fillText("Tap a cell to start",cv.width/2,cv.height/2);if(paused&&state==="play")ctx.fillText("Paused",cv.width/2,24);if(state==="over")ctx.fillText(won?"Field cleared":"Boom",cv.width/2,24)}
addEventListener("keydown",e=>{const k=e.key;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(k))e.preventDefault();if(state!=="play"&&(k==="Enter"||k===" ")){start();return}if(k==="ArrowUp"||k==="w"||k==="W")cursor.y=Math.max(0,cursor.y-1);else if(k==="ArrowDown"||k==="s"||k==="S")cursor.y=Math.min(N-1,cursor.y+1);else if(k==="ArrowLeft"||k==="a"||k==="A")cursor.x=Math.max(0,cursor.x-1);else if(k==="ArrowRight"||k==="d"||k==="D")cursor.x=Math.min(N-1,cursor.x+1);else if(k===" "||k==="Enter")reveal(cursor.x,cursor.y);else if(k==="f"||k==="F")toggleFlag(cursor.x,cursor.y);else if(k==="p"||k==="P"||k==="Escape"){if(state==="play")paused=!paused}else if(k==="r"||k==="R"){state="ready";start()}});
document.getElementById("flag").addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();if(state!=="play")start();flagMode=!flagMode;sync()});
document.getElementById("pause").addEventListener("pointerdown",e=>{e.preventDefault();if(state==="play")paused=!paused});
document.getElementById("restart").addEventListener("pointerdown",e=>{e.preventDefault();state="ready";start()});
cv.addEventListener("pointerdown",e=>{if(state!=="play")start();if(state!=="play"||paused)return;down=cellAt(e);held=false;clearTimeout(hold);hold=setTimeout(()=>{held=true;if(down)toggleFlag(down.x,down.y)},450)});
cv.addEventListener("pointerup",e=>{clearTimeout(hold);if(state!=="play"||!down||held){held=false;return}const cell=cellAt(e)||down;if(flagMode||e.button===2)toggleFlag(cell.x,cell.y);else reveal(cell.x,cell.y);down=null});
cv.addEventListener("pointerleave",()=>clearTimeout(hold));
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("touchstart",e=>{e.preventDefault();if(state!=="play")start()},{passive:false});
function loop(){requestAnimationFrame(loop);draw()}
fresh();requestAnimationFrame(loop);
</script>
</body>
</html>
