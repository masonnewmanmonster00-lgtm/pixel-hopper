<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snake</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0b14;color:#f4f1ea;font-family:Segoe UI,system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:54px 12px 12px;user-select:none;touch-action:manipulation}
a.back{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:20;box-sizing:border-box;display:inline-flex;align-items:center;min-height:40px;padding:0 10px;border-radius:999px;background:rgba(8,8,16,.72);color:#ffe14d;border:1px solid rgba(255,225,77,.5);font:700 12px/1 ui-monospace,monospace;text-decoration:none;touch-action:manipulation}
canvas{background:#10141c;border-radius:12px;max-width:96vw;max-height:calc(100dvh - 168px);width:auto;height:auto;touch-action:none}
.hud{font:700 13px/1.4 ui-monospace,monospace;color:#c8c4d8;text-align:center}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(420px,100%)}
button{min-height:44px;min-width:44px;padding:0 12px;border-radius:10px;border:1px solid #3a3358;background:#171426;color:#ffe14d;font:700 16px/1 ui-monospace,monospace;touch-action:manipulation}
</style>
</head>
<body data-state="ready">
<a class="back" href="./index.html" aria-label="Back to menu" onpointerdown="event.stopPropagation()" ontouchstart="event.stopPropagation()">← Menu</a>
<p class="hud">Score <span id="score">0</span> · Best <span id="best">0</span><br>Arrows or buttons · P pause · R restart</p>
<canvas id="c" width="360" height="360"></canvas>
<div class="bar">
<button type="button" data-act="up" aria-label="Up">↑</button>
<button type="button" data-act="left" aria-label="Left">←</button>
<button type="button" data-act="down" aria-label="Down">↓</button>
<button type="button" data-act="right" aria-label="Right">→</button>
<button type="button" data-act="pause">Pause</button>
<button type="button" data-act="restart">Restart</button>
</div>
<script>
"use strict";
const COLS=20,ROWS=20,CELL=18,cv=document.getElementById("c"),ctx=cv.getContext("2d");
const scoreEl=document.getElementById("score"),bestEl=document.getElementById("best");
let state="ready",snake,dir,queue,food,score=0,best=0,acc=0,paused=false,prev=0;
function loadBest(){try{return +localStorage.getItem("arcade-snake-best")||0}catch(e){return 0}}
function saveBest(){try{if(score>best){best=score;localStorage.setItem("arcade-snake-best",String(best))}}catch(e){}}
best=loadBest();
function beep(f,d){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!beep.ac)beep.ac=new AC();const a=beep.ac;if(a.state==="suspended")a.resume();const o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function sync(){document.body.dataset.state=state;scoreEl.textContent=score;bestEl.textContent=best}
function placeFood(){do{food={x:Math.random()*COLS|0,y:Math.random()*ROWS|0}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function reset(){snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir={x:1,y:0};queue={x:1,y:0};score=0;paused=false;placeFood();sync()}
function start(){if(state==="play")return;state="play";reset();beep(520,.06)}
function setDir(x,y){if(state!=="play")start();if(queue.x+x===0&&queue.y+y===0)return;queue={x,y}}
function step(){dir=queue;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=COLS||h.y>=ROWS||snake.some(s=>s.x===h.x&&s.y===h.y)){state="over";saveBest();beep(120,.18);sync();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;saveBest();beep(680,.05);placeFood()}else snake.pop();sync()}
function draw(){ctx.fillStyle="#10141c";ctx.fillRect(0,0,cv.width,cv.height);snake.forEach((s,i)=>{ctx.fillStyle=i?"#1fbf62":"#eafff2";ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2)});ctx.fillStyle="#ffe14d";ctx.beginPath();ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-3,0,7);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 16px sans-serif";ctx.textAlign="center";if(state==="ready")ctx.fillText("Enter or tap to start",cv.width/2,cv.height/2);if(state==="over")ctx.fillText("Crashed · Enter restarts",cv.width/2,cv.height/2);if(paused&&state==="play")ctx.fillText("Paused",cv.width/2,cv.height/2)}
function act(name){if(name==="pause"){if(state==="play")paused=!paused;return}if(name==="restart"){state="ready";start();return}if(name==="up")setDir(0,-1);if(name==="down")setDir(0,1);if(name==="left")setDir(-1,0);if(name==="right")setDir(1,0)}
addEventListener("keydown",e=>{const k=e.key;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(k))e.preventDefault();if(k==="ArrowUp"||k==="w"||k==="W")setDir(0,-1);else if(k==="ArrowDown"||k==="s"||k==="S")setDir(0,1);else if(k==="ArrowLeft"||k==="a"||k==="A")setDir(-1,0);else if(k==="ArrowRight"||k==="d"||k==="D")setDir(1,0);else if(k==="Enter"||k===" ")start();else if(k==="p"||k==="P"||k==="Escape"){if(state==="play")paused=!paused}else if(k==="r"||k==="R"){state="ready";start()}});
document.querySelectorAll("button").forEach(b=>{const go=e=>{e.preventDefault();e.stopPropagation();act(b.dataset.act)};b.addEventListener("pointerdown",go)});
cv.addEventListener("touchstart",e=>{e.preventDefault();if(state!=="play")start()},{passive:false});
cv.addEventListener("pointerdown",e=>{if(e.pointerType==="touch"&&state!=="play")start()});
function loop(t){requestAnimationFrame(loop);if(!prev)prev=t;const dt=t-prev;prev=t;if(state==="play"&&!paused){acc+=dt;while(acc>130){step();acc-=130}}draw()}
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
