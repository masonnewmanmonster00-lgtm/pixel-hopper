function siteScale(){return .45} // piece size in site-width units
function buildMask(){const oc=document.createElement("canvas");oc.width=GC*4;oc.height=GR*4;const o=oc.getContext("2d"),sv=cx;
 cxSwap(o,()=>{S.pieces.forEach(pc=>drawPiece(pc.p,pc.sx*GC*4,pc.sy*GR*4,siteScale()*GC*4,pc.sr,"#fff"))});const im=o.getImageData(0,0,GC*4,GR*4).data;
 S.mask=new Uint8Array(GC*GR);S.boneN=0;for(let y=0;y<GR;y++)for(let x=0;x<GC;x++){let hit=0;for(let j=0;j<4;j++)for(let i=0;i<4;i++)if(im[((y*4+j)*GC*4+x*4+i)*4+3]>100)hit++;if(hit>=3){S.mask[y*GC+x]=1;S.boneN++}}}
function cxSwap(o,fn){const old=cx;CX=o;fn();CX=null}
let CX=null;
function exposed(){let n=0;for(let i=0;i<GC*GR;i++)if(S.mask[i]&&S.grid[i]<=0)n++;return S.boneN?n/S.boneN:1}
function dig(gx,gy,tool){if(S.phase!=="dig")return;let did=false;
 if(tool==="brush"){const r=1.6;for(let y=Math.floor(gy-r);y<=gy+r;y++)for(let x=Math.floor(gx-r);x<=gx+r;x++){if(x<0||y<0||x>=GC||y>=GR)continue;const d=Math.hypot(x+.5-gx,y+.5-gy);if(d>r)continue;const i=y*GC+x;if(S.grid[i]>0&&S.grid[i]<=2){S.grid[i]=Math.max(0,S.grid[i]-.22);did=true}else if(S.grid[i]>2&&!S.msg.startsWith("🪨")){S.msg="🪨 Rock! Switch to the chisel to crack it."}}if(did)brushS()}
 else{const r=1.9;let cr=false;for(let y=Math.floor(gy-r);y<=gy+r;y++)for(let x=Math.floor(gx-r);x<=gx+r;x++){if(x<0||y<0||x>=GC||y>=GR)continue;if(Math.hypot(x+.5-gx,y+.5-gy)>r)continue;const i=y*GC+x;const before=S.grid[i];if(before<=0)continue;if(S.mask[i]&&before<=1.5&&!S.crack[i]){S.crack[i]=1;S.dmg++;cr=true}S.grid[i]=Math.max(0,before-1.5)}
  if(cr){crackS();S.msg="💥 Crack! The chisel hit bone. Use the brush near fossils."}else chiselS()}
 if(exposed()>=.92){S.phase="assemble";for(let i=0;i<GC*GR;i++)if(S.mask[i])S.grid[i]=0;good();S.msg="";setTimeout(()=>{if(S.phase==="assemble")toAssemble()},900);renderUI()}
 hud()}
function toAssemble(){S.phase="build";const b=asmGeom();S.pieces.forEach(pc=>{pc.placed=false;pc.tx=b.tx+Math.random()*b.tw;pc.ty=b.ty+Math.random()*b.th;pc.rot=0});S.sel=0;renderUI();hud()}
function asmGeom(){const a=siteBox(),s=Math.min(a.w*.62,a.h/.62);return{x:a.x+8,y:a.y+(a.h-s*.6)/2,s,tx:a.x+s+40,ty:a.y+30,tw:Math.max(20,a.w-s-90),th:Math.max(20,a.h-60)}}
function targetOf(pc){const g=asmGeom();return[g.x+pc.p.cx*g.s,g.y+pc.p.cy*g.s]}
function drop(pc){const[tx,ty]=targetOf(pc),g=asmGeom();if(Math.hypot(pc.tx-tx,pc.ty-ty)<g.s*.07){pc.placed=true;pc.tx=tx;pc.ty=ty;snd(520,.08);setTimeout(()=>snd(780,.1),70);S.msg="✔ "+pc.p.n+" placed!";if(S.pieces.every(p=>p.placed))setTimeout(finishDig,500)}else{S.msg="That doesn't fit there – look at the faint outline.";snd(200,.1,"triangle",.06)}hud()}
function finishDig(){if(S.screen!=="play"||S.phase!=="build")return;S.phase="done";const st=S.dmg===0?3:S.dmg<=4?2:1,d=D[S.li];save.dug[d.id]=1;save.stars[d.id]=Math.max(save.stars[d.id]||0,st);store();snd(523,.12);setTimeout(()=>snd(659,.12),120);setTimeout(()=>snd(784,.3),240);
 $("opts").innerHTML="";$("q").innerHTML="";showOv(`<h2>🦴 ${d.n} assembled!</h2><div class="stars">${"★".repeat(st)}${"☆".repeat(3-st)}</div><p>${S.dmg} crack${S.dmg===1?"":"s"} • ${Math.round(S.time)}s • Added to your museum!</p>${factCard(d)}<br>`+(S.li<D.length-1?`<button class="btn" id="nx">Next dig ▶</button> `:"")+`<button class="btn" id="again">↺ Dig again</button> <button class="btn" id="mus">🏛 Museum</button>`);
 if($("nx"))$("nx").onclick=()=>startDig(S.li+1);$("again").onclick=()=>startDig(S.li);$("mus").onclick=museum}
function factCard(d){return `<div class="card"><b>${d.n}</b> – ${d.kind}<br>🕰 <b>Period:</b> ${d.when}<br>🍽 <b>Diet:</b> ${d.diet}<br>📏 <b>Size:</b> ${d.size}<br>🌍 <b>Found:</b> ${d.where}<br>💡 ${d.fact}</div>`}
// ---------- quizzes
function qMake(t){const d=pick(D);if(t==="mix")t=pick(["per","diet","dino","where","when"]);
 if(t==="per")return{q:`In which period did <b>${d.n}</b> live?`,o:["Triassic","Jurassic","Cretaceous"],a:d.per,why:d.n+": "+d.when+"."};
 if(t==="diet")return{q:`Was <b>${d.n}</b> a plant eater or a meat eater?`,o:["Herbivore","Carnivore"],a:d.diet,why:d.n+" was a "+d.diet.toLowerCase()+". "+d.fact};
 if(t==="dino")return{q:`Is <b>${d.n}</b> a dinosaur?`,o:["Yes, a dinosaur","No, another reptile"],a:d.kind.startsWith("Dinosaur")?"Yes, a dinosaur":"No, another reptile",why:d.n+": "+d.kind+"."};
 if(t==="where"){const o=shuf([d.where,...shuf([...new Set(D.map(x=>x.where).filter(w=>w!==d.where))]).slice(0,2)]);return{q:`Where have <b>${d.n}</b> fossils been found?`,o,a:d.where,why:d.n+": "+d.where+"."}}
 const p=pick(PERIODS);return{q:`When was the <b>${p[0]}</b> period?`,o:PERIODS.map(x=>x[1]),a:p[1],why:p[0]+": "+p[1]+". "+p[2]}}
function startQuiz(i){S.screen="play";S.phase="quiz";S.paused=false;S.time=0;S.dmg=0;S.msg="";S.quiz={i,n:0,k:10,ok:0,miss:0,cur:qMake(QZ[i].t)};$("ov").style.display="none";renderUI();hud()}
function answer(j,b){const Q=S.quiz;if(Q.lock||S.paused)return;const c=Q.cur;if(c.o[j]===c.a){Q.lock=true;b.classList.add("good");good();S.msg="✔ "+c.why;setTimeout(()=>{Q.lock=false;Q.n++;if(Q.n>=Q.k)finishQuiz();else{Q.cur=qMake(QZ[Q.i].t);renderUI()}},1300)}else{b.classList.add("bad");b.disabled=true;Q.miss++;bad();S.msg="✘ Not quite. "+c.why}hud()}
function finishQuiz(){const Q=S.quiz,st=Q.miss===0?3:Q.miss<=2?2:1;save.quiz[Q.i]=Math.max(save.quiz[Q.i]||0,st);store();S.phase="done";$("opts").innerHTML="";$("q").innerHTML="";
 showOv(`<h2>${QZ[Q.i].n} complete!</h2><div class="stars">${"★".repeat(st)}${"☆".repeat(3-st)}</div><p>${Q.miss} mistake${Q.miss===1?"":"s"}</p><button class="btn" id="again">↺ Again</button> <button class="btn" id="lvl">Sites</button>`);$("again").onclick=()=>startQuiz(Q.i);$("lvl").onclick=menu}
// ---------- UI
function renderUI(){const o=$("opts");o.innerHTML="";const q=$("q");
 if(S.phase==="dig"){q.innerHTML=`Dig site ${S.li+1}: uncover the hidden fossil! <b>Brush</b> soil, <b>chisel</b> rock.`;[["brush","🖌 Brush (B)"],["chisel","⛏ Chisel (C)"]].forEach(([t,l])=>{const b=document.createElement("button");b.className="btn"+(S.tool===t?" on":"");b.id="t_"+t;b.textContent=l;b.onclick=()=>{S.tool=t;renderUI()};o.appendChild(b)});const s=document.createElement("button");s.className="btn";s.id="scanB";s.textContent="📡 Scan ("+S.scans+")";s.onclick=()=>{if(S.scans>0&&!S.paused){S.scans--;S.scan=1.6;snd(400,.4,"sine",.06,1200);renderUI()}};o.appendChild(s)}
 else if(S.phase==="assemble")q.innerHTML="All bones found! Packing them for the lab…";
 else if(S.phase==="build")q.innerHTML="Drag each bone onto the faint outline to rebuild the skeleton.";
 else if(S.phase==="quiz"){const c=S.quiz.cur;q.innerHTML=c.q;c.o.forEach((t,j)=>{const b=document.createElement("button");b.className="btn";b.textContent=t;b.dataset.j=j;b.onclick=()=>answer(j,b);o.appendChild(b)})}
 else q.innerHTML=""}
function hud(){const e=$("st");if(S.screen!=="play"){e.textContent=`🦴 ${Object.keys(save.dug).length}/${D.length}`;return}
 if(S.phase==="quiz")e.textContent=`Q ${Math.min(S.quiz.n+1,S.quiz.k)}/${S.quiz.k} • ❌${S.quiz.miss}`;else e.textContent=`Site ${S.li+1} • ${Math.round(exposed()*100)}% found • 💥${S.dmg} • ${S.time.toFixed(0)}s`}
function showOv(h){$("ovc").innerHTML=h;$("ov").style.display="flex"}
function menu(){S.screen="menu";S.phase="";S.paused=false;$("opts").innerHTML="";$("q").innerHTML="";
 const stars=D.reduce((a,d)=>a+(save.stars[d.id]||0),0)+Object.values(save.quiz).reduce((a,b)=>a+b,0);
 showOv(`<h2 style="margin:4px">🦖 Dino Dig</h2><div style="font-size:13px">Excavate fossils, rebuild skeletons, fill your museum! ⭐ ${stars}/${(D.length+QZ.length)*3}</div><h3>Dig sites</h3>`+D.map((d,i)=>`<span class="lv" data-i="${i}">${i+1}. ${save.dug[d.id]?d.n:"??? ("+d.per+")"}<br><small>${"★".repeat(save.stars[d.id]||0)}${"☆".repeat(3-(save.stars[d.id]||0))}</small></span>`).join("")+`<h3>Quizzes</h3>`+QZ.map((z,i)=>`<span class="lv" data-q="${i}">${z.n}<br><small>${"★".repeat(save.quiz[i]||0)}${"☆".repeat(3-(save.quiz[i]||0))}</small></span>`).join("")+`<p style="font-size:12px;opacity:.7">Keys: B brush • C chisel • arrows + Space dig • P pause • R restart • M mute</p>`);
 document.querySelectorAll(".lv[data-i]").forEach(e=>e.onclick=()=>startDig(+e.dataset.i));document.querySelectorAll(".lv[data-q]").forEach(e=>e.onclick=()=>startQuiz(+e.dataset.q));hud()}
function museum(){S.screen="museum";S.phase="";S.paused=false;hud();$("opts").innerHTML="";$("q").innerHTML="";
 showOv(`<h2 style="margin:4px">🏛 Your Museum (${Object.keys(save.dug).length}/${D.length})</h2><div class="card" style="font-size:12px">`+PERIODS.map(p=>`<b>${p[0]}</b> ${p[1]}: ${p[2]}`).join("<br>")+`</div>`+["Triassic","Jurassic","Cretaceous"].map(per=>`<h3>${per}</h3>`+D.map((d,i)=>[d,i]).filter(([d])=>d.per===per).map(([d,i])=>save.dug[d.id]?`<span class="lv" data-x="${i}">🦴 ${d.n}<br><small>${d.diet}</small></span>`:`<span class="lv" style="opacity:.5">🔒 Dig site ${i+1}</span>`).join("")).join("")+`<br><br><button class="btn" id="bk">◀ Dig sites</button>`);
 $("bk").onclick=menu;document.querySelectorAll(".lv[data-x]").forEach(e=>e.onclick=()=>exhibit(+e.dataset.x))}
function exhibit(i){S.screen="exhibit";hud();S.ex=i;$("ov").style.display="none";const d=D[i];$("q").innerHTML="";$("opts").innerHTML=`<button class="btn" id="bk2">◀ Museum</button>`;$("bk2").onclick=museum;S.exP=plan(d)}
function pause(on){if(S.screen!=="play"||S.phase==="done")return;S.paused=on===undefined?!S.paused:on;if(S.paused){showOv(`<h2>⏸ Paused</h2><button class="btn" id="rs">▶ Resume</button> <button class="btn" id="rt">↺ Restart</button> <button class="btn" id="lv2">Sites</button>`);$("rs").onclick=()=>pause(false);$("rt").onclick=restart;$("lv2").onclick=menu}else $("ov").style.display="none"}
function restart(){if(S.phase==="quiz")startQuiz(S.quiz.i);else startDig(S.li)}
// ---------- input
function ptr(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
function toGrid(x,y){const b=siteBox();return[(x-b.x)/b.w*GC,(y-b.y)/b.h*GR]}
let down=false;
cv.addEventListener("pointerdown",e=>{if(S.paused||S.screen!=="play")return;const[x,y]=ptr(e);down=true;
 if(S.phase==="dig"){const[gx,gy]=toGrid(x,y);S.cur=[gx,gy];dig(gx,gy,S.tool)}
 else if(S.phase==="build"){const g=asmGeom();let best=null,bd=1e9;S.pieces.forEach(pc=>{if(pc.placed)return;const d=Math.max(Math.abs(x-pc.tx)/(pc.p.hw*g.s+14),Math.abs(y-pc.ty)/(pc.p.hh*g.s+14));if(d<1&&d<bd){bd=d;best=pc}});if(best){S.drag={pc:best,ox:x-best.tx,oy:y-best.ty};S.sel=S.pieces.indexOf(best);snd(440,.04)}}});
cv.addEventListener("pointermove",e=>{if(S.paused||!down)return;const[x,y]=ptr(e);if(S.phase==="dig"&&S.tool==="brush"){const[gx,gy]=toGrid(x,y);S.cur=[gx,gy];dig(gx,gy,"brush")}if(S.drag){S.drag.pc.tx=x-S.drag.ox;S.drag.pc.ty=y-S.drag.oy}});
function up(){down=false;if(S.drag){const pc=S.drag.pc;S.drag=null;drop(pc)}}
addEventListener("pointerup",up);addEventListener("pointercancel",up);
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(k==="p"){pause();return}if(k==="m"){$("mu").click();return}if(k==="r"&&S.screen==="play"){restart();return}if(k==="escape"){if(S.paused)pause(false);else if(S.screen==="play")pause(true);else menu();return}
 if(S.screen!=="play"||S.paused)return;
 if(S.phase==="dig"){if(k==="b"){S.tool="brush";renderUI()}if(k==="c"){S.tool="chisel";renderUI()}const mv={arrowleft:[-1,0],arrowright:[1,0],arrowup:[0,-1],arrowdown:[0,1]}[k];if(mv){S.cur=[Math.max(0,Math.min(GC,S.cur[0]+mv[0]*1.5)),Math.max(0,Math.min(GR,S.cur[1]+mv[1]*1.5))];if(S.tool==="brush"&&e.shiftKey)dig(S.cur[0],S.cur[1],"brush");e.preventDefault()}if(k===" "){dig(S.cur[0],S.cur[1],S.tool);e.preventDefault()}}
 if(S.phase==="build"){const left=S.pieces.filter(p=>!p.placed);if(!left.length)return;if(k==="tab"||k==="n"){S.sel=(S.sel+1)%S.pieces.length;while(S.pieces[S.sel].placed)S.sel=(S.sel+1)%S.pieces.length;e.preventDefault()}let pc=S.pieces[S.sel];if(pc.placed){S.sel=S.pieces.indexOf(left[0]);pc=left[0]}const mv={arrowleft:[-8,0],arrowright:[8,0],arrowup:[0,-8],arrowdown:[0,8]}[k];if(mv){pc.tx+=mv[0];pc.ty+=mv[1];e.preventDefault()}if(k==="enter"||k===" "){drop(pc);e.preventDefault()}}
 if(S.phase==="quiz"&&k>="1"&&k<="4"){const b=$("opts").children[+k-1];if(b&&!b.disabled)b.click()}});
$("pB").onclick=()=>pause();$("mB").onclick=menu;$("muB").onclick=museum;$("mu").onclick=()=>{save.mute=!save.mute;store();muteUI()};
// ---------- draw
function resize(){dpr=window.devicePixelRatio||1;W=innerWidth;H=innerHeight-40;cv.width=W*dpr|0;cv.height=H*dpr|0;cv.style.width=W+"px";cv.style.height=H+"px";cx.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);
const _dp=drawPiece;drawPiece=function(p,X,Y,s,r,col,al){if(CX){const real=cx;cx=CX;try{_dp(p,X,Y,s,r,col,al)}finally{cx=real}}else _dp(p,X,Y,s,r,col,al)};
function dirtCol(d,x,y){const n=((x*73856093)^(y*19349663))&255;if(d>2)return`rgb(${110+n%20},${105+n%18},${100+n%15})`;const t=Math.min(1,d/2);return`rgb(${Math.round(150+n%14-t*55)},${Math.round(104+n%10-t*45)},${Math.round(60-t*25)})`}
function draw(){cx.clearRect(0,0,W,H);const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#4a3220");g.addColorStop(1,"#22160c");cx.fillStyle=g;cx.fillRect(0,0,W,H);
 if(S.screen==="play"&&(S.phase==="dig"||S.phase==="assemble")){const b=siteBox(),cw=b.w/GC,ch=b.h/GR;cx.fillStyle="#c9a36a";cx.fillRect(b.x,b.y,b.w,b.h);
  S.pieces.forEach(pc=>drawPiece(pc.p,b.x+pc.sx*b.w,b.y+pc.sy*b.h,siteScale()*b.w,pc.sr,D[S.li].col));
  for(let i=0;i<GC*GR;i++)if(S.crack[i]){const x=i%GC,y=(i/GC)|0;cx.strokeStyle="#5a2a10";cx.lineWidth=1.5;cx.beginPath();cx.moveTo(b.x+x*cw,b.y+y*ch);cx.lineTo(b.x+(x+.6)*cw,b.y+(y+.5)*ch);cx.lineTo(b.x+(x+1)*cw,b.y+(y+1)*ch);cx.stroke()}
  for(let y=0;y<GR;y++)for(let x=0;x<GC;x++){const d=S.grid[y*GC+x];if(d<=0)continue;cx.globalAlpha=d>2?1:Math.min(1,.35+d*.5);cx.fillStyle=dirtCol(d,x,y);cx.fillRect(b.x+x*cw-.3,b.y+y*ch-.3,cw+.6,ch+.6)}cx.globalAlpha=1;
  if(S.scan>0){cx.globalAlpha=Math.min(.55,S.scan*.5);S.pieces.forEach(pc=>drawPiece(pc.p,b.x+pc.sx*b.w,b.y+pc.sy*b.h,siteScale()*b.w,pc.sr,"#7ff"));cx.globalAlpha=1}
  cx.strokeStyle="#ffc857";cx.lineWidth=2;cx.strokeRect(b.x,b.y,b.w,b.h);
  const[ux,uy]=[b.x+S.cur[0]*cw,b.y+S.cur[1]*ch];cx.strokeStyle="#fff8";cx.lineWidth=1.5;cx.beginPath();cx.arc(ux,uy,(S.tool==="brush"?1.6:1.9)*cw,0,7);cx.stroke();
  const pr=exposed();cx.fillStyle="#0008";cx.fillRect(W-130,H-52,120,10);cx.fillStyle="#7ad36a";cx.fillRect(W-130,H-52,120*Math.min(1,pr/.92),10)}
 else if(S.screen==="play"&&(S.phase==="build"||S.phase==="done")&&S.pieces.length){const a=asmGeom();cx.fillStyle="#0003";cx.fillRect(a.x-4,a.y-6,a.s+8,a.s*.6+12);cx.fillStyle="#6b4423";cx.fillRect(a.x,a.y+a.s*.585,a.s,5);
  S.pieces.forEach(pc=>{const[tx,ty]=targetOf(pc);drawPiece(pc.p,tx,ty,a.s,0,"#fff",.13)});
  S.pieces.filter(p=>p.placed).forEach(pc=>drawPiece(pc.p,pc.tx,pc.ty,a.s,0,D[S.li].col));
  cx.fillStyle="#0003";cx.fillRect(a.tx-30,a.y-6,W-a.tx+20,a.s*.6+12);cx.fillStyle="#ffc85799";cx.font="12px system-ui";cx.textAlign="left";cx.fillText("Bone tray",a.tx-24,a.y+8);
  S.pieces.forEach((pc,i)=>{if(!pc.placed){if(i===S.sel){cx.strokeStyle="#ffc85766";cx.lineWidth=1;cx.strokeRect(pc.tx-pc.p.hw*a.s-4,pc.ty-pc.p.hh*a.s-4,pc.p.hw*a.s*2+8,pc.p.hh*a.s*2+8)}drawPiece(pc.p,pc.tx,pc.ty,a.s,0,D[S.li].col)}})}
 else if(S.screen==="play"&&S.phase==="quiz"){cx.font="70px system-ui";cx.textAlign="center";cx.textBaseline="middle";cx.globalAlpha=.25;cx.fillText("🦕",W*.2,H*.5);cx.fillText("🦖",W*.8,H*.5);cx.globalAlpha=1}
 else if(S.screen==="exhibit"){const d=D[S.ex],s=Math.min(W*.5,(H-70)/.62),x0=12,y0=(H-s*.6)/2;cx.fillStyle="#0004";cx.fillRect(x0-4,y0-6,s+8,s*.6+12);cx.fillStyle="#6b4423";cx.fillRect(x0,y0+s*.585,s,6);S.exP.forEach(p=>drawPiece(p,x0+p.cx*s,y0+p.cy*s,s,0,d.col));
  const tx=x0+s+18,mw=W-tx-10;cx.textAlign="left";cx.textBaseline="top";cx.fillStyle="#ffc857";cx.font="bold 18px system-ui";cx.fillText(d.n,tx,16);cx.font="13px system-ui";cx.fillStyle="#fff3e0";let y=42;[d.kind,"🕰 "+d.when,"🍽 "+d.diet,"📏 "+d.size,"🌍 "+d.where,"💡 "+d.fact].forEach(t=>{y=wrap(t,tx,y,mw)+4})}
 if(S.msg&&S.screen==="play"){cx.font="13px system-ui";cx.textAlign="left";cx.textBaseline="top";cx.fillStyle=S.msg[0]==="✔"?"#b6f5a8":"#ffd0b0";const m=S.phase==="quiz"?Math.min(W-40,600):Math.min(W*.35,300);const lines=Math.ceil(cx.measureText(S.msg).width/m)+1;wrap(S.msg,S.phase==="quiz"?(W-m)/2:12,H-58-lines*16,m)}}
function wrap(t,x,y,mw){const w=t.split(" ");let line="";for(const s of w){if(line&&cx.measureText(line+s).width>mw){cx.fillText(line,x,y);y+=16;line=""}line+=s+" "}cx.fillText(line,x,y);return y+16}
let last=performance.now();
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(S.screen==="play"&&!S.paused&&S.phase!=="done"){S.time+=dt;if(Math.floor(S.time*2)!==Math.floor((S.time-dt)*2))hud()}S.scan=Math.max(0,S.scan-dt);draw();requestAnimationFrame(frame)}
resize();muteUI();menu();requestAnimationFrame(frame);
</script></body></html>
