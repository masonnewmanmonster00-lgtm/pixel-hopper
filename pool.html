<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b0b14"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg"><title>8-Ball Pool</title>
<style>html,body{margin:0;height:100%;background:#1a0f08;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%}
#ui{position:fixed;top:8px;left:108px;right:8px;display:flex;justify-content:space-between;align-items:center;padding:0 8px;color:#fff;font-weight:700;text-shadow:0 2px 3px #000;pointer-events:none;font-size:15px;z-index:5}
.b{pointer-events:auto;background:#fff2;border:1px solid #fff5;color:#fff;border-radius:8px;padding:4px 10px;font-weight:700}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000b;color:#fff;text-align:center}
#ov h1{font-size:42px;margin:0 0 8px;color:#7fffb0}#ov button{font-size:20px;padding:10px 22px;border-radius:12px;border:0;background:#7fffb0;font-weight:800;margin:6px}
a.back{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:80;display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(8,8,16,.82);color:#ffe14d;border:1px solid rgba(255,225,77,.55);font:700 12px/1 ui-monospace,monospace;letter-spacing:.04em;text-decoration:none;touch-action:manipulation}a.back:focus-visible{outline:2px solid #ffe14d;outline-offset:2px}</style></head><body>
<a class="back" href="./index.html" aria-label="Back to menu" onpointerdown="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">← Menu</a>
<canvas id="c"></canvas><div id="ui"><span id="p1">You</span><span id="tn"></span><span id="p2">CPU</span><span>Wins <span id="bs">0</span> <button class="b" id="pb">II</button> <button class="b" id="rb">↻</button></span></div>
<div id="ov"><h1>🎱 8-Ball Pool</h1><div id="msg">Drag from the cue ball to aim, pull back for power, release to shoot.<br>PC: ←→ aim, ↑↓ power, Space shoot, P pause, R restart.<br>Sink your group, then the 8-ball.</div><div><button id="g1">vs CPU</button><button id="g2">2 Players</button></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,T;function rs(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);const tw=Math.min(W*.92,(H-50)*1.9);T={w:tw,h:tw/2,x:(W-tw)/2,y:36+(H-36-tw/2)/2,r:tw*.0135}}addEventListener('resize',rs);rs();
let AC;function snd(f,d,t='sine',v=.2){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
let wins=0;try{wins=+localStorage.getItem('arcade-pool-best')||0}catch(e){}bs.textContent=wins;
const COL=['#fff','#f2c400','#1d4fd6','#d42a2a','#6a2aa8','#f07a10','#1a8a3a','#8a1a1a','#111','#f2c400','#1d4fd6','#d42a2a','#6a2aa8','#f07a10','#1a8a3a','#8a1a1a'];
let B,turn,groups,cpu,moving,aim=0,power=.5,drag=null,st='menu',paused=false,shot,msgT='',msgTime=0,ballInHand=false;
// table coords normalized: 0..2 x 0..1, ball radius R
const R=.028;
function pockets(){return[[0,0],[1,-.01],[2,0],[0,1],[1,1.01],[2,1]]}
function start(two){cpu=!two;B=[{n:0,x:.5,y:.5,vx:0,vy:0,in:false}];const order=[1,9,2,10,8,3,11,4,12,5,13,6,14,7,15];let k=0;for(let col=0;col<5;col++)for(let r=0;r<=col;r++){B.push({n:order[k++],x:1.45+col*R*1.75,y:.5+(r-col/2)*R*2.02,vx:0,vy:0,in:false})}
turn=0;groups=[null,null];moving=false;aim=0;power=.5;st='play';ov.style.display='none';ballInHand=false;say('Break!');upd()}
function say(s){msgT=s;msgTime=2}
function upd(){p1.textContent=(cpu?'You':'P1')+(groups[0]?' ('+groups[0]+')':'');p2.textContent=(cpu?'CPU':'P2')+(groups[1]?' ('+groups[1]+')':'');p1.style.color=turn==0?'#7fffb0':'#fff';p2.style.color=turn==1?'#7fffb0':'#fff';tn.textContent=(turn==0?(cpu?'Your':'P1'):(cpu?'CPU':'P2'))+' turn'}
function grp(n){return n<8?'solids':n>8?'stripes':'eight'}
function remaining(p){const g=groups[p];if(!g)return 7;return B.filter(b=>!b.in&&b.n&&grp(b.n)==g).length}
function cue(){return B[0]}
function shoot(){if(moving||st!='play'||paused)return;const s=power*2.6;cue().vx=Math.cos(aim)*s;cue().vy=Math.sin(aim)*s;moving=true;shot={pot:[],first:null,scratch:false};snd(200+power*300,.08,'square',.2)}
function physics(dt){let any=false;const sub=8;for(let s=0;s<sub;s++){const h=dt/sub;for(const b of B){if(b.in)continue;b.x+=b.vx*h;b.y+=b.vy*h;const sp=Math.hypot(b.vx,b.vy);if(sp>0){const f=Math.max(0,sp-.55*h)/sp;b.vx*=f;b.vy*=f}
for(const [px,py] of pockets()){if(Math.hypot(b.x-px,b.y-py)<R*1.9){b.in=true;b.vx=b.vy=0;if(b.n==0)shot.scratch=true;else shot.pot.push(b.n);snd(140,.25,'sine',.3)}}
if(b.in)continue;if(b.x<R){b.x=R;b.vx=-b.vx*.85;}if(b.x>2-R){b.x=2-R;b.vx=-b.vx*.85}if(b.y<R){b.y=R;b.vy=-b.vy*.85}if(b.y>1-R){b.y=1-R;b.vy=-b.vy*.85}}
for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){const a=B[i],b=B[j];if(a.in||b.in)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<2*R&&d>0){const nx=dx/d,ny=dy/d,ov=2*R-d;a.x-=nx*ov/2;a.y-=ny*ov/2;b.x+=nx*ov/2;b.y+=ny*ov/2;const rv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(rv>0){a.vx-=rv*nx*.97;a.vy-=rv*ny*.97;b.vx+=rv*nx*.97;b.vy+=rv*ny*.97;if(i==0&&shot&&shot.first==null)shot.first=b.n;snd(900,.04,'triangle',Math.min(.3,rv*.3))}}}}
for(const b of B)if(!b.in&&Math.hypot(b.vx,b.vy)>.004)any=true;else{b.vx=b.vy=0}return any}
function endShot(){moving=false;const me=turn,op=1-turn;let foul=shot.scratch||shot.first==null;
if(!groups[me]&&shot.first!=null&&shot.first!=8){}
const pots=shot.pot.filter(n=>n!=8);if(!groups[0]&&pots.length&&!foul){const g=grp(pots[0]);groups[me]=g;groups[op]=g=='solids'?'stripes':'solids';say((me==0?(cpu?'You':'P1'):(cpu?'CPU':'P2'))+' are '+g)}
if(groups[me]&&shot.first!=null&&grp(shot.first)!=groups[me]&&!(grp(shot.first)=='eight'&&remaining(me)==0))foul=true;
if(shot.pot.includes(8)){const won=!foul&&groups[me]&&remaining(me)==0;over(won?me:op);return}
if(shot.scratch){const c0=cue();c0.in=false;c0.x=.5;c0.y=.5;let ok=false;while(!ok){ok=true;for(const b of B)if(b!=c0&&!b.in&&Math.hypot(b.x-c0.x,b.y-c0.y)<2.2*R){c0.x+=.05;ok=false}}}
const mine=pots.some(n=>groups[me]?grp(n)==groups[me]:true);if(foul){say('Foul!');turn=op}else if(!mine)turn=op;upd();if(cpu&&turn==1)setTimeout(cpuShot,700)}
function over(w){st='over';const human=!cpu||w==0;if(cpu&&w==0){wins++;try{localStorage.setItem('arcade-pool-best',String(wins))}catch(e){}bs.textContent=wins}ov.style.display='flex';msg.innerHTML=cpu?(w==0?'🏆 You win!':'CPU wins. Try again!'):'Player '+(w+1)+' wins!';snd(w==0?660:220,.5,'triangle')}
function clear(ax,ay,bx,by,skip){for(const b of B){if(b.in||skip.includes(b))continue;const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;let t=((b.x-ax)*dx+(b.y-ay)*dy)/L;t=Math.max(0,Math.min(1,t));if(Math.hypot(ax+dx*t-b.x,ay+dy*t-b.y)<2*R)return false}return true}
function cpuShot(){if(st!='play'||turn!=1||paused){if(st=='play'&&turn==1)setTimeout(cpuShot,500);return}const c0=cue();let best=null;
const targets=B.filter(b=>!b.in&&b.n&&(groups[1]?(remaining(1)==0?b.n==8:grp(b.n)==groups[1]):b.n!=8));
for(const t of targets)for(const [px,py] of pockets()){const dx=px-t.x,dy=py-t.y,d=Math.hypot(dx,dy);const gx=t.x-dx/d*2*R,gy=t.y-dy/d*2*R;const cx=gx-c0.x,cy=gy-c0.y,cd=Math.hypot(cx,cy);const cut=(cx*dx+cy*dy)/(cd*d);if(cut<.3)continue;
if(!clear(c0.x,c0.y,gx,gy,[c0,t])||!clear(t.x,t.y,px,py,[t]))continue;const sc=cut*2-d-cd*.5;if(!best||sc>best.s)best={s:sc,a:Math.atan2(cy,cx),p:Math.min(1,.35+(d+cd)*.35)}}
if(!best){const t=targets[0]||B.find(b=>!b.in&&b.n);best={a:Math.atan2(t.y-c0.y,t.x-c0.x),p:.6}}
aim=best.a+(Math.random()-.5)*.03;power=best.p;setTimeout(shoot,500)}
function toS(px,py){return[T.x+px/2*T.w,T.y+py*T.h]}
function fromS(sx,sy){return[(sx-T.x)/T.w*2,(sy-T.y)/T.h]}
let last=0;function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(st=='play'&&!paused&&moving){if(!physics(dt))endShot()}if(msgTime>0)msgTime-=dt;draw();requestAnimationFrame(loop)}
function draw(){x.fillStyle='#1a0f08';x.fillRect(0,0,W,H);if(!B)return;const sc=T.w/2;const rail=T.h*.07;
x.fillStyle='#5a3416';x.beginPath();x.roundRect(T.x-rail,T.y-rail,T.w+rail*2,T.h+rail*2,rail*.6);x.fill();
const g=x.createRadialGradient(T.x+T.w/2,T.y+T.h/2,10,T.x+T.w/2,T.y+T.h/2,T.w*.6);g.addColorStop(0,'#1f9a55');g.addColorStop(1,'#0c5a30');x.fillStyle=g;x.fillRect(T.x,T.y,T.w,T.h);
x.fillStyle='#e9d6a0';for(let i=1;i<8;i++){if(i==4)continue;x.beginPath();x.arc(T.x+T.w*i/8,T.y-rail/2,2,0,7);x.arc(T.x+T.w*i/8,T.y+T.h+rail/2,2,0,7);x.fill()}
x.fillStyle='#000';for(const [px,py] of pockets()){const[a,b]=toS(px,py);x.beginPath();x.arc(a,b,R*1.8*sc,0,7);x.fill()}
const r=R*sc;for(const b of B){if(b.in)continue;const[a,bb]=toS(b.x,b.y);x.fillStyle='#0004';x.beginPath();x.arc(a+2,bb+3,r,0,7);x.fill();
if(b.n>8){x.fillStyle='#f4f4f4';x.beginPath();x.arc(a,bb,r,0,7);x.fill();x.save();x.beginPath();x.arc(a,bb,r,0,7);x.clip();x.fillStyle=COL[b.n];x.fillRect(a-r,bb-r*.55,r*2,r*1.1);x.restore()}else{x.fillStyle=COL[b.n];x.beginPath();x.arc(a,bb,r,0,7);x.fill()}
if(b.n){x.fillStyle='#fff';x.beginPath();x.arc(a,bb,r*.45,0,7);x.fill();x.fillStyle='#000';x.font='bold '+(r*.6)+'px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(b.n,a,bb+.5)}
x.fillStyle='#fff6';x.beginPath();x.arc(a-r*.35,bb-r*.35,r*.3,0,7);x.fill()}
if(st=='play'&&!moving&&!(cpu&&turn==1)){const c0=cue();const[a,b]=toS(c0.x,c0.y);
// guide line
let gx=c0.x,gy=c0.y,dx=Math.cos(aim),dy=Math.sin(aim),hitB=null,tt=3;for(const o of B){if(o.in||o==c0)continue;const ox=o.x-gx,oy=o.y-gy,p=ox*dx+oy*dy;if(p<0)continue;const q=ox*ox+oy*oy-p*p;if(q<4*R*R){const t=p-Math.sqrt(4*R*R-q);if(t<tt){tt=t;hitB=o}}}
const wt=Math.min(dx>0?(2-R-gx)/dx:dx<0?(R-gx)/dx:9,dy>0?(1-R-gy)/dy:dy<0?(R-gy)/dy:9);if(!hitB)tt=wt;
const[ex,ey]=toS(gx+dx*tt,gy+dy*tt);x.setLineDash([6,6]);x.strokeStyle='#fffa';x.lineWidth=2;x.beginPath();x.moveTo(a,b);x.lineTo(ex,ey);x.stroke();x.setLineDash([]);x.beginPath();x.arc(ex,ey,r,0,7);x.stroke();
if(hitB){const nx=hitB.x-(gx+dx*tt),ny=hitB.y-(gy+dy*tt),nl=Math.hypot(nx,ny);const[hx,hy]=toS(hitB.x,hitB.y);x.beginPath();x.moveTo(hx,hy);x.lineTo(hx+nx/nl*sc*.25,hy+ny/nl*sc*.25);x.stroke()}
// cue stick
const back=r*1.5+power*sc*.25;x.save();x.translate(a,b);x.rotate(aim);const sg=x.createLinearGradient(-back-sc*.9,0,-back,0);sg.addColorStop(0,'#3b200c');sg.addColorStop(.8,'#c9944f');sg.addColorStop(1,'#eee');x.strokeStyle=sg;x.lineWidth=r*.55;x.lineCap='round';x.beginPath();x.moveTo(-back,0);x.lineTo(-back-sc*.9,0);x.stroke();x.restore();
// power bar
x.fillStyle='#0008';x.fillRect(W-24,T.y,12,T.h);x.fillStyle=`hsl(${120-power*120},90%,50%)`;x.fillRect(W-24,T.y+T.h*(1-power),12,T.h*power)}
if(msgTime>0){x.globalAlpha=Math.min(1,msgTime);x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=4;x.font='bold 28px system-ui';x.textAlign='center';x.strokeText(msgT,W/2,T.y+T.h/2);x.fillText(msgT,W/2,T.y+T.h/2);x.globalAlpha=1}
if(paused){x.fillStyle='#0008';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='bold 40px system-ui';x.textAlign='center';x.fillText('Paused',W/2,H/2)}}
function canAct(){return st=='play'&&!moving&&!paused&&!(cpu&&turn==1)}
c.addEventListener('pointerdown',e=>{if(!canAct())return;drag={x:e.clientX,y:e.clientY}});
addEventListener('pointermove',e=>{if(!drag)return;const[a,b]=toS(cue().x,cue().y);const dx=a-e.clientX,dy=b-e.clientY;if(Math.hypot(dx,dy)>10)aim=Math.atan2(dy,dx);power=Math.min(1,Math.max(.05,Math.hypot(e.clientX-a,e.clientY-b)/(T.w*.35)))});
addEventListener('pointerup',()=>{if(drag){const moved=true;drag=null;shoot()}});
addEventListener('keydown',e=>{const k=e.key;if(canAct()){if(k=='ArrowLeft')aim-=e.shiftKey?.05:.012;if(k=='ArrowRight')aim+=e.shiftKey?.05:.012;if(k=='ArrowUp')power=Math.min(1,power+.04);if(k=='ArrowDown')power=Math.max(.05,power-.04);if(k==' '){e.preventDefault();shoot()}}if((k=='p'||k=='P')&&!e.repeat)paused=!paused;if((k=='r'||k=='R')&&!e.repeat)start(!cpu)});
pb.onclick=()=>{if(st=='play')paused=!paused};rb.onclick=()=>start(!cpu);g1.onclick=()=>start(false);g2.onclick=()=>start(true);requestAnimationFrame(loop);
</script></body></html>
